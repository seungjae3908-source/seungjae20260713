openapi: 3.1.0
info:
  title: Seungjae AI Command Hub
  version: 0.1.0
  description: |
    승재 주식 앱 서버의 상태, Git 상태, PM2 상태와 로그를 읽기 전용으로 조회합니다.
    이 버전은 파일 수정, 명령 실행, 재시작, 배포를 지원하지 않습니다.
servers:
  - url: https://YOUR_SERVER_DOMAIN
    description: 실제 HTTPS 서버 주소로 변경하세요.
security:
  - bearerAuth: []
paths:
  /api/command-hub/health:
    get:
      operationId: getCommandHubHealth
      summary: Command Hub 연결 상태 확인
      description: 인증과 읽기 전용 모드가 정상인지 확인합니다.
      responses:
        '200':
          description: 연결 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: 인증 실패
        '503':
          description: 서버에 COMMAND_HUB_TOKEN이 설정되지 않음
  /api/command-hub/server/status:
    get:
      operationId: getServerStatus
      summary: 서버와 PM2 상태 조회
      description: 운영체제, 메모리, CPU, 디스크와 PM2 상태를 조회합니다.
      responses:
        '200':
          description: 서버 상태
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/command-hub/pm2/status:
    get:
      operationId: getPm2Status
      summary: PM2 프로세스 상태 조회
      description: PM2 프로세스 이름, 상태, 재시작 횟수, CPU와 메모리를 조회합니다.
      responses:
        '200':
          description: PM2 상태
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/command-hub/pm2/logs:
    get:
      operationId: getPm2Logs
      summary: 최근 PM2 로그 조회
      description: 지정된 stock-app PM2 프로세스의 최근 로그를 읽습니다. 민감정보 패턴은 제거됩니다.
      parameters:
        - name: lines
          in: query
          required: false
          description: 가져올 로그 줄 수. 최소 20, 최대 500.
          schema:
            type: integer
            minimum: 20
            maximum: 500
            default: 120
      responses:
        '200':
          description: 최근 PM2 로그
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/command-hub/git/status:
    get:
      operationId: getGitStatus
      summary: Git 작업 상태 조회
      description: 현재 브랜치, HEAD 커밋, 변경 파일과 최근 커밋을 조회합니다.
      responses:
        '200':
          description: Git 상태
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/command-hub/snapshot:
    get:
      operationId: getCommandHubSnapshot
      summary: 서버 진단 자료 일괄 조회
      description: 서버, 디스크, Git, PM2와 최근 로그를 한 번에 조회합니다. 오류 분석을 시작할 때 우선 호출합니다.
      parameters:
        - name: lines
          in: query
          required: false
          description: 포함할 PM2 로그 줄 수. 최소 20, 최대 500.
          schema:
            type: integer
            minimum: 20
            maximum: 500
            default: 120
      responses:
        '200':
          description: 전체 읽기 전용 진단 스냅샷
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
