name: Research Bitget Funding History Depth V4.10 Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-bitget-funding-history-depth-v410.py
      - .github/workflows/research-bitget-funding-history-depth-v410.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-bitget-funding-history-depth-v410-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      V48_RUN_ID: "37457612026"
      V48_ARTIFACT: "crypto-futures-v47-bitget-covered-subset-v48-3802dd30582848659eb14d4ea284b67b8ad50f9e"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/probe-bitget-funding-history-depth-v410.py
      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3"
      - name: Download frozen V4.8 covered events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V48_RUN_ID }}
          name: ${{ env.V48_ARTIFACT }}
          path: frozen-v48
      - name: Probe historical funding depth
        run: |
          EVENTS="$(find frozen-v48 -name bitget-covered-fullcost-events.parquet -print -quit)"
          test -n "$EVENTS"
          python market-prediction-lab/scripts/probe-bitget-funding-history-depth-v410.py \
            --covered-events "$EVENTS" \
            --symbols 30 \
            --out-dir market-prediction-lab/docs/bitget-funding-history-depth-v410
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-funding-history-depth-v410-${{ github.sha }}
          path: market-prediction-lab/docs/bitget-funding-history-depth-v410
          if-no-files-found: error
          retention-days: 14
