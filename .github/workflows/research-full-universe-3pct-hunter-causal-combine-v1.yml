name: Research Full-Universe 3pct Hunter Causal Combine V1

on:
  workflow_run:
    workflows: ["Research Full-Universe 3pct Hunter Causal Backtest V1"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  combine:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v1.py

      - name: Download causal artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: full-universe-3pct-hunter-causal-v1-*
          path: causal-artifacts

      - name: Combine four-market results
        run: |
          python market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v1.py \
            --input-root causal-artifacts \
            --output-dir market-prediction-lab/docs/full-universe-3pct-hunter-causal-combined-v1

      - name: Upload combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-causal-combined-v1-${{ github.event.workflow_run.head_sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-causal-combined-v1
          if-no-files-found: error
          retention-days: 14
