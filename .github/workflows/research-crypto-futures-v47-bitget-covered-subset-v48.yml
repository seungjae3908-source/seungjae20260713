name: Research Crypto Futures V4.7 Bitget Covered Subset V4.8

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/audit-crypto-futures-v47-bitget-covered-subset-v48.py
      - .github/workflows/research-crypto-futures-v47-bitget-covered-subset-v48.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-v47-bitget-covered-subset-v48-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      V46_RUN_ID: "37455166769"
      V46_ARTIFACT: "crypto-futures-v45-fullcost-funding-v46-fe530023426efb1f68f0f2349ad5fab34689ea9c"
      V47_RUN_ID: "37455634805"
      V47_ARTIFACT: "crypto-futures-v46-bitget-portability-v47-9450599e2f6a571522e632824ea06c43275e997d"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v47-bitget-covered-subset-v48.py
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v45-fullcost-funding-v46.py
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v44-robustness-capital-v45.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - name: Download frozen V4.6 full-cost evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V46_RUN_ID }}
          name: ${{ env.V46_ARTIFACT }}
          path: frozen-v46
      - name: Download frozen V4.7 Bitget probe evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V47_RUN_ID }}
          name: ${{ env.V47_ARTIFACT }}
          path: frozen-v47
      - name: Audit Bitget-covered subset without retuning
        run: |
          EVENTS="$(find frozen-v46 -name fullcost-events.parquet -print -quit)"
          V46_SUMMARY="$(find frozen-v46 -name summary.json -print -quit)"
          PROBES="$(find frozen-v47 -name probe-rows.csv -print -quit)"
          V47_SUMMARY="$(find frozen-v47 -name summary.json -print -quit)"
          test -n "$EVENTS"
          test -n "$V46_SUMMARY"
          test -n "$PROBES"
          test -n "$V47_SUMMARY"
          python market-prediction-lab/scripts/audit-crypto-futures-v47-bitget-covered-subset-v48.py \
            --fullcost-events "$EVENTS" \
            --probe-rows "$PROBES" \
            --v46-summary "$V46_SUMMARY" \
            --v47-summary "$V47_SUMMARY" \
            --out-dir market-prediction-lab/docs/crypto-futures-v47-bitget-covered-subset-v48
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-v47-bitget-covered-subset-v48-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-v47-bitget-covered-subset-v48
          if-no-files-found: error
          retention-days: 14
