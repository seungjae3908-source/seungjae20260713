name: Application CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - .github/workflows/futures-public-network-smoke.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - api-server/**
      - stock-analyzer/**
      - packages/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, unit, smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Publish pending Application CI status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Application CI run ${context.runId}: running`,
              context: 'application-ci/verified',
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir stock-analyzer run typecheck

      - name: Typecheck backend
        run: pnpm --dir api-server run typecheck

      - name: Run Phase 2 futures tests
        run: pnpm --dir api-server run test:phase2

      - name: Run Phase 3 trading risk tests
        run: pnpm --dir api-server run test:risk

      - name: Run Phase 4 contract rules and risk regression tests
        run: pnpm --dir api-server run test:phase4

      - name: Run Phase 5 backtest tests
        run: pnpm --dir api-server run test:phase5

      - name: Run Phase 6 paper trading tests
        run: pnpm --dir api-server run test:phase6

      - name: Run Phase 7 journal sync and analytics tests
        run: pnpm --dir api-server run test:phase7

      - name: Run API smoke tests
        run: pnpm --dir api-server run test:smoke

      - name: Build frontend production bundle
        run: pnpm --dir stock-analyzer run build

      - name: Build backend production bundle
        run: pnpm --dir api-server run build:server

  browser-ui:
    name: Playwright desktop and mobile application UI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Publish pending browser UI status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Browser UI run ${context.runId}: running`,
              context: 'browser-ui/verified',
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium

      - name: Run Playwright desktop and mobile tests
        id: browser
        run: pnpm --dir stock-analyzer run test:e2e

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-playwright-${{ github.run_id }}
          path: |
            stock-analyzer/test-results
            stock-analyzer/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Publish browser UI result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ steps.browser.outcome }}' || 'failure';
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Browser UI run ${context.runId}: ${result}`,
              context: 'browser-ui/verified',
            });

  publish-validation:
    name: Publish Application CI conclusion
    needs:
      - validate
      - browser-ui
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified Application CI result
        uses: actions/github-script@v7
        with:
          script: |
            const validate = '${{ needs.validate.result }}';
            const browser = '${{ needs.browser-ui.result }}';
            const result = validate === 'success' && browser === 'success'
              ? 'success'
              : validate === 'cancelled' || browser === 'cancelled'
                ? 'cancelled'
                : 'failure';
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Application CI run ${context.runId}: ${result}`,
              context: 'application-ci/verified',
            });

  network-smoke:
    name: Bitget public API smoke (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run real Bitget public network smoke
        id: network
        continue-on-error: true
        run: pnpm --dir api-server run smoke:futures:network

      - name: Publish network smoke result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ steps.network.outcome }}';
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Bitget network smoke run ${context.runId}: ${result}`,
              context: 'futures-public-network-smoke/verified',
            });
