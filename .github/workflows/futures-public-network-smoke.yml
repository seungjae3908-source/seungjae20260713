name: Application CI

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Pull request head SHA that receives the verified commit statuses.
        required: false
        type: string
      checkout_ref:
        description: Deprecated compatibility input; workflow_dispatch always validates target_sha or the exact dispatch SHA.
        required: false
        type: string
      pr_number:
        description: Optional pull request number for Ready Gate validation.
        required: false
        type: string
      base_ref:
        description: Optional pull request base ref for current-base validation.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/futures-public-network-smoke.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - api-server/**
      - stock-analyzer/**
      - packages/**

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

env:
  APPLICATION_STATUS_SHA: ${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  APPLICATION_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target_sha || github.sha) || github.event.pull_request.head.sha || github.sha }}
  APPLICATION_PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number || '' }}
  APPLICATION_BASE_REF: ${{ github.event.inputs.base_ref || github.event.pull_request.base.ref || '' }}

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.event.inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: Verify immutable checkout identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Verify expected SHA and detached HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ env.APPLICATION_STATUS_SHA }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=PR exact-head verification failed::[INVALID_SHA] expected an exact 40-character commit SHA"
            exit 1
          fi
          if [ -n "$actual_branch" ]; then
            echo "::error title=PR exact-head verification failed::[UNEXPECTED_BRANCH] checkout must be detached, found $actual_branch"
            exit 1
          fi
          if [ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "::error title=PR exact-head verification failed::[HEAD_SHA_MISMATCH] tested ${EXPECTED_SHA,,}, checked out ${actual_sha,,}"
            exit 1
          fi
          echo "tested_sha=${EXPECTED_SHA,,}"
          echo "head_sha=${actual_sha,,}"
          echo "checkout_mode=DETACHED"

  ready-gate:
    name: Ready preflight and current-base virtual merge gate
    needs: exact-head
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require exact-head verification
        shell: bash
        env:
          EXACT_HEAD_RESULT: ${{ needs.exact-head.result }}
        run: |
          set -euo pipefail
          [[ "$EXACT_HEAD_RESULT" == "success" ]] || { echo "[EXACT_HEAD_GATE_FAILED] $EXACT_HEAD_RESULT" >&2; exit 1; }

      - name: Publish pending Application CI status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state: 'pending', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `Application CI run ${context.runId}: ready preflight`, context: 'application-ci/verified' });

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Current-base virtual merge and product-integrity gate
        if: env.APPLICATION_PR_NUMBER != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLICATION_BASE_REF" ]] || { echo '[READY_BASE_REF_MISSING]' >&2; exit 1; }
          git fetch --no-tags origin "$APPLICATION_BASE_REF"
          git cat-file -e "origin/$APPLICATION_BASE_REF^{commit}"
          node .github/scripts/pre-ci-v3.mjs \
            --base "origin/$APPLICATION_BASE_REF" \
            --head "$APPLICATION_CHECKOUT_REF" \
            --virtual-merge --ready-gate --gate-only

      - name: Verify exact PR identity, Fast CI, and unresolved review threads
        if: env.APPLICATION_PR_NUMBER != ''
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = Number(process.env.APPLICATION_PR_NUMBER || 0);
            const targetSha = String(process.env.APPLICATION_STATUS_SHA || '').toLowerCase();
            const baseRef = String(process.env.APPLICATION_BASE_REF || '');
            if (!Number.isInteger(prNumber) || prNumber <= 0) { core.setFailed('Valid PR number required.'); return; }
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber });
            if (String(pr.head.sha).toLowerCase() !== targetSha) { core.setFailed(`[READY_HEAD_MOVED] expected=${targetSha} actual=${pr.head.sha}`); return; }
            if (pr.base.ref !== baseRef) { core.setFailed(`[READY_BASE_REF_MOVED] expected=${baseRef} actual=${pr.base.ref}`); return; }

            let cursor = null;
            let unresolved = 0;
            do {
              const data = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!,$cursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100,after:$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}`, { owner: context.repo.owner, repo: context.repo.repo, number: prNumber, cursor });
              const threads = data.repository.pullRequest.reviewThreads;
              unresolved += threads.nodes.filter((thread) => !thread.isResolved).length;
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (cursor);
            if (unresolved !== 0) { core.setFailed(`[READY_REVIEW_THREADS_OPEN] ${unresolved}`); return; }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner: context.repo.owner, repo: context.repo.repo, head_sha: targetSha, event: 'pull_request', per_page: 100 });
            const fastRuns = runs.filter((run) => run.name === 'Application Fast CI' && String(run.head_sha).toLowerCase() === targetSha).sort((a, b) => b.id - a.id);
            const latestFast = fastRuns[0];
            if (!latestFast || latestFast.conclusion !== 'success') {
              core.setFailed(`[READY_FAST_CI_NOT_GREEN] latest=${latestFast ? `${latestFast.id}:${latestFast.conclusion}` : 'MISSING'}`);
              return;
            }
            core.info(`Ready Gate PASS for PR #${prNumber}, head ${targetSha}, Fast CI ${latestFast.id}.`);

      - name: Non-PR dispatch boundary
        if: env.APPLICATION_PR_NUMBER == ''
        run: echo 'No PR metadata supplied; exact-SHA canonical CI remains allowed for main/manual control paths.'

      - name: Publish Ready Gate failure
        if: failure() || cancelled()
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            const state = '${{ job.status }}' === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `Application CI run ${context.runId}: Ready Gate failed`, context: 'application-ci/verified' });

  application-build:
    name: Typecheck and build exact candidate once
    needs: ready-gate
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Run PR exact-head contract tests when present
        shell: bash
        run: |
          if [ -f .github/tests/pr-exact-head-contract.test.mjs ] && [ -f .github/tests/pr-exact-head-workflows.test.mjs ]; then
            node --test .github/tests/pr-exact-head-*.test.mjs
          else
            echo "::notice title=PR exact-head contract tests unavailable::The tested head predates the CI contract test files; immutable checkout verification still ran."
          fi
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck frontend
        run: pnpm --dir stock-analyzer run typecheck
      - name: Typecheck backend
        run: pnpm --dir stock-analyzer exec tsc -p ../api-server/tsconfig.json --noEmit
      - name: Build frontend production bundle once
        run: pnpm --dir stock-analyzer run build
      - name: Build backend production bundle once
        run: pnpm --dir api-server run build:server
      - name: Bind build artifact to exact SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          printf '%s\n' "${APPLICATION_STATUS_SHA,,}" > ci-artifacts/application-build-sha
          test -d stock-analyzer/dist
          test -d api-server/dist
      - name: Upload immutable exact-SHA application build
        uses: actions/upload-artifact@v4
        with:
          name: application-build-${{ env.APPLICATION_STATUS_SHA }}
          path: |
            ci-artifacts/application-build-sha
            stock-analyzer/dist
            api-server/dist
          if-no-files-found: error
          retention-days: 3

  application-tests:
    name: Application test lane — ${{ matrix.mode }}
    needs: ready-gate
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        mode: [phase2, risk, phase4, phase5, phase6, phase7, phase8, phase9, phase12, smoke]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run exact application test lane
        run: pnpm --dir api-server run test:${{ matrix.mode }}

  application-result:
    name: ${{ github.event_name == 'pull_request' && 'PR Exact Application CI' || 'Typecheck, unit, smoke, and build' }}
    needs: [ready-gate, application-build, application-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish verified Application CI result
        uses: actions/github-script@v8
        with:
          script: |
            const gate = '${{ needs.ready-gate.result }}';
            const build = '${{ needs.application-build.result }}';
            const tests = '${{ needs.application-tests.result }}';
            const result = gate === 'success' && build === 'success' && tests === 'success'
              ? 'success'
              : [gate, build, tests].includes('cancelled') ? 'cancelled' : 'failure';
            const sha = process.env.APPLICATION_STATUS_SHA;
            const statusContext = 'application-ci/verified';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latestStatus = statuses.filter((status) => status.context === statusContext).sort((left, right) => right.id - left.id)[0];
            if (latestStatus?.target_url !== runUrl) { core.notice(`A newer run owns ${statusContext} for ${sha}; skipping stale application status update.`); return; }
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: runUrl, description: `Application CI run ${context.runId}: ${result}`, context: statusContext });
  browser-ui:
    needs: ready-gate
    name: Playwright desktop and mobile application UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending browser UI status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state: 'pending', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `Browser UI run ${context.runId}: running`, context: 'browser-ui/verified' });
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.61.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --dir stock-analyzer exec playwright install chromium
      - name: Run Playwright desktop and mobile tests
        id: browser
        run: pnpm --dir stock-analyzer run test:e2e
      - name: Upload Playwright report and failure evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase9-playwright-${{ github.run_id }}
          path: |
            stock-analyzer/test-results
            stock-analyzer/playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Publish browser UI result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ steps.browser.outcome }}' || 'failure';
            const sha = process.env.APPLICATION_STATUS_SHA;
            const statusContext = 'browser-ui/verified';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latestStatus = statuses
              .filter((status) => status.context === statusContext)
              .sort((left, right) => right.id - left.id)[0];
            if (latestStatus?.target_url !== runUrl) {
              core.notice(`A newer run owns ${statusContext} for ${sha}; skipping stale browser status update.`);
              return;
            }
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: runUrl, description: `Browser UI run ${context.runId}: ${result}`, context: statusContext });

  database-rls:
    needs: ready-gate
    name: Disposable PostgreSQL migration and RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phase8
          POSTGRES_PASSWORD: phase8-ci-only
          POSTGRES_DB: phase8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase8 -d phase8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: phase8
      PGPASSWORD: phase8-ci-only
      PGDATABASE: phase8
    steps:
      - name: Publish pending database RLS status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state: 'pending', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `Database RLS run ${context.runId}: running`, context: 'database-rls/verified' });
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi

          # ubuntu-latest also contains optional third-party apt sources. A
          # transient outage there must not block the disposable RLS check.
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo apt-get update -qq \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
          else
            sudo apt-get update -qq -o Dir::Etc::sourceparts=-
          fi
          sudo apt-get install -y postgresql-client
      - name: Apply, test, rollback, and reapply migrations
        id: database
        run: bash api-server/scripts/verify-phase8-db.sh
      - name: Publish database RLS result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ steps.database.outcome }}' || 'failure';
            const sha = process.env.APPLICATION_STATUS_SHA;
            const statusContext = 'database-rls/verified';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latestStatus = statuses
              .filter((status) => status.context === statusContext)
              .sort((left, right) => right.id - left.id)[0];
            if (latestStatus?.target_url !== runUrl) {
              core.notice(`A newer run owns ${statusContext} for ${sha}; skipping stale database status update.`);
              return;
            }
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: runUrl, description: `Database RLS run ${context.runId}: ${result}`, context: statusContext });

  security-integration:
    needs: [ready-gate, application-build]
    if: always() && needs.ready-gate.result == 'success'
    name: Security input, bundle, and outbound safety verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Publish pending security status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state: 'pending', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `Security integration run ${context.runId}: running`, context: 'security-integration/verified' });
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Phase 8 security and load tests
        run: pnpm --dir api-server run test:phase8
      - name: Download immutable exact-SHA application build
        uses: actions/download-artifact@v4
        with:
          name: application-build-${{ env.APPLICATION_STATUS_SHA }}
          path: .
      - name: Verify immutable build artifact identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat ci-artifacts/application-build-sha)" == "${APPLICATION_STATUS_SHA,,}" ]] || { echo '[BUILD_SHA_MISMATCH]' >&2; exit 1; }
          test -d stock-analyzer/dist
      - name: Scan source and production bundle
        id: security
        working-directory: api-server
        run: node ./scripts/verify-phase8-security.mjs
      - name: Publish security result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ steps.security.outcome }}' || 'failure';
            const sha = process.env.APPLICATION_STATUS_SHA;
            const statusContext = 'security-integration/verified';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latestStatus = statuses
              .filter((status) => status.context === statusContext)
              .sort((left, right) => right.id - left.id)[0];
            if (latestStatus?.target_url !== runUrl) {
              core.notice(`A newer run owns ${statusContext} for ${sha}; skipping stale security status update.`);
              return;
            }
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: runUrl, description: `Security integration run ${context.runId}: ${result}`, context: statusContext });

  ai-privacy:
    needs: [ready-gate, application-build]
    if: always() && needs.ready-gate.result == 'success'
    name: AI privacy, prompt, output, and outbound verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Publish pending AI privacy status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state: 'pending', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `AI privacy run ${context.runId}: running`, context: 'ai-privacy/verified' });
      - name: Require reusable build producer
        if: needs.application-build.result != 'success'
        run: |
          echo '[APPLICATION_BUILD_UNAVAILABLE]' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run guarded mock provider and zero-outbound privacy tests
        run: pnpm --dir api-server run test:phase9
      - name: Download immutable exact-SHA application build
        uses: actions/download-artifact@v4
        with:
          name: application-build-${{ env.APPLICATION_STATUS_SHA }}
          path: .
      - name: Verify immutable build artifact identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat ci-artifacts/application-build-sha)" == "${APPLICATION_STATUS_SHA,,}" ]] || { echo '[BUILD_SHA_MISMATCH]' >&2; exit 1; }
          test -d stock-analyzer/dist
      - name: Verify AI privacy and zero outbound contract
        id: ai
        working-directory: api-server
        run: node ./scripts/verify-phase9-ai-privacy.mjs
      - name: Publish AI privacy result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ steps.ai.outcome }}' || 'failure';
            const sha = process.env.APPLICATION_STATUS_SHA;
            const statusContext = 'ai-privacy/verified';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latestStatus = statuses
              .filter((status) => status.context === statusContext)
              .sort((left, right) => right.id - left.id)[0];
            if (latestStatus?.target_url !== runUrl) {
              core.notice(`A newer run owns ${statusContext} for ${sha}; skipping stale AI privacy status update.`);
              return;
            }
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: runUrl, description: `AI privacy run ${context.runId}: ${result}`, context: statusContext });

  network-smoke:
    needs: ready-gate
    name: Bitget public API smoke (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending network smoke status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = process.env.APPLICATION_STATUS_SHA;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state: 'pending', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, description: `Bitget network smoke run ${context.runId}: running`, context: 'futures-public-network-smoke/verified' });
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_CHECKOUT_REF }}
          persist-credentials: false
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run real Bitget public network smoke
        id: network
        continue-on-error: true
        run: pnpm --dir api-server run smoke:futures:network
      - name: Publish network smoke result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ steps.network.outcome }}';
            const sha = process.env.APPLICATION_STATUS_SHA;
            const statusContext = 'futures-public-network-smoke/verified';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latestStatus = statuses
              .filter((status) => status.context === statusContext)
              .sort((left, right) => right.id - left.id)[0];
            if (latestStatus?.target_url !== runUrl) {
              core.notice(`A newer run owns ${statusContext} for ${sha}; skipping stale network status update.`);
              return;
            }
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha, state, target_url: runUrl, description: `Bitget network smoke run ${context.runId}: ${result}`, context: statusContext });
