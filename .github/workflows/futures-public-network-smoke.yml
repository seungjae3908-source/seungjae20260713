name: Futures public network smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/futures-market-data-phase2
    paths:
      - .github/workflows/futures-public-network-smoke.yml
      - api-server/network-smoke.mjs
      - api-server/src/routes/futures-market-data.network-smoke.ts
      - api-server/src/routes/futures-market-data.ts
      - api-server/src/services/futures-market-data.service.ts

permissions:
  contents: read
  statuses: write

jobs:
  network-smoke:
    name: Bitget public API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run real Bitget public network smoke
        run: pnpm --dir api-server run smoke:futures:network

  publish-conclusion:
    name: Publish network smoke conclusion
    needs: network-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified network run status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.network-smoke.result }}';
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Bitget network smoke run ${context.runId}: ${result}`,
              context: 'futures-public-network-smoke/verified',
            });
