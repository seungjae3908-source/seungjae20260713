name: Prediction Lab Hourly Shadow Validation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prediction-lab-shadow-hourly.yml

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: prediction-lab-branch-writer
  cancel-in-progress: false

env:
  SHADOW_BRANCH: feature/prediction-lab-standalone
  LAB_DIR: market-prediction-lab

jobs:
  shadow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout isolated Prediction Lab branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHADOW_BRANCH }}
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inspect current shadow decision
        id: inspect
        working-directory: ${{ env.LAB_DIR }}
        shell: bash
        run: |
          node <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const output = (name, value) => {
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          };

          const summary = JSON.parse(readFileSync("docs/shadow-summary.json", "utf8"));
          const groups = Object.entries(summary.groups ?? {});
          const failures = groups.filter(([, group]) => group?.status === "fail");

          if (summary.status === "fail" || failures.length > 0) {
            console.error("Existing technical shadow failure detected. No files will be changed.");
            for (const [name, group] of failures) {
              console.error(JSON.stringify({
                group: name,
                stage: group?.stage ?? group?.error?.stage ?? "shadow_cycle",
                error: group?.error ?? null,
              }, null, 2));
            }
            if (failures.length === 0) {
              console.error(JSON.stringify({
                stage: summary.stage ?? summary.error?.stage ?? "shadow_summary",
                error: summary.error ?? null,
              }, null, 2));
            }
            output("decision", "technical_failure");
            process.exit(0);
          }

          const ready = groups.filter(([, group]) =>
            group?.promotion?.status === "integration_review_ready"
          );

          if (ready.length > 0) {
            console.log("Integration review is ready. Shadow trigger will not be changed.");
            for (const [name, group] of ready) {
              console.log(JSON.stringify({
                group: name,
                modelId: group?.filter?.modelId ?? group?.modelSelection?.candidateModelId ?? null,
                referenceModelId: group?.filter?.referenceModelId ?? group?.modelSelection?.referenceModelId ?? null,
                total: group?.total ?? 0,
                settled: group?.settled ?? 0,
                pending: group?.pending ?? 0,
                firstAnchorTimestamp: group?.firstAnchorTimestamp ?? null,
                lastAnchorTimestamp: group?.lastAnchorTimestamp ?? null,
                candidate: group?.candidate ?? null,
                reference: group?.reference ?? null,
                comparison: group?.comparison ?? null,
                bySymbol: group?.bySymbol ?? {},
                byRegime: group?.byRegime ?? {},
              }, null, 2));
            }
            output("decision", "integration_review_ready");
            process.exit(0);
          }

          console.log("Shadow validation is still in progress.");
          for (const [name, group] of groups) {
            console.log(`${name}: ${group?.promotion?.status ?? "unknown"}, settled=${group?.settled ?? 0}, pending=${group?.pending ?? 0}`);
          }
          output("decision", "shadow_continue");
          NODE

      - name: Validate isolated shadow modules
        id: preflight
        if: steps.inspect.outputs.decision == 'shadow_continue'
        continue-on-error: true
        working-directory: ${{ env.LAB_DIR }}
        run: node --test tests/derivatives-history.test.js tests/derivatives-normalized-compat.test.js tests/temporal-training-dataset.test.js tests/shadow-ledger.test.js

      - name: Record preflight failure
        if: steps.inspect.outputs.decision == 'shadow_continue' && steps.preflight.outcome != 'success'
        working-directory: ${{ env.LAB_DIR }}
        shell: bash
        run: |
          node <<'NODE'
          import { writeFileSync } from "node:fs";
          const report = {
            schemaVersion: 2,
            status: "fail",
            generatedAt: Date.now(),
            stage: "preflight_tests",
            error: {
              name: "ShadowPreflightError",
              message: "isolated shadow module tests failed before trigger update",
            },
            safety: {
              usesPublicMarketDataOnly: true,
              usesAccountOrOrderApi: false,
              modifiesExistingAppApi: false,
              deploysModel: false,
            },
          };
          writeFileSync("docs/shadow-summary.json", `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Update independent shadow trigger
        if: steps.inspect.outputs.decision == 'shadow_continue' && steps.preflight.outcome == 'success'
        working-directory: ${{ env.LAB_DIR }}
        run: |
          node <<'NODE'
          import { writeFileSync } from "node:fs";
          const trigger = {
            schemaVersion: 1,
            requestedAt: Date.now(),
            reason: "hourly-shadow-validation",
            branchOnly: true,
            deploy: false,
          };
          writeFileSync("docs/shadow-trigger.json", `${JSON.stringify(trigger, null, 2)}\n`);
          console.log(JSON.stringify(trigger, null, 2));
          NODE

      - name: Run one independent live shadow cycle
        id: shadow
        if: steps.inspect.outputs.decision == 'shadow_continue' && steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.LAB_DIR }}
        run: node scripts/run-shadow-cycle.js docs/shadow-state.json docs/shadow-summary.json

      - name: Record cycle failure
        if: steps.inspect.outputs.decision == 'shadow_continue' && steps.preflight.outcome == 'success' && steps.shadow.outcome != 'success'
        working-directory: ${{ env.LAB_DIR }}
        shell: bash
        run: |
          if [ ! -f docs/shadow-summary.json ]; then
            cat > docs/shadow-summary.json <<'JSON'
          {
            "schemaVersion": 2,
            "status": "fail",
            "stage": "shadow_cycle",
            "error": {
              "name": "ShadowCycleError",
              "message": "shadow cycle failed before writing its own report"
            },
            "safety": {
              "usesPublicMarketDataOnly": true,
              "usesAccountOrOrderApi": false,
              "modifiesExistingAppApi": false,
              "deploysModel": false
            }
          }
          JSON
          fi

      - name: Display resulting shadow summary
        if: steps.inspect.outputs.decision == 'shadow_continue' && always()
        working-directory: ${{ env.LAB_DIR }}
        run: cat docs/shadow-summary.json

      - name: Commit isolated shadow files
        id: publish
        if: steps.inspect.outputs.decision == 'shadow_continue' && always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            market-prediction-lab/docs/shadow-trigger.json \
            market-prediction-lab/docs/shadow-state.json \
            market-prediction-lab/docs/shadow-summary.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_head="$(git rev-parse HEAD)"
          git fetch origin "${SHADOW_BRANCH}"
          remote_head="$(git rev-parse "origin/${SHADOW_BRANCH}")"
          if [ "${base_head}" != "${remote_head}" ]; then
            echo "Prediction Lab branch advanced during this run; refusing a non-fast-forward publish." >&2
            exit 1
          fi
          git commit -m "data: run hourly isolated shadow validation"
          git push origin "HEAD:${SHADOW_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch Application CI for updated Prediction Lab HEAD
        if: steps.publish.outputs.pushed == 'true'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.publish.outputs.head_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/.test(targetSha)) {
              core.setFailed(`Invalid Prediction Lab HEAD SHA: ${targetSha}`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const shadowBranch = process.env.SHADOW_BRANCH;
            let pull = null;
            let lastMatchCount = 0;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              const pulls = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                base: context.payload.repository?.default_branch ?? 'main',
                head: `${owner}:${shadowBranch}`,
                per_page: 10,
              });
              const matching = pulls.data.filter((candidate) => candidate.head.sha === targetSha);
              lastMatchCount = matching.length;
              if (matching.length === 1) {
                pull = matching[0];
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!pull) {
              core.setFailed(`Expected one open PR for ${shadowBranch} at ${targetSha}; found ${lastMatchCount}.`);
              return;
            }

            let checkoutSha = null;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                const ref = await github.rest.git.getRef({ owner, repo, ref: `pull/${pull.number}/merge` });
                const commit = await github.rest.repos.getCommit({ owner, repo, ref: ref.data.object.sha });
                if (commit.data.parents.some((parent) => parent.sha === targetSha)) {
                  checkoutSha = ref.data.object.sha;
                  break;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!checkoutSha) {
              core.setFailed(`Pull request #${pull.number} merge ref was not refreshed for ${targetSha}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'futures-public-network-smoke.yml',
              ref: context.payload.repository?.default_branch ?? 'main',
              inputs: { target_sha: targetSha, checkout_ref: checkoutSha },
            });
            core.info(`Dispatched Application CI for PR #${pull.number} at ${targetSha} using merge commit ${checkoutSha}.`);

      - name: Stop on existing technical failure
        if: steps.inspect.outputs.decision == 'technical_failure'
        run: exit 1

      - name: Stop when preflight failed
        if: steps.inspect.outputs.decision == 'shadow_continue' && steps.preflight.outcome != 'success'
        run: exit 1

      - name: Stop when shadow cycle failed
        if: steps.inspect.outputs.decision == 'shadow_continue' && steps.preflight.outcome == 'success' && steps.shadow.outcome != 'success'
        run: exit 1
