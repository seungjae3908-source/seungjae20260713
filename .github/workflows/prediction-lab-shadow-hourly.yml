name: Prediction Lab Hourly Shadow Validation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prediction-lab-shadow-hourly.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: prediction-lab-artifact-writer
  cancel-in-progress: false

env:
  SHADOW_BRANCH: feature/prediction-lab-standalone
  LAB_DIR: market-prediction-lab
  SHADOW_ARTIFACT: prediction-lab-shadow-state

jobs:
  shadow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Locate previous successful shadow artifact
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(context.runId);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'prediction-lab-shadow-hourly.yml',
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === currentRunId || run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((item) => item.name === process.env.SHADOW_ARTIFACT && !item.expired);
              if (!artifact) continue;
              core.setOutput('found', 'true');
              core.setOutput('run_id', String(run.id));
              core.setOutput('artifact_id', String(artifact.id));
              core.info(`Using predecessor shadow artifact ${artifact.id} from run ${run.id}.`);
              return;
            }
            core.setOutput('found', 'false');
            core.setOutput('run_id', '');
            core.setOutput('artifact_id', '');
            core.info('No previous successful shadow artifact exists; cutover seed validation will be required.');

      - name: Download previous shadow artifact
        if: steps.previous.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SHADOW_ARTIFACT }}
          path: previous-shadow
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Resolve immutable Prediction Lab code SHA
        id: code
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (process.env.PREVIOUS_FOUND === 'true') {
              const fs = require('fs');
              const manifest = JSON.parse(fs.readFileSync('previous-shadow/manifest.json', 'utf8'));
              if (!/^[0-9a-f]{40}$/.test(String(manifest.researchCodeSha ?? ''))) {
                core.setFailed('Previous shadow manifest has no valid immutable researchCodeSha.');
                return;
              }
              core.setOutput('sha', manifest.researchCodeSha);
              core.setOutput('seed_mode', 'artifact');
              return;
            }
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${process.env.SHADOW_BRANCH}` });
            const sha = ref.data.object.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Prediction Lab branch did not resolve to an immutable SHA.');
              return;
            }
            core.setOutput('sha', sha);
            core.setOutput('seed_mode', 'branch-cutover');
        env:
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}

      - name: Checkout immutable Prediction Lab code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.code.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore and verify previous state
        id: restore
        shell: bash
        env:
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.previous.outputs.artifact_id }}
          RESEARCH_CODE_SHA: ${{ steps.code.outputs.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const nonEmptyLedger = (value) => {
            if (!value || typeof value !== 'object') return false;
            if (Array.isArray(value)) return value.length > 0;
            const arrays = ['ledger', 'entries', 'predictions', 'records'];
            if (arrays.some((key) => Array.isArray(value[key]) && value[key].length > 0)) return true;
            return Object.keys(value).length > 0;
          };

          const lab = process.env.LAB_DIR;
          const statePath = path.join(lab, 'docs/shadow-state.json');
          const summaryPath = path.join(lab, 'docs/shadow-summary.json');
          if (process.env.PREVIOUS_FOUND === 'true') {
            const manifestPath = 'previous-shadow/manifest.json';
            const previousState = 'previous-shadow/shadow-state.json';
            const previousSummary = 'previous-shadow/shadow-summary.json';
            for (const file of [manifestPath, previousState, previousSummary]) {
              if (!fs.existsSync(file)) throw new Error(`Missing predecessor artifact file: ${file}`);
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.schemaVersion !== 1 || manifest.kind !== 'prediction-lab-shadow-state') {
              throw new Error('Unsupported predecessor shadow manifest.');
            }
            if (manifest.researchCodeSha !== process.env.RESEARCH_CODE_SHA) {
              throw new Error('Predecessor researchCodeSha does not match immutable checkout.');
            }
            if (manifest.stateSha256 !== digest(previousState) || manifest.summarySha256 !== digest(previousSummary)) {
              throw new Error('Predecessor shadow artifact digest mismatch.');
            }
            if (!nonEmptyLedger(JSON.parse(fs.readFileSync(previousState, 'utf8')))) {
              throw new Error('Refusing to restart from an empty predecessor shadow state.');
            }
            fs.copyFileSync(previousState, statePath);
            fs.copyFileSync(previousSummary, summaryPath);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `previous_state_digest=${manifest.stateSha256}\n`);
          } else {
            for (const file of [statePath, summaryPath]) {
              if (!fs.existsSync(file)) throw new Error(`Cutover seed is missing required file: ${file}`);
            }
            if (!nonEmptyLedger(JSON.parse(fs.readFileSync(statePath, 'utf8')))) {
              throw new Error('Refusing artifact cutover from an empty branch shadow state.');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `previous_state_digest=${digest(statePath)}\n`);
          }
          NODE

      - name: Inspect current shadow decision
        id: inspect
        working-directory: ${{ env.LAB_DIR }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('docs/shadow-summary.json', 'utf8'));
          const groups = Object.entries(summary.groups ?? {});
          const failures = groups.filter(([, group]) => group?.status === 'fail');
          const output = (name, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          if (summary.status === 'fail' || failures.length > 0) {
            output('decision', 'technical_failure');
            process.exit(0);
          }
          const ready = groups.some(([, group]) => group?.promotion?.status === 'integration_review_ready');
          output('decision', ready ? 'integration_review_ready' : 'shadow_continue');
          NODE

      - name: Validate isolated shadow modules
        id: preflight
        if: steps.inspect.outputs.decision == 'shadow_continue'
        working-directory: ${{ env.LAB_DIR }}
        run: node --test tests/derivatives-history.test.js tests/derivatives-normalized-compat.test.js tests/temporal-training-dataset.test.js tests/shadow-ledger.test.js

      - name: Update local artifact trigger
        if: steps.inspect.outputs.decision == 'shadow_continue'
        working-directory: ${{ env.LAB_DIR }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('docs/shadow-trigger.json', `${JSON.stringify({
            schemaVersion: 2,
            requestedAt: Date.now(),
            reason: 'hourly-shadow-validation',
            artifactOnly: true,
            branchWrite: false,
            deploy: false,
          }, null, 2)}\n`);
          NODE

      - name: Run one independent live shadow cycle
        if: steps.inspect.outputs.decision == 'shadow_continue'
        working-directory: ${{ env.LAB_DIR }}
        run: node scripts/run-shadow-cycle.js docs/shadow-state.json docs/shadow-summary.json

      - name: Build provenance manifest
        id: manifest
        if: steps.inspect.outputs.decision != 'technical_failure'
        shell: bash
        env:
          RESEARCH_CODE_SHA: ${{ steps.code.outputs.sha }}
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.previous.outputs.artifact_id }}
          PREVIOUS_STATE_DIGEST: ${{ steps.restore.outputs.previous_state_digest }}
          SEED_MODE: ${{ steps.code.outputs.seed_mode }}
        run: |
          rm -rf shadow-artifact
          mkdir -p shadow-artifact
          cp "$LAB_DIR/docs/shadow-state.json" shadow-artifact/shadow-state.json
          cp "$LAB_DIR/docs/shadow-summary.json" shadow-artifact/shadow-summary.json
          if [ -f "$LAB_DIR/docs/shadow-trigger.json" ]; then cp "$LAB_DIR/docs/shadow-trigger.json" shadow-artifact/shadow-trigger.json; fi
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const summary = JSON.parse(fs.readFileSync('shadow-artifact/shadow-summary.json', 'utf8'));
          const groups = Object.values(summary.groups ?? {});
          const first = groups[0] ?? {};
          const manifest = {
            schemaVersion: 1,
            kind: 'prediction-lab-shadow-state',
            researchCodeSha: process.env.RESEARCH_CODE_SHA,
            predecessorRunId: process.env.PREVIOUS_RUN_ID || null,
            predecessorArtifactId: process.env.PREVIOUS_ARTIFACT_ID || null,
            previousStateDigest: process.env.PREVIOUS_STATE_DIGEST,
            sourceGeneratedHead: process.env.RESEARCH_CODE_SHA,
            candidateModelId: first?.filter?.modelId ?? first?.modelSelection?.candidateModelId ?? null,
            referenceModelId: first?.filter?.referenceModelId ?? first?.modelSelection?.referenceModelId ?? null,
            seedMode: process.env.SEED_MODE,
            createdAt: new Date().toISOString(),
            stateSha256: digest('shadow-artifact/shadow-state.json'),
            summarySha256: digest('shadow-artifact/shadow-summary.json'),
            branchWrite: false,
            liveOrderAllowed: false,
            privateAccountRequestAllowed: false,
          };
          fs.writeFileSync('shadow-artifact/manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload immutable shadow state artifact
        if: steps.inspect.outputs.decision != 'technical_failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHADOW_ARTIFACT }}
          path: shadow-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Assert source branch stayed immutable
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.code.outputs.sha }}"
          git fetch --no-tags origin "${SHADOW_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ steps.code.outputs.sha }}" || {
            echo "Prediction Lab source branch moved during artifact-only run." >&2
            exit 1
          }

      - name: Stop on existing technical failure
        if: steps.inspect.outputs.decision == 'technical_failure'
        run: exit 1
