name: Application Fast CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - converted_to_draft
    paths:
      - .github/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - api-server/**
      - stock-analyzer/**
      - packages/**
      - research-production/**
      - market-prediction-lab/src/derivatives-history.js

permissions:
  contents: read

concurrency:
  group: application-fast-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: Changed-scope typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FAST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FAST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      FAST_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          [[ "$FAST_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '[INVALID_HEAD_SHA]' >&2; exit 1; }
          [[ -z "$actual_branch" ]] || { echo "[UNEXPECTED_BRANCH] $actual_branch" >&2; exit 1; }
          [[ "${actual_sha,,}" == "${FAST_HEAD_SHA,,}" ]] || { echo "[HEAD_SHA_MISMATCH] expected=$FAST_HEAD_SHA actual=$actual_sha" >&2; exit 1; }

      - name: Classify changed scope from shared V3 planner
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FAST_BASE_SHA"
          git cat-file -e "$FAST_BASE_SHA^{commit}"
          git diff --name-only "$FAST_BASE_SHA" "$FAST_HEAD_SHA" > /tmp/fast-ci-changed.txt
          cat /tmp/fast-ci-changed.txt
          node .github/scripts/ci-impact-plan.mjs \
            --base "$FAST_BASE_SHA" \
            --head "$FAST_HEAD_SHA" \
            --changed-files /tmp/fast-ci-changed.txt \
            --github-output "$GITHUB_OUTPUT" \
            --json-output /tmp/fast-ci-impact-plan.json

      - name: Fetch latest base for virtual merge preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FAST_BASE_REF" ]] || { echo '[MISSING_BASE_REF]' >&2; exit 1; }
          git fetch --no-tags origin "$FAST_BASE_REF"
          git cat-file -e "origin/$FAST_BASE_REF^{commit}"

      - name: Virtual merge static preflight
        run: node .github/scripts/pre-ci-v3.mjs --base "origin/$FAST_BASE_REF" --head "$FAST_HEAD_SHA" --virtual-merge --gate-only

      - name: Run static connection graph audit
        run: |
          set -euo pipefail
          node .github/scripts/connection-graph-auditor.mjs \
            --json-output /tmp/connection-graph.json \
            --markdown-output /tmp/connection-graph.md
          cat /tmp/connection-graph.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run product integrity audit
        run: |
          set -euo pipefail
          node .github/scripts/product-integrity-auditor.mjs \
            --json-output /tmp/product-integrity.json \
            --markdown-output /tmp/product-integrity.md
          cat /tmp/product-integrity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact-head audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-integrity-audit-${{ env.FAST_HEAD_SHA }}
          path: |
            /tmp/connection-graph.json
            /tmp/connection-graph.md
            /tmp/product-integrity.json
            /tmp/product-integrity.md
          if-no-files-found: error
          retention-days: 7

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.backend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        if: steps.impact.outputs.frontend == 'true'
        run: pnpm --dir stock-analyzer run typecheck

      - name: Backtest Paper and Research readback rendered contracts
        if: steps.impact.outputs.phase5 == 'true' || steps.impact.outputs.shared == 'true'
        run: node --test .github/tests/backtest-paper-handoff-ui.test.mjs

      - name: Backend typecheck
        if: steps.impact.outputs.backend == 'true'
        run: pnpm --dir api-server run typecheck

      - name: Backend unit tests
        if: steps.impact.outputs.backend == 'true'
        run: pnpm --dir api-server run test:unit

      - name: Phase 2 impacted tests
        if: steps.impact.outputs.phase2 == 'true'
        run: pnpm --dir api-server run test:phase2

      - name: Phase 3 risk impacted tests
        if: steps.impact.outputs.risk == 'true'
        run: pnpm --dir api-server run test:risk

      - name: Phase 4 contract impacted tests
        if: steps.impact.outputs.phase4 == 'true'
        run: pnpm --dir api-server run test:phase4

      - name: Phase 5 impacted tests
        if: steps.impact.outputs.phase5 == 'true'
        run: pnpm --dir api-server run test:phase5

      - name: Phase 6 impacted tests
        if: steps.impact.outputs.phase6 == 'true'
        run: pnpm --dir api-server run test:phase6

      - name: Phase 7 impacted tests
        if: steps.impact.outputs.phase7 == 'true'
        run: pnpm --dir api-server run test:phase7

      - name: Phase 8 impacted tests
        if: steps.impact.outputs.phase8 == 'true'
        run: pnpm --dir api-server run test:phase8

      - name: Phase 9 impacted tests
        if: steps.impact.outputs.phase9 == 'true'
        run: pnpm --dir api-server run test:phase9

      - name: Phase 12 impacted tests
        if: steps.impact.outputs.phase12 == 'true'
        run: pnpm --dir api-server run test:phase12

      - name: API smoke tests
        if: steps.impact.outputs.backend == 'true'
        run: pnpm --dir api-server run test:smoke

      - name: Frontend build
        if: steps.impact.outputs.frontend == 'true'
        run: pnpm --dir stock-analyzer run build

      - name: Backend build
        if: steps.impact.outputs.backend == 'true'
        run: pnpm --dir api-server run build:server

      - name: CI and auditor contract checks
        if: steps.impact.outputs.ci == 'true'
        run: |
          set -euo pipefail
          node --check .github/scripts/connection-graph-auditor.mjs
          node --check .github/scripts/product-integrity-auditor.mjs
          if compgen -G '.github/tests/pr-exact-head-*.test.mjs' > /dev/null; then
            node --test .github/tests/pr-exact-head-*.test.mjs
          fi
          node --test .github/tests/connection-graph-auditor.test.mjs
          node --test .github/tests/product-integrity-auditor.test.mjs
          if compgen -G '.github/tests/browser-ci-v4*.test.mjs' > /dev/null; then
            node --test .github/tests/browser-ci-v4*.test.mjs
          fi

      - name: Development-only boundary
        run: |
          echo 'Application Fast CI is a development accelerator only.'
          echo 'It MUST NOT publish or replace any of the six Required CI contexts.'
          echo 'Final Ready/Merge/Staging gates still require canonical Application CI 6/6.'
  browser-critical:
    name: Critical browser journeys before Ready
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FAST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FAST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          [[ "$FAST_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '[INVALID_HEAD_SHA]' >&2; exit 1; }
          [[ -z "$actual_branch" ]] || { echo "[UNEXPECTED_BRANCH] $actual_branch" >&2; exit 1; }
          [[ "${actual_sha,,}" == "${FAST_HEAD_SHA,,}" ]] || { echo "[HEAD_SHA_MISMATCH] expected=$FAST_HEAD_SHA actual=$actual_sha" >&2; exit 1; }

      - name: Classify critical browser impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FAST_BASE_SHA"
          git diff --name-only "$FAST_BASE_SHA" "$FAST_HEAD_SHA" > /tmp/browser-critical-changed.txt
          node .github/scripts/ci-impact-plan.mjs \
            --base "$FAST_BASE_SHA" \
            --head "$FAST_HEAD_SHA" \
            --changed-files /tmp/browser-critical-changed.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Skip browser critical lane when frontend and CI are unaffected
        if: steps.impact.outputs.frontend != 'true' && steps.impact.outputs.ci != 'true'
        run: echo 'Browser critical lane not impacted.'

      - name: Set up pnpm 9
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Playwright Chromium
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.61.1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        run: pnpm --dir stock-analyzer exec playwright install chromium

      - name: Pre-Ready runtime capability drift gate
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        run: pnpm --dir stock-analyzer run test:e2e:runtime-drift

      - name: Run critical browser journeys without retry-to-pass
        if: steps.impact.outputs.frontend == 'true' || steps.impact.outputs.ci == 'true'
        run: pnpm --dir stock-analyzer run test:e2e:critical

      - name: Development-only boundary
        run: |
          echo 'Critical browser journeys are a Fast CI preflight only.'
          echo 'They do not replace the canonical full Browser Required context.'

