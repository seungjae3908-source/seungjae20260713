name: Production Live Credential Reuse QA

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact deployed Production SHA to verify
        required: true
        type: string
      production_deploy_run_id:
        description: Exact successful Production Deploy Run ID
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: Exact deployed Production SHA to verify
        required: true
        type: string
      production_deploy_run_id:
        description: Exact successful Production Deploy Run ID
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/production-live-credential-reuse-qa.yml
      - .github/workflows/production-live-credential-reuse-qa-dispatch-bridge.yml
      - stock-analyzer/e2e/production-live-credential-reuse-qa.spec.ts
      - stock-analyzer/playwright.production-live-credential-reuse.config.ts
      - .github/workflows/production-postdeploy-qa.yml
      - .github/scripts/verify-production-postdeploy-qa-contract.mjs
      - .github/scripts/run-production-readonly-qa.sh
      - .github/scripts/verify-production-qa-receipt.cjs

permissions:
  actions: read
  contents: read

concurrency:
  group: production-live-credential-reuse-qa
  cancel-in-progress: false

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    name: Validate credential-reuse QA safety boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require exact allowed mutation surface
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const spec = fs.readFileSync('stock-analyzer/e2e/production-live-credential-reuse-qa.spec.ts', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/production-live-credential-reuse-qa.yml', 'utf8');
          const liveJob = workflow.split('\n  production-qa:\n')[1] ?? '';
          const required = [
            '/api/trade-automation/connections/',
            'reuse-readonly',
            'orderRequests: 0',
            'cancelRequests: 0',
            'amendRequests: 0',
            'transferRequests: 0',
            'withdrawalRequests: 0',
            'realOrderSubmitted: false',
            'liveTradingAuthorityGranted: false',
            'autoTradingAuthorityGranted: false',
          ];
          for (const token of required) {
            if (!spec.includes(token)) throw new Error('CREDENTIAL_REUSE_QA_REQUIRED_CONTRACT_MISSING:' + token);
          }
          const forbidden = [
            '/api/trade-automation/orders',
            '/api/trade-automation/plans',
            '/api/trade-automation/policy',
            '/api/trade-automation/emergency-stop',
            '/api/trade-automation/positions/exit-',
          ];
          for (const route of forbidden) {
            if (spec.includes(route)) throw new Error('CREDENTIAL_REUSE_QA_FINANCIAL_ROUTE_FORBIDDEN:' + route);
          }
          if (!liveJob.includes('environment: production')) throw new Error('CREDENTIAL_REUSE_QA_PROTECTED_CREDENTIAL_SOURCE_REQUIRED');
          if (liveJob.includes('PROD_SSH_') || liveJob.includes('PROD_DATABASE_URL')) throw new Error('CREDENTIAL_REUSE_QA_DEPLOY_AUTHORITY_FORBIDDEN');
          NODE

  resolve-harness:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    name: Pin current-main QA harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      harness_sha: ${{ steps.pin.outputs.harness_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: pin
        run: |
          set -Eeuo pipefail
          HARNESS_SHA="$(git rev-parse HEAD^{commit})"
          echo "harness_sha=$HARNESS_SHA" >> "$GITHUB_OUTPUT"

  production-qa:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    name: Verify saved read-only key reuse in real Production
    needs: resolve-harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE_URL: https://lsj119.com
      EXPECTED_DEPLOY_SHA: ${{ inputs.sha }}
      EXPECTED_PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
      PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
      PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
      PRODUCTION_LIVE_CREDENTIAL_REUSE_QA: "true"
      PRODUCTION_LIVE_CREDENTIAL_REUSE_ARTIFACT_DIR: production-live-credential-reuse-artifacts
      PRODUCTION_LOGIN_DIAGNOSTIC_DIR: production-login-diagnostics/credential
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
      PRODUCTION_DEPLOY_MODE: completed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Require exact deployed SHA and official deploy provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$EXPECTED_PRODUCTION_DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$(git rev-parse HEAD^{commit})" == "${EXPECTED_DEPLOY_SHA,,}" ]] || exit 1
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_PRODUCTION_DEPLOY_RUN_ID}" > /tmp/deploy-run.json
          node <<'NODE'
          const fs = require('fs');
          const run = JSON.parse(fs.readFileSync('/tmp/deploy-run.json', 'utf8'));
          const expected = process.env.EXPECTED_DEPLOY_SHA.toLowerCase();
          if (run.name !== 'Production Deploy'
            || run.path !== '.github/workflows/production-deploy.yml'
            || run.status !== 'completed'
            || run.conclusion !== 'success'
            || String(run.head_sha).toLowerCase() !== expected) {
            throw new Error('CREDENTIAL_REUSE_QA_PRODUCTION_DEPLOY_PROVENANCE_INVALID');
          }
          NODE
      - name: Overlay pinned current-main QA harness only
        env:
          HARNESS_SHA: ${{ needs.resolve-harness.outputs.harness_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$HARNESS_SHA"
          for file in \
            stock-analyzer/e2e/production-live-credential-reuse-qa.spec.ts \
            stock-analyzer/playwright.production-live-credential-reuse.config.ts
          do
            git show "$HARNESS_SHA:$file" > "$file"
          done
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: stock-analyzer
        run: pnpm exec playwright install chromium
      - name: Execute exact Production credential reuse QA
        run: bash .github/scripts/run-production-readonly-qa.sh credential
      - name: Validate sanitized evidence contract
        run: |
          set -Eeuo pipefail
          file="stock-analyzer/production-live-credential-reuse-artifacts/production-live-credential-reuse-qa.json"
          test -s "$file"
          node - "$file" "$EXPECTED_DEPLOY_SHA" "$EXPECTED_PRODUCTION_DEPLOY_RUN_ID" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha, productionDeployRunId] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const providers = Array.isArray(value.providers) ? value.providers : [];
          const names = providers.map((p) => p.provider).sort();
          if (value.schemaVersion !== 'production-live-credential-reuse-qa-v1'
            || value.targetSha !== expectedSha.toLowerCase()
            || value.productionDeployRunId !== Number(productionDeployRunId)
            || !Number.isFinite(Date.parse(String(value.generatedAt ?? '')))
            || JSON.stringify(names) !== JSON.stringify(['bitget','kiwoom','toss','upbit'])
            || value.officialProductionOrigin !== true
            || value.authenticatedProductionSession !== true
            || value.orderRequests !== 0
            || value.cancelRequests !== 0
            || value.amendRequests !== 0
            || value.transferRequests !== 0
            || value.withdrawalRequests !== 0
            || value.realOrderSubmitted !== false
            || value.liveTradingAuthorityGranted !== false
            || value.autoTradingAuthorityGranted !== false
            || value.credentialsReturned !== false
            || value.secretValuesRecorded !== false
            || value.accountValuesRecorded !== false) {
            throw new Error('PRODUCTION_CREDENTIAL_REUSE_QA_EVIDENCE_FAILED');
          }
          const expectedMutationPaths = providers.map((row) => ({
            method: 'POST',
            path: '/api/trade-automation/connections/' + row.provider + '/reuse-readonly',
          })).sort((a, b) => a.path.localeCompare(b.path));
          const observedMutationPaths = Array.isArray(value.observedMutationPaths)
            ? [...value.observedMutationPaths].sort((a, b) => String(a?.path).localeCompare(String(b?.path)))
            : [];
          if (value.observedCredentialConnectionMutations !== 4
            || JSON.stringify(observedMutationPaths) !== JSON.stringify(expectedMutationPaths)) {
            throw new Error('PRODUCTION_CREDENTIAL_REUSE_QA_MUTATION_SCOPE_FAILED');
          }
          for (const row of providers) {
            if (row.configured !== true || row.verified !== true
              || row.reusedReadonlyCredential !== true
              || row.credentialsReturned !== false
              || row.liveExecutionActivated !== false
              || row.automaticLiveExecutionActivated !== false
              || row.orderRequests !== 0 || row.cancelRequests !== 0
              || row.amendRequests !== 0 || row.transferRequests !== 0
              || row.withdrawalRequests !== 0 || row.realOrderSubmitted !== false) {
              throw new Error('PRODUCTION_CREDENTIAL_REUSE_PROVIDER_FAILED:' + row.provider);
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-live-credential-reuse-${{ inputs.sha }}
          path: |
            stock-analyzer/production-live-credential-reuse-artifacts
            stock-analyzer/production-login-diagnostics/credential
          if-no-files-found: warn
          retention-days: 30
      - name: Safety summary
        if: always()
        run: |
          {
            echo '## Production Live Credential Reuse QA'
            echo
            echo "Production SHA: ${EXPECTED_DEPLOY_SHA,,}"
            echo 'Allowed app mutation: encrypted live-connection credential save/verification only'
            echo 'Orders/cancels/amends/transfers/withdrawals: 0/0/0/0/0'
            echo 'Live/AUTO execution authority granted: false'
            echo 'Raw secret values retained: false'
          } >> "$GITHUB_STEP_SUMMARY"
