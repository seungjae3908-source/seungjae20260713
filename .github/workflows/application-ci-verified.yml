name: Application CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - feature/futures-market-data-phase2
      - "feature/**"
    paths:
      - .github/workflows/application-ci-verified.yml
      - .github/workflows/ci.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - api-server/**
      - stock-analyzer/**
      - packages/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir stock-analyzer run typecheck

      - name: Typecheck backend
        run: pnpm --dir api-server run typecheck

      - name: Run futures unit tests
        run: pnpm --dir api-server run test:unit

      - name: Run futures route smoke tests
        run: pnpm --dir api-server run test:smoke

      - name: Build frontend production bundle
        run: pnpm --dir stock-analyzer run build

      - name: Build backend production bundle
        run: pnpm --dir api-server run build:server

  publish-conclusion:
    name: Publish Application CI conclusion
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified run status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.validate.result }}';
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Application CI run ${context.runId}: ${result}`,
              context: 'application-ci/verified',
            });
