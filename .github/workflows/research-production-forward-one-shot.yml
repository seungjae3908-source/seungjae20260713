name: Research Production Forward One-Shot Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  statuses: read

concurrency:
  group: research-production-forward-one-shot
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-research-production-forward-once ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.gate.outputs.target_sha }}
      hub_issue: ${{ steps.hub.outputs.active_issue }}
      application_run_id: ${{ steps.gate.outputs.application_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve canonical Central Hub
        id: hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/agent_hub_rollover_v2.py resolve

      - name: Authorize exact current main, activation receipt, and Required CI
        id: gate
        uses: actions/github-script@v7
        env:
          HUB_ISSUE_NUMBER: ${{ steps.hub.outputs.active_issue }}
        with:
          script: |
            const body = String(context.payload.comment?.body ?? '').trim();
            const match = body.match(/^\/run-research-production-forward-once ([0-9a-f]{40})$/i);
            if (!match) {
              core.setFailed('Expected /run-research-production-forward-once <40-char-main-sha>');
              return;
            }
            const canonicalHub = Number(process.env.HUB_ISSUE_NUMBER ?? 0);
            const eventIssue = Number(context.payload.issue?.number ?? 0);
            if (!Number.isInteger(canonicalHub) || canonicalHub <= 0 || eventIssue !== canonicalHub) {
              core.setFailed(`Forward one-shot command must be posted on canonical Hub #${canonicalHub || 'UNKNOWN'}; got #${eventIssue || 'UNKNOWN'}.`);
              return;
            }

            const targetSha = match[1].toLowerCase();
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (String(main.data.commit.sha).toLowerCase() !== targetSha) {
              core.setFailed(`Target is not exact current main: ${targetSha}`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: eventIssue,
              per_page: 100,
            });
            const receipt = comments.find((comment) => {
              if (comment.user?.login !== 'github-actions[bot]' || comment.user?.type !== 'Bot') return false;
              const lines = String(comment.body ?? '').trim().split(/\r?\n/).map((line) => line.trim());
              return lines[0] === '[RESEARCH_PRODUCTION_ACTIVATION]'
                && lines.includes('status: success')
                && lines.includes(`target_sha: ${targetSha}`)
                && lines.includes('exact_main_research_self_check: success')
                && lines.includes('existing_app_deploy_mutation: 0')
                && lines.includes('production_db_mutation: 0')
                && lines.includes('live_trading: false')
                && lines.includes('private_api: false')
                && lines.includes('order_authority: false')
                && lines.includes('real_order_count: 0');
            });
            if (!receipt) {
              core.setFailed('No successful Paper-only Research Production activation receipt exists for exact target SHA.');
              return;
            }

            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            const byRun = new Map();
            for (const status of statuses) {
              const runMatch = String(status.target_url ?? '').match(/\/actions\/runs\/(\d+)/);
              if (!runMatch) continue;
              const runId = runMatch[1];
              if (!byRun.has(runId)) byRun.set(runId, new Map());
              const contexts = byRun.get(runId);
              const previous = contexts.get(status.context);
              if (!previous || Number(status.id) > Number(previous.id)) {
                contexts.set(status.context, status);
              }
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              per_page: 100,
            });
            const candidates = runs
              .filter((run) =>
                run.head_sha.toLowerCase() === targetSha
                && run.path === '.github/workflows/futures-public-network-smoke.yml'
                && (run.event === 'push' || run.event === 'workflow_dispatch')
                && run.status === 'completed'
                && run.conclusion === 'success')
              .sort((a, b) => Number(b.id) - Number(a.id));

            let accepted = null;
            for (const run of candidates) {
              const contexts = byRun.get(String(run.id));
              if (contexts && required.every((name) => contexts.get(name)?.state === 'success')) {
                accepted = run;
                break;
              }
            }
            if (!accepted) {
              core.setFailed('No coherent exact-main Required CI 6/6 SUCCESS run exists for target SHA.');
              return;
            }

            const mainAfter = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (String(mainAfter.data.commit.sha).toLowerCase() !== targetSha) {
              core.setFailed(`Current main moved during one-shot authorization: expected ${targetSha}, found ${String(mainAfter.data.commit.sha).toLowerCase()}`);
              return;
            }

            core.setOutput('target_sha', targetSha);
            core.setOutput('application_run_id', String(accepted.id));
            core.info(`Authorized exact-main Required CI Run ${accepted.id}.`);

  run-forward-once:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      HUB_ISSUE_NUMBER: ${{ needs.authorize.outputs.hub_issue }}
      APPLICATION_RUN_ID: ${{ needs.authorize.outputs.application_run_id }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      EVIDENCE_FILE: ${{ runner.temp }}/research-production-forward-one-shot-evidence.txt
      SERVICE_FILE: ${{ runner.temp }}/research-production-forward-one-shot-service.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Read-only exact-release and timer preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          current="$(readlink -f /opt/investment-research/current)"
          test "$current" = "/opt/investment-research/releases/$TARGET_SHA"
          test "$(git -C "$current" rev-parse HEAD)" = "$TARGET_SHA"
          sudo -n systemctl is-enabled --quiet research-production-forward.timer
          sudo -n systemctl is-active --quiet research-production-forward.timer
          if sudo -n systemctl is-active --quiet research-production@forward.service; then
            echo "FORWARD_ONE_SHOT_BLOCKED_ACTIVE_SERVICE=true" >&2
            exit 79
          fi
          sudo -n grep -Fx "RESEARCH_CODE_SHA=$TARGET_SHA" /etc/investment-research/research-production.env >/dev/null
          printf '%s\n'             'FORWARD_ONE_SHOT_PREFLIGHT=PASS'             "TARGET_SHA=$TARGET_SHA"             'LIVE_TRADING=false'             'PRIVATE_API=false'             'ORDER_AUTHORITY=false'
          REMOTE

      - name: Start isolated forward service once
        id: service
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          set +e
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_env bash -s" > "$SERVICE_FILE" 2>&1 <<'REMOTE'
          set +e
          sudo -n systemctl start research-production@forward.service
          start_status=$?
          set -e
          result="$(sudo -n systemctl show research-production@forward.service -p Result --value)"
          exec_status="$(sudo -n systemctl show research-production@forward.service -p ExecMainStatus --value)"
          active_state="$(sudo -n systemctl show research-production@forward.service -p ActiveState --value)"
          sub_state="$(sudo -n systemctl show research-production@forward.service -p SubState --value)"
          printf '%s\n'             "systemctl_start_status=$start_status"             "service_result=$result"             "service_exec_status=$exec_status"             "service_active_state=$active_state"             "service_sub_state=$sub_state"             'live_trading=false'             'private_api=false'             'order_authority=false'
          exit 0
          REMOTE
          ssh_status=$?
          set -e
          test "$ssh_status" -eq 0
          grep -q '^service_result=' "$SERVICE_FILE"
          cat "$SERVICE_FILE"

      - name: Collect post-run evidence read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_RESEARCH_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_env bash -s"             < ops/research-production-readonly-evidence.sh > "$EVIDENCE_FILE"
          grep -Fx 'RESEARCH_PRODUCTION_READONLY_EVIDENCE_BEGIN' "$EVIDENCE_FILE" >/dev/null
          grep -Fx "target_research_sha=$TARGET_SHA" "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'current_release_match=true' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'server_files_written=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'server_processes_restarted=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'deployment_executed=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'database_changes=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'live_trading=false' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'private_api=false' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'order_authority=false' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'real_order_count=0' "$EVIDENCE_FILE" >/dev/null

      - name: Classify one-shot result
        id: verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const evidence = fs.readFileSync(process.env.EVIDENCE_FILE, 'utf8')
            .split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          const service = fs.readFileSync(process.env.SERVICE_FILE, 'utf8')
            .split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          const fields = (line) => Object.fromEntries(
            line.split(/\s+/).slice(1).map((part) => {
              const i = part.indexOf('=');
              return i < 0 ? [part, ''] : [part.slice(0, i), part.slice(i + 1)];
            }),
          );
          const all = (prefix) => evidence.filter((line) => line.startsWith(prefix));
          const find = (prefix) => evidence.find((line) => line.startsWith(prefix)) ?? '';
          const cycle = all('CYCLE ').map(fields).find((row) => row.profile === 'forward') ?? {};
          const tasks = all('TASK ').map(fields).filter((row) => row.profile === 'forward');
          const failureRows = all('TASK_FAILURE_SIGNATURE ').map(fields)
            .filter((row) => row.profile === 'forward');
          const task = (id) => tasks.find((row) => row.id === id) ?? {};
          const failure = (id) => failureRows.find((row) => row.id === id) ?? {};
          const paperRuntime = fields(find('PAPER_RUNTIME '));
          const serviceFields = Object.fromEntries(service.map((line) => {
            const i = line.indexOf('=');
            return i < 0 ? [line, ''] : [line.slice(0, i), line.slice(i + 1)];
          }));

          const shadow = task('shadow-forward');
          const paper = task('paper-forward');
          const shadowFailure = failure('shadow-forward');
          const paperFailure = failure('paper-forward');

          const exactCycle = cycle.research_sha === process.env.TARGET_SHA;
          const paperModuleFailure = String(paperFailure.signatures ?? '').split(',')
            .some((value) => ['ERR_MODULE_NOT_FOUND', 'MODULE_NOT_FOUND'].includes(value));
          const paperRuntimeAccepted = ['success', 'blocked_data'].includes(String(paper.status ?? ''));
          const serviceAccepted = serviceFields.service_result === 'success'
            && String(serviceFields.service_exec_status ?? '') === '0';
          const safe = paperRuntime.private_request_count === '0'
            && paperRuntime.financial_mutation_count === '0'
            && paperRuntime.order_count === '0'
            && paperRuntime.live_trading === 'false'
            && paperRuntime.order_authority === 'false';

          const status = exactCycle && paperRuntimeAccepted && !paperModuleFailure && safe
            ? (serviceAccepted && shadow.status !== 'failed' ? 'SUCCESS' : 'PARTIAL_SUCCESS')
            : 'FAIL_CLOSED';

          const output = process.env.GITHUB_OUTPUT;
          const pairs = {
            status,
            cycle_id: cycle.cycle_id ?? 'unknown',
            cycle_status: cycle.status ?? 'unknown',
            cycle_research_sha: cycle.research_sha ?? 'unknown',
            service_result: serviceFields.service_result ?? 'unknown',
            service_exec_status: serviceFields.service_exec_status ?? 'unknown',
            shadow_status: shadow.status ?? 'unknown',
            shadow_exit_code: shadow.exit_code ?? 'unknown',
            shadow_failure_signatures: shadowFailure.signatures ?? 'unknown',
            shadow_failure_categories: shadowFailure.categories ?? 'unknown',
            paper_status: paper.status ?? 'unknown',
            paper_exit_code: paper.exit_code ?? 'unknown',
            paper_failure_signatures: paperFailure.signatures ?? 'unknown',
            paper_failure_categories: paperFailure.categories ?? 'unknown',
            paper_module_failure: String(paperModuleFailure),
            real_order_count: paperRuntime.order_count ?? 'unknown',
            private_request_count: paperRuntime.private_request_count ?? 'unknown',
            live_trading: paperRuntime.live_trading ?? 'unknown',
            order_authority: paperRuntime.order_authority ?? 'unknown',
          };
          for (const [key, value] of Object.entries(pairs)) {
            fs.appendFileSync(output, `${key}=${String(value).replace(/[\r\n]/g, '_')}\n`);
          }
          if (status === 'FAIL_CLOSED') process.exitCode = 1;
          NODE
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}

      - name: Report one-shot evidence to Central Hub
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.verdict.outputs.status }}
          CYCLE_ID: ${{ steps.verdict.outputs.cycle_id }}
          CYCLE_STATUS: ${{ steps.verdict.outputs.cycle_status }}
          CYCLE_RESEARCH_SHA: ${{ steps.verdict.outputs.cycle_research_sha }}
          SERVICE_RESULT: ${{ steps.verdict.outputs.service_result }}
          SERVICE_EXEC_STATUS: ${{ steps.verdict.outputs.service_exec_status }}
          SHADOW_STATUS: ${{ steps.verdict.outputs.shadow_status }}
          SHADOW_EXIT_CODE: ${{ steps.verdict.outputs.shadow_exit_code }}
          SHADOW_FAILURE_SIGNATURES: ${{ steps.verdict.outputs.shadow_failure_signatures }}
          SHADOW_FAILURE_CATEGORIES: ${{ steps.verdict.outputs.shadow_failure_categories }}
          PAPER_STATUS: ${{ steps.verdict.outputs.paper_status }}
          PAPER_EXIT_CODE: ${{ steps.verdict.outputs.paper_exit_code }}
          PAPER_FAILURE_SIGNATURES: ${{ steps.verdict.outputs.paper_failure_signatures }}
          PAPER_FAILURE_CATEGORIES: ${{ steps.verdict.outputs.paper_failure_categories }}
          PAPER_MODULE_FAILURE: ${{ steps.verdict.outputs.paper_module_failure }}
          REAL_ORDER_COUNT: ${{ steps.verdict.outputs.real_order_count }}
          PRIVATE_REQUEST_COUNT: ${{ steps.verdict.outputs.private_request_count }}
          LIVE_TRADING: ${{ steps.verdict.outputs.live_trading }}
          ORDER_AUTHORITY: ${{ steps.verdict.outputs.order_authority }}
        with:
          script: |
            const clean = (value) => String(value ?? 'unknown').replace(/[\r\n]+/g, '_').slice(0, 500);
            const body = [
              '[RESEARCH_PRODUCTION_FORWARD_ONE_SHOT]',
              `status: ${clean(process.env.STATUS)}`,
              `target_sha: ${clean(process.env.TARGET_SHA)}`,
              `application_ci_run: ${clean(process.env.APPLICATION_RUN_ID)}`,
              `cycle_id: ${clean(process.env.CYCLE_ID)}`,
              `cycle_status: ${clean(process.env.CYCLE_STATUS)}`,
              `cycle_research_sha: ${clean(process.env.CYCLE_RESEARCH_SHA)}`,
              `service_result: ${clean(process.env.SERVICE_RESULT)}`,
              `service_exec_status: ${clean(process.env.SERVICE_EXEC_STATUS)}`,
              `shadow_status: ${clean(process.env.SHADOW_STATUS)}`,
              `shadow_exit_code: ${clean(process.env.SHADOW_EXIT_CODE)}`,
              `shadow_failure_signatures: ${clean(process.env.SHADOW_FAILURE_SIGNATURES)}`,
              `shadow_failure_categories: ${clean(process.env.SHADOW_FAILURE_CATEGORIES)}`,
              `paper_status: ${clean(process.env.PAPER_STATUS)}`,
              `paper_exit_code: ${clean(process.env.PAPER_EXIT_CODE)}`,
              `paper_failure_signatures: ${clean(process.env.PAPER_FAILURE_SIGNATURES)}`,
              `paper_failure_categories: ${clean(process.env.PAPER_FAILURE_CATEGORIES)}`,
              `paper_module_failure: ${clean(process.env.PAPER_MODULE_FAILURE)}`,
              `real_order_count: ${clean(process.env.REAL_ORDER_COUNT)}`,
              `private_request_count: ${clean(process.env.PRIVATE_REQUEST_COUNT)}`,
              `live_trading: ${clean(process.env.LIVE_TRADING)}`,
              `order_authority: ${clean(process.env.ORDER_AUTHORITY)}`,
              'server_deploy_mutation: 0',
              'production_db_mutation: 0',
              'timer_schedule_mutation: 0',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.HUB_ISSUE_NUMBER),
              body,
            });
