name: Research Production Natural Cycle Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-production-natural-cycle-evidence.yml'
      - 'ops/research-production-readonly-evidence.sh'
      - 'market-prediction-lab/tests/research-production-readonly-evidence-observability.test.js'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: research-production-natural-cycle-evidence
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate read-only evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          bash -n ops/research-production-readonly-evidence.sh
          grep -q 'server_files_written=0' ops/research-production-readonly-evidence.sh
          grep -q 'server_processes_restarted=0' ops/research-production-readonly-evidence.sh
          grep -q 'deployment_executed=0' ops/research-production-readonly-evidence.sh
          grep -q 'database_changes=0' ops/research-production-readonly-evidence.sh
          grep -q 'live_trading=false' ops/research-production-readonly-evidence.sh
          grep -q 'private_api=false' ops/research-production-readonly-evidence.sh
          grep -q 'order_authority=false' ops/research-production-readonly-evidence.sh
          if grep -Eq '(^|[[:space:];])(rm|mv|cp|install|mkdir|touch|tee|truncate)([[:space:]]|$)|systemctl[[:space:]]+(enable|disable|start|stop|restart|reload|daemon-reload)|git[[:space:]]+config|crontab|chmod|chown' ops/research-production-readonly-evidence.sh; then
            echo 'Read-only probe contains a prohibited mutation command.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]{10}git fetch --no-tags origin main "\$RESEARCH_SHA"$' .github/workflows/research-production-natural-cycle-evidence.yml; then
            echo 'Natural evidence verifier must not require an unauthenticated post-checkout fetch.' >&2
            exit 1
          fi
          grep -q 'SOURCE_OUTCOME:' .github/workflows/research-production-natural-cycle-evidence.yml
          grep -q "preflight_failed" .github/workflows/research-production-natural-cycle-evidence.yml
          grep -Fq "const observed = (value) => measured && value ? value : 'unknown';" .github/workflows/research-production-natural-cycle-evidence.yml
          grep -q 'PAPER_NATURAL' ops/research-production-readonly-evidence.sh
          grep -q 'buildNaturalPaperFirstZeroTraceFromRuntime' .github/workflows/research-production-natural-cycle-evidence.yml
          hub_issue_filter='github.event.issue.number == '"838"
          hub_report_target='issue_number: '"838"
          test "$(grep -Fc "$hub_issue_filter" .github/workflows/research-production-natural-cycle-evidence.yml)" -eq 1
          test "$(grep -Fc "$hub_report_target" .github/workflows/research-production-natural-cycle-evidence.yml)" -eq 1
          node --test market-prediction-lab/tests/research-production-readonly-evidence-observability.test.js
          node --test research-production/test/natural-cycle-verdict-trace.test.mjs research-production/test/natural-cycle-verdict-trace-v5-runtime.test.mjs

  observe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 838 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/verify-research-production ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      EVIDENCE_FILE: /tmp/research-production-natural-cycle-evidence.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Parse immutable Research release command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/verify-research-production ([0-9a-f]{40})$/i.exec(body);
          if (!match) throw new Error('Expected /verify-research-production <40-character-research-sha>');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `research_sha=${match[1].toLowerCase()}\n`);
          NODE

      - name: Verify requested Research release is in repository history
        id: source
        env:
          RESEARCH_SHA: ${{ steps.command.outputs.research_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # checkout uses fetch-depth: 0, so a requested release that is an ancestor
          # of main must already be present locally. Keep credentials non-persistent and
          # fail closed instead of performing an unauthenticated second fetch.
          git cat-file -e "$RESEARCH_SHA^{commit}"
          git merge-base --is-ancestor "$RESEARCH_SHA" origin/main
          git cat-file -e "$RESEARCH_SHA:research-production/bin/research-cycle.mjs"
          git cat-file -e "$RESEARCH_SHA:research-production/deploy/research-production@.service"

      - name: Configure SSH without exposing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Collect Research Production evidence read-only
        id: evidence
        env:
          RESEARCH_SHA: ${{ steps.command.outputs.research_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_RESEARCH_SHA=%q' "$RESEARCH_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" \
            < ops/research-production-readonly-evidence.sh | tee "$EVIDENCE_FILE"
          grep -Fx 'RESEARCH_PRODUCTION_READONLY_EVIDENCE_BEGIN' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'RESEARCH_PRODUCTION_READONLY_EVIDENCE_END' "$EVIDENCE_FILE" >/dev/null
          grep -Fx "target_research_sha=$RESEARCH_SHA" "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'current_release_match=true' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'server_files_written=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'server_files_deleted=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'server_processes_restarted=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'deployment_executed=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'database_changes=0' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'live_trading=false' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'private_api=false' "$EVIDENCE_FILE" >/dev/null
          grep -Fx 'order_authority=false' "$EVIDENCE_FILE" >/dev/null

      - name: Classify natural cycle evidence
        id: verdict
        if: steps.evidence.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildNaturalPaperFirstZeroTraceFromRuntime } from './research-production/src/natural-cycle-verdict-trace.mjs';
          const lines = fs.readFileSync(process.env.EVIDENCE_FILE, 'utf8').split(/\r?\n/).filter(Boolean);
          const find = (prefix) => lines.find((line) => line.startsWith(prefix));
          const all = (prefix) => lines.filter((line) => line.startsWith(prefix));
          const fields = (line) => Object.fromEntries(String(line ?? '').split(/\s+/).slice(1).map((pair) => {
            const i = pair.indexOf('=');
            return i > 0 ? [pair.slice(0, i), pair.slice(i + 1)] : [pair, ''];
          }));
          const timer = Object.fromEntries(all('TIMER ').map((line) => { const v=fields(line); return [v.profile, v]; }));
          const service = Object.fromEntries(all('SERVICE ').map((line) => { const v=fields(line); return [v.profile, v]; }));
          const cycle = Object.fromEntries(all('CYCLE ').map((line) => { const v=fields(line); return [v.profile, v]; }));
          const tasks = all('TASK ').map((line) => fields(line));
          const paper = fields(find('PAPER_RUNTIME '));
          const ledger = fields(find('PAPER_LEDGER '));
          const natural = fields(find('PAPER_NATURAL '));
          const timersHealthy = ['forward','fast-historical','long-history'].every((p) => timer[p]?.enabled === 'enabled' && timer[p]?.active === 'active');
          const forwardTasks = tasks.filter((row) => row.profile === 'forward');
          const forwardProven = timer.forward?.last_trigger && !/^n\/a|^null|^$/.test(timer.forward.last_trigger)
            && cycle.forward?.present === 'true'
            && cycle.forward?.research_sha === process.env.RESEARCH_SHA
            && cycle.forward?.failed_count === '0'
            && forwardTasks.length === 2
            && forwardTasks.every((row) => ['success','blocked_data'].includes(row.status));
          const paperSafe = paper.present === 'true'
            && paper.live_trading === 'false'
            && paper.order_authority === 'false'
            && paper.private_request_count === '0'
            && paper.financial_mutation_count === '0'
            && paper.order_count === '0';
          const historicalComplete = cycle['fast-historical']?.present === 'true'
            && cycle['fast-historical']?.research_sha === process.env.RESEARCH_SHA
            && cycle['fast-historical']?.failed_count === '0';
          const historicalRunning = service['fast-historical']?.active === 'active' || service['fast-historical']?.sub === 'running';
          let naturalTrace = null;
          let naturalTraceError = natural.blocker ?? 'PAPER_NATURAL_EVIDENCE_UNAVAILABLE';
          if (natural.present === 'true' && natural.payload_base64) {
            try {
              const payload = JSON.parse(Buffer.from(natural.payload_base64, 'base64url').toString('utf8'));
              const payloadSafe = payload.externalFinancialMutationAllowed === false
                && payload.privateRequestCount === 0
                && payload.financialMutationCount === 0
                && payload.orderCount === 0
                && payload.liveTrading === false
                && payload.orderAuthority === false;
              if (!payloadSafe) throw new Error('PAPER_NATURAL_RUNTIME_SAFETY_CONTRACT_FAILED');
              const candidateTrace = buildNaturalPaperFirstZeroTraceFromRuntime(payload);
              if (candidateTrace.identity.runtimeSha !== process.env.RESEARCH_SHA) {
                throw new Error('PAPER_NATURAL_TARGET_RELEASE_IDENTITY_MISMATCH');
              }
              naturalTrace = candidateTrace;
              naturalTraceError = 'none';
            } catch (error) {
              naturalTraceError = String(error?.message ?? error).replace(/[\r\n]/g, '_').slice(0, 200);
            }
          }
          let status = 'failed';
          if (timersHealthy && forwardProven && paperSafe && historicalComplete) status = 'passed';
          else if (timersHealthy && forwardProven && paperSafe && historicalRunning) status = 'forward_pass_historical_running';
          else if (timersHealthy && forwardProven && paperSafe) status = 'forward_pass_historical_unproven';
          const out = process.env.GITHUB_OUTPUT;
          const writeOutput = (key, value) => {
            const safe = String(value ?? 'unknown').replace(/[\r\n]/g, '_').slice(0, 2000);
            fs.appendFileSync(out, `${key}=${safe}\n`);
          };
          fs.appendFileSync(out, `status=${status}\n`);
          fs.appendFileSync(out, `timers_healthy=${timersHealthy}\n`);
          fs.appendFileSync(out, `forward_proven=${forwardProven}\n`);
          fs.appendFileSync(out, `paper_safe=${paperSafe}\n`);
          fs.appendFileSync(out, `historical_complete=${historicalComplete}\n`);
          fs.appendFileSync(out, `historical_running=${historicalRunning}\n`);
          fs.appendFileSync(out, `paper_positions=${ledger.position_count ?? 'unknown'}\n`);
          fs.appendFileSync(out, `paper_settlements=${ledger.settlement_count ?? 'unknown'}\n`);
          writeOutput('natural_trace_status', naturalTrace?.status);
          writeOutput('natural_trace_error', naturalTraceError);
          writeOutput('natural_cycle_id', naturalTrace?.cycleId);
          writeOutput('natural_strategy_sha', naturalTrace?.identity.strategySha);
          writeOutput('natural_runtime_sha', naturalTrace?.identity.runtimeSha);
          writeOutput('natural_dataset_identity_sha256', naturalTrace ? natural.dataset_identity_sha256 : null);
          writeOutput('natural_identity_complete', naturalTrace?.identity.complete);
          writeOutput('natural_first_zero_stage', naturalTrace?.firstZeroStageName);
          writeOutput('natural_first_zero_reason', naturalTrace?.firstZeroReason);
          writeOutput('natural_first_zero_reason_evidence_status', naturalTrace?.firstZeroReasonEvidenceStatus);
          writeOutput('natural_measurement_source', naturalTrace?.runtimeAdapter.selectedMeasurementSource);
          const stageTrace = naturalTrace?.stages.map(({ stage, count, status: stageStatus }) => ({ stage, count, status: stageStatus })) ?? null;
          writeOutput('natural_stage_trace_base64', stageTrace == null ? null : Buffer.from(JSON.stringify(stageTrace), 'utf8').toString('base64url'));
          if (status === 'failed') process.exitCode = 1;
          NODE
        env:
          RESEARCH_SHA: ${{ steps.command.outputs.research_sha }}

      - name: Upload non-sensitive read-only evidence
        if: always() && steps.command.outcome == 'success' && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: research-production-natural-cycle-${{ steps.command.outputs.research_sha }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Report evidence to Central Hub
        if: always() && steps.command.outcome == 'success'
        uses: actions/github-script@v7
        env:
          RESEARCH_SHA: ${{ steps.command.outputs.research_sha }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          VERDICT_STATUS: ${{ steps.verdict.outputs.status }}
          TIMERS_HEALTHY: ${{ steps.verdict.outputs.timers_healthy }}
          FORWARD_PROVEN: ${{ steps.verdict.outputs.forward_proven }}
          PAPER_SAFE: ${{ steps.verdict.outputs.paper_safe }}
          HISTORICAL_COMPLETE: ${{ steps.verdict.outputs.historical_complete }}
          HISTORICAL_RUNNING: ${{ steps.verdict.outputs.historical_running }}
          PAPER_POSITIONS: ${{ steps.verdict.outputs.paper_positions }}
          PAPER_SETTLEMENTS: ${{ steps.verdict.outputs.paper_settlements }}
          NATURAL_TRACE_STATUS: ${{ steps.verdict.outputs.natural_trace_status }}
          NATURAL_TRACE_ERROR: ${{ steps.verdict.outputs.natural_trace_error }}
          NATURAL_CYCLE_ID: ${{ steps.verdict.outputs.natural_cycle_id }}
          NATURAL_STRATEGY_SHA: ${{ steps.verdict.outputs.natural_strategy_sha }}
          NATURAL_RUNTIME_SHA: ${{ steps.verdict.outputs.natural_runtime_sha }}
          NATURAL_DATASET_IDENTITY_SHA256: ${{ steps.verdict.outputs.natural_dataset_identity_sha256 }}
          NATURAL_IDENTITY_COMPLETE: ${{ steps.verdict.outputs.natural_identity_complete }}
          NATURAL_FIRST_ZERO_STAGE: ${{ steps.verdict.outputs.natural_first_zero_stage }}
          NATURAL_FIRST_ZERO_REASON: ${{ steps.verdict.outputs.natural_first_zero_reason }}
          NATURAL_FIRST_ZERO_REASON_EVIDENCE_STATUS: ${{ steps.verdict.outputs.natural_first_zero_reason_evidence_status }}
          NATURAL_MEASUREMENT_SOURCE: ${{ steps.verdict.outputs.natural_measurement_source }}
          NATURAL_STAGE_TRACE_BASE64: ${{ steps.verdict.outputs.natural_stage_trace_base64 }}
        with:
          script: |
            const measured = process.env.EVIDENCE_OUTCOME === 'success';
            const status = process.env.VERDICT_STATUS
              || (process.env.SOURCE_OUTCOME === 'success' ? 'evidence_unavailable' : 'preflight_failed');
            const observed = (value) => measured && value ? value : 'unknown';
            let naturalStageTrace = 'unknown';
            if (measured && process.env.NATURAL_STAGE_TRACE_BASE64 && process.env.NATURAL_STAGE_TRACE_BASE64 !== 'unknown') {
              try {
                const stages = JSON.parse(Buffer.from(process.env.NATURAL_STAGE_TRACE_BASE64, 'base64url').toString('utf8'));
                naturalStageTrace = stages.map((row) => `${row.stage}=${row.count ?? 'unknown'}(${row.status})`).join(',');
              } catch {}
            }
            const body = [
              '[RESEARCH_PRODUCTION_NATURAL_CYCLE_EVIDENCE]',
              `status: ${status}`,
              `research_sha: ${process.env.RESEARCH_SHA}`,
              `workflow_run: ${context.runId}`,
              `source_outcome: ${process.env.SOURCE_OUTCOME}`,
              `evidence_outcome: ${process.env.EVIDENCE_OUTCOME}`,
              `verdict_outcome: ${process.env.VERDICT_OUTCOME}`,
              `timers_healthy: ${observed(process.env.TIMERS_HEALTHY)}`,
              `first_natural_forward_proven: ${observed(process.env.FORWARD_PROVEN)}`,
              `paper_safety_proven: ${observed(process.env.PAPER_SAFE)}`,
              `fast_historical_complete: ${observed(process.env.HISTORICAL_COMPLETE)}`,
              `fast_historical_running: ${observed(process.env.HISTORICAL_RUNNING)}`,
              `paper_positions: ${observed(process.env.PAPER_POSITIONS)}`,
              `paper_settlements: ${observed(process.env.PAPER_SETTLEMENTS)}`,
              `natural_trace_status: ${observed(process.env.NATURAL_TRACE_STATUS)}`,
              `natural_trace_error: ${observed(process.env.NATURAL_TRACE_ERROR)}`,
              `natural_cycle_id: ${observed(process.env.NATURAL_CYCLE_ID)}`,
              `natural_strategy_sha: ${observed(process.env.NATURAL_STRATEGY_SHA)}`,
              `natural_runtime_sha: ${observed(process.env.NATURAL_RUNTIME_SHA)}`,
              `natural_dataset_identity_sha256: ${observed(process.env.NATURAL_DATASET_IDENTITY_SHA256)}`,
              `natural_identity_complete: ${observed(process.env.NATURAL_IDENTITY_COMPLETE)}`,
              `natural_measurement_source: ${observed(process.env.NATURAL_MEASUREMENT_SOURCE)}`,
              `natural_stage_trace: ${naturalStageTrace}`,
              `FIRST_ZERO_STAGE: ${observed(process.env.NATURAL_FIRST_ZERO_STAGE)}`,
              `FIRST_ZERO_REASON: ${observed(process.env.NATURAL_FIRST_ZERO_REASON)}`,
              `FIRST_ZERO_REASON_EVIDENCE_STATUS: ${observed(process.env.NATURAL_FIRST_ZERO_REASON_EVIDENCE_STATUS)}`,
              'server_files_written: 0',
              'server_files_deleted: 0',
              'server_processes_restarted: 0',
              'deployment_executed: 0',
              'database_changes: 0',
              'live_trading: false',
              'private_api: false',
              'order_authority: false',
              'real_order_count: 0',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 838,
              body,
            });
