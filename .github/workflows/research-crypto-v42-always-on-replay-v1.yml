name: Research Crypto V4.2 Always-On Replay V1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/always_on_portfolio_replay.py
      - market-prediction-lab/scripts/run-crypto-v42-always-on-replay-v1.py
      - .github/workflows/research-crypto-v42-always-on-replay-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-v42-always-on-replay-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "37420018782"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/always_on_portfolio_replay.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-v42-always-on-replay-v1.py
      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22"
      - name: Download frozen V4.2 evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: btc-alt-leadlag-extreme-v42-CRYPTO_*
          path: source-v42
      - name: Run always-on portfolio replay
        run: |
          python market-prediction-lab/scripts/run-crypto-v42-always-on-replay-v1.py \
            --input-root source-v42 \
            --out-dir market-prediction-lab/docs/crypto-v42-always-on-replay-v1
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-v42-always-on-replay-v1-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-v42-always-on-replay-v1
          if-no-files-found: error
          retention-days: 14
