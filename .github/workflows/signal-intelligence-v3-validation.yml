name: Signal Intelligence V3 Validation

on:
  pull_request:
    paths:
      - 'signal-intelligence-v3/**'
      - 'api-server/src/services/stock-signal-scanner.service.ts'
      - 'api-server/src/services/crypto-signal-scanner.service.ts'
      - 'api-server/src/services/scanner-*.service.ts'
      - 'api-server/src/providers/yahoo.ts'
      - 'market-prediction-lab/src/public-coverage-audit-v1.js'
      - '.github/workflows/signal-intelligence-v3-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-intelligence-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Signal Intelligence V3 tests
        run: node --test signal-intelligence-v3/tests/*.test.mjs
      - name: Verify release contract
        run: node signal-intelligence-v3/scripts/verify-contract.mjs
      - name: Exercise standalone cycle
        run: |
          mkdir -p "$RUNNER_TEMP/signal-intelligence-v3"
          node signal-intelligence-v3/scripts/run-cycle.mjs \
            --input signal-intelligence-v3/fixtures/contract-candidates.json \
            --output "$RUNNER_TEMP/signal-intelligence-v3/snapshot.json" \
            --telegram-events "$RUNNER_TEMP/signal-intelligence-v3/telegram-events.json"
          node - <<'NODE' "$RUNNER_TEMP/signal-intelligence-v3/snapshot.json"
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.safety.executionAuthority !== 'NONE') process.exit(1);
          if (p.lists.krBuy.length !== 1 || p.lists.usBuy.length !== 1 || p.lists.spotBuy.length !== 1) process.exit(1);
          if (p.lists.futuresLong.length !== 1 || p.lists.futuresShort.length !== 1) process.exit(1);
          NODE
      - name: Build immutable release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$RUNNER_TEMP/release/signal-intelligence-v3"
          cp -a signal-intelligence-v3/. "$RUNNER_TEMP/release/signal-intelligence-v3/"
          printf '%s\n' "$TARGET_SHA" > "$RUNNER_TEMP/release/SERVICE_SHA"
          printf '%s\n' 'executionAuthority=NONE' > "$RUNNER_TEMP/release/SAFETY"
          tar -C "$RUNNER_TEMP/release" -czf "$RUNNER_TEMP/signal-intelligence-v3-${TARGET_SHA}.tar.gz" .
          sha256sum "$RUNNER_TEMP/signal-intelligence-v3-${TARGET_SHA}.tar.gz" > "$RUNNER_TEMP/signal-intelligence-v3-${TARGET_SHA}.sha256"
      - name: Upload exact-head release artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/signal-intelligence-v3-*.tar.gz
            ${{ runner.temp }}/signal-intelligence-v3-*.sha256
            ${{ runner.temp }}/signal-intelligence-v3/snapshot.json
            ${{ runner.temp }}/signal-intelligence-v3/telegram-events.json
          retention-days: 30
          if-no-files-found: error
      - name: Assert exact revision
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Safety summary
        run: |
          echo 'executionAuthority=NONE'
          echo 'privateTradingApiAllowed=false'
          echo 'realOrderAllowed=false'
          echo 'AI promotion authority=false'
          echo 'AI leverage authority=false'

  producer-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle self-contained rolling public Scanner producer and diagnostics
        run: |
          mkdir -p api-server/.signal-intelligence
          BANNER='import { createRequire as __createRequire } from "node:module"; const require = __createRequire(import.meta.url);'
          pnpm --dir api-server exec esbuild ../signal-intelligence-v3/scripts/run-public-scanner-cycle.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --banner:js="$BANNER" \
            --outfile=./.signal-intelligence/public-cycle.mjs
          pnpm --dir api-server exec esbuild ../signal-intelligence-v3/scripts/diagnose-public-providers.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --banner:js="$BANNER" \
            --outfile=./.signal-intelligence/provider-diagnostic.mjs
          node --check api-server/.signal-intelligence/public-cycle.mjs
          node --check api-server/.signal-intelligence/provider-diagnostic.mjs
      - name: Assert producer has no private/order imports
        run: |
          ! grep -Eiq '(private[-_ ]?api|placeOrder|submitOrder|cancelOrder|withdraw|transfer)' signal-intelligence-v3/scripts/run-public-scanner-cycle.ts
          ! grep -Eiq '(private[-_ ]?api|placeOrder|submitOrder|cancelOrder|withdraw|transfer)' signal-intelligence-v3/scripts/diagnose-public-providers.ts
          grep -q 'public-only' signal-intelligence-v3/scripts/run-public-scanner-cycle.ts
      - name: Run one fresh public Scanner cycle
        working-directory: api-server
        env:
          SIGNAL_INTELLIGENCE_SERVICE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SIGNAL_INTELLIGENCE_STATE_DIR: ${{ runner.temp }}/signal-intelligence-live
          SIGNAL_INTELLIGENCE_STATE_FILE: ${{ runner.temp }}/signal-intelligence-live/latest-snapshot.json
          SIGNAL_INTELLIGENCE_PUBLIC_ONLY_UNIVERSE: 'true'
          LIVE_TRADING: 'false'
          PRIVATE_API_ENABLED: 'false'
          ORDER_AUTHORITY: 'false'
          SIGNAL_INTELLIGENCE_EXECUTION_AUTHORITY: NONE
        run: |
          node .signal-intelligence/public-cycle.mjs | tee "$RUNNER_TEMP/signal-intelligence-live-cycle.log"
          node .signal-intelligence/provider-diagnostic.mjs | tee "$RUNNER_TEMP/signal-intelligence-provider-diagnostic.json"
          node - <<'NODE' "$RUNNER_TEMP/signal-intelligence-provider-diagnostic.json"
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const gate=d.releaseReadiness;
          if (!gate || gate.ready!==false || gate.status!=='BLOCKED') process.exit(1);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Scanner product readiness: BLOCKED (contract tests only)\n\n'
            + gate.blockers.map(x=>'- '+x+'\n').join('')+'\n');
          console.log('SCANNER_PRODUCT_NOT_READY '+gate.blockers.join(','));
          NODE
          node - <<'NODE' "$SIGNAL_INTELLIGENCE_STATE_FILE"
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.serviceSha !== process.env.SIGNAL_INTELLIGENCE_SERVICE_SHA) process.exit(1);
          if (p.publicDataOnly !== true || p.safety?.executionAuthority !== 'NONE') process.exit(1);
          if (p.profile?.fullStrategyCoverage !== true) process.exit(1);
          if (!Array.isArray(p.coverage) || p.coverage.length !== 12) process.exit(1);
          const markets = ['KR_STOCK','US_STOCK','CRYPTO_SPOT','CRYPTO_FUTURES'];
          const strategies = ['SCALPING','SWING','MID_LONG'];
          for (const market of markets) {
            for (const strategy of strategies) {
              const matches = p.coverage.filter((row) => row.market === market && row.strategy === strategy);
              if (matches.length !== 1) process.exit(1);
            }
          }
          for (const row of p.coverage) {
            if (!['CANDIDATES_AVAILABLE','VALID_NO_TRADE','SEARCH_FAILURE','BLOCKED_DATA'].includes(row.status)) process.exit(1);
            const leverage = row.leverage;
            if (!leverage || !['evaluated','available','blocked','unavailable'].every((key) => Number.isInteger(leverage[key]) && leverage[key] >= 0)) process.exit(1);
            if (row.market !== 'CRYPTO_FUTURES' && leverage.evaluated !== 0) process.exit(1);
          }
          const krRows = p.coverage.filter((row) => row.market === 'KR_STOCK');
          if (krRows.length !== 3) process.exit(1);
          if (krRows.some((row) => row.status === 'SEARCH_FAILURE' || Number(row.providerErrors ?? 0) > 0 || Number(row.timeouts ?? 0) > 0)) process.exit(1);
          NODE
      - name: Build self-contained deploy artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$RUNNER_TEMP/deploy"
          cp api-server/.signal-intelligence/public-cycle.mjs "$RUNNER_TEMP/deploy/public-cycle.mjs"
          printf '%s\n' "$TARGET_SHA" > "$RUNNER_TEMP/deploy/SERVICE_SHA"
          sha256sum "$RUNNER_TEMP/deploy/public-cycle.mjs" > "$RUNNER_TEMP/deploy/public-cycle.sha256"
      - name: Upload fresh-public runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-public-cycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/signal-intelligence-live/latest-snapshot.json
            ${{ runner.temp }}/signal-intelligence-live/cycle-state.json
            ${{ runner.temp }}/signal-intelligence-live-cycle.log
            ${{ runner.temp }}/signal-intelligence-provider-diagnostic.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload self-contained deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-deploy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/deploy
          retention-days: 30
          if-no-files-found: error

  # Exact-member-timeframe smoke. This is separate from the canonical 15m/60m
  # research service and cannot assert authenticated UI, Williams overlay,
  # 24h whole-universe coverage, Paper, profitability or any trade authority.
  member-timeframe-public-qa:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'drift/scanner-stock-roster-v3-integration-20261011' }}
    needs: producer-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download exact-head read-only producer
        uses: actions/download-artifact@v4
        with:
          name: signal-intelligence-v3-deploy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/member-timeframe
      - name: Run bounded member-timeframe 5m 4H 1D public-only scanner
        env:
          SIGNAL_INTELLIGENCE_SERVICE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SIGNAL_INTELLIGENCE_STATE_DIR: ${{ runner.temp }}/signal-intelligence-member-qa
          SIGNAL_INTELLIGENCE_STATE_FILE: ${{ runner.temp }}/signal-intelligence-member-qa/latest-snapshot.json
          SIGNAL_INTELLIGENCE_PUBLIC_PROFILE_MODE: MEMBER_UI
          SIGNAL_INTELLIGENCE_MEMBER_UI_QA: 'true'
          SIGNAL_INTELLIGENCE_PUBLIC_ONLY_UNIVERSE: 'true'
          LIVE_TRADING: 'false'
          PRIVATE_API_ENABLED: 'false'
          ORDER_AUTHORITY: 'false'
          SIGNAL_INTELLIGENCE_EXECUTION_AUTHORITY: NONE
        run: |
          set -Eeuo pipefail
          test "$(cat "$RUNNER_TEMP/member-timeframe/SERVICE_SHA")" = "$SIGNAL_INTELLIGENCE_SERVICE_SHA"
          node "$RUNNER_TEMP/member-timeframe/public-cycle.mjs" | tee "$RUNNER_TEMP/member-timeframe-public-cycle.log"
          node - <<'NODE' "$SIGNAL_INTELLIGENCE_STATE_FILE"
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(data.serviceSha!==process.env.SIGNAL_INTELLIGENCE_SERVICE_SHA
            || data.publicDataOnly!==true
            || data.safety?.executionAuthority!=='NONE'
            || data.profile?.surface!=='MEMBER_UI'
            || JSON.stringify(data.profile.timeframes)!==JSON.stringify(['5m','4H','1D'])
            || data.coverage?.length!==12
            || data.coverage.some(x=>!['CANDIDATES_AVAILABLE','VALID_NO_TRADE','SEARCH_FAILURE','BLOCKED_DATA'].includes(x.status)))
            process.exit(1);
          const summary=data.coverage.map(x=>({market:x.market,strategy:x.strategy,timeframe:x.timeframe,status:x.status,providerErrors:x.providerErrors,timeouts:x.timeouts,insufficientDataCount:x.insufficientDataCount}));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Member timeframes: read-only first-page QA (not app acceptance)\\n\\n'
            + 'Status: not certified for deployment\\n');
          console.log(JSON.stringify({memberTimeframeProbeOnly:true,fullMarketVerified:false,memberAuthVerified:false,summary},null,2));
          NODE
      - name: Upload member-timeframe observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-member-timeframe-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/signal-intelligence-member-qa/latest-snapshot.json
            ${{ runner.temp }}/signal-intelligence-member-qa/cycle-state.json
            ${{ runner.temp }}/member-timeframe-public-cycle.log
          retention-days: 30
          if-no-files-found: warn


  source-capabilities-public-qa:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'drift/scanner-stock-roster-v3-integration-20261011' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Exact revision checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run small offline contracts
        run: node --test signal-intelligence-v3/tests/public-stock-source-capabilities.test.mjs
      - name: Run public KR alpha daily normalization offline contract
        run: node --test signal-intelligence-v3/tests/public-kr-alpha-daily.test.mjs
      - name: Exercise one public KR alphanumeric daily source, no redistributable data
        run: |
          node signal-intelligence-v3/scripts/diagnose-kr-alpha-daily.mjs > "$RUNNER_TEMP/public-kr-alpha-daily.json"
          node - <<'NODE' "$RUNNER_TEMP/public-kr-alpha-daily.json"
          const fs=require('node:fs');
          const evidence=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(evidence.executionAuthority!=='NONE'||evidence.wholeKrMarketProven!==false
            ||evidence.licensedMarketRedistribution!==false
            ||evidence.intradayAlphanumericSupported!==false)process.exit(1);
          console.log('KR_ALPHA_DAILY_CANARY '+evidence.alphanumericDailyCanary.result+' reason='+(evidence.alphanumericDailyCanary.reason??'NONE'));
          console.log('KR_ALPHA_DAILY_SOURCE_SHAPE '+JSON.stringify(evidence.sourceShapeIntegrity??null));
          NODE
      - name: Verify one-session 1m and derived 5m strict source contracts
        run: node --test signal-intelligence-v3/tests/public-kr-alpha-intraday.test.mjs
      - name: Diagnose one alphanumeric ETF minute feed without activating app
        run: |
          node signal-intelligence-v3/scripts/diagnose-kr-alpha-intraday.mjs > "$RUNNER_TEMP/public-kr-alpha-intraday.json"
          node - <<'NODE' "$RUNNER_TEMP/public-kr-alpha-intraday.json"
          const fs=require('node:fs');
          const o=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(o.executionAuthority!=='NONE'||o.productionActivated!==false
            ||o.fullEligibleRosterVerified!==false||o.noOrderApis!==true)
            process.exit(1);
          console.log('KR_ALPHA_1M5M_PROBE '+JSON.stringify(o.firstSessionProbe));
          NODE
      - name: Diagnose a few public read-only sources, never promote result
        run: |
          node signal-intelligence-v3/scripts/diagnose-stock-source-capabilities.mjs > "$RUNNER_TEMP/public-stock-sources.json"
          node - <<'NODE' "$RUNNER_TEMP/public-stock-sources.json"
          const fs=require('node:fs');
          const file=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(file.executionAuthority!=='NONE'||file.licensedForPublicRedistribution!==false
            ||file.fullMarketCoverageProven!==false||file.samples?.length!==11)process.exit(1);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Public stock source capacity probe (NOT release approval)\n\n'
            +file.samples.map(s=>'- '+s.id+': '+s.status+' (HTTP '+(s.httpStatus??'?')+')\n').join('')+'\n');
          console.log(file.samples.map(s=>JSON.stringify({
            id:s.id,status:s.status,count:s.discoveredCount??null,
            rootKeys:s.rootKeys??[],firstDailyRowKeys:s.firstDailyRowKeys??[],distinctTradingDates:s.distinctTradingDates??null,dailyTimestampFormat:s.dailyTimestampFormat??null,dailyValueTypes:s.dailyValueTypes??null
          })).join('\n'));
          NODE
      - name: Upload bounded diagnostic metadata only
        uses: actions/upload-artifact@v4
        with:
          name: public-stock-source-capabilities-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/public-stock-sources.json
          retention-days: 7
          if-no-files-found: error
