name: Signal Intelligence V3 Validation

on:
  pull_request:
    paths:
      - 'signal-intelligence-v3/**'
      - 'api-server/src/services/stock-signal-scanner.service.ts'
      - 'api-server/src/services/crypto-signal-scanner.service.ts'
      - 'api-server/src/services/scanner-*.service.ts'
      - 'api-server/src/providers/yahoo.ts'
      - 'market-prediction-lab/src/public-coverage-audit-v1.js'
      - '.github/workflows/signal-intelligence-v3-validation.yml'
  workflow_dispatch:
    inputs:
      bitget_history_probe_only:
        description: 'Run only bounded public Bitget Download Center and BTCUSDT history readiness probes'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signal-intelligence-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.bitget_history_probe_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Signal Intelligence V3 tests
        run: node --test signal-intelligence-v3/tests/*.test.mjs
      - name: Verify release contract
        run: node signal-intelligence-v3/scripts/verify-contract.mjs
      - name: Exercise standalone cycle
        run: |
          mkdir -p "$RUNNER_TEMP/signal-intelligence-v3"
          node signal-intelligence-v3/scripts/run-cycle.mjs \
            --input signal-intelligence-v3/fixtures/contract-candidates.json \
            --output "$RUNNER_TEMP/signal-intelligence-v3/snapshot.json" \
            --telegram-events "$RUNNER_TEMP/signal-intelligence-v3/telegram-events.json"
          node - <<'NODE' "$RUNNER_TEMP/signal-intelligence-v3/snapshot.json"
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.safety.executionAuthority !== 'NONE') process.exit(1);
          if (p.lists.krBuy.length !== 1 || p.lists.usBuy.length !== 1 || p.lists.spotBuy.length !== 1) process.exit(1);
          if (p.lists.futuresLong.length !== 1 || p.lists.futuresShort.length !== 1) process.exit(1);
          NODE
      - name: Build immutable release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$RUNNER_TEMP/release/signal-intelligence-v3"
          cp -a signal-intelligence-v3/. "$RUNNER_TEMP/release/signal-intelligence-v3/"
          printf '%s\n' "$TARGET_SHA" > "$RUNNER_TEMP/release/SERVICE_SHA"
          printf '%s\n' 'executionAuthority=NONE' > "$RUNNER_TEMP/release/SAFETY"
          tar -C "$RUNNER_TEMP/release" -czf "$RUNNER_TEMP/signal-intelligence-v3-${TARGET_SHA}.tar.gz" .
          sha256sum "$RUNNER_TEMP/signal-intelligence-v3-${TARGET_SHA}.tar.gz" > "$RUNNER_TEMP/signal-intelligence-v3-${TARGET_SHA}.sha256"
      - name: Upload exact-head release artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/signal-intelligence-v3-*.tar.gz
            ${{ runner.temp }}/signal-intelligence-v3-*.sha256
            ${{ runner.temp }}/signal-intelligence-v3/snapshot.json
            ${{ runner.temp }}/signal-intelligence-v3/telegram-events.json
          retention-days: 30
          if-no-files-found: error
      - name: Assert exact revision
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Safety summary
        run: |
          echo 'executionAuthority=NONE'
          echo 'privateTradingApiAllowed=false'
          echo 'realOrderAllowed=false'
          echo 'AI promotion authority=false'
          echo 'AI leverage authority=false'

  producer-bundle:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.bitget_history_probe_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle self-contained rolling public Scanner producer and diagnostics
        run: |
          mkdir -p api-server/.signal-intelligence
          BANNER='import { createRequire as __createRequire } from "node:module"; const require = __createRequire(import.meta.url);'
          pnpm --dir api-server exec esbuild ../signal-intelligence-v3/scripts/run-public-scanner-cycle.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --banner:js="$BANNER" \
            --outfile=./.signal-intelligence/public-cycle.mjs
          pnpm --dir api-server exec esbuild ../signal-intelligence-v3/scripts/diagnose-public-providers.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --banner:js="$BANNER" \
            --outfile=./.signal-intelligence/provider-diagnostic.mjs
          pnpm --dir api-server exec esbuild ../signal-intelligence-v3/scripts/run-four-market-live-qa.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --banner:js="$BANNER" \
            --outfile=./.signal-intelligence/four-market-live-qa.mjs
          node --check api-server/.signal-intelligence/public-cycle.mjs
          node --check api-server/.signal-intelligence/provider-diagnostic.mjs
          node --check api-server/.signal-intelligence/four-market-live-qa.mjs
      - name: Assert producer has no private/order imports
        run: |
          ! grep -Eiq '(private[-_ ]?api|placeOrder|submitOrder|cancelOrder|withdraw|transfer)' signal-intelligence-v3/scripts/run-public-scanner-cycle.ts
          ! grep -Eiq '(private[-_ ]?api|placeOrder|submitOrder|cancelOrder|withdraw|transfer)' signal-intelligence-v3/scripts/diagnose-public-providers.ts
          ! grep -Eiq '(private[-_ ]?api|placeOrder|submitOrder|cancelOrder|withdraw|transfer)' signal-intelligence-v3/scripts/run-four-market-live-qa.ts
          grep -q 'public-only' signal-intelligence-v3/scripts/run-public-scanner-cycle.ts
      - name: Run one fresh public Scanner cycle
        working-directory: api-server
        env:
          SIGNAL_INTELLIGENCE_SERVICE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SIGNAL_INTELLIGENCE_STATE_DIR: ${{ runner.temp }}/signal-intelligence-live
          SIGNAL_INTELLIGENCE_STATE_FILE: ${{ runner.temp }}/signal-intelligence-live/latest-snapshot.json
          SIGNAL_INTELLIGENCE_PUBLIC_ONLY_UNIVERSE: 'true'
          LIVE_TRADING: 'false'
          PRIVATE_API_ENABLED: 'false'
          ORDER_AUTHORITY: 'false'
          SIGNAL_INTELLIGENCE_EXECUTION_AUTHORITY: NONE
        run: |
          node .signal-intelligence/public-cycle.mjs | tee "$RUNNER_TEMP/signal-intelligence-live-cycle.log"
          node .signal-intelligence/provider-diagnostic.mjs | tee "$RUNNER_TEMP/signal-intelligence-provider-diagnostic.json"
          node - <<'NODE' "$SIGNAL_INTELLIGENCE_STATE_FILE"
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.serviceSha !== process.env.SIGNAL_INTELLIGENCE_SERVICE_SHA) process.exit(1);
          if (p.publicDataOnly !== true || p.safety?.executionAuthority !== 'NONE') process.exit(1);
          if (p.profile?.fullStrategyCoverage !== true) process.exit(1);
          if (!Array.isArray(p.coverage) || p.coverage.length !== 12) process.exit(1);
          const markets = ['KR_STOCK','US_STOCK','CRYPTO_SPOT','CRYPTO_FUTURES'];
          const strategies = ['SCALPING','SWING','MID_LONG'];
          for (const market of markets) {
            for (const strategy of strategies) {
              const matches = p.coverage.filter((row) => row.market === market && row.strategy === strategy);
              if (matches.length !== 1) process.exit(1);
            }
          }
          for (const row of p.coverage) {
            if (!['CANDIDATES_AVAILABLE','VALID_NO_TRADE','SEARCH_FAILURE','BLOCKED_DATA','BLOCKED_PROVIDER'].includes(row.status)) process.exit(1);
            const leverage = row.leverage;
            if (!leverage || !['evaluated','available','blocked','unavailable'].every((key) => Number.isInteger(leverage[key]) && leverage[key] >= 0)) process.exit(1);
            if (row.market !== 'CRYPTO_FUTURES' && leverage.evaluated !== 0) process.exit(1);
          }
          const krRows = p.coverage.filter((row) => row.market === 'KR_STOCK');
          if (krRows.length !== 3) process.exit(1);
          if (krRows.some((row) => row.status === 'SEARCH_FAILURE' || Number(row.providerErrors ?? 0) > 0 || Number(row.timeouts ?? 0) > 0)) process.exit(1);
          for (const row of p.coverage.filter((item) => item.status === 'BLOCKED_PROVIDER')) {
            if (row.blockReason !== 'YAHOO_USAGE_TERMS_NOT_CONFIRMED' || row.pageExecution?.startedCount !== 0) process.exit(1);
          }
          NODE
      - name: Run full Upbit and Bitget cursor rotations with restart evidence
        working-directory: api-server
        env:
          SIGNAL_INTELLIGENCE_SERVICE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SIGNAL_INTELLIGENCE_STATE_DIR: ${{ runner.temp }}/signal-intelligence-crypto-rotation
          SIGNAL_INTELLIGENCE_STATE_FILE: ${{ runner.temp }}/signal-intelligence-crypto-rotation/latest-snapshot.json
          SIGNAL_INTELLIGENCE_CRYPTO_ROTATION_EVIDENCE_FILE: ${{ runner.temp }}/signal-intelligence-crypto-rotation/full-rotation-evidence.json
          SIGNAL_INTELLIGENCE_CRYPTO_ROTATION_ONLY: 'true'
          SIGNAL_INTELLIGENCE_PUBLIC_ONLY_UNIVERSE: 'true'
          LIVE_TRADING: 'false'
          PRIVATE_API_ENABLED: 'false'
          ORDER_AUTHORITY: 'false'
          SIGNAL_INTELLIGENCE_EXECUTION_AUTHORITY: NONE
        run: |
          set -Eeuo pipefail
          mkdir -p "$SIGNAL_INTELLIGENCE_STATE_DIR"
          : > "$RUNNER_TEMP/signal-intelligence-crypto-rotation.log"
          complete=false
          for ((cycle=1; cycle<=90; cycle+=1)); do
            node .signal-intelligence/public-cycle.mjs >> "$RUNNER_TEMP/signal-intelligence-crypto-rotation.log"
            if node - <<'NODE' "$SIGNAL_INTELLIGENCE_CRYPTO_ROTATION_EVIDENCE_FILE" "$cycle"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const compact = Object.fromEntries(Object.entries(report.markets).map(([market, row]) => [market, {
            universe: row.totalUniverse,
            attempted: row.minimumUniqueAttemptedAcrossLanes,
            success: row.minimumUniqueSuccessAcrossLanes,
            complete: row.fullCursorRotationComplete,
          }]));
          console.log(JSON.stringify({ cycle: Number(process.argv[3]), markets: compact,
            retries: report.networkTelemetry.retryCount ?? 0 }));
          process.exit(report.rotationComplete === true ? 0 : 1);
          NODE
            then
              complete=true
              break
            fi
          done
          test "$complete" = true
          node - <<'NODE' "$SIGNAL_INTELLIGENCE_CRYPTO_ROTATION_EVIDENCE_FILE"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.serviceSha !== process.env.SIGNAL_INTELLIGENCE_SERVICE_SHA
            || report.rotationComplete !== true || report.publicDataOnly !== true
            || report.executionAuthority !== 'NONE' || report.orderSubmitted !== false
            || report.privateTradingApiAllowed !== false) process.exit(1);
          if (report.processRestartTransitions !== report.runCount - 1 || report.processRestartTransitions < 1) process.exit(1);
          const laneIds = [
            'SPOT_SCALPING_15M','SPOT_SWING_4H','SPOT_MID_LONG_4H',
            'FUTURES_SCALPING_5M','FUTURES_SWING_60M','FUTURES_MID_LONG_4H',
          ];
          for (const laneId of laneIds) {
            const lane = report.lanes[laneId];
            if (!lane || lane.fullCursorRotationComplete !== true || lane.totalUniverse <= 0
              || lane.uniqueAttemptedCount !== lane.totalUniverse
              || lane.cursorContinuityFailures !== 0
              || !/^[a-f0-9]{64}$/.test(lane.rosterId)) process.exit(1);
            if (lane.failureDetailCount !== lane.failureCount
              || lane.failureUnattributedCount !== 0
              || !Array.isArray(lane.failureDetails)
              || lane.failureDetails.length !== lane.failureCount) process.exit(1);
            for (const failure of lane.failureDetails) {
              if (!failure.symbol || !failure.reason || !failure.message
                || failure.market !== lane.market || failure.timeframe !== lane.timeframe
                || failure.rosterId !== lane.rosterId || !failure.sourceCycleId
                || !Number.isSafeInteger(failure.cursorBefore)
                || !Number.isSafeInteger(failure.cursorAfter)) process.exit(1);
            }
          }
          for (const market of ['CRYPTO_SPOT','CRYPTO_FUTURES']) {
            const row = report.markets[market];
            if (!row || row.laneCount !== 3 || row.fullCursorRotationComplete !== true
              || row.minimumUniqueAttemptedAcrossLanes !== row.totalUniverse) process.exit(1);
          }
          NODE
      - name: Build self-contained deploy artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$RUNNER_TEMP/deploy"
          cp api-server/.signal-intelligence/public-cycle.mjs "$RUNNER_TEMP/deploy/public-cycle.mjs"
          printf '%s\n' "$TARGET_SHA" > "$RUNNER_TEMP/deploy/SERVICE_SHA"
          sha256sum "$RUNNER_TEMP/deploy/public-cycle.mjs" > "$RUNNER_TEMP/deploy/public-cycle.sha256"
      - name: Upload fresh-public runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-public-cycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/signal-intelligence-live/latest-snapshot.json
            ${{ runner.temp }}/signal-intelligence-live/cycle-state.json
            ${{ runner.temp }}/signal-intelligence-live-cycle.log
            ${{ runner.temp }}/signal-intelligence-provider-diagnostic.json
            ${{ runner.temp }}/signal-intelligence-crypto-rotation/full-rotation-evidence.json
            ${{ runner.temp }}/signal-intelligence-crypto-rotation/cycle-state.json
            ${{ runner.temp }}/signal-intelligence-crypto-rotation/latest-snapshot.json
            ${{ runner.temp }}/signal-intelligence-crypto-rotation.log
          retention-days: 30
          if-no-files-found: error
      - name: Upload self-contained deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-intelligence-v3-deploy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/deploy
          retention-days: 30
          if-no-files-found: error

  bitget-history-probe:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.bitget_history_probe_only == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium
      - name: Probe the intended Futures Depth download UI once
        working-directory: stock-analyzer
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/bitget-history-probe
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          pnpm exec node --input-type=module - <<'NODE'
          import { chromium } from '@playwright/test';
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const pageUrl = 'https://www.bitget.com/data-download';
          const evidenceDir = process.env.EVIDENCE_DIR;
          const observed = [];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            acceptDownloads: false,
            locale: 'en-US',
            timezoneId: 'UTC',
          });
          const page = await context.newPage();
          page.on('response', (response) => {
            try {
              const url = new URL(response.url());
              if (url.hostname === 'bitget.com' || url.hostname.endsWith('.bitget.com')) {
                observed.push({
                  url: url.href,
                  status: response.status(),
                  contentType: response.headers()['content-type'] ?? null,
                });
              }
            } catch {}
          });

          const navigation = await page.goto(pageUrl, { waitUntil: 'domcontentloaded', timeout: 60_000 });
          await page.waitForLoadState('networkidle', { timeout: 20_000 }).catch(() => {});
          const before = await page.locator('a,button,[role="button"]').evaluateAll((nodes) => nodes.map((node, index) => ({
            index,
            tag: node.tagName,
            text: (node.textContent ?? '').replace(/\s+/gu, ' ').trim().slice(0, 300),
            href: node instanceof HTMLAnchorElement ? node.href : null,
            download: node instanceof HTMLAnchorElement ? node.download || null : null,
            disabled: 'disabled' in node ? Boolean(node.disabled) : null,
          })).filter((row) => row.text || row.href));

          const downloadControls = page.locator('a,button,[role="button"]').filter({ hasText: /^\s*Download\s*$/i });
          const downloadControlCount = await downloadControls.count();
          const overlaysBefore = await page.locator('.mcr-modal-wrap,[role="dialog"]').evaluateAll((nodes) => nodes.map((node) => ({
            text: (node.textContent ?? '').replace(/\s+/gu, ' ').trim().slice(0, 2_000),
            controls: [...node.querySelectorAll('a,button,[role="button"]')].map((control) => ({
              tag: control.tagName,
              text: (control.textContent ?? '').replace(/\s+/gu, ' ').trim().slice(0, 300),
              href: control instanceof HTMLAnchorElement ? control.href : null,
            })).filter((row) => row.text || row.href),
          })));
          const restrictedIpDeclarationRequired = overlaysBefore.some((row) => /Restricted IP/iu.test(row.text));
          let interaction = { attempted: false, selectedIndex: null, overlaysBefore, download: null, popup: null, error: null };
          if (downloadControlCount > 0 && !restrictedIpDeclarationRequired) {
            const selectedIndex = downloadControlCount - 1;
            interaction = { ...interaction, attempted: true, selectedIndex };
            const downloadPromise = page.waitForEvent('download', { timeout: 8_000 }).catch(() => null);
            const popupPromise = page.waitForEvent('popup', { timeout: 8_000 }).catch(() => null);
            try {
              await downloadControls.nth(selectedIndex).click({ timeout: 15_000 });
              const [download, popup] = await Promise.all([downloadPromise, popupPromise]);
              if (download) {
                interaction.download = {
                  url: download.url(),
                  suggestedFilename: download.suggestedFilename(),
                  cancelledBeforeBodyPersistence: true,
                };
                await download.cancel();
              }
              if (popup) {
                await popup.waitForLoadState('domcontentloaded', { timeout: 20_000 }).catch(() => {});
                interaction.popup = { url: popup.url(), title: await popup.title() };
                await popup.close();
              }
            } catch (error) {
              interaction.error = String(error?.message ?? error).slice(0, 1_000);
            }
          }
          await page.waitForTimeout(2_000);
          const after = {
            url: page.url(),
            title: await page.title(),
            bodyText: (await page.locator('body').innerText()).replace(/\s+/gu, ' ').trim().slice(0, 20_000),
            dialogs: await page.locator('[role="dialog"]').allInnerTexts(),
            controls: await page.locator('input,select,option,a,button,[role="button"]').evaluateAll((nodes) => nodes.map((node, index) => ({
              index,
              tag: node.tagName,
              type: node.getAttribute('type'),
              name: node.getAttribute('name'),
              value: 'value' in node ? String(node.value).slice(0, 300) : null,
              text: (node.textContent ?? '').replace(/\s+/gu, ' ').trim().slice(0, 300),
              href: node instanceof HTMLAnchorElement ? node.href : null,
              download: node instanceof HTMLAnchorElement ? node.download || null : null,
            })).filter((row) => row.text || row.href || row.name || row.value)),
          };
          await page.screenshot({ path: path.join(evidenceDir, 'bitget-history-probe.png'), fullPage: true });
          await browser.close();

          const dedupedResponses = [...new Map(observed.map((row) => [`${row.status}:${row.url}`, row])).values()];
          const responseIdentity = createHash('sha256')
            .update(JSON.stringify(dedupedResponses))
            .digest('hex');
          const relevantResponses = dedupedResponses.filter((row) => /download|depth|history/iu.test(row.url));
          const report = {
            schemaVersion: 'bitget-public-history-ui-probe-v1',
            serviceSha: process.env.EXPECTED_SHA,
            generatedAt: new Date().toISOString(),
            pageUrl,
            navigation: {
              status: navigation?.status() ?? null,
              finalUrl: pageUrl,
            },
            downloadControlCount,
            outcome: restrictedIpDeclarationRequired
              ? 'BLOCKED_GEO_DECLARATION_REQUIRED'
              : interaction.download || interaction.popup || after.url !== pageUrl
                ? 'DOWNLOAD_PATH_REACHED'
                : 'DOWNLOAD_PATH_NOT_REACHED',
            before,
            interaction,
            after,
            observedResponses: dedupedResponses,
            responseIdentity,
            safety: {
              publicUiOnly: true,
              singleDownloadControlInteraction: true,
              restrictedIpDeclarationAccepted: false,
              downloadedBodyPersisted: false,
              credentialsRead: false,
              privateApiUsed: false,
              orderSubmitted: false,
            },
          };
          await writeFile(path.join(evidenceDir, 'bitget-history-probe.json'), `${JSON.stringify(report, null, 2)}\n`, { flag: 'wx' });
          console.log(JSON.stringify({
            serviceSha: report.serviceSha,
            navigationStatus: report.navigation.status,
            downloadControlCount,
            outcome: report.outcome,
            interaction,
            observedResponseCount: dedupedResponses.length,
            relevantResponses,
            pageBodyExcerpt: after.bodyText.slice(0, 4_000),
            responseIdentity,
          }, null, 2));
          if (report.navigation.status !== 200 || downloadControlCount < 6
              || (restrictedIpDeclarationRequired && interaction.attempted)) process.exit(1);
          NODE
      - name: Collect BTCUSDT 730-day public REST evidence without imputing Depth or OI history
        working-directory: market-prediction-lab
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/bitget-history-probe
        run: |
          set -Eeuo pipefail
          pnpm exec node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { BitgetPublicClient } from './src/bitget-public-client.js';
          import {
            collectBitgetCandles,
            collectBitgetFuturesContext,
            collectBitgetFuturesReferenceCandles,
          } from './src/bitget-candle-collector.js';
          import {
            collectFundingRateHistory,
            createTemporalDerivativesProvider,
            summarizeTemporalCoverage,
          } from './src/derivatives-history.js';
          import {
            APPROVED_LIQUIDATION_RISK_MODEL_V1,
            CRYPTO_FUTURES_DERIVATIVES_REQUIRED_EVIDENCE,
          } from './src/crypto-futures-derivatives-evidence-contract-v1.js';

          const HOUR_MS = 60 * 60_000;
          const endTime = Math.floor(Date.now() / HOUR_MS) * HOUR_MS;
          const startTime = endTime - 730 * 24 * HOUR_MS;
          const symbol = 'BTCUSDT';
          const productType = 'usdt-futures';
          let requestCount = 0;
          const baseClient = new BitgetPublicClient({ minIntervalMs: 150, maxRetries: 4, timeoutMs: 15_000 });
          const client = { get: async (...args) => { requestCount += 1; return await baseClient.get(...args); } };
          const digest = (value) => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const summarizeCandles = (series) => {
            let missingIntervals = 0;
            for (let index = 1; index < series.length; index += 1) {
              const delta = series[index].timestamp - series[index - 1].timestamp;
              if (delta > HOUR_MS) missingIntervals += Math.floor(delta / HOUR_MS) - 1;
            }
            return {
              count: series.length,
              firstTimestamp: series[0]?.timestamp ?? null,
              lastTimestamp: series.at(-1)?.timestamp ?? null,
              missingIntervals,
              duplicateTimestamps: series.length - new Set(series.map((row) => row.timestamp)).size,
              sha256: digest(series),
            };
          };

          const [market, mark, index, funding, context] = await Promise.all([
            collectBitgetCandles({ client, market: 'CRYPTO_FUTURES', symbol, timeframe: '1h', startTime, endTime, maxCandles: 20_000 }),
            collectBitgetFuturesReferenceCandles({ client, priceType: 'mark', symbol, timeframe: '1h', startTime, endTime, maxCandles: 20_000 }),
            collectBitgetFuturesReferenceCandles({ client, priceType: 'index', symbol, timeframe: '1h', startTime, endTime, maxCandles: 20_000 }),
            collectFundingRateHistory({ client, symbol, startTime, endTime, productType, maxPages: 50 }),
            collectBitgetFuturesContext({ client, symbol, productType }),
          ]);
          const marketSummary = summarizeCandles(market.candles);
          const markSummary = summarizeCandles(mark.candles);
          const indexSummary = summarizeCandles(index.candles);
          const markTimes = new Set(mark.candles.map((row) => row.timestamp));
          const indexTimes = new Set(index.candles.map((row) => row.timestamp));
          const alignedMarketMarkIndexCount = market.candles.filter((row) => markTimes.has(row.timestamp) && indexTimes.has(row.timestamp)).length;
          const temporalFunding = createTemporalDerivativesProvider({ fundingHistory: funding.records });
          const fundingCoverage = summarizeTemporalCoverage(market.candles.map((row) => temporalFunding({ anchorTimestamp: row.timestamp })));
          const fundingSummary = {
            count: funding.records.length,
            firstTimestamp: funding.records[0]?.timestamp ?? null,
            lastTimestamp: funding.records.at(-1)?.timestamp ?? null,
            observedSpanDays: funding.records.length < 2
              ? 0
              : (funding.records.at(-1).timestamp - funding.records[0].timestamp) / (24 * HOUR_MS),
            exhausted: funding.exhausted,
            sha256: digest(funding.records),
            alignedCandleCoverage: fundingCoverage,
          };
          const candlesComplete730Days = [marketSummary, markSummary, indexSummary]
            .every((row) => row.firstTimestamp <= startTime + HOUR_MS && row.lastTimestamp >= endTime - HOUR_MS);
          const fundingComplete730Days = fundingSummary.firstTimestamp !== null
            && fundingSummary.firstTimestamp <= startTime + 12 * HOUR_MS
            && fundingSummary.lastTimestamp >= endTime - 12 * HOUR_MS;
          const blockers = [
            'BITGET_FUTURES_DEPTH_DOWNLOAD_GEO_DECLARATION_REQUIRED',
            'BITGET_HISTORICAL_TRADE_SERIES_NOT_ACQUIRED',
            ...(!fundingComplete730Days ? ['BITGET_FUNDING_730D_INCOMPLETE'] : []),
            'BITGET_HISTORICAL_OPEN_INTEREST_SERIES_MISSING',
            'POINT_IN_TIME_POSITION_TIER_HISTORY_REQUIRED',
            ...(APPROVED_LIQUIDATION_RISK_MODEL_V1 === null ? ['APPROVED_LIQUIDATION_RISK_MODEL_MISSING'] : []),
          ];
          const report = {
            schemaVersion: 'bitget-btcusdt-public-history-readiness-v1',
            serviceSha: process.env.EXPECTED_SHA,
            generatedAt: new Date().toISOString(),
            lane: 'CRYPTO_FUTURES:SCANNER_SWING_60M',
            strategyTimeframe: '60m',
            providerTimeframe: '1h',
            symbol,
            productType: 'USDT-FUTURES',
            requestedPeriod: {
              startTime,
              startTimeIso: new Date(startTime).toISOString(),
              endTime,
              endTimeIso: new Date(endTime).toISOString(),
              days: 730,
            },
            publicRest: {
              host: 'api.bitget.com',
              requestCount,
              marketCandles: marketSummary,
              markCandles: markSummary,
              indexCandles: indexSummary,
              alignedMarketMarkIndexCount,
              funding: fundingSummary,
              currentOpenInterest: {
                value: context.openInterest,
                observedAt: context.openInterestTimestamp,
                historicalObservationCountCredited: 0,
              },
              currentFunding: {
                value: context.fundingRate,
                intervalHours: context.fundingIntervalHours,
              },
              candlesComplete730Days,
              fundingComplete730Days,
            },
            downloadCenter: {
              host: 'www.bitget.com',
              siteAdvertisesRecentYearsForFuturesDepth: true,
              btcUsdt730DayDepthAvailabilityVerified: false,
              freeDownloadVerified: false,
              downloadSpecificUsePermissionVerified: false,
              fileFormat: null,
              samplingInterval: null,
              missingRate: null,
              bidAskTimestampIntegrity: null,
              historicalDepthRowsAcquired: 0,
              historicalTradesAcquired: 0,
              rawFilesPersistedOrUploaded: false,
              status: 'BLOCKED_GEO_DECLARATION_REQUIRED',
              termsReviewStatus: 'OWNER_LEGAL_REVIEW_REQUIRED',
              termsUrl: 'https://www.bitget.com/support/articles/360014944032-terms-of-use/',
            },
            evidenceContract: {
              required: CRYPTO_FUTURES_DERIVATIVES_REQUIRED_EVIDENCE,
              approvedLiquidationRiskModel: APPROVED_LIQUIDATION_RISK_MODEL_V1,
              historicalOpenInterestReady: false,
              historicalDepthReady: false,
              historicalTradeFlowReady: false,
            },
            datasetIdentity: digest({ market: marketSummary.sha256, mark: markSummary.sha256, index: indexSummary.sha256, funding: fundingSummary.sha256 }),
            status: 'BLOCKED_DATA',
            blockers,
            qualityArtifactWritten: false,
            genuineSGradeGranted: false,
            profitabilityMetrics: null,
            canonicalJoinCount: 0,
            workerAdmissionCount: 0,
            safety: {
              publicGetOnly: true,
              syntheticImputation: false,
              currentOpenInterestHistoricalBackfill: false,
              privateApiUsed: false,
              rawProviderDataRedistributed: false,
              orderSubmitted: false,
              executionAuthority: 'NONE',
            },
          };
          await writeFile(path.join(process.env.EVIDENCE_DIR, 'bitget-btcusdt-public-history-readiness.json'), `${JSON.stringify(report, null, 2)}\n`, { flag: 'wx' });
          console.log(JSON.stringify(report, null, 2));
          if (marketSummary.count === 0 || markSummary.count === 0 || indexSummary.count === 0
              || fundingCoverage.total !== marketSummary.count || report.qualityArtifactWritten !== false
              || report.genuineSGradeGranted !== false || report.safety.executionAuthority !== 'NONE') process.exit(1);
          NODE
      - name: Assert no execution authority
        run: |
          test '${{ github.event_name }}' = workflow_dispatch || test '${{ github.event_name }}' = pull_request
          echo 'executionAuthority=NONE'
          echo 'privateTradingApiAllowed=false'
          echo 'orderSubmitted=false'
      - name: Upload bounded discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: bitget-history-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/bitget-history-probe
          retention-days: 30
          if-no-files-found: error
