name: Research Crypto Spot Futures-OI Cross-Market V6.3 Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-crypto-spot-futures-oi-crossmarket-v63.py
      - .github/workflows/research-crypto-spot-futures-oi-crossmarket-v63-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-spot-futures-oi-crossmarket-v63-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: "37468226538"
      SOURCE_ARTIFACT: "crypto-spot-causal-prescreen-v60-probe-ed085ac94f067c8c9bc06b562ea5d44277a704bb"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/probe-crypto-spot-futures-oi-crossmarket-v63.py
      - name: Install dependencies
        run: python -m pip install "pandas==2.3.3"
      - name: Download frozen causal spot Top50
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-v60
      - name: Probe structural cross-market family
        shell: bash
        run: |
          set -euo pipefail
          SELECTED="$(find source-v60 -name causal-selected.csv -print -quit)"
          test -n "$SELECTED"
          python market-prediction-lab/scripts/probe-crypto-spot-futures-oi-crossmarket-v63.py \
            --selected "$SELECTED" \
            --out-dir market-prediction-lab/docs/crypto-spot-futures-oi-crossmarket-v63-probe
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-spot-futures-oi-crossmarket-v63-probe-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-spot-futures-oi-crossmarket-v63-probe
          if-no-files-found: error
          retention-days: 14
