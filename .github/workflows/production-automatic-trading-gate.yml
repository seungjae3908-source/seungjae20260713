                '--fail', '--silent', '--show-error', '--max-time', '3',
                'http://127.0.0.1:' + port + '/api/health',
              ], { encoding: 'utf8' }));
            } catch {
              throw new Error('AUTOMATIC_TRADING_DISABLE_HEALTH_UNAVAILABLE');
            }
            const autoHealth = health?.autoTradingBackground;
            const lastTickMs = Date.parse(String(autoHealth?.lastTickAt || ''));
            const nowMs = Date.now();
            if (autoHealth?.enabled !== true
              || autoHealth?.liveModeRequested !== true
              || autoHealth?.tickOk !== true
              || !Number.isFinite(lastTickMs)
              || lastTickMs > nowMs
              || nowMs - lastTickMs > 360_000) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_HEALTH_STALE_OR_INVALID');
            }
            const openLivePositions = Number(autoHealth?.liveTrackedPositions);
            if (!Number.isInteger(openLivePositions) || openLivePositions < 0) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_LIVE_POSITION_COUNT_INVALID');
            }
            if (openLivePositions > 0) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_OPEN_LIVE_POSITIONS:' + openLivePositions);
            }
          }
          rmSync(liveEntryArmPath, { force: true });
          execFileSync('pm2', ['restart', pm2Name, '--update-env'], {
            stdio: 'inherit',
            env: {
              ...process.env,
              ...preservedDisableRuntimeEnv(before),
              // Disable is not permission to redirect Paper or AUTO sources.
              MEMBER_AUTO_TRADING_HANDOFF_PATH: String(before.MEMBER_AUTO_TRADING_HANDOFF_PATH ?? ''),
              AUTO_TRADING: 'false',
              LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
              MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
              MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
              MEMBER_AUTO_TRADING_PAPER_ONLY_ENABLED: 'false',
              CRYPTO_AUTO_LEGACY_EXECUTION_ENABLED: 'false',
              CRYPTO_AUTO_TRADE_ENABLED: 'false',
              BITGET_AUTO_TRADE_ENABLED: 'false',
              DEPLOY_SHA: target,
            },
          });
          execFileSync('pm2', ['save'], { stdio: 'inherit' });

          const after = readEnv();
          if (bool(after, 'AUTO_TRADING')
            || bool(after, 'LIVE_AUTOMATIC_TRADING_ENABLED')
            || bool(after, 'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED')
            || bool(after, 'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED')
            || bool(after, 'MEMBER_AUTO_TRADING_PAPER_ONLY_ENABLED')) {
            throw new Error('AUTOMATIC_TRADING_DISABLE_POSTCHECK_FAILED');
          }
          if (JSON.stringify(manual(after)) !== JSON.stringify(preserved)) {
            throw new Error('AUTOMATIC_TRADING_DISABLE_CHANGED_MANUAL_LIVE_AUTHORITY');
          }
          console.log('AUTOMATIC_TRADING_DISABLED_ALL4_MANUAL_LIVE_PRESERVED');
          console.log('REAL_ORDER_SUBMITTED=false');
          NODE

      - name: Record sanitized disable receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1555,
              body: [
                '[PRODUCTION_AUTOMATIC_TRADING_GATE]',
                'status: DISABLED_ALL4_MANUAL_LIVE_PRESERVED',
                'target_sha: ' + process.env.TARGET_SHA,
                'AUTO_TRADING=false',
                'LIVE_AUTOMATIC_TRADING_ENABLED=false',
                'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED=false',
                'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED=false',
                'paper_automatic_execution=false',
                'live_automatic_background_execution=false',
                'manual_spot_and_futures_authority_preserved=true',
                'REAL_ORDER_SUBMITTED=false',
                'workflow_run: ' + context.runId,
              ].join('\n'),
            });

  install-public-signal:
    name: Owner-approved independent PUBLIC data collector only (no automatic trading)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/install-auto-live-public-signal ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Parse owner-only independent source install command
        id: source_command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY || '').trim();
          const match = /^\/install-auto-live-public-signal ([0-9a-f]{40})$/u.exec(body);
          if (!match) throw new Error('AUTO_LIVE_PUBLIC_INSTALL_EXACT_SHA_COMMAND_REQUIRED');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + match[1] + '\n');
          NODE

      - name: Require exact protected main, successful current-main Full CI, and no active operations
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source_command.outputs.sha }}
        with:
          script: |
            const sha = String(process.env.SOURCE_SHA ?? '');
            const {owner,repo} = context.repo;
            const main = await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if (sha !== String(main.data.commit.sha).toLowerCase()) {
              core.setFailed('AUTO_LIVE_PUBLIC_INSTALL_REQUIRES_EXACT_CURRENT_MAIN');
              return;
            }
            // PR contract runs, stale HEADs, old deploy receipts and skipped
            // checks are not a live-host installation certificate.
            const full = await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:'futures-public-network-smoke.yml',
              branch:'main',per_page:100,
            });
            const passed = full.data.workflow_runs.some((run) =>
              run.name === 'Application CI' &&
              run.head_sha === sha &&
              run.event === 'workflow_dispatch' &&
              run.status === 'completed' &&
              run.conclusion === 'success');
            if (!passed) {
              core.setFailed('AUTO_LIVE_PUBLIC_INSTALL_EXACT_MAIN_FULL_CI_REQUIRED');
              return;
            }
            for (const workflowId of [
              'production-deploy.yml',
              'production-live-trading-gate.yml',
              'production-futures-live-trading-gate.yml',
              'production-postdeploy-qa.yml',
              'production-automatic-trading-gate.yml',
            ]) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:workflowId,per_page:100,
              });
              const conflict = runs.data.workflow_runs.some((run) =>
                run.id !== context.runId &&
                run.status !== 'completed' &&
                ['workflow_dispatch','issue_comment'].includes(run.event));
              if (conflict) {
                core.setFailed('AUTO_LIVE_PUBLIC_INSTALL_ACTIVE_OPERATION_CONFLICT');
                return;
              }
            }
            core.info('Exact main Full CI and zero conflicting active operation runs verified.');

      - name: Configure protected pinned SSH for public source only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Verify exact deployed revision and independent-root-only preflight
        shell: bash
        env:
          TARGET_SHA: ${{ steps.source_command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          # The checked-out source must itself be the authorized exact main.
          # A main update between checkout and approval cannot supply mixed code.
          [[ "$(git rev-parse --verify HEAD)" == "$TARGET_SHA" ]] || {
            echo 'AUTO_LIVE_PUBLIC_INSTALL_CHECKOUT_SHA_MISMATCH' >&2
            exit 1
          }
          remote_sha="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'tr -d "[:space:]" < /opt/stock-app/.deploy/current-sha')"
          [[ "$remote_sha" == "$TARGET_SHA" ]] || {
            echo 'AUTO_LIVE_PUBLIC_INSTALL_DEPLOYED_SHA_MISMATCH' >&2
            exit 1
          }
          # An exact current-sha marker alone cannot prove that the installed
          # installer file has not drifted from the approved main source.
          expected_source_hash="$(sha256sum ops/production-auto-live-signal-identity.cjs | awk '{print $1}')"
          remote_source_hash="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'test -f /opt/stock-app/ops/production-auto-live-signal-identity.cjs && test ! -L /opt/stock-app/ops/production-auto-live-signal-identity.cjs && sha256sum /opt/stock-app/ops/production-auto-live-signal-identity.cjs' | awk '{print $1}')"
          [[ "$remote_source_hash" == "$expected_source_hash" ]] || {
            echo 'AUTO_LIVE_PUBLIC_INSTALL_SOURCE_CONTENT_SHA_MISMATCH' >&2
            exit 1
          }
          env_args="$(printf 'AUTO_LIVE_INDEPENDENT_SOURCE_PREFLIGHT=true AUTO_LIVE_TARGET_SHA=%q AUTO_LIVE_DEPLOYED_SHA=%q' "$TARGET_SHA" "$TARGET_SHA")"
          # Source comes from immutable current main; preflight is READ ONLY.
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$env_args node -" \
            < ops/production-auto-live-signal-identity.cjs > "$RUNNER_TEMP/public-source-preflight.json"
          node - "$RUNNER_TEMP/public-source-preflight.json" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const proof = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (proof.status !== 'DRAFT_PLAN_NOT_INSTALLED'
            || proof.targetSha !== process.argv[3]
            || proof.ownerInstallApprovalRequired !== true
            || proof.paperRootMutated !== false
            || proof.paperCronReplaced !== false
            || proof.autoTradingActivationReady !== false) {
            throw new Error('AUTO_LIVE_PUBLIC_INSTALL_PREFLIGHT_RECEIPT_INVALID');
          }
          NODE

      - name: Install only isolated public data collection schedule with zero order authority
        shell: bash
        env:
          TARGET_SHA: ${{ steps.source_command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          # This is NOT the Application deployment pipeline: no DB/RLS,
          # PM2, provider credentials, Paper-state mutation or live-order calls.
          remote_env="$(printf 'AUTO_LIVE_TARGET_SHA=%q AUTO_LIVE_INDEPENDENT_SOURCE_INSTALL=true AUTO_LIVE_INDEPENDENT_SIGNAL_INSTALL_APPROVED=true' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/stock-app && $remote_env node ops/production-auto-live-signal-identity.cjs" \
            > "$RUNNER_TEMP/public-source-install.json"
          node - "$RUNNER_TEMP/public-source-install.json" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (receipt.status !== 'ACTIVE_WAITING_FOR_NATURAL_CYCLE'
            || receipt.targetSha !== process.argv[3]
            || receipt.scheduleActive !== true
            || receipt.canonicalCycleIntervalMs !== 900000
            || receipt.independentPaperRoot !== true
            || receipt.paperRootMutated !== false
            || receipt.paperCronReplaced !== false
            || receipt.producerInvocationVerified !== false
            || receipt.aiIssuerVerified !== false
            || receipt.autoTradingActivationReady !== false
            || receipt.liveTrading !== false
            || receipt.externalFinancialMutationAllowed !== false
            || receipt.financialMutationCount !== 0
            || receipt.privateRequestCount !== 0) {
            throw new Error('AUTO_LIVE_PUBLIC_INSTALL_SANITIZED_RECEIPT_INVALID');
          }
          NODE


      - name: Read back exact scheduled public source without scanner or trading claims
        shell: bash
        env:
          TARGET_SHA: ${{ steps.source_command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node -" > "$RUNNER_TEMP/public-source-schedule-readback.json" <<'NODE'
          const { spawnSync } = require('node:child_process');
          const {
            inspectManagedPaperForwardSchedule,
            readProductionAutoLiveScheduleActivation,
            assertAutoLiveSignalNotDisabled,
          } = require('/opt/stock-app/ops/production-auto-live-signal-identity.cjs');
          const sha = String(process.env.TARGET_SHA || '');
          const root = '/opt/stock-app-data/auto-live-signal-v1';
          const activation = readProductionAutoLiveScheduleActivation(root + '/activation.json');
          const cron = spawnSync('crontab',['-l'],{
            encoding:'utf8',timeout:5000,maxBuffer:1024*1024,
            env:{...process.env,LC_ALL:'C'},
          });
          if (cron.error || cron.signal || cron.status !== 0) {
            throw new Error('AUTO_LIVE_PUBLIC_INSTALL_CRON_READBACK_UNAVAILABLE');
          }
          const observed = inspectManagedPaperForwardSchedule(
            cron.stdout, activation, sha, activation.activationAtMs);
          assertAutoLiveSignalNotDisabled(root);
          if (observed.entryCount !== 1 || observed.activationBound !== true
            || observed.publicOnly !== true || observed.refreshIntervalMs !== 900000
            || activation.independentPaperRoot !== true
            || activation.paperRootMutated !== false
            || activation.paperCronReplaced !== false) {
            throw new Error('AUTO_LIVE_PUBLIC_INSTALL_SCHEDULE_PROOF_INVALID');
          }
          // The readback attests installation CONFIGURATION only. Cron still
          // needs observed genuine ticks and independent scanner/AI evidence.
          process.stdout.write(JSON.stringify({
            schemaVersion:'auto-live-independent-public-schedule-readback-v1',
            targetSha:sha,status:'CONFIGURATION_VERIFIED_ONLY',
            exactActiveCommand:true,activationBound:true,
            independentPaperRoot:true,paperRootMutated:false,
            paperCronReplaced:false,realOrderSubmitted:false,
            producerInvocationVerified:false,aiIssuerVerified:false,
            uninterrupted24hVerified:false,
          })+'\n');
          NODE
          node - "$RUNNER_TEMP/public-source-schedule-readback.json" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.targetSha !== process.argv[3] ||
            p.status !== 'CONFIGURATION_VERIFIED_ONLY' ||
            p.exactActiveCommand !== true || p.activationBound !== true ||
            p.independentPaperRoot !== true || p.paperRootMutated !== false ||
            p.paperCronReplaced !== false || p.producerInvocationVerified !== false ||
            p.aiIssuerVerified !== false || p.uninterrupted24hVerified !== false ||
            p.realOrderSubmitted !== false) {
            throw new Error('AUTO_LIVE_PUBLIC_INSTALL_SCHEDULE_READBACK_INVALID');
          }
          NODE

      - name: Record source-only installation without asserting scanner, AI, or LIVE readiness
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source_command.outputs.sha }}
        with:
          script: |
            const receipt = [
              '[AUTO_LIVE_INDEPENDENT_PUBLIC_SOURCE_INSTALL]',
              'status: INSTALLED_WAITING_FOR_GENUINE_PUBLIC_CYCLE',
              'sha: ' + process.env.SOURCE_SHA,
              'root: /opt/stock-app-data/auto-live-signal-v1',
              'cron: every 15 minutes, independent Paper tag and lock',
              'paper_root_mutated: false',
              'paper_cron_replaced: false',
              'private_provider_calls: 0',
              'financial_mutations: 0',
              'live_auto_authority_granted: false',
              'producer_invocation_verified: false',
              'ai_issuer_verified: false',
              '24_hour_uninterrupted_collection_verified: false',
              'real_order_submitted_by_install: false',
              'workflow_run: ' + context.runId,
            ].join('\n');
            for (const issue_number of [1555,1102]) {
              await github.rest.issues.createComment({
                owner:context.repo.owner,repo:context.repo.repo,issue_number,body:receipt,
              });
            }
