            TRADE_PRIVATE_RECOVERY_LOOKUP_ENABLED: String(env.TRADE_PRIVATE_RECOVERY_LOOKUP_ENABLED ?? 'false'),
          });
          const restartAutomatic = (enabled, baselineEnv) => {
            execFileSync('pm2', ['restart', pm2Name, '--update-env'], {
              stdio: 'inherit',
              env: {
                ...process.env,
                ...preservedManualRuntimeEnv(baselineEnv),
                AUTO_TRADING: enabled ? 'true' : 'false',
                LIVE_AUTOMATIC_TRADING_ENABLED: enabled ? 'true' : 'false',
                MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: enabled ? 'true' : 'false',
                MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: enabled ? 'true' : 'false',
                MEMBER_AUTO_TRADING_HANDOFF_PATH: enabled ? automaticLiveHandoffPath
                  : String(baselineEnv.MEMBER_AUTO_TRADING_HANDOFF_PATH ?? ''),
                TRADE_RECOVERY_WORKER_ENABLED: enabled ? 'true' : String(baselineEnv.TRADE_RECOVERY_WORKER_ENABLED ?? 'false'),
                TRADE_PRIVATE_RECOVERY_LOOKUP_ENABLED: enabled ? 'true' : String(baselineEnv.TRADE_PRIVATE_RECOVERY_LOOKUP_ENABLED ?? 'false'),
                MEMBER_AUTO_TRADING_PAPER_ONLY_ENABLED: 'false',
                CRYPTO_AUTO_LEGACY_EXECUTION_ENABLED: 'false',
                CRYPTO_AUTO_TRADE_ENABLED: 'false',
                BITGET_AUTO_TRADE_ENABLED: 'false',
                DEPLOY_SHA: target,
              },
            });
            execFileSync('pm2', ['save'], { stdio: 'inherit' });
          };

          // A missing/stale publisher is a known deterministic failure. Refuse
          // to change any PM2 flags or arm files until a fresh public handoff
          // exists; the worker still performs the full digest/evidence check.
          const requireFreshPublishedHandoff = async (_env) => {
            // Never accept the legacy Paper fallback even if old PM2 settings
            // still contain it. Check the new collector before PM2 mutation.
            const handoffPath = automaticLiveHandoffPath;
            let prearm;
            let readTrustedHandoff;
            try {
              const published = await import('file:///opt/stock-app/ops/production-auto-live-signal-identity.cjs');
              prearm = published.default?.verifyProductionAutoLivePrearmHandoff;
              readTrustedHandoff = published.default?.readProductionAutoLiveSignalHandoff;
            } catch {
              throw new Error('AUTOMATIC_TRADING_PREARM_VALIDATOR_UNAVAILABLE');
            }
            if (typeof prearm !== 'function' || typeof readTrustedHandoff !== 'function') {
              throw new Error('AUTOMATIC_TRADING_PREARM_VALIDATOR_UNAVAILABLE');
            }
            let h;
            try {
              h = readTrustedHandoff(handoffPath);
            } catch {
