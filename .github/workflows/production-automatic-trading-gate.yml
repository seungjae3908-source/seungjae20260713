            }
            // Valid source transport is not proof that the real scanner or AI
            // issuer ran; later 26-control gates remain mandatory.
          };

          const before = snapshot();
          let alreadyDesired = false;
          try {
            assertAllFourManual(before, true);
            alreadyDesired = true;
          } catch {}
          if (alreadyDesired) {
            execFileSync('sleep', ['2']);
