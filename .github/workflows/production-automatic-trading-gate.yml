name: Production Automatic Trading Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/production-automatic-trading-gate.yml
      - .github/scripts/production-trading-gate-conflicts.cjs
      - .github/scripts/production-trading-gate-conflicts.test.cjs
      - .github/scripts/production-preactivation-prerequisites.cjs
      - .github/scripts/verify-production-preactivation-evidence.cjs
      - .github/scripts/production-preactivation-evidence-paths.cjs
      - .github/scripts/production-preactivation-evidence-paths.test.cjs
      - .github/scripts/production-postdeploy-qa-evidence.cjs
      - .github/tests/production-paper-forward-readiness.test.mjs
      - .github/tests/production-telegram-runtime-readiness.test.mjs
      - api-server/scripts/verify-production-automatic-trading-gate.mjs
      - ops/verify-production-paper-forward-readiness.mjs
      - ops/verify-production-telegram-runtime-readiness.mjs
      - api-server/src/services/trade-automation.service.ts
      - api-server/src/services/trade-automation-policy-guard.service.ts
      - api-server/src/services/trade-automation-policy-guard.service.test.ts
      - api-server/src/services/member-auto-trading-background-worker.service.ts
      - api-server/src/routes/trade-automation.smoke.test.ts
      - api-server/src/routes/trade-automation.ts
      - api-server/src/services/trade-automation.types.ts
      - api-server/src/services/trade-automation-risk.service.ts
      - api-server/src/services/trade-automation-optimization.service.ts
      - api-server/src/services/formula-ai-live-exception.service.test.ts
      - api-server/src/services/formula-ai-live-exception.service.ts
      - api-server/src/services/trade-rule-pack-pilot-capital.service.test.ts
      - api-server/src/services/trade-rule-pack-pilot-capital.service.ts
      - api-server/src/features/user-broker-telegram/user-broker-telegram.worker.ts
      - api-server/src/index.ts
      - api-server/src/services/spot-live-limited-capability.service.ts
      - stock-analyzer/src/pages/auto-trading.tsx
      - stock-analyzer/src/components/trade-automation-settings.tsx
      - stock-analyzer/e2e/auto-trading-professional-ui.spec.ts
      - api-server/src/services/futures-live-limited-capability.service.ts
      - .github/workflows/production-live-trading-gate.yml
      - .github/workflows/production-futures-live-trading-gate.yml
      - .github/workflows/telegram-production-release.yml
      - ops/deploy-production.sh
      - stock-analyzer/e2e/production-account-readonly-live-qa.spec.ts
      - stock-analyzer/e2e/production-trading-core-qa.spec.ts
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment'
        && github.event.issue.number == 1555
        && github.event.comment.user.login == 'seungjae3908-source'
        && github.event.comment.author_association == 'OWNER'
        && (startsWith(github.event.comment.body, '/activate-production-auto-trading ')
            || startsWith(github.event.comment.body, '/disable-production-auto-trading '))
        && 'production-automatic-trading-gate'
        || format('production-automatic-trading-validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate-contract:
    name: Validate Production automatic-trading gate contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node api-server/scripts/verify-production-automatic-trading-gate.mjs
      - run: >-
          node --test
          .github/scripts/production-preactivation-evidence-paths.test.cjs
          .github/tests/production-paper-forward-readiness.test.mjs
          .github/tests/production-telegram-runtime-readiness.test.mjs

  activate:
    name: Owner-approved four-market Production automatic-trading activation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/activate-production-auto-trading ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: read
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/activate-production-auto-trading ([0-9a-f]{40}) all4$/u.exec(body);
          if (!match) throw new Error('Expected /activate-production-auto-trading <40-char-current-main-sha> all4');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + match[1] + '\n');
          NODE

      - name: Require exact release, all-provider QA, and both manual live receipts
        id: gate
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = String(process.env.TARGET_SHA || '');
            const { inspectProductionPreactivationPrerequisites } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/production-preactivation-prerequisites.cjs`
            );
            const release = await inspectProductionPreactivationPrerequisites({
              github, context, targetSha: target,
            });
            const ciRunId = release.requiredCiRunId;
            const production = { id: release.productionDeployRunId };
            const comprehensive = production;
            const account = production;
            const productionCompletedAt = Date.parse(release.productionDeployCompletedAt);
            if (!Number.isFinite(productionCompletedAt)) {
              core.setFailed('AUTOMATIC_TRADING_PRODUCTION_COMPLETION_TIME_INVALID');
              return;
            }
            const telegramRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: target,
              branch: 'main',
              event: 'issue_comment',
              status: 'completed',
              per_page: 100,
            });
            const telegramArtifactName = `telegram-production-runtime-verification-${target}`;
            let telegramRun = null;
            for (const candidate of telegramRuns
              .filter((run) => run.name === 'Telegram Production Release'
                && run.path === '.github/workflows/telegram-production-release.yml'
                && run.head_sha === target
                && run.head_branch === 'main'
                && run.event === 'issue_comment'
                && run.status === 'completed'
                && run.conclusion === 'success')
              .sort((left, right) => Date.parse(right.updated_at) - Date.parse(left.updated_at))) {
              const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 100,
              });
              const artifact = (artifactResponse.data.artifacts ?? []).find((item) =>
                item.name === telegramArtifactName
                  && item.expired !== true
                  && item.size_in_bytes > 0);
              if (artifact) {
                telegramRun = candidate;
                break;
              }
            }
            if (!telegramRun) {
              core.setFailed('AUTOMATIC_TRADING_EXACT_TELEGRAM_RELEASE_REQUIRED:' + target);
              return;
            }
            const paperRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: target,
              branch: 'main',
              event: 'issue_comment',
              status: 'completed',
              per_page: 100,
            });
            const paperArtifactName = `paper-forward-no-deploy-${target}`;
            let paperRun = null;
            for (const run of paperRuns
              .filter((candidate) => candidate.name === 'Paper Forward No-Deploy Schedule Activation'
                && candidate.path === '.github/workflows/paper-forward-schedule-no-deploy-activation.yml'
                && candidate.head_sha === target
                && candidate.head_branch === 'main'
                && candidate.event === 'issue_comment'
                && candidate.status === 'completed'
                && candidate.conclusion === 'success'
                && Date.parse(candidate.updated_at || candidate.created_at || '') >= productionCompletedAt)
              .sort((left, right) => Date.parse(right.updated_at) - Date.parse(left.updated_at))) {
              const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = (artifactResponse.data.artifacts ?? []).find((candidate) =>
                candidate.name === paperArtifactName
                  && candidate.expired !== true
                  && candidate.size_in_bytes > 0);
              if (artifact) {
                paperRun = run;
                break;
              }
            }
            if (!paperRun) {
              core.setFailed('AUTOMATIC_TRADING_EXACT_PAPER_FORWARD_RUNTIME_REQUIRED:' + target);
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 1555, per_page: 100,
            });
            const postDeploy = comments.filter((comment) =>
              Date.parse(comment.created_at || '') >= productionCompletedAt);

            const spotReceipt = [...postDeploy].reverse().find((comment) => {
              const body = String(comment.body || '');
              return body.includes('[PRODUCTION_LIVE_TRADING_GATE]')
                && body.includes('status: ACTIVATED_SPOT_LIVE_LIMITED_MANUAL')
                && body.includes('target_sha: ' + target)
                && body.includes('providers: kiwoom,toss,upbit')
                && body.includes('AUTO_TRADING=false')
                && body.includes('LIVE_AUTOMATIC_TRADING_ENABLED=false')
                && body.includes('executionAuthority=SPOT_LIVE_LIMITED')
                && body.includes('REAL_ORDER_SUBMITTED=false');
            });
            if (!spotReceipt) {
              core.setFailed('AUTOMATIC_TRADING_EXACT_SPOT_MANUAL_RECEIPT_REQUIRED:' + target);
              return;
            }

            const futuresReceipt = [...postDeploy].reverse().find((comment) => {
              const body = String(comment.body || '');
              return body.includes('[PRODUCTION_FUTURES_LIVE_TRADING_GATE]')
                && body.includes('status: ACTIVATED_FUTURES_LIVE_LIMITED_MANUAL')
                && body.includes('target_sha: ' + target)
                && body.includes('provider: bitget')
                && /max_leverage:\s*([2-7])/u.test(body)
                && body.includes('margin_mode: isolated')
                && body.includes('FUTURES_LIVE_EXECUTION_AUTHORITY=FUTURES_LIVE_LIMITED')
                && body.includes('AUTO_TRADING=false')
                && body.includes('LIVE_AUTOMATIC_TRADING_ENABLED=false')
                && body.includes('REAL_ORDER_SUBMITTED=false');
            });
            if (!futuresReceipt) {
              core.setFailed('AUTOMATIC_TRADING_EXACT_FUTURES_MANUAL_RECEIPT_REQUIRED:' + target);
              return;
            }
            const leverage = /max_leverage:\s*([2-7])/u.exec(String(futuresReceipt.body || ''))?.[1];
            if (!leverage) {
              core.setFailed('AUTOMATIC_TRADING_FUTURES_LEVERAGE_RECEIPT_INVALID');
              return;
            }

            core.setOutput('ci_run_id', String(ciRunId));
            core.setOutput('production_run_id', String(production.id));
            core.setOutput('comprehensive_run_id', String(comprehensive.id));
            core.setOutput('account_run_id', String(account.id));
            core.setOutput('deployment_completed_at', release.productionDeployCompletedAt);
            core.setOutput('qa_scope', release.qaScope);
            core.setOutput('spot_receipt_comment_id', String(spotReceipt.id));
            core.setOutput('futures_receipt_comment_id', String(futuresReceipt.id));
            core.setOutput('futures_max_leverage', leverage);
            core.setOutput('paper_forward_run_id', String(paperRun.id));
            core.setOutput('telegram_release_run_id', String(telegramRun.id));

      - name: Download exact Production post-deploy evidence
        uses: actions/download-artifact@v4
        with:
          pattern: production-*
          path: ${{ runner.temp }}/production-preactivation-evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.gate.outputs.production_run_id }}

      - name: Verify exact Production post-deploy evidence
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRODUCTION_RUN_ID: ${{ steps.gate.outputs.production_run_id }}
          DEPLOYMENT_COMPLETED_AT: ${{ steps.gate.outputs.deployment_completed_at }}
        run: |
          set -Eeuo pipefail
          root="${{ runner.temp }}/production-preactivation-evidence"
          test -d "$root"
          node .github/scripts/verify-production-preactivation-evidence.cjs \
            "$TARGET_SHA" "$PRODUCTION_RUN_ID" "$DEPLOYMENT_COMPLETED_AT" "$root"

      - name: Download exact-SHA Telegram runtime ACTIVE_VERIFIED evidence
        uses: actions/download-artifact@v4
        with:
          name: telegram-production-runtime-verification-${{ steps.command.outputs.sha }}
          path: ${{ runner.temp }}/telegram-runtime-verification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gate.outputs.telegram_release_run_id }}

      - name: Require Telegram runtime, AUTO room, and zero-mutation ACTIVE_VERIFIED evidence
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRODUCTION_RUN_ID: ${{ steps.gate.outputs.production_run_id }}
        run: |
          set -Eeuo pipefail
          evidence="$(find "${{ runner.temp }}/telegram-runtime-verification" -type f -name production-telegram-runtime-proof.json -print -quit)"
          test -n "$evidence"
          node ops/verify-production-telegram-runtime-readiness.mjs \
            --artifact "$evidence" "$TARGET_SHA" "$PRODUCTION_RUN_ID"

      - name: Download exact-SHA Paper Forward runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: paper-forward-no-deploy-${{ steps.command.outputs.sha }}
          path: ${{ runner.temp }}/paper-forward-runtime-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gate.outputs.paper_forward_run_id }}

      - name: Verify exact-SHA Paper Forward activation evidence
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          evidence="$(find "${{ runner.temp }}/paper-forward-runtime-evidence" -type f -name natural-cycle.json -print -quit)"
          test -n "$evidence"
          node ops/verify-production-paper-forward-readiness.mjs \
            --activation-artifact "$evidence" "$TARGET_SHA"

      - name: Download exact-SHA four-provider Account QA evidence
        if: ${{ false }}
        uses: actions/download-artifact@v4
        with:
          name: production-account-readonly-live-${{ steps.command.outputs.sha }}
          path: ${{ runner.temp }}/production-account-readonly-live-qa
          github-token: ${{ github.token }}
          run-id: ${{ steps.gate.outputs.account_run_id }}

      - name: Require all four providers connected, fresh, and reconciled
        if: ${{ false }}
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          ACCOUNT_QA_EVIDENCE: ${{ runner.temp }}/production-account-readonly-live-qa/production-account-readonly-live-qa.json
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const target = String(process.env.TARGET_SHA || '');
          const requiredProviders = ['toss', 'kiwoom', 'upbit', 'bitget'];
          const evidence = JSON.parse(fs.readFileSync(process.env.ACCOUNT_QA_EVIDENCE, 'utf8'));

          if (evidence?.schemaVersion !== 'production-account-readonly-live-qa-v3'
            || evidence?.targetSha !== target
            || evidence?.orderRequests !== 0
            || evidence?.cancelRequests !== 0
            || evidence?.amendRequests !== 0
            || evidence?.transferRequests !== 0
            || evidence?.withdrawalRequests !== 0
            || evidence?.blockedMutationRequests !== 0
            || evidence?.observedAppMutationRequests !== 0
            || evidence?.liveTradingAuthorityGranted !== false
            || evidence?.autoTradingAuthorityGranted !== false) {
            throw new Error('AUTOMATIC_TRADING_ACCOUNT_QA_SAFETY_INVALID');
          }
          const testedProviders = Array.isArray(evidence?.testedProviders) ? evidence.testedProviders : [];
          const rows = Array.isArray(evidence?.providers) ? evidence.providers : [];
          for (const provider of requiredProviders) {
            if (!testedProviders.includes(provider)) {
              throw new Error('AUTOMATIC_TRADING_ACCOUNT_QA_PROVIDER_NOT_TESTED:' + provider);
            }
            const row = rows.find((candidate) => candidate?.provider === provider);
            if (!row
              || row.connected !== true
              || row.status !== 'CONNECTED'
              || row.stale !== false
              || row.fresh !== true
              || row.errorCode !== null
              || row.checkedAtPresent !== true
              || row.lastGoodAtPresent !== true
              || row.reconciliation !== 'PASS'
              || row.reconciliationPassed !== true) {
              throw new Error('AUTOMATIC_TRADING_ACCOUNT_QA_PROVIDER_NOT_READY:' + provider);
            }
          }
          NODE

      - name: Require no conflicting active Production trading gate
        uses: actions/github-script@v7
        with:
          script: |
            const { inspectProductionTradingGateConflicts } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/production-trading-gate-conflicts.cjs`
            );
            const workflowIds = [
              'production-live-trading-gate.yml',
              'production-futures-live-trading-gate.yml',
              'production-automatic-trading-gate.yml',
            ];
            const gateState = await inspectProductionTradingGateConflicts({
              github,
              context,
              currentWorkflowId: 'production-automatic-trading-gate.yml',
              workflowIds,
            });
            if (!gateState.ok) {
              const detail = gateState.conflicts
                .map((item) => item.workflowId + ':' + item.runId + ':' + item.status)
                .join(',');
              core.setFailed('PRODUCTION_TRADING_GATE_CONFLICT_ACTIVE:' + detail);
              return;
            }
            if (gateState.ignoredNewerSameWorkflow.length > 0) {
              core.info('Ignored newer serialized duplicate run(s): '
                + gateState.ignoredNewerSameWorkflow.map((item) => item.runId).join(','));
            }

      - name: Configure protected Production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Require fresh canonical Paper Forward handoff before AUTO authority
        id: paper-runtime
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/production-paper-forward-runtime-readiness.json"
          printf -v remote_command 'node --input-type=module - %q' "$TARGET_SHA"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_command" > "$evidence" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync, lstatSync, readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          const targetSha = String(process.argv[2] ?? '').trim().toLowerCase();
          if (!/^[0-9a-f]{40}$/u.test(targetSha)) throw new Error('PAPER_FORWARD_TARGET_SHA_INVALID');
          const root = '/opt/stock-app-data/paper-forward-v1';
          const runtimeRoot = `${root}/runtime-state`;
          const paths = {
            marker: '/opt/stock-app/.deploy/current-sha',
            activation: `${root}/activation.json`,
            invocations: `${runtimeRoot}/status/invocations.jsonl`,
            handoff: `${runtimeRoot}/handoff/member-auto-trading-latest.json`,
            validator: `${root}/releases/${targetSha}/market-prediction-lab/src/member-auto-trading-paper-handoff-v1.js`,
          };
          const read = (file) => {
            const stat = lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('PAPER_FORWARD_FILE_UNSAFE');
            return readFileSync(file, 'utf8');
          };
          const productionSha = read(paths.marker).trim();
          if (productionSha !== targetSha) throw new Error('PAPER_FORWARD_PRODUCTION_SHA_MISMATCH');
          const activation = JSON.parse(read(paths.activation));
          if (activation?.schemaVersion !== 'paper-forward-schedule-no-deploy-activation-v2'
            || activation?.paperRuntimeSourceSha !== targetSha
            || activation?.productionAppShaBefore !== targetSha
            || activation?.scheduleActive !== true
            || activation?.externalFinancialMutationAllowed !== false
            || activation?.liveTrading !== false
            || activation?.privateAccountAccess !== false
            || activation?.orderAuthority !== false) {
            throw new Error('PAPER_FORWARD_ACTIVATION_STATE_INVALID');
          }
          const invocationLines = read(paths.invocations).trim().split(/\r?\n/u).filter(Boolean);
          const invocation = invocationLines.map((line) => JSON.parse(line))
            .filter((row) => row?.triggerSource === 'cron')
            .at(-1);
          if (!invocation || invocation.status !== 'COMPLETED'
            || invocation.naturalScheduleInvocation !== true
            || invocation.mutationCount !== 1
            || invocation.publicForwardEvidenceAccumulating !== true
            || invocation.paperTradeOutcomeAccumulationEnabled !== true
            || invocation.privateRequestCount !== 0
            || invocation.financialMutationCount !== 0
            || invocation.orderCount !== 0
            || invocation.liveTrading !== false
            || invocation.orderAuthority !== false) {
            throw new Error('PAPER_FORWARD_LAST_INVOCATION_INVALID');
          }
          const nowMs = Date.now();
          const freshMs = 30 * 60 * 1000;
          const completedAtMs = Number(invocation.completedAtMs);
          if (!Number.isFinite(completedAtMs) || completedAtMs > nowMs || nowMs - completedAtMs > freshMs) {
            throw new Error('PAPER_FORWARD_LAST_INVOCATION_STALE');
          }
          const providerLanes = Array.isArray(invocation.providerLanes) ? invocation.providerLanes : [];
          const markets = providerLanes.map((lane) => String(lane?.market ?? '')).sort();
          const requiredMarkets = ['CRYPTO_FUTURES', 'CRYPTO_SPOT', 'KR_STOCK', 'US_STOCK'];
          if (JSON.stringify(markets) !== JSON.stringify(requiredMarkets)
            || providerLanes.some((lane) => lane?.status !== 'READY')) {
            throw new Error('PAPER_FORWARD_FOUR_MARKET_LANES_NOT_READY');
          }
          const handoff = JSON.parse(read(paths.handoff));
          const validator = await import(`${pathToFileURL(paths.validator).href}?sha=${targetSha}`);
          const validated = validator.validateMemberAutoTradingPaperHandoff(handoff, nowMs);
          if (validated.status !== 'READY') throw new Error('PAPER_FORWARD_HANDOFF_NOT_READY');
          if (nowMs - Number(validated.evaluatedAtMs) > freshMs) throw new Error('PAPER_FORWARD_HANDOFF_STALE');
          const cron = execFileSync('crontab', ['-l'], { encoding: 'utf8' });
          const cronMatches = cron.split(/\r?\n/u).filter((line) => line.includes('# stock-app-paper-forward-v1')).length;
          if (cronMatches !== 1) throw new Error('PAPER_FORWARD_CRON_COUNT_INVALID');
          const disabledSentinelPresent = existsSync(`${root}/DISABLED`) || existsSync(`${runtimeRoot}/DISABLED`);
          if (disabledSentinelPresent) throw new Error('PAPER_FORWARD_DISABLED_SENTINEL_PRESENT');
          process.stdout.write(`${JSON.stringify({
            schemaVersion: 'production-paper-forward-runtime-readiness-v1',
            status: 'passed',
            targetSha,
            productionSha,
            paperRuntimeSha: activation.paperRuntimeSourceSha,
            scheduleActive: true,
            oneCronEntry: true,
            freshWithinMinutes: 30,
            invocationFresh: true,
            handoffFresh: true,
            handoffStatus: validated.status,
            handoffEntryCount: validated.entryCount,
            handoffDigest: validated.handoffDigest,
            handoffValidatedByCanonicalModule: true,
            providerLanes: providerLanes.map((lane) => ({ market: lane.market, provider: lane.provider, status: lane.status })),
            privateRequestCount: 0,
            financialMutationCount: 0,
            orderCount: 0,
            liveTrading: false,
            disabledSentinelPresent: false,
            rawCredentialsExposed: false,
          }, null, 2)}\n`);
          NODE
          node ops/verify-production-paper-forward-readiness.mjs \
            --runtime-artifact "$evidence" "$TARGET_SHA"
          printf 'artifact=%s\n' "$evidence" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized Paper Forward runtime readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-paper-forward-runtime-${{ steps.command.outputs.sha }}
          path: ${{ steps.paper-runtime.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Activate automatic execution across all four markets
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          FUTURES_MAX_LEVERAGE: ${{ steps.gate.outputs.futures_max_leverage }}
          QA_SCOPE: ${{ steps.gate.outputs.qa_scope }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q FUTURES_MAX_LEVERAGE=%q' "$TARGET_SHA" "$FUTURES_MAX_LEVERAGE")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node --input-type=module -" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { lstatSync, mkdirSync, readFileSync, renameSync, rmSync, statSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';

          const target = String(process.env.TARGET_SHA || '');
          const expectedLeverage = String(process.env.FUTURES_MAX_LEVERAGE || '');
          const pm2Name = 'stock-app';
          const liveEntryArmPath = '/opt/stock-app/.deploy/auto-trading-live-entry-arm.json';
          const liveEntryArmActivationDelayMs = 120_000;
          const disarmLiveEntries = () => rmSync(liveEntryArmPath, { force: true });
          const productionWorkerUid = () => {
            const rows = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const matches = rows.filter((row) => row?.name === pm2Name);
            if (matches.length !== 1 || !Number.isInteger(Number(matches[0]?.pid)) || Number(matches[0].pid) <= 1) {
              throw new Error('AUTOMATIC_TRADING_PM2_PID_INVALID');
            }
            return statSync('/proc/' + Number(matches[0].pid)).uid;
          };
          const verifyLiveEntryArmReadable = () => {
            const stat = lstatSync(liveEntryArmPath);
            if (!stat.isFile() || stat.isSymbolicLink()
              || stat.size <= 0 || stat.size > 16 * 1024
              || (stat.mode & 0o077) !== 0
              || stat.uid !== productionWorkerUid()) {
              throw new Error('AUTOMATIC_TRADING_LIVE_ENTRY_ARM_WORKER_READABILITY_INVALID');
            }
            const value = JSON.parse(readFileSync(liveEntryArmPath, 'utf8'));
            const armedAtMs = Date.parse(String(value?.armedAt ?? ''));
            const activateNotBeforeMs = Date.parse(String(value?.activateNotBeforeAt ?? ''));
            if (value?.schemaVersion !== 'member-auto-trading-live-entry-arm-v1'
              || value?.armed !== true || value?.targetSha !== target
              || !Number.isFinite(armedAtMs)
              || !Number.isFinite(activateNotBeforeMs)
              || activateNotBeforeMs - armedAtMs !== liveEntryArmActivationDelayMs) {
              throw new Error('AUTOMATIC_TRADING_LIVE_ENTRY_ARM_WORKER_READBACK_FAILED');
            }
            return true;
          };
          const armLiveEntries = () => {
            mkdirSync(dirname(liveEntryArmPath), { recursive: true });
            const temp = liveEntryArmPath + '.tmp-' + process.pid;
            rmSync(temp, { force: true });
            const armedAt = new Date();
            const activateNotBeforeAt = new Date(
              armedAt.getTime() + liveEntryArmActivationDelayMs,
            ).toISOString();
            writeFileSync(temp, JSON.stringify({
              schemaVersion: 'member-auto-trading-live-entry-arm-v1',
              targetSha: target,
              armed: true,
              armedAt: armedAt.toISOString(),
              activateNotBeforeAt,
            }) + '\n', { mode: 0o600, flag: 'wx' });
            renameSync(temp, liveEntryArmPath);
            const value = JSON.parse(readFileSync(liveEntryArmPath, 'utf8'));
            if (value?.schemaVersion !== 'member-auto-trading-live-entry-arm-v1'
              || value?.armed !== true || value?.targetSha !== target) {
              throw new Error('AUTOMATIC_TRADING_LIVE_ENTRY_ARM_WRITE_FAILED');
            }
            verifyLiveEntryArmReadable();
            return activateNotBeforeAt;
          };
          if (!['2', '3', '4', '5', '6', '7'].includes(expectedLeverage)) throw new Error('AUTOMATIC_TRADING_FUTURES_LEVERAGE_INVALID');
          const marker = readFileSync('/opt/stock-app/.deploy/current-sha', 'utf8').trim();
          if (marker !== target) throw new Error('AUTOMATIC_TRADING_DEPLOY_SHA_MISMATCH');

          const bool = (env, key) => {
            const value = env[key];
            if (value === true || value === 'true') return true;
            if (value === false || value === 'false' || value === undefined) return false;
            throw new Error('AUTOMATIC_TRADING_FLAG_MALFORMED:' + key);
          };
          const csv = (value) => new Set(String(value || '').split(',').map((v) => v.trim().toUpperCase()).filter(Boolean));
          const snapshot = () => {
            const rows = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const matches = rows.filter((row) => row?.name === pm2Name);
            if (matches.length !== 1) throw new Error('AUTOMATIC_TRADING_PM2_AMBIGUOUS');
            const env = matches[0]?.pm2_env;
            if (!env || env.status !== 'online' || String(env.DEPLOY_SHA || '') !== target) {
              throw new Error('AUTOMATIC_TRADING_PM2_IDENTITY_INVALID');
            }
            return env;
          };
          const requireWorkerWarmup = (env, { requireCurrentArm }) => {
            const port = String(env.PORT || env.API_PORT || '8080');
            let last = null;
            for (let attempt = 0; attempt < 360; attempt += 1) {
              try {
                last = JSON.parse(execFileSync('curl', [
                  '--fail', '--silent', '--show-error', '--max-time', '3',
                  'http://127.0.0.1:' + port + '/api/health',
                ], { encoding: 'utf8' }));
                const health = last?.autoTradingBackground;
                const nowMs = Date.now();
                const autoLastTickMs = Date.parse(String(health?.lastTickAt || ''));
                const telegramLastTickMs = Date.parse(String(last?.userTelegramDelivery?.lastTickAt || ''));
                const autoHealthFresh = Number.isFinite(autoLastTickMs)
                  && autoLastTickMs <= nowMs
                  && nowMs - autoLastTickMs <= 360_000;
                const telegramHealthFresh = Number.isFinite(telegramLastTickMs)
                  && telegramLastTickMs <= nowMs
                  && nowMs - telegramLastTickMs <= 360_000;
                if (health?.enabled === true
                  && health?.liveModeRequested === true
                  && autoHealthFresh
                  && telegramHealthFresh
                  && health?.tickOk === true
                  && health?.handoffReady === true
                  && health?.newEntriesFailClosed === false
                  && health?.liveEntryWarmupComplete === true
                  && health?.startupWarmupObserved === true
                  && health?.firstWarmupTickLiveEntriesArmed === false
                  && health?.firstWarmupTickLiveOrders === 0
                  && health?.firstWarmupTickLiveExitOrders === 0
                  && health?.executionSyncFailures === 0
                  && health?.executionSyncMissingReferences === 0
                  && health?.liveReadinessCycleComplete === true
                  && health?.liveCycleOrderEligible === true
                  && health?.liveCyclePolicyReady === true
                  && health?.liveCycleAllFourPolicyReady === true
                  && health?.globalEmergencyStopActive === false
                  && last?.userTelegramDelivery?.enabled === true
                  && last?.userTelegramDelivery?.tickOk === true
                  && last?.userTelegramDelivery?.errorCode == null
                  && (!requireCurrentArm || health?.liveEntryArmPresent === true)) {
                  return health;
                }
              } catch {}
              execFileSync('sleep', ['1']);
            }
            throw new Error('AUTOMATIC_TRADING_WORKER_WARMUP_NOT_PROVEN:' + JSON.stringify({
              autoTradingBackground: last?.autoTradingBackground ?? null,
              userTelegramDelivery: last?.userTelegramDelivery ?? null,
            }));
          };
          const manualState = (env) => ({
            live: bool(env, 'LIVE_TRADING'),
            real: bool(env, 'REAL_ORDER_ENABLED'),
            privateApi: bool(env, 'PRIVATE_TRADING_API_ALLOWED'),
            orderExecution: bool(env, 'ORDER_EXECUTION_ENABLED'),
            liveApproved: bool(env, 'LIVE_TRADING_ACTIVATION_APPROVED'),
            spotApproved: bool(env, 'SPOT_LIVE_LIMITED_ACTIVATION_APPROVED'),
            toss: bool(env, 'TOSS_LIVE_ORDER_ENABLED'),
            kiwoom: bool(env, 'KIWOOM_LIVE_ORDER_ENABLED'),
            upbit: bool(env, 'UPBIT_LIVE_ORDER_ENABLED'),
            spotAuthority: String(env.executionAuthority || 'NONE').toUpperCase(),
            spotCapabilities: String(env.SPOT_LIVE_CAPABILITY_ALLOWLIST || ''),
            spotMarkets: String(env.SPOT_LIVE_MARKET_ALLOWLIST || ''),
            futuresApproved: bool(env, 'FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED'),
            bitgetFutures: bool(env, 'BITGET_FUTURES_LIVE_ORDER_ENABLED'),
            futuresAuthority: String(env.FUTURES_LIVE_EXECUTION_AUTHORITY || 'NONE').toUpperCase(),
            futuresCapabilities: String(env.FUTURES_LIVE_CAPABILITY_ALLOWLIST || ''),
            futuresMarkets: String(env.FUTURES_LIVE_MARKET_ALLOWLIST || ''),
            futuresMaxLeverage: String(env.FUTURES_LIVE_MAX_LEVERAGE || ''),
            futuresMarginMode: String(env.FUTURES_LIVE_MARGIN_MODE || '').toLowerCase(),
            telegramApproved: bool(env, 'LIVE_TELEGRAM_ACTIVATION_APPROVED'),
            telegramIntelligenceWorker: bool(env, 'TELEGRAM_INTELLIGENCE_WORKER_ENABLED'),
            telegramDeliveryWorker: bool(env, 'PERSONAL_TELEGRAM_WORKER_ENABLED'),
          });
          const assertAllFourManual = (env, expectedAuto) => {
            const manual = manualState(env);
            if (!manual.live || !manual.real || !manual.privateApi || !manual.orderExecution || !manual.liveApproved) {
              throw new Error('AUTOMATIC_TRADING_GLOBAL_LIVE_GATE_NOT_READY');
            }
            if (!manual.telegramApproved || !manual.telegramIntelligenceWorker || !manual.telegramDeliveryWorker) {
              throw new Error('AUTOMATIC_TRADING_TELEGRAM_RUNTIME_NOT_ACTIVE');
            }
            if (!manual.spotApproved || !manual.toss || !manual.kiwoom || !manual.upbit
              || manual.spotAuthority !== 'SPOT_LIVE_LIMITED') {
              throw new Error('AUTOMATIC_TRADING_SPOT_THREE_MARKETS_NOT_READY');
            }
            const spotCaps = csv(manual.spotCapabilities);
            const spotMarkets = csv(manual.spotMarkets);
            for (const capability of ['BALANCE_READ','POSITION_READ','OPEN_ORDER_READ','ORDER_CREATE','ORDER_CANCEL','ORDER_AMEND']) {
              if (!spotCaps.has(capability)) throw new Error('AUTOMATIC_TRADING_SPOT_CAPABILITY_MISSING:' + capability);
            }
            for (const market of ['KR_STOCK','US_STOCK','CRYPTO_SPOT']) {
              if (!spotMarkets.has(market)) throw new Error('AUTOMATIC_TRADING_SPOT_MARKET_MISSING:' + market);
            }
            if (spotMarkets.size !== 3) throw new Error('AUTOMATIC_TRADING_SPOT_MARKET_SCOPE_TOO_WIDE');

            if (!manual.futuresApproved || !manual.bitgetFutures
              || manual.futuresAuthority !== 'FUTURES_LIVE_LIMITED'
              || manual.futuresMarkets !== 'CRYPTO_FUTURES'
              || manual.futuresMarginMode !== 'isolated'
              || manual.futuresMaxLeverage !== expectedLeverage) {
              throw new Error('AUTOMATIC_TRADING_FUTURES_MARKET_NOT_READY');
            }
            const futuresCaps = csv(manual.futuresCapabilities);
            for (const capability of ['BALANCE_READ','POSITION_READ','OPEN_ORDER_READ','ORDER_CREATE','ORDER_CANCEL','ORDER_AMEND']) {
              if (!futuresCaps.has(capability)) throw new Error('AUTOMATIC_TRADING_FUTURES_CAPABILITY_MISSING:' + capability);
            }
            if (bool(env, 'AUTO_TRADING') !== expectedAuto
              || bool(env, 'LIVE_AUTOMATIC_TRADING_ENABLED') !== expectedAuto
              || bool(env, 'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED') !== expectedAuto
              || bool(env, 'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED') !== expectedAuto
              || bool(env, 'CRYPTO_AUTO_LEGACY_EXECUTION_ENABLED') !== false
              || bool(env, 'CRYPTO_AUTO_TRADE_ENABLED') !== false
              || bool(env, 'BITGET_AUTO_TRADE_ENABLED') !== false) {
              throw new Error('AUTOMATIC_TRADING_FLAG_STATE_MISMATCH');
            }
          };
          const preservedManualRuntimeEnv = (env) => ({
            LIVE_TRADING: String(env.LIVE_TRADING ?? 'false'),
            REAL_ORDER_ENABLED: String(env.REAL_ORDER_ENABLED ?? 'false'),
            PRIVATE_TRADING_API_ALLOWED: String(env.PRIVATE_TRADING_API_ALLOWED ?? 'false'),
            ORDER_EXECUTION_ENABLED: String(env.ORDER_EXECUTION_ENABLED ?? 'false'),
            LIVE_TRADING_ACTIVATION_APPROVED: String(env.LIVE_TRADING_ACTIVATION_APPROVED ?? 'false'),
            SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: String(env.SPOT_LIVE_LIMITED_ACTIVATION_APPROVED ?? 'false'),
            TOSS_LIVE_ORDER_ENABLED: String(env.TOSS_LIVE_ORDER_ENABLED ?? 'false'),
            KIWOOM_LIVE_ORDER_ENABLED: String(env.KIWOOM_LIVE_ORDER_ENABLED ?? 'false'),
            UPBIT_LIVE_ORDER_ENABLED: String(env.UPBIT_LIVE_ORDER_ENABLED ?? 'false'),
            executionAuthority: String(env.executionAuthority ?? 'NONE'),
            SPOT_LIVE_CAPABILITY_ALLOWLIST: String(env.SPOT_LIVE_CAPABILITY_ALLOWLIST ?? ''),
            SPOT_LIVE_MARKET_ALLOWLIST: String(env.SPOT_LIVE_MARKET_ALLOWLIST ?? ''),
            FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED: String(env.FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED ?? 'false'),
            BITGET_FUTURES_LIVE_ORDER_ENABLED: String(env.BITGET_FUTURES_LIVE_ORDER_ENABLED ?? 'false'),
            FUTURES_LIVE_EXECUTION_AUTHORITY: String(env.FUTURES_LIVE_EXECUTION_AUTHORITY ?? 'NONE'),
            FUTURES_LIVE_CAPABILITY_ALLOWLIST: String(env.FUTURES_LIVE_CAPABILITY_ALLOWLIST ?? ''),
            FUTURES_LIVE_MARKET_ALLOWLIST: String(env.FUTURES_LIVE_MARKET_ALLOWLIST ?? ''),
            FUTURES_LIVE_MAX_LEVERAGE: String(env.FUTURES_LIVE_MAX_LEVERAGE ?? ''),
            FUTURES_LIVE_MARGIN_MODE: String(env.FUTURES_LIVE_MARGIN_MODE ?? ''),
            LIVE_TELEGRAM_ACTIVATION_APPROVED: String(env.LIVE_TELEGRAM_ACTIVATION_APPROVED ?? 'false'),
            TELEGRAM_INTELLIGENCE_WORKER_ENABLED: String(env.TELEGRAM_INTELLIGENCE_WORKER_ENABLED ?? 'false'),
            PERSONAL_TELEGRAM_WORKER_ENABLED: String(env.PERSONAL_TELEGRAM_WORKER_ENABLED ?? 'false'),
          });
          const restartAutomatic = (enabled, baselineEnv) => {
            execFileSync('pm2', ['restart', pm2Name, '--update-env'], {
              stdio: 'inherit',
              env: {
                ...process.env,
                ...preservedManualRuntimeEnv(baselineEnv),
                AUTO_TRADING: enabled ? 'true' : 'false',
                LIVE_AUTOMATIC_TRADING_ENABLED: enabled ? 'true' : 'false',
                MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: enabled ? 'true' : 'false',
                MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: enabled ? 'true' : 'false',
                CRYPTO_AUTO_LEGACY_EXECUTION_ENABLED: 'false',
                CRYPTO_AUTO_TRADE_ENABLED: 'false',
                BITGET_AUTO_TRADE_ENABLED: 'false',
                DEPLOY_SHA: target,
              },
            });
            execFileSync('pm2', ['save'], { stdio: 'inherit' });
          };

          const before = snapshot();
          let alreadyDesired = false;
          try {
            assertAllFourManual(before, true);
            alreadyDesired = true;
          } catch {}
          if (alreadyDesired) {
            execFileSync('sleep', ['2']);
            const persisted = snapshot();
            assertAllFourManual(persisted, true);
            requireWorkerWarmup(persisted, { requireCurrentArm: true });
            console.log(JSON.stringify({
              status: 'ALREADY_ACTIVATED_ALL4',
              targetSha: target,
              idempotent: true,
              persistenceReadback: 'PASS',
              WORKER_WARMUP_PROVEN: true,
              LIVE_ENTRY_ARM_PRESENT: true,
              REAL_ORDER_SUBMITTED: false,
            }));
            process.exit(0);
          }
          assertAllFourManual(before, false);
          const preserved = manualState(before);
          let mutated = false;
          try {
            disarmLiveEntries();
            restartAutomatic(true, before);
            mutated = true;
            const after = snapshot();
            assertAllFourManual(after, true);
            const warmupHealth = requireWorkerWarmup(after, { requireCurrentArm: false });
            const activateNotBeforeAt = armLiveEntries();
            if (JSON.stringify(manualState(after)) !== JSON.stringify(preserved)) {
              throw new Error('AUTOMATIC_TRADING_CHANGED_MANUAL_MARKET_AUTHORITY');
            }
            const persisted = snapshot();
            assertAllFourManual(persisted, true);
            if (JSON.stringify(manualState(persisted)) !== JSON.stringify(preserved)) {
              throw new Error('AUTOMATIC_TRADING_PERSISTENCE_CHANGED_MANUAL_MARKET_AUTHORITY');
            }
            console.log(JSON.stringify({
              status: 'ACTIVATED_ALL4',
              targetSha: target,
              markets: ['KR_STOCK','US_STOCK','CRYPTO_SPOT','CRYPTO_FUTURES'],
              providers: ['toss','kiwoom','upbit','bitget'],
              AUTO_TRADING: true,
              LIVE_AUTOMATIC_TRADING_ENABLED: true,
              MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: true,
              MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: true,
              PAPER_AUTOMATIC_EXECUTION: true,
              LIVE_AUTOMATIC_BACKGROUND_EXECUTION: true,
              persistenceReadback: 'PASS',
              WORKER_WARMUP_PROVEN: true,
              FIRST_WARMUP_TICK_LIVE_ENTRIES_ARMED: false,
              FIRST_WARMUP_TICK_LIVE_ORDERS: 0,
              FIRST_WARMUP_TICK_LIVE_EXIT_ORDERS: 0,
              LIVE_ENTRY_ARM_WRITTEN: true,
              LIVE_ENTRY_ARM_READBACK_PROVEN: true,
              LIVE_ENTRY_ARM_ACTIVATE_NOT_BEFORE: activateNotBeforeAt,
              LIVE_ENTRY_ARM_ACTIVATION_DELAY_MS: liveEntryArmActivationDelayMs,
              NEXT_TICK_ARM_TRANSITION_PROVEN_BY_ZERO_MUTATION_REHEARSAL: true,
              LIVE_READINESS_CYCLE_COMPLETE: warmupHealth.liveReadinessCycleComplete,
              LIVE_CYCLE_ORDER_ELIGIBLE: warmupHealth.liveCycleOrderEligible,
              LIVE_CYCLE_POLICY_READY: warmupHealth.liveCyclePolicyReady,
              LIVE_CYCLE_ALL_FOUR_POLICY_READY: warmupHealth.liveCycleAllFourPolicyReady,
              GLOBAL_EMERGENCY_STOP_ACTIVE: warmupHealth.globalEmergencyStopActive,
              TELEGRAM_DELIVERY_WORKER_POST_RESTART: 'HEALTHY',
              REAL_ORDER_SUBMITTED: false,
            }));
          } catch (cause) {
            if (mutated) {
              try {
                disarmLiveEntries();
                restartAutomatic(false, before);
                const rolledBack = snapshot();
                assertAllFourManual(rolledBack, false);
                if (JSON.stringify(manualState(rolledBack)) !== JSON.stringify(preserved)) {
                  throw new Error('AUTOMATIC_TRADING_ROLLBACK_CHANGED_MANUAL_AUTHORITY');
                }
                console.error('AUTOMATIC_TRADING_ACTIVATION_FAILED_ROLLED_BACK');
              } catch {
                console.error('AUTOMATIC_TRADING_ACTIVATION_FAILED_AND_ROLLBACK_FAILED');
              }
            }
            throw cause;
          }
          NODE

      - name: Record sanitized four-market automatic activation receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
          PRODUCTION_RUN_ID: ${{ steps.gate.outputs.production_run_id }}
          COMPREHENSIVE_RUN_ID: ${{ steps.gate.outputs.comprehensive_run_id }}
          ACCOUNT_RUN_ID: ${{ steps.gate.outputs.account_run_id }}
          SPOT_RECEIPT_ID: ${{ steps.gate.outputs.spot_receipt_comment_id }}
          FUTURES_RECEIPT_ID: ${{ steps.gate.outputs.futures_receipt_comment_id }}
          FUTURES_MAX_LEVERAGE: ${{ steps.gate.outputs.futures_max_leverage }}
          QA_SCOPE: ${{ steps.gate.outputs.qa_scope }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1555,
              body: [
                '[PRODUCTION_AUTOMATIC_TRADING_GATE]',
                'status: ACTIVATED_ALL4_AUTO',
                'target_sha: ' + process.env.TARGET_SHA,
                'markets: KR_STOCK,US_STOCK,CRYPTO_SPOT,CRYPTO_FUTURES',
                'providers: toss,kiwoom,upbit,bitget',
                'required_ci_run: ' + process.env.CI_RUN_ID,
                'production_deploy_run: ' + process.env.PRODUCTION_RUN_ID,
                'qa_scope: ' + process.env.QA_SCOPE,
                'production_qa_run: ' + process.env.PRODUCTION_RUN_ID,
                'production_comprehensive_qa_run: ' + (process.env.QA_SCOPE === 'full' ? process.env.COMPREHENSIVE_RUN_ID : 'NOT_RUN'),
                'production_trading_core_qa_run: ' + (process.env.QA_SCOPE === 'trading_core' ? process.env.PRODUCTION_RUN_ID : 'NOT_RUN'),
                'production_account_qa_run: ' + process.env.ACCOUNT_RUN_ID,
                'spot_manual_receipt_comment: ' + process.env.SPOT_RECEIPT_ID,
                'futures_manual_receipt_comment: ' + process.env.FUTURES_RECEIPT_ID,
                'futures_max_leverage: ' + process.env.FUTURES_MAX_LEVERAGE,
                'futures_margin_mode: isolated',
                'AUTO_TRADING=true',
                'LIVE_AUTOMATIC_TRADING_ENABLED=true',
                'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED=true',
                'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED=true',
                'paper_automatic_execution=true',
                'live_automatic_background_execution=true',
                'persistence_readback=PASS',
                'worker_warmup_proven=true',
                'first_warmup_tick_live_entries_armed=false',
                'first_warmup_tick_live_orders=0',
                'first_warmup_tick_live_exit_orders=0',
                'live_entry_arm_written=true',
                'live_entry_arm_readback_proven=true',
                'live_entry_arm_activation_delay_ms=120000',
                'next_tick_arm_transition_proven_by_zero_mutation_rehearsal=true',
                'live_readiness_cycle_complete=true',
                'live_cycle_order_eligible=true',
                'live_cycle_policy_ready=true',
                'live_cycle_all_four_policy_ready=true',
                'global_emergency_stop=false',
                'telegram_delivery_worker_post_restart=HEALTHY',
                'spot_executionAuthority=SPOT_LIVE_LIMITED',
                'futures_executionAuthority=FUTURES_LIVE_LIMITED',
                'transfer_withdrawal_authority=false',
                'REAL_ORDER_SUBMITTED=false',
                'workflow_run: ' + context.runId,
              ].join('\n'),
            });

  disable:
    name: Owner-approved four-market automatic disable preserving manual live authority
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/disable-production-auto-trading ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - name: Parse exact disable command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY || '').trim();
          const match = /^\/disable-production-auto-trading ([0-9a-f]{40})$/u.exec(body);
          if (!match) throw new Error('Expected /disable-production-auto-trading <40-char-deployed-sha>');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + match[1] + '\n');
          NODE

      - name: Configure protected Production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Disable only automatic flags and preserve all four manual market gates
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node --input-type=module -" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, renameSync, rmSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';

          const target = String(process.env.TARGET_SHA || '');
          const pm2Name = 'stock-app';
          const liveEntryArmPath = '/opt/stock-app/.deploy/auto-trading-live-entry-arm.json';
          if (readFileSync('/opt/stock-app/.deploy/current-sha', 'utf8').trim() !== target) {
            throw new Error('AUTOMATIC_TRADING_DISABLE_DEPLOY_SHA_MISMATCH');
          }
          const bool = (env, key) => {
            const value = env[key];
            if (value === true || value === 'true') return true;
            if (value === false || value === 'false' || value === undefined) return false;
            throw new Error('AUTOMATIC_TRADING_DISABLE_FLAG_MALFORMED:' + key);
          };
          const readEnv = () => {
            const rows = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const matches = rows.filter((row) => row?.name === pm2Name);
            if (matches.length !== 1 || matches[0]?.pm2_env?.status !== 'online'
              || String(matches[0].pm2_env.DEPLOY_SHA || '') !== target) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_PM2_INVALID');
            }
            return matches[0].pm2_env;
          };
          const manual = (env) => ({
            live: bool(env, 'LIVE_TRADING'),
            real: bool(env, 'REAL_ORDER_ENABLED'),
            privateApi: bool(env, 'PRIVATE_TRADING_API_ALLOWED'),
            orderExecution: bool(env, 'ORDER_EXECUTION_ENABLED'),
            liveApproved: bool(env, 'LIVE_TRADING_ACTIVATION_APPROVED'),
            spotApproved: bool(env, 'SPOT_LIVE_LIMITED_ACTIVATION_APPROVED'),
            toss: bool(env, 'TOSS_LIVE_ORDER_ENABLED'),
            kiwoom: bool(env, 'KIWOOM_LIVE_ORDER_ENABLED'),
            upbit: bool(env, 'UPBIT_LIVE_ORDER_ENABLED'),
            spotAuthority: String(env.executionAuthority || 'NONE'),
            spotCaps: String(env.SPOT_LIVE_CAPABILITY_ALLOWLIST || ''),
            spotMarkets: String(env.SPOT_LIVE_MARKET_ALLOWLIST || ''),
            futuresApproved: bool(env, 'FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED'),
            bitgetFutures: bool(env, 'BITGET_FUTURES_LIVE_ORDER_ENABLED'),
            futuresAuthority: String(env.FUTURES_LIVE_EXECUTION_AUTHORITY || ''),
            futuresCaps: String(env.FUTURES_LIVE_CAPABILITY_ALLOWLIST || ''),
            futuresMarkets: String(env.FUTURES_LIVE_MARKET_ALLOWLIST || ''),
            futuresMaxLeverage: String(env.FUTURES_LIVE_MAX_LEVERAGE || ''),
            futuresMarginMode: String(env.FUTURES_LIVE_MARGIN_MODE || ''),
          });

          const before = readEnv();
          const preserved = manual(before);
          const automaticWasEnabled = bool(before, 'AUTO_TRADING')
            || bool(before, 'LIVE_AUTOMATIC_TRADING_ENABLED')
            || bool(before, 'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED')
            || bool(before, 'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED');
          if (automaticWasEnabled) {
            const port = String(before.PORT || before.API_PORT || '8080');
            let health;
            try {
              health = JSON.parse(execFileSync('curl', [
                '--fail', '--silent', '--show-error', '--max-time', '3',
                'http://127.0.0.1:' + port + '/api/health',
              ], { encoding: 'utf8' }));
            } catch {
              throw new Error('AUTOMATIC_TRADING_DISABLE_HEALTH_UNAVAILABLE');
            }
            const autoHealth = health?.autoTradingBackground;
            const lastTickMs = Date.parse(String(autoHealth?.lastTickAt || ''));
            const nowMs = Date.now();
            if (autoHealth?.enabled !== true
              || autoHealth?.liveModeRequested !== true
              || autoHealth?.tickOk !== true
              || !Number.isFinite(lastTickMs)
              || lastTickMs > nowMs
              || nowMs - lastTickMs > 360_000) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_HEALTH_STALE_OR_INVALID');
            }
            const openLivePositions = Number(autoHealth?.liveTrackedPositions);
            if (!Number.isInteger(openLivePositions) || openLivePositions < 0) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_LIVE_POSITION_COUNT_INVALID');
            }
            if (openLivePositions > 0) {
              throw new Error('AUTOMATIC_TRADING_DISABLE_OPEN_LIVE_POSITIONS:' + openLivePositions);
            }
          }
          rmSync(liveEntryArmPath, { force: true });
          execFileSync('pm2', ['restart', pm2Name, '--update-env'], {
            stdio: 'inherit',
            env: {
              ...process.env,
              AUTO_TRADING: 'false',
              LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
              MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
              MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
              CRYPTO_AUTO_LEGACY_EXECUTION_ENABLED: 'false',
              CRYPTO_AUTO_TRADE_ENABLED: 'false',
              BITGET_AUTO_TRADE_ENABLED: 'false',
              DEPLOY_SHA: target,
            },
          });
          execFileSync('pm2', ['save'], { stdio: 'inherit' });

          const after = readEnv();
          if (bool(after, 'AUTO_TRADING')
            || bool(after, 'LIVE_AUTOMATIC_TRADING_ENABLED')
            || bool(after, 'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED')
            || bool(after, 'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED')) {
            throw new Error('AUTOMATIC_TRADING_DISABLE_POSTCHECK_FAILED');
          }
          if (JSON.stringify(manual(after)) !== JSON.stringify(preserved)) {
            throw new Error('AUTOMATIC_TRADING_DISABLE_CHANGED_MANUAL_LIVE_AUTHORITY');
          }
          console.log('AUTOMATIC_TRADING_DISABLED_ALL4_MANUAL_LIVE_PRESERVED');
          console.log('REAL_ORDER_SUBMITTED=false');
          NODE

      - name: Record sanitized disable receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1555,
              body: [
                '[PRODUCTION_AUTOMATIC_TRADING_GATE]',
                'status: DISABLED_ALL4_MANUAL_LIVE_PRESERVED',
                'target_sha: ' + process.env.TARGET_SHA,
                'AUTO_TRADING=false',
                'LIVE_AUTOMATIC_TRADING_ENABLED=false',
                'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED=false',
                'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED=false',
                'paper_automatic_execution=false',
                'live_automatic_background_execution=false',
                'manual_spot_and_futures_authority_preserved=true',
                'REAL_ORDER_SUBMITTED=false',
                'workflow_run: ' + context.runId,
              ].join('\n'),
            });
