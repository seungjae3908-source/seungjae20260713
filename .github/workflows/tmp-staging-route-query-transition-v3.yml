name: Temporary staging route query transition patch

on:
  push:
    branches:
      - fix/staging-route-query-transition-v3

permissions:
  contents: write

concurrency:
  group: tmp-staging-route-query-transition-v3
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-route-query-transition-v3
          fetch-depth: 0
      - name: Apply bounded route identity patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('stock-analyzer/e2e/phase10-staging-readiness.spec.ts')
          text = target.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "type RouteTransitionObservation = {\n  fromPath: string;\n  toPath: string;\n  candidates: Diagnostic[];\n  pendingGetRequests: Set<Request>;\n};",
              "type RouteTransitionObservation = {\n  fromRoute: string;\n  toRoute: string;\n  candidates: Diagnostic[];\n  pendingGetRequests: Set<Request>;\n};",
          )
          replace_once(
              "function diagnosticText(raw: string) {",
              "function routeIdentity(raw: string, base?: string) {\n  const parsed = base ? new URL(raw, base) : new URL(raw);\n  return `${parsed.pathname}${parsed.search}`;\n}\n\nfunction diagnosticText(raw: string) {",
          )
          replace_once(
              "return observation.fromPath !== observation.toPath",
              "return observation.fromRoute !== observation.toRoute",
          )

          healthy_old = """  const observation: RouteTransitionObservation = {
    fromPath: new URL(page.url()).pathname,
    toPath: new URL(route, page.url()).pathname,
    candidates: [],
    pendingGetRequests: new Set(pendingApiGetRequests.get(page) ?? []),
  };"""
          healthy_new = """  const observation: RouteTransitionObservation = {
    fromRoute: routeIdentity(page.url()),
    toRoute: routeIdentity(route, page.url()),
    candidates: [],
    pendingGetRequests: new Set(pendingApiGetRequests.get(page) ?? []),
  };"""
          count = text.count(healthy_old)
          if count != 2:
              raise SystemExit(f'expected exactly two healthy/denied observation blocks, found {count}')
          text = text.replace(healthy_old, healthy_new)

          assertion_old = "expect(new URL(page.url()).pathname).toBe(observation.toPath);"
          assertion_new = "expect(routeIdentity(page.url())).toBe(observation.toRoute);"
          count = text.count(assertion_old)
          if count != 3:
              raise SystemExit(f'expected exactly three route assertions, found {count}')
          text = text.replace(assertion_old, assertion_new)

          replace_once(
              """  const observation: RouteTransitionObservation = {
    fromPath: new URL(page.url()).pathname,
    toPath: '/scanner',
    candidates: [],
    pendingGetRequests: new Set(pendingApiGetRequests.get(page) ?? []),
  };""",
              """  const observation: RouteTransitionObservation = {
    fromRoute: routeIdentity(page.url()),
    toRoute: routeIdentity('/scanner', page.url()),
    candidates: [],
    pendingGetRequests: new Set(pendingApiGetRequests.get(page) ?? []),
  };""",
          )

          for forbidden in ('fromPath', 'toPath'):
              if forbidden in text:
                  raise SystemExit(f'legacy route identity field remains: {forbidden}')

          target.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/tmp-staging-route-query-transition-v3.yml
          git diff --check
          git diff -- stock-analyzer/e2e/phase10-staging-readiness.spec.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stock-analyzer/e2e/phase10-staging-readiness.spec.ts .github/workflows/tmp-staging-route-query-transition-v3.yml
          git commit -m "test: distinguish query-only route transitions"
          git push origin HEAD:fix/staging-route-query-transition-v3
