name: Research Crypto Futures Deterministic LONG Forward V5.4.3

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/audit-crypto-futures-causal-long-forward-v543.py
      - .github/workflows/research-crypto-futures-causal-long-forward-v543.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-causal-long-forward-v543-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: "37475568221"
      SOURCE_ARTIFACT: "crypto-futures-causal-long-opportunity-ranker-v542-0dcfd2c31c71be995bf34f10acd53379759473c0"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-causal-long-forward-v543.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-causal-long-opportunity-ranker-v542.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.3.3" "numpy==2.5.3" "pyarrow==21.0.0" "polars==1.44.2" "huggingface_hub==0.36.2" "requests==2.34.2" "duckdb==1.5.6" "lightgbm==4.5.0" "scikit-learn==1.5.2"

      - name: Download frozen deterministic V5.4.2 summary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-v542

      - name: Run deterministic frozen post-October forward audit
        run: |
          SUMMARY="$(find source-v542 -name summary.json -print -quit)"
          test -n "$SUMMARY"
          python market-prediction-lab/scripts/audit-crypto-futures-causal-long-forward-v543.py             --source-summary "$SUMMARY"             --out-dir market-prediction-lab/docs/crypto-futures-causal-long-forward-v543

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-causal-long-forward-v543-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-causal-long-forward-v543
          if-no-files-found: error
          retention-days: 14
