name: Research Crypto Futures Causal Opportunity Ranker V5.3

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-futures-causal-opportunity-ranker-v53.py
      - .github/workflows/research-crypto-futures-causal-opportunity-ranker-v53.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-causal-opportunity-ranker-v53-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-causal-opportunity-ranker-v53.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-full-universe-flow-v4.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "polars>=1.30,<2" "huggingface_hub>=0.30,<1" "requests>=2.32,<3" "duckdb>=1.3,<2" "lightgbm>=4.5,<5" "scikit-learn>=1.5,<2"

      - name: Run full-universe causal opportunity ranker
        run: |
          python market-prediction-lab/scripts/run-crypto-futures-causal-opportunity-ranker-v53.py             --out-dir market-prediction-lab/docs/crypto-futures-causal-opportunity-ranker-v53

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-causal-opportunity-ranker-v53-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-causal-opportunity-ranker-v53
          if-no-files-found: error
          retention-days: 14
