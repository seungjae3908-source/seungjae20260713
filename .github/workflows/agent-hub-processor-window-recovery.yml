name: Agent Hub Processor Window Recovery

on:
  pull_request:
    paths:
      - scripts/agent_hub_processor_window_recovery_v1.py
      - scripts/test_agent_hub_processor_window_recovery_v1.py
      - .github/workflows/agent-hub-processor-window-recovery.yml
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_issue:
        description: Overflowed canonical Hub issue number
        required: true
        default: "660"
        type: string
      confirmation:
        description: Must be RECOVER_ISSUE_<number>_PROCESSOR_OVERFLOW
        required: true
        type: string
      apply:
        description: Apply issue rollover mutations after dry-run validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-hub-processor-window-recovery-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.action == 'created' &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/recover-agent-hub-processor-window'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile recovery path
        run: >-
          python -m py_compile
          scripts/agent_hub_processor_window_recovery_v1.py
          scripts/test_agent_hub_processor_window_recovery_v1.py
      - name: Run fail-closed recovery tests
        run: python -m unittest scripts.test_agent_hub_processor_window_recovery_v1 -v

  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/recover-agent-hub-processor-window'
      )
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      RECOVERY_SOURCE_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_issue || github.event.issue.number }}
      RECOVERY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || format('RECOVER_ISSUE_{0}_PROCESSOR_OVERFLOW', github.event.issue.number) }}
      RECOVERY_APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || github.event_name == 'issue_comment' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover processor-window overflow
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --source-issue "$RECOVERY_SOURCE_ISSUE"
            --confirmation "$RECOVERY_CONFIRMATION"
          )
          if [[ "$RECOVERY_APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          python scripts/agent_hub_processor_window_recovery_v1.py "${args[@]}"
