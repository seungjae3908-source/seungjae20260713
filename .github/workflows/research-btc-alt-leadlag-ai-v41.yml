name: Research BTC-Alt LeadLag AI V4.1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-btc-alt-leadlag-ai-v41.py
      - .github/workflows/research-btc-alt-leadlag-ai-v41.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-btc-alt-leadlag-ai-v41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leadlag-ai:
    strategy:
      fail-fast: false
      matrix:
        market: [CRYPTO_SPOT, CRYPTO_FUTURES]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-btc-alt-leadlag-ai-v41.py
          python -m py_compile market-prediction-lab/scripts/run-btc-alt-leadlag-extreme-v4.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1" "requests>=2.32,<3" "lightgbm>=4.5,<5"
      - name: Run AI BTC-alt 1m lead-lag V4.1
        run: |
          python market-prediction-lab/scripts/run-btc-alt-leadlag-ai-v41.py \
            --market ${{ matrix.market }} \
            --out-dir market-prediction-lab/docs/btc-alt-leadlag-ai-v41/${{ matrix.market }}
      - name: Upload AI lead-lag evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-alt-leadlag-ai-v41-${{ matrix.market }}-${{ github.sha }}
          path: market-prediction-lab/docs/btc-alt-leadlag-ai-v41/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: leadlag-ai
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: btc-alt-leadlag-ai-v41-*
          path: all-ai
      - name: Combine summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('all-ai').glob('**/summary.json'):
              try: x=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              if x.get('contract')!='btc-alt-leadlag-ai-v41': continue
              rows.append({
                'market':x.get('market'),
                'fullUSDTAltUniverse':x.get('fullUSDTAltUniverse'),
                'candidateCount':x.get('candidateCount'),
                'eligibleAfterCalibrationCount':x.get('eligibleAfterCalibrationCount'),
                'validationPassCount':x.get('validationPassCount'),
                'validationPassCandidates':x.get('validationPassCandidates'),
                'selectedByCalibration':x.get('selectedByCalibration'),
                'selectedResults':x.get('selectedResults'),
                'modelAudit':x.get('modelAudit'),
              })
          missing=sorted({'CRYPTO_SPOT','CRYPTO_FUTURES'}-{r['market'] for r in rows})
          out={'contract':'btc-alt-leadlag-ai-v41-combined','markets':rows,'missingMarkets':missing,'totalValidationPassCount':sum(int(r.get('validationPassCount') or 0) for r in rows),'truthBoundary':{'profitabilityProven':False,'executionAuthority':'NONE'}}
          Path('combined').mkdir(exist_ok=True)
          Path('combined/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'FINAL_COMBINED':out},ensure_ascii=False))
          if missing: raise SystemExit(1)
          PY
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-alt-leadlag-ai-v41-combined-${{ github.sha }}
          path: combined
          if-no-files-found: error
          retention-days: 14
