name: Phase4 Risk Warning Compatibility Fix

on:
  push:
    branches:
      - feature/futures-contract-rules-ui-phase4
    paths:
      - .github/workflows/phase4-risk-warning-compat-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/futures-contract-rules-ui-phase4

      - name: Preserve Phase 3 warning contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api-server/src/services/trading-risk-engine.service.ts')
          text = path.read_text()
          old = "    warnings.push('거래소 최소 주문 규칙을 확인할 수 없습니다.');"
          new = "    warnings.push('거래소 최소 주문 규칙을 확인할 수 없습니다.');\n    warnings.push('실제 거래소 최소 수량 규칙은 미확인입니다.');"
          if text.count(old) != 1:
              raise SystemExit('target warning line not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/phase4-risk-warning-compat-fix.yml
          git add api-server/src/services/trading-risk-engine.service.ts
          git commit -m "fix: preserve Phase 3 missing-rule warning contract"
          git push origin HEAD:feature/futures-contract-rules-ui-phase4
