name: Research BTC-Alt V4.2 Selected Audit

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-btc-alt-v42-selected-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "37412805257"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1"
      - name: Download Futures V4 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: btc-alt-leadlag-extreme-v4-CRYPTO_FUTURES-*
          path: v4
      - name: Audit selected candidate with sparse-event month gate
        run: |
          python - <<'PY'
          import json, importlib.util, pandas as pd, polars as pl
          from pathlib import Path
          ledgers=list(Path('v4').glob('**/selected-ledger.csv'))
          summaries=list(Path('v4').glob('**/summary.json'))
          if not ledgers or not summaries: raise SystemExit('V4 artifact incomplete')
          summary=json.loads(summaries[0].read_text(encoding='utf-8'))
          df=pd.read_csv(ledgers[0])
          df['date']=pd.to_datetime(df['date'],errors='coerce').dt.date
          spec=importlib.util.spec_from_file_location('m','market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          def met(a,b):
              x=df[(df['date']>=pd.Timestamp(a).date())&(df['date']<pd.Timestamp(b).date())].copy()
              p=pl.from_pandas(x).with_columns(pl.col('date').cast(pl.Date)) if len(x) else pl.DataFrame(schema={'date':pl.Date,'netReturn':pl.Float64,'MFE':pl.Float64})
              dates=[d.date() for d in pd.date_range(a,pd.Timestamp(b)-pd.Timedelta(days=1),freq='D')]
              return m.metrics(p,'CRYPTO_FUTURES',dates)
          def gate(x,min_trades,min_active):
              pos=int(x.get('monthsPositive') or 0); neg=int(x.get('monthsNegative') or 0); active=pos+neg
              rate=(pos/active) if active else 0.0
              checks={
                'positiveReturn':float(x.get('totalReturn') or 0)>0,
                'profitFactorAbove1':float(x.get('profitFactor') or 0)>1,
                'positiveActiveMonthRateAtLeast50pct':rate>=0.5,
                'minimumActiveMonths':active>=min_active,
                'mddAtMost35pct':float(x.get('mdd') or 1)<=0.35,
                'minimumTrades':int(x.get('tradeCount') or 0)>=min_trades,
              }
              return {'pass':all(checks.values()),'activeMonthPositiveRate':rate,'activeMonths':active,'checks':checks}
          periods={
            'train':('2023-04-01','2024-10-01',30,6),
            'calibration':('2024-10-01','2025-04-01',10,3),
            'validation':('2025-04-01','2026-04-01',10,4),
            'postHoc':('2026-04-01','2026-10-01',8,3),
          }
          out={}
          for name,(a,b,n,am) in periods.items():
              mm=met(a,b); out[name]={'metrics':mm,'gate':gate(mm,n,am)}
          result={
            'contract':'btc-alt-v42-selected-audit',
            'candidate':summary.get('selectedByCalibration'),
            'sourceRun':37412805257,
            'periods':out,
            'validationPass':out['validation']['gate']['pass'],
            'postHocPass':out['postHoc']['gate']['pass'],
            'truthBoundary':{
              'usesFrozenV4SelectedLedger':True,
              'noTradeMonthsNeutral':True,
              'candidateWasSelectedBeforeThisGateCorrection':True,
              'fullV42GridRerunStillRequiredForFinalSelection':True,
              'profitabilityProven':False,
              'executionAuthority':'NONE'
            }
          }
          print(json.dumps({'FINAL':result},ensure_ascii=False))
          PY
