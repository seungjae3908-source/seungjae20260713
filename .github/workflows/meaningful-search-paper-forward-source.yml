name: Meaningful Search Paper Forward Source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/meaningful-search-paper-forward-source.yml
      - market-prediction-lab/src/meaningful-search-paper-forward-source-v1.js
      - market-prediction-lab/tests/meaningful-search-paper-forward-source-v1.test.js

permissions:
  contents: read

jobs:
  meaningful-search-paper-forward-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run Meaningful Search Paper forward-source tests
        run: node --test market-prediction-lab/tests/meaningful-search-paper-forward-source-v1.test.js
