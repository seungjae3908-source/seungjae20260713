name: US PIT Risk-Adjusted Momentum V2

on:
  push:
    branches:
      - research/pit-us-orderflow-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-us-pit-risk-adjusted-momentum-v2.py
      - .github/workflows/us-pit-risk-adjusted-momentum-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-us-pit-risk-adjusted-momentum-v2.py
      - name: Run PIT risk-adjusted momentum
        run: python market-prediction-lab/scripts/run-us-pit-risk-adjusted-momentum-v2.py
      - name: Verify safety and coverage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-prediction-lab/artifacts/us-pit-risk-adjusted-momentum-v2/result.json").read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert d["lookahead_free"] is True
          assert d["symbol_count"] >= 500
          assert d["results"]["RISK_ADJ_12_1"]["base"]["avg_coverage"] >= 0.70
          print("US_PIT_RISK_ADJ_CONTRACT=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: us-pit-risk-adjusted-momentum-v2-${{ github.sha }}
          path: market-prediction-lab/artifacts/us-pit-risk-adjusted-momentum-v2/
          if-no-files-found: error
          retention-days: 30
