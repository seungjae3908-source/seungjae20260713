name: Research US Low-Price Causal Pullback V9

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-us-lowprice-causal-pullback-v9.py
      - .github/workflows/research-us-lowprice-causal-pullback-v9.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-us-lowprice-causal-pullback-v9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-us-lowprice-causal-pullback-v9.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "requests>=2.32,<3" "polars>=1.30,<2" "huggingface_hub>=0.30,<1"
      - name: Run causal low-price pullback research
        run: |
          python market-prediction-lab/scripts/run-us-lowprice-causal-pullback-v9.py \
            --out-dir market-prediction-lab/docs/us-lowprice-causal-pullback-v9
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-lowprice-causal-pullback-v9-${{ github.sha }}
          path: market-prediction-lab/docs/us-lowprice-causal-pullback-v9
          if-no-files-found: error
          retention-days: 14
