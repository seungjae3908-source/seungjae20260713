name: Information Analysis Hub Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-info-analysis-hub.py
      - .github/workflows/info-analysis-hub-validation.yml

permissions:
  contents: write

concurrency:
  group: info-analysis-hub-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout information branch
        uses: actions/checkout@v4
        with:
          ref: feature/stock-info-self-analysis-v1
          fetch-depth: 0

      - name: Integrate latest main without deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          echo "INFO_ANALYSIS_BASELINE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect analysis hub to information page
        run: python3 scripts/apply-info-analysis-hub.py

      - name: Validate source contracts
        run: |
          git diff --check
          node api-server/scripts/verify-info-tab-contract.mjs
          node api-server/scripts/verify-info-analysis-hub-contract.mjs

      - name: Bundle and test deterministic analysis engine
        run: |
          pnpm --dir api-server exec esbuild ../stock-analyzer/src/lib/stock-analysis-engine.ts --bundle --platform=node --format=esm --outfile=/tmp/stock-analysis-engine.mjs
          node stock-analyzer/scripts/test-stock-analysis-engine.mjs /tmp/stock-analysis-engine.mjs

      - name: Typecheck frontend and backend
        run: |
          pnpm --dir stock-analyzer run typecheck
          pnpm --dir api-server run typecheck

      - name: Run backend regression suites
        run: |
          pnpm --dir api-server run test
          pnpm --dir api-server run test:risk
          pnpm --dir api-server run test:phase4
          pnpm --dir api-server run test:phase5
          pnpm --dir api-server run test:phase6
          pnpm --dir api-server run test:phase7
          pnpm --dir api-server run test:phase8
          pnpm --dir api-server run test:phase9
          pnpm --dir api-server run test:smoke

      - name: Build frontend and backend
        run: |
          pnpm --dir stock-analyzer run build
          pnpm --dir api-server run build

      - name: Install Chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium

      - name: Run analysis hub browser scenarios
        id: analysis_browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir stock-analyzer exec playwright test e2e/info-analysis-hub.spec.ts --reporter=line 2>&1 | tee /tmp/info-analysis-hub-browser.log

      - name: Persist analysis hub browser diagnostics
        if: steps.analysis_browser.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '# Information Analysis Hub Browser Failure'
            echo
            echo '## Playwright output'
            echo '```text'
            tail -n 700 /tmp/info-analysis-hub-browser.log
            echo '```'
            echo
            echo '## Error contexts'
            find stock-analyzer/test-results -type f \( -name 'error-context.md' -o -name '*.txt' \) -print | while read -r file; do
              echo
              echo "### ${file}"
              sed -n '1,300p' "$file"
            done
          } > INFO_ANALYSIS_HUB_BROWSER_FAILURE.md
          git add INFO_ANALYSIS_HUB_BROWSER_FAILURE.md
          git commit -m 'chore: capture information analysis hub browser failure'
          git push origin HEAD:feature/stock-info-self-analysis-v1
          exit 1

      - name: Run full browser regression
        run: pnpm --dir stock-analyzer run test:e2e

      - name: Update validation report
        run: |
          cat >> INFO_TAB_VALIDATION_REPORT.md <<REPORT

          ## Analysis Hub Extension

          - Baseline main SHA: \`${INFO_ANALYSIS_BASELINE}\`
          - Deterministic stock analysis engine scenarios: passed
          - Sector modules: quantum, semiconductor, biotech, AI/software, automotive, financial, general
          - Event impact and source-confirmation weighting: passed
          - Information analysis hub Playwright scenarios: passed
          - Full Playwright regression after analysis extension: passed
          - Frontend/backend typecheck and build: passed
          - Backend default/risk/phase4-9/smoke regression: passed
          - OpenAI dependency, deployment, Supabase, Secret, permission, and live-order changes: none
          REPORT

      - name: Remove generated artifacts and maintenance files
        run: |
          git restore --worktree --staged api-server/dist stock-analyzer/dist 2>/dev/null || true
          rm -rf stock-analyzer/playwright-report stock-analyzer/test-results
          rm -f INFO_ANALYSIS_HUB_BROWSER_FAILURE.md
          git rm .github/workflows/info-analysis-hub-validation.yml scripts/apply-info-analysis-hub.py

      - name: Commit validated source changes
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'feat: add information tab stock analysis hub'
          git push origin HEAD:feature/stock-info-self-analysis-v1
