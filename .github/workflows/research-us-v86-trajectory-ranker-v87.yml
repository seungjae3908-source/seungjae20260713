name: Research US V8.6 Trajectory Ranker V8.7

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-us-v86-trajectory-ranker-v87.py
      - .github/workflows/research-us-v86-trajectory-ranker-v87.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-us-v86-trajectory-ranker-v87-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: train1
            period: train
            months: "2025-04,2025-05,2025-06"
          - name: train2
            period: train
            months: "2025-07,2025-08,2025-09"
          - name: calibration
            period: calibration
            months: "2025-10,2025-11"
          - name: validation
            period: validation
            months: "2025-12,2026-01"
          - name: fresh
            period: fresh_oos
            months: "2026-02"
          - name: diagnostic
            period: diagnostic
            months: "2026-03"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      V8_RUN_ID: "37441335961"
      V8_ARTIFACT: "us-all-session-target-first-ai-v8-38500a40278149e2d48e89e0a5efbb4947c752f3"
      V82_RUN_ID: "37444336518"
      V82_ARTIFACT: "us-all-session-target-first-ai-v82-recall-34021959e578be14c07f392cbc40f6a17df36a78"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-us-v86-trajectory-ranker-v87.py
          python -m py_compile market-prediction-lab/scripts/run-us-v82-fullstate-portfolio-v83.py
          python -m py_compile market-prediction-lab/scripts/train-us-all-session-target-first-ai-v8.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.3,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "huggingface_hub>=0.30,<1" "lightgbm==4.5.0" "scikit-learn==1.5.2"

      - name: Download frozen V8 train data
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V8_RUN_ID }}
          name: ${{ env.V8_ARTIFACT }}
          path: frozen-v8

      - name: Download frozen V8.2 threshold
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V82_RUN_ID }}
          name: ${{ env.V82_ARTIFACT }}
          path: frozen-v82

      - name: Extract causal trajectory evidence
        env:
          PERIOD: ${{ matrix.period }}
          MONTHS_CSV: ${{ matrix.months }}
          SHARD_NAME: ${{ matrix.name }}
        run: |
          EVENTS="$(find frozen-v8 -name events-target-first.parquet -print -quit)"
          SUMMARY="$(find frozen-v82 -name summary.json -print -quit)"
          test -n "$EVENTS"
          test -n "$SUMMARY"
          ARGS=()
          IFS=',' read -ra MONTHS <<< "$MONTHS_CSV"
          for M in "${MONTHS[@]}"; do
            ARGS+=(--month "$M")
          done
          python market-prediction-lab/scripts/run-us-v86-trajectory-ranker-v87.py extract \
            --frozen-events "$EVENTS" \
            --v82-summary "$SUMMARY" \
            --period "$PERIOD" \
            "${ARGS[@]}" \
            --out-dir "market-prediction-lab/docs/us-v86-trajectory-ranker-v87/$SHARD_NAME"

      - name: Upload trajectory shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-v86-trajectory-ranker-v87-${{ matrix.name }}-${{ github.sha }}
          path: market-prediction-lab/docs/us-v86-trajectory-ranker-v87/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  combine-train:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-us-v86-trajectory-ranker-v87.py
          python -m py_compile market-prediction-lab/scripts/run-us-v82-fullstate-portfolio-v83.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.3,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "huggingface_hub>=0.30,<1" "lightgbm==4.5.0" "scikit-learn==1.5.2"

      - name: Download trajectory shards
        uses: actions/download-artifact@v4
        with:
          pattern: us-v86-trajectory-ranker-v87-*
          path: shards

      - name: Verify all six period shards
        run: |
          COUNT="$(find shards -name trajectory-labeled.parquet | wc -l | tr -d ' ')"
          test "$COUNT" = "6"

      - name: Train causal trajectory ranker
        run: |
          python market-prediction-lab/scripts/run-us-v86-trajectory-ranker-v87.py train \
            --input-root shards \
            --out-dir market-prediction-lab/docs/us-v86-trajectory-ranker-v87/combined

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-v86-trajectory-ranker-v87-combined-${{ github.sha }}
          path: market-prediction-lab/docs/us-v86-trajectory-ranker-v87/combined
          if-no-files-found: error
          retention-days: 14
