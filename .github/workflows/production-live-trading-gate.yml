name: Production Live Trading Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/production-live-trading-gate.yml
      - api-server/src/services/trade-automation.service.ts
      - api-server/src/services/spot-live-limited-capability.service.ts
      - api-server/src/services/trade-execution.service.ts
      - ops/deploy-production.sh
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment'
        && github.event.issue.number == 1555
        && github.event.comment.user.login == 'seungjae3908-source'
        && github.event.comment.author_association == 'OWNER'
        && (startsWith(github.event.comment.body, '/activate-production-live-trading ')
            || startsWith(github.event.comment.body, '/disable-production-live-trading '))
        && 'production-live-trading-gate'
        || format('production-live-trading-gate-validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate-contract:
    name: Validate Production live-trading gate safety contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate fail-closed authority contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          workflow=.github/workflows/production-live-trading-gate.yml
          grep -Fq "/activate-production-live-trading " "$workflow"
          grep -Fq "/disable-production-live-trading " "$workflow"
          grep -Fq "CONFIRM_NO_OPEN_LIVE_ORDERS" "$workflow"
          grep -Fq "environment: production" "$workflow"
          grep -Fq "ORDER_EXECUTION_ENABLED: 'true'" "$workflow"
          grep -Fq "LIVE_TRADING_ACTIVATION_APPROVED: 'true'" "$workflow"
          grep -Fq "SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: 'true'" "$workflow"
          grep -Fq "SPOT_LIVE_CAPABILITY_ALLOWLIST" "$workflow"
          grep -Fq "SPOT_LIVE_MARKET_ALLOWLIST" "$workflow"
          grep -Fq "REAL_ORDER_ENABLED: 'true'" "$workflow"
          grep -Fq "PRIVATE_TRADING_API_ALLOWED: 'true'" "$workflow"
          grep -Fq "LIVE_AUTOMATIC_TRADING_ENABLED: 'false'" "$workflow"
          grep -Fq "AUTO_TRADING: 'false'" "$workflow"
          grep -Fq "executionAuthority: 'SPOT_LIVE_LIMITED'" "$workflow"
          grep -Fq "executionAuthority: 'NONE'" "$workflow"
          grep -Fq "REAL_ORDER_SUBMITTED=false" "$workflow"
          grep -Fq "LIVE_TRADING_EXACT_COMPREHENSIVE_QA_REQUIRED" "$workflow"
          grep -Fq "LIVE_TRADING_EXACT_ACCOUNT_QA_REQUIRED" "$workflow"
          grep -Fq 'production-comprehensive-readonly-${run.id}' "$workflow"
          grep -Fq 'production-account-readonly-live-${target}' "$workflow"
          grep -Fq 'actions/download-artifact@v4' "$workflow"
          grep -Fq 'testedProviders' "$workflow"
          grep -Fq 'reconciliationPassed' "$workflow"
          grep -Fq 'production-account-readonly-live-qa-v2' "$workflow"
          grep -Fq "const disableTradingGates = () =>" "$workflow"
          grep -Fq "LIVE_TRADING_ACTIVATION_FAILED_ROLLED_BACK" "$workflow"
          grep -Fq "LIVE_TRADING_ACTIVATION_FAILED_AND_ROLLBACK_FAILED" "$workflow"
          ! grep -Eq '^[[:space:]]{2}(workflow_dispatch|schedule):' "$workflow"
          ! grep -Eq 'contents:[[:space:]]+write' "$workflow"
          ! grep -Eq 'AUTO_TRADING:[[:space:]]+["'\'']?true' "$workflow"
          ! grep -Eq 'LIVE_AUTOMATIC_TRADING_ENABLED:[[:space:]]+["'\'']?true' "$workflow"
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const source = fs.readFileSync('.github/workflows/production-live-trading-gate.yml', 'utf8');
          const blocks = [...source.matchAll(/<<'NODE'\n([\s\S]*?)\n\s+NODE/g)].map((match) => match[1]);
          const operational = blocks.filter((block) =>
            block.includes('LIVE_TRADING_') || block.includes('activate-production-live-trading')
          );
          if (operational.length < 3) throw new Error('LIVE_TRADING_OPERATIONAL_HEREDOC_MISSING');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'live-trading-gate-js-'));
          try {
            operational.forEach((block, index) => {
              const file = path.join(dir, `block-${index}.mjs`);
              fs.writeFileSync(file, block);
              const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
              if (result.status !== 0) throw new Error(result.stderr || result.stdout || `BLOCK_${index}_SYNTAX_FAILED`);
            });
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
          }
          NODE

  activate:
    name: Owner-approved manual Production live-trading gate activation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/activate-production-live-trading ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: read
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner activation command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/activate-production-live-trading ([0-9a-f]{40}) ([a-z]+(?:,[a-z]+)*)$/u.exec(body);
          if (!match) throw new Error('Expected /activate-production-live-trading <40-char-current-main-sha> <provider[,provider...]>');
          const allowed = new Set(['toss', 'kiwoom', 'upbit']);
          const providers = match[2].split(',');
          if (providers.length === 0 || new Set(providers).size !== providers.length || providers.some((p) => !allowed.has(p))) {
            throw new Error('LIVE_TRADING_PROVIDER_SET_INVALID');
          }
          const canonical = [...providers].sort().join(',');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1]}\nproviders=${canonical}\n`);
          NODE

      - name: Require exact current main and coherent Required CI 6/6
        id: gate
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const branch = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            })).data;
            if (branch.commit.sha !== target) {
              core.setFailed(`LIVE_TRADING_MAIN_SHA_MISMATCH:target=${target}:main=${branch.commit.sha}`);
              return;
            }
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: target, per_page: 100,
            });
            statuses.sort((a, b) => Number(b.id) - Number(a.id));
            const latest = new Map();
            for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status);
            const missing = required.filter((name) => latest.get(name)?.state !== 'success');
            if (missing.length) {
              core.setFailed(`LIVE_TRADING_REQUIRED_CI_NOT_6_OF_6:${missing.join(',')}`);
              return;
            }
            const runIds = new Set(required.map((name) => {
              const match = String(latest.get(name)?.target_url ?? '').match(/\/actions\/runs\/(\d+)/);
              return match ? Number(match[1]) : null;
            }));
            if (runIds.size !== 1 || runIds.has(null)) {
              core.setFailed('LIVE_TRADING_REQUIRED_CI_NOT_COHERENT');
              return;
            }
            const runId = [...runIds][0];
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            })).data;
            if (run.name !== 'Application CI'
              || run.path !== '.github/workflows/futures-public-network-smoke.yml'
              || run.head_sha !== target
              || run.head_branch !== 'main'
              || !['push', 'workflow_dispatch'].includes(run.event)
              || run.status !== 'completed'
              || run.conclusion !== 'success') {
              core.setFailed(`LIVE_TRADING_REQUIRED_CI_PROVENANCE_REJECTED:${runId}`);
              return;
            }
            core.setOutput('ci_run_id', String(runId));

      - name: Require successful exact-SHA Production deployment
        id: production
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: target,
              branch: 'main',
              event: 'workflow_dispatch',
              status: 'completed',
              per_page: 100,
            });
            const production = runs
              .filter((run) => run.name === 'Production Deploy'
                && run.path === '.github/workflows/production-deploy.yml'
                && run.head_sha === target
                && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!production) {
              core.setFailed(`LIVE_TRADING_EXACT_PRODUCTION_DEPLOY_REQUIRED:${target}`);
              return;
            }
            core.setOutput('run_id', String(production.id));

      - name: Require successful post-deploy exact-SHA Production read-only QA
        id: production_qa
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRODUCTION_RUN_ID: ${{ steps.production.outputs.run_id }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const productionRunId = Number(process.env.PRODUCTION_RUN_ID);
            const production = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: productionRunId,
            })).data;
            const productionCompletedAt = Date.parse(production.updated_at ?? '');
            if (!Number.isFinite(productionCompletedAt)) {
              core.setFailed('LIVE_TRADING_PRODUCTION_COMPLETION_TIME_INVALID');
              return;
            }

            const requireQa = async ({ workflowId, workflowName, artifactName, errorCode }) => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                branch: 'main',
                event: 'workflow_dispatch',
                status: 'completed',
                per_page: 100,
              });
              const run = runs
                .filter((candidate) => candidate.name === workflowName
                  && candidate.path === `.github/workflows/${workflowId}`
                  && candidate.head_sha === target
                  && candidate.head_branch === 'main'
                  && candidate.conclusion === 'success'
                  && Date.parse(candidate.run_started_at ?? candidate.created_at) >= productionCompletedAt)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (!run) {
                core.setFailed(`${errorCode}:${target}`);
                return null;
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((candidate) => candidate.name === artifactName(run)
                && candidate.expired !== true
                && Number(candidate.size_in_bytes) > 0);
              if (!artifact) {
                core.setFailed(`${errorCode}_ARTIFACT_MISSING:${run.id}`);
                return null;
              }
              return run;
            };

            const comprehensive = await requireQa({
              workflowId: 'production-comprehensive-readonly-qa.yml',
              workflowName: 'Production Comprehensive Read-Only QA',
              artifactName: (run) => `production-comprehensive-readonly-${run.id}`,
              errorCode: 'LIVE_TRADING_EXACT_COMPREHENSIVE_QA_REQUIRED',
            });
            if (!comprehensive) return;
            const account = await requireQa({
              workflowId: 'production-account-readonly-live-qa.yml',
              workflowName: 'Production Account Read-only Live QA',
              artifactName: () => `production-account-readonly-live-${target}`,
              errorCode: 'LIVE_TRADING_EXACT_ACCOUNT_QA_REQUIRED',
            });
            if (!account) return;
            core.setOutput('comprehensive_run_id', String(comprehensive.id));
            core.setOutput('account_run_id', String(account.id));

      - name: Download exact-SHA target-provider Account QA evidence
        uses: actions/download-artifact@v4
        with:
          name: production-account-readonly-live-${{ steps.command.outputs.sha }}
          path: ${{ runner.temp }}/production-account-readonly-live-qa
          github-token: ${{ github.token }}
          run-id: ${{ steps.production_qa.outputs.account_run_id }}

      - name: Require every activation provider to pass the same Account QA artifact
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PROVIDERS: ${{ steps.command.outputs.providers }}
          ACCOUNT_QA_EVIDENCE: ${{ runner.temp }}/production-account-readonly-live-qa/production-account-readonly-live-qa.json
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const target = String(process.env.TARGET_SHA ?? '');
          const requestedProviders = String(process.env.PROVIDERS ?? '').split(',').filter(Boolean);
          const allowedProviders = new Set(['toss', 'kiwoom', 'upbit']);
          const evidence = JSON.parse(fs.readFileSync(process.env.ACCOUNT_QA_EVIDENCE, 'utf8'));
          const testedProviders = Array.isArray(evidence?.testedProviders) ? evidence.testedProviders : [];
          const providers = Array.isArray(evidence?.providers) ? evidence.providers : [];
          if (!/^[0-9a-f]{40}$/.test(target)
            || requestedProviders.length === 0
            || new Set(requestedProviders).size !== requestedProviders.length
            || requestedProviders.some((provider) => !allowedProviders.has(provider))) {
            throw new Error('LIVE_TRADING_ACCOUNT_QA_TARGET_PROVIDER_SET_INVALID');
          }
          if (evidence?.schemaVersion !== 'production-account-readonly-live-qa-v2'
            || evidence?.targetSha !== target
            || evidence?.orderRequests !== 0
            || evidence?.cancelRequests !== 0
            || evidence?.amendRequests !== 0
            || evidence?.transferRequests !== 0
            || evidence?.withdrawalRequests !== 0
            || evidence?.blockedMutationRequests !== 0
            || evidence?.observedAppMutationRequests !== 0
            || evidence?.liveTradingAuthorityGranted !== false
            || evidence?.autoTradingAuthorityGranted !== false) {
            throw new Error('LIVE_TRADING_ACCOUNT_QA_EVIDENCE_SAFETY_INVALID');
          }
          for (const provider of requestedProviders) {
            if (!testedProviders.includes(provider)) {
              throw new Error(`LIVE_TRADING_ACCOUNT_QA_TARGET_NOT_TESTED:${provider}`);
            }
            const row = providers.find((candidate) => candidate?.provider === provider);
            if (!row
              || row.connected !== true
              || row.status !== 'CONNECTED'
              || row.stale !== false
              || row.fresh !== true
              || row.errorCode !== null
              || row.checkedAtPresent !== true
              || row.lastGoodAtPresent !== true
              || row.reconciliation !== 'PASS'
              || row.reconciliationPassed !== true) {
              throw new Error(`LIVE_TRADING_ACCOUNT_QA_TARGET_NOT_READY:${provider}`);
            }
          }
          NODE

      - name: Configure protected Production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Activate manual live-trading gates without submitting an order
        id: activate
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PROVIDERS: ${{ steps.command.outputs.providers }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q PROVIDERS=%q' "$TARGET_SHA" "$PROVIDERS")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node --input-type=module -" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, existsSync } from 'node:fs';

          const target = String(process.env.TARGET_SHA ?? '');
          const providers = String(process.env.PROVIDERS ?? '').split(',').filter(Boolean);
          const allowedProviders = ['toss', 'kiwoom', 'upbit'];
          const capabilityAllowlist = 'BALANCE_READ,POSITION_READ,OPEN_ORDER_READ,ORDER_CREATE,ORDER_CANCEL,ORDER_AMEND';
          const marketAllowlist = 'KR_STOCK,US_STOCK,CRYPTO_SPOT';
          if (!/^[0-9a-f]{40}$/.test(target)
            || providers.length === 0
            || providers.some((provider) => !allowedProviders.includes(provider))) {
            throw new Error('LIVE_TRADING_ACTIVATION_INPUT_INVALID');
          }

          const markerPath = '/opt/stock-app/.deploy/current-sha';
          if (!existsSync(markerPath) || readFileSync(markerPath, 'utf8').trim() !== target) {
            throw new Error('LIVE_TRADING_DEPLOY_MARKER_MISMATCH');
          }

          const readRuntime = () => {
            const rows = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const matches = rows.filter((row) => row?.name === 'stock-app');
            if (matches.length !== 1 || !matches[0]?.pm2_env) throw new Error('LIVE_TRADING_PM2_RUNTIME_AMBIGUOUS');
            const row = matches[0];
            const env = row.pm2_env;
            const bool = (key) => {
              const value = env[key];
              if (value === undefined || value === false || value === 'false') return false;
              if (value === true || value === 'true') return true;
              throw new Error(`LIVE_TRADING_FLAG_MALFORMED:${key}`);
            };
            return {
              status: String(env.status ?? ''),
              deploySha: String(env.DEPLOY_SHA ?? ''),
              telegramApproved: bool('LIVE_TELEGRAM_ACTIVATION_APPROVED'),
              telegramWorker: bool('TELEGRAM_INTELLIGENCE_WORKER_ENABLED'),
              live: bool('LIVE_TRADING'),
              auto: bool('AUTO_TRADING'),
              real: bool('REAL_ORDER_ENABLED'),
              privateApi: bool('PRIVATE_TRADING_API_ALLOWED'),
              orderExecution: bool('ORDER_EXECUTION_ENABLED'),
              activationApproved: bool('LIVE_TRADING_ACTIVATION_APPROVED'),
              spotLimitedApproved: bool('SPOT_LIVE_LIMITED_ACTIVATION_APPROVED'),
              automaticLive: bool('LIVE_AUTOMATIC_TRADING_ENABLED'),
              capabilityAllowlist: String(env.SPOT_LIVE_CAPABILITY_ALLOWLIST ?? ''),
              marketAllowlist: String(env.SPOT_LIVE_MARKET_ALLOWLIST ?? ''),
              provider: {
                bitget: bool('BITGET_LIVE_ORDER_ENABLED'),
                upbit: bool('UPBIT_LIVE_ORDER_ENABLED'),
                kiwoom: bool('KIWOOM_LIVE_ORDER_ENABLED'),
                toss: bool('TOSS_LIVE_ORDER_ENABLED'),
              },
              authority: String(env.executionAuthority ?? 'NONE').toUpperCase(),
            };
          };

          const desiredProviders = Object.fromEntries(
            allowedProviders.map((provider) => [provider, providers.includes(provider)]),
          );
          const pre = readRuntime();
          if (pre.status !== 'online' || pre.deploySha !== target || pre.telegramApproved !== pre.telegramWorker) {
            throw new Error('LIVE_TRADING_RUNTIME_IDENTITY_INVALID');
          }

          const disableTradingGates = () => {
            execFileSync('pm2', ['restart', 'stock-app', '--update-env'], {
              env: {
                ...process.env,
                LIVE_TELEGRAM_ACTIVATION_APPROVED: String(pre.telegramApproved),
                TELEGRAM_INTELLIGENCE_WORKER_ENABLED: String(pre.telegramWorker),
                LIVE_TRADING: 'false',
                AUTO_TRADING: 'false',
                REAL_ORDER_ENABLED: 'false',
                PRIVATE_TRADING_API_ALLOWED: 'false',
                ORDER_EXECUTION_ENABLED: 'false',
                LIVE_TRADING_ACTIVATION_APPROVED: 'false',
                SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: 'false',
                LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
              MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
              MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
                MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
                MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
                SPOT_LIVE_CAPABILITY_ALLOWLIST: '',
                SPOT_LIVE_MARKET_ALLOWLIST: '',
                BITGET_LIVE_ORDER_ENABLED: 'false',
                UPBIT_LIVE_ORDER_ENABLED: 'false',
                KIWOOM_LIVE_ORDER_ENABLED: 'false',
                TOSS_LIVE_ORDER_ENABLED: 'false',
                executionAuthority: 'NONE',
                DEPLOY_SHA: target,
              },
              stdio: ['ignore', 'ignore', 'pipe'],
            });
            execFileSync('pm2', ['save'], { stdio: ['ignore', 'ignore', 'pipe'] });
          };

          const alreadyDesired = pre.live
            && pre.auto === false
            && pre.real
            && pre.privateApi
            && pre.orderExecution
            && pre.activationApproved
            && pre.spotLimitedApproved
            && pre.automaticLive === false
            && pre.authority === 'SPOT_LIVE_LIMITED'
            && pre.capabilityAllowlist === capabilityAllowlist
            && pre.marketAllowlist === marketAllowlist
            && pre.provider.bitget === false
            && allowedProviders.every((provider) => pre.provider[provider] === desiredProviders[provider]);

          try {
            if (!alreadyDesired) {
              const anyAuthority = pre.live || pre.auto || pre.real || pre.privateApi
                || pre.orderExecution || pre.activationApproved || pre.spotLimitedApproved || pre.automaticLive
                || pre.capabilityAllowlist || pre.marketAllowlist
                || Object.values(pre.provider).some(Boolean)
                || pre.authority !== 'NONE';
              if (anyAuthority) throw new Error('LIVE_TRADING_ALREADY_ACTIVE_DIFFERENT_SCOPE');

              const activationEnv = {
                ...process.env,
                LIVE_TELEGRAM_ACTIVATION_APPROVED: String(pre.telegramApproved),
                TELEGRAM_INTELLIGENCE_WORKER_ENABLED: String(pre.telegramWorker),
                LIVE_TRADING: 'true',
                AUTO_TRADING: 'false',
                REAL_ORDER_ENABLED: 'true',
                PRIVATE_TRADING_API_ALLOWED: 'true',
                ORDER_EXECUTION_ENABLED: 'true',
                LIVE_TRADING_ACTIVATION_APPROVED: 'true',
                SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: 'true',
                LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
              MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
              MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
                MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
                MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
                SPOT_LIVE_CAPABILITY_ALLOWLIST: capabilityAllowlist,
                SPOT_LIVE_MARKET_ALLOWLIST: marketAllowlist,
                BITGET_LIVE_ORDER_ENABLED: 'false',
                UPBIT_LIVE_ORDER_ENABLED: String(desiredProviders.upbit),
                KIWOOM_LIVE_ORDER_ENABLED: String(desiredProviders.kiwoom),
                TOSS_LIVE_ORDER_ENABLED: String(desiredProviders.toss),
                executionAuthority: 'SPOT_LIVE_LIMITED',
                DEPLOY_SHA: target,
              };
              execFileSync('pm2', ['restart', 'stock-app', '--update-env'], {
                env: activationEnv,
                stdio: ['ignore', 'ignore', 'pipe'],
              });
              execFileSync('pm2', ['save'], { stdio: ['ignore', 'ignore', 'pipe'] });
            }

            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let healthOk = false;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              try {
                const response = await fetch('http://127.0.0.1:8080/api/health', { signal: AbortSignal.timeout(8000) });
                const value = response.ok ? await response.json() : null;
                if (value?.ok === true
                  && value?.deploySha === target
                  && value?.processDeploySha === target
                  && value?.deployMarkerSha === target
                  && value?.identityMatch === true) {
                  healthOk = true;
                  break;
                }
              } catch {}
              if (attempt < 9) await wait(2000);
            }
            if (!healthOk) throw new Error('LIVE_TRADING_HEALTH_INVALID');

            const post = readRuntime();
            if (post.status !== 'online'
              || post.deploySha !== target
              || post.telegramApproved !== pre.telegramApproved
              || post.telegramWorker !== pre.telegramWorker
              || post.live !== true
              || post.auto !== false
              || post.real !== true
              || post.privateApi !== true
              || post.orderExecution !== true
              || post.activationApproved !== true
              || post.spotLimitedApproved !== true
              || post.automaticLive !== false
              || post.authority !== 'SPOT_LIVE_LIMITED'
              || post.capabilityAllowlist !== capabilityAllowlist
              || post.marketAllowlist !== marketAllowlist
              || post.provider.bitget !== false
              || !allowedProviders.every((provider) => post.provider[provider] === desiredProviders[provider])) {
              throw new Error('LIVE_TRADING_POST_ACTIVATION_STATE_INVALID');
            }
          } catch (error) {
            try {
              disableTradingGates();
            } catch (rollbackError) {
              throw new Error(
                `LIVE_TRADING_ACTIVATION_FAILED_AND_ROLLBACK_FAILED:${error instanceof Error ? error.message : 'UNKNOWN'}:${rollbackError instanceof Error ? rollbackError.message : 'UNKNOWN'}`,
              );
            }
            throw new Error(
              `LIVE_TRADING_ACTIVATION_FAILED_ROLLED_BACK:${error instanceof Error ? error.message : 'UNKNOWN'}`,
            );
          }

          process.stdout.write(JSON.stringify({
            status: 'ACTIVATED_SPOT_LIVE_LIMITED_MANUAL',
            targetSha: target,
            providers,
            autoTrading: false,
            automaticLiveTrading: false,
            executionAuthority: 'SPOT_LIVE_LIMITED',
            realOrderSubmitted: false,
          }));
          NODE

      - name: Record sanitized limited spot live-trading activation receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PROVIDERS: ${{ steps.command.outputs.providers }}
          CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
          PRODUCTION_RUN_ID: ${{ steps.production.outputs.run_id }}
          COMPREHENSIVE_QA_RUN_ID: ${{ steps.production_qa.outputs.comprehensive_run_id }}
          ACCOUNT_QA_RUN_ID: ${{ steps.production_qa.outputs.account_run_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                '[PRODUCTION_LIVE_TRADING_GATE]',
                'status: ACTIVATED_SPOT_LIVE_LIMITED_MANUAL',
                `target_sha: ${process.env.TARGET_SHA}`,
                `providers: ${process.env.PROVIDERS}`,
                `required_ci_run: ${process.env.CI_RUN_ID}`,
                `production_deploy_run: ${process.env.PRODUCTION_RUN_ID}`,
                `production_comprehensive_qa_run: ${process.env.COMPREHENSIVE_QA_RUN_ID}`,
                `production_account_qa_run: ${process.env.ACCOUNT_QA_RUN_ID}`,
                'AUTO_TRADING=false',
                'LIVE_AUTOMATIC_TRADING_ENABLED=false',
                'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED=false',
                'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED=false',
                'executionAuthority=SPOT_LIVE_LIMITED',
                'SPOT_LIVE_CAPABILITY_ALLOWLIST=BALANCE_READ,POSITION_READ,OPEN_ORDER_READ,ORDER_CREATE,ORDER_CANCEL,ORDER_AMEND',
                'SPOT_LIVE_MARKET_ALLOWLIST=KR_STOCK,US_STOCK,CRYPTO_SPOT',
                'FUTURES=false',
                'REAL_ORDER_SUBMITTED=false',
                'transfer_withdrawal_authority=false',
                `workflow_run: ${context.runId}`,
              ].join('\n'),
            });

  disable:
    name: Owner-approved Production live-trading gate disable
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/disable-production-live-trading ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - name: Parse exact owner disable command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/disable-production-live-trading ([0-9a-f]{40}) CONFIRM_NO_OPEN_LIVE_ORDERS$/u.exec(body);
          if (!match) throw new Error('Expected /disable-production-live-trading <40-char-deployed-sha> CONFIRM_NO_OPEN_LIVE_ORDERS');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1]}\n`);
          NODE

      - name: Configure protected Production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Disable every Production live-trading authority gate
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node --input-type=module -" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, existsSync } from 'node:fs';
          const target = String(process.env.TARGET_SHA ?? '');
          const markerPath = '/opt/stock-app/.deploy/current-sha';
          if (!/^[0-9a-f]{40}$/.test(target)
            || !existsSync(markerPath)
            || readFileSync(markerPath, 'utf8').trim() !== target) {
            throw new Error('LIVE_TRADING_DISABLE_DEPLOYED_SHA_MISMATCH');
          }
          const rows = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
          const matches = rows.filter((row) => row?.name === 'stock-app');
          if (matches.length !== 1 || matches[0]?.pm2_env?.DEPLOY_SHA !== target) {
            throw new Error('LIVE_TRADING_DISABLE_RUNTIME_IDENTITY_INVALID');
          }
          execFileSync('pm2', ['restart', 'stock-app', '--update-env'], {
            env: {
              ...process.env,
              LIVE_TRADING: 'false',
              AUTO_TRADING: 'false',
              REAL_ORDER_ENABLED: 'false',
              PRIVATE_TRADING_API_ALLOWED: 'false',
              ORDER_EXECUTION_ENABLED: 'false',
              LIVE_TRADING_ACTIVATION_APPROVED: 'false',
              SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: 'false',
              FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED: 'false',
              LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
              MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: 'false',
              MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: 'false',
              SPOT_LIVE_CAPABILITY_ALLOWLIST: '',
              SPOT_LIVE_MARKET_ALLOWLIST: '',
              FUTURES_LIVE_CAPABILITY_ALLOWLIST: '',
              FUTURES_LIVE_MARKET_ALLOWLIST: '',
              FUTURES_LIVE_MAX_LEVERAGE: '',
              FUTURES_LIVE_MARGIN_MODE: '',
              BITGET_LIVE_ORDER_ENABLED: 'false',
              BITGET_FUTURES_LIVE_ORDER_ENABLED: 'false',
              UPBIT_LIVE_ORDER_ENABLED: 'false',
              KIWOOM_LIVE_ORDER_ENABLED: 'false',
              TOSS_LIVE_ORDER_ENABLED: 'false',
              executionAuthority: 'NONE',
              FUTURES_LIVE_EXECUTION_AUTHORITY: 'NONE',
              DEPLOY_SHA: target,
            },
            stdio: ['ignore', 'ignore', 'pipe'],
          });
          execFileSync('pm2', ['save'], { stdio: ['ignore', 'ignore', 'pipe'] });

          const postRows = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
          const postMatches = postRows.filter((row) => row?.name === 'stock-app');
          const postEnv = postMatches.length === 1 ? postMatches[0]?.pm2_env : null;
          if (!postEnv || postEnv.status !== 'online' || postEnv.DEPLOY_SHA !== target) {
            throw new Error('LIVE_TRADING_DISABLE_POST_RUNTIME_INVALID');
          }
          const flag = (key) => {
            const value = postEnv[key];
            if (value === undefined || value === false || value === 'false') return false;
            if (value === true || value === 'true') return true;
            throw new Error(`LIVE_TRADING_DISABLE_FLAG_MALFORMED:${key}`);
          };
          for (const key of [
            'LIVE_TRADING', 'AUTO_TRADING', 'REAL_ORDER_ENABLED', 'PRIVATE_TRADING_API_ALLOWED',
            'ORDER_EXECUTION_ENABLED', 'LIVE_TRADING_ACTIVATION_APPROVED', 'LIVE_AUTOMATIC_TRADING_ENABLED',
            'SPOT_LIVE_LIMITED_ACTIVATION_APPROVED', 'FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED',
            'BITGET_LIVE_ORDER_ENABLED', 'BITGET_FUTURES_LIVE_ORDER_ENABLED', 'UPBIT_LIVE_ORDER_ENABLED', 'KIWOOM_LIVE_ORDER_ENABLED', 'TOSS_LIVE_ORDER_ENABLED',
          ]) {
            if (flag(key)) throw new Error(`LIVE_TRADING_DISABLE_FLAG_STILL_ENABLED:${key}`);
          }
          if (String(postEnv.executionAuthority ?? 'NONE').toUpperCase() !== 'NONE'
            || String(postEnv.FUTURES_LIVE_EXECUTION_AUTHORITY ?? 'NONE').toUpperCase() !== 'NONE') {
            throw new Error('LIVE_TRADING_DISABLE_AUTHORITY_STILL_ENABLED');
          }
          if (String(postEnv.SPOT_LIVE_CAPABILITY_ALLOWLIST ?? '')
            || String(postEnv.SPOT_LIVE_MARKET_ALLOWLIST ?? '')
            || String(postEnv.FUTURES_LIVE_CAPABILITY_ALLOWLIST ?? '')
            || String(postEnv.FUTURES_LIVE_MARKET_ALLOWLIST ?? '')
            || String(postEnv.FUTURES_LIVE_MAX_LEVERAGE ?? '')
            || String(postEnv.FUTURES_LIVE_MARGIN_MODE ?? '')) {
            throw new Error('LIVE_TRADING_DISABLE_ALLOWLIST_STILL_ENABLED');
          }

          let healthOk = false;
          for (let attempt = 0; attempt < 10; attempt += 1) {
            try {
              const response = await fetch('http://127.0.0.1:8080/api/health', { signal: AbortSignal.timeout(8000) });
              const value = response.ok ? await response.json() : null;
              if (value?.ok === true
                && value?.deploySha === target
                && value?.processDeploySha === target
                && value?.deployMarkerSha === target
                && value?.identityMatch === true) {
                healthOk = true;
                break;
              }
            } catch {}
            if (attempt < 9) await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          if (!healthOk) throw new Error('LIVE_TRADING_DISABLE_HEALTH_INVALID');

          process.stdout.write(JSON.stringify({
            status: 'DISABLED',
            targetSha: target,
            executionAuthority: 'NONE',
            realOrderSubmitted: false,
          }));
          NODE

      - name: Record sanitized live-trading disable receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                '[PRODUCTION_LIVE_TRADING_GATE]',
                'status: DISABLED',
                'owner_attestation: CONFIRM_NO_OPEN_LIVE_ORDERS',
                `target_sha: ${process.env.TARGET_SHA}`,
                'LIVE_TRADING=false',
                'AUTO_TRADING=false',
                'REAL_ORDER_ENABLED=false',
                'PRIVATE_TRADING_API_ALLOWED=false',
                'ORDER_EXECUTION_ENABLED=false',
                'LIVE_TRADING_ACTIVATION_APPROVED=false',
                'SPOT_LIVE_LIMITED_ACTIVATION_APPROVED=false',
                'FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED=false',
                'LIVE_AUTOMATIC_TRADING_ENABLED=false',
                'MEMBER_AUTO_TRADING_BACKGROUND_ENABLED=false',
                'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED=false',
                'SPOT_LIVE_CAPABILITY_ALLOWLIST=',
                'SPOT_LIVE_MARKET_ALLOWLIST=',
                'executionAuthority=NONE',
                'REAL_ORDER_SUBMITTED=false',
                `workflow_run: ${context.runId}`,
              ].join('\n'),
            });
