name: Research Upbit Hybrid Overnight Intraday V5

on:
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/run-upbit-hybrid-overnight-intraday-v5.mjs
      - .github/workflows/research-upbit-hybrid-overnight-intraday-v5.yml
      - market-prediction-lab/src/adaptive-multi-evidence-price-structure-v2.js
      - market-prediction-lab/src/adaptive-multi-evidence-point-in-time-v2.js

permissions:
  contents: read

concurrency:
  group: research-upbit-hybrid-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public research-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check market-prediction-lab/scripts/run-upbit-hybrid-overnight-intraday-v5.mjs
          ! grep -Eiq 'UPBIT_ACCESS_KEY|UPBIT_SECRET_KEY|LIVE_TRADING|REAL_ORDER_ENABLED|PRIVATE_TRADING_API_ALLOWED|(^|[^A-Za-z])withdraw([^A-Za-z]|$)|(^|[^A-Za-z])transfer([^A-Za-z]|$)|(^|[^A-Za-z])orderSubmitted([^A-Za-z]|$)' market-prediction-lab/scripts/run-upbit-hybrid-overnight-intraday-v5.mjs
      - name: Run fixed hybrid V5 on fresh symbol cohort
        working-directory: market-prediction-lab
        run: node scripts/run-upbit-hybrid-overnight-intraday-v5.mjs docs/upbit-hybrid-overnight-intraday-v5.json
      - name: Assert fresh cohort, no search, chronology, and safety
        working-directory: market-prediction-lab
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('docs/upbit-hybrid-overnight-intraday-v5.json','utf8'));
          if(r.status!=='pass') throw new Error('STATUS');
          if(r.fixedPolicy.parameterSearchPerformed!==false||r.fixedPolicy.familySearchPerformed!==false) throw new Error('SEARCH_FORBIDDEN');
          if(r.universe.freshHoldout.length!==12||r.universe.freshHoldoutRanks!=='37-48') throw new Error('FRESH_HOLDOUT');
          if(r.lookahead.freshHoldoutSymbolsUsedForDesign!==false||!r.lookahead.guardPassed) throw new Error('HOLDOUT_LEAK');
          if(r.lookahead.intradayDiscoveryRequiresNoD1Candidate!==true||r.lookahead.intradayRelativeStrengthUsesCompleted15mBarsOnly!==true||!r.lookahead.intradayUsesCompleted15mAnd1hOnly||!r.lookahead.entryNext15mOpen) throw new Error('LOOKAHEAD');
          if(!r.overnightV4||!r.intradayV5||!r.hybridV5) throw new Error('PATH_RESULT_MISSING');
          if(r.safety.researchOnly!==true||r.safety.publicDataOnly!==true||r.safety.executionAuthority!=='NONE'||r.safety.profitabilityPromotionAllowed!==false) throw new Error('SAFETY');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: upbit-hybrid-overnight-intraday-v5-${{ github.event.pull_request.head.sha }}
          path: market-prediction-lab/docs/upbit-hybrid-overnight-intraday-v5.json
          if-no-files-found: error
          retention-days: 30
