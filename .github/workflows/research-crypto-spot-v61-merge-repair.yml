name: Research Crypto Spot V6.1 Merge Repair

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-spot-v61-merge-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: "37469061519"
      SOURCE_SHA: "4eb933369a"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-crypto-spot-causal-targetfirst-ai-v61.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<0.32" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - name: Download successful V6.1 shards from failed merge run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: crypto-spot-causal-v61-shard-*-${{ env.SOURCE_SHA }}*
          path: v61-shards
          merge-multiple: false
      - name: Merge and audit
        run: |
          python market-prediction-lab/scripts/run-crypto-spot-causal-targetfirst-ai-v61.py             --mode merge             --input-root v61-shards             --out-dir market-prediction-lab/docs/crypto-spot-causal-targetfirst-ai-v61/merged
      - name: Upload merged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-spot-causal-targetfirst-ai-v61-repair-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-spot-causal-targetfirst-ai-v61/merged
          if-no-files-found: error
          retention-days: 14
