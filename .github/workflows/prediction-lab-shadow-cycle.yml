name: Prediction Lab Shadow Cycle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - market-prediction-lab/docs/shadow-trigger.json

permissions:
  actions: write
  contents: write

concurrency:
  group: prediction-lab-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feature/prediction-lab-standalone

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate shadow and temporal modules
        working-directory: market-prediction-lab
        run: node --test tests/derivatives-history.test.js tests/derivatives-normalized-compat.test.js tests/temporal-training-dataset.test.js tests/shadow-ledger.test.js

      - name: Run one live shadow cycle
        id: shadow
        continue-on-error: true
        working-directory: market-prediction-lab
        run: node scripts/run-shadow-cycle.js docs/shadow-state.json docs/shadow-summary.json

      - name: Record shadow failure
        if: steps.shadow.outcome != 'success'
        working-directory: market-prediction-lab
        run: |
          if [ ! -f docs/shadow-summary.json ]; then
            cat > docs/shadow-summary.json <<'JSON'
          {
            "schemaVersion": 1,
            "status": "fail",
            "stage": "shadow_cycle",
            "error": {
              "name": "ShadowCycleError",
              "message": "shadow cycle failed before writing its own report"
            }
          }
          JSON
          fi

      - name: Display shadow summary
        if: always()
        working-directory: market-prediction-lab
        run: cat docs/shadow-summary.json

      - name: Commit compact shadow state and summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-prediction-lab/docs/shadow-state.json market-prediction-lab/docs/shadow-summary.json
          git diff --cached --quiet && exit 0
          git commit -m "data: advance isolated shadow prediction ledger"
          git pull --rebase origin feature/prediction-lab-standalone
          git push origin HEAD:feature/prediction-lab-standalone
          pushed_sha="$(git rev-parse HEAD)"
          gh workflow run futures-public-network-smoke.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref feature/prediction-lab-standalone \
            -f target_sha="$pushed_sha" \
            -f checkout_ref="$pushed_sha"

      - name: Fail when shadow cycle failed
        if: always() && steps.shadow.outcome != 'success'
        run: exit 1
