name: Research Crypto Futures V4.8 Bitget Exact1m V4.9

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-futures-v48-bitget-exact1m-v49.py
      - .github/workflows/research-crypto-futures-v48-bitget-exact1m-v49.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-v48-bitget-exact1m-v49-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      V48_RUN_ID: "37457612026"
      V48_ARTIFACT: "crypto-futures-v47-bitget-covered-subset-v48-3802dd30582848659eb14d4ea284b67b8ad50f9e"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-v48-bitget-exact1m-v49.py
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v44-robustness-capital-v45.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - name: Download frozen V4.8 evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V48_RUN_ID }}
          name: ${{ env.V48_ARTIFACT }}
          path: frozen-v48
      - name: Replay frozen signals on Bitget exact 1m paths
        run: |
          EVENTS="$(find frozen-v48 -name bitget-covered-fullcost-events.parquet -print -quit)"
          SUMMARY="$(find frozen-v48 -name summary.json -print -quit)"
          test -n "$EVENTS"
          test -n "$SUMMARY"
          python market-prediction-lab/scripts/run-crypto-futures-v48-bitget-exact1m-v49.py \
            --covered-events "$EVENTS" \
            --v48-summary "$SUMMARY" \
            --out-dir market-prediction-lab/docs/crypto-futures-v48-bitget-exact1m-v49
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-v48-bitget-exact1m-v49-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-v48-bitget-exact1m-v49
          if-no-files-found: error
          retention-days: 14
