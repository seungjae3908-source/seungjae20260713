name: Research KR DART V4 Coverage Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-kr-dart-v4-coverage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install duckdb
        run: python -m pip install "duckdb>=1.3,<2"
      - name: Probe projected catalog coverage
        run: |
          python - <<'PY'
          import duckdb, json
          url='https://huggingface.co/datasets/eddmpython/dartlab-data/resolve/main/dart/searchCatalog/allFilings/allFilings.catalog_snapshot.parquet'
          con=duckdb.connect()
          con.execute('INSTALL httpfs; LOAD httpfs;')
          base=f"read_parquet('{url}')"
          span=con.execute(f'''
            SELECT min(date), max(date), count(*),
                   count(*) FILTER (WHERE stockCode IS NOT NULL AND trim(stockCode) <> ''),
                   count(DISTINCT stockCode) FILTER (WHERE stockCode IS NOT NULL AND trim(stockCode) <> '')
            FROM {base}
            WHERE coalesce(deleted,false)=false
          ''').fetchone()
          cats=con.execute(f'''
            SELECT trim(reportName) AS reportName, count(*) AS n, count(DISTINCT stockCode) AS symbols
            FROM {base}
            WHERE coalesce(deleted,false)=false
              AND date >= '20230401' AND date < '20261001'
              AND stockCode IS NOT NULL AND trim(stockCode) <> ''
              AND (
                reportName LIKE '%단일판매%' OR reportName LIKE '%공급계약%' OR
                reportName LIKE '%투자판단%' OR reportName LIKE '%유상증자%' OR
                reportName LIKE '%무상증자%' OR reportName LIKE '%자기주식%' OR
                reportName LIKE '%최대주주%' OR reportName LIKE '%영업양수%' OR
                reportName LIKE '%영업양도%' OR reportName LIKE '%합병%' OR
                reportName LIKE '%분할%' OR reportName LIKE '%임상%' OR
                reportName LIKE '%특허%' OR reportName LIKE '%상장폐지%' OR
                reportName LIKE '%거래정지%' OR reportName LIKE '%감사의견%'
              )
            GROUP BY 1 ORDER BY n DESC LIMIT 100
          ''').fetchall()
          periods=con.execute(f'''
            SELECT
              CASE
                WHEN date < '20250401' THEN 'TRAIN'
                WHEN date < '20260401' THEN 'VALID'
                WHEN date < '20261001' THEN 'FRESH_OOS'
                ELSE 'OTHER' END AS period,
              count(*) AS filings,
              count(DISTINCT stockCode) AS symbols,
              count(DISTINCT date) AS dates
            FROM {base}
            WHERE coalesce(deleted,false)=false
              AND date >= '20230401' AND date < '20261001'
              AND stockCode IS NOT NULL AND trim(stockCode) <> ''
            GROUP BY 1 ORDER BY 1
          ''').fetchall()
          print(json.dumps({'KR_DART_V4_COVERAGE':{'span':span,'periods':periods,'eventCategories':cats}},ensure_ascii=False))
          PY
