name: Public Forward Liquidity Successor Scheduled Capture

# IMPORTANT GOVERNANCE BOUNDARY:
# - V2 history and already-failed V2 slots remain immutable and receive zero V3 credit.
# - A merged V3 activation binding is inert by itself and never authorizes capture.
# - Scheduled capture requires a separate exact OWNER authority receipt on Release Control #23
#   matching the exact current main SHA and the immutable activation-binding digest.
# - Missing, revoked, stale, pre-cohort, or non-6/6 authority always skips capture fail-closed.
# - No replay/backfill/manual/synthetic/hindsight sample credit is granted by validation.

on:
  pull_request:
    paths:
      - '.github/workflows/public-forward-liquidity-successor-scheduled-capture.yml'
      - 'market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-seam-v1.mjs'
      - 'market-intelligence-sidecar/scripts/run-public-forward-liquidity-successor-schedule-seam-v1.mjs'
      - 'market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-reliability-v3.mjs'
      - 'market-intelligence-sidecar/src/public-forward-liquidity-multi-lane-policy-v1.mjs'
      - 'market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-v3.json'
      - 'market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json'
      - 'market-intelligence-sidecar/config/public-forward-liquidity-multi-lane-prospective-policy-v1.json'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-reliability-v3.test.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-multi-lane-policy-v1.test.mjs'
  schedule:
    - cron: '17 * * * *'
    - cron: '27 * * * *'
    - cron: '37 * * * *'

permissions:
  contents: read
  actions: read
  issues: read
  statuses: read

concurrency:
  group: public-forward-liquidity-successor-scheduled-capture
  queue: max
  cancel-in-progress: false

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      activation_authorized: ${{ steps.activation_gate.outputs.authorized }}
      activation_receipt_comment_id: ${{ steps.activation_gate.outputs.receipt_comment_id }}
      activation_binding_digest: ${{ steps.activation_gate.outputs.binding_digest }}
      activation_blocker: ${{ steps.activation_gate.outputs.blocker }}
    steps:
      - name: Checkout exact workflow revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify V3 trigger, queue, and minimal permission contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/public-forward-liquidity-successor-scheduled-capture.yml'
          test "$(grep -Ec "^[[:space:]]{4}- cron: '17 \\* \\* \\* \\*'[[:space:]]*$" "$workflow")" -eq 1
          test "$(grep -Ec "^[[:space:]]{4}- cron: '27 \\* \\* \\* \\*'[[:space:]]*$" "$workflow")" -eq 1
          test "$(grep -Ec "^[[:space:]]{4}- cron: '37 \\* \\* \\* \\*'[[:space:]]*$" "$workflow")" -eq 1
          test "$(grep -Ec "^[[:space:]]{2}queue:[[:space:]]+max[[:space:]]*$" "$workflow")" -eq 1
          test "$(grep -Ec "^[[:space:]]{2}cancel-in-progress:[[:space:]]+false[[:space:]]*$" "$workflow")" -eq 1
          ! grep -Eq '^[[:space:]]{2}workflow_dispatch:[[:space:]]*$' "$workflow"
          ! grep -Eq 'contents:[[:space:]]+write' "$workflow"
          ! grep -Eq 'actions:[[:space:]]+write' "$workflow"
          ! grep -Eq 'issues:[[:space:]]+write' "$workflow"
          ! grep -Eq 'pull-requests:[[:space:]]+write' "$workflow"
          ! grep -Eq 'deployments:[[:space:]]+write' "$workflow"
          ! grep -Eq 'packages:[[:space:]]+write' "$workflow"
          ! grep -Eq 'id-token:[[:space:]]+write' "$workflow"
          test "$(grep -Fc "requiredRun.name !== 'Application CI'" "$workflow")" -eq 1
          test "$(grep -Fc "requiredRun.path !== '.github/workflows/futures-public-network-smoke.yml'" "$workflow")" -eq 1
          test "$(grep -Fc 'Number(requiredRun.workflow_id) !== 325169344' "$workflow")" -eq 1
          test "$(grep -Fc "requiredRun.event !== 'push'" "$workflow")" -eq 1
          test "$(grep -Fc "requiredRun.head_branch !== 'main'" "$workflow")" -eq 1
          test "$(grep -Fc 'Number(requiredRun.run_attempt) !== 1' "$workflow")" -eq 1
          test "$(grep -Ec 'CAPTURE_ATTEMPT_ARTIFACT_NAME: [$][{][{] steps[.]capture[.]outputs[.]attempt_artifact_name [}][}]' "$workflow")" -eq 1
          test "$(grep -Fc 'artifact_name=${CAPTURE_ATTEMPT_ARTIFACT_NAME}' "$workflow")" -eq 1
          test "$(grep -Ec 'name: [$][{][{] steps[.]attempt_name[.]outputs[.]artifact_name [}][}]' "$workflow")" -eq 1
          test "$(grep -Ec 'ARTIFACT_NAME: [$][{][{] steps[.]attempt_name[.]outputs[.]artifact_name [}][}]' "$workflow")" -eq 1
          ! grep -Fq 'steps.attempt_name.outputs.name' "$workflow"
          ! grep -Eq '^[[:space:]]+RUNNER_NAME:' "$workflow"

      - name: Syntax check existing seam, runner, V3 reliability, and Phase 2 policy contracts
        run: |
          node --check market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-seam-v1.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-successor-schedule-seam-v1.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-reliability-v3.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-multi-lane-policy-v1.mjs

      - name: Stash activation binding for preserved inactive regressions
        shell: bash
        run: |
          set -euo pipefail
          activation='market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json'
          if [[ -f "$activation" ]]; then
            mv "$activation" "$RUNNER_TEMP/successor-v3-activation.json"
            echo 'SUCCESSOR_V3_ACTIVATION_STASHED=true' >> "$GITHUB_ENV"
          else
            echo 'SUCCESSOR_V3_ACTIVATION_STASHED=false' >> "$GITHUB_ENV"
          fi

      - name: Run V2 preservation and V3 fail-closed regression suites
        run: >-
          node --test
          market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-seam-v1.test.mjs
          market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-reliability-v3.test.mjs
          market-intelligence-sidecar/tests/public-forward-liquidity-multi-lane-policy-v1.test.mjs

      - name: Run zero-network zero-capture runner self-check
        run: node market-intelligence-sidecar/scripts/run-public-forward-liquidity-successor-schedule-seam-v1.mjs self-check

      - name: Restore and validate V3 activation binding
        if: env.SUCCESSOR_V3_ACTIVATION_STASHED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          activation='market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json'
          mv "$RUNNER_TEMP/successor-v3-activation.json" "$activation"
          node --input-type=module <<'NODE'
          import {
            SUCCESSOR_SCHEDULE_RELIABILITY_V3_CONTRACT,
            verifySuccessorScheduleReliabilityV3Contract,
          } from './market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-reliability-v3.mjs';

          const contract = SUCCESSOR_SCHEDULE_RELIABILITY_V3_CONTRACT;
          const verdict = verifySuccessorScheduleReliabilityV3Contract(contract);
          if (!verdict.valid || !verdict.activationBound) {
            console.error('Invalid V3 activation binding:', verdict.blockers.join(','));
            process.exit(1);
          }
          NODE

      - name: Require active V3 binding for scheduled validation
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test "${SUCCESSOR_V3_ACTIVATION_STASHED:-false}" = 'true'
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Resolve explicit V3 schedule activation authority receipt
        id: activation_gate
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          ACTIVATION_PATH: market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json
          FROZEN_EFFECTIVE_START_MS: '1790263020000'
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const setBlocked = (code) => {
              core.setOutput('authorized', 'false');
              core.setOutput('blocker', code);
              core.notice(`V3 schedule capture fail-closed: ${code}`);
            };

            const activationPath = process.env.ACTIVATION_PATH;
            const binding = JSON.parse(fs.readFileSync(activationPath, 'utf8'));
            const canonical = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonical).join(',')}]`;
              if (value && typeof value === 'object') {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${canonical(value[key])}`,
                ).join(',')}}`;
              }
              return JSON.stringify(value);
            };
            const bindingDigest = crypto
              .createHash('sha256')
              .update(canonical(binding))
              .digest('hex');
            core.setOutput('binding_digest', bindingDigest);
            core.setOutput('authorized', 'false');
            core.setOutput('receipt_comment_id', '');

            if (binding.frozenCohortEffectiveStartMs !== Number(process.env.FROZEN_EFFECTIVE_START_MS)) {
              setBlocked('SUCCESSOR_V3_FROZEN_EFFECTIVE_START_MISMATCH');
              return;
            }
            if (Date.now() < binding.frozenCohortEffectiveStartMs) {
              setBlocked('SUCCESSOR_V3_PRE_COHORT_ACTIVATION_BLOCKED');
              return;
            }
            if (context.ref !== 'refs/heads/main') {
              setBlocked('SUCCESSOR_V3_SCHEDULE_NOT_DEFAULT_BRANCH');
              return;
            }

            const branch = (await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            })).data;
            if (branch.commit.sha !== context.sha) {
              setBlocked('SUCCESSOR_V3_SCHEDULE_MAIN_MOVED');
              return;
            }

            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            });
            statuses.sort((left, right) => Number(right.id) - Number(left.id));
            const latest = new Map();
            for (const status of statuses) {
              if (!latest.has(status.context)) latest.set(status.context, status);
            }
            const missing = required.filter((name) => latest.get(name)?.state !== 'success');
            if (missing.length) {
              setBlocked(`SUCCESSOR_V3_CURRENT_MAIN_REQUIRED_CI_NOT_6_OF_6:${missing.join(',')}`);
              return;
            }
            const runIds = new Set();
            for (const name of required) {
              const match = String(latest.get(name)?.target_url ?? '').match(/\/actions\/runs\/(\d+)/);
              if (!match) {
                setBlocked(`SUCCESSOR_V3_REQUIRED_STATUS_RUN_URL_MISSING:${name}`);
                return;
              }
              runIds.add(Number(match[1]));
            }
            if (runIds.size !== 1) {
              setBlocked(`SUCCESSOR_V3_REQUIRED_CI_NOT_COHERENT:${[...runIds].join(',')}`);
              return;
            }
            const requiredRunId = [...runIds][0];
            const requiredRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: requiredRunId,
            })).data;
            if (requiredRun.name !== 'Application CI'
              || requiredRun.path !== '.github/workflows/futures-public-network-smoke.yml'
              || Number(requiredRun.workflow_id) !== 325169344) {
              setBlocked(`SUCCESSOR_V3_REQUIRED_CI_WORKFLOW_IDENTITY_REJECTED:${requiredRunId}`);
              return;
            }
            if (requiredRun.event !== 'push'
              || requiredRun.head_branch !== 'main'
              || requiredRun.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              setBlocked(`SUCCESSOR_V3_REQUIRED_CI_TRIGGER_IDENTITY_REJECTED:${requiredRunId}`);
              return;
            }
            if (Number(requiredRun.run_attempt) !== 1) {
              setBlocked(`SUCCESSOR_V3_REQUIRED_CI_REPLAY_ATTEMPT_REJECTED:${requiredRunId}`);
              return;
            }
            if (requiredRun.head_sha !== context.sha
              || requiredRun.status !== 'completed'
              || requiredRun.conclusion !== 'success') {
              setBlocked(`SUCCESSOR_V3_REQUIRED_CI_PROVENANCE_REJECTED:${requiredRunId}`);
              return;
            }

            const release = (await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
            })).data;
            if (release.state !== 'open' || release.title !== 'Staging Readiness Control') {
              setBlocked('SUCCESSOR_V3_RELEASE_CONTROL_NOT_OPEN');
              return;
            }

            const authorize = '/authorize-public-only-partial-fill-v3-schedule-activation';
            const revoke = '/revoke-public-only-partial-fill-v3-schedule-activation';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              per_page: 100,
            });
            comments.sort((left, right) => Number(left.id) - Number(right.id));

            let latestAuthority = null;
            for (const comment of comments) {
              if (comment.user?.login !== 'seungjae3908-source'
                || comment.author_association !== 'OWNER') continue;
              const parts = String(comment.body ?? '').trim().split(/\s+/u);
              if (parts.length !== 3 || (parts[0] !== authorize && parts[0] !== revoke)) continue;
              if (!/^[a-f0-9]{40}$/u.test(parts[1]) || !/^[a-f0-9]{64}$/u.test(parts[2])) continue;
              if (parts[1] !== context.sha || parts[2] !== bindingDigest) continue;
              latestAuthority = {
                action: parts[0] === authorize ? 'AUTHORIZE' : 'REVOKE',
                commentId: Number(comment.id),
              };
            }

            if (!latestAuthority) {
              setBlocked('SUCCESSOR_V3_EXPLICIT_ACTIVATION_RECEIPT_MISSING');
              return;
            }
            if (latestAuthority.action !== 'AUTHORIZE') {
              setBlocked('SUCCESSOR_V3_EXPLICIT_ACTIVATION_REVOKED');
              core.setOutput('receipt_comment_id', String(latestAuthority.commentId));
              return;
            }

            core.setOutput('authorized', 'true');
            core.setOutput('blocker', '');
            core.setOutput('receipt_comment_id', String(latestAuthority.commentId));
            core.notice(
              `V3 schedule activation receipt accepted: comment=${latestAuthority.commentId} main=${context.sha} binding=${bindingDigest}`,
            );

      - name: Prove pull requests cannot invoke V2 or V3 capture
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "$GITHUB_REF" != 'refs/heads/main'
          echo 'PR validation only: V2/V3 collector/capture/bind-artifact invocation = 0'

  capture:
    if: >-
      github.event_name == 'schedule' &&
      needs.validate-contract.outputs.activation_authorized == 'true'
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact default-branch scheduled SHA without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify default branch and exact current main before capture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'schedule'
          test "$GITHUB_REF" = 'refs/heads/main'
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin main
          remote_main="$(git rev-parse FETCH_HEAD)"
          test "$remote_main" = "$GITHUB_SHA"

      - name: Execute fail-closed Successor V3 scheduled capture seam
        id: capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_DIR: public-forward-liquidity-successor-capture
        run: node market-intelligence-sidecar/scripts/run-public-forward-liquidity-successor-schedule-seam-v1.mjs capture-v3

      - name: Choose immutable attempt artifact name
        id: attempt_name
        shell: bash
        env:
          CAPTURE_ATTEMPT_ARTIFACT_NAME: ${{ steps.capture.outputs.attempt_artifact_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "$CAPTURE_ATTEMPT_ARTIFACT_NAME" ]]; then
            attempt_artifact_name="$CAPTURE_ATTEMPT_ARTIFACT_NAME"
          else
            attempt_artifact_name="public-forward-liquidity-successor-v3-diagnostic-$RUN_ID-$RUN_ATTEMPT"
          fi
          echo "artifact_name=${attempt_artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Successor V3 attempt artifact
        id: attempt_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.attempt_name.outputs.artifact_name }}
          path: public-forward-liquidity-successor-capture
          if-no-files-found: error
          retention-days: 90

      - name: Bind raw evidence to immutable GitHub artifact identity
        id: bind_artifact
        if: steps.capture.outputs.raw_batch_present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_DIR: public-forward-liquidity-successor-capture
          ARTIFACT_ID: ${{ steps.attempt_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.attempt_upload.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ steps.attempt_name.outputs.artifact_name }}
        run: node market-intelligence-sidecar/scripts/run-public-forward-liquidity-successor-schedule-seam-v1.mjs bind-artifact

      - name: Upload finalized immutable Successor V3 receipt
        if: steps.capture.outputs.raw_batch_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-forward-liquidity-successor-v3-slot-receipt-${{ steps.capture.outputs.slot_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public-forward-liquidity-successor-capture/artifact-receipt.json
            public-forward-liquidity-successor-capture/artifact-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed unless this is eligible credit evidence or the exact UTC27 zero-credit diagnostic
        shell: bash
        env:
          CAPTURE_STATUS: ${{ steps.capture.outputs.capture_status }}
          PROSPECTIVE_SLOT_CREDIT: ${{ steps.capture.outputs.prospective_slot_credit }}
          RAW_BATCH_PRESENT: ${{ steps.capture.outputs.raw_batch_present }}
          PHASE2_UTC27_DIAGNOSTIC: ${{ steps.capture.outputs.phase2_utc27_diagnostic }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = '1'
          test "$RAW_BATCH_PRESENT" = 'true'
          if [[ "$PHASE2_UTC27_DIAGNOSTIC" == 'true' ]]; then
            test "$CAPTURE_STATUS" = 'PRESENT_ZERO_CREDIT'
            test "$PROSPECTIVE_SLOT_CREDIT" = '0'
          else
            test "$CAPTURE_STATUS" = 'PRESENT'
            test "$PROSPECTIVE_SLOT_CREDIT" = '1'
          fi
