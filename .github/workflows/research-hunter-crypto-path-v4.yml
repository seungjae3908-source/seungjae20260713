name: Research Hunter Crypto Path V4

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-hunter-crypto-path-diagnostic-v4.py
      - .github/workflows/research-hunter-crypto-path-v4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-hunter-crypto-path-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path:
    strategy:
      fail-fast: false
      matrix:
        market: [CRYPTO_SPOT, CRYPTO_FUTURES]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN: "37394616551"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile market-prediction-lab/scripts/run-hunter-crypto-path-diagnostic-v4.py
      - run: python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18,<22" "huggingface_hub>=0.30,<1"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: hunter-v3-${{ matrix.market }}-*
          path: source
      - run: python market-prediction-lab/scripts/run-hunter-crypto-path-diagnostic-v4.py --market ${{ matrix.market }} --input-root source --out-dir out/${{ matrix.market }}
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-path-v4-${{ matrix.market }}-${{ github.sha }}
          path: out/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14
