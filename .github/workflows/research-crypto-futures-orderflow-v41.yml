name: Research Crypto Futures Orderflow V4.1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-futures-orderflow-v41.py
      - .github/workflows/research-crypto-futures-orderflow-v41.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-crypto-futures-orderflow-v41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-orderflow-v41.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-full-universe-orderflow-v4.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1"
      - name: Run streaming Futures orderflow V4.1
        run: |
          python market-prediction-lab/scripts/run-crypto-futures-orderflow-v41.py \
            --out-dir market-prediction-lab/docs/crypto-futures-orderflow-v41
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-orderflow-v41-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-orderflow-v41
          if-no-files-found: error
          retention-days: 14
