
name: Production Account Read-only Live QA Dispatch Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch owner-approved exact-SHA Production real-account read-only QA
    if: >-
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-production-account-readonly-live-qa ')
    concurrency:
      group: production-account-readonly-live-qa-dispatch-bridge
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-production-account-readonly-live-qa ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /run-production-account-readonly-live-qa <40-character-current-production-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + match[1].toLowerCase() + '\n');
          NODE

      - name: Require deployed target SHA to remain in current main history
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          git merge-base --is-ancestor "$TARGET_SHA" "$MAIN_SHA" || {
            echo "Production account QA target must remain in current main history: target=$TARGET_SHA main=$MAIN_SHA" >&2
            exit 1
          }

      - name: Require latest successful Production Deploy to match target
        id: production
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const latest = runs
              .filter((run) => run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latest) {
              core.setFailed('No successful Production Deploy run exists.');
              return;
            }
            if (String(latest.head_sha).toLowerCase() !== target) {
              core.setFailed('Target is not latest successful Production Deploy SHA: latest=' + latest.head_sha);
              return;
            }
            core.setOutput('deploy_run_id', String(latest.id));

      - name: Dispatch exact-SHA Production account read-only live QA
        id: qa
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const workflowId = 'production-account-readonly-live-qa.yml';
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const active = runs.filter((run) => run.status !== 'completed');
            const duplicate = active.find((run) => String(run.display_title ?? '').includes(target)
              || String(run.head_sha).toLowerCase() === target);
            if (duplicate) {
              core.setFailed('Production account read-only QA is already active: run=' + duplicate.id);
              return;
            }

            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: { sha: target },
              return_run_details: true,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10',
              },
            });
            const runId = Number(response.data?.workflow_run_id);
            if (response.status !== 200 || !Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Production account QA dispatch returned invalid Run ID with HTTP ' + response.status);
              return;
            }
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })).data;
            if (run.event !== 'workflow_dispatch'
              || run.path !== '.github/workflows/production-account-readonly-live-qa.yml'
              || run.head_branch !== 'main') {
              core.setFailed('Returned QA run does not match official main workflow.');
              return;
            }
            core.setOutput('run_id', String(runId));
            core.setOutput('run_url', run.html_url);

      - name: Record protected real-account read-only QA dispatch
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ steps.production.outputs.deploy_run_id }}
          QA_RUN_ID: ${{ steps.qa.outputs.run_id }}
          QA_RUN_URL: ${{ steps.qa.outputs.run_url }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Production Account Read-only Live QA dispatched behind the protected production environment.',
                '',
                '- Exact deployed Production SHA: ' + process.env.TARGET_SHA,
                '- Latest successful Production Deploy Run ID: ' + process.env.PRODUCTION_DEPLOY_RUN_ID,
                '- Production Account Read-only QA Run ID: ' + process.env.QA_RUN_ID,
                '- Run: ' + process.env.QA_RUN_URL,
                '- Credential source: member-scoped encrypted Production Vault',
                '- Provider Secret values passed by bridge: 0',
                '- Orders/cancels/amends/transfers/withdrawals authorized by bridge: 0',
                '- Live/auto trading authority granted by bridge: false',
                '- Source command comment ID: ' + process.env.SOURCE_COMMENT_ID,
              ].join('\n'),
            });
