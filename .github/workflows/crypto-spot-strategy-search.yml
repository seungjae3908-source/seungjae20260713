name: Crypto Spot Strategy Search

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'api-server/src/scripts/crypto-spot-strategy-search.ts'
      - 'api-server/src/services/cash-backtest-engine.service.ts'
      - 'api-server/src/services/upbit-backtest-data.service.ts'
      - '.github/workflows/crypto-spot-strategy-search.yml'

permissions:
  contents: read

concurrency:
  group: crypto-spot-strategy-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search:
    name: 90-day locked-test strategy search
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle locked-test search
        run: pnpm --dir api-server exec esbuild ./src/scripts/crypto-spot-strategy-search.ts --bundle --platform=node --format=esm --target=node20 --outfile=/tmp/crypto-spot-strategy-search.mjs

      - name: Run read-only strategy search
        env:
          BACKTEST_OUTPUT: ${{ github.workspace }}/artifacts/crypto-spot-strategy-search.json
        run: node /tmp/crypto-spot-strategy-search.mjs

      - name: Verify no-order contract
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('artifacts/crypto-spot-strategy-search.json','utf8'));if(p.orderSubmitted!==false||p.mode!=='backtest-only'||p.split.lockedTestPercent!==20)process.exit(1);console.log('candidateCount='+p.candidateCount+', eligible='+p.automationEligible)"

      - name: Upload strategy search result
        uses: actions/upload-artifact@v4
        with:
          name: crypto-spot-strategy-search-${{ github.sha }}
          path: artifacts/crypto-spot-strategy-search.json
          if-no-files-found: error
          retention-days: 14
