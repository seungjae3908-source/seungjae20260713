name: Research Full-Universe 3pct Hunter V3 Source Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-full-universe-3pct-hunter-v3-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-full-universe-3pct-hunter-v3-source-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install "requests>=2.32,<3" "finance-datareader>=0.9.90" "pandas>=2.2,<3"
      - name: Probe V3 public data coverage
        run: |
          python - <<'PY'
          import json, requests
          import pandas as pd
          import FinanceDataReader as fdr

          def head(url):
              try:
                  r = requests.head(url, allow_redirects=True, timeout=30, headers={'User-Agent':'market-prediction-lab/v3-probe'})
                  if r.status_code >= 400:
                      r = requests.get(url, stream=True, timeout=30, headers={'User-Agent':'market-prediction-lab/v3-probe'})
                  return {'url':url,'status':r.status_code,'bytes':int(r.headers.get('content-length') or 0)}
              except Exception as e:
                  return {'url':url,'status':0,'error':repr(e)}

          out = {'us':{}, 'kr':{}, 'spot':{}, 'futures':{}}
          us = 'https://huggingface.co/datasets/mito0o852/OHLCV-1m/resolve/main/data/ohlcv_{}.parquet'
          out['us']['months'] = {m: head(us.format(m)) for m in ['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09']}

          try:
              kr = fdr.DataReader('005930', '2026-04-01', '2026-09-30')
              out['kr']['samsung'] = {'rows':len(kr), 'start':str(kr.index.min()), 'end':str(kr.index.max())}
              kq = fdr.DataReader('247540', '2026-04-01', '2026-09-30')
              out['kr']['kosdaq'] = {'rows':len(kq), 'start':str(kq.index.min()), 'end':str(kq.index.max())}
          except Exception as e:
              out['kr']['error'] = repr(e)

          for market, base in [
              ('spot','https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/15m/BTCUSDT-15m-{}.zip'),
              ('futures','https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/15m/BTCUSDT-15m-{}.zip'),
          ]:
              out[market]['15m'] = {m: head(base.format(m)) for m in ['2026-04','2026-09']}

          out['spot']['aggTrades'] = {m: head(f'https://data.binance.vision/data/spot/monthly/aggTrades/BTCUSDT/BTCUSDT-aggTrades-{m}.zip') for m in ['2026-04','2026-09']}
          out['futures']['aggTrades'] = {m: head(f'https://data.binance.vision/data/futures/um/monthly/aggTrades/BTCUSDT/BTCUSDT-aggTrades-{m}.zip') for m in ['2026-04','2026-09']}
          out['futures']['metrics'] = {d: head(f'https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-{d}.zip') for d in ['2026-04-01','2026-09-30']}

          verdict = {
              'usOos6m': all(v.get('status')==200 for v in out['us']['months'].values()),
              'krOos6m': out['kr'].get('samsung',{}).get('rows',0) > 100 and out['kr'].get('kosdaq',{}).get('rows',0) > 100,
              'spot15mOos': all(v.get('status')==200 for v in out['spot']['15m'].values()),
              'futures15mOos': all(v.get('status')==200 for v in out['futures']['15m'].values()),
              'spotAggTradesOos': all(v.get('status')==200 for v in out['spot']['aggTrades'].values()),
              'futuresAggTradesOos': all(v.get('status')==200 for v in out['futures']['aggTrades'].values()),
              'futuresMetricsOos': all(v.get('status')==200 for v in out['futures']['metrics'].values()),
          }
          print(json.dumps({'V3_SOURCE_PROBE':out,'VERDICT':verdict}, ensure_ascii=False))
          PY
