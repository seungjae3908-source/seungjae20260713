name: Research Metric Semantics Hardening

on:
  push:
    branches:
      - research/metric-semantics-hardening
    paths:
      - .github/workflows/research-metric-semantics-hardening.yml

permissions:
  contents: write

concurrency:
  group: research-metric-semantics-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/metric-semantics-hardening

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply one-shot metric semantics migration
        working-directory: market-prediction-lab
        run: node scripts/apply-metric-semantics-hardening.mjs

      - name: Run metric semantics tests
        working-directory: market-prediction-lab
        run: node --test tests/research-metric-semantics.test.js tests/eth-v6-forward-validation.test.js tests/multi-market-backtest-engine.test.js

      - name: Validate isolated prediction lab
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Commit validated source changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            market-prediction-lab/src/multi-market-backtest-engine.js \
            market-prediction-lab/src/independent-strategy-backtest.js \
            market-prediction-lab/src/final-holdout-evaluator.js \
            market-prediction-lab/src/eth-v6-forward-validation.js \
            market-prediction-lab/scripts/run-eth-v6-replay-proof.js
          git diff --cached --quiet && { echo "No source changes produced"; exit 1; }
          git commit -m "feat(research): separate TP success from net profitable rate"
          git push origin HEAD:research/metric-semantics-hardening
