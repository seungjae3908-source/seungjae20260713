name: Application CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir stock-analyzer run typecheck

      - name: Typecheck backend
        run: pnpm --dir api-server run typecheck

      - name: Run futures unit tests
        run: pnpm --dir api-server run test:unit

      - name: Run futures route smoke tests
        run: pnpm --dir api-server run test:smoke

      - name: Report unavailable checks
        run: echo "Lint: no lint script is defined in the inspected package.json files."

      - name: Build frontend production bundle
        run: pnpm --dir stock-analyzer run build

      - name: Build backend production bundle
        run: pnpm --dir api-server run build:server
