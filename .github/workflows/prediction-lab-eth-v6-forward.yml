name: Prediction Lab ETH V6 Forward Validation

on:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - .github/workflows/prediction-lab-eth-v6-forward.yml
      - market-prediction-lab/src/eth-v6-forward-validation.js
      - market-prediction-lab/scripts/run-eth-v6-replay-proof.js
      - market-prediction-lab/scripts/run-eth-v6-forward-cycle.js
      - market-prediction-lab/tests/eth-v6-forward-validation.test.js
  schedule:
    # Bitget's observed 1d futures bars are anchored at 16:00 UTC.
    # Run shortly after that close so the just-closed bar can be evaluated and
    # any next-bar-open paper entry is recorded inside the no-backfill window.
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-lab-eth-v6-forward
  cancel-in-progress: false

jobs:
  forward-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: feature/prediction-lab-standalone

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate isolated prediction lab
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Verify ETH V6 forward guards
        working-directory: market-prediction-lab
        run: node --test tests/eth-v6-forward-validation.test.js

      - name: Create deterministic replay proof once
        working-directory: market-prediction-lab
        run: |
          if [ -f docs/eth-v6-replay-proof.json ] && node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("docs/eth-v6-replay-proof.json","utf8"));
            if(p.status!=="passed" || p.strategyId!=="eth-futures-long-v6" || p.safeguards?.usedForSelection!==false || p.safeguards?.parametersChanged!==false) process.exit(1);
          '; then
            echo "existing immutable replay proof is valid; replay not rerun"
          else
            node scripts/run-eth-v6-replay-proof.js
          fi

      - name: Advance forward-only Paper and Shadow state
        working-directory: market-prediction-lab
        run: node scripts/run-eth-v6-forward-cycle.js

      - name: Display forward validation summary
        working-directory: market-prediction-lab
        run: cat docs/eth-v6-forward-summary.md

      - name: Upload replay and forward evidence
        uses: actions/upload-artifact@v4
        with:
          name: eth-v6-forward-${{ github.run_id }}
          path: |
            market-prediction-lab/docs/eth-v6-replay-proof.json
            market-prediction-lab/docs/eth-v6-replay-proof.md
            market-prediction-lab/docs/eth-v6-forward-state.json
            market-prediction-lab/docs/eth-v6-forward-summary.json
            market-prediction-lab/docs/eth-v6-forward-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Persist forward research ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            market-prediction-lab/docs/eth-v6-replay-proof.json \
            market-prediction-lab/docs/eth-v6-replay-proof.md \
            market-prediction-lab/docs/eth-v6-forward-state.json \
            market-prediction-lab/docs/eth-v6-forward-summary.json \
            market-prediction-lab/docs/eth-v6-forward-summary.md
          if git diff --cached --quiet; then
            echo "forward research ledger unchanged"
          else
            git commit -m "chore(research): advance frozen ETH V6 forward ledger [skip ci]"
            git push origin HEAD:feature/prediction-lab-standalone
          fi
