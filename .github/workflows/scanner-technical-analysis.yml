name: Apply scanner technical analysis

on:
  push:
    branches:
      - feature/scanner-technical-analysis
    paths:
      - .github/workflows/scanner-technical-analysis.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scanner-technical-analysis
          fetch-depth: 0

      - name: Add technical analysis modal to scanner
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'stock-analyzer/src/pages/scanner.tsx';
          let source = fs.readFileSync(path, 'utf8');

          if (source.includes('SCANNER_TECHNICAL_ANALYSIS_V1')) {
            console.log('Scanner technical analysis is already applied.');
            process.exit(0);
          }

          source = source.replace(
            '  const [chartTradeSignal, setChartTradeSignal] = useState<ChartBroadcastSignal | null>(null);',
            '  const [chartTradeSignal, setChartTradeSignal] = useState<ChartBroadcastSignal | null>(null);\n  const [analysisCard, setAnalysisCard] = useState<AnyObj | null>(null);'
          );

          const oldCardOpen = `              onOpen={() =>\n                navigate(\n                  \`/stock/\${String(card.ticker)}?back=\${encodeURIComponent(\n                    "/scanner",\n                  )}\`,\n                )\n              }`;
          const newCardOpen = `              onOpen={() => setAnalysisCard(card)}`;
          if (!source.includes(oldCardOpen)) throw new Error('ScannerCard onOpen block not found');
          source = source.replace(oldCardOpen, newCardOpen);

          const modalMount = `      </main>\n\n      {helpOpen && (`;
          const modalReplacement = `      </main>\n\n      {analysisCard && (\n        <ScannerTechnicalAnalysisModal\n          card={analysisCard}\n          onClose={() => setAnalysisCard(null)}\n          onNavigate={() => {\n            const ticker = String(analysisCard.ticker ?? "").trim();\n            setAnalysisCard(null);\n            if (ticker) {\n              navigate(\`/stock/\${ticker}?back=\${encodeURIComponent("/scanner")}\`);\n            }\n          }}\n        />\n      )}\n\n      {helpOpen && (`;
          if (!source.includes(modalMount)) throw new Error('Modal mount location not found');
          source = source.replace(modalMount, modalReplacement);

          const componentMarker = 'function ScannerCard({';
          if (!source.includes(componentMarker)) throw new Error('ScannerCard component marker not found');

          const component = String.raw`
// SCANNER_TECHNICAL_ANALYSIS_V1

type ScannerTechnicalAnalysis = {
  trendSummary: string;
  trendTone: "positive" | "negative" | "neutral";
  movingAverage: string[];
  volume: string[];
  momentum: string[];
  supports: number[];
  resistances: number[];
  bullishScenario: string;
  sidewaysScenario: string;
  bearishScenario: string;
  invalidation: string;
  risks: string[];
  dataTime: string;
  completeness: number;
};

function firstNumber(card: AnyObj, keys: string[]): number | null {
  for (const key of keys) {
    const value = toNumber(card[key]);
    if (value != null) return value;
  }
  return null;
}

function firstText(card: AnyObj, keys: string[]): string | null {
  for (const key of keys) {
    const value = card[key];
    if (typeof value === "string" && value.trim()) return value.trim();
  }
  return null;
}

function uniqueFinite(values: Array<number | null>): number[] {
  return Array.from(new Set(values.filter((value): value is number => value != null && Number.isFinite(value))));
}

function formatAnalysisPrice(value: number, currency: "KRW" | "USD") {
  return formatAppPrice(value, currency);
}

function buildScannerTechnicalAnalysis(card: AnyObj): ScannerTechnicalAnalysis {
  const currency = cardCurrency(card);
  const price = firstNumber(card, ["price", "currentPrice", "close", "lastPrice"]);
  const change = firstNumber(card, ["changePercent", "changeRate", "change_pct"]);
  const ma5 = firstNumber(card, ["ma5", "sma5", "MA5"]);
  const ma10 = firstNumber(card, ["ma10", "sma10", "MA10"]);
  const ma20 = firstNumber(card, ["ma20", "sma20", "MA20"]);
  const ma60 = firstNumber(card, ["ma60", "sma60", "MA60"]);
  const ma120 = firstNumber(card, ["ma120", "sma120", "MA120"]);
  const ema12 = firstNumber(card, ["ema12", "EMA12"]);
  const ema26 = firstNumber(card, ["ema26", "EMA26"]);
  const rsi = firstNumber(card, ["rsi", "rsi14", "RSI"]);
  const macd = firstNumber(card, ["macd", "MACD"]);
  const macdSignal = firstNumber(card, ["macdSignal", "signal", "MACDSignal"]);
  const macdHistogram = firstNumber(card, ["macdHistogram", "macdHist", "histogram"]);
  const atr = firstNumber(card, ["atr", "atr14", "ATR"]);
  const superTrend = firstNumber(card, ["superTrend", "supertrend", "superTrendValue"]);
  const adx = firstNumber(card, ["adx", "adx14", "ADX"]);
  const stochasticK = firstNumber(card, ["stochasticK", "stochK", "percentK"]);
  const stochasticD = firstNumber(card, ["stochasticD", "stochD", "percentD"]);
  const volume = firstNumber(card, ["volume", "currentVolume"]);
  const volume5 = firstNumber(card, ["volumeMa5", "avgVolume5", "volumeAverage5"]);
  const volume10 = firstNumber(card, ["volumeMa10", "avgVolume10", "volumeAverage10"]);
  const volume20 = firstNumber(card, ["volumeMa20", "avgVolume20", "averageVolume"]);
  const volumeRatioRaw = firstNumber(card, ["volumeRatio", "volumeMultiple"]);
  const volumeRatio = volumeRatioRaw != null ? (volumeRatioRaw > 10 ? volumeRatioRaw / 100 : volumeRatioRaw) : volume != null && volume20 && volume20 > 0 ? volume / volume20 : null;
  const support1 = firstNumber(card, ["support1", "primarySupport", "support"]);
  const support2 = firstNumber(card, ["support2", "secondarySupport"]);
  const resistance1 = firstNumber(card, ["resistance1", "primaryResistance", "resistance"]);
  const resistance2 = firstNumber(card, ["resistance2", "secondaryResistance"]);
  const recentLow = firstNumber(card, ["recentLow", "low20", "periodLow", "dayLow"]);
  const recentHigh = firstNumber(card, ["recentHigh", "high20", "periodHigh", "dayHigh"]);
  const boxLow = firstNumber(card, ["boxLow", "rangeLow"]);
  const boxHigh = firstNumber(card, ["boxHigh", "rangeHigh"]);

  const supports = uniqueFinite([support1, support2, boxLow, recentLow])
    .filter((value) => price == null || value < price)
    .sort((a, b) => b - a)
    .slice(0, 2);
  const resistances = uniqueFinite([resistance1, resistance2, boxHigh, recentHigh])
    .filter((value) => price == null || value > price)
    .sort((a, b) => a - b)
    .slice(0, 2);

  const knownMas = [ma5, ma10, ma20, ma60, ma120].filter((value): value is number => value != null);
  const aboveCount = price == null ? 0 : knownMas.filter((value) => price > value).length;
  const belowCount = price == null ? 0 : knownMas.filter((value) => price < value).length;
  const bullishArray = ma5 != null && ma20 != null && ma60 != null && ma5 > ma20 && ma20 > ma60;
  const bearishArray = ma5 != null && ma20 != null && ma60 != null && ma5 < ma20 && ma20 < ma60;

  let trendSummary = "지표 데이터가 충분하지 않아 추세를 확정하기 어렵습니다.";
  let trendTone: ScannerTechnicalAnalysis["trendTone"] = "neutral";
  if (price != null && bullishArray && aboveCount >= Math.max(2, knownMas.length - 1)) {
    trendSummary = "단기·중기 이동평균이 상승 배열이고 현재가가 주요 평균선 위에 있어 상승 추세가 우세합니다.";
    trendTone = "positive";
  } else if (price != null && bearishArray && belowCount >= Math.max(2, knownMas.length - 1)) {
    trendSummary = "단기·중기 이동평균이 하락 배열이고 현재가가 주요 평균선 아래에 있어 하락 추세가 우세합니다.";
    trendTone = "negative";
  } else if (price != null && knownMas.length) {
    trendSummary = `현재가는 확인 가능한 이동평균 ${knownMas.length}개 중 ${aboveCount}개 위에 있습니다. 배열이 완전히 정리되지 않아 반등·조정이 섞인 중립 구간으로 판단합니다.`;
  } else if (change != null) {
    trendSummary = change > 0 ? "현재 가격은 상승 중이지만 이동평균 데이터가 부족해 추세 전환 확인이 필요합니다." : "현재 가격은 하락 중이며 이동평균 데이터가 부족해 지지 확인이 필요합니다.";
    trendTone = change > 0 ? "positive" : change < 0 ? "negative" : "neutral";
  }

  const movingAverage: string[] = [];
  if (price != null && knownMas.length) {
    movingAverage.push(`현재가는 확인 가능한 이동평균 ${knownMas.length}개 중 ${aboveCount}개 위, ${belowCount}개 아래에 있습니다.`);
  }
  if (ma5 != null && ma10 != null) movingAverage.push(ma5 > ma10 ? "MA5가 MA10 위에 있어 초단기 상승 배열입니다." : "MA5가 MA10 아래에 있어 단기 상승 정배열은 아직 완성되지 않았습니다.");
  if (ma20 != null && ma60 != null) movingAverage.push(ma20 > ma60 ? "MA20이 MA60 위에 있어 중기 추세는 상대적으로 양호합니다." : "MA20이 MA60 아래에 있어 중기 하락 압력이 남아 있습니다.");
  if (ema12 != null && ema26 != null) movingAverage.push(ema12 > ema26 ? "EMA12가 EMA26 위로 단기 모멘텀이 우세합니다." : "EMA12가 EMA26 아래로 단기 모멘텀이 약합니다.");
  if (superTrend != null && price != null) movingAverage.push(price > superTrend ? `현재가는 SuperTrend ${formatAnalysisPrice(superTrend, currency)} 위에 있습니다.` : `현재가는 SuperTrend ${formatAnalysisPrice(superTrend, currency)} 아래에 있어 하락 경고 상태입니다.`);
  if (!movingAverage.length) movingAverage.push("이동평균 원자료가 없어 선택된 조건과 가격 흐름만 확인할 수 있습니다.");

  const volumeNotes: string[] = [];
  if (volumeRatio != null) {
    const percent = Math.round(volumeRatio * 100);
    volumeNotes.push(volumeRatio >= 1.5 ? `현재 거래량은 기준 평균의 ${percent}%로 거래 참여가 강합니다.` : volumeRatio >= 1 ? `현재 거래량은 기준 평균의 ${percent}%로 평균 수준 이상입니다.` : `현재 거래량은 기준 평균의 ${percent}%로 돌파 신뢰도를 확인하기에는 부족할 수 있습니다.`);
  }
  if (volume != null && volume5 != null) volumeNotes.push(`현재 거래량은 5기간 평균의 ${Math.round((volume / Math.max(volume5, 1)) * 100)}%입니다.`);
  if (volume != null && volume10 != null) volumeNotes.push(`현재 거래량은 10기간 평균의 ${Math.round((volume / Math.max(volume10, 1)) * 100)}%입니다.`);
  if (!volumeNotes.length) volumeNotes.push("평균 거래량 데이터가 없어 거래량 증가 조건 충족 여부만 참고해야 합니다.");

  const momentum: string[] = [];
  if (rsi != null) momentum.push(rsi >= 70 ? `RSI ${rsi.toFixed(1)}로 과매수 구간이며 추격 진입 위험이 있습니다.` : rsi <= 30 ? `RSI ${rsi.toFixed(1)}로 과매도 구간이지만 반등 확인 전 물타기는 주의해야 합니다.` : `RSI ${rsi.toFixed(1)}로 중립 범위입니다.`);
  if (macd != null && macdSignal != null) momentum.push(macd > macdSignal ? "MACD가 Signal 위에 있어 상승 모멘텀이 우세합니다." : "MACD가 Signal 아래에 있어 하락 모멘텀이 우세합니다.");
  if (macdHistogram != null) momentum.push(macdHistogram > 0 ? "MACD 히스토그램이 양수로 상승 힘이 남아 있습니다." : "MACD 히스토그램이 음수로 하락 힘이 남아 있습니다.");
  if (adx != null) momentum.push(adx >= 25 ? `ADX ${adx.toFixed(1)}로 현재 방향의 추세 강도가 높은 편입니다.` : `ADX ${adx.toFixed(1)}로 방향성이 강하지 않아 횡보 가능성을 확인해야 합니다.`);
  if (stochasticK != null && stochasticD != null) momentum.push(stochasticK > stochasticD ? "스토캐스틱 K가 D 위로 단기 반등 모멘텀이 있습니다." : "스토캐스틱 K가 D 아래로 단기 모멘텀이 약합니다.");
  if (atr != null && price != null && price > 0) momentum.push(`ATR은 현재가의 ${((atr / price) * 100).toFixed(2)}%로, 해당 시간봉의 변동성 기준으로 활용할 수 있습니다.`);
  if (!momentum.length) momentum.push("RSI·MACD·ATR 등 세부 기술지표 원자료가 부족합니다.");

  const upper = resistances[0];
  const lower = supports[0];
  const bullishScenario = upper != null ? `${formatAnalysisPrice(upper, currency)}을 거래량과 함께 돌파하고 해당 가격 위에서 마감하면 상승 지속 가능성이 커질 수 있습니다.` : "직전 고점 또는 박스권 상단을 거래량과 함께 돌파하는지 확인해야 합니다.";
  const sidewaysScenario = lower != null && upper != null ? `${formatAnalysisPrice(lower, currency)}~${formatAnalysisPrice(upper, currency)} 범위에서는 방향이 확정되지 않은 박스권으로 보고 중간 가격의 추격 진입을 주의해야 합니다.` : "지지·저항 데이터가 부족하므로 최근 고점과 저점 사이의 횡보 여부를 확인해야 합니다.";
  const bearishScenario = lower != null ? `${formatAnalysisPrice(lower, currency)}을 이탈하고 회복하지 못하면 단기 구조가 약해져 다음 지지선까지 조정 가능성을 확인해야 합니다.` : "최근 저점이나 주요 이동평균을 이탈하면 반등 구조가 약해질 수 있습니다.";
  const invalidation = lower != null ? `${formatAnalysisPrice(lower, currency)} 이탈 후 종가 회복 실패` : ma20 != null ? `${formatAnalysisPrice(ma20, currency)} 아래 종가 마감` : "최근 저점 이탈 또는 선택된 핵심 조건 해제";

  const risks: string[] = [];
  if (volumeRatio != null && volumeRatio < 0.8) risks.push("거래량 확인 부족");
  if (rsi != null && rsi >= 70) risks.push("RSI 과열·추격 진입 위험");
  if (atr != null && price != null && price > 0 && atr / price >= 0.03) risks.push("높은 변동성");
  if (price != null && upper != null && (upper - price) / price < 0.02) risks.push("바로 위 저항선 근접");
  if (price != null && lower != null && (price - lower) / price > 0.08) risks.push("손절 기준이 멀어 손익비 악화 가능");
  if (!risks.length) risks.push("신호 단독 판단 금지", "시장 뉴스·공시 확인 필요");

  const dataTime = firstText(card, ["updatedAt", "fetchedAt", "dataTime", "timestamp", "generatedAt"]) ?? "기준 시각 확인 필요";
  const keyValues = [price, ma5, ma20, ma60, rsi, macd, atr, volumeRatio, supports[0] ?? null, resistances[0] ?? null];
  const completeness = Math.round((keyValues.filter((value) => value != null).length / keyValues.length) * 100);

  return { trendSummary, trendTone, movingAverage, volume: volumeNotes, momentum, supports, resistances, bullishScenario, sidewaysScenario, bearishScenario, invalidation, risks, dataTime, completeness };
}

function ScannerTechnicalAnalysisModal({
  card,
  onClose,
  onNavigate,
}: {
  card: AnyObj;
  onClose: () => void;
  onNavigate: () => void;
}) {
  const analysis = useMemo(() => buildScannerTechnicalAnalysis(card), [card]);
  const market = cardMarket(card);
  const currency = cardCurrency(card);
  const ticker = String(card.ticker ?? "");
  const name = displayStockName(ticker, String(card.name ?? ticker), market);
  const score = scoreOf(card);
  const matched = matchedLabels(card);

  return (
    <div className="fixed inset-0 z-[70] flex items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-5" role="dialog" aria-modal="true" aria-labelledby="scanner-analysis-title" onMouseDown={(event) => { if (event.currentTarget === event.target) onClose(); }}>
      <div className="flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-t-3xl border border-card-border bg-card shadow-2xl sm:rounded-3xl">
        <div className="flex items-start justify-between gap-3 border-b border-card-border px-4 py-4 text-center">
          <div className="min-w-0 flex-1">
            <p className="text-[11px] font-extrabold text-primary">기술지표 종합 분석</p>
            <h2 id="scanner-analysis-title" className="mt-1 truncate text-lg font-black">{name}</h2>
            <p className="mt-1 text-xs font-bold text-muted-foreground">{ticker} · {market === "KR" ? "국내주식" : "해외주식"} · AI 점수 {score}</p>
          </div>
          <button type="button" onClick={onClose} aria-label="분석 창 닫기" className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-card-border bg-background"><X className="h-4 w-4" /></button>
        </div>

        <div className="overflow-y-auto px-4 py-4">
          <div className={cn("rounded-2xl border p-4 text-center", analysis.trendTone === "positive" ? "border-positive/30 bg-positive/10" : analysis.trendTone === "negative" ? "border-destructive/30 bg-destructive/10" : "border-card-border bg-secondary/60")}>
            <p className="text-xs font-extrabold">종합 추세 판단</p>
            <p className="mt-2 break-keep text-sm font-bold leading-6">{analysis.trendSummary}</p>
            <p className="mt-2 text-[11px] font-bold text-muted-foreground">분석 데이터 충족도 {analysis.completeness}%</p>
          </div>

          {matched.length > 0 && <div className="mt-3 flex flex-wrap justify-center gap-1.5">{matched.map((item) => <span key={item} className="rounded-full bg-primary/10 px-2 py-1 text-[10px] font-extrabold text-primary">{item}</span>)}</div>}

          <AnalysisSection title="이동평균·추세" items={analysis.movingAverage} />
          <AnalysisSection title="거래량 분석" items={analysis.volume} />
          <AnalysisSection title="모멘텀 지표" items={analysis.momentum} />

          <div className="mt-3 grid grid-cols-2 gap-2 text-center">
            <div className="rounded-2xl bg-secondary/70 p-3"><p className="text-[11px] font-extrabold text-muted-foreground">주요 지지선</p>{analysis.supports.length ? analysis.supports.map((value, index) => <p key={value} className="mt-1 text-xs font-black">{index + 1}차 {formatAnalysisPrice(value, currency)}</p>) : <p className="mt-2 text-xs font-bold text-muted-foreground">데이터 부족</p>}</div>
            <div className="rounded-2xl bg-secondary/70 p-3"><p className="text-[11px] font-extrabold text-muted-foreground">주요 저항선</p>{analysis.resistances.length ? analysis.resistances.map((value, index) => <p key={value} className="mt-1 text-xs font-black">{index + 1}차 {formatAnalysisPrice(value, currency)}</p>) : <p className="mt-2 text-xs font-bold text-muted-foreground">데이터 부족</p>}</div>
          </div>

          <div className="mt-3 space-y-2">
            <ScenarioBox title="상승 시나리오" text={analysis.bullishScenario} tone="positive" />
            <ScenarioBox title="횡보 시나리오" text={analysis.sidewaysScenario} tone="neutral" />
            <ScenarioBox title="하락 시나리오" text={analysis.bearishScenario} tone="negative" />
          </div>

          <div className="mt-3 rounded-2xl border border-warning/30 bg-warning/10 p-3 text-center"><p className="text-xs font-extrabold text-warning">신호 무효 조건</p><p className="mt-2 break-keep text-xs font-bold leading-5">{analysis.invalidation}</p></div>

          <div className="mt-3 rounded-2xl border border-destructive/20 bg-destructive/5 p-3 text-center"><p className="text-xs font-extrabold text-destructive">주요 위험</p><div className="mt-2 flex flex-wrap justify-center gap-1.5">{analysis.risks.map((risk) => <span key={risk} className="rounded-full bg-background px-2 py-1 text-[10px] font-bold">{risk}</span>)}</div></div>

          <p className="mt-3 text-center text-[10px] font-bold leading-5 text-muted-foreground">데이터 기준: {analysis.dataTime}<br />확정적인 매수·매도 지시가 아닌 참고용 기술분석입니다.</p>
        </div>

        <div className="grid grid-cols-2 gap-2 border-t border-card-border p-4"><button type="button" onClick={onClose} className="rounded-2xl border border-card-border bg-background px-4 py-3 text-sm font-extrabold">닫기</button><button type="button" onClick={onNavigate} className="rounded-2xl bg-primary px-4 py-3 text-sm font-extrabold text-primary-foreground">종목으로 이동</button></div>
      </div>
    </div>
  );
}

function AnalysisSection({ title, items }: { title: string; items: string[] }) {
  return <div className="mt-3 rounded-2xl bg-secondary/70 p-3 text-center"><p className="text-xs font-extrabold">{title}</p><div className="mt-2 space-y-1.5">{items.map((item, index) => <p key={\`${title}:\${index}\`} className="break-keep rounded-xl bg-background/70 px-3 py-2 text-[11px] font-semibold leading-5 text-muted-foreground">{item}</p>)}</div></div>;
}

function ScenarioBox({ title, text, tone }: { title: string; text: string; tone: "positive" | "negative" | "neutral" }) {
