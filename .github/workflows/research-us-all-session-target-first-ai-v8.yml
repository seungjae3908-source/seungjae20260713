name: Research US All-Session Target-First AI V8

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/label-us-all-session-target-first-v8.py
      - market-prediction-lab/scripts/train-us-all-session-target-first-ai-v8.py
      - .github/workflows/research-us-all-session-target-first-ai-v8.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-us-all-session-target-first-ai-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "2023-04,2023-05,2023-06,2023-07,2023-08,2023-09"
          - "2023-10,2023-11,2023-12,2024-01,2024-02,2024-03"
          - "2024-04,2024-05,2024-06,2024-07,2024-08,2024-09"
          - "2024-10,2024-11,2024-12,2025-01,2025-02,2025-03"
          - "2025-04,2025-05,2025-06,2025-07,2025-08,2025-09"
          - "2025-10,2025-11,2025-12,2026-01,2026-02"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: "37432285496"
      SOURCE_ARTIFACT: "us-all-session-opportunity-events-v3-combined-10ec3c31b27dcbaf3563932ab8843e66f8ea050a"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/label-us-all-session-target-first-v8.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.3,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "huggingface_hub>=0.30,<1"
      - name: Download frozen 35-month event dataset
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
      - name: Label exact target-before-stop paths
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ARGS=()
          IFS=',' read -ra MONTHS <<< "$SHARD"
          for M in "${MONTHS[@]}"; do
            ARGS+=(--month "$M")
          done
          SAFE="${SHARD//,/_}"
          python market-prediction-lab/scripts/label-us-all-session-target-first-v8.py \
            --events source/events.parquet \
            "${ARGS[@]}" \
            --out-dir "market-prediction-lab/docs/us-all-session-target-first-v8/$SAFE"
      - name: Upload labeled shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-all-session-target-first-v8-${{ strategy.job-index }}-${{ github.sha }}
          path: market-prediction-lab/docs/us-all-session-target-first-v8
          if-no-files-found: error
          retention-days: 14

  combine-train:
    needs: label
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install combine and AI dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - uses: actions/download-artifact@v4
        with:
          pattern: us-all-session-target-first-v8-*
          path: shards
      - name: Combine exact path labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          paths=list(Path("shards").glob("**/events-target-first.parquet"))
          if len(paths)!=6:
              raise SystemExit(f"EXPECTED_6_TARGET_FIRST_SHARDS_GOT:{len(paths)}")
          frames=[pd.read_parquet(p) for p in paths]
          data=pd.concat(frames,ignore_index=True).sort_values(["timestamp","symbol"]).reset_index(drop=True)
          months=sorted(data["month"].astype(str).unique())
          expected=[str(p) for p in pd.period_range("2023-04","2026-02",freq="M")]
          missing=sorted(set(expected)-set(months))
          if missing:
              raise SystemExit("TARGET_FIRST_MISSING_MONTHS:"+",".join(missing))
          out=Path("combined");out.mkdir(exist_ok=True)
          data.to_parquet(out/"events-target-first.parquet",index=False)
          summaries=[]
          for p in Path("shards").glob("**/summary.json"):
              try:summaries.append(json.loads(p.read_text(encoding="utf-8")))
              except Exception:pass
          audit={
            "contract":"us-all-session-target-first-v8-combined",
            "monthCount":len(months),
            "rows":len(data),
            "usablePathRows":int(data["exactNetReturn"].notna().sum()),
            "targetFirst3Rows":int(data["labelTargetFirst3"].sum()),
            "periodRows":{str(k):int(v) for k,v in data["period"].value_counts().to_dict().items()},
            "truthBoundary":{"profitabilityProven":False,"executionAuthority":"NONE"},
          }
          (out/"label-summary.json").write_text(json.dumps(audit,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"FINAL_COMBINED_LABELS":audit},ensure_ascii=False))
          PY
      - name: Train economic target-first AI
        run: |
          python market-prediction-lab/scripts/train-us-all-session-target-first-ai-v8.py \
            --events combined/events-target-first.parquet \
            --out-dir combined/ai-v8
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-all-session-target-first-ai-v8-${{ github.sha }}
          path: combined
          if-no-files-found: error
          retention-days: 14
