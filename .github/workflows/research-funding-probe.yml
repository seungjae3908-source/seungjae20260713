name: Research Funding Probe

# Read-only: checks which public funding-history endpoints answer from CI.
on:
  pull_request:
    paths:
      - .github/workflows/research-funding-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public funding endpoints
        run: |
          for url in \
            "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=usdt-futures&pageSize=100&pageNo=1" \
            "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=USDT-FUTURES&pageSize=100&pageNo=30" \
            "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=USDT-FUTURES&pageSize=100&pageNo=80" \
            "https://api.bitget.com/api/mix/v1/market/history-fundRate?symbol=BTCUSDT_UMCBL&pageSize=100&pageNo=1" \
            "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=3&startTime=1577836800000" \
            "https://data.binance.vision/?prefix=data/futures/um/monthly/fundingRate/BTCUSDT/" \
            "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=3&endTime=1600000000000" \
            "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=3" \
            "https://api.hyperliquid.xyz/info" ; do
            echo "== $url"; curl -sS -m 20 -A 'Mozilla/5.0' "$url" | head -c 400; echo; done
          echo "== binance vision zip"; curl -sS -m 30 -o f.zip -w '%{http_code} %{size_download}\n' "https://data.binance.vision/data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2021-01.zip"; unzip -p f.zip | head -3 || true
