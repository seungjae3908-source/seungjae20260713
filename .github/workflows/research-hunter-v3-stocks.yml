name: Research Hunter V3 Stocks

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/hunter_v3_common.py
      - market-prediction-lab/scripts/run-hunter-us-intraday-v3.py
      - market-prediction-lab/scripts/run-hunter-kr-pressure-v3.py
      - .github/workflows/research-hunter-v3-stocks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-hunter-v3-stocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3:
    strategy:
      fail-fast: false
      matrix:
        market: [US_STOCK, KR_STOCK]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/hunter_v3_common.py
          python -m py_compile market-prediction-lab/scripts/run-hunter-us-intraday-v3.py
          python -m py_compile market-prediction-lab/scripts/run-hunter-kr-pressure-v3.py
      - name: Install dependencies
        run: python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "requests>=2.32,<3" "huggingface_hub>=0.30,<1" "finance-datareader>=0.9.90"
      - name: Run US V3
        if: matrix.market == 'US_STOCK'
        run: python market-prediction-lab/scripts/run-hunter-us-intraday-v3.py --out-dir out/US_STOCK
      - name: Run KR V3
        if: matrix.market == 'KR_STOCK'
        run: python market-prediction-lab/scripts/run-hunter-kr-pressure-v3.py --out-dir out/KR_STOCK
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-v3-${{ matrix.market }}-${{ github.sha }}
          path: out/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14
