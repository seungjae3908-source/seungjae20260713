name: Prediction Lab Model Reference Drift Diagnostics V1

on:
  pull_request:
    paths:
      - 'market-prediction-lab/src/model-reference-drift-diagnostics-v1.js'
      - 'market-prediction-lab/scripts/run-model-reference-drift-diagnostics-v1.js'
      - 'market-prediction-lab/tests/model-reference-drift-diagnostics-v1.test.js'
      - '.github/workflows/prediction-lab-model-reference-drift-diagnostics-v1.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable durable-reference release tag to authenticate and diagnose
        required: true
        type: string
      requested_bins:
        description: TRAIN-quantile bins for PSI/JSD diagnostics (4-20)
        required: false
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  unit-contract:
    name: Verify drift diagnostic contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check durable drift diagnostic code
        run: |
          node --check market-prediction-lab/src/model-reference-drift-diagnostics-v1.js
          node --check market-prediction-lab/scripts/run-model-reference-drift-diagnostics-v1.js

      - name: Run durable drift diagnostic tests
        working-directory: market-prediction-lab
        run: node --test tests/model-reference-drift-diagnostics-v1.test.js

      - name: Verify diagnostic-only safety contract
        run: |
          grep -q 'diagnosticsOnly: true' market-prediction-lab/src/model-reference-drift-diagnostics-v1.js
          grep -q 'tuningAuthority: false' market-prediction-lab/src/model-reference-drift-diagnostics-v1.js
          grep -q 'profitabilityCredit: 0' market-prediction-lab/src/model-reference-drift-diagnostics-v1.js
          grep -q 'promotionCredit: 0' market-prediction-lab/src/model-reference-drift-diagnostics-v1.js
          grep -q 'LIVE_TRADING: false' market-prediction-lab/src/model-reference-drift-diagnostics-v1.js
          grep -q 'executionAuthority: "NONE"' market-prediction-lab/src/model-reference-drift-diagnostics-v1.js

  diagnose:
    name: Authenticate immutable reference and calculate PSI KS JSD
    needs: unit-contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      REQUESTED_BINS: ${{ inputs.requested_bins }}
      DOWNLOAD_ROOT: ${{ runner.temp }}/model-reference-durable-download
      REFERENCE_ROOT: ${{ runner.temp }}/model-reference-durable-reference
      OUTPUT_ROOT: ${{ runner.temp }}/model-reference-drift-diagnostics
    steps:
      - name: Require exact latest main and immutable durable release metadata
        id: durable
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_METADATA: ${{ runner.temp }}/model-reference-release-metadata.json
          BUNDLE_ASSET_METADATA: ${{ runner.temp }}/model-reference-bundle-asset-metadata.json
          RECEIPT_ASSET_METADATA: ${{ runner.temp }}/model-reference-receipt-asset-metadata.json
        with:
          script: |
            const fs = require('fs');
            const tag = String(process.env.RELEASE_TAG ?? '').trim();
            const match = /^prediction-lab-model-reference-v1-([1-9][0-9]*)$/.exec(tag);
            if (!match) {
              core.setFailed('DURABLE_REFERENCE_PROVEN=false: release tag is not canonical');
              return;
            }
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') {
              core.setFailed('DURABLE_REFERENCE_PROVEN=false: diagnostic must be manually dispatched on main');
              return;
            }
            const { data: repository } = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.default_branch,
            });
            if (repository.default_branch !== 'main' || String(main.commit.sha).toLowerCase() !== String(context.sha).toLowerCase()) {
              core.setFailed('DURABLE_REFERENCE_PROVEN=false: diagnostic checkout is not exact latest main');
              return;
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const targetSha = String(release.target_commitish ?? '').toLowerCase();
            if (release.immutable !== true || release.draft !== false || targetSha !== String(main.commit.sha).toLowerCase()) {
              core.setFailed('DURABLE_REFERENCE_PROVEN=false: immutable exact-main release metadata not proven');
              return;
            }
            const sourceRunId = match[1];
            const bundlePattern = new RegExp(`^prediction-lab-model-reference-evidence-${sourceRunId}-[0-9a-f]{64}\\.tar\\.gz$`);
            const receiptName = `prediction-lab-model-reference-receipt-${sourceRunId}.json`;
            const bundleAssets = release.assets.filter((asset) => bundlePattern.test(String(asset.name ?? '')));
            const receiptAssets = release.assets.filter((asset) => asset.name === receiptName);
            if (bundleAssets.length !== 1 || receiptAssets.length !== 1) {
              core.setFailed('DURABLE_REFERENCE_PROVEN=false: exact bundle/receipt asset pair missing or ambiguous');
              return;
            }
            const bundleAsset = bundleAssets[0];
            const receiptAsset = receiptAssets[0];
            if (bundleAsset.state !== 'uploaded' || receiptAsset.state !== 'uploaded'
                || !/^sha256:[0-9a-f]{64}$/.test(String(bundleAsset.digest ?? ''))
                || !/^sha256:[0-9a-f]{64}$/.test(String(receiptAsset.digest ?? ''))) {
              core.setFailed('DURABLE_REFERENCE_PROVEN=false: immutable asset digest metadata missing');
              return;
            }
            fs.writeFileSync(process.env.RELEASE_METADATA, JSON.stringify(release));
            fs.writeFileSync(process.env.BUNDLE_ASSET_METADATA, JSON.stringify(bundleAsset));
            fs.writeFileSync(process.env.RECEIPT_ASSET_METADATA, JSON.stringify(receiptAsset));
            core.setOutput('target_sha', targetSha);
            core.setOutput('bundle_name', bundleAsset.name);
            core.setOutput('receipt_name', receiptAsset.name);
            core.notice(`Authenticated immutable release metadata ${tag} on exact latest main ${targetSha}.`);

      - name: Checkout exact durable producer revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.durable.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and cryptographically verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUNDLE_NAME: ${{ steps.durable.outputs.bundle_name }}
          RECEIPT_NAME: ${{ steps.durable.outputs.receipt_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOWNLOAD_ROOT"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --pattern "$BUNDLE_NAME" --pattern "$RECEIPT_NAME" --dir "$DOWNLOAD_ROOT"
          test -f "$DOWNLOAD_ROOT/$BUNDLE_NAME"
          test -f "$DOWNLOAD_ROOT/$RECEIPT_NAME"
          gh release verify "$RELEASE_TAG" --repo "$REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" "$DOWNLOAD_ROOT/$BUNDLE_NAME" --repo "$REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" "$DOWNLOAD_ROOT/$RECEIPT_NAME" --repo "$REPOSITORY"

      - name: Extract exact authenticated durable bundle without substitution
        env:
          BUNDLE_NAME: ${{ steps.durable.outputs.bundle_name }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$DOWNLOAD_ROOT/$BUNDLE_NAME"
          listing="${RUNNER_TEMP}/model-reference-bundle-listing.txt"
          tar -tzf "$bundle" > "$listing"
          test -s "$listing"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$listing"; then
            echo 'DURABLE_REFERENCE_PROVEN=false: unsafe archive path rejected' >&2
            exit 1
          fi
          mkdir -p "$REFERENCE_ROOT"
          tar -xzf "$bundle" -C "$REFERENCE_ROOT"
          if find "$REFERENCE_ROOT" -type l -print -quit | grep -q .; then
            echo 'DURABLE_REFERENCE_PROVEN=false: symlink substitution rejected' >&2
            exit 1
          fi
          test -n "$(find "$REFERENCE_ROOT" -mindepth 2 -maxdepth 2 -type f -name reference-manifest.json -print -quit)"

      - name: Revalidate durable receipt and calculate authenticated PSI KS JSD
        env:
          BUNDLE_NAME: ${{ steps.durable.outputs.bundle_name }}
          RECEIPT_NAME: ${{ steps.durable.outputs.receipt_name }}
          RELEASE_METADATA: ${{ runner.temp }}/model-reference-release-metadata.json
          BUNDLE_ASSET_METADATA: ${{ runner.temp }}/model-reference-bundle-asset-metadata.json
          RECEIPT_ASSET_METADATA: ${{ runner.temp }}/model-reference-receipt-asset-metadata.json
        shell: bash
        run: |
          set -euo pipefail
          node market-prediction-lab/scripts/run-model-reference-drift-diagnostics-v1.js \
            --reference-root "$REFERENCE_ROOT" \
            --bundle "$DOWNLOAD_ROOT/$BUNDLE_NAME" \
            --receipt "$DOWNLOAD_ROOT/$RECEIPT_NAME" \
            --release-metadata "$RELEASE_METADATA" \
            --bundle-asset-metadata "$BUNDLE_ASSET_METADATA" \
            --receipt-asset-metadata "$RECEIPT_ASSET_METADATA" \
            --requested-bins "$REQUESTED_BINS" \
            --output-dir "$OUTPUT_ROOT"
          test -s "$OUTPUT_ROOT/model-reference-drift-diagnostics-v1.json"

      - name: Upload authenticated diagnostic-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-model-reference-drift-diagnostics-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/model-reference-drift-diagnostics/*.json
          if-no-files-found: error
          retention-days: 90
