name: Temporary Latency Successor Generator
# retry-contract: preserve-existing-authoritative-latency-v2

on:
  push:
    branches:
      - feat/p0-latency-canonical-runtime-successor-20260828
    paths:
      - .github/workflows/_tmp-latency-successor-generator.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@v4
        with:
          ref: feat/p0-latency-canonical-runtime-successor-20260828
          fetch-depth: 0

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded canonical latency integration
        run: python3 api-server/scripts/_tmp-apply-latency-successor.py

      - name: Typecheck API server
        run: pnpm --dir api-server run typecheck

      - name: Run focused latency producer tests
        run: |
          pnpm --dir api-server exec esbuild src/services/authoritative-paper-latency-cost-evidence.service.test.ts --bundle --platform=node --format=cjs --target=node20 --outfile=/tmp/latency-successor.test.cjs
          node --test /tmp/latency-successor.test.cjs

      - name: Regenerate canonical runtime package
        run: node api-server/scripts/build-authoritative-paper-runtime-package.mjs

      - name: Verify canonical runtime package
        run: node --test market-prediction-lab/tests/authoritative-paper-runtime-package-v1.test.js

      - name: Verify successor binding contract
        run: |
          grep -q "buildAuthoritativePaperLatencyCostEvidence" api-server/src/services/authoritative-paper-evidence-sources.service.ts
          grep -q "sourceSupplementalCostInput: latencyBoundSupplementalCostInput" api-server/src/services/authoritative-paper-evidence-sources.service.ts
          grep -q "authoritative-paper-latency-cost-evidence.service.ts" api-server/scripts/build-authoritative-paper-runtime-package.mjs
          grep -q "authoritative-paper-latency-cost-evidence.service.ts" market-prediction-lab/src/authoritative-paper-runtime-package-v1.js
          grep -q "PUBLIC_MIDPOINT_ADVERSE_MOVE_OVER_OBSERVED_REQUEST_LATENCY" market-prediction-lab/runtime/authoritative-paper-runtime-v1/authoritative-paper-runtime-v1.mjs
          git diff --check

      - name: Commit generated successor sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-server/src/services/authoritative-paper-evidence-sources.service.ts
          git add api-server/scripts/build-authoritative-paper-runtime-package.mjs
          git add market-prediction-lab/src/authoritative-paper-runtime-package-v1.js
          git add market-prediction-lab/runtime/authoritative-paper-runtime-v1/authoritative-paper-runtime-v1.mjs
          git add market-prediction-lab/runtime/authoritative-paper-runtime-v1/authoritative-paper-runtime-v1.manifest.json
          git diff --cached --check
          git commit -m "feat(paper): bind latency evidence into canonical runtime"
          git push origin HEAD:feat/p0-latency-canonical-runtime-successor-20260828
