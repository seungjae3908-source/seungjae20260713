name: Prediction Lab Long History V1

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Exact research commit/ref to validate
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/package.json
      - market-prediction-lab/src/historical-backtest-data.js
      - market-prediction-lab/src/binance-futures-history.js
      - market-prediction-lab/src/binance-vision-futures-archive.js
      - market-prediction-lab/src/bitget-candle-collector.js
      - market-prediction-lab/src/scalping-history-provider.js
      - market-prediction-lab/src/multi-market-backtest-engine.js
      - market-prediction-lab/src/independent-strategy-backtest.js
      - market-prediction-lab/src/v2-market-optimizer.js
      - market-prediction-lab/src/v3-market-filter-optimizer.js
      - market-prediction-lab/src/v4-momentum-regime-optimizer.js
      - market-prediction-lab/src/v5-price-structure-optimizer.js
      - market-prediction-lab/src/v6-independent-breakout-retest-optimizer.js
      - market-prediction-lab/src/automated-research-orchestrator.js
      - market-prediction-lab/src/automated-v1-research.js
      - market-prediction-lab/src/unified-candidate-evaluator.js
      - market-prediction-lab/src/long-history-data-layer.js
      - market-prediction-lab/src/research-cache-provenance.js
      - market-prediction-lab/scripts/run-long-history-v1.js
      - market-prediction-lab/scripts/run-v3-history.js
      - market-prediction-lab/scripts/run-v4-history.js
      - market-prediction-lab/scripts/run-v5-history.js
      - market-prediction-lab/scripts/run-v6-history.js
      - market-prediction-lab/scripts/run-automated-v1-from-long-history.js
      - market-prediction-lab/scripts/build-unified-v2-v6-research.js
      - market-prediction-lab/scripts/collect-scalping-history.js
      - market-prediction-lab/scripts/extend-spot-holdout-cache.js
      - market-prediction-lab/scripts/extend-futures-holdout-cache.js
      - market-prediction-lab/scripts/build-scanner-backtest-quality.js
      - market-prediction-lab/tests/**

permissions:
  actions: read
  contents: read

concurrency:
  group: prediction-lab-long-history-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve immutable research ref
        id: research
        shell: bash
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_REF: ${{ inputs.research_ref }}
        run: |
          set -euo pipefail
          ref="$PR_SHA"
          if [ -z "$ref" ]; then ref="$INPUT_REF"; fi
          if [ -z "$ref" ]; then ref="$GITHUB_SHA"; fi
          if ! [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "research ref must resolve to an immutable 40-character SHA" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout isolated research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.research.outputs.ref }}
          persist-credentials: false

      - name: Record immutable research SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ steps.research.outputs.ref }}"
          echo "value=$actual" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate isolated lab
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Restore validated long-history research cache
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            market-prediction-lab/long-history-v1
            market-prediction-lab/docs/long-history-v1-result.json
            market-prediction-lab/docs/long-history-v1-result.md
          key: prediction-lab-long-history-v1-${{ hashFiles('market-prediction-lab/src/historical-backtest-data.js', 'market-prediction-lab/src/bitget-candle-collector.js', 'market-prediction-lab/src/candle-gap-repair.js', 'market-prediction-lab/src/binance-vision-futures-archive.js') }}-${{ github.run_id }}
          restore-keys: |
            prediction-lab-long-history-v1-${{ hashFiles('market-prediction-lab/src/historical-backtest-data.js', 'market-prediction-lab/src/bitget-candle-collector.js', 'market-prediction-lab/src/candle-gap-repair.js', 'market-prediction-lab/src/binance-vision-futures-archive.js') }}-

      - name: Collect initial public history and run V1 plus V2 search
        if: steps.history-cache.outputs.cache-matched-key == ''
        working-directory: market-prediction-lab
        run: npm run backtest:v1:history -- long-history-v1 docs/long-history-v1-result.json docs/long-history-v1-result.md

      - name: Incrementally append spot closed history
        working-directory: market-prediction-lab
        run: node scripts/extend-spot-holdout-cache.js long-history-v1

      - name: Incrementally extend futures final-holdout cache
        working-directory: market-prediction-lab
        run: node scripts/extend-futures-holdout-cache.js long-history-v1

      - name: Run automated V1 Development OOS Walk Forward on same real cache
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/run-automated-v1-from-long-history.js long-history-v1 artifacts/automated-research/v1-long-history.json

      - name: Build scanner backtest quality artifact with frozen holdout
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/build-scanner-backtest-quality.js long-history-v1 artifacts/automated-research/v1-long-history.json artifacts/automated-research/scanner-backtest-quality-v1.json

      - name: Assert automated research safety and holdout isolation
        working-directory: market-prediction-lab
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('artifacts/automated-research/v1-long-history.json', 'utf8'));
          if (result.realHistoricalDataOnly !== true || result.syntheticResearchDataAllowed !== false) throw new Error('research must use real historical data only');
          if (result.safety.branchWrite !== false) throw new Error('branch write must remain false');
          if (result.safety.liveOrderAllowed !== false) throw new Error('live order must remain false');
          if (result.safety.privateAccountRequestAllowed !== false) throw new Error('private account request must remain false');
          if (result.safety.orderSubmitted !== false) throw new Error('orderSubmitted must remain false');
          if (result.safety.finalHoldoutUsedForSelection !== false) throw new Error('final holdout cannot be used for selection');
          if (result.safety.finalHoldoutRetuningAllowed !== false) throw new Error('final holdout retuning must remain forbidden');
          if (!Array.isArray(result.perSymbolResults)) throw new Error('perSymbolResults missing');
          if (result.perSymbolResults.some((row) => row.result.period.oosEnd >= row.result.period.finalHoldoutStart)) throw new Error('OOS overlaps final holdout');

          const scanner = JSON.parse(fs.readFileSync('artifacts/automated-research/scanner-backtest-quality-v1.json', 'utf8'));
          if (scanner.schema !== 'scanner-backtest-quality-v1' || scanner.schemaVersion !== 1) throw new Error('scanner artifact schema mismatch');
          if (scanner.syntheticMetricsAllowed !== false || scanner.liveOrderAllowed !== false || scanner.privateApiAllowed !== false || scanner.orderSubmitted !== false) throw new Error('scanner safety contract violated');
          if (!scanner.rows.some((row) => row.market === 'CRYPTO_SPOT' && row.symbol === 'USDT-BTC')) throw new Error('BTC spot scanner row missing');
          if (!scanner.rows.some((row) => row.market === 'CRYPTO_FUTURES' && row.symbol === 'BTCUSDT' && row.direction === 'LONG')) throw new Error('BTC futures LONG row missing');
          if (scanner.rows.some((row) => row.backtestQuality === 'verified' && row.holdout?.status !== 'evaluated')) throw new Error('verified row must contain evaluated frozen holdout');
          NODE

      - name: Run V3 ETH volume and trend filter validation
        working-directory: market-prediction-lab
        run: npm run backtest:v3:history -- long-history-v1 docs/long-history-v3-result.json docs/long-history-v3-result.md

      - name: Run V4 ETH regime and momentum validation
        working-directory: market-prediction-lab
        run: npm run backtest:v4:history -- long-history-v1 docs/long-history-v4-result.json docs/long-history-v4-result.md

      - name: Run V5 ETH price structure validation
        working-directory: market-prediction-lab
        run: npm run backtest:v5:history -- long-history-v1 docs/long-history-v5-result.json docs/long-history-v5-result.md

      - name: Run V6 independent breakout retest validation
        working-directory: market-prediction-lab
        run: npm run backtest:v6:history -- long-history-v1 docs/long-history-v6-result.json docs/long-history-v6-result.md

      - name: Build unified V2 through V6 OOS and purged walk-forward calibration artifacts
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/build-unified-v2-v6-research.js long-history-v1 artifacts/automated-research/v1-long-history.json artifacts/automated-research/unified-v2-v6.json artifacts/automated-research/gate-calibration-candidates.json

      - name: Restore exact-code scalping historical cache
        id: scalping-cache
        uses: actions/cache/restore@v4
        with:
          path: market-prediction-lab/scalping-history-cache
          key: prediction-lab-scalping-15m-${{ steps.sha.outputs.value }}

      - name: Collect and audit real public 15m scalping history
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/collect-scalping-history.js scalping-history-cache

      - name: Assert scalping provider fail-closed and no synthetic substitution
        working-directory: market-prediction-lab
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('scalping-history-cache/scalping-history-provider-audit.json', 'utf8'));
          if (audit.researchCodeSha !== process.env.RESEARCH_SHA) throw new Error('scalping audit SHA mismatch');
          if (audit.syntheticHistoricalDataAllowed !== false || audit.interpolationAllowed !== false) throw new Error('synthetic/interpolated scalping history forbidden');
          if (audit.privateApiAllowed !== false || audit.orderSubmitted !== false) throw new Error('scalping safety flags violated');
          if (!Array.isArray(audit.datasets) || audit.datasets.length !== 4) throw new Error('expected four scalping datasets');
          const allowed = new Set(['DATA_READY', 'BLOCKED_DATA', 'BLOCKED_PROVIDER_BOUNDARY']);
          for (const row of audit.datasets) {
            if (!allowed.has(row.status)) throw new Error(`invalid scalping dataset status: ${row.status}`);
            if (row.collectionCodeSHA !== process.env.RESEARCH_SHA) throw new Error('scalping collectionCodeSHA mismatch');
            if (row.status === 'DATA_READY') {
              if (!row.rawDigest || !row.normalizedDigest || !row.manifestDigest) throw new Error('DATA_READY scalping dataset missing digests');
              if (row.missingCandleCount !== 0 || row.duplicateCount !== 0 || row.outOfOrderCount !== 0) throw new Error('DATA_READY scalping dataset contains data-quality defects');
              if (!(row.actualCandleCount > 0 && row.actualFirstCandle && row.actualLastCandle)) throw new Error('DATA_READY scalping dataset lacks measured coverage');
            }
          }
          NODE

      - name: Save exact-code scalping historical cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: market-prediction-lab/scalping-history-cache
          key: ${{ steps.scalping-cache.outputs.cache-primary-key }}

      - name: Assert unified V2-V6 and calibration safety
        working-directory: market-prediction-lab
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const unified = JSON.parse(fs.readFileSync('artifacts/automated-research/unified-v2-v6.json', 'utf8'));
          const calibration = JSON.parse(fs.readFileSync('artifacts/automated-research/gate-calibration-candidates.json', 'utf8'));
          if (unified.researchCodeSha !== process.env.RESEARCH_SHA || calibration.researchCodeSha !== process.env.RESEARCH_SHA) throw new Error('unified artifact SHA mismatch');
          if (unified.finalHoldoutExecuted !== false || unified.finalHoldoutStatus !== 'LOCKED' || unified.finalHoldoutQueue.length !== 0) throw new Error('final holdout must remain locked and unqueued');
          if (unified.topStrategy !== 'NONE') throw new Error('TOP strategy must remain NONE before final holdout');
          if (unified.safety.liveOrderAllowed !== false || unified.safety.privateAccountRequestAllowed !== false || unified.safety.orderSubmitted !== false || unified.safety.productionMutationAllowed !== false) throw new Error('unified safety flags violated');
          if (calibration.finalHoldoutValuesIncluded !== false || calibration.syntheticDataIncluded !== false) throw new Error('calibration must exclude holdout/synthetic data');
          if (calibration.thresholdPolicy.profitFactorGate !== null || calibration.thresholdPolicy.maximumDrawdownGate !== null || calibration.thresholdPolicy.walkForwardStabilityGate !== null) throw new Error('arbitrary numeric gate introduced');
          if (calibration.rows.some((row) => row.oosTradeCount === 10 && row.sampleQuality !== 'uncalibrated_not_a_pass')) throw new Error('10 OOS trades cannot be an implicit pass');
          NODE

      - name: Save incrementally refreshed long-history cache
        uses: actions/cache/save@v4
        with:
          path: |
            market-prediction-lab/long-history-v1
            market-prediction-lab/docs/long-history-v1-result.json
            market-prediction-lab/docs/long-history-v1-result.md
          key: ${{ steps.history-cache.outputs.cache-primary-key }}

      - name: Build immutable provenance manifest
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
          CACHE_RESTORED_FROM: ${{ steps.history-cache.outputs.cache-matched-key }}
          CACHE_SAVED_AS: ${{ steps.history-cache.outputs.cache-primary-key }}
        run: |
          mkdir -p market-prediction-lab/docs
          cat > market-prediction-lab/docs/long-history-provenance.json <<JSON
          {"schemaVersion":2,"researchCodeSha":"$RESEARCH_SHA","runId":"$GITHUB_RUN_ID","cacheRestoredFrom":"$CACHE_RESTORED_FROM","cacheSavedAs":"$CACHE_SAVED_AS","branchWrite":false,"liveOrderAllowed":false,"privateAccountRequestAllowed":false,"orderSubmitted":false,"productionMutationAllowed":false,"finalHoldoutExecuted":false}
          JSON

      - name: Upload long-history research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-history-v1-v6-${{ github.run_id }}
          path: |
            market-prediction-lab/long-history-v1
            market-prediction-lab/scalping-history-cache
            market-prediction-lab/artifacts/automated-research/v1-long-history.json
            market-prediction-lab/artifacts/automated-research/scanner-backtest-quality-v1.json
            market-prediction-lab/artifacts/automated-research/unified-v2-v6.json
            market-prediction-lab/artifacts/automated-research/gate-calibration-candidates.json
            market-prediction-lab/docs/long-history-v1-result.json
            market-prediction-lab/docs/long-history-v1-result.md
            market-prediction-lab/docs/long-history-v3-result.json
            market-prediction-lab/docs/long-history-v3-result.md
            market-prediction-lab/docs/long-history-v4-result.json
            market-prediction-lab/docs/long-history-v4-result.md
            market-prediction-lab/docs/long-history-v5-result.json
            market-prediction-lab/docs/long-history-v5-result.md
            market-prediction-lab/docs/long-history-v6-result.json
            market-prediction-lab/docs/long-history-v6-result.md
            market-prediction-lab/docs/long-history-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Assert immutable checkout HEAD
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: test "$(git rev-parse HEAD)" = "$RESEARCH_SHA"
