name: Prediction Lab Shadow Gap Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prediction-lab-shadow-gap-diagnostics.yml
      - market-prediction-lab/src/shadow-feature-drift-diagnostics.js
      - market-prediction-lab/src/shadow-backtest-gap-diagnostics.js
      - market-prediction-lab/tests/shadow-feature-drift-diagnostics.test.js
      - market-prediction-lab/tests/shadow-backtest-gap-diagnostics.test.js
      - market-prediction-lab/scripts/run-shadow-feature-drift-diagnostics.js
      - market-prediction-lab/scripts/run-shadow-backtest-gap-diagnostics.js

permissions:
  actions: read
  contents: read

concurrency:
  group: prediction-lab-shadow-gap-diagnostics-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  shadow-gap-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve immutable diagnostic and canonical main SHAs
        id: resolve
        uses: actions/github-script@v7
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const diagnosticSha = process.env.PR_HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(diagnosticSha ?? '')) {
              core.setFailed('PR head did not resolve to an immutable SHA.');
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const canonicalMainSha = branch.data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(canonicalMainSha ?? '')) {
              core.setFailed('Canonical main did not resolve to an immutable SHA.');
              return;
            }
            core.setOutput('diagnostic_sha', diagnosticSha);
            core.setOutput('canonical_main_sha', canonicalMainSha);

      - name: Checkout exact diagnostic HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.diagnostic_sha }}
          persist-credentials: false

      - name: Checkout exact canonical main model source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.canonical_main_sha }}
          path: canonical-main
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check diagnostic entrypoints
        run: |
          node --check market-prediction-lab/src/shadow-feature-drift-diagnostics.js
          node --check market-prediction-lab/src/shadow-backtest-gap-diagnostics.js
          node --check market-prediction-lab/scripts/run-shadow-feature-drift-diagnostics.js
          node --check market-prediction-lab/scripts/run-shadow-backtest-gap-diagnostics.js

      - name: Run bounded Shadow diagnostic regressions
        run: node --test market-prediction-lab/tests/shadow-feature-drift-diagnostics.test.js market-prediction-lab/tests/shadow-backtest-gap-diagnostics.test.js

      - name: Locate latest successful immutable Shadow artifact
        id: shadow
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'prediction-lab-shadow-hourly.yml',
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.conclusion !== 'success' || run.head_branch !== 'main') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((item) => item.name === 'prediction-lab-shadow-state' && !item.expired);
              if (!artifact) continue;
              if (!/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? '')) {
                core.setFailed(`Shadow artifact ${artifact.id} has no immutable SHA-256 digest.`);
                return;
              }
              core.setOutput('run_id', String(run.id));
              core.setOutput('artifact_id', String(artifact.id));
              core.setOutput('artifact_digest', artifact.digest);
              core.info(`Pinned Shadow run ${run.id}, artifact ${artifact.id}, digest ${artifact.digest}.`);
              return;
            }
            core.setFailed('No non-expired successful prediction-lab-shadow-state artifact exists.');

      - name: Download pinned Shadow artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-shadow-state
          path: ${{ runner.temp }}/source-shadow
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.shadow.outputs.run_id }}

      - name: Verify inner Shadow evidence and resolve source SHA
        id: source
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/source-shadow
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const manifestPath = path.join(process.env.SOURCE_DIR, 'manifest.json');
          const statePath = path.join(process.env.SOURCE_DIR, 'shadow-state.json');
          if (!fs.existsSync(manifestPath) || !fs.existsSync(statePath)) throw new Error('Shadow manifest/state is missing.');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const stateDigest = crypto.createHash('sha256').update(fs.readFileSync(statePath)).digest('hex');
          if (manifest.kind !== 'prediction-lab-shadow-state' || manifest.stateSha256 !== stateDigest) throw new Error('Shadow inner artifact identity mismatch.');
          if (!/^[0-9a-f]{40}$/.test(manifest.researchCodeSha ?? '')) throw new Error('Shadow researchCodeSha is missing.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `shadow_research_code_sha=${manifest.researchCodeSha}\nstate_digest=${stateDigest}\n`);
          NODE

      - name: Generate read-only provenance-gated Shadow evidence
        env:
          DIAGNOSTIC_HEAD_SHA: ${{ steps.resolve.outputs.diagnostic_sha }}
          RESEARCH_CODE_SHA: ${{ steps.resolve.outputs.diagnostic_sha }}
          SHADOW_RESEARCH_CODE_SHA: ${{ steps.source.outputs.shadow_research_code_sha }}
          CANONICAL_MODEL_SOURCE_SHA: ${{ steps.resolve.outputs.canonical_main_sha }}
          SOURCE_SHADOW_RUN_ID: ${{ steps.shadow.outputs.run_id }}
          SOURCE_SHADOW_ARTIFACT_ID: ${{ steps.shadow.outputs.artifact_id }}
          SOURCE_SHADOW_ARTIFACT_DIGEST: ${{ steps.shadow.outputs.artifact_digest }}
        run: |
          node market-prediction-lab/scripts/run-shadow-feature-drift-diagnostics.js \
            "${{ runner.temp }}/source-shadow/shadow-state.json" \
            canonical-main/market-prediction-lab/docs/candidate-models \
            shadow-drift-evidence/diagnostic.json \
            shadow-drift-evidence/diagnostic.md

      - name: Assert current fail-closed evidence state and safety
        shell: bash
        env:
          DIAGNOSTIC_HEAD_SHA: ${{ steps.resolve.outputs.diagnostic_sha }}
          CANONICAL_MODEL_SOURCE_SHA: ${{ steps.resolve.outputs.canonical_main_sha }}
          SOURCE_SHADOW_RUN_ID: ${{ steps.shadow.outputs.run_id }}
          SOURCE_SHADOW_ARTIFACT_ID: ${{ steps.shadow.outputs.artifact_id }}
          SOURCE_SHADOW_ARTIFACT_DIGEST: ${{ steps.shadow.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('shadow-drift-evidence/diagnostic.json', 'utf8'));
          if (evidence.source.diagnosticHeadSha !== process.env.DIAGNOSTIC_HEAD_SHA) throw new Error('diagnostic HEAD mismatch');
          if (evidence.source.canonicalModelSourceSha !== process.env.CANONICAL_MODEL_SOURCE_SHA) throw new Error('canonical model source mismatch');
          if (evidence.source.shadowRunId !== process.env.SOURCE_SHADOW_RUN_ID
              || evidence.source.shadowArtifactId !== process.env.SOURCE_SHADOW_ARTIFACT_ID
              || evidence.source.shadowArtifactDigest !== process.env.SOURCE_SHADOW_ARTIFACT_DIGEST) throw new Error('Shadow artifact binding mismatch');
          if (!/^[0-9a-f]{64}$/.test(evidence.evidenceDigest ?? '')) throw new Error('generated evidence digest missing');
          if (evidence.DRIFT_EVIDENCE_VALID !== false || evidence.DRIFT_PROXY_ONLY !== true) throw new Error('current missing raw reference did not fail closed');
          for (const group of Object.values(evidence.groups ?? {})) {
            if (group.referenceEvidence.status !== 'MISSING_EVIDENCE') throw new Error('unexpected current raw reference evidence');
            for (const feature of Object.values(group.diagnostics.features ?? {})) {
              if (feature.psi !== null || feature.ksDistance !== null || feature.jsd !== null) throw new Error('true drift metric was fabricated');
            }
          }
          const safety = evidence.safety;
          if (safety.LIVE_TRADING !== false || safety.AUTO_TRADING !== false || safety.REAL_ORDER_ENABLED !== false
              || safety.PRIVATE_TRADING_API_ALLOWED !== false || safety.executionAuthority !== 'NONE' || safety.orderSubmitted !== false) throw new Error('safety invariant violated');
          NODE
          if rg -n 'feature/prediction-lab-standalone' \
            market-prediction-lab/src/shadow-feature-drift-diagnostics.js \
            market-prediction-lab/tests/shadow-feature-drift-diagnostics.test.js \
            market-prediction-lab/scripts/run-shadow-feature-drift-diagnostics.js \
            .github/workflows/prediction-lab-shadow-gap-diagnostics.yml; then
            echo 'Obsolete hard-coded Shadow branch detected.' >&2
            exit 1
          fi

      - name: Upload immutable diagnostic evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-shadow-feature-drift-${{ steps.resolve.outputs.diagnostic_sha }}
          path: shadow-drift-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Record immutable evidence receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          SOURCE_RUN_ID: ${{ steps.shadow.outputs.run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.shadow.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.shadow.outputs.artifact_digest }}
        run: |
          {
            echo '## Immutable Shadow drift evidence'
            echo "- Source run: $SOURCE_RUN_ID"
            echo "- Source artifact: $SOURCE_ARTIFACT_ID"
            echo "- Source digest: $SOURCE_ARTIFACT_DIGEST"
            echo "- Evidence artifact: $ARTIFACT_ID"
            echo "- Evidence digest: $ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          node <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('shadow-drift-evidence/diagnostic.json', 'utf8'));
          const format = (value) => Number.isFinite(value) ? value.toFixed(6) : 'N/A';
          const distribution = (value = {}) => `${value.LONG ?? 0}/${value.NEUTRAL ?? 0}/${value.SHORT ?? 0}`;
          const lines = [
            '',
            '### Directional quality receipt',
            '',
            `- Generated evidence digest: ${evidence.evidenceDigest}`,
            `- DRIFT_EVIDENCE_VALID / DRIFT_PROXY_ONLY: ${evidence.DRIFT_EVIDENCE_VALID} / ${evidence.DRIFT_PROXY_ONLY}`,
            '',
            '| Group | N | Model SHA | Provenance | Raw TRAIN/VALIDATION | Pred LONG/N/SHORT | Actual LONG/N/SHORT | Macro-F1 | Balanced Accuracy | Bear recall | PSI/KS/JSD |',
            '|---|---:|---|---|---:|---|---|---:|---:|---:|---|',
          ];
          for (const [name, group] of Object.entries(evidence.groups ?? {})) {
            const quality = group.diagnostics.directionalQuality;
            const probabilities = group.diagnostics.probabilities;
            const driftStates = [...new Set(Object.values(group.diagnostics.features ?? {}).map((feature) => feature.driftEvidenceStatus))].join(',');
            lines.push(`| ${name} | ${group.diagnostics.count} | ${group.modelSha} | ${group.referenceEvidence.status} | ${group.referenceEvidence.rawTrainSampleN}/${group.referenceEvidence.rawValidationSampleN} | ${distribution(probabilities.predictedDirectionalDistribution)} | ${distribution(probabilities.actualDirectionalDistribution)} | ${format(quality.macroF1)} | ${format(quality.balancedAccuracy)} | ${format(quality.bearRecall)} | ${driftStates} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Assert immutable checkout HEAD
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.diagnostic_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
