name: Scanner Paper Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/scanner-paper-bridge.yml
      - market-prediction-lab/src/meaningful-search-paper-bridge-v1.js
      - market-prediction-lab/tests/meaningful-search-paper-bridge-v1.test.js

permissions:
  contents: read

jobs:
  scanner-paper-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run scanner to Paper bridge tests
        run: node --test market-prediction-lab/tests/meaningful-search-paper-bridge-v1.test.js
