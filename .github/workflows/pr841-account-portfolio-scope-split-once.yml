name: PR841 Account Portfolio Scope Split Once

on:
  push:
    branches:
      - fix/runtime-financial-evidence-truth-20260830
    paths:
      - .github/workflows/pr841-account-portfolio-scope-split-once.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-financial-evidence-truth-20260830
          fetch-depth: 0
      - name: Relinquish only the Portfolio account-consumer hunk
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def dec(value: str) -> str:
              return base64.b64decode(value).decode('utf-8')

          path = Path('stock-analyzer/src/pages/portfolio.tsx')
          text = path.read_text(encoding='utf-8')
          before = text

          broker_import = "import { BrokerageAccountConnections } from '@/components/brokerage-account-connections';\n"
          wouter_import = "import { useLocation } from 'wouter';\n"
          query_import = "import { useQuery } from '@tanstack/react-query';\n"
          asset_import = "import { useAssetMode } from '@/lib/asset-mode';\n"
          api_import = "import { apiGet } from '@/lib/api';\n"
          currency_type = "type Currency = 'KRW' | 'USD';\n"
          anyobj_type = "type AnyObj = Record<string, any>;\n"
          asset_mode = "\tconst assetMode = useAssetMode();\n"
          queries = dec('')
          canonical = dec('')
          legacy_render = dec('CQkJKSA6IGFzc2V0TW9kZS5hc3NldCA9PT0gJ2NvaW4nID8gKAoJCQkJPENvaW5Bc3NldHNWaWV3CgkJCQkJbW9kZT17YXNzZXRNb2RlLmNvaW5NYXJrZXR9CgkJCQkJc3BvdD17Y29pblNwb3RBY2NvdW50c30KCQkJCQlmdXR1cmVzQWNjb3VudD17Y29pbkZ1dHVyZXNBY2NvdW50fQoJCQkJCWZ1dHVyZXNQb3NpdGlvbnM9e2NvaW5GdXR1cmVzUG9zaXRpb25zfQoJCQkJLz4KCQkJKSA6ICgK')
          helpers = dec('')

          if text.count(broker_import) != 1:
              raise SystemExit('expected exactly one BrokerageAccountConnections import')
          if text.count(wouter_import) != 1 or query_import in text:
              raise SystemExit('unexpected query import state')
          if text.count(asset_import) != 1 or api_import in text:
              raise SystemExit('unexpected apiGet import state')
          if text.count(currency_type) != 1 or anyobj_type in text:
              raise SystemExit('unexpected AnyObj state')
          if text.count(asset_mode) != 1:
              raise SystemExit('assetMode anchor missing')
          if text.count(canonical) != 1:
              raise SystemExit('canonical coin Portfolio render anchor mismatch')
          if 'function CoinAssetsView({' in text:
              raise SystemExit('legacy helper already present before split')
          for legacy in ('/crypto/spot/accounts', '/crypto/futures/account', '/crypto/futures/positions'):
              if legacy in text:
                  raise SystemExit(f'legacy path already present before split: {legacy}')

          text = text.replace(broker_import, '', 1)
          text = text.replace(wouter_import, wouter_import + query_import, 1)
          text = text.replace(asset_import, asset_import + api_import, 1)
          text = text.replace(currency_type, currency_type + anyobj_type, 1)
          text = text.replace(asset_mode, asset_mode + queries, 1)
          text = text.replace(canonical, legacy_render, 1)
          helper_anchor = '\nfunction LoadingCard({\n'
          if text.count(helper_anchor) != 1:
              raise SystemExit('LoadingCard anchor mismatch')
          text = text.replace(helper_anchor, '\n' + helpers + helper_anchor, 1)

          if text == before:
              raise SystemExit('no split changes produced')
          if 'BrokerageAccountConnections' in text or 'portfolio-coin-readonly' in text:
              raise SystemExit('canonical Portfolio consumer semantic still present')
          for legacy in ('/crypto/spot/accounts', '/crypto/futures/account', '/crypto/futures/positions'):
              if text.count(legacy) != 1:
                  raise SystemExit(f'legacy path count mismatch after split: {legacy}')
          for preserved in ('portfolioQuote', 'portfolioTotals', 'loadVersion', 'valuationTime', "from('portfolio_holdings')"):
              if preserved not in text:
                  raise SystemExit(f'preserved #841 scope missing: {preserved}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = "stock-analyzer/src/pages/portfolio.tsx"
          git config user.name 'ChatGPT Account Scope Split'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-analyzer/src/pages/portfolio.tsx
          git commit -m 'chore(account): relinquish portfolio canonical consumer hunk'
          git push origin HEAD:fix/runtime-financial-evidence-truth-20260830
