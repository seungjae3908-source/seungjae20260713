name: PR841 Account Portfolio Scope Split Once

on:
  push:
    branches:
      - fix/runtime-financial-evidence-truth-20260830
    paths:
      - .github/workflows/pr841-account-portfolio-scope-split-once.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-financial-evidence-truth-20260830
          fetch-depth: 0
      - name: Relinquish only the Portfolio account-consumer hunk
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('stock-analyzer/src/pages/portfolio.tsx')
          text = path.read_text(encoding='utf-8')
          before = text

          broker_import = "import { BrokerageAccountConnections } from '@/components/brokerage-account-connections';\n"
          if text.count(broker_import) != 1:
              raise SystemExit('expected exactly one BrokerageAccountConnections import')
          text = text.replace(broker_import, '', 1)

          wouter_import = "import { useLocation } from 'wouter';\n"
          query_import = "import { useQuery } from '@tanstack/react-query';\n"
          if text.count(wouter_import) != 1 or query_import in text:
              raise SystemExit('unexpected query import state')
          text = text.replace(wouter_import, wouter_import + query_import, 1)

          asset_import = "import { useAssetMode } from '@/lib/asset-mode';\n"
          api_import = "import { apiGet } from '@/lib/api';\n"
          if text.count(asset_import) != 1 or api_import in text:
              raise SystemExit('unexpected apiGet import state')
          text = text.replace(asset_import, asset_import + api_import, 1)

          currency_type = "type Currency = 'KRW' | 'USD';\n"
          anyobj_type = "type AnyObj = Record<string, any>;\n"
          if text.count(currency_type) != 1 or anyobj_type in text:
              raise SystemExit('unexpected AnyObj state')
          text = text.replace(currency_type, currency_type + anyobj_type, 1)

          asset_mode = "\tconst assetMode = useAssetMode();\n"
          queries = """\tconst coinSpotAccounts = useQuery({
\t\tqueryKey: ['assets-upbit-accounts'],
\t\tqueryFn: () => apiGet<AnyObj>('/crypto/spot/accounts'),
\t\tenabled: assetMode.asset === 'coin' && assetMode.coinMarket === 'spot',
\t\trefetchInterval: 30_000,
\t\tretry: false,
\t});
\tconst coinFuturesAccount = useQuery({
\t\tqueryKey: ['assets-bitget-account'],
\t\tqueryFn: () => apiGet<AnyObj>('/crypto/futures/account'),
\t\tenabled: assetMode.asset === 'coin' && assetMode.coinMarket === 'futures',
\t\trefetchInterval: 15_000,
\t\tretry: false,
\t});
\tconst coinFuturesPositions = useQuery({
\t\tqueryKey: ['assets-bitget-positions'],
\t\tqueryFn: () => apiGet<AnyObj>('/crypto/futures/positions'),
\t\tenabled: assetMode.asset === 'coin' && assetMode.coinMarket === 'futures',
\t\trefetchInterval: 10_000,
\t\tretry: false,
\t});
"""
          if text.count(asset_mode) != 1:
              raise SystemExit('assetMode anchor missing')
          for legacy in ('/crypto/spot/accounts', '/crypto/futures/account', '/crypto/futures/positions'):
              if legacy in text:
                  raise SystemExit(f'legacy path already present before split: {legacy}')
          text = text.replace(asset_mode, asset_mode + queries, 1)

          canonical = """\t\t\t) : assetMode.asset === 'coin' ? (
                <main className=\"min-w-0 px-4 pb-28 pt-4\" data-testid=\"portfolio-coin-readonly\">
                  <p className=\"text-xs text-muted-foreground\">회원별 Vault의 조회 전용 계좌 연결을 사용합니다. 공용 키를 사용하는 이전 계좌 API는 호출하지 않습니다.</p>
                  <BrokerageAccountConnections
                    canAccessSpot={assetMode.coinMarket === 'spot' && auth.can('canAccessSpot')}
                    canAccessFutures={assetMode.coinMarket === 'futures' && auth.can('canAccessFutures')}
                  />
                </main>
\t\t\t) : (
"""
          legacy_render = """\t\t\t) : assetMode.asset === 'coin' ? (
\t\t\t\t<CoinAssetsView
\t\t\t\t\tmode={assetMode.coinMarket}
\t\t\t\t\tspot={coinSpotAccounts}
\t\t\t\t\tfuturesAccount={coinFuturesAccount}
\t\t\t\t\tfuturesPositions={coinFuturesPositions}
\t\t\t\t/>
\t\t\t) : (
"""
          if text.count(canonical) != 1:
              raise SystemExit('canonical coin Portfolio render anchor mismatch')
          text = text.replace(canonical, legacy_render, 1)

          helper_anchor = "\nfunction LoadingCard({\n"
          if text.count(helper_anchor) != 1 or 'function CoinAssetsView({' in text:
              raise SystemExit('helper insertion state mismatch')
          helpers = r'''
function CoinAssetsView({
	mode,
	spot,
	futuresAccount,
	futuresPositions,
}: {
	mode: 'spot' | 'futures';
	spot: { data?: AnyObj; isLoading: boolean; isError: boolean; refetch: () => unknown };
	futuresAccount: { data?: AnyObj; isLoading: boolean; isError: boolean; refetch: () => unknown };
	futuresPositions: { data?: AnyObj; isLoading: boolean; isError: boolean; refetch: () => unknown };
}) {
	const rows = mode === 'spot'
		? ((spot.data?.accounts ?? []) as AnyObj[])
		: ((futuresPositions.data?.positions ?? []) as AnyObj[]);
	const accountRows = (futuresAccount.data?.accounts ?? []) as AnyObj[];
	const loading = mode === 'spot' ? spot.isLoading : futuresAccount.isLoading || futuresPositions.isLoading;
	const error = mode === 'spot' ? spot.isError : futuresAccount.isError || futuresPositions.isError;
	return (
		<main className="space-y-4 px-4 pb-28 pt-4">
			<section className="rounded-3xl border border-card-border bg-card p-4 shadow-sm">
				<div className="flex items-center justify-between gap-3">
					<div><h2 className="text-sm font-black">{mode === 'spot' ? '업비트 현물 자산' : '비트겟 선물 자산'}</h2><p className="mt-1 text-[10px] font-bold text-muted-foreground">개인 API 키는 서버 환경변수에서만 사용합니다.</p></div>
					<button type="button" onClick={() => { void (mode === 'spot' ? spot.refetch() : Promise.all([futuresAccount.refetch(), futuresPositions.refetch()])); }} className="flex h-9 w-9 items-center justify-center rounded-full border border-card-border"><RefreshCw className="h-4 w-4" /></button>
				</div>
				{loading && <p className="mt-3 rounded-2xl bg-muted p-4 text-center text-xs font-bold text-muted-foreground">실제 잔고를 불러오는 중입니다.</p>}
				{error && <p className="mt-3 rounded-2xl bg-destructive/10 p-4 text-center text-xs font-bold text-destructive">API 키 미설정, 읽기 권한 부족 또는 거래소 연결 오류입니다. 임시 잔고는 표시하지 않습니다.</p>}
				{mode === 'futures' && !loading && !error && (
					<div className="mt-3 grid grid-cols-2 gap-2">
						<HoldingValue label="계좌 평가금액" value={formatCoinNumber(accountRows[0]?.accountEquity, ' USDT')} />
						<HoldingValue label="사용가능" value={formatCoinNumber(accountRows[0]?.available, ' USDT')} />
						<HoldingValue label="미실현손익" value={formatCoinNumber(accountRows[0]?.unrealizedPL, ' USDT')} />
						<HoldingValue label="보유 포지션" value={`${rows.length}개`} />
					</div>
				)}
			</section>
			{!loading && !error && rows.length === 0 && <section className="rounded-3xl border border-card-border bg-card p-6 text-center text-sm font-bold text-muted-foreground">보유 자산 또는 포지션이 없습니다.</section>}
			<div className="space-y-3">
				{mode === 'spot' ? rows.map((row) => (
					<section key={String(row.currency)} className="rounded-3xl border border-card-border bg-card p-4 shadow-sm">
						<div className="flex items-center justify-between"><h3 className="text-base font-black">{row.currency}</h3><span className="text-[10px] font-bold text-muted-foreground">UPBIT</span></div>
						<div className="mt-3 grid grid-cols-2 gap-2"><HoldingValue label="보유수량" value={formatCoinNumber(row.balance)} /><HoldingValue label="주문 잠금" value={formatCoinNumber(row.locked)} /><HoldingValue label="평균매수가" value={formatCoinNumber(row.averageBuyPrice, ` ${row.unitCurrency ?? 'KRW'}`)} /><HoldingValue label="기준통화" value={String(row.unitCurrency ?? 'KRW')} /></div>
					</section>
				)) : rows.map((row) => (
					<section key={`${row.symbol}:${row.holdSide}`} className="rounded-3xl border border-card-border bg-card p-4 shadow-sm">
						<div className="flex items-center justify-between"><h3 className="text-base font-black">{row.symbol}</h3><span className={cn('rounded-full px-2 py-1 text-[10px] font-black', String(row.holdSide).toLowerCase() === 'long' ? 'bg-positive/10 text-positive' : 'bg-destructive/10 text-destructive')}>{String(row.holdSide).toUpperCase()}</span></div>
						<div className="mt-3 grid grid-cols-2 gap-2"><HoldingValue label="진입가" value={formatCoinNumber(row.openPriceAvg, ' USDT')} /><HoldingValue label="마크가격" value={formatCoinNumber(row.markPrice, ' USDT')} /><HoldingValue label="미실현손익" value={formatCoinNumber(row.unrealizedPL, ' USDT')} /><HoldingValue label="포지션 수량" value={formatCoinNumber(row.total)} /><HoldingValue label="레버리지" value={formatCoinNumber(row.leverage, '배')} /><HoldingValue label="청산가격" value={formatCoinNumber(row.liquidationPrice, ' USDT')} /></div>
					</section>
				))}
			</div>
		</main>
	);
}

function formatCoinNumber(value: unknown, suffix = '') {
	const number = Number(value);
	return Number.isFinite(number) ? `${number.toLocaleString(undefined, { maximumFractionDigits: 8 })}${suffix}` : '데이터 없음';
}
'''
          text = text.replace(helper_anchor, '\n' + helpers + helper_anchor, 1)

          if text == before:
              raise SystemExit('no split changes produced')
          if 'BrokerageAccountConnections' in text or 'portfolio-coin-readonly' in text:
              raise SystemExit('canonical Portfolio consumer semantic still present')
          for legacy in ('/crypto/spot/accounts', '/crypto/futures/account', '/crypto/futures/positions'):
              if text.count(legacy) != 1:
                  raise SystemExit(f'legacy path count mismatch after split: {legacy}')
          for preserved in ('portfolioQuote', 'portfolioTotals', 'loadVersion', 'valuationTime', "from('portfolio_holdings')"):
              if preserved not in text:
                  raise SystemExit(f'preserved #841 scope missing: {preserved}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = "stock-analyzer/src/pages/portfolio.tsx"
          git diff -- stock-analyzer/src/pages/portfolio.tsx

          git config user.name 'ChatGPT Account Scope Split'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-analyzer/src/pages/portfolio.tsx
          git commit -m 'chore(account): relinquish portfolio canonical consumer hunk'
          git push origin HEAD:fix/runtime-financial-evidence-truth-20260830
