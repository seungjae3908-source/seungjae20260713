name: Prediction Lab PR Head Unit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - market-prediction-lab/**
      - .github/scripts/pr-exact-head-contract.mjs
      - .github/tests/pr-exact-head-*.test.mjs
      - .github/workflows/futures-public-network-smoke.yml
      - .github/workflows/prediction-lab-52d-validation.yml
      - .github/workflows/prediction-lab-long-history-v1.yml
      - .github/workflows/prediction-lab-pr-head-unit.yml

permissions:
  contents: read

concurrency:
  group: prediction-lab-pr-head-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prediction-lab-pr-head-unit:
    name: PR Exact Research Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify expected SHA and detached HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=PR exact-head verification failed::[INVALID_SHA] expected an exact 40-character commit SHA"
            exit 1
          fi
          if [ -n "$actual_branch" ]; then
            echo "::error title=PR exact-head verification failed::[UNEXPECTED_BRANCH] checkout must be detached, found $actual_branch"
            exit 1
          fi
          if [ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "::error title=PR exact-head verification failed::[HEAD_SHA_MISMATCH] tested ${EXPECTED_SHA,,}, checked out ${actual_sha,,}"
            exit 1
          fi
          echo "tested_sha=${EXPECTED_SHA,,}"
          echo "head_sha=${actual_sha,,}"
          echo "checkout_mode=DETACHED"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PR exact-head workflow contract tests when present
        shell: bash
        run: |
          if [ -f .github/tests/pr-exact-head-contract.test.mjs ] && [ -f .github/tests/pr-exact-head-workflows.test.mjs ]; then
            node --test .github/tests/pr-exact-head-*.test.mjs
          else
            echo "::notice title=PR exact-head contract tests unavailable::The tested head predates the CI contract test files; Prediction Lab tests continue."
          fi

      - name: Run Prediction Lab unit suite on exact PR head
        working-directory: market-prediction-lab
        run: npm test

      - name: Verify test run did not mutate repository
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
