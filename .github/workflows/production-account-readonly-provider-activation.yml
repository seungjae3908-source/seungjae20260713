name: Production Account Read-only Provider Activation

on:
  pull_request:
    paths:
      - '.github/workflows/production-account-readonly-provider-activation.yml'
      - 'api-server/src/features/account-readonly/**'
      - 'api-server/src/services/trade-exchange-adapters.service.ts'
      - 'stock-analyzer/e2e/production-account-readonly-live-qa.spec.ts'
      - 'stock-analyzer/playwright.production-account-readonly.config.ts'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'issue_comment' && 'stock-app-production-live' || format('production-account-readonly-provider-activation-pr-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate read-only provider activation safety contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify fail-closed provider activation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          file='.github/workflows/production-account-readonly-provider-activation.yml'
          grep -Fq "stock-app-production-live" "$file"
          grep -Fq "environment: production" "$file"
          grep -Fq "TOSS_ACCOUNT_READ_ENABLED: 'true'" "$file"
          grep -Fq "KIWOOM_ACCOUNT_READ_ENABLED: 'true'" "$file"
          grep -Fq "UPBIT_ACCOUNT_READ_ENABLED: 'true'" "$file"
          grep -Fq "BITGET_ACCOUNT_READ_ENABLED: 'true'" "$file"
          grep -Fq "LIVE_TRADING: 'false'" "$file"
          grep -Fq "AUTO_TRADING: 'false'" "$file"
          grep -Fq "REAL_ORDER_ENABLED: 'false'" "$file"
          grep -Fq "PRIVATE_TRADING_API_ALLOWED: 'false'" "$file"
          grep -Fq "executionAuthority: 'NONE'" "$file"
          grep -Fq "pnpm exec playwright test --config=playwright.production-account-readonly.config.ts" "$file"
          grep -Fq "UPBIT_OPEN_ORDERS_UPBIT_PERMISSION_DENIED" "$file"
          grep -Fq "Rollback provider read flags after downstream failure" "$file"
          grep -Fq "key_value_exposed: false" "$file"
          adapter='api-server/src/services/trade-exchange-adapters.service.ts'
          runtime='api-server/src/features/account-readonly/account-readonly.runtime.ts'
          provider='api-server/src/features/account-readonly/providers/exchange-readonly.providers.ts'
          spec='stock-analyzer/e2e/production-account-readonly-live-qa.spec.ts'
          for endpoint in '/api/v3/account/info' '/api/v3/account/assets' '/api/v3/position/current-position' '/api/v3/trade/unfilled-orders'; do
            grep -Fq "$endpoint" "$adapter"
            grep -Fq "$endpoint" "$runtime"
          done
          grep -Fq "readBitgetUtaSnapshot" "$provider"
          grep -Fq "Persist bounded, sanitized provider state before any connectivity assertion" "$spec"
          if grep -Eq "bitgetRequest\([^,]+,[[:space:]]*'(POST|DELETE)'[[:space:]]*,[[:space:]]*'/api/v3/(account/info|account/assets|position/current-position|trade/unfilled-orders)'" "$adapter"; then
            echo 'Bitget UTA read-only endpoints must remain GET-only.' >&2
            exit 1
          fi
          grep -Fq "order_requests: 0" "$file"
          grep -Fq "withdrawal_requests: 0" "$file"

  activate-and-qa:
    name: Activate Production account read-only providers and run zero-mutation QA
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/activate-production-account-readonly-providers ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_BASE_URL: https://lsj119.com
      PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
      PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
      PRODUCTION_ACCOUNT_READONLY_LIVE_QA: "true"
      PRODUCTION_ACCOUNT_READONLY_ARTIFACT_DIR: production-account-readonly-artifacts
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/activate-production-account-readonly-providers ([0-9a-fA-F]{40}) ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Expected /activate-production-account-readonly-providers <active-production-sha> <exact-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_sha=${match[1].toLowerCase()}\ntarget_sha=${match[2].toLowerCase()}\n`);
          NODE

      - name: Require exact current main, latest Production deploy, and no deployment race
        uses: actions/github-script@v7
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        with:
          script: |
            const active = process.env.ACTIVE_SHA;
            const target = process.env.TARGET_SHA;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            });
            if (String(branch.data.commit.sha).toLowerCase() !== target) {
              core.setFailed('ACCOUNT_READ_ACTIVATION_MAIN_SHA_MISMATCH');
              return;
            }
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner, repo: context.repo.repo, base: active, head: target,
            });
            if (!['ahead', 'identical'].includes(compare.data.status)) {
              core.setFailed('ACCOUNT_READ_ACTIVATION_ACTIVE_SHA_NOT_IN_MAIN_HISTORY');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const latest = runs
              .filter((run) => run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latest || String(latest.head_sha).toLowerCase() !== active) {
              core.setFailed('ACCOUNT_READ_ACTIVATION_ACTIVE_SHA_NOT_LATEST_PRODUCTION');
              return;
            }
            const otherActive = runs.filter((run) => run.status !== 'completed');
            if (otherActive.length > 0) {
              core.setFailed('ACCOUNT_READ_ACTIVATION_PRODUCTION_DEPLOY_ACTIVE');
              return;
            }
            core.info('Production provenance and shared live concurrency gate accepted.');

      - name: Configure canonical Production SSH
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Activate four read-only providers with rollback
        id: activation
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/production-account-readonly-provider-activation.json"
          quoted_sha="$(printf '%q' "$ACTIVE_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "ACTIVE_SHA=$quoted_sha node -" > "$artifact" <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const activeSha = String(process.env.ACTIVE_SHA ?? '').trim().toLowerCase();
          const fail = (code) => { process.stderr.write(code + '\n'); process.exit(1); };
          if (!/^[0-9a-f]{40}$/.test(activeSha)) fail('ACCOUNT_READ_ACTIVATION_ACTIVE_SHA_INVALID');

          const marker = '/opt/stock-app/.deploy/current-sha';
          if (!fs.existsSync(marker) || fs.readFileSync(marker, 'utf8').trim().toLowerCase() !== activeSha) {
            fail('ACCOUNT_READ_ACTIVATION_MARKER_MISMATCH');
          }

          const readProcesses = () => JSON.parse(execFileSync('pm2', ['jlist'], {
            encoding: 'utf8', maxBuffer: 4 * 1024 * 1024,
          }));
          const selectApp = (rows) => {
            const matches = rows.filter((item) => item?.name === 'stock-app');
            if (matches.length !== 1 || !matches[0]?.pm2_env) fail('ACCOUNT_READ_ACTIVATION_PM2_AMBIGUOUS');
            return matches[0];
          };
          const bool = (env, name, fallback = false) => {
            const raw = env[name];
            if (raw === undefined || raw === null || String(raw).trim() === '') return fallback;
            const value = String(raw).trim().toLowerCase();
            if (value === 'true') return true;
            if (value === 'false') return false;
            fail('ACCOUNT_READ_ACTIVATION_FLAG_MALFORMED_' + name);
          };
          const canonicalKey = (raw) => {
            const value = String(raw ?? '').trim();
            if (!/^[A-Za-z0-9+/]{43}=$/.test(value)) return false;
            try {
              const decoded = Buffer.from(value, 'base64');
              return decoded.length === 32 && decoded.toString('base64') === value;
            } catch {
              return false;
            }
          };

          const before = selectApp(readProcesses());
          if (before.pm2_env.status !== 'online') fail('ACCOUNT_READ_ACTIVATION_PM2_NOT_ONLINE');
          if (String(before.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) {
            fail('ACCOUNT_READ_ACTIVATION_PM2_SHA_MISMATCH');
          }
          if (!canonicalKey(before.pm2_env.TRADING_CREDENTIAL_MASTER_KEY)) {
            fail('ACCOUNT_READ_ACTIVATION_MASTER_KEY_INVALID');
          }

          const safetyNames = [
            'LIVE_TRADING','AUTO_TRADING','REAL_ORDER_ENABLED','PRIVATE_TRADING_API_ALLOWED',
            'ORDER_EXECUTION_ENABLED','LIVE_TRADING_ACTIVATION_APPROVED','LIVE_AUTOMATIC_TRADING_ENABLED',
            'BITGET_LIVE_ORDER_ENABLED','UPBIT_LIVE_ORDER_ENABLED','KIWOOM_LIVE_ORDER_ENABLED','TOSS_LIVE_ORDER_ENABLED',
          ];
          for (const name of safetyNames) {
            if (bool(before.pm2_env, name, false)) fail('ACCOUNT_READ_ACTIVATION_PREEXISTING_AUTHORITY_' + name);
          }
          if (String(before.pm2_env.executionAuthority ?? 'NONE').toUpperCase() !== 'NONE') {
            fail('ACCOUNT_READ_ACTIVATION_PREEXISTING_EXECUTION_AUTHORITY');
          }

          const readNames = [
            'TOSS_ACCOUNT_READ_ENABLED',
            'KIWOOM_ACCOUNT_READ_ENABLED',
            'UPBIT_ACCOUNT_READ_ENABLED',
            'BITGET_ACCOUNT_READ_ENABLED',
          ];
          const previousRead = Object.fromEntries(readNames.map((name) => [name, bool(before.pm2_env, name, false)]));

          const preserved = {};
          for (const [name, raw] of Object.entries(before.pm2_env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) continue;
            if (name.startsWith('pm_') || name.startsWith('axm_')) continue;
            if (raw === null || raw === undefined || typeof raw === 'object') continue;
            preserved[name] = String(raw);
          }

          const safeTrading = {
            LIVE_TRADING: 'false',
            AUTO_TRADING: 'false',
            REAL_ORDER_ENABLED: 'false',
            PRIVATE_TRADING_API_ALLOWED: 'false',
            ORDER_EXECUTION_ENABLED: 'false',
            LIVE_TRADING_ACTIVATION_APPROVED: 'false',
            LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
            BITGET_LIVE_ORDER_ENABLED: 'false',
            UPBIT_LIVE_ORDER_ENABLED: 'false',
            KIWOOM_LIVE_ORDER_ENABLED: 'false',
            TOSS_LIVE_ORDER_ENABLED: 'false',
            executionAuthority: 'NONE',
            DEPLOY_SHA: activeSha,
          };
          const desiredRead = {
            TOSS_ACCOUNT_READ_ENABLED: 'true',
            KIWOOM_ACCOUNT_READ_ENABLED: 'true',
            UPBIT_ACCOUNT_READ_ENABLED: 'true',
            BITGET_ACCOUNT_READ_ENABLED: 'true',
          };

          const restart = (extra) => {
            execFileSync('pm2', ['restart', 'stock-app', '--update-env'], {
              env: { ...process.env, ...preserved, ...safeTrading, ...extra },
              stdio: ['ignore', 'pipe', 'pipe'],
              maxBuffer: 4 * 1024 * 1024,
            });
            execFileSync('pm2', ['save'], { stdio: ['ignore', 'pipe', 'pipe'] });
          };

          const verifyOnline = (expectRead) => {
            let app = null;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              app = selectApp(readProcesses());
              if (app.pm2_env.status === 'online'
                && String(app.pm2_env.DEPLOY_SHA ?? '').toLowerCase() === activeSha) break;
              execFileSync('sleep', ['1']);
            }
            if (!app || app.pm2_env.status !== 'online') throw new Error('ACCOUNT_READ_ACTIVATION_POST_PM2_OFFLINE');
            if (String(app.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) {
              throw new Error('ACCOUNT_READ_ACTIVATION_POST_SHA_MISMATCH');
            }
            if (!canonicalKey(app.pm2_env.TRADING_CREDENTIAL_MASTER_KEY)) {
              throw new Error('ACCOUNT_READ_ACTIVATION_POST_MASTER_KEY_INVALID');
            }
            for (const name of safetyNames) {
              if (bool(app.pm2_env, name, false)) throw new Error('ACCOUNT_READ_ACTIVATION_AUTHORITY_ON_' + name);
            }
            if (String(app.pm2_env.executionAuthority ?? 'NONE').toUpperCase() !== 'NONE') {
              throw new Error('ACCOUNT_READ_ACTIVATION_AUTHORITY_NOT_NONE');
            }
            for (const [name, expected] of Object.entries(expectRead)) {
              if (bool(app.pm2_env, name, false) !== expected) {
                throw new Error('ACCOUNT_READ_ACTIVATION_READ_FLAG_MISMATCH_' + name);
              }
            }
            return app;
          };

          const verifyHealth = () => {
            let health = null;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                health = JSON.parse(execFileSync('curl', [
                  '--fail','--silent','--show-error','--max-time','10','http://127.0.0.1:8080/api/health',
                ], { encoding: 'utf8' }));
                if (health?.ok === true
                  && String(health.deploySha ?? '').toLowerCase() === activeSha
                  && String(health.processDeploySha ?? '').toLowerCase() === activeSha
                  && String(health.deployMarkerSha ?? '').toLowerCase() === activeSha
                  && health.identityMatch === true
                  && health.identityStatus === 'match') return;
              } catch {}
              execFileSync('sleep', ['1']);
            }
            throw new Error('ACCOUNT_READ_ACTIVATION_HEALTH_INVALID');
          };

          try {
            restart(desiredRead);
            verifyOnline(Object.fromEntries(readNames.map((name) => [name, true])));
            verifyHealth();
          } catch (error) {
            const rollbackRead = Object.fromEntries(
              Object.entries(previousRead).map(([name, value]) => [name, value ? 'true' : 'false']),
            );
            try {
              restart(rollbackRead);
              verifyOnline(previousRead);
              verifyHealth();
            } catch {
              fail('ACCOUNT_READ_ACTIVATION_FAILED_AND_ROLLBACK_FAILED');
            }
            fail('ACCOUNT_READ_ACTIVATION_FAILED_ROLLED_BACK');
          }

          process.stdout.write(JSON.stringify({
            status: 'passed',
            active_production_sha: activeSha,
            provider_read_flags: {
              toss: true,
              kiwoom: true,
              upbit: true,
              bitget: true
            },
            previous_provider_read_flags: previousRead,
            master_key_valid: true,
            key_value_exposed: false,
            pm2_online: true,
            production_identity_match: true,
            live_trading: false,
            auto_trading: false,
            real_order_enabled: false,
            private_trading_api_allowed: false,
            execution_authority: 'NONE',
            order_requests: 0,
            cancel_requests: 0,
            amend_requests: 0,
            transfer_requests: 0,
            withdrawal_requests: 0
          }, null, 2) + '\n');
          NODE

          node - "$artifact" "$ACTIVE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, activeSha] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (value?.status !== 'passed'
            || value?.active_production_sha !== activeSha
            || value?.provider_read_flags?.toss !== true
            || value?.provider_read_flags?.kiwoom !== true
            || value?.provider_read_flags?.upbit !== true
            || value?.provider_read_flags?.bitget !== true
            || typeof value?.previous_provider_read_flags?.TOSS_ACCOUNT_READ_ENABLED !== 'boolean'
            || typeof value?.previous_provider_read_flags?.KIWOOM_ACCOUNT_READ_ENABLED !== 'boolean'
            || typeof value?.previous_provider_read_flags?.UPBIT_ACCOUNT_READ_ENABLED !== 'boolean'
            || typeof value?.previous_provider_read_flags?.BITGET_ACCOUNT_READ_ENABLED !== 'boolean'
            || value?.master_key_valid !== true
            || value?.key_value_exposed !== false
            || value?.pm2_online !== true
            || value?.production_identity_match !== true
            || value?.live_trading !== false
            || value?.auto_trading !== false
            || value?.real_order_enabled !== false
            || value?.private_trading_api_allowed !== false
            || value?.execution_authority !== 'NONE'
            || value?.order_requests !== 0
            || value?.cancel_requests !== 0
            || value?.amend_requests !== 0
            || value?.transfer_requests !== 0
            || value?.withdrawal_requests !== 0) process.exit(1);
          const serialized = JSON.stringify(value);
          if (/TRADING_CREDENTIAL_MASTER_KEY/.test(serialized) || /[A-Za-z0-9+/]{43}=/.test(serialized)) process.exit(1);
          NODE
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized provider activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-account-readonly-provider-activation-${{ steps.command.outputs.active_sha }}
          path: ${{ steps.activation.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Checkout exact deployed source for QA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.active_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay exact current-main Production QA assertions
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        run: |
          set -Eeuo pipefail
          source_path='stock-analyzer/e2e/production-account-readonly-live-qa.spec.ts'
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git show "$TARGET_SHA:$source_path" > "$RUNNER_TEMP/production-account-readonly-live-qa.spec.ts"
          grep -Fq "UPBIT_OPEN_ORDERS_UPBIT_PERMISSION_DENIED" "$RUNNER_TEMP/production-account-readonly-live-qa.spec.ts"
          grep -Fq "Persist bounded, sanitized provider state before any connectivity assertion" "$RUNNER_TEMP/production-account-readonly-live-qa.spec.ts"
          install -m 0644 "$RUNNER_TEMP/production-account-readonly-live-qa.spec.ts" "$source_path"

      - name: Require exact runtime identity after activation
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.command.outputs.active_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          curl --fail --silent --show-error --max-time 15 "$PRODUCTION_BASE_URL/api/health" -o /tmp/account-read-activation-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/account-read-activation-health.json', 'utf8'));
          const expected = String(process.env.EXPECTED_DEPLOY_SHA ?? '').toLowerCase();
          if (health?.ok !== true
            || String(health?.deploySha ?? '').toLowerCase() !== expected
            || String(health?.processDeploySha ?? '').toLowerCase() !== expected
            || String(health?.deployMarkerSha ?? '').toLowerCase() !== expected
            || health?.identityMatch !== true
            || health?.identityStatus !== 'match') {
            throw new Error('ACCOUNT_READ_ACTIVATION_PUBLIC_HEALTH_IDENTITY_MISMATCH');
          }
          NODE

      - name: Require Production QA login credential
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_QA_LOGIN" && -n "$PRODUCTION_QA_PASSWORD" ]] || {
            echo 'BLOCKED_BY_PRODUCTION_QA_CREDENTIAL' >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install isolated Chromium runtime
        working-directory: stock-analyzer
        run: pnpm exec playwright install chromium

      - name: Run authenticated zero-mutation real-account QA
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.command.outputs.active_sha }}
        working-directory: stock-analyzer
        run: pnpm exec playwright test --config=playwright.production-account-readonly.config.ts

      - name: Verify sanitized QA evidence
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.command.outputs.active_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="stock-analyzer/production-account-readonly-artifacts/production-account-readonly-live-qa.json"
          test -s "$evidence"
          node - "$evidence" "$EXPECTED_DEPLOY_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSha] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const providers = Array.isArray(value?.providers) ? value.providers : [];
          const requiredCrypto = ['upbit', 'bitget'];
          const stockProviders = ['toss', 'kiwoom'];
          const providerErrorAccepted = (provider, errorCode) => errorCode === null
            || (provider === 'upbit' && errorCode === 'UPBIT_OPEN_ORDERS_UPBIT_PERMISSION_DENIED');
          if (value?.schemaVersion !== 'production-account-readonly-live-qa-v1'
            || value?.targetSha !== expectedSha
            || value?.officialProductionOrigin !== true
            || value?.authenticatedProductionSession !== true
            || value?.credentialVaultEncryptionConfigured !== true
            || value?.secretValuesRecorded !== false
            || value?.accountValuesRecorded !== false
            || value?.orderRequests !== 0
            || value?.cancelRequests !== 0
            || value?.amendRequests !== 0
            || value?.transferRequests !== 0
            || value?.withdrawalRequests !== 0
            || value?.blockedMutationRequests !== 0
            || value?.observedAppMutationRequests !== 0
            || value?.liveTradingAuthorityGranted !== false
            || value?.autoTradingAuthorityGranted !== false) {
            throw new Error('ACCOUNT_READ_ACTIVATION_QA_EVIDENCE_CONTRACT_FAILED');
          }
          for (const provider of requiredCrypto) {
            const row = providers.find((item) => item?.provider === provider);
            if (!row || row.connected !== true || row.status !== 'CONNECTED'
              || row.stale !== false || !providerErrorAccepted(provider, row.errorCode)
              || row.checkedAtPresent !== true || row.lastGoodAtPresent !== true) {
              throw new Error('ACCOUNT_READ_ACTIVATION_QA_PROVIDER_FAILED_' + provider.toUpperCase());
            }
          }
          const connectedStock = providers.filter((item) =>
            stockProviders.includes(item?.provider)
            && item?.connected === true
            && item?.status === 'CONNECTED'
            && item?.stale === false
            && item?.errorCode === null
            && item?.checkedAtPresent === true
            && item?.lastGoodAtPresent === true);
          if (connectedStock.length < 1) throw new Error('ACCOUNT_READ_ACTIVATION_QA_STOCK_PROVIDER_NOT_CONNECTED');
          const serialized = JSON.stringify(value);
          if (/(clientSecret|secretKey|accessKey|apiKey|passphrase|accountRef|balances|positions|openOrders)/i.test(serialized)) {
            throw new Error('ACCOUNT_READ_ACTIVATION_QA_SECRET_OR_ACCOUNT_VALUE_LEAK');
          }
          NODE

      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-account-readonly-live-${{ steps.command.outputs.active_sha }}
          path: stock-analyzer/production-account-readonly-artifacts/production-account-readonly-live-qa.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record activation and QA result
        if: success()
        uses: actions/github-script@v7
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Production account read-only provider activation and zero-mutation QA completed.',
                '',
                '- Active Production SHA: ' + process.env.ACTIVE_SHA,
                '- Exact current main SHA: ' + process.env.TARGET_SHA,
                '- TOSS/KIWOOM/UPBIT/BITGET ACCOUNT_READ_ENABLED: true',
                '- PM2 stock-app online: true',
                '- Production identity match: true',
                '- LIVE/AUTO/REAL/Private API authority: false',
                '- executionAuthority: NONE',
                '- Orders/cancels/amends/transfers/withdrawals: 0/0/0/0/0',
                '- Real-account read-only QA: passed',
                '- Run ID: ' + context.runId,
                '- Source command comment ID: ' + process.env.SOURCE_COMMENT_ID,
              ].join('\n'),
            });

      - name: Rollback provider read flags after downstream failure
        id: rollback
        if: ${{ always() && steps.activation.outcome == 'success' && (failure() || cancelled()) }}
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          ACTIVATION_ARTIFACT: ${{ steps.activation.outputs.artifact }}
        run: |
          set -Eeuo pipefail
          test -s "$ACTIVATION_ARTIFACT"
          previous_read_json="$(node - "$ACTIVATION_ARTIFACT" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const previous = value?.previous_provider_read_flags;
          const names = [
            'TOSS_ACCOUNT_READ_ENABLED',
            'KIWOOM_ACCOUNT_READ_ENABLED',
            'UPBIT_ACCOUNT_READ_ENABLED',
            'BITGET_ACCOUNT_READ_ENABLED',
          ];
          if (!previous || names.some((name) => typeof previous[name] !== 'boolean')) process.exit(1);
          process.stdout.write(JSON.stringify(Object.fromEntries(names.map((name) => [name, previous[name]]))));
          NODE
          )"
          quoted_sha="$(printf '%q' "$ACTIVE_SHA")"
          quoted_previous="$(printf '%q' "$previous_read_json")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "ACTIVE_SHA=$quoted_sha PREVIOUS_READ_JSON=$quoted_previous node -" <<'NODE'
          const { execFileSync } = require('node:child_process');

          const activeSha = String(process.env.ACTIVE_SHA ?? '').trim().toLowerCase();
          const fail = (code) => { process.stderr.write(code + '\n'); process.exit(1); };
          if (!/^[0-9a-f]{40}$/.test(activeSha)) fail('ACCOUNT_READ_ROLLBACK_ACTIVE_SHA_INVALID');

          let previousRead;
          try {
            previousRead = JSON.parse(String(process.env.PREVIOUS_READ_JSON ?? ''));
          } catch {
            fail('ACCOUNT_READ_ROLLBACK_PREVIOUS_FLAGS_INVALID');
          }
          const readNames = [
            'TOSS_ACCOUNT_READ_ENABLED',
            'KIWOOM_ACCOUNT_READ_ENABLED',
            'UPBIT_ACCOUNT_READ_ENABLED',
            'BITGET_ACCOUNT_READ_ENABLED',
          ];
          if (!previousRead || readNames.some((name) => typeof previousRead[name] !== 'boolean')) {
            fail('ACCOUNT_READ_ROLLBACK_PREVIOUS_FLAGS_INVALID');
          }

          const readProcesses = () => JSON.parse(execFileSync('pm2', ['jlist'], {
            encoding: 'utf8', maxBuffer: 4 * 1024 * 1024,
          }));
          const selectApp = (rows) => {
            const matches = rows.filter((item) => item?.name === 'stock-app');
            if (matches.length !== 1 || !matches[0]?.pm2_env) fail('ACCOUNT_READ_ROLLBACK_PM2_AMBIGUOUS');
            return matches[0];
          };
          const bool = (env, name, fallback = false) => {
            const raw = env[name];
            if (raw === undefined || raw === null || String(raw).trim() === '') return fallback;
            const value = String(raw).trim().toLowerCase();
            if (value === 'true') return true;
            if (value === 'false') return false;
            fail('ACCOUNT_READ_ROLLBACK_FLAG_MALFORMED_' + name);
          };
          const safetyNames = [
            'LIVE_TRADING','AUTO_TRADING','REAL_ORDER_ENABLED','PRIVATE_TRADING_API_ALLOWED',
            'ORDER_EXECUTION_ENABLED','LIVE_TRADING_ACTIVATION_APPROVED','LIVE_AUTOMATIC_TRADING_ENABLED',
            'BITGET_LIVE_ORDER_ENABLED','UPBIT_LIVE_ORDER_ENABLED','KIWOOM_LIVE_ORDER_ENABLED','TOSS_LIVE_ORDER_ENABLED',
          ];

          const before = selectApp(readProcesses());
          if (before.pm2_env.status !== 'online') fail('ACCOUNT_READ_ROLLBACK_PM2_NOT_ONLINE');
          if (String(before.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) fail('ACCOUNT_READ_ROLLBACK_SHA_MISMATCH');
          for (const name of safetyNames) {
            if (bool(before.pm2_env, name, false)) fail('ACCOUNT_READ_ROLLBACK_PREEXISTING_AUTHORITY_' + name);
          }
          if (String(before.pm2_env.executionAuthority ?? 'NONE').toUpperCase() !== 'NONE') {
            fail('ACCOUNT_READ_ROLLBACK_PREEXISTING_EXECUTION_AUTHORITY');
          }

          const preserved = {};
          for (const [name, raw] of Object.entries(before.pm2_env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) continue;
            if (name.startsWith('pm_') || name.startsWith('axm_')) continue;
            if (raw === null || raw === undefined || typeof raw === 'object') continue;
            preserved[name] = String(raw);
          }
          const safeTrading = {
            LIVE_TRADING: 'false',
            AUTO_TRADING: 'false',
            REAL_ORDER_ENABLED: 'false',
            PRIVATE_TRADING_API_ALLOWED: 'false',
            ORDER_EXECUTION_ENABLED: 'false',
            LIVE_TRADING_ACTIVATION_APPROVED: 'false',
            LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
            BITGET_LIVE_ORDER_ENABLED: 'false',
            UPBIT_LIVE_ORDER_ENABLED: 'false',
            KIWOOM_LIVE_ORDER_ENABLED: 'false',
            TOSS_LIVE_ORDER_ENABLED: 'false',
            executionAuthority: 'NONE',
            DEPLOY_SHA: activeSha,
          };
          const rollbackRead = Object.fromEntries(
            readNames.map((name) => [name, previousRead[name] ? 'true' : 'false']),
          );

          execFileSync('pm2', ['restart', 'stock-app', '--update-env'], {
            env: { ...process.env, ...preserved, ...safeTrading, ...rollbackRead },
            stdio: ['ignore', 'pipe', 'pipe'],
            maxBuffer: 4 * 1024 * 1024,
          });
          execFileSync('pm2', ['save'], { stdio: ['ignore', 'pipe', 'pipe'] });

          let after = null;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            after = selectApp(readProcesses());
            if (after.pm2_env.status === 'online'
              && String(after.pm2_env.DEPLOY_SHA ?? '').toLowerCase() === activeSha) break;
            execFileSync('sleep', ['1']);
          }
          if (!after || after.pm2_env.status !== 'online') fail('ACCOUNT_READ_ROLLBACK_POST_PM2_OFFLINE');
          if (String(after.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) fail('ACCOUNT_READ_ROLLBACK_POST_SHA_MISMATCH');
          for (const name of safetyNames) {
            if (bool(after.pm2_env, name, false)) fail('ACCOUNT_READ_ROLLBACK_AUTHORITY_ON_' + name);
          }
          if (String(after.pm2_env.executionAuthority ?? 'NONE').toUpperCase() !== 'NONE') {
            fail('ACCOUNT_READ_ROLLBACK_AUTHORITY_NOT_NONE');
          }
          for (const name of readNames) {
            if (bool(after.pm2_env, name, false) !== previousRead[name]) {
              fail('ACCOUNT_READ_ROLLBACK_READ_FLAG_MISMATCH_' + name);
            }
          }

          let health = null;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            try {
              health = JSON.parse(execFileSync('curl', [
                '--fail','--silent','--show-error','--max-time','10','http://127.0.0.1:8080/api/health',
              ], { encoding: 'utf8' }));
              if (health?.ok === true
                && String(health.deploySha ?? '').toLowerCase() === activeSha
                && String(health.processDeploySha ?? '').toLowerCase() === activeSha
                && String(health.deployMarkerSha ?? '').toLowerCase() === activeSha
                && health.identityMatch === true
                && health.identityStatus === 'match') break;
            } catch {}
            execFileSync('sleep', ['1']);
          }
          if (!health || health?.ok !== true || health?.identityMatch !== true || health?.identityStatus !== 'match') {
            fail('ACCOUNT_READ_ROLLBACK_HEALTH_INVALID');
          }
          process.stdout.write(JSON.stringify({
            status: 'rolled_back',
            active_production_sha: activeSha,
            live_trading: false,
            auto_trading: false,
            real_order_enabled: false,
            private_trading_api_allowed: false,
            execution_authority: 'NONE',
            order_requests: 0,
            cancel_requests: 0,
            amend_requests: 0,
            transfer_requests: 0,
            withdrawal_requests: 0,
          }) + '\n');
          NODE

      - name: Write safety summary
        if: always()
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
        run: |
          {
            echo '## Production Account Read-only Provider Activation'
            echo
            echo "- Active Production SHA: $ACTIVE_SHA"
            echo '- TOSS/KIWOOM/UPBIT/BITGET ACCOUNT_READ_ENABLED requested: true'
            echo '- LIVE/AUTO/REAL/Private API authority requested: false'
            echo '- executionAuthority: NONE'
            echo '- Orders/cancels/amends/transfers/withdrawals authorized: 0'
            echo '- Provider secrets printed: false'
            echo "- Downstream-failure rollback step: ${{ steps.rollback.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
