name: Research Full-Universe 3pct Hunter Causal V2

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-v2.py
      - market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v2.py
      - .github/workflows/research-full-universe-3pct-hunter-causal-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-full-universe-3pct-hunter-causal-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        market: [US_STOCK, KR_STOCK, CRYPTO_SPOT, CRYPTO_FUTURES]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check V2
        run: |
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-v2.py
          python -m py_compile market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "huggingface_hub>=0.30,<1" "duckdb>=1.3,<2" "finance-datareader>=0.9.90" "requests>=2.32,<3"
      - name: Run V2 causal candidate search
        run: |
          python market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-v2.py \
            --market ${{ matrix.market }} \
            --out-dir market-prediction-lab/docs/full-universe-3pct-hunter-causal-v2/${{ matrix.market }}
      - name: Upload V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-causal-v2-${{ matrix.market }}-${{ github.sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-causal-v2/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check combiner
        run: python -m py_compile market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v2.py
      - name: Download V2 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: full-universe-3pct-hunter-causal-v2-*
          path: v2-artifacts
      - name: Combine V2 results
        run: |
          python market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v2.py \
            --input-root v2-artifacts \
            --output-dir market-prediction-lab/docs/full-universe-3pct-hunter-causal-v2-combined
      - name: Upload V2 combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-causal-v2-combined-${{ github.sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-causal-v2-combined
          if-no-files-found: error
          retention-days: 14
