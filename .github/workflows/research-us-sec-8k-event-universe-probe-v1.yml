name: Research US SEC 8-K Event Universe Probe V1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-us-sec-8k-event-universe-v1.py
      - .github/workflows/research-us-sec-8k-event-universe-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-us-sec-8k-event-universe-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/probe-us-sec-8k-event-universe-v1.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.3.3" "requests==2.34.2" "duckdb==1.5.6"
      - name: Probe SEC 8-K event universe
        run: |
          python market-prediction-lab/scripts/probe-us-sec-8k-event-universe-v1.py \
            --out-dir market-prediction-lab/docs/us-sec-8k-event-universe-probe-v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-sec-8k-event-universe-probe-v1-${{ github.sha }}
          path: market-prediction-lab/docs/us-sec-8k-event-universe-probe-v1
          if-no-files-found: error
          retention-days: 14
