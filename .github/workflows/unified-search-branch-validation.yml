name: Unified Search Branch Validation

on:
  push:
    branches:
      - feature/unified-asset-search
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: unified-search-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout unified search branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-asset-search
          fetch-depth: 0

      - name: Confirm isolated branch and baseline
        id: isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "feature/unified-asset-search"
          git merge-base --is-ancestor aab202273498af5d2db13f4328a9ebe9287f9a1c HEAD
          git diff --check aab202273498af5d2db13f4328a9ebe9287f9a1c...HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        id: frontend_typecheck
        run: pnpm --dir stock-analyzer run typecheck

      - name: Typecheck backend
        id: backend_typecheck
        run: pnpm --dir api-server run typecheck

      - name: Run unified search unit and API tests
        id: search_tests
        run: pnpm --dir api-server run test:search

      - name: Run backend regression tests
        id: backend_regression
        run: pnpm --dir api-server run test

      - name: Build frontend and backend
        id: production_build
        run: |
          pnpm --dir stock-analyzer run build
          pnpm --dir api-server run build

      - name: Install Chromium
        id: chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium

      - name: Run unified search browser regression
        id: search_browser
        run: pnpm --dir stock-analyzer exec playwright test e2e/unified-asset-search.spec.ts --reporter=line

      - name: Run full browser regression
        id: full_browser
        run: pnpm --dir stock-analyzer run test:e2e

      - name: Confirm no deployment files changed
        id: safety
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only aab202273498af5d2db13f4328a9ebe9287f9a1c...HEAD)"
          if grep -Eq '^(ops/|supabase/|.*migration|\.github/workflows/(production|staging)-)' <<<"$changed"; then
            echo 'Unified search branch changed a prohibited deployment, Supabase, or migration path.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Record validation result on Draft PR
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ISOLATION: ${{ steps.isolation.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FRONTEND_TYPECHECK: ${{ steps.frontend_typecheck.outcome }}
          BACKEND_TYPECHECK: ${{ steps.backend_typecheck.outcome }}
          SEARCH_TESTS: ${{ steps.search_tests.outcome }}
          BACKEND_REGRESSION: ${{ steps.backend_regression.outcome }}
          PRODUCTION_BUILD: ${{ steps.production_build.outcome }}
          SEARCH_BROWSER: ${{ steps.search_browser.outcome }}
          FULL_BROWSER: ${{ steps.full_browser.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
        with:
          script: |
            const lines = [
              `Unified Search Branch Validation: **${process.env.JOB_STATUS}**`,
              '',
              `- Head SHA: \`${context.sha}\``,
              `- Run ID: \`${context.runId}\``,
              `- Isolated branch/baseline: \`${process.env.ISOLATION}\``,
              `- Dependency install: \`${process.env.INSTALL}\``,
              `- Frontend typecheck: \`${process.env.FRONTEND_TYPECHECK}\``,
              `- Backend typecheck: \`${process.env.BACKEND_TYPECHECK}\``,
              `- Unified search tests: \`${process.env.SEARCH_TESTS}\``,
              `- Backend regression: \`${process.env.BACKEND_REGRESSION}\``,
              `- Production build: \`${process.env.PRODUCTION_BUILD}\``,
              `- Unified search Playwright: \`${process.env.SEARCH_BROWSER}\``,
              `- Full Playwright: \`${process.env.FULL_BROWSER}\``,
              `- Deployment/Supabase/migration safety: \`${process.env.SAFETY}\``,
              '- Deployment executed: `false`',
              '- Supabase or Secret changed: `false`',
              '- Actual order executed: `false`',
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 58,
              body: lines.join('\n'),
            });
