name: Paper Forward Production Read-only Diagnostic Report

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/paper-forward-production-readonly-diagnostic-report.yml

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: paper-forward-production-readonly-diagnostic-report-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  report:
    name: Locate and report the one-time Production Paper diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DIAGNOSTIC_HEAD_SHA: 8e3fe66635f9ee61a837f412f39f17148d034f9a
      DIAGNOSTIC_WORKFLOW: paper-forward-production-readonly-diagnostic.yml
      DIAGNOSTIC_BRANCH: agent/paper-forward-readonly-diagnostic-v1
    steps:
      - name: Locate exact diagnostic run and wait only for active non-approval execution
        id: locate
        uses: actions/github-script@v7
        with:
          script: |
            const expectedSha = process.env.DIAGNOSTIC_HEAD_SHA;
            const workflowId = process.env.DIAGNOSTIC_WORKFLOW;
            const branch = process.env.DIAGNOSTIC_BRANCH;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let match = null;
            for (let attempt = 0; attempt < 19; attempt += 1) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                branch,
                event: 'push',
                per_page: 100,
              });
              match = runs
                .filter((run) => String(run.head_sha).toLowerCase() === expectedSha)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0] ?? null;
              if (match && (match.status === 'completed' || match.status === 'waiting' || match.status === 'pending')) break;
              if (match?.status === 'in_progress' || match?.status === 'queued' || !match) {
                await sleep(10_000);
                continue;
              }
              break;
            }
            if (!match) {
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('run_id', String(match.id));
            core.setOutput('status', match.status);
            core.setOutput('conclusion', match.conclusion ?? 'pending');
            core.setOutput('run_url', match.html_url);
            core.setOutput('success', String(match.status === 'completed' && match.conclusion === 'success'));

      - name: Download exact sanitized diagnostic artifact
        if: steps.locate.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: paper-forward-production-readonly-${{ env.DIAGNOSTIC_HEAD_SHA }}
          path: paper-forward-production-readonly-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.locate.outputs.run_id }}

      - name: Report exact Production read-only diagnostic status to Central Hub
        if: always()
        uses: actions/github-script@v7
        env:
          FOUND: ${{ steps.locate.outputs.found }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_STATUS: ${{ steps.locate.outputs.status }}
          RUN_CONCLUSION: ${{ steps.locate.outputs.conclusion }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          RUN_SUCCESS: ${{ steps.locate.outputs.success }}
        with:
          script: |
            const fs = require('node:fs');
            const lines = [
              '[WORKER_REPORT][PAPER_FORWARD_PRODUCTION_READONLY_DIAGNOSTIC_EXECUTION]',
              `diagnostic_head_sha: ${process.env.DIAGNOSTIC_HEAD_SHA}`,
              `workflow: ${process.env.DIAGNOSTIC_WORKFLOW}`,
            ];
            if (process.env.FOUND !== 'true') {
              lines.push(
                'status: RUN_NOT_FOUND',
                'server_read_executed: UNKNOWN',
                'production_mutation: 0',
                'schedule_mutation: 0',
                'private_api: 0',
                'real_order: 0',
              );
            } else {
              lines.push(
                `run_id: ${process.env.RUN_ID}`,
                `run_status: ${process.env.RUN_STATUS}`,
                `run_conclusion: ${process.env.RUN_CONCLUSION}`,
                `run_url: ${process.env.RUN_URL}`,
              );
              if (process.env.RUN_SUCCESS === 'true') {
                const path = 'paper-forward-production-readonly-evidence/paper-forward-production-readonly-diagnostic.json';
                const value = JSON.parse(fs.readFileSync(path, 'utf8'));
                lines.push(
                  'status: COMPLETED_READONLY',
                  `schedule_verdict: ${value.schedule?.verdict ?? 'UNKNOWN'}`,
                  `managed_cron_count: ${value.schedule?.managedCronCount ?? 'UNKNOWN'}`,
                  `activation_status: ${value.activation?.status ?? 'UNKNOWN'}`,
                  `activation_target_sha: ${value.activation?.targetSha ?? 'UNKNOWN'}`,
                  `seed_eligibility: ${value.publisher?.seedEligibility ?? 'UNKNOWN'}`,
                  `seed_blockers: ${JSON.stringify(value.publisher?.seedBlockers ?? [])}`,
                  `snapshot_flat_seed: ${value.publisher?.snapshot?.flatSeed ?? 'UNKNOWN'}`,
                  `snapshot_open_position_count: ${value.publisher?.snapshot?.openPositionCount ?? 'UNKNOWN'}`,
                  `snapshot_pending_order_count: ${value.publisher?.snapshot?.pendingOrderCount ?? 'UNKNOWN'}`,
                  `natural_cycle_verdict: ${value.naturalCycle?.verdict ?? 'UNKNOWN'}`,
                  `cycle_count: ${value.stateCounts?.cycleCount ?? 'UNKNOWN'}`,
                  `position_count: ${value.stateCounts?.positionCount ?? 'UNKNOWN'}`,
                  `settlement_count: ${value.stateCounts?.settlementCount ?? 'UNKNOWN'}`,
                  `FIRST_ZERO_STAGE: ${value.firstZero?.stage ?? 'UNKNOWN'}`,
                  `FIRST_ZERO_REASON: ${value.firstZero?.reason ?? 'UNKNOWN'}`,
                  `private_request_count: ${value.safety?.privateRequestCount ?? 'UNKNOWN'}`,
                  `financial_mutation_count: ${value.safety?.financialMutationCount ?? 'UNKNOWN'}`,
                  `order_count: ${value.safety?.orderCount ?? 'UNKNOWN'}`,
                  `live_trading: ${value.safety?.liveTrading ?? 'UNKNOWN'}`,
                  `order_authority: ${value.safety?.orderAuthority ?? 'UNKNOWN'}`,
                  `warnings: ${JSON.stringify(value.warnings ?? [])}`,
                  'sensitive_values_emitted: false',
                );
              } else {
                const runId = Number(process.env.RUN_ID);
                const jobs = Number.isSafeInteger(runId)
                  ? await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: runId,
                      per_page: 100,
                    })
                  : [];
                lines.push(
                  process.env.RUN_STATUS === 'waiting' || process.env.RUN_STATUS === 'pending'
                    ? 'status: WAITING_PROTECTED_PRODUCTION_ENVIRONMENT'
                    : process.env.RUN_STATUS === 'completed'
                      ? 'status: COMPLETED_WITHOUT_SUCCESS'
                      : 'status: ACTIVE',
                  `job_states: ${JSON.stringify(jobs.map((job) => ({ name: job.name, status: job.status, conclusion: job.conclusion ?? null })))}`,
                );
              }
              lines.push(
                'production_deployment: 0',
                'server_file_mutation: 0',
                'schedule_mutation: 0',
                'database_mutation: 0',
                'private_api: 0',
                'real_order: 0',
                'ready_merge: 0',
              );
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body: lines.join('\n'),
            });
