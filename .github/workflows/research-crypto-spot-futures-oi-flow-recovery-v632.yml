name: Research Crypto Spot Futures-OI Flow Recovery V6.3.2

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-spot-futures-oi-flow-recovery-v632.py
      - .github/workflows/research-crypto-spot-futures-oi-flow-recovery-v632.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-spot-futures-oi-flow-recovery-v632-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: "37471171237"
      SOURCE_ARTIFACT: "crypto-spot-causal-targetfirst-ai-v61-repair-bc6fdb17208d1f789959e126ebae095df3d7c4c4"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-crypto-spot-futures-oi-flow-recovery-v632.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-futures-oi-v4.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.3.3" "numpy==2.5.3" "pyarrow==21.0.0" "polars==1.44.2" "requests==2.34.2" "duckdb==1.5.6" "huggingface_hub==0.36.2" "lightgbm==4.5.0" "scikit-learn==1.5.2"

      - name: Download frozen causal spot V6.1 evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-v61

      - name: Run causal futures-OI flow-recovery audit
        run: |
          EVENTS="$(find source-v61 -name causal-long-events.parquet -print -quit)"
          test -n "$EVENTS"
          python market-prediction-lab/scripts/run-crypto-spot-futures-oi-flow-recovery-v632.py             --events "$EVENTS"             --out-dir market-prediction-lab/docs/crypto-spot-futures-oi-flow-recovery-v632

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-spot-futures-oi-flow-recovery-v632-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-spot-futures-oi-flow-recovery-v632
          if-no-files-found: error
          retention-days: 14
