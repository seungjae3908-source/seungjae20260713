name: Frozen VOL EXP Flow OOS V1

on:
  push:
    branches:
      - research/pit-us-orderflow-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-vol-exp-flow-frozen-oos-v1.py
      - .github/workflows/vol-exp-flow-frozen-oos-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-vol-exp-flow-frozen-oos-v1.py

      - name: Run frozen OOS validation
        run: python market-prediction-lab/scripts/run-vol-exp-flow-frozen-oos-v1.py

      - name: Verify frozen and safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-prediction-lab/artifacts/vol-exp-flow-frozen-oos-v1/result.json").read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert d["leverage"] == 1
          assert d["frozen_before_oos"] is True
          assert d["source_design_period"] == "2025-01..2026-07"
          assert d["frozen_formula"]["flow_max"] == -0.05
          assert set(d["windows"]) == {"BACKWARD_OOS_2024","FUTURE_OOS_2026_08"}
          assert all(
            v["funding_status"]=="BINANCE_VISION_OK"
            for w in d["provenance"].values()
            for v in w.values()
          )
          print("FROZEN_OOS_CONTRACT=PASS")
          PY

      - name: Publish summary
        run: cat market-prediction-lab/artifacts/vol-exp-flow-frozen-oos-v1/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vol-exp-flow-frozen-oos-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/vol-exp-flow-frozen-oos-v1/
          if-no-files-found: error
          retention-days: 30
