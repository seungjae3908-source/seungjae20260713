name: Prediction Lab Scalping Families

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Exact immutable research commit SHA
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prediction-lab-scalping-families.yml
      - market-prediction-lab/src/scalping-family-research.js
      - market-prediction-lab/scripts/run-scalping-family-research.js
      - market-prediction-lab/scripts/aggregate-scalping-family-shards.js
      - market-prediction-lab/scripts/audit-binance-funding-timestamp.js
      - market-prediction-lab/tests/scalping-family-research.test.js
      - market-prediction-lab/src/scalping-v1-research.js
      - market-prediction-lab/src/binance-scalping-selection-provider.js
      - market-prediction-lab/src/binance-vision-futures-archive.js
      - market-prediction-lab/src/v3-market-filter-optimizer.js
      - market-prediction-lab/src/v4-momentum-regime-optimizer.js
      - market-prediction-lab/src/v5-price-structure-optimizer.js
      - market-prediction-lab/src/v6-independent-breakout-retest-optimizer.js
      - market-prediction-lab/src/unified-candidate-evaluator.js

permissions:
  contents: read

concurrency:
  group: prediction-lab-scalping-families-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare-scalping-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      research_sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Resolve immutable research SHA
        id: sha
        shell: bash
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_REF: ${{ inputs.research_ref }}
        run: |
          set -euo pipefail
          ref="$PR_SHA"
          if [ -z "$ref" ]; then ref="$INPUT_REF"; fi
          if [ -z "$ref" ]; then ref="$GITHUB_SHA"; fi
          if ! [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "research_ref must resolve to immutable SHA" >&2
            exit 1
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact research SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ steps.sha.outputs.value }}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scalping family contract tests
        working-directory: market-prediction-lab
        run: node --test tests/scalping-family-research.test.js tests/scalping-v1-research.test.js tests/binance-scalping-selection-provider.test.js tests/binance-scalping-archive-provider.test.js tests/automated-v1-research.test.js tests/automated-v1-overfit.test.js tests/unified-candidate-evaluator.test.js

      - name: Collect exact-code public Bitget 15m history
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/collect-scalping-history.js scalping-history-cache

      - name: Collect exact-code Binance USD-M Selection archives
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/collect-binance-scalping-history.js binance-scalping-cache

      - name: Audit Binance funding source timestamp provenance
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ steps.sha.outputs.value }}
        run: node scripts/audit-binance-funding-timestamp.js artifacts/automated-research/binance-funding-timestamp-audit.json

      - name: Upload immutable prepared research data
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-scalping-prepared-${{ steps.sha.outputs.value }}-${{ github.run_id }}
          path: |
            market-prediction-lab/scalping-history-cache
            market-prediction-lab/binance-scalping-cache
            market-prediction-lab/artifacts/automated-research/binance-funding-timestamp-audit.json
          if-no-files-found: error
          retention-days: 1

      - name: Assert immutable checkout HEAD
        if: always()
        run: test "$(git rev-parse HEAD)" = "${{ steps.sha.outputs.value }}"

  scalping-family-shards:
    needs: prepare-scalping-data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - spot-btc-long
          - spot-eth-long
          - futures-btc-long
          - futures-eth-long
          - futures-btc-short
          - futures-eth-short
        family:
          - V2
          - V3
          - V4
          - V5
          - V6
    steps:
      - name: Checkout exact research SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-scalping-data.outputs.research_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-scalping-data.outputs.research_sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download immutable prepared research data
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-scalping-prepared-${{ needs.prepare-scalping-data.outputs.research_sha }}-${{ github.run_id }}
          path: market-prediction-lab

      - name: Run one bounded scalping family shard
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ needs.prepare-scalping-data.outputs.research_sha }}
          SCALPING_DATASET_KEY: ${{ matrix.dataset }}
          SCALPING_FAMILY_VERSION: ${{ matrix.family }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/scalping-family-shards
          node scripts/run-scalping-family-research.js \
            scalping-history-cache \
            binance-scalping-cache \
            "artifacts/scalping-family-shards/${SCALPING_DATASET_KEY}.${SCALPING_FAMILY_VERSION}.raw.json" \
            "artifacts/scalping-family-shards/${SCALPING_DATASET_KEY}.${SCALPING_FAMILY_VERSION}.ranking.json"

      - name: Upload family shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-scalping-shard-${{ needs.prepare-scalping-data.outputs.research_sha }}-${{ github.run_id }}-${{ matrix.dataset }}-${{ matrix.family }}
          path: market-prediction-lab/artifacts/scalping-family-shards
          if-no-files-found: error
          retention-days: 90

      - name: Assert immutable checkout HEAD
        if: always()
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-scalping-data.outputs.research_sha }}"

  aggregate-scalping-families:
    needs:
      - prepare-scalping-data
      - scalping-family-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact research SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-scalping-data.outputs.research_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-scalping-data.outputs.research_sha }}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download immutable prepared research data
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-scalping-prepared-${{ needs.prepare-scalping-data.outputs.research_sha }}-${{ github.run_id }}
          path: market-prediction-lab

      - name: Download all completed shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prediction-lab-scalping-shard-${{ needs.prepare-scalping-data.outputs.research_sha }}-${{ github.run_id }}-*
          path: market-prediction-lab/artifacts/scalping-family-shards
          merge-multiple: true

      - name: Aggregate exact 30-shard matrix
        working-directory: market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ needs.prepare-scalping-data.outputs.research_sha }}
        run: node scripts/aggregate-scalping-family-shards.js artifacts/scalping-family-shards artifacts/automated-research/scalping-family-raw-results.json artifacts/automated-research/scalping-family-ranking.json

      - name: Assert research isolation and multiple-testing evidence
        working-directory: market-prediction-lab
        run: |
          node <<'NODE'
          const fs = require('fs');
          const timestamp = JSON.parse(fs.readFileSync('artifacts/automated-research/binance-funding-timestamp-audit.json', 'utf8'));
          const raw = JSON.parse(fs.readFileSync('artifacts/automated-research/scalping-family-raw-results.json', 'utf8'));
          const ranking = JSON.parse(fs.readFileSync('artifacts/automated-research/scalping-family-ranking.json', 'utf8'));
          if (timestamp.verdict !== 'SOURCE_TIMESTAMP_PRESERVED') throw new Error('funding timestamp provenance not preserved');
          if (!timestamp.datasets.every((row) => row.sourceAndParserSameInstant === true && row.paginationCursorAppliedToArchiveData === false)) throw new Error('funding timestamp mutation/cursor contamination');
          if (raw.shardMatrix?.expected !== 30 || raw.shardMatrix?.observed !== 30 || raw.shardMatrix?.complete !== true) throw new Error('scalping shard matrix incomplete');
          if (raw.finalHoldoutUsed !== false || raw.finalHoldoutRead !== false || ranking.finalHoldoutUsed !== false || ranking.finalHoldoutRead !== false) throw new Error('final holdout isolation violated');
          if (raw.topStrategy !== 'NONE' || ranking.topStrategy !== 'NONE') throw new Error('TOP strategy must remain NONE before holdout');
          if (raw.privateApiUsed !== false || raw.orderSubmitted !== false || ranking.privateApiUsed !== false || ranking.orderSubmitted !== false) throw new Error('private/order safety violated');
          if (!(raw.multipleTesting?.global?.totalCandidatesTested > 0)) throw new Error('multiple-testing evidence missing');
          const groups = new Set(raw.candidates.map((row) => row.group));
          for (const required of ['CRYPTO_SPOT_SCALPING','BINANCE_FUTURES_SCALPING_LONG','BINANCE_FUTURES_SCALPING_SHORT']) if (!groups.has(required)) throw new Error(`missing group ${required}`);
          const families = new Set(raw.candidates.map((row) => row.family));
          for (const required of ['V2_SCALPING','V3_RVOL_TREND_SCALPING','V4_REGIME_MOMENTUM_SCALPING','V5_BREAKOUT_RETEST_SCALPING','V6_INDEPENDENT_BREAKOUT_SCALPING']) if (!families.has(required)) throw new Error(`missing family ${required}`);
          for (const result of raw.results) {
            if (result.source.crossVenueMix !== false) throw new Error('cross-venue silent mix detected');
            if (result.group.startsWith('BINANCE_') && result.source.providerBoundary !== 'SAME_VENUE_BINANCE_USDM') throw new Error('Binance venue boundary mislabeled');
          }
          NODE

      - name: Upload scalping family artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-scalping-families-${{ needs.prepare-scalping-data.outputs.research_sha }}-${{ github.run_id }}
          path: |
            market-prediction-lab/artifacts/automated-research/binance-funding-timestamp-audit.json
            market-prediction-lab/artifacts/automated-research/scalping-family-raw-results.json
            market-prediction-lab/artifacts/automated-research/scalping-family-ranking.json
            market-prediction-lab/binance-scalping-cache/binance-scalping-provider-audit.json
            market-prediction-lab/scalping-history-cache/scalping-history-provider-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Assert immutable checkout HEAD
        if: always()
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-scalping-data.outputs.research_sha }}"
