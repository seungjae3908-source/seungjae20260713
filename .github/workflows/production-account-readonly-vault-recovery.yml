name: Production Account Read-only Vault Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/production-account-readonly-vault-recovery.yml'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-account-readonly-vault-recovery
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production account read-only vault recovery safety contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify fail-closed recovery contract
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          file='.github/workflows/production-account-readonly-vault-recovery.yml'
          grep -Fq 'environment: production' "$file"
          grep -Fq 'randomBytes(32).toString' "$file"
          grep -Fq "LIVE_TRADING: 'false'" "$file"
          grep -Fq "AUTO_TRADING: 'false'" "$file"
          grep -Fq "REAL_ORDER_ENABLED: 'false'" "$file"
          grep -Fq "PRIVATE_TRADING_API_ALLOWED: 'false'" "$file"
          grep -Fq "executionAuthority: 'NONE'" "$file"
          grep -Fq 'key_value_exposed: false' "$file"
          grep -Fq 'order_requests: 0' "$file"
          grep -Fq 'cancel_requests: 0' "$file"
          grep -Fq 'amend_requests: 0' "$file"
          grep -Fq 'transfer_requests: 0' "$file"
          grep -Fq 'withdrawal_requests: 0' "$file"
          grep -Fq "if (/TRADING_CREDENTIAL_MASTER_KEY/.test(serialized) || /[A-Za-z0-9+/]{43}=/.test(serialized)) process.exit(1);" "$file"

  recover:
    name: Owner-approved Production account read-only master-key recovery
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/recover-production-account-readonly-vault ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/recover-production-account-readonly-vault ([0-9a-fA-F]{40}) ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Expected /recover-production-account-readonly-vault <active-production-sha> <exact-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_sha=${match[1].toLowerCase()}\ntarget_sha=${match[2].toLowerCase()}\n`);
          NODE

      - name: Require exact current main and deployed Production provenance
        uses: actions/github-script@v7
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        with:
          script: |
            const active = process.env.ACTIVE_SHA;
            const target = process.env.TARGET_SHA;
            const branch = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            if (String(branch.data.commit.sha).toLowerCase() !== target) {
              core.setFailed('VAULT_RECOVERY_MAIN_SHA_MISMATCH');
              return;
            }
            const compare = await github.rest.repos.compareCommits({ owner: context.repo.owner, repo: context.repo.repo, base: active, head: target });
            if (!['ahead', 'identical'].includes(compare.data.status)) {
              core.setFailed('VAULT_RECOVERY_ACTIVE_SHA_NOT_IN_MAIN_HISTORY');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const latest = runs
              .filter((run) => run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latest || String(latest.head_sha).toLowerCase() !== active) {
              core.setFailed('VAULT_RECOVERY_ACTIVE_SHA_NOT_LATEST_PRODUCTION');
            }

      - name: Configure canonical Production SSH
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Recover master key in PM2 without exposing value
        id: recovery
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/production-account-readonly-vault-recovery.json"
          quoted_sha="$(printf '%q' "$ACTIVE_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "ACTIVE_SHA=$quoted_sha node -" > "$artifact" <<'NODE'
          const fs = require('node:fs');
          const { randomBytes } = require('node:crypto');
          const { execFileSync } = require('node:child_process');

          const activeSha = String(process.env.ACTIVE_SHA ?? '').trim().toLowerCase();
          const fail = (code) => { process.stderr.write(code + '\n'); process.exit(1); };
          if (!/^[0-9a-f]{40}$/.test(activeSha)) fail('VAULT_RECOVERY_ACTIVE_SHA_INVALID');

          const marker = '/opt/stock-app/.deploy/current-sha';
          if (!fs.existsSync(marker) || fs.readFileSync(marker, 'utf8').trim().toLowerCase() !== activeSha) {
            fail('VAULT_RECOVERY_MARKER_MISMATCH');
          }

          const readProcesses = () => JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 }));
          const selectApp = (rows) => {
            const matches = rows.filter((item) => item?.name === 'stock-app');
            if (matches.length !== 1 || !matches[0]?.pm2_env) fail('VAULT_RECOVERY_PM2_AMBIGUOUS');
            return matches[0];
          };
          const before = selectApp(readProcesses());
          if (before.pm2_env.status !== 'online') fail('VAULT_RECOVERY_PM2_NOT_ONLINE');
          if (String(before.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) fail('VAULT_RECOVERY_PM2_SHA_MISMATCH');

          const canonicalKey = (raw) => {
            const value = String(raw ?? '').trim();
            if (!/^[A-Za-z0-9+/]{43}=$/.test(value)) return null;
            try {
              const decoded = Buffer.from(value, 'base64');
              return decoded.length === 32 && decoded.toString('base64') === value ? value : null;
            } catch {
              return null;
            }
          };

          const existing = canonicalKey(before.pm2_env.TRADING_CREDENTIAL_MASTER_KEY);
          const key = existing ?? randomBytes(32).toString('base64');
          const action = existing ? 'reused_existing_valid_key' : 'generated_new_key_after_zero_ciphertext_precheck';

          const preserved = {};
          for (const [name, raw] of Object.entries(before.pm2_env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) continue;
            if (name.startsWith('pm_') || name.startsWith('axm_')) continue;
            if (raw === null || raw === undefined || typeof raw === 'object') continue;
            preserved[name] = String(raw);
          }

          const restartEnv = {
            ...process.env,
            ...preserved,
            TRADING_CREDENTIAL_MASTER_KEY: key,
            LIVE_TRADING: 'false',
            AUTO_TRADING: 'false',
            REAL_ORDER_ENABLED: 'false',
            PRIVATE_TRADING_API_ALLOWED: 'false',
            ORDER_EXECUTION_ENABLED: 'false',
            LIVE_TRADING_ACTIVATION_APPROVED: 'false',
            LIVE_AUTOMATIC_TRADING_ENABLED: 'false',
            BITGET_LIVE_ORDER_ENABLED: 'false',
            UPBIT_LIVE_ORDER_ENABLED: 'false',
            KIWOOM_LIVE_ORDER_ENABLED: 'false',
            TOSS_LIVE_ORDER_ENABLED: 'false',
            executionAuthority: 'NONE',
            DEPLOY_SHA: activeSha,
          };

          execFileSync('pm2', ['restart', 'stock-app', '--update-env'], {
            env: restartEnv,
            stdio: ['ignore', 'pipe', 'pipe'],
            maxBuffer: 4 * 1024 * 1024,
          });
          execFileSync('pm2', ['save'], { stdio: ['ignore', 'pipe', 'pipe'] });

          let after;
          for (let attempt = 0; attempt < 10; attempt += 1) {
            after = selectApp(readProcesses());
            if (after.pm2_env.status === 'online' && Number(after.pid ?? after.pm2_env.pm_id ?? 0) >= 0) break;
            execFileSync('sleep', ['1']);
          }
          if (!after || after.pm2_env.status !== 'online') fail('VAULT_RECOVERY_PM2_RESTART_FAILED');
          if (String(after.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) fail('VAULT_RECOVERY_POST_SHA_MISMATCH');
          if (!canonicalKey(after.pm2_env.TRADING_CREDENTIAL_MASTER_KEY)) fail('VAULT_RECOVERY_KEY_NOT_VALID_AFTER_RESTART');

          const mustBeFalse = [
            'LIVE_TRADING','AUTO_TRADING','REAL_ORDER_ENABLED','PRIVATE_TRADING_API_ALLOWED',
            'ORDER_EXECUTION_ENABLED','LIVE_TRADING_ACTIVATION_APPROVED','LIVE_AUTOMATIC_TRADING_ENABLED',
            'BITGET_LIVE_ORDER_ENABLED','UPBIT_LIVE_ORDER_ENABLED','KIWOOM_LIVE_ORDER_ENABLED','TOSS_LIVE_ORDER_ENABLED',
          ];
          for (const name of mustBeFalse) {
            if (String(after.pm2_env[name] ?? 'false').toLowerCase() !== 'false') fail('VAULT_RECOVERY_AUTHORITY_FLAG_ON_' + name);
          }
          if (String(after.pm2_env.executionAuthority ?? 'NONE').toUpperCase() !== 'NONE') fail('VAULT_RECOVERY_AUTHORITY_NOT_NONE');

          let health = null;
          for (let attempt = 0; attempt < 10; attempt += 1) {
            try {
              health = JSON.parse(execFileSync('curl', [
                '--fail','--silent','--show-error','--max-time','10','http://127.0.0.1:8080/api/health',
              ], { encoding: 'utf8' }));
              if (health?.ok === true
                && String(health.deploySha ?? '').toLowerCase() === activeSha
                && String(health.processDeploySha ?? '').toLowerCase() === activeSha
                && String(health.deployMarkerSha ?? '').toLowerCase() === activeSha
                && health.identityMatch === true
                && health.identityStatus === 'match') break;
            } catch {}
            execFileSync('sleep', ['1']);
          }
          if (!health?.ok || health.identityMatch !== true || String(health.deploySha ?? '').toLowerCase() !== activeSha) {
            fail('VAULT_RECOVERY_HEALTH_IDENTITY_FAILED');
          }

          process.stdout.write(JSON.stringify({
            status: 'passed',
            active_production_sha: activeSha,
            master_key_action: action,
            master_key_valid: true,
            key_value_exposed: false,
            pm2_online: true,
            production_identity_match: true,
            live_trading: false,
            auto_trading: false,
            real_order_enabled: false,
            private_trading_api_allowed: false,
            execution_authority: 'NONE',
            order_requests: 0,
            cancel_requests: 0,
            amend_requests: 0,
            transfer_requests: 0,
            withdrawal_requests: 0
          }, null, 2) + '\n');
          NODE

          node - "$artifact" "$ACTIVE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, activeSha] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (value?.status !== 'passed'
            || value?.active_production_sha !== activeSha
            || value?.master_key_valid !== true
            || value?.key_value_exposed !== false
            || value?.pm2_online !== true
            || value?.production_identity_match !== true
            || value?.live_trading !== false
            || value?.auto_trading !== false
            || value?.real_order_enabled !== false
            || value?.private_trading_api_allowed !== false
            || value?.execution_authority !== 'NONE'
            || value?.order_requests !== 0
            || value?.cancel_requests !== 0
            || value?.amend_requests !== 0
            || value?.transfer_requests !== 0
            || value?.withdrawal_requests !== 0) {
            process.exit(1);
          }
          const serialized = JSON.stringify(value);
          if (/TRADING_CREDENTIAL_MASTER_KEY/.test(serialized) || /[A-Za-z0-9+/]{43}=/.test(serialized)) process.exit(1);
          NODE
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized vault recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-account-readonly-vault-recovery-${{ steps.command.outputs.active_sha }}
          path: ${{ steps.recovery.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Record sanitized recovery result
        uses: actions/github-script@v7
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Production account read-only vault master-key recovery completed.',
                '',
                '- Active Production SHA: ' + process.env.ACTIVE_SHA,
                '- Exact current main SHA: ' + process.env.TARGET_SHA,
                '- Key value exposed: false',
                '- PM2 stock-app online: true',
                '- Production identity match: true',
                '- LIVE/AUTO/REAL/Private API authority: false',
                '- executionAuthority: NONE',
                '- Orders/cancels/amends/transfers/withdrawals: 0/0/0/0/0',
                '- Recovery Run ID: ' + context.runId,
                '- Source command comment ID: ' + process.env.SOURCE_COMMENT_ID,
              ].join('\n'),
            });
