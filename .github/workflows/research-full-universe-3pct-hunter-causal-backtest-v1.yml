name: Research Full-Universe 3pct Hunter Causal Backtest V1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py
      - market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v1.py
      - .github/workflows/research-full-universe-3pct-hunter-causal-backtest-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-full-universe-3pct-hunter-causal-backtest-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check research scripts
        run: |
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py
          python -m py_compile market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v1.py

  wait-source:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: "37390376696"
    steps:
      - name: Wait for exact direction-policy census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 300); do
            status=$(gh api repos/${{ github.repository }}/actions/runs/${SOURCE_RUN_ID} --jq .status)
            conclusion=$(gh api repos/${{ github.repository }}/actions/runs/${SOURCE_RUN_ID} --jq '.conclusion // ""')
            echo "source run status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "source census did not finish successfully"
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "source census wait timed out"
          exit 1

  backtest:
    needs: wait-source
    strategy:
      fail-fast: false
      matrix:
        market: [US_STOCK, KR_STOCK, CRYPTO_SPOT, CRYPTO_FUTURES]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "huggingface_hub>=0.30,<1" "duckdb>=1.3,<2" "finance-datareader>=0.9.90" "requests>=2.32,<3"

      - name: Run causal backtest
        run: |
          python market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py \
            --market ${{ matrix.market }} \
            --out-dir market-prediction-lab/docs/full-universe-3pct-hunter-causal-v1/${{ matrix.market }}

      - name: Upload causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-causal-v1-${{ matrix.market }}-${{ github.sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-causal-v1/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14


  combine:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check combiner
        run: python -m py_compile market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v1.py

      - name: Download current-run causal artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: full-universe-3pct-hunter-causal-v1-*
          path: causal-artifacts

      - name: Combine four-market results
        run: |
          python market-prediction-lab/scripts/combine-full-universe-3pct-hunter-causal-v1.py \
            --input-root causal-artifacts \
            --output-dir market-prediction-lab/docs/full-universe-3pct-hunter-causal-combined-v1

      - name: Upload combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-causal-combined-v1-${{ github.sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-causal-combined-v1
          if-no-files-found: error
          retention-days: 14
