name: External Literature MTF Combo Backtest

on:
  push:
    branches:
      - research/external-mtf-combo-btc-v1-20260824
    paths:
      - .github/workflows/external-mtf-combo-backtest.yml
      - market-prediction-lab/scripts/run-external-mtf-combo-backtest.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: external-mtf-combo-btc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  btcusdt-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish research run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(printf '{"state":"pending","target_url":"https://github.com/%s/actions/runs/%s","description":"multi-symbol frozen research running","context":"external-mtf-combo/research"}' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$body" >/dev/null

      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable research checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git symbolic-ref --quiet --short HEAD || true)" = ""

      - name: Checkout immutable historical research harness
        uses: actions/checkout@v4
        with:
          ref: ba181123e6b03c880d9c70174b16ae6eb528700b
          path: historical-harness
          persist-credentials: false
          fetch-depth: 1

      - name: Verify historical harness identity and stage challenger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical-harness rev-parse HEAD)" = "ba181123e6b03c880d9c70174b16ae6eb528700b"
          test -f historical-harness/market-prediction-lab/src/binance-scalping-selection-provider.js
          test -f historical-harness/market-prediction-lab/src/independent-strategy-backtest.js
          cp market-prediction-lab/scripts/run-external-mtf-combo-backtest.mjs \
            historical-harness/market-prediction-lab/scripts/run-external-mtf-combo-backtest.mjs
          for symbol in BNBUSDT SOLUSDT XRPUSDT; do
            lower=$(printf '%s' "$symbol" | tr '[:upper:]' '[:lower:]')
            sed -e "s/BTCUSDT/$symbol/g" \
                -e 's/RESEARCH_BACKTEST_PERIOD.startTime/Date.UTC(2021, 0, 1)/g' \
              market-prediction-lab/scripts/run-external-mtf-combo-backtest.mjs > \
              "historical-harness/market-prediction-lab/scripts/run-external-mtf-combo-backtest-$lower.mjs"
          done

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frozen multi-symbol scripts
        working-directory: historical-harness/market-prediction-lab
        run: |
          node --check scripts/run-external-mtf-combo-backtest-bnbusdt.mjs
          node --check scripts/run-external-mtf-combo-backtest-solusdt.mjs
          node --check scripts/run-external-mtf-combo-backtest-xrpusdt.mjs

      - name: Run BNB SOL XRP frozen cross-symbol backtests
        working-directory: historical-harness/market-prediction-lab
        env:
          RESEARCH_CODE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for symbol in BNBUSDT SOLUSDT XRPUSDT; do
            lower=$(printf '%s' "$symbol" | tr '[:upper:]' '[:lower:]')
            node "scripts/run-external-mtf-combo-backtest-$lower.mjs" \
              "artifacts/external-mtf-combo/$symbol/summary.json" \
              "artifacts/external-mtf-combo/$symbol/summary.md"
          done

      - name: Upload immutable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-mtf-combo-multisymbol-${{ github.sha }}
          path: historical-harness/market-prediction-lab/artifacts/external-mtf-combo
          if-no-files-found: warn
          retention-days: 90

      - name: Assert no trading or Production authority
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            'historicalHarnessSha=ba181123e6b03c880d9c70174b16ae6eb528700b' \
            'productionMutation=false' \
            'privateApiUsed=false' \
            'orderSubmitted=false' \
            'finalHoldoutRead=false'

      - name: Publish final research status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success; description='multi-symbol frozen research succeeded' ;;
            cancelled) state=error; description='multi-symbol frozen research cancelled' ;;
            *) state=failure; description='multi-symbol frozen research failed' ;;
          esac
          body=$(printf '{"state":"%s","target_url":"https://github.com/%s/actions/runs/%s","description":"%s","context":"external-mtf-combo/research"}' "$state" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$description")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$body" >/dev/null
