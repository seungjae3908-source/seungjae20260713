name: Research Crypto Flow Persistence Impact AI V5.4

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-orderflow-impact-efficiency-ai-v54.py
      - .github/workflows/research-crypto-flow-impact-ai-v54.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-flow-impact-ai-v54-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: CRYPTO_SPOT
            artifact: crypto-orderflow-targetfirst-ai-v43-CRYPTO_SPOT-d80f86c87d639f249d5a9817e5f80de2a866c3a8
          - market: CRYPTO_FUTURES
            artifact: crypto-orderflow-targetfirst-ai-v43-CRYPTO_FUTURES-d80f86c87d639f249d5a9817e5f80de2a866c3a8
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-crypto-orderflow-impact-efficiency-ai-v54.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "lightgbm>=4.5,<5"
      - name: Download frozen V4.3 event outcomes
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frozen-v43
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37443253984
      - name: Run independent impact-efficiency family
        shell: bash
        run: |
          set -euo pipefail
          EVENTS="$(find frozen-v43 -name events.parquet -print -quit)"
          test -n "$EVENTS"
          python market-prediction-lab/scripts/run-crypto-orderflow-impact-efficiency-ai-v54.py \
            --market "${{ matrix.market }}" \
            --events "$EVENTS" \
            --out-dir "market-prediction-lab/docs/crypto-flow-impact-ai-v54/${{ matrix.market }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-flow-impact-ai-v54-${{ matrix.market }}-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-flow-impact-ai-v54/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14
