name: Paper Forward No-Deploy Certification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/paper-forward-no-deploy-certification.yml
      - .github/workflows/paper-forward-schedule-no-deploy-activation.yml
      - ops/install-paper-forward-schedule.sh
      - ops/disable-paper-forward-schedule.sh
      - market-prediction-lab/package.json
      - market-prediction-lab/src/paper-forward-*.js
      - market-prediction-lab/src/authoritative-paper-*.js
      - market-prediction-lab/src/authoritative-natural-paper-*.js
      - market-prediction-lab/src/natural-paper-*.js
      - market-prediction-lab/src/recurring-paper-loop-v1.js
      - market-prediction-lab/src/canonical-paper-*.js
      - market-prediction-lab/src/canonical-meaningful-search-paper-runtime-v1.js
      - market-prediction-lab/tests/paper-*.test.js
      - market-prediction-lab/tests/authoritative-paper-*.test.js
      - market-prediction-lab/tests/natural-paper-*.test.js
      - market-prediction-lab/tests/recurring-paper-loop-v1.test.js
      - market-prediction-lab/tests/canonical-paper-*.test.js
      - market-prediction-lab/tests/canonical-meaningful-search-paper-runtime-v1.test.js
      - market-prediction-lab/tests/adaptive-multi-evidence-natural-paper-v2.test.js
      - market-prediction-lab/tests/adaptive-multi-evidence-e2e-v2.test.js
      - api-server/scripts/build-authoritative-paper-runtime-package.mjs
      - api-server/src/routes/paper-trading.smoke.test.ts
      - api-server/src/services/paper-*.ts
      - api-server/src/services/authoritative-paper-*.ts
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA to certify for isolated Paper activation
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: paper-forward-no-deploy-certification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify certification is Paper-only and fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/paper-forward-no-deploy-certification.yml
          activation=.github/workflows/paper-forward-schedule-no-deploy-activation.yml
          install=ops/install-paper-forward-schedule.sh
          grep -F 'workflow_dispatch:' "$workflow" >/dev/null
          grep -F 'paper-forward-no-deploy-certification-' "$workflow" >/dev/null
          grep -F 'Required CI 6/6' "$workflow" >/dev/null
          grep -F 'PostgreSQL Auth evidence' "$workflow" >/dev/null
          grep -F "LIVE_TRADING='false'" "$install" >/dev/null
          grep -F "REAL_ORDER_ENABLED='false'" "$install" >/dev/null
          grep -F "PRIVATE_TRADING_API_ALLOWED='false'" "$install" >/dev/null
          grep -F 'productionAppDeployAllowed: false' "$workflow" >/dev/null
          grep -F 'productionAppMutationAllowed: false' "$workflow" >/dev/null
          grep -F 'executionAuthority: NONE' "$workflow" >/dev/null
          grep -F 'paper-forward-no-deploy-certification-' "$activation" >/dev/null
          ! grep -F 'staging-verdict-' "$activation" >/dev/null
          ! grep -F 'deploy-production.sh' "$workflow" >/dev/null
          ! grep -E 'pm2 (start|restart|reload|delete|stop)|systemctl .*caddy|caddy reload|supabase db|psql .*-(c|f)' "$workflow" >/dev/null

  focused-paper-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Validate exact target syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact Paper target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Paper scheduler core regression
        run: npm --prefix market-prediction-lab run paper:scheduler:verify

      - name: Run authoritative Natural Paper focused regression
        run: >-
          node --test
          market-prediction-lab/tests/authoritative-paper-runtime-factory-v1.test.js
          market-prediction-lab/tests/authoritative-paper-runtime-package-v1.test.js
          market-prediction-lab/tests/authoritative-paper-natural-funnel-v1.test.js
          market-prediction-lab/tests/natural-paper-position-settlement-lifecycle-v1.test.js
          market-prediction-lab/tests/natural-paper-public-position-observation-v1.test.js
          market-prediction-lab/tests/natural-paper-public-position-observation-runtime-v1.test.js
          market-prediction-lab/tests/adaptive-multi-evidence-natural-paper-v2.test.js
          market-prediction-lab/tests/adaptive-multi-evidence-e2e-v2.test.js

      - name: Bundle authenticated Paper snapshot transport regression
        run: >-
          pnpm --dir api-server exec esbuild
          src/routes/paper-trading.smoke.test.ts
          --bundle --platform=node --format=cjs --target=node22
          --outfile=/tmp/paper-trading-snapshot-transport.test.cjs

      - name: Run authenticated Paper snapshot transport regression
        run: node --test /tmp/paper-trading-snapshot-transport.test.cjs

      - name: Rebuild and verify exact authoritative runtime package
        run: |
          node api-server/scripts/build-authoritative-paper-runtime-package.mjs
          git diff --exit-code -- \
            market-prediction-lab/runtime/authoritative-paper-runtime-v1/authoritative-paper-runtime-v1.mjs \
            market-prediction-lab/runtime/authoritative-paper-runtime-v1/authoritative-paper-runtime-v1.manifest.json

      - name: Verify installer and activation safety boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          install=ops/install-paper-forward-schedule.sh
          activation=.github/workflows/paper-forward-schedule-no-deploy-activation.yml
          grep -F "LIVE_TRADING='false'" "$install" >/dev/null
          grep -F "AUTO_TRADING='false'" "$install" >/dev/null
          grep -F "REAL_ORDER_ENABLED='false'" "$install" >/dev/null
          grep -F "PRIVATE_TRADING_API_ALLOWED='false'" "$install" >/dev/null
          grep -F "PRIVATE_ACCOUNT_ACCESS='false'" "$install" >/dev/null
          grep -F '/opt/stock-app-data/paper-forward-v1' "$install" >/dev/null
          grep -F 'productionAppDeployPerformed = false' "$activation" >/dev/null
          grep -F 'productionAppMutationAllowed = false' "$activation" >/dev/null
          grep -F 'environment: production' "$activation" >/dev/null
          ! grep -F 'deploy-production.sh' "$activation" >/dev/null
          ! grep -E 'pm2 (start|restart|reload|delete|stop)|systemctl .*caddy|caddy reload|supabase db|psql .*-(c|f)' "$activation" >/dev/null

  certify:
    if: github.event_name == 'workflow_dispatch'
    needs: focused-paper-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main and Required CI 6/6
        id: required
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/.test(target)) {
              core.setFailed('Exact lowercase 40-character target SHA required.');
              return;
            }
            const main = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            if (main.data.commit.sha !== target) {
              core.setFailed(`Certification target is stale: target=${target} main=${main.data.commit.sha}`);
              return;
            }
            const required = new Set([
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ]);
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: target, per_page: 100,
            });
            const latest = new Map();
            for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status);
            const evidence = [...required].map((contextName) => latest.get(contextName));
            if (evidence.length !== 6 || evidence.some((status) => status?.state !== 'success')) {
              core.setFailed('Exact current main does not have Required CI 6/6 SUCCESS.');
              return;
            }
            const runIds = new Set(evidence.map((status) => /\/actions\/runs\/(\d+)/.exec(String(status.target_url ?? ''))?.[1] ?? null));
            if (runIds.size !== 1 || runIds.has(null)) {
              core.setFailed('Required CI 6/6 does not share one coherent provenance run.');
              return;
            }
            const runId = Number([...runIds][0]);
            const run = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            if (run.data.head_sha !== target || run.data.status !== 'completed' || run.data.conclusion !== 'success') {
              core.setFailed('Required CI provenance is not an exact successful target run.');
              return;
            }
            core.setOutput('run_id', String(runId));

      - name: Locate successful exact-SHA PostgreSQL Auth evidence
        id: postgres
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, head_sha: target, branch: 'main', event: 'issue_comment', status: 'completed', per_page: 100,
            });
            for (const run of runs) {
              if (run.name !== 'Staging PostgreSQL Auth Gate' || run.path !== '.github/workflows/staging-postgres-auth-gate.yml' || run.conclusion !== 'success') continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 });
              const expected = `staging-postgres-auth-${target}`;
              const artifact = (artifacts.data.artifacts ?? []).find((item) => item.name === expected && item.expired !== true && item.workflow_run?.head_sha === target);
              if (artifact) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.setFailed(`No successful exact-SHA PostgreSQL Auth evidence exists for ${target}.`);

      - name: Write immutable Paper-only certification
        env:
          REQUIRED_CI_RUN_ID: ${{ steps.required.outputs.run_id }}
          POSTGRES_AUTH_RUN_ID: ${{ steps.postgres.outputs.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p paper-forward-no-deploy-certification
          node <<'NODE'
          const fs = require('node:fs');
          const targetSha = process.env.TARGET_SHA;
          const requiredCiRunId = Number(process.env.REQUIRED_CI_RUN_ID);
          const postgresAuthRunId = Number(process.env.POSTGRES_AUTH_RUN_ID);
          if (!/^[0-9a-f]{40}$/.test(targetSha) || !Number.isSafeInteger(requiredCiRunId) || !Number.isSafeInteger(postgresAuthRunId)) process.exit(1);
          const value = {
            schemaVersion: 'paper-forward-no-deploy-certification-v1',
            targetSha,
            certifiedAt: new Date().toISOString(),
            requiredCiRunId,
            postgresAuthRunId,
            certificationReady: true,
            checks: {
              exactCurrentMain: true,
              requiredCi6Of6: true,
              postgresAuthEvidence: true,
              focusedPaperRegression: true,
              paperSchedulerRegression: true,
              authenticatedSnapshotTransport: true,
              authoritativeRuntimePackageClean: true,
              isolatedPersistentStateRoot: '/opt/stock-app-data/paper-forward-v1',
              productionAppDeployAllowed: false,
              productionAppMutationAllowed: false,
              liveTrading: false,
              autoTrading: false,
              realOrderEnabled: false,
              privateTradingApiAllowed: false,
              executionAuthority: 'NONE',
            },
          };
          fs.writeFileSync('paper-forward-no-deploy-certification/certification.json', `${JSON.stringify(value, null, 2)}\n`);
          NODE

      - name: Upload exact-SHA Paper-only certification
        uses: actions/upload-artifact@v4
        with:
          name: paper-forward-no-deploy-certification-${{ env.TARGET_SHA }}
          path: paper-forward-no-deploy-certification/certification.json
          if-no-files-found: error
          retention-days: 30
