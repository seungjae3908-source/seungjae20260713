name: Research KR DART Event V4 Schema Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-kr-dart-event-v4-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "huggingface_hub>=0.30,<1" "pandas>=2.2,<3" "pyarrow>=18,<22"
      - name: Probe exact paths and schemas
        run: |
          python - <<'PY'
          import json, pandas as pd
          from huggingface_hub import HfApi, hf_hub_download

          repo='eddmpython/dartlab-data'
          api=HfApi()
          files=api.list_repo_files(repo_id=repo,repo_type='dataset')
          price=[f for f in files if 'prices' in f and f.endswith('raw-2023.parquet')]
          price2026=[f for f in files if 'prices' in f and f.endswith('raw-2026.parquet')]
          filing_targets=['dart/allFilings/20230403.parquet','dart/allFilings/20250401.parquet','dart/allFilings/20260930.parquet']
          existing_filings=[f for f in filing_targets if f in files]
          out={'price2023Candidates':price,'price2026Candidates':price2026,'filingTargets':existing_filings}

          if price:
              p=hf_hub_download(repo_id=repo,repo_type='dataset',filename=price[0])
              df=pd.read_parquet(p)
              out['priceSchema']={'path':price[0],'rows':len(df),'columns':[str(c) for c in df.columns],'head':df.head(3).astype(str).to_dict('records')}

          probe_filing=existing_filings[0] if existing_filings else next((f for f in files if f.startswith('dart/allFilings/2023') and f.endswith('.parquet')),None)
          if probe_filing:
              p=hf_hub_download(repo_id=repo,repo_type='dataset',filename=probe_filing)
              df=pd.read_parquet(p)
              out['filingSchema']={'path':probe_filing,'rows':len(df),'columns':[str(c) for c in df.columns],'head':df.head(5).astype(str).to_dict('records')}

          print(json.dumps({'KR_DART_V4_SCHEMA_PROBE':out},ensure_ascii=False))
          PY
