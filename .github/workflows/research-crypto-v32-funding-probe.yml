name: Research Crypto V3.2 Funding Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-v32-funding-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install "requests>=2.32,<3" "pandas>=2.2,<3"
      - name: Probe funding monthly archive
        run: |
          python - <<'PY'
          import io, json, zipfile, requests, pandas as pd
          urls=[
            'https://data.binance.vision/data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2026-04.zip',
            'https://data.binance.vision/data/futures/um/monthly/fundingRate/ETHUSDT/ETHUSDT-fundingRate-2025-01.zip',
            'https://data.binance.vision/data/futures/um/monthly/fundingRate/SOLUSDT/SOLUSDT-fundingRate-2024-06.zip',
          ]
          out=[]
          for url in urls:
              r=requests.get(url,timeout=45,headers={'User-Agent':'market-prediction-lab/funding-v32-probe'})
              item={'url':url,'status':r.status_code,'bytes':len(r.content)}
              if r.ok:
                  with zipfile.ZipFile(io.BytesIO(r.content)) as z:
                      names=[n for n in z.namelist() if n.lower().endswith('.csv')]
                      item['files']=names
                      if names:
                          df=pd.read_csv(z.open(names[0]))
                          item['rows']=len(df)
                          item['columns']=[str(c) for c in df.columns]
                          item['head']=df.head(3).astype(str).to_dict('records')
                          item['tail']=df.tail(3).astype(str).to_dict('records')
              out.append(item)
          verdict=all(x['status']==200 and x.get('rows',0)>0 for x in out)
          print(json.dumps({'FUNDING_ARCHIVE_PROBE':out,'VERDICT':verdict},ensure_ascii=False))
          if not verdict:
              raise SystemExit(1)
          PY
