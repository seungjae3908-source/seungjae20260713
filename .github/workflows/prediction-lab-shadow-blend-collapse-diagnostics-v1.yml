name: Prediction Lab Shadow Blend Collapse Diagnostics V1

on:
  pull_request:
    paths:
      - 'market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js'
      - 'market-prediction-lab/tests/shadow-blend-collapse-diagnostics-v1.test.js'
      - 'market-prediction-lab/scripts/run-shadow-blend-collapse-diagnostics-v1.js'
      - '.github/workflows/prediction-lab-shadow-blend-collapse-diagnostics-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check diagnostic and runner
        run: |
          node --check market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          node --check market-prediction-lab/scripts/run-shadow-blend-collapse-diagnostics-v1.js

      - name: Run focused 15m blend-collapse diagnostics tests
        working-directory: market-prediction-lab
        run: node --test tests/shadow-blend-collapse-diagnostics-v1.test.js

      - name: Locate latest successful immutable Shadow artifact
        id: shadow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'prediction-lab-shadow-hourly.yml',
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((item) => item.name === 'prediction-lab-shadow-state' && !item.expired);
              if (!artifact) continue;
              if (!/^sha256:[0-9a-f]{64}$/.test(String(artifact.digest ?? ''))) {
                core.setFailed(`Shadow artifact ${artifact.id} has no immutable SHA-256 digest.`);
                return;
              }
              core.setOutput('run_id', String(run.id));
              core.setOutput('artifact_id', String(artifact.id));
              core.setOutput('artifact_digest', artifact.digest);
              core.setOutput('run_head_sha', String(run.head_sha ?? ''));
              core.info(`Using immutable Shadow artifact ${artifact.id} from run ${run.id}.`);
              return;
            }
            core.setFailed('No non-expired successful prediction-lab-shadow-state artifact was found.');

      - name: Download immutable Shadow artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-shadow-state
          path: ${{ runner.temp }}/shadow-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.shadow.outputs.run_id }}

      - name: Fetch exact candidate model bytes from artifact research SHA
        id: model
        uses: actions/github-script@v7
        env:
          SHADOW_DIR: ${{ runner.temp }}/shadow-state
          MODEL_FILE: ${{ runner.temp }}/crypto-futures-15m.json
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.SHADOW_DIR, 'manifest.json'), 'utf8'));
            const researchCodeSha = String(manifest.researchCodeSha ?? '');
            if (!/^[0-9a-f]{40}$/.test(researchCodeSha)) {
              core.setFailed('Shadow manifest researchCodeSha is invalid.');
              return;
            }
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'market-prediction-lab/docs/candidate-models/crypto-futures-15m.json',
              ref: researchCodeSha,
            });
            if (Array.isArray(response.data) || response.data.type !== 'file' || !response.data.content) {
              core.setFailed('Exact 15m candidate model artifact is unavailable.');
              return;
            }
            fs.writeFileSync(process.env.MODEL_FILE, Buffer.from(response.data.content, 'base64'));
            core.setOutput('research_code_sha', researchCodeSha);
            core.setOutput('model_blob_sha', response.data.sha);

      - name: Reconstruct and authenticate current 15m Rule Model Blend evidence
        env:
          SHADOW_DIR: ${{ runner.temp }}/shadow-state
          MODEL_FILE: ${{ runner.temp }}/crypto-futures-15m.json
          OUTPUT_FILE: ${{ runner.temp }}/shadow-15m-blend-collapse-diagnostic.json
          WORKFLOW_RUN_ID: ${{ steps.shadow.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.shadow.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.shadow.outputs.artifact_digest }}
          MODEL_BLOB_SHA: ${{ steps.model.outputs.model_blob_sha }}
        run: |
          node market-prediction-lab/scripts/run-shadow-blend-collapse-diagnostics-v1.js \
            --artifact-dir "$SHADOW_DIR" \
            --model-artifact "$MODEL_FILE" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --model-blob-sha "$MODEL_BLOB_SHA" \
            --output "$OUTPUT_FILE"
          node - "$OUTPUT_FILE" <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(JSON.stringify({
            artifact: value.authenticatedEvidence,
            rootCause: value.mechanicalRootCause,
            laneDistribution: {
              rule: value.lanes.rule.distribution,
              model: value.lanes.model.distribution,
              blend: value.lanes.blend.distribution,
            },
            quality: {
              rule: value.lanes.rule.quality,
              model: value.lanes.model.quality,
              blend: value.lanes.blend.quality,
            },
            referenceDriftEvidence: value.referenceDriftEvidence,
          }, null, 2));
          if (value.authenticatedEvidence?.exactBlendParity !== true) process.exit(1);
          if (value.safety?.LIVE_TRADING !== false || value.safety?.executionAuthority !== 'NONE') process.exit(1);
          NODE

      - name: Upload immutable diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-shadow-15m-blend-collapse-diagnostic
          path: ${{ runner.temp }}/shadow-15m-blend-collapse-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify fail-closed safety invariants
        run: |
          grep -q 'diagnosticsOnly: true' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          grep -q 'blendWeightModified: false' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          grep -q 'finalHoldoutOptimizationAllowed: false' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          grep -q 'profitabilityCredit: 0' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          grep -q 'promotionCredit: 0' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          grep -q 'LIVE_TRADING: false' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
          grep -q 'executionAuthority: "NONE"' market-prediction-lab/src/shadow-blend-collapse-diagnostics-v1.js
