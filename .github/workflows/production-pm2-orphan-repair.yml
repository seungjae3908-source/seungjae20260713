name: Production PM2 Orphan Repair

on:
  pull_request:
    paths:
      - .github/workflows/production-pm2-orphan-repair.yml
      - ops/repair-production-pm2-orphan.sh
      - api-server/scripts/verify-production-pm2-orphan-repair-contract.mjs
      - api-server/package.json
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  statuses: read

concurrency:
  group: stock-app-production-live
  cancel-in-progress: false

jobs:
  contract:
    name: Validate PM2 orphan repair safety contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate shell syntax
        run: bash -n ops/repair-production-pm2-orphan.sh
      - name: Verify repair safety contract
        working-directory: api-server
        run: node scripts/verify-production-pm2-orphan-repair-contract.mjs

  repair:
    name: Protected one-time Production PM2 orphan repair
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 23 &&
      github.event.issue.title == 'Staging Readiness Control' &&
      startsWith(github.event.comment.body, '/repair-production-pm2-orphan ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse exact owner repair command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || { echo 'Only the repository owner may repair Production PM2 ownership.' >&2; exit 1; }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || { echo 'Command author is not the repository owner.' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/repair-production-pm2-orphan ([0-9a-fA-F]{40}) ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /repair-production-pm2-orphan <exact-current-main-sha> <exact-active-production-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${match[1].toLowerCase()}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_sha=${match[2].toLowerCase()}\n`);
          NODE

      - name: Require exact current main
        env:
          SOURCE_SHA: ${{ steps.command.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main^{commit})"
          [[ "$SOURCE_SHA" == "$CURRENT_MAIN" ]] || {
            echo "Repair source must equal exact current main: requested=$SOURCE_SHA current=$CURRENT_MAIN" >&2
            exit 1
          }
          git checkout --detach "$SOURCE_SHA"
          bash -n ops/repair-production-pm2-orphan.sh
          (cd api-server && node scripts/verify-production-pm2-orphan-repair-contract.mjs)

      - name: Require exact current-main Required CI provenance
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.source_sha }}
        with:
          script: |
            const {
              REQUIRED_PRODUCTION_STATUSES,
              evaluateProductionCiProvenance,
              inspectRequiredStatusEvidence,
            } = require(`${process.env.GITHUB_WORKSPACE}/api-server/scripts/production-ci-provenance.cjs`);
            const targetSha = process.env.TARGET_SHA;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            const evidence = inspectRequiredStatusEvidence(statuses);
            if (!evidence.ok) {
              core.setFailed(`Required CI status provenance rejected: ${evidence.reason}.`);
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const run = runs.find((candidate) => Number(candidate.id) === evidence.runId);
            const verified = evaluateProductionCiProvenance({
              targetSha,
              currentMainSha: targetSha,
              statuses,
              run,
            });
            if (!verified.ok) {
              core.setFailed(`Application CI provenance rejected: ${verified.reason}.`);
              return;
            }
            core.info(`Required CI ${REQUIRED_PRODUCTION_STATUSES.length}/${REQUIRED_PRODUCTION_STATUSES.length} verified by exact Application CI Run ID ${verified.runId}.`);

      - name: Validate Production SSH secrets
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" ]] || { echo 'Missing PROD_SSH_HOST' >&2; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo 'Missing PROD_SSH_USER' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo 'Missing PROD_SSH_PRIVATE_KEY' >&2; exit 1; }

      - name: Configure SSH without exposing credentials
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Repair Production PM2 ownership without deploying code
        id: repair
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'LIVE_DIR=%q PM2_NAME=%q LIVE_PORT=%q PUBLIC_BASE_URL=%q bash -s -- %q' \
            '/opt/stock-app' 'stock-app' '8080' 'https://lsj119.com' "$ACTIVE_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env" < ops/repair-production-pm2-orphan.sh

      - name: Record sanitized repair result
        if: always() && steps.command.outcome == 'success'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.command.outputs.source_sha }}
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const success = process.env.REPAIR_OUTCOME === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                success ? 'Production PM2 orphan repair completed.' : 'Production PM2 orphan repair failed closed.',
                '',
                `- Repair source current-main SHA: \`${process.env.SOURCE_SHA}\``,
                `- Preserved Production application SHA: \`${process.env.ACTIVE_SHA}\``,
                `- PM2/live-port repair outcome: \`${process.env.REPAIR_OUTCOME}\``,
                '- Production application deploy executed: `false`',
                '- New Production SHA deployed: `false`',
                '- Production database changed: `false`',
                '- Secret values recorded: `false`',
                '- Live/private trading authority granted: `false`',
                '- Real orders submitted: `0`',
                `- Repair Run ID: \`${context.runId}\``,
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              ].join('\n'),
            });
            if (!success) core.setFailed('Production PM2 orphan repair did not complete successfully.');
