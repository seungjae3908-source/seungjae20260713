name: Research Crypto V3 OI Validation Diagnostic

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-v3-oi-validation-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: "37400672887"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download OI overlay artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: crypto-v3-short-oi-overlay-*
          path: oi-artifact
      - name: Print validation-pass OOS diagnostics
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          files=list(Path('oi-artifact').glob('**/candidate-grid.csv'))
          if not files: raise SystemExit('candidate-grid missing')
          rows=list(csv.DictReader(files[0].open(encoding='utf-8-sig')))
          def b(v): return str(v).lower()=='true'
          def f(v):
              try:return float(v)
              except:return None
          def i(v):
              try:return int(float(v))
              except:return None
          out=[]
          for r in rows:
              if not b(r.get('validationPass')): continue
              out.append({
                'candidate':r.get('candidate'),
                'trainReturn':f(r.get('trainReturn')),
                'trainPF':f(r.get('trainPF')),
                'validationReturn':f(r.get('validationReturn')),
                'validationPF':f(r.get('validationPF')),
                'validationMDD':f(r.get('validationMDD')),
                'freshOosReturn':f(r.get('freshOosReturn')),
                'freshOosPF':f(r.get('freshOosPF')),
                'freshOosMDD':f(r.get('freshOosMDD')),
                'freshOosPositiveMonthRate':f(r.get('freshOosPosMonthRate')),
                'freshOosTrades':i(r.get('freshOosTrades')),
              })
          print(json.dumps({'OI_VALIDATION_PASS_DIAGNOSTIC':out,'note':'fresh OOS is diagnostic only and must not be used to select a replacement winner'},ensure_ascii=False))
          PY
