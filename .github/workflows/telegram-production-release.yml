name: Telegram Production Release

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/telegram-production-release.yml
      - api-server/scripts/verify-telegram-production-release-contract.mjs
      - api-server/supabase/migrations/2026081501_personal_telegram_storage.sql
      - api-server/supabase/migrations/2026081502_personal_telegram_policy_cleanup.sql
      - ops/apply-production-personal-telegram-storage.mjs
      - ops/verify-production-personal-telegram-storage.mjs

permissions:
  contents: read

concurrency:
  group: telegram-production-release
  cancel-in-progress: false

jobs:
  validate-contract:
    name: Validate Telegram production release safeguards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node api-server/scripts/verify-telegram-production-release-contract.mjs
          node ops/verify-production-personal-telegram-storage.mjs --static

  release:
    name: Owner-approved Telegram production release and delivery verification
    permissions:
      actions: write
      contents: read
      issues: write
      statuses: read
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-telegram-production ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PUBLIC_BASE_URL: https://lsj119.duckdns.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || {
            echo 'Only the repository owner may release Telegram to Production.' >&2
            exit 1
          }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || {
            echo 'Command author is not the repository owner.' >&2
            exit 1
          }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-telegram-production ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /run-telegram-production <40-character-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\n`);
          NODE

      - name: Require exact current main SHA
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "Telegram Production release requires exact current main: target=$TARGET_SHA main=$MAIN_SHA" >&2
            exit 1
          }

      - name: Require exact-main Required CI 6/6 and official Application CI provenance
        id: ci
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const {
              REQUIRED_PRODUCTION_STATUSES,
              evaluateProductionCiProvenance,
              inspectRequiredStatusEvidence,
            } = require(`${process.env.GITHUB_WORKSPACE}/api-server/scripts/production-ci-provenance.cjs`);
            const targetSha = process.env.TARGET_SHA;
            const mainResponse = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (mainResponse.data.commit.sha !== targetSha) {
              core.setFailed(`Telegram release target became stale: target=${targetSha} main=${mainResponse.data.commit.sha}`);
              return;
            }
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            const evidence = inspectRequiredStatusEvidence(statuses);
            if (!evidence.ok) {
              core.setFailed(`Required CI 6/6 rejected: ${evidence.reason}`);
              return;
            }
            const runResponse = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: evidence.runId,
            });
            const verified = evaluateProductionCiProvenance({
              targetSha,
              currentMainSha: targetSha,
              statuses,
              run: runResponse.data,
            });
            if (!verified.ok) {
              core.setFailed(`Application CI provenance rejected: ${verified.reason}`);
              return;
            }
            if (JSON.stringify(REQUIRED_PRODUCTION_STATUSES) !== JSON.stringify([
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ])) {
              core.setFailed('Shared Required CI status contract changed unexpectedly.');
              return;
            }
            core.setOutput('run_id', String(verified.runId));
            core.info(`Exact-main Required CI 6/6 accepted from Application CI Run ID ${verified.runId}.`);

      - name: Require successful exact-SHA PostgreSQL authentication artifact
        id: postgres
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const artifactName = `staging-postgres-auth-${targetSha}`;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              branch: 'main',
              event: 'issue_comment',
              status: 'completed',
              per_page: 100,
            });
            const candidates = runs
              .filter((run) =>
                run.name === 'Staging PostgreSQL Auth Gate'
                && run.path === '.github/workflows/staging-postgres-auth-gate.yml'
                && run.head_sha === targetSha
                && run.head_branch === 'main'
                && run.event === 'issue_comment'
                && run.status === 'completed'
                && run.conclusion === 'success')
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            let accepted = null;
            for (const run of candidates) {
              const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = (artifactResponse.data.artifacts ?? []).find((candidate) =>
                candidate.name === artifactName
                && candidate.expired !== true
                && candidate.workflow_run?.head_sha === targetSha);
              if (artifact) {
                accepted = { run, artifact };
                break;
              }
            }
            if (!accepted) {
              core.setFailed(`No successful unexpired exact-SHA PostgreSQL authentication evidence exists for ${targetSha}.`);
              return;
            }
            core.setOutput('run_id', String(accepted.run.id));
            core.setOutput('artifact_id', String(accepted.artifact.id));
            core.info(`PostgreSQL authentication evidence accepted from Run ID ${accepted.run.id}.`);

      - name: Download exact PostgreSQL authentication artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-postgres-auth-${{ steps.command.outputs.sha }}
          path: staging-postgres-auth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.postgres.outputs.run_id }}

      - name: Verify PostgreSQL authentication artifact is read-only and passed
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(
            'staging-postgres-auth/staging-postgres-auth-verification.json',
            'utf8',
          ));
          const valid = value?.status === 'passed'
            && value?.classification === 'authenticated'
            && value?.project_match === true
            && value?.read_only_probe === true
            && value?.database_changed === false
            && value?.credentials_recorded === false;
          if (!valid) {
            console.error('Exact-SHA PostgreSQL authentication artifact failed the read-only contract.');
            process.exit(1);
          }
          NODE

      - name: Require successful exact-SHA Staging Readiness verdict
        id: staging
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const artifactName = `staging-verdict-${targetSha}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });
            const candidates = artifacts
              .filter((artifact) => !artifact.expired && artifact.workflow_run?.head_sha === targetSha)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            let accepted = null;
            for (const artifact of candidates) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              const run = response.data;
              const valid = run.event === 'workflow_dispatch'
                && run.head_branch === 'main'
                && run.head_sha === targetSha
                && run.path === '.github/workflows/staging-readiness.yml'
                && run.status === 'completed'
                && run.conclusion === 'success';
              if (valid) {
                accepted = { artifact, run };
                break;
              }
            }
            if (!accepted) {
              core.setFailed(`No successful exact-SHA Staging Readiness verdict exists for ${targetSha}.`);
              return;
            }
            core.setOutput('run_id', String(accepted.run.id));
            core.setOutput('artifact_id', String(accepted.artifact.id));
            core.info(`Staging verdict accepted from Run ID ${accepted.run.id}.`);

      - name: Download exact Staging Readiness verdict
        uses: actions/download-artifact@v4
        with:
          name: staging-verdict-${{ steps.command.outputs.sha }}
          path: staging-verdict
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.staging.outputs.run_id }}

      - name: Verify exact-SHA Staging Readiness verdict
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: node api-server/scripts/verify-staging-verdict.mjs staging-verdict/staging-verdict.json

      - name: Validate Production SSH secrets
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" ]] || { echo 'Missing PROD_SSH_HOST' >&2; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo 'Missing PROD_SSH_USER' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo 'Missing PROD_SSH_PRIVATE_KEY' >&2; exit 1; }

      - name: Configure Production SSH
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Capture sanitized pre-deploy runtime evidence
        id: before
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          evidence="$(
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" node - <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const processes = JSON.parse(execFileSync("pm2", ["jlist"], { encoding: "utf8" }));
          const selected = processes.find((item) => item.name === "stock-app");
          if (!selected?.pm2_env) process.exit(2);
          const logPath = selected.pm2_env.pm_out_log_path;
          const logSize = typeof logPath === "string" && fs.existsSync(logPath)
            ? fs.statSync(logPath).size
            : 0;
          const markerPath = "/opt/stock-app/.deploy/current-sha";
          const activeSha = fs.existsSync(markerPath)
            ? fs.readFileSync(markerPath, "utf8").trim()
            : "unknown";
          process.stdout.write(JSON.stringify({
            activeSha,
            pmUptime: Number(selected.pm2_env.pm_uptime ?? 0),
            logSize,
            online: selected.pm2_env.status === "online",
          }));
          NODE
          )"
          node - "$evidence" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(process.argv[2]);
          if (value.online !== true) {
            console.error('Production PM2 process is not online before deployment.');
            process.exit(1);
          }
          if (!Number.isFinite(value.pmUptime) || value.pmUptime <= 0) process.exit(1);
          if (!Number.isFinite(value.logSize) || value.logSize < 0) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `active_sha=${String(value.activeSha)}`,
            `pm_uptime=${Math.trunc(value.pmUptime)}`,
            `log_size=${Math.trunc(value.logSize)}`,
            '',
          ].join('\n'));
          NODE

      - name: Apply and verify Production personal Telegram storage atomically
        id: storage
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRE_ACTIVE_SHA: ${{ steps.before.outputs.active_sha }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/production-personal-telegram-storage.json"
          stderr_file="$RUNNER_TEMP/production-personal-telegram-storage.stderr"
          archive="$RUNNER_TEMP/production-personal-telegram-storage-tooling.tar.gz"
          remote_dir="$(
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/telegram-storage.XXXXXX'
          )"
          [[ "$remote_dir" =~ ^/tmp/telegram-storage\.[A-Za-z0-9]+$ ]] || {
            echo 'Production migration temporary directory was rejected.' >&2
            exit 1
          }
          quoted_remote_dir="$(printf '%q' "$remote_dir")"
          cleanup_remote() {
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "case $quoted_remote_dir in /tmp/telegram-storage.*) find $quoted_remote_dir -depth -mindepth 1 -delete && rmdir $quoted_remote_dir ;; *) exit 2 ;; esac" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT

          tar -czf "$archive" \
            ops/apply-production-personal-telegram-storage.mjs \
            api-server/supabase/migrations/2026081501_personal_telegram_storage.sql \
            api-server/supabase/migrations/2026081502_personal_telegram_policy_cleanup.sql
          scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$archive" "$SSH_USER@$SSH_HOST:$remote_dir/tooling.tar.gz"
          remote_command="$(printf 'cd %q && tar -xzf tooling.tar.gz && EXPECTED_ACTIVE_SHA=%q APPROVED_TARGET_SHA=%q node ops/apply-production-personal-telegram-storage.mjs' \
            "$remote_dir" "$PRE_ACTIVE_SHA" "$TARGET_SHA")"
          if ! ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_command" > "$artifact" 2> "$stderr_file"; then
            echo 'Production personal Telegram storage migration failed safely; remote diagnostics are not printed.' >&2
            exit 1
          fi
          node ops/verify-production-personal-telegram-storage.mjs --artifact "$artifact" "$TARGET_SHA" "$PRE_ACTIVE_SHA"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized Production personal Telegram storage evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-personal-telegram-storage-${{ steps.command.outputs.sha }}
          path: ${{ steps.storage.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Record accepted owner approval without exposing secrets
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          APPLICATION_CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          POSTGRES_RUN_ID: ${{ steps.postgres.outputs.run_id }}
          STAGING_RUN_ID: ${{ steps.staging.outputs.run_id }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Owner-approved Telegram-only Production release gate accepted.',
                '',
                `- Exact current main SHA: \`${process.env.TARGET_SHA}\``,
                `- Application CI Run ID: \`${process.env.APPLICATION_CI_RUN_ID}\``,
                '- Required CI: `6/6 SUCCESS`',
                `- PostgreSQL Auth Gate Run ID: \`${process.env.POSTGRES_RUN_ID}\``,
                `- Staging Readiness Run ID: \`${process.env.STAGING_RUN_ID}\``,
                '- Staging verdict: `release_ready=true`',
                '- Personal Telegram storage migration: `atomic, verified`',
                '- Database changed by this gate: `true`',
                '- Trading authority granted: `false`',
                '- Secret values recorded: `false`',
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              ].join('\n'),
            });

      - name: Dispatch existing Production Deploy and require exact-run success
        id: production
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              ref: 'main',
              inputs: {
                sha: targetSha,
                data_probe_path: '/api/healthz/data-plane',
                force_rebuild: 'false',
              },
              return_run_details: true,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10',
              },
            });
            const runId = Number(response.data?.workflow_run_id);
            if (response.status !== 200 || !Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Production dispatch returned invalid Run ID with HTTP ${response.status}.`);
              return;
            }
            core.setOutput('run_id', String(runId));
            core.info(`Production Deploy dispatched as Run ID ${runId}.`);

            const deadline = Date.now() + 42 * 60 * 1000;
            while (Date.now() < deadline) {
              const runResponse = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              const run = runResponse.data;
              if (run.head_sha !== targetSha
                || run.head_branch !== 'main'
                || run.event !== 'workflow_dispatch'
                || run.path !== '.github/workflows/production-deploy.yml') {
                core.setFailed('Dispatched Production run identity does not match the approved exact SHA.');
                return;
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`Production Deploy Run ID ${runId} completed with ${run.conclusion}.`);
                  return;
                }
                core.info(`Production Deploy Run ID ${runId} completed successfully.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`Production Deploy Run ID ${runId} did not complete inside the bounded wait.`);

      - name: Verify exact Production runtime and send one sanitized Telegram proof message
        id: smoke
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRE_ACTIVE_SHA: ${{ steps.before.outputs.active_sha }}
          PRE_PM_UPTIME: ${{ steps.before.outputs.pm_uptime }}
          PRE_LOG_SIZE: ${{ steps.before.outputs.log_size }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -Eeuo pipefail
          smoke_file="$(mktemp)"
          cleanup() { rm -f "$smoke_file"; }
          trap cleanup EXIT
          remote_env="$(printf 'TARGET_SHA=%q PRE_ACTIVE_SHA=%q PRE_PM_UPTIME=%q PRE_LOG_SIZE=%q SOURCE_COMMENT_ID=%q PUBLIC_BASE_URL=%q' \
            "$TARGET_SHA" "$PRE_ACTIVE_SHA" "$PRE_PM_UPTIME" "$PRE_LOG_SIZE" "$SOURCE_COMMENT_ID" "$PUBLIC_BASE_URL")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node -" > "$smoke_file" <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          (async () => {
            const targetSha = String(process.env.TARGET_SHA ?? '');
            const preActiveSha = String(process.env.PRE_ACTIVE_SHA ?? '');
            const prePmUptime = Number(process.env.PRE_PM_UPTIME ?? 0);
            const preLogSize = Number(process.env.PRE_LOG_SIZE ?? 0);
            const sourceCommentId = String(process.env.SOURCE_COMMENT_ID ?? '');
            const publicBaseUrl = String(process.env.PUBLIC_BASE_URL ?? '').replace(/\/+$/, '');
            if (!/^[0-9a-f]{40}$/.test(targetSha)) process.exit(2);

            const processes = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const selected = processes.find((item) => item.name === 'stock-app');
            const env = selected?.pm2_env;
            if (!env || env.status !== 'online') {
              console.error('Production PM2 process is not online.');
              process.exit(3);
            }
            if (String(env.DEPLOY_SHA ?? '') !== targetSha) {
              console.error('Production PM2 DEPLOY_SHA does not match the approved SHA.');
              process.exit(4);
            }
            const postPmUptime = Number(env.pm_uptime ?? 0);
            if (preActiveSha !== targetSha && !(postPmUptime > prePmUptime)) {
              console.error('Production PM2 process did not restart for the new exact SHA.');
              process.exit(5);
            }

            const markerPath = '/opt/stock-app/.deploy/current-sha';
            const markerSha = fs.existsSync(markerPath)
              ? fs.readFileSync(markerPath, 'utf8').trim()
              : '';
            if (markerSha !== targetSha) {
              console.error('Production deploy marker does not match the approved SHA.');
              process.exit(6);
            }

            const healthTargets = [
              'http://127.0.0.1:8080/api/health',
              `${publicBaseUrl}/api/health`,
            ];
            for (const url of healthTargets) {
              let response;
              try {
                response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              } catch {
                console.error('Production health request failed.');
                process.exit(7);
              }
              if (!response.ok) {
                console.error(`Production health returned HTTP ${response.status}.`);
                process.exit(8);
              }
              let value;
              try {
                value = await response.json();
              } catch {
                console.error('Production health returned invalid JSON.');
                process.exit(9);
              }
              const valid = value?.ok === true
                && value?.deploySha === targetSha
                && value?.processDeploySha === targetSha
                && value?.deployMarkerSha === targetSha
                && value?.identityMatch === true
                && value?.identityStatus === 'match';
              if (!valid) {
                console.error('Production health identity contract failed.');
                process.exit(10);
              }
            }

            if (String(env.LIVE_TELEGRAM_ACTIVATION_APPROVED ?? '') !== 'true') {
              console.error('LIVE_TELEGRAM_ACTIVATION_APPROVED is not enabled.');
              process.exit(11);
            }
            if (String(env.TELEGRAM_INTELLIGENCE_WORKER_ENABLED ?? 'true') === 'false') {
              console.error('Telegram intelligence worker is explicitly disabled.');
              process.exit(12);
            }
            const botToken = String(env.TELEGRAM_BOT_TOKEN ?? '').trim();
            const chatId = String(env.TELEGRAM_CHAT_ID ?? '').trim();
            if (!botToken || !chatId) {
              console.error('Telegram runtime configuration is incomplete.');
              process.exit(13);
            }

            const outLogPath = String(env.pm_out_log_path ?? '');
            if (!outLogPath || !fs.existsSync(outLogPath)) {
              console.error('Production PM2 output log is unavailable.');
              process.exit(14);
            }
            const logBuffer = fs.readFileSync(outLogPath);
            const start = preActiveSha === targetSha
              ? Math.max(0, logBuffer.length - 262144)
              : Math.min(Math.max(0, preLogSize), logBuffer.length);
            const newLog = logBuffer.subarray(start).toString('utf8');
            if (!newLog.includes('[telegram-intelligence-worker] started')) {
              console.error('Telegram intelligence worker startup evidence is missing.');
              process.exit(15);
            }

            const verifiedAt = new Date().toISOString();
            const text = [
              '✅ 텔레그램 운영 배포 검증 완료',
              `배포 SHA: ${targetSha}`,
              `검증 시각: ${verifiedAt}`,
              `검증 ID: ${sourceCommentId}`,
              '자동 리포트·신호 알림 전송 경로가 운영 서버에서 활성화되었습니다.',
              '실주문 권한: 없음',
            ].join('\n');

            let telegramResponse;
            try {
              telegramResponse = await fetch(
                `https://api.telegram.org/bot${encodeURIComponent(botToken)}/sendMessage`,
                {
                  method: 'POST',
                  headers: {
                    Accept: 'application/json',
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    chat_id: chatId,
                    text,
                    disable_web_page_preview: true,
                  }),
                  signal: AbortSignal.timeout(15000),
                },
              );
            } catch {
              console.error('Telegram Production verification request failed.');
              process.exit(16);
            }
            if (!telegramResponse.ok) {
              console.error(`Telegram Production verification returned HTTP ${telegramResponse.status}.`);
              process.exit(17);
            }
            let telegramValue;
            try {
              telegramValue = await telegramResponse.json();
            } catch {
              console.error('Telegram Production verification returned invalid JSON.');
              process.exit(18);
            }
            const messageId = Number(telegramValue?.result?.message_id);
            if (telegramValue?.ok !== true || !Number.isSafeInteger(messageId) || messageId <= 0) {
              console.error('Telegram API did not accept the Production verification message.');
              process.exit(19);
            }

            process.stdout.write(JSON.stringify({
              ok: true,
              exactSha: targetSha,
              identityMatch: true,
              workerStarted: true,
              telegramConfigured: true,
              telegramAccepted: true,
              messageId,
              verifiedAt,
              orderSubmitted: false,
              privateTradingApiCount: 0,
              liveTradingAuthority: false,
              secretsRecorded: false,
            }));
          })().catch(() => {
            console.error('Telegram Production verification failed safely.');
            process.exit(20);
          });
          NODE

          node - "$smoke_file" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid = value?.ok === true
            && value?.identityMatch === true
            && value?.workerStarted === true
            && value?.telegramConfigured === true
            && value?.telegramAccepted === true
            && Number.isSafeInteger(value?.messageId)
            && value?.messageId > 0
            && value?.orderSubmitted === false
            && value?.privateTradingApiCount === 0
            && value?.liveTradingAuthority === false
            && value?.secretsRecorded === false;
          if (!valid) {
            console.error('Sanitized Telegram Production proof failed validation.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `message_id=${value.messageId}`,
            `verified_at=${value.verifiedAt}`,
            '',
          ].join('\n'));
          console.log(JSON.stringify(value));
          NODE

      - name: Record sanitized Production completion evidence
        if: success()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRODUCTION_RUN_ID: ${{ steps.production.outputs.run_id }}
          TELEGRAM_MESSAGE_ID: ${{ steps.smoke.outputs.message_id }}
          VERIFIED_AT: ${{ steps.smoke.outputs.verified_at }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Telegram-only Production release completed and verified.',
                '',
                `- Exact Production SHA: \`${process.env.TARGET_SHA}\``,
                `- Production Deploy Run ID: \`${process.env.PRODUCTION_RUN_ID}\``,
                '- Public and loopback health identity: `MATCH`',
                '- Telegram worker startup: `VERIFIED`',
                '- Telegram runtime configuration: `VERIFIED`',
                '- Telegram API accepted verification message: `true`',
                `- Telegram message ID: \`${process.env.TELEGRAM_MESSAGE_ID}\``,
                `- Verified at: \`${process.env.VERIFIED_AT}\``,
                '- Order submitted: `false`',
                '- Private trading API count: `0`',
                '- Live trading authority: `false`',
                '- Secret values recorded: `false`',
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              ].join('\n'),
            });

      - name: Record sanitized failure evidence
        if: failure()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRODUCTION_RUN_ID: ${{ steps.production.outputs.run_id }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Telegram-only Production release failed safely.',
                '',
                `- Target SHA: \`${process.env.TARGET_SHA || 'unresolved'}\``,
                `- Production Deploy Run ID: \`${process.env.PRODUCTION_RUN_ID || 'not-dispatched'}\``,
                '- Secret values recorded: `false`',
                '- Order submitted by Telegram verification: `false`',
                '- Production status must be inspected before any retry.',
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                `- Release Gate Run ID: \`${context.runId}\``,
              ].join('\n'),
            });
