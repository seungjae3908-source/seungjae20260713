name: Room A V3 Hardening Apply

on:
  push:
    branches:
      - 'feat/room-a-v3-scheduled-capture-seam-20260830'
    paths:
      - '.room-a/v3-hardening.tgz.b64'
      - '.github/workflows/room-a-v3-hardening-apply.yml'

permissions:
  contents: write

concurrency:
  group: room-a-v3-hardening-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/room-a-v3-scheduled-capture-seam-20260830'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact bounded branch
        uses: actions/checkout@v4
        with:
          ref: feat/room-a-v3-scheduled-capture-seam-20260830
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/feat/room-a-v3-scheduled-capture-seam-20260830'

      - name: Materialize and verify bounded hardening payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3-hardening
          base64 -d .room-a/v3-hardening.tgz.b64 > /tmp/v3-hardening.tgz
          echo 'aa929e9780a126fc925d9369ab1cddfb3ba92908fe0b2ff8cd7f8b1a631caaec  /tmp/v3-hardening.tgz' | sha256sum -c -
          tar -xzf /tmp/v3-hardening.tgz -C /tmp/v3-hardening
          echo '4501124ed8b3322364a0208a05b04283d9533ee004c083a47b6260f48ff65374  /tmp/v3-hardening/runner-new.mjs' | sha256sum -c -
          echo '45dc084de2d3a48d03334b794eadf434aa0b7be0409b0953f4efc83e50a5d792  /tmp/v3-hardening/workflow-new.yml' | sha256sum -c -
          echo '53009271bdd232954696d76cb86cbdc60b0a9c417821f4c8505f2e3aadf00365  /tmp/v3-hardening/test-new.mjs' | sha256sum -c -
          echo 'b7938a0c6a9687309a59fb60a5a1069c5bfe3d488e54d02be6cead4f2d96cedf  /tmp/v3-hardening/contract-new.json' | sha256sum -c -

      - name: Validate complete final file set in working tree
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v3-hardening/runner-new.mjs market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs
          cp /tmp/v3-hardening/workflow-new.yml .github/workflows/public-forward-liquidity-calibration-scheduled-v3.yml
          cp /tmp/v3-hardening/test-new.mjs market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs
          cp /tmp/v3-hardening/contract-new.json market-intelligence-sidecar/config/public-forward-liquidity-v3-activation-contract.json
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs
          node --check market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs
          node --test market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs
          test "$(git hash-object market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs)" = 'ffbf7d89169088321dfab8c13f41e9e8b5043544'
          test "$(git hash-object .github/workflows/public-forward-liquidity-calibration-scheduled-v3.yml)" = '610a40b1db24ef480178f9e457f588fa037137f3'
          test "$(git hash-object market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs)" = '44221f34526cd5a9ef047b7373219ba26901ba28'
          test "$(git hash-object market-intelligence-sidecar/config/public-forward-liquidity-v3-activation-contract.json)" = '3f3be099a7f7a66a7cbda8a42e5aea0435e86606'

      - name: Stage non-workflow hardening files and exact future workflow blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .room-a
          cp /tmp/v3-hardening/workflow-new.yml .room-a/public-forward-liquidity-calibration-scheduled-v3.final.yml
          git checkout -- .github/workflows/public-forward-liquidity-calibration-scheduled-v3.yml
          rm -f .room-a/v3-hardening.tgz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            market-intelligence-sidecar/config/public-forward-liquidity-v3-activation-contract.json \
            market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs \
            market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs \
            .room-a/v3-hardening.tgz.b64 \
            .room-a/public-forward-liquidity-calibration-scheduled-v3.final.yml
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow path must not be pushed by GITHUB_TOKEN.' >&2
            exit 1
          fi
          git commit -m 'fix(full-cost): stage V3 slot completion and window audit hardening'
          git push origin HEAD:refs/heads/feat/room-a-v3-scheduled-capture-seam-20260830
