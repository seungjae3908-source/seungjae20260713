name: Phase 12 Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: phase12-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase12-diagnostic:
    name: Isolate Phase 12 verifier failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install workspace dependencies with frozen lockfile
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Run Phase 12 test files
        run: node ./test.mjs phase12
      - name: Verify staging deploy script contract
        run: node ./scripts/verify-staging-deploy-script-contract.mjs
      - name: Verify staging bootstrap contract
        run: node ./scripts/verify-staging-bootstrap-contract.mjs
      - name: Verify paper journal privilege contract
        run: node ./scripts/verify-paper-journal-privilege-contract.mjs
      - name: Verify member permission audit contract
        run: node ./scripts/verify-member-permission-audit-contract.mjs
      - name: Verify AI preview diagnostic contract
        run: node ./scripts/verify-ai-preview-diagnostic-contract.mjs
      - name: Test staging PostgreSQL auth
        run: node ./scripts/test-staging-postgres-auth.mjs
      - name: Verify staging PostgreSQL auth contract
        run: node ./scripts/verify-staging-postgres-auth-contract.mjs
      - name: Verify staging login selector contract
        run: node ./scripts/verify-staging-login-selector-contract.mjs
      - name: Verify profile request coordinator contract
        run: node ./scripts/verify-profile-request-coordinator-contract.mjs
      - name: Verify server readonly diagnostics contract
        run: node ./scripts/verify-server-readonly-diagnostics-contract.mjs
      - name: Verify staging artifact sanitization contract
        run: node ./scripts/verify-staging-artifact-sanitization-contract.mjs
      - name: Upload Phase 12 failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-failures-${{ github.run_id }}
          path: api-server/phase12-failures.txt
          if-no-files-found: warn
          retention-days: 2
