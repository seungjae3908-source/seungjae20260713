name: Phase 12 Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: phase12-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase12-diagnostic:
    name: Capture exact Phase 12 failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Run Phase 12 tests
        id: phase12
        continue-on-error: true
        run: pnpm --dir api-server run test:phase12
      - name: Upload Phase 12 failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-failures-${{ github.run_id }}
          path: api-server/phase12-failures.txt
          if-no-files-found: warn
          retention-days: 2
      - name: Preserve Phase 12 result
        if: steps.phase12.outcome != 'success'
        run: exit 1
