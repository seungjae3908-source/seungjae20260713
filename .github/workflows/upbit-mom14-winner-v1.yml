name: Upbit Momentum 14 Winner V1

on:
  push:
    branches:
      - research/four-market-profitability-scan-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-upbit-mom14-winner-v1.js
      - .github/workflows/upbit-mom14-winner-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run Upbit 14d large-winner momentum
        run: node market-prediction-lab/scripts/run-upbit-mom14-winner-v1.js
      - name: Verify research-only formula contract
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const d=JSON.parse(await readFile("market-prediction-lab/artifacts/upbit-mom14-winner-v1/result.json","utf8"));
          if(d.status!=="pass"||d.researchOnly!==true||d.publicDataOnly!==true||d.actualOrders!==0||d.formula.lookbackDays!==14||d.formula.holdingDays!==7||d.formula.longOnly!==true) process.exit(1);
          console.log("UPBIT_MOM14_CONTRACT=PASS");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: upbit-mom14-winner-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/upbit-mom14-winner-v1/
          if-no-files-found: error
          retention-days: 30
