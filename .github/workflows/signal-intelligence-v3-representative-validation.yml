name: Signal Intelligence V3 Representative Validation

on:
  pull_request:
    paths:
      - 'signal-intelligence-v3/**'
      - 'market-prediction-lab/**'
      - '.github/workflows/signal-intelligence-v3-representative-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-intelligence-v3-representative-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-search-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle representative current-search harness
        run: |
          mkdir -p api-server/.signal-intelligence "$RUNNER_TEMP/representative"
          pnpm --dir api-server exec esbuild ../signal-intelligence-v3/scripts/run-representative-search-matrix.ts \
            --bundle --platform=node --format=esm --target=node20 --packages=external \
            --outfile=./.signal-intelligence/representative-search.mjs
          node --check api-server/.signal-intelligence/representative-search.mjs
      - name: Run 23 assets x 3 strategy profiles
        working-directory: api-server
        env:
          SIGNAL_INTELLIGENCE_SERVICE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIVE_TRADING: 'false'
          PRIVATE_API_ENABLED: 'false'
          ORDER_AUTHORITY: 'false'
          SIGNAL_INTELLIGENCE_EXECUTION_AUTHORITY: NONE
        run: |
          node .signal-intelligence/representative-search.mjs \
            "$RUNNER_TEMP/representative/current-search.json" \
            "$RUNNER_TEMP/representative/current-search.md"
      - name: Assert safety and matrix shape
        run: |
          node - <<'NODE' "$RUNNER_TEMP/representative/current-search.json"
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.executionAuthority !== 'NONE' || p.publicDataOnly !== true) process.exit(1);
          if (p.representativeCount !== 23 || p.rowCount !== 69) process.exit(1);
          for (const row of p.rows) {
            if (!['CANDIDATE','VALID_NO_TRADE','SEARCH_FAILURE','TECHNICAL_FAILURE'].includes(row.status)) process.exit(1);
            if (row.market !== 'CRYPTO_FUTURES' && Array.isArray(row.v3Rows) && row.v3Rows.some((r) => !['BUY', null].includes(r.direction))) process.exit(1);
          }
          NODE
      - name: Upload current-search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-v3-representative-search-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/representative
          retention-days: 90
          if-no-files-found: warn

  long-history:
    strategy:
      fail-fast: false
      matrix:
        scope: [stocks, spot, futures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run representative long-history matrix
        run: |
          mkdir -p "$RUNNER_TEMP/history"
          node market-prediction-lab/scripts/run-representative-history-matrix.js \
            "${{ matrix.scope }}" \
            "$RUNNER_TEMP/history/${{ matrix.scope }}.json" \
            "$RUNNER_TEMP/history/${{ matrix.scope }}.md"
      - name: Assert no fabricated history or execution authority
        run: |
          node - <<'NODE' "$RUNNER_TEMP/history/${{ matrix.scope }}.json"
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.researchOnly !== true || p.liveExecutionAllowed !== false || p.privateAccountRequestAllowed !== false || p.actualOrders !== 0) process.exit(1);
          if (!Array.isArray(p.rows) || p.rows.length === 0) process.exit(1);
          for (const row of p.rows) {
            if (row.coverage2010 === false && !row.reason && row.status !== 'TECHNICAL_FAILURE') process.exit(1);
          }
          NODE
      - name: Upload history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-v3-long-history-${{ matrix.scope }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/history
          retention-days: 90
          if-no-files-found: warn

  canonical-pnl:
    strategy:
      fail-fast: false
      matrix:
        scope: [stocks, spot, futures]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run existing canonical cost-aware validators
        working-directory: market-prediction-lab
        run: |
          mkdir -p docs/representative
          if [ "${{ matrix.scope }}" = "stocks" ]; then
            npm run research:stocks:pnl -- docs/representative/stock-pnl.json
            npm run research:stocks:generalization -- docs/representative/stock-generalization.json
          elif [ "${{ matrix.scope }}" = "spot" ]; then
            npm run research:spot:upbit:pnl -- docs/representative/spot-pnl.json
          else
            npm run research:futures:pnl -- docs/representative/futures-pnl.json
          fi
      - name: Upload canonical profitability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-v3-canonical-pnl-${{ matrix.scope }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: market-prediction-lab/docs/representative
          retention-days: 90
          if-no-files-found: warn

  crypto-long-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run existing long-history V1/V2 crypto evidence
        working-directory: market-prediction-lab
        run: |
          mkdir -p docs/representative
          npm run backtest:v1:history -- representative-long-v1 docs/representative/long-v1.json docs/representative/long-v1.md
      - name: Upload long V1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-v3-crypto-long-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            market-prediction-lab/representative-long-v1
            market-prediction-lab/docs/representative/long-v1.json
            market-prediction-lab/docs/representative/long-v1.md
          retention-days: 90
          if-no-files-found: warn

  provenance:
    needs: [current-search-matrix, long-history, canonical-pnl, crypto-long-v1]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize exact-head safety verdict
        run: |
          echo "exact_sha=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "current_search=${{ needs.current-search-matrix.result }}"
          echo "long_history=${{ needs.long-history.result }}"
          echo "canonical_pnl=${{ needs.canonical-pnl.result }}"
          echo "crypto_long_v1=${{ needs.crypto-long-v1.result }}"
          echo "executionAuthority=NONE"
          echo "privateTradingApiAllowed=false"
          echo "realOrderAllowed=false"
