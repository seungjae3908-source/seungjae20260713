name: One-Time Production Approval

on:
  pull_request:
    paths:
      - .github/workflows/production-one-time-approval.yml
      - .github/workflows/production-deploy.yml
      - .github/workflows/staging-readiness.yml
      - ops/production-approval.json
      - api-server/scripts/verify-production-one-time-approval.mjs
      - api-server/scripts/build-staging-verdict.mjs
      - api-server/scripts/verify-staging-verdict.mjs
  push:
    branches: [main]
    paths:
      - ops/production-approval.json

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: one-time-production-owner-approval
  cancel-in-progress: false

jobs:
  validate:
    name: Validate one-time production approval safeguards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify one-time production approval contract
        run: node api-server/scripts/verify-production-one-time-approval.mjs

  dispatch:
    name: Wait for release-ready staging verdict and dispatch official production deployment
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: write
      contents: read
      issues: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate immutable one-time owner approval
        id: approval
        env:
          TARGET_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const approval = JSON.parse(fs.readFileSync('ops/production-approval.json', 'utf8'));
          const expectedKeys = ['approved', 'approvedBy', 'approvalMessage', 'sourceMainSha', 'oneTime', 'requestedAt'];
          const actualKeys = Object.keys(approval).sort();
          if (JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys.sort())) {
            throw new Error(`Unexpected production approval fields: ${actualKeys.join(', ')}`);
          }
          if (approval.approved !== true) throw new Error('Production approval is not true.');
          if (approval.approvedBy !== 'seungjae3908-source') throw new Error('Production approval owner mismatch.');
          if (approval.approvalMessage !== '운영배포승인') throw new Error('Exact user approval message is missing.');
          if (approval.oneTime !== true) throw new Error('Approval must be one-time only.');
          if (!/^[0-9a-f]{40}$/.test(approval.sourceMainSha)) throw new Error('sourceMainSha must be an exact lowercase SHA.');
          if (typeof approval.requestedAt !== 'string' || !approval.requestedAt.length) throw new Error('requestedAt is required.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${approval.sourceMainSha}\n`);
          NODE
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Exact lowercase target SHA required.' >&2; exit 1; }
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Exact push before SHA required.' >&2; exit 1; }
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || { echo 'Approval workflow must run on exact current main.' >&2; exit 1; }

      - name: Require approval file changed in this exact push
        uses: actions/github-script@v7
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.approval.outputs.source_sha }}
        with:
          script: |
            const before = process.env.BEFORE_SHA;
            const target = process.env.TARGET_SHA;
            const source = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(source)) {
              core.setFailed('Validated source approval SHA output is missing.');
              return;
            }
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: before,
              head: target,
              per_page: 100,
            });
            const approvalChange = (comparison.data.files ?? []).find((file) => file.filename === 'ops/production-approval.json');
            if (!approvalChange || !['added', 'modified'].includes(approvalChange.status)) {
              core.setFailed('The one-time approval file was not added or modified by this exact main push.');
              return;
            }
            const sourceComparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: source,
              head: target,
              per_page: 100,
            });
            if (!['ahead', 'identical'].includes(sourceComparison.data.status)) {
              core.setFailed('The approved source main SHA is not an ancestor of the deployment target.');
              return;
            }
            const allowed = new Set([
              '.github/workflows/production-one-time-approval.yml',
              '.github/workflows/production-deploy.yml',
              '.github/workflows/staging-readiness.yml',
              '.github/workflows/staging-dispatch-bridge.yml',
              '.github/workflows/staging-status-bridge.yml',
              'api-server/scripts/verify-production-one-time-approval.mjs',
              'api-server/scripts/verify-phase10-deployment-safety.mjs',
              'api-server/scripts/build-staging-verdict.mjs',
              'api-server/scripts/verify-staging-verdict.mjs',
              'stock-analyzer/e2e/phase10-staging-readiness.spec.ts',
              'stock-analyzer/playwright.config.ts',
              'ops/production-approval.json',
            ]);
            const unexpected = (sourceComparison.data.files ?? [])
              .map((file) => file.filename)
              .filter((filename) => !allowed.has(filename));
            if (unexpected.length) {
              core.setFailed(`Unapproved files changed after the user's approval: ${unexpected.join(', ')}`);
            }

      - name: Record approval workflow start
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.approval.outputs.source_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'One-time owner-approved production gate started.',
                '',
                `- Approved source main SHA: \`${process.env.SOURCE_SHA}\``,
                `- Exact deployment target SHA: \`${process.env.TARGET_SHA}\``,
                `- Approval message: \`운영배포승인\``,
                `- Approval workflow Run ID: \`${context.runId}\``,
                `- Approval workflow: [Open GitHub Actions run](${runUrl})`,
                '- Waiting for: required CI 6/6 and exact-SHA staging-verdict.json with release_ready=true, failed=0, skipped=0',
                '- Production deployment executed at this point: `false`',
              ].join('\n'),
            });

      - name: Wait for required CI
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 75; attempt += 1) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: targetSha,
                per_page: 100,
              });
              statuses.sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
              const latest = new Map();
              for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status.state);
              const missing = required.filter((name) => latest.get(name) !== 'success');
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                branch: 'main',
                event: 'push',
                per_page: 100,
              });
              const applicationRuns = runs
                .filter((run) => run.name === 'Application CI' && run.head_sha === targetSha && run.head_branch === 'main' && run.event === 'push')
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
              const successfulRun = applicationRuns.find((run) => run.status === 'completed' && run.conclusion === 'success');
              if (!missing.length && successfulRun) {
                core.info(`Required CI verified by Application CI Run ID ${successfulRun.id}.`);
                return;
              }
              const activeRun = applicationRuns.find((run) => run.status !== 'completed');
              const failedRun = applicationRuns.find((run) => run.status === 'completed' && run.conclusion !== 'success');
              if (failedRun && !activeRun) {
                core.setFailed(`Application CI failed for exact target SHA in Run ID ${failedRun.id}.`);
                return;
              }
              core.info(`CI wait ${attempt}/75; missing: ${missing.join(', ') || 'successful main push run'}`);
              await sleep(20000);
            }
            core.setFailed('Timed out waiting for all six required statuses and successful Application CI main push run.');

      - name: Wait for successful exact-SHA staging verdict artifact
        id: verdict-artifact
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const artifactName = `staging-verdict-${targetSha}`;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: artifactName,
                per_page: 100,
              });
              const candidates = artifacts
                .filter((artifact) => !artifact.expired && artifact.workflow_run?.head_sha === targetSha)
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
              for (const artifact of candidates) {
                const response = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: artifact.workflow_run.id,
                });
                const run = response.data;
                const valid = run.event === 'workflow_dispatch'
                  && run.head_branch === 'main'
                  && run.head_sha === targetSha
                  && run.path === '.github/workflows/staging-readiness.yml'
                  && run.status === 'completed'
                  && run.conclusion === 'success';
                if (valid) {
                  core.setOutput('run_id', String(run.id));
                  core.setOutput('artifact_id', String(artifact.id));
                  core.info(`Release-ready staging artifact found in Run ID ${run.id}.`);
                  return;
                }
              }
              core.info(`Staging verdict wait ${attempt}/120; exact release-ready artifact not found yet.`);
              await sleep(20000);
            }
            core.setFailed('Timed out waiting for a successful exact-SHA staging verdict artifact.');

      - name: Download exact staging verdict artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-verdict-${{ github.sha }}
          path: staging-verdict
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verdict-artifact.outputs.run_id }}

      - name: Verify exact release-ready staging verdict
        env:
          TARGET_SHA: ${{ github.sha }}
        run: node api-server/scripts/verify-staging-verdict.mjs staging-verdict/staging-verdict.json

      - name: Dispatch and confirm official production workflow
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
          STAGING_RUN_ID: ${{ steps.verdict-artifact.outputs.run_id }}
        with:
          script: |
            const workflowId = 'production-deploy.yml';
            const apiVersion = '2026-03-10';
            const gateRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            });
            if (workflow.data.state !== 'active') {
              core.setFailed(`Official workflow ${workflowId} is not active.`);
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.TARGET_SHA,
              branch: 'main',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const exactRuns = runs
              .filter((run) => run.name === 'Production Deploy'
                && run.path === '.github/workflows/production-deploy.yml'
                && run.head_sha === process.env.TARGET_SHA)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            const existing = exactRuns.find((run) => run.status !== 'completed')
              ?? exactRuns.find((run) => run.status === 'completed' && run.conclusion === 'success');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 23,
                body: [
                  'Official production deployment was not duplicated.',
                  '',
                  `- Target SHA: \`${process.env.TARGET_SHA}\``,
                  `- Existing Production Run ID: \`${existing.id}\``,
                  `- Existing run: [Open GitHub Actions run](${existing.html_url})`,
                  `- Status: \`${existing.status}\``,
                  `- Conclusion: \`${existing.conclusion ?? 'pending'}\``,
                  `- Release-ready staging Run ID: \`${process.env.STAGING_RUN_ID}\``,
                  `- Approval workflow Run ID: \`${context.runId}\``,
                  `- Approval workflow: [Open approval run](${gateRunUrl})`,
                ].join('\n'),
              });
              return;
            }
            const dispatchResponse = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: { sha: process.env.TARGET_SHA, force_rebuild: 'false' },
              return_run_details: true,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': apiVersion,
              },
            });
            const runId = Number(dispatchResponse.data?.workflow_run_id);
            if (dispatchResponse.status !== 200 || !Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Official production dispatch returned invalid Run ID with HTTP ${dispatchResponse.status}.`);
              return;
            }
            const runResponse = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = runResponse.data;
            const valid = run.event === 'workflow_dispatch'
              && run.head_branch === 'main'
              && run.head_sha === process.env.TARGET_SHA
              && run.path === '.github/workflows/production-deploy.yml';
            if (!valid) {
              core.setFailed('Returned production run does not match the official workflow, main branch, and exact target SHA.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Official owner-approved production deployment workflow run created.',
                '',
                `- Target SHA: \`${process.env.TARGET_SHA}\``,
                `- Production Run ID: \`${runId}\``,
                `- Production run: [Open GitHub Actions run](${run.html_url})`,
                `- Status: \`${run.status}\``,
                '- Workflow: `Production Deploy`',
                '- Ref: `main`',
                '- Force rebuild: `false`',
                '- GitHub environment: `production`',
                `- Release-ready staging Run ID: \`${process.env.STAGING_RUN_ID}\``,
                `- Approval workflow Run ID: \`${context.runId}\``,
                `- Approval workflow: [Open approval run](${gateRunUrl})`,
              ].join('\n'),
            });

      - name: Record approval gate failure
        if: failure()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'One-time production approval gate failed before confirmed production completion.',
                '',
                `- Target SHA: \`${process.env.TARGET_SHA}\``,
                `- Approval workflow Run ID: \`${context.runId}\``,
                `- Approval workflow: [Open failed run](${runUrl})`,
                '- Production success must not be assumed.',
                '- Next action: inspect the exact failed Job and original logs before any retry.',
              ].join('\n'),
            });
