name: PR182 Phase12 Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/user-broker-telegram-execution
    paths:
      - .github/workflows/pr182-phase12-diagnostic.yml
      - api-server/src/features/user-broker-telegram/**
      - api-server/test.mjs

permissions:
  contents: read

jobs:
  isolate:
    name: phase12 ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: service
            entry: src/features/user-broker-telegram/user-broker-telegram.service.test.ts
          - label: bridge
            entry: src/features/user-broker-telegram/trade-execution-event-bridge.service.test.ts
          - label: runtime
            entry: src/features/user-broker-telegram/user-broker-telegram.runtime.test.ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle isolated test
        working-directory: api-server
        run: >-
          pnpm exec esbuild "${{ matrix.entry }}"
          --bundle
          --platform=node
          --format=cjs
          --target=node20
          --sourcemap=inline
          --log-level=warning
          --outfile="/tmp/pr182-${{ matrix.label }}.test.cjs"
      - name: Run isolated test
        run: node --test "/tmp/pr182-${{ matrix.label }}.test.cjs"
