name: PR182 Phase12 Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/user-broker-telegram-execution
    paths:
      - .github/workflows/pr182-phase12-diagnostic.yml
      - api-server/src/features/user-broker-telegram/**
      - api-server/test.mjs

permissions:
  contents: read

jobs:
  isolate-runtime:
    name: runtime ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: paper-bridge
            pattern: "paper approval -> execution bridge"
          - label: risk-reject
            pattern: "risk reject creates no broker order"
          - label: telegram-retry
            pattern: "Telegram failure schedules retry"
          - label: manual-notify
            pattern: "manual canonical entry notifies Telegram"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle runtime test
        working-directory: api-server
        run: >-
          pnpm exec esbuild src/features/user-broker-telegram/user-broker-telegram.runtime.test.ts
          --bundle
          --platform=node
          --format=cjs
          --target=node20
          --sourcemap=inline
          --log-level=warning
          --outfile="/tmp/pr182-runtime.test.cjs"
      - name: Run isolated runtime case
        run: node --test --test-name-pattern="${{ matrix.pattern }}" /tmp/pr182-runtime.test.cjs
