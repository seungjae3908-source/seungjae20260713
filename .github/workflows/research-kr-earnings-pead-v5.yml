name: Research KR Earnings PEAD V5

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-kr-earnings-pead-v5.py
      - .github/workflows/research-kr-earnings-pead-v5.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-kr-earnings-pead-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pead:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-kr-earnings-pead-v5.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-kr-dart-event-v4.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "requests>=2.32,<3" "finance-datareader>=0.9.90" "huggingface_hub>=0.30,<1"
      - name: Run KR earnings PEAD V5
        run: |
          python market-prediction-lab/scripts/run-kr-earnings-pead-v5.py \
            --out-dir market-prediction-lab/docs/kr-earnings-pead-v5
      - name: Upload V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-earnings-pead-v5-${{ github.sha }}
          path: market-prediction-lab/docs/kr-earnings-pead-v5
          if-no-files-found: error
          retention-days: 14
