name: Four Market Profitability Scan V1

on:
  push:
    branches:
      - research/four-market-profitability-scan-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-binance-funding-carry-v1.py
      - .github/workflows/four-market-profitability-scan-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run KR cross-sectional momentum
        id: run
        shell: bash
        run: |
          set +e
          node market-prediction-lab/scripts/run-kr-cross-sectional-momentum-suite.js market-prediction-lab/artifacts/four-market-scan/kr-momentum.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-market-kr-momentum-${{ github.sha }}
          path: market-prediction-lab/artifacts/four-market-scan/kr-momentum.json
          if-no-files-found: error
      - name: Preserve suite conclusion
        run: test "${{ steps.run.outputs.rc }}" = "0"

  stock-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run KR and US breakout PnL
        id: run
        shell: bash
        run: |
          set +e
          node market-prediction-lab/scripts/run-stock-pnl-suite.js market-prediction-lab/artifacts/four-market-scan/stock-pnl.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-market-stock-pnl-${{ github.sha }}
          path: market-prediction-lab/artifacts/four-market-scan/stock-pnl.json
          if-no-files-found: error
      - name: Preserve suite conclusion
        run: test "${{ steps.run.outputs.rc }}" = "0"

  us-pullback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run US trend-pullback holdout
        id: run
        shell: bash
        run: |
          set +e
          node market-prediction-lab/scripts/run-us-pullback-suite.js market-prediction-lab/artifacts/four-market-scan/us-pullback.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-market-us-pullback-${{ github.sha }}
          path: market-prediction-lab/artifacts/four-market-scan/us-pullback.json
          if-no-files-found: error
      - name: Preserve suite conclusion
        run: test "${{ steps.run.outputs.rc }}" = "0"

  upbit-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run Upbit alternative strategy holdout
        id: alt
        shell: bash
        run: |
          set +e
          node market-prediction-lab/scripts/run-upbit-spot-alternative-suite.js market-prediction-lab/artifacts/four-market-scan/upbit-alt.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run Upbit breakout PnL
        id: pnl
        shell: bash
        run: |
          set +e
          node market-prediction-lab/scripts/run-upbit-spot-pnl-suite.js market-prediction-lab/artifacts/four-market-scan/upbit-pnl.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-market-upbit-spot-${{ github.sha }}
          path: market-prediction-lab/artifacts/four-market-scan/upbit-*.json
          if-no-files-found: error
      - name: Preserve suite conclusion
        run: test "${{ steps.alt.outputs.rc }}" = "0" -a "${{ steps.pnl.outputs.rc }}" = "0"

  futures-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run Bitget futures regime/execution
        id: run
        shell: bash
        run: |
          set +e
          node market-prediction-lab/scripts/run-futures-regime-execution-suite.js market-prediction-lab/artifacts/four-market-scan/futures-regime.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-market-futures-regime-${{ github.sha }}
          path: market-prediction-lab/artifacts/four-market-scan/futures-regime.json
          if-no-files-found: error
      - name: Preserve suite conclusion
        run: test "${{ steps.run.outputs.rc }}" = "0"

  funding-carry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-binance-funding-carry-v1.py
      - name: Run public-data-only funding carry
        run: python market-prediction-lab/scripts/run-binance-funding-carry-v1.py
      - name: Verify safety and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("market-prediction-lab/artifacts/binance-funding-carry-v1/result.json")
          d=json.loads(p.read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert len(d["symbols"]) == 4
          assert all(v["funding_status"]=="BINANCE_VISION_OK" for v in d["provenance"].values())
          print("SAFETY_PROVENANCE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: four-market-funding-carry-${{ github.sha }}
          path: market-prediction-lab/artifacts/binance-funding-carry-v1/
          if-no-files-found: error
          retention-days: 30
