name: Research Upbit Overnight Intraday Replay V4

on:
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/run-upbit-overnight-intraday-replay-v4.mjs
      - .github/workflows/research-upbit-overnight-intraday-replay-v4.yml
      - market-prediction-lab/src/adaptive-multi-evidence-price-structure-v2.js
      - market-prediction-lab/src/adaptive-multi-evidence-point-in-time-v2.js

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public research-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check market-prediction-lab/scripts/run-upbit-overnight-intraday-replay-v4.mjs
          ! grep -Eiq 'UPBIT_ACCESS_KEY|UPBIT_SECRET_KEY|LIVE_TRADING|REAL_ORDER_ENABLED|PRIVATE_TRADING_API_ALLOWED|(^|[^A-Za-z])withdraw([^A-Za-z]|$)|(^|[^A-Za-z])transfer([^A-Za-z]|$)|(^|[^A-Za-z])orderSubmitted([^A-Za-z]|$)' market-prediction-lab/scripts/run-upbit-overnight-intraday-replay-v4.mjs
      - name: Run fixed V4 on fresh symbol holdout
        working-directory: market-prediction-lab
        run: node scripts/run-upbit-overnight-intraday-replay-v4.mjs docs/upbit-overnight-intraday-replay-v4.json
      - name: Assert fresh cohort and safety
        working-directory: market-prediction-lab
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('docs/upbit-overnight-intraday-replay-v4.json','utf8'));
          if(r.status!=='pass') throw new Error('STATUS');
          if(r.fixedPolicy.parameterSearchPerformed!==false||r.fixedPolicy.familySearchPerformed!==false) throw new Error('SEARCH_FORBIDDEN');
          if(r.universe.freshHoldout.length!==12||r.universe.freshHoldoutRanks!=='25-36') throw new Error('FRESH_HOLDOUT');
          if(!r.lookahead.guardPassed||r.lookahead.freshHoldoutSymbolsUsedForDesign!==false||!r.lookahead.D1UsesPriorCompletedDailyCandle||!r.lookahead.intradayUsesCompleted15mAnd1hOnly||!r.lookahead.entryNext15mOpen) throw new Error('LOOKAHEAD');
          if(r.safety.researchOnly!==true||r.safety.publicDataOnly!==true||r.safety.executionAuthority!=='NONE'||r.safety.profitabilityPromotionAllowed!==false) throw new Error('SAFETY');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: upbit-overnight-intraday-replay-v4-${{ github.event.pull_request.head.sha }}
          path: market-prediction-lab/docs/upbit-overnight-intraday-replay-v4.json
          if-no-files-found: error
          retention-days: 30
