name: Research Paper Dataset Prewire Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'api-server/src/services/research-same-candidate-prewire.service.ts'
      - 'api-server/src/services/research-paper-dataset-identity-prewire.test.ts'
      - '.github/workflows/research-paper-dataset-prewire-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Backend typecheck
        run: pnpm --dir api-server run typecheck
      - name: Bundle focused regression
        run: |
          pnpm --dir api-server exec esbuild \
            src/services/research-paper-dataset-identity-prewire.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile="$RUNNER_TEMP/research-paper-dataset-prewire.test.mjs"
      - name: Run focused regression
        run: node --test "$RUNNER_TEMP/research-paper-dataset-prewire.test.mjs"
      - name: Verify fail-closed authority
        run: |
          set -euo pipefail
          file='api-server/src/services/research-same-candidate-prewire.service.ts'
          grep -Fq "datasetIdentity = text(identity?.datasetIdentity)" "$file"
          grep -Fq "RUNTIME_RESEARCH_DATASET_IDENTITY_UNAVAILABLE" "$file"
          grep -Fq "executionAuthority: 'NONE'" "$file"
          grep -Fq "profitabilityProven: false" "$file"
          grep -Fq "productionMutationAllowed: false" "$file"
