name: Temporary Liquidity Receipt Chain V3 Escape Fix

on:
  push:
    branches:
      - feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
    paths:
      - '.github/workflows/tmp-liquidity-receipt-chain-v3-escape-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
      - name: Repair V3 generated path normalization and retrigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/tmp-liquidity-receipt-chain-patch-v3.yml')
          s = p.read_text()
          s, n = re.subn(
              r"datasetRelativePath: datasetRelativePath\.replace\([^\n]+",
              "datasetRelativePath: datasetRelativePath.replaceAll(String.fromCharCode(92), '/'),",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('V3 path-normalization line not found')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-liquidity-receipt-chain-patch-v3.yml
          git rm .github/workflows/tmp-liquidity-receipt-chain-v3-escape-fix.yml
          git commit -m 'chore: make receipt-chain patch path normalization escape-safe'
          git push origin HEAD:feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
