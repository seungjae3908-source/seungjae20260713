name: Temporary Scanner Bounded Patch

on:
  push:
    branches:
      - fix/scanner-bounded-staging-readiness

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[scanner-patch-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-bounded-staging-readiness
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply deterministic scanner patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          # Make external aborts settle immediately even when a provider ignores AbortSignal.
          replace_once(
              'api-server/src/lib/bounded-work-pool.ts',
              '''async function runWithTimeout<Result>(
            task: Promise<Result>,
            controller: AbortController,
            timeoutMs: number,
          ): Promise<Result> {
            let timer: NodeJS.Timeout | undefined;
            try {
              return await Promise.race([
                task,
                new Promise<never>((_resolve, reject) => {
                  timer = setTimeout(() => {
                    controller.abort(new BoundedWorkTimeoutError(timeoutMs));
                    reject(new BoundedWorkTimeoutError(timeoutMs));
                  }, timeoutMs);
                }),
              ]);
            } finally {
              if (timer) clearTimeout(timer);
            }
          }
          ''',
              '''async function runWithTimeout<Result>(
            task: Promise<Result>,
            controller: AbortController,
            timeoutMs: number,
          ): Promise<Result> {
            let timer: NodeJS.Timeout | undefined;
            let removeAbortListener: (() => void) | undefined;
            const aborted = new Promise<never>((_resolve, reject) => {
              const onAbort = () => reject(
                controller.signal.reason instanceof Error
                  ? controller.signal.reason
                  : new Error('Bounded work item aborted'),
              );
              controller.signal.addEventListener('abort', onAbort, { once: true });
              removeAbortListener = () => controller.signal.removeEventListener('abort', onAbort);
            });
            try {
              return await Promise.race([
                task,
                aborted,
                new Promise<never>((_resolve, reject) => {
                  timer = setTimeout(() => {
                    const error = new BoundedWorkTimeoutError(timeoutMs);
                    controller.abort(error);
                    reject(error);
                  }, timeoutMs);
                }),
              ]);
            } finally {
              if (timer) clearTimeout(timer);
              removeAbortListener?.();
            }
          }
          ''',
          )

          signal_path = Path('api-server/src/services/signal.service.ts')
          signal = signal_path.read_text()
          signal = signal.replace(
              "import { computeIndicators } from '../sample/indicators';\n",
              "import { computeIndicators } from '../sample/indicators';\nimport { runBoundedWorkPool } from '../lib/bounded-work-pool';\n",
              1,
          )

          marker = '// Maximum scan cards returned (raised from 30 → ~100).'
          before, sep, tail = signal.partition(marker)
          if not sep:
              raise SystemExit('signal.service.ts: scan marker missing')

          old_signature = '''async function scan(
            market: string,
            selected: string[],
            filters: ScanFilters = {},
            limit = SCAN_POOL_LIMIT,
          ): Promise<{
            cards: ScanCard[];
            selected: string[];
            supportedIndicators: string[];
            scanned: number;
            excludedCount: number;
            appliedFilters: { volumeThreshold: number | null; tradingValueThreshold: number | null; marketCapThreshold: number | null; minimumScore: number | null; maximumRiskScore: number | null };
            timeframe: string;
          }> {'''
          new_signature = '''export const SCAN_EXECUTION_LIMITS = Object.freeze({
            deadlineMs: 12_000,
            itemTimeoutMs: 4_000,
            concurrency: 6,
          });

          export interface ScanExecutionOptions {
            signal?: AbortSignal;
            deadlineMs?: number;
            itemTimeoutMs?: number;
            concurrency?: number;
          }

          export interface ScanResult {
            cards: ScanCard[];
            selected: string[];
            supportedIndicators: string[];
            scanned: number;
            requestedCount: number;
            completedCount: number;
            providerErrorCount: number;
            timeoutCount: number;
            excludedCount: number;
            appliedFilters: { volumeThreshold: number | null; tradingValueThreshold: number | null; marketCapThreshold: number | null; minimumScore: number | null; maximumRiskScore: number | null };
            timeframe: string;
            partial: boolean;
            timedOut: boolean;
            elapsedMs: number;
            dataState: 'complete' | 'partial';
            message: string;
            maxConcurrency: number;
            deadlineMs: number;
            itemTimeoutMs: number;
          }

          export class ScanProviderUnavailableError extends Error {
            readonly code = 'SCAN_PROVIDER_ERROR';
            readonly provider = 'market-data';

            constructor(message: string) {
              super(message);
              this.name = 'ScanProviderUnavailableError';
            }
          }

          export class ScanAbortedError extends Error {
            constructor() {
              super('Scanner request aborted');
              this.name = 'AbortError';
            }
          }

          function executionLimit(value: number | undefined, fallback: number, maximum: number): number {
            return Number.isInteger(value) && Number(value) > 0
              ? Math.min(Number(value), maximum)
              : fallback;
          }

          function throwIfScanAborted(signal?: AbortSignal): void {
            if (signal?.aborted) throw new ScanAbortedError();
          }

          async function scan(
            market: string,
            selected: string[],
            filters: ScanFilters = {},
            execution: ScanExecutionOptions = {},
            limit = SCAN_POOL_LIMIT,
          ): Promise<ScanResult> {'''
          if tail.count(old_signature) != 1:
