                    <div data-testid="scanner-success" className="sr-only">검색 완료</div>
                  )}

                  <div className="space-y-2">'''
          if scanner.count(old_states) != 1:
              raise SystemExit(f'scanner.tsx: state matches={scanner.count(old_states)}')
          scanner_path.write_text(scanner.replace(old_states, new_states, 1))

          # Real staging scanner verification waits for the actual API, not generic networkidle.
          e2e_path = Path('stock-analyzer/e2e/phase10-staging-readiness.spec.ts')
          e2e = e2e_path.read_text()
          marker = '''async function expectDeniedRoute(page: Page, route: string) {'''
          helper = '''async function expectHealthyScannerRoute(page: Page) {
            const scanResponsePromise = page.waitForResponse((response) => {
              const url = new URL(response.url());
              return response.request().method() === 'GET' && url.pathname === '/api/market/scan';
            }, { timeout: 20_000 });
            const documentResponse = await page.goto('/scanner', { waitUntil: 'domcontentloaded' });
            if (documentResponse) expect(documentResponse.status(), `/scanner returned HTTP ${documentResponse.status()}`).toBeLessThan(400);
            await expect(page.getByTestId('scanner-root')).toBeVisible();
            const scanResponse = await scanResponsePromise;
            expect(scanResponse.status(), `scanner API returned HTTP ${scanResponse.status()}`).toBeLessThan(500);
            expect(scanResponse.ok(), 'scanner API must return a bounded 2xx response').toBeTruthy();
            const body = await scanResponse.json() as {
              ok?: boolean;
              partial?: boolean;
              elapsedMs?: number;
              dataState?: string;
            };
            expect(body.ok).toBe(true);
            expect(Number(body.elapsedMs)).toBeLessThanOrEqual(15_000);
            expect(['complete', 'partial']).toContain(body.dataState);
            await page.getByRole('button', { name: /종목보기/ }).click();
            if (body.partial) {
              await expect(page.getByTestId('scanner-partial')).toBeVisible();
            } else {
              await expect(page.locator('[data-testid="scanner-empty"], [data-testid="scanner-success"]')).toBeVisible();
            }
          }

          async function expectDeniedRoute(page: Page, route: string) {'''
          if e2e.count(marker) != 1:
              raise SystemExit(f'phase10 spec helper marker matches={e2e.count(marker)}')
          e2e = e2e.replace(marker, helper, 1)
          if e2e.count("    await expectHealthyRoute(page, '/scanner');") != 1:
              raise SystemExit('phase10 spec scanner call missing')
          e2e = e2e.replace("    await expectHealthyRoute(page, '/scanner');", "    await expectHealthyScannerRoute(page);", 1)
          e2e_path.write_text(e2e)

          # Register bounded scanner tests.
          test_path = Path('api-server/test.mjs')
          test_mjs = test_path.read_text()
          test_mjs = test_mjs.replace(
              "    path.join(root, 'src/services/signal-score.test.ts'),\n",
              "    path.join(root, 'src/services/signal-score.test.ts'),\n    path.join(root, 'src/lib/bounded-work-pool.test.ts'),\n    path.join(root, 'src/services/scanner-bounded-contract.test.ts'),\n    path.join(repositoryRoot, 'stock-analyzer/src/lib/scanner-request.test.ts'),\n",
              1,
          )
          test_mjs = test_mjs.replace(
              "    path.join(root, 'src/routes/paper-journal.smoke.test.ts'),\n",
              "    path.join(root, 'src/routes/paper-journal.smoke.test.ts'),\n    path.join(root, 'src/routes/market-scan.smoke.test.ts'),\n",
              1,
          )
          test_path.write_text(test_mjs)
          PY

          cat > api-server/src/services/scanner-bounded-contract.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const repositoryRoot = path.resolve(root, '..');
          const source = (relative: string) => readFileSync(path.join(repositoryRoot, relative), 'utf8');

          test('scanner server has fixed deadline, item timeout, bounded concurrency, and no full-pool Promise.all', () => {
            const service = source('api-server/src/services/signal.service.ts');
            assert.match(service, /deadlineMs:\s*12_000/);
            assert.match(service, /itemTimeoutMs:\s*4_000/);
            assert.match(service, /concurrency:\s*6/);
            assert.match(service, /runBoundedWorkPool\(\s*pool/);
            assert.doesNotMatch(service, /Promise\.all\(\s*pool\.map/);
            assert.match(service, /completedCount/);
            assert.match(service, /providerErrorCount/);
            assert.match(service, /timeoutCount/);
            assert.match(service, /deadlineReached/);
          });

          test('scanner reuses the already fetched candles and context for matched cards', () => {
            const service = source('api-server/src/services/signal.service.ts');
            const scanTail = service.slice(service.indexOf('async function scan('));
            assert.match(scanTail, /computeSignalReport\(candles, indicators, ctx\)/);
            assert.doesNotMatch(scanTail, /await getReport\(entry\.ticker\)/);
          });

          test('scanner route passes disconnect cancellation and keeps provider failure strict', () => {
            const route = source('api-server/src/routes/market.ts');
            assert.match(route, /new AbortController\(\)/);
            assert.match(route, /req\.once\('aborted'/);
            assert.match(route, /SignalService\.scan\(scope, indicators, filters, \{ signal: controller\.signal \}\)/);
            assert.match(route, /res\.status\(502\)/);
            assert.match(route, /partial: result\.partial/);
          });

          test('scanner client consumes TanStack AbortSignal and exposes explicit result states', () => {
            const page = source('stock-analyzer/src/pages/scanner.tsx');
            const api = source('stock-analyzer/src/lib/api.ts');
            assert.match(page, /queryFn: \(\{ signal \}\) =>/);
            assert.match(page, /}, signal\)/);
            assert.match(page, /scanner-loading/);
            assert.match(page, /scanner-success/);
            assert.match(page, /scanner-empty/);
            assert.match(page, /scanner-partial/);
            assert.match(page, /scanner-provider-error/);
            assert.match(api, /signal\?: AbortSignal/);
            assert.match(api, /signal: options\.signal/);
          });

          test('staging scanner test waits for the real API response without mocking or generic networkidle', () => {
            const spec = source('stock-analyzer/e2e/phase10-staging-readiness.spec.ts');
            const helperStart = spec.indexOf('async function expectHealthyScannerRoute');
            const helperEnd = spec.indexOf('async function expectDeniedRoute', helperStart);
            const helper = spec.slice(helperStart, helperEnd);
            assert.match(helper, /waitForResponse/);
            assert.match(helper, /\/api\/market\/scan/);
            assert.match(helper, /20_000/);
            assert.match(helper, /scanner-root/);
            assert.match(helper, /scanner-partial/);
            assert.doesNotMatch(helper, /networkidle/);
            assert.doesNotMatch(spec, /expectHealthyRoute\(page, '\/scanner'\)/);
            assert.doesNotMatch(helper, /page\.route\(/);
          });
          EOF

          cat > api-server/src/routes/market-scan.smoke.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import express from 'express';
          import type { AddressInfo } from 'node:net';
          import marketRouter from './market';
          import { SignalService, ScanProviderUnavailableError, type ScanResult } from '../services/signal.service';

          const baseResult = (overrides: Partial<ScanResult> = {}): ScanResult => ({
            cards: [],
            selected: ['거래량 증가'],
            supportedIndicators: ['거래량 증가'],
            scanned: 2,
            requestedCount: 2,
            completedCount: 2,
            providerErrorCount: 0,
            timeoutCount: 0,
            excludedCount: 2,
            appliedFilters: {
              volumeThreshold: null,
              tradingValueThreshold: null,
              marketCapThreshold: null,
              minimumScore: null,
              maximumRiskScore: null,
            },
            timeframe: '1D',
            partial: false,
            timedOut: false,
            elapsedMs: 120,
            dataState: 'complete',
            message: '스캔은 정상 완료됐지만 조건에 맞는 종목이 없습니다.',
            maxConcurrency: 2,
            deadlineMs: 12_000,
            itemTimeoutMs: 4_000,
            ...overrides,
          });

          async function withServer(run: (baseUrl: string) => Promise<void>) {
            const app = express();
            app.use('/api', marketRouter);
            const server = app.listen(0, '127.0.0.1');
            await new Promise<void>((resolve, reject) => {
              server.once('listening', resolve);
              server.once('error', reject);
            });
            try {
              const address = server.address() as AddressInfo;
              await run(`http://127.0.0.1:${address.port}`);
            } finally {
              await new Promise<void>((resolve) => server.close(() => resolve()));
            }
          }

          test('normal zero-match scan is a complete HTTP 200 empty result', async () => {
            const original = SignalService.scan;
            SignalService.scan = async () => baseResult();
            try {
              await withServer(async (baseUrl) => {
                const response = await fetch(`${baseUrl}/api/market/scan?market=KR&indicators=거래량%20증가`);
                assert.equal(response.status, 200);
                const body = await response.json() as Record<string, unknown>;
                assert.equal(body.ok, true);
                assert.equal(body.partial, false);
                assert.equal(body.dataState, 'complete');
                assert.deepEqual(body.cards, []);
              });
            } finally {
              SignalService.scan = original;
            }
          });

          test('some item timeouts return an explicit partial 200 result', async () => {
            const original = SignalService.scan;
            SignalService.scan = async () => baseResult({
              scanned: 5,
              requestedCount: 10,
              completedCount: 4,
              timeoutCount: 1,
              excludedCount: 4,
              partial: true,
              timedOut: true,
              elapsedMs: 11_900,
              dataState: 'partial',
              message: '일부 데이터가 지연됐습니다.',
              maxConcurrency: 6,
            });
            try {
              await withServer(async (baseUrl) => {
                const response = await fetch(`${baseUrl}/api/market/scan?market=KR`);
                assert.equal(response.status, 200);
                const body = await response.json() as Record<string, unknown>;
                assert.equal(body.partial, true);
                assert.equal(body.timedOut, true);
                assert.equal(body.timeoutCount, 1);
                assert.equal(body.dataState, 'partial');
              });
            } finally {
              SignalService.scan = original;
            }
          });

          test('unreliable provider scan remains a strict 502 failure', async () => {
            const original = SignalService.scan;
            const originalError = console.error;
            SignalService.scan = async () => {
              throw new ScanProviderUnavailableError('provider unavailable');
            };
            console.error = () => undefined;
            try {
              await withServer(async (baseUrl) => {
                const response = await fetch(`${baseUrl}/api/market/scan?market=KR`);
                assert.equal(response.status, 502);
                const body = await response.json() as Record<string, unknown>;
                assert.equal(body.ok, false);
                assert.equal(body.error, 'SCAN_PROVIDER_ERROR');
                assert.deepEqual(body.cards, []);
              });
            } finally {
              console.error = originalError;
              SignalService.scan = original;
            }
          });

          test('scanner smoke sends no order-capable requests', async () => {
            const original = SignalService.scan;
            SignalService.scan = async () => baseResult();
            const requested: string[] = [];
            try {
              await withServer(async (baseUrl) => {
                const url = `${baseUrl}/api/market/scan?market=US&timeframe=1D`;
                requested.push(url);
                const response = await fetch(url);
                assert.equal(response.status, 200);
              });
              assert.equal(requested.length, 1);
              assert.ok(requested.every((url) => url.includes('/api/market/scan')));
              assert.ok(requested.every((url) => !/(?:order|trade|position|execute|approve)/i.test(new URL(url).pathname)));
            } finally {
              SignalService.scan = original;
            }
          });
          EOF

