name: Production Telegram Delivery Read-Only Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-telegram-delivery-readonly-diagnostic.yml'
      - '.github/tests/production-telegram-delivery-readonly-diagnostic.test.mjs'
      - 'stock-analyzer/e2e/production-telegram-delivery-readonly-diagnostic.spec.ts'
      - 'stock-analyzer/playwright.production-telegram-delivery-diagnostic.config.ts'
      - 'stock-analyzer/e2e/support/production-readonly-login.ts'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-telegram-delivery-diagnostic-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/tests/production-telegram-delivery-readonly-diagnostic.test.mjs

  diagnose:
    name: Read exact failed-window delivery state without sending
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-production-telegram-delivery-diagnostic ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE_URL: https://lsj119.com
      PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
      PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
      PRODUCTION_TELEGRAM_DELIVERY_DIAGNOSTIC: 'true'
      PRODUCTION_TELEGRAM_DELIVERY_DIAGNOSTIC_DIR: production-telegram-delivery-diagnostic-artifacts
      PRODUCTION_LOGIN_DIAGNOSTIC_DIR: production-login-diagnostics/telegram-delivery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact owner diagnostic request
        id: command
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const match = /^\/run-production-telegram-delivery-diagnostic ([0-9a-fA-F]{40}) ([1-9][0-9]*)$/.exec(String(process.env.COMMAND || '').trim());
          if (!match) throw new Error('EXACT_PRODUCTION_SHA_AND_FAILED_RUN_ID_REQUIRED');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\nrun_id=${match[2]}\n`);
          NODE

      - name: Require current main ancestry and exact failed Production step window
        id: failed
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          FAILED_RUN_ID: ${{ steps.command.outputs.run_id }}
        with:
          script: |
            const targetSha = String(process.env.TARGET_SHA || '').toLowerCase();
            const runId = Number(process.env.FAILED_RUN_ID || 0);
            if (!/^[0-9a-f]{40}$/.test(targetSha) || !Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('DIAGNOSTIC_INPUT_INVALID'); return;
            }
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            })).data;
            if (run.name !== 'Production Deploy' || run.head_sha !== targetSha || run.status !== 'completed'
              || run.conclusion !== 'failure') {
              core.setFailed('EXACT_FAILED_PRODUCTION_RUN_REQUIRED'); return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100,
            });
            const job = jobs.find((item) => item.name === 'Approved canary, production deploy, verify, and rollback');
            const step = job?.steps?.find((item) => item.name === '1T · Prepare safe member ALL4 policy and run Focused Trading Core Production QA');
            if (!step || step.conclusion !== 'failure' || !step.started_at || !step.completed_at) {
              core.setFailed('EXACT_FAILED_TRADING_CORE_STEP_REQUIRED'); return;
            }
            core.setOutput('started_at', step.started_at);
            core.setOutput('completed_at', step.completed_at);

      - name: Require immutable diagnostic source on current main lineage
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Require exact Production runtime identity
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 15 "$PRODUCTION_BASE_URL/api/health" -o /tmp/telegram-diagnostic-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const { assertProductionRuntimeIdentity } = require('./.github/scripts/production-deploy-provenance.cjs');
          assertProductionRuntimeIdentity(JSON.parse(fs.readFileSync('/tmp/telegram-diagnostic-health.json', 'utf8')), process.env.EXPECTED_DEPLOY_SHA);
          NODE

      - name: Require protected QA login
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_QA_LOGIN" && -n "$PRODUCTION_QA_PASSWORD" ]] || {
            echo 'BLOCKED_BY_PRODUCTION_QA_CREDENTIAL' >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium
        working-directory: stock-analyzer
        run: pnpm exec playwright install chromium

      - name: Read exact failed-window Telegram delivery evidence
        working-directory: stock-analyzer
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.command.outputs.sha }}
          FAILED_PRODUCTION_RUN_ID: ${{ steps.command.outputs.run_id }}
          DIAGNOSTIC_WINDOW_START: ${{ steps.failed.outputs.started_at }}
          DIAGNOSTIC_WINDOW_END: ${{ steps.failed.outputs.completed_at }}
        run: pnpm exec playwright test --config=playwright.production-telegram-delivery-diagnostic.config.ts

      - name: Verify sanitized zero-mutation evidence
        id: verify
        if: always()
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.command.outputs.sha }}
          FAILED_PRODUCTION_RUN_ID: ${{ steps.command.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          file="stock-analyzer/production-telegram-delivery-diagnostic-artifacts/production-telegram-delivery-readonly-diagnostic.json"
          test -s "$file"
          node - "$file" <<'NODE'
          const fs=require('node:fs');
          const value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const financialMutations=Number(value.orders)+Number(value.cancels)+Number(value.amends)+Number(value.transfers)+Number(value.withdrawals);
          if(value.schemaVersion!=='production-telegram-delivery-readonly-diagnostic-v1'
            || value.targetSha!==process.env.EXPECTED_DEPLOY_SHA
            || value.failedProductionRunId!==Number(process.env.FAILED_PRODUCTION_RUN_ID)
            || value.readOnly!==true || value.telegramMessagesSent!==0 || financialMutations!==0
            || value.liveTradingAuthorityGranted!==false || value.autoTradingAuthorityGranted!==false
            || value.secretValuesRecorded!==false || value.accountValuesRecorded!==false
            || !Array.isArray(value.deliveries)
            || value.deliveries.some((item)=>typeof item.deliveryRef!=='string'||item.deliveryRef.length!==16)) {
            throw new Error('UNSAFE_OR_INVALID_TELEGRAM_DELIVERY_DIAGNOSTIC');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `classification=${String(value.rootCauseClassification).replace(/[^A-Z0-9_,:-]/g,'_').slice(0,500)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${value.matchingDeliveryCount}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `states=${JSON.stringify(value.states).replace(/[^A-Z0-9_{}:,\"-]/gi,'').slice(0,500)}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-telegram-delivery-diagnostic-${{ steps.command.outputs.sha }}-${{ steps.command.outputs.run_id }}
          path: |
            stock-analyzer/production-telegram-delivery-diagnostic-artifacts
            stock-analyzer/production-login-diagnostics/telegram-delivery
          if-no-files-found: warn
          retention-days: 30

      - name: Report sanitized root-cause classification
        if: steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          FAILED_RUN_ID: ${{ steps.command.outputs.run_id }}
          CLASSIFICATION: ${{ steps.verify.outputs.classification }}
          DELIVERY_COUNT: ${{ steps.verify.outputs.count }}
          DELIVERY_STATES: ${{ steps.verify.outputs.states }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 1555,
              body: [
                'Production Telegram delivery READ-ONLY root-cause diagnostic',
                `- Production SHA: ${process.env.TARGET_SHA}`,
                `- Failed Production Run: ${process.env.FAILED_RUN_ID}`,
                `- Classification: ${process.env.CLASSIFICATION}`,
                `- Matching exact-window deliveries: ${process.env.DELIVERY_COUNT}`,
                `- States: ${process.env.DELIVERY_STATES}`,
                '- Telegram sends: 0',
                '- orders/cancels/amends/transfers/withdrawals: 0/0/0/0/0',
                '- secret/account values recorded: false/false',
              ].join('\n'),
            });
