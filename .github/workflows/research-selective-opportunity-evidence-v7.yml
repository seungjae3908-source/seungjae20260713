name: Research Selective Opportunity Evidence V7
on:
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/selective_opportunity_evidence_v7.py
      - market-prediction-lab/tests/test_evidence_v7.py
      - market-prediction-lab/docs/selective-opportunity-evidence-v7.md
      - .github/workflows/research-selective-opportunity-evidence-v7.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: selective-evidence-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-source-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_CODE_SHA: ${{ github.event.pull_request.head.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LIVE_TRADING: 'false'
      AUTO_TRADING: 'false'
      REAL_ORDER_ENABLED: 'false'
      PRIVATE_TRADING_API_ALLOWED: 'false'
    steps:
      - name: Checkout exact Draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_CODE_SHA }}
          persist-credentials: false
      - name: Assert identity
        run: test "$(git rev-parse HEAD)" = "$RESEARCH_CODE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install version-pinned numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 threadpoolctl==3.6.0
      - name: Preserved regressions and new ML-causality tests
        run: |
          python -m unittest discover -s market-prediction-lab/tests -p 'test_selective_opportunity_*.py' -v
          python -m unittest discover -s market-prediction-lab/tests -p 'test_evidence_v7.py' -v
      - name: Download checksum-pinned research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/selective-evidence-v7/input
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10842828161/zip" > /tmp/selective-evidence-v7/input/v2.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10844551652/zip" > /tmp/selective-evidence-v7/input/v3.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10844599643/zip" > /tmp/selective-evidence-v7/input/v4.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10845603179/zip" > /tmp/selective-evidence-v7/input/v5.zip
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          root=Path('/tmp/selective-evidence-v7/input')
          assert hashlib.sha256((root/'v5.zip').read_bytes()).hexdigest()=='ebe716b60688f64bc072eb5a7d97b445fa647494cc4e495a99966e561bdb7a61'
          with zipfile.ZipFile(root/'v5.zip') as z: raw=z.read('portfolio-ledgers.json')
          assert hashlib.sha256(raw).hexdigest()=='715f504d19648bd3d06b8d445e0021905ef145a49fe006ba00d7e6db8cca035b'
          (root/'v5-ledger.json').write_bytes(raw)
          PY
      - name: Frozen source-inspired trials and repeated offline replay
        run: |
          set -Eeuo pipefail
          for name in result replay; do
            python market-prediction-lab/scripts/selective_opportunity_evidence_v7.py \
              --v2-zip /tmp/selective-evidence-v7/input/v2.zip \
              --v3-zip /tmp/selective-evidence-v7/input/v3.zip \
              --v4-zip /tmp/selective-evidence-v7/input/v4.zip \
              --v5-ledger /tmp/selective-evidence-v7/input/v5-ledger.json \
              --output /tmp/selective-evidence-v7/$name
          done
      - name: Verify original baseline, exact output and evidence boundary
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/selective-evidence-v7');a=root/'result';b=root/'replay'
          for p in a.iterdir():assert p.read_bytes()==(b/p.name).read_bytes(),p.name
          r=json.loads((a/'result.json').read_bytes())
          assert len(r['summary'])==15 and r['baselineReproduced'] is True
          assert r['profitabilityProven'] is False and r['independentOos'] is False
          assert r['selectedChampion'] is None and r['combinedReturn'] is None
          assert r['actualOrders']==0 and r['canonicalSampleDelta']==0 and r['providerCalls']==0
          assert r['executionAuthority']=='NONE'
          result_sha=hashlib.sha256((a/'result.json').read_bytes()).hexdigest()
          assert result_sha=='65f1beba895749b8be42d718f630c378c665979904c31f9c0746f1388894e1e0'
          ai=json.loads((a/'ml-audit.json').read_bytes())
          for period in ai:
              for m in period['models']:
                  if m['maxLabelEnd'] is not None:assert m['maxLabelEnd']<m['cutoff']-14400000
          proof={'researchCodeSha':os.environ['RESEARCH_CODE_SHA'],'resultSha256':result_sha,
                 'exactReplay':True,'baselineReproduced':True,'all15ComparisonsRetained':True,
                 'providerCalls':0,'actualOrders':0,'independentOos':False,'profitabilityProven':False}
          (a/'ci-verification.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('V7_SOURCE_FEATURE_ML_CAUSAL_REPLAY_AND_RESEARCH_BOUNDARY_PASS')
          PY
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selective-opportunity-evidence-v7-${{ github.run_id }}
          path: /tmp/selective-evidence-v7/result
          if-no-files-found: warn
          retention-days: 90
