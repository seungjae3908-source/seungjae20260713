name: Research V3 Independence Production Publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-v3-independence-production-publication.yml'
      - 'research-production/bin/publish-v3-independence.mjs'
      - 'research-production/src/v3-liquidity-independence-state-publisher.mjs'
      - 'research-production/test/v3-liquidity-independence-state-publisher.test.mjs'
      - 'research-production/test/v3-liquidity-independence-production-caller.test.mjs'
      - 'scripts/agent_hub_rollover_v2.py'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: research-v3-independence-production-publication
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate exact-head caller and publication contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/research-v3-independence-production-publication.yml
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/agent_hub_rollover_v2.py self-test
          node --check research-production/bin/publish-v3-independence.mjs
          node --test \
            research-production/test/v3-liquidity-independence-state-publisher.test.mjs \
            research-production/test/v3-liquidity-independence-production-caller.test.mjs
          grep -Fq '/publish-v3-independence ' "$workflow"
          grep -Fq 'python3 scripts/agent_hub_rollover_v2.py resolve' "$workflow"
          grep -Fq 'SOURCE_PR_NUMBER: 897' "$workflow"
          grep -Fq '/opt/investment-research/releases/$TARGET_SHA' "$workflow"
          grep -Fq '/var/lib/investment-research-production' "$workflow"
          grep -Fq 'runuser -u investment-research' "$workflow"
          grep -Fq 'env -i' "$workflow"
          # Scan only the runtime/control portion. The validation code itself contains
          # the forbidden-token regex and must not be allowed to self-match.
          awk 'BEGIN {copy=0} /^  authorize:$/ {copy=1} copy {print}' "$workflow" > "$RUNNER_TEMP/runtime-control.yml"
          if grep -Eq 'systemctl[[:space:]]+(enable|disable|start|stop|restart)|(^|[[:space:]])(caddy|pm2)([[:space:]]|$)' "$RUNNER_TEMP/runtime-control.yml"; then
            echo 'Publication runtime contains a forbidden deploy/service mutation command.' >&2
            exit 1
          fi

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/publish-v3-independence ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      active_issue: ${{ steps.hub.outputs.active_issue }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
      source_run_id: ${{ steps.gate.outputs.source_run_id }}
      source_head_sha: ${{ steps.gate.outputs.source_head_sha }}
      artifact_id: ${{ steps.gate.outputs.artifact_id }}
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      artifact_digest: ${{ steps.gate.outputs.artifact_digest }}
      target_slot_index: ${{ steps.gate.outputs.target_slot_index }}
      application_run_id: ${{ steps.gate.outputs.application_run_id }}
    env:
      SOURCE_PR_NUMBER: 897
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve canonical Hub
        id: hub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/agent_hub_rollover_v2.py resolve
      - name: Gate canonical Hub, exact main, Required CI, publisher ancestry, and #813 artifact
        id: gate
        uses: actions/github-script@v7
        env:
          ACTIVE_ISSUE: ${{ steps.hub.outputs.active_issue }}
          SOURCE_PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const body = String(context.payload.comment?.body ?? '').trim();
            const match = /^\/publish-v3-independence ([0-9a-f]{40}) ([0-9]{6,20})$/u.exec(body);
            if (!match) {
              core.setFailed('Expected /publish-v3-independence <40-char-current-main-sha> <#813-workflow-run-id>');
              return;
            }
            const targetSha = match[1];
            const sourceRunId = Number(match[2]);
            const activeIssue = Number(process.env.ACTIVE_ISSUE);
            if (!Number.isInteger(activeIssue) || activeIssue <= 0 || Number(context.issue.number) !== activeIssue) {
              core.setFailed(`Command was not posted on resolved canonical Hub #${activeIssue}`);
              return;
            }

            const main = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            })).data;
            if (String(main.commit.sha).toLowerCase() !== targetSha) {
              core.setFailed(`Target is not exact current main: ${targetSha}`);
              return;
            }

            const sourcePrNumber = Number(process.env.SOURCE_PR_NUMBER);
            const sourcePr = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: sourcePrNumber,
            })).data;
            if (!sourcePr.merged || !sourcePr.merge_commit_sha) {
              core.setFailed(`Publisher source PR #${sourcePrNumber} is not merged.`);
              return;
            }
            const ancestry = await github.rest.repos.compareCommits({
              owner: context.repo.owner, repo: context.repo.repo,
              base: String(sourcePr.merge_commit_sha), head: targetSha,
            });
            if (!['ahead', 'identical'].includes(ancestry.data.status)) {
              core.setFailed(`Current main does not descend from publisher source PR #${sourcePrNumber}.`);
              return;
            }

            const required = [
              'application-ci/verified', 'browser-ui/verified', 'database-rls/verified',
              'security-integration/verified', 'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: targetSha, per_page: 100,
            });
            const byRun = new Map();
            for (const status of statuses) {
              const runMatch = String(status.target_url ?? '').match(/\/actions\/runs\/(\d+)/u);
              if (!runMatch) continue;
              const runId = Number(runMatch[1]);
              if (!byRun.has(runId)) byRun.set(runId, new Map());
              const contexts = byRun.get(runId);
              const previous = contexts.get(status.context);
              if (!previous || Number(status.id) > Number(previous.id)) contexts.set(status.context, status);
            }
            const runIds = [...byRun.keys()].sort((a, b) => b - a);
            if (runIds.length === 0) {
              core.setFailed('No Required CI status run exists on exact current main.');
              return;
            }
            const applicationRunId = runIds[0];
            const contexts = byRun.get(applicationRunId);
            const missing = required.filter((name) => contexts.get(name)?.state !== 'success');
            if (missing.length > 0) {
              core.setFailed(`Latest exact-main Required CI run ${applicationRunId} is not 6/6: ${missing.join(',')}`);
              return;
            }
            const applicationRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: applicationRunId,
            })).data;
            if (String(applicationRun.head_sha).toLowerCase() !== targetSha
                || applicationRun.status !== 'completed'
                || applicationRun.conclusion !== 'success') {
              core.setFailed(`Required CI run ${applicationRunId} is not terminal SUCCESS on target main.`);
              return;
            }

            const sourceRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: sourceRunId,
            })).data;
            if (sourceRun.name !== 'Public Forward Liquidity V3 Independence Consume'
                || sourceRun.path !== '.github/workflows/public-forward-liquidity-v3-independence.yml'
                || sourceRun.event !== 'workflow_run'
                || sourceRun.head_branch !== 'main'
                || sourceRun.status !== 'completed'
                || sourceRun.conclusion !== 'success'
                || Number(sourceRun.run_attempt) !== 1
                || !/^[0-9a-f]{40}$/u.test(String(sourceRun.head_sha ?? ''))) {
              core.setFailed('SOURCE_813_RUN_INVALID');
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: sourceRunId, per_page: 100,
            });
            const pattern = new RegExp(`^public-forward-liquidity-v3-authoritative-independence-slot-([0-9]+)-${sourceRunId}-1$`, 'u');
            const matches = artifacts.filter((artifact) => artifact.expired !== true && pattern.test(String(artifact.name ?? '')));
            if (matches.length !== 1) {
              core.setFailed(`SOURCE_813_ARTIFACT_CARDINALITY_INVALID:${matches.length}`);
              return;
            }
            const artifact = matches[0];
            const slot = Number(pattern.exec(artifact.name)[1]);
            if (!Number.isInteger(slot) || slot < 0
                || !/^[0-9]{6,20}$/u.test(String(artifact.id ?? ''))
                || !/^sha256:[0-9a-f]{64}$/u.test(String(artifact.digest ?? ''))) {
              core.setFailed('SOURCE_813_ARTIFACT_METADATA_INVALID');
              return;
            }

            core.setOutput('target_sha', targetSha);
            core.setOutput('source_run_id', String(sourceRunId));
            core.setOutput('source_head_sha', String(sourceRun.head_sha));
            core.setOutput('artifact_id', String(artifact.id));
            core.setOutput('artifact_name', String(artifact.name));
            core.setOutput('artifact_digest', String(artifact.digest));
            core.setOutput('target_slot_index', String(slot));
            core.setOutput('application_run_id', String(applicationRunId));

  publish:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publication_status: ${{ steps.publish.outputs.publication_status }}
      file_digest: ${{ steps.publish.outputs.file_digest }}
      report_digest: ${{ steps.publish.outputs.report_digest }}
      target_slot_index: ${{ steps.publish.outputs.target_slot_index }}
    env:
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      SOURCE_RUN_ID: ${{ needs.authorize.outputs.source_run_id }}
      SOURCE_HEAD_SHA: ${{ needs.authorize.outputs.source_head_sha }}
      ARTIFACT_ID: ${{ needs.authorize.outputs.artifact_id }}
      ARTIFACT_NAME: ${{ needs.authorize.outputs.artifact_name }}
      ARTIFACT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      TARGET_SLOT_INDEX: ${{ needs.authorize.outputs.target_slot_index }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recheck exact current main before server contact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$actual_main" = "$TARGET_SHA"
      - name: Download exact authenticated #813 artifact
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/v3-independence-source"
          mkdir -p "$source_dir"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D "$source_dir"
          summary="$source_dir/v3-authoritative-independence-summary.json"
          test -f "$summary"
          test "$(wc -c < "$summary")" -le 1048576
          printf '%s\n' "summary_file=$summary" >> "$GITHUB_OUTPUT"
      - name: Build immutable authenticated-source envelope
        id: envelope
        env:
          SUMMARY_FILE: ${{ steps.source.outputs.summary_file }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_file="$RUNNER_TEMP/authenticated-source.json"
          SOURCE_FILE="$source_file" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const summary = JSON.parse(await readFile(process.env.SUMMARY_FILE, 'utf8'));
          if (summary.producerSha !== process.env.SOURCE_HEAD_SHA
              || summary.targetSlotIndex !== Number(process.env.TARGET_SLOT_INDEX)) {
            throw new Error('DOWNLOADED_SUMMARY_IDENTITY_MISMATCH');
          }
          const source = {
            workflowName: 'Public Forward Liquidity V3 Independence Consume',
            workflowRunId: Number(process.env.SOURCE_RUN_ID),
            runAttempt: 1,
            event: 'workflow_run', branch: 'main', conclusion: 'success',
            headSha: process.env.SOURCE_HEAD_SHA,
            artifactId: Number(process.env.ARTIFACT_ID),
            artifactName: process.env.ARTIFACT_NAME,
            artifactDigest: process.env.ARTIFACT_DIGEST,
          };
          await writeFile(process.env.SOURCE_FILE, `${JSON.stringify(source)}\n`, { mode: 0o600 });
          NODE
          printf '%s\n' "source_file=$source_file" >> "$GITHUB_OUTPUT"
      - name: Isolated local caller preflight only
        env:
          SUMMARY_FILE: ${{ steps.source.outputs.summary_file }}
          SOURCE_FILE: ${{ steps.envelope.outputs.source_file }}
        shell: bash
        run: |
          set -Eeuo pipefail
          local_state="$RUNNER_TEMP/v3-local-state"
          mkdir -p "$local_state"
          env -i \
            PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 TZ=UTC \
            LIVE_TRADING=false PRIVATE_API_ENABLED=false ORDER_AUTHORITY=false \
            node research-production/bin/publish-v3-independence.mjs \
              --state-root "$local_state" \
              --summary-file "$SUMMARY_FILE" \
              --source-file "$SOURCE_FILE" \
              --repo-root "$GITHUB_WORKSPACE" \
              --expected-code-sha "$TARGET_SHA" > "$RUNNER_TEMP/local-publication-result.json"
          node -e "const r=require(process.argv[1]);if(r.status!=='PUBLISHED'||r.executionAuthority!=='NONE'||r.liveTrading||r.privateApi||r.realOrders!==0)process.exit(1)" \
            "$RUNNER_TEMP/local-publication-result.json"
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
      - name: Read-only Research server preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release="/opt/investment-research/releases/$TARGET_SHA"
          current="$(readlink -f /opt/investment-research/current 2>/dev/null || true)"
          test "$current" = "$release"
          test -d "$release" && test ! -L "$release"
          test "$(git -c safe.directory="$release" -C "$release" rev-parse HEAD)" = "$TARGET_SHA"
          test -f "$release/research-production/bin/publish-v3-independence.mjs"
          test -d /var/lib/investment-research-production
          test ! -L /var/lib/investment-research-production
          id investment-research >/dev/null 2>&1
          REMOTE
      - name: Stage public evidence inputs on server
        id: stage
        env:
          SUMMARY_FILE: ${{ steps.source.outputs.summary_file }}
          SOURCE_FILE: ${{ steps.envelope.outputs.source_file }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_dir="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'umask 077; mktemp -d /tmp/research-v3-independence-publish.XXXXXX')"
          [[ "$remote_dir" == /tmp/research-v3-independence-publish.* ]]
          scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT" "$SUMMARY_FILE" "$SSH_USER@$SSH_HOST:$remote_dir/summary.json"
          scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT" "$SOURCE_FILE" "$SSH_USER@$SSH_HOST:$remote_dir/source.json"
          remote_q="$(printf '%q' "$remote_dir")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "chmod 0755 $remote_q && chmod 0644 $remote_q/summary.json $remote_q/source.json"
          printf '%s\n' "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Publish through existing fail-closed publisher
        id: publish
        env:
          REMOTE_DIR: ${{ steps.stage.outputs.remote_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REMOTE_DIR=%q' "$TARGET_SHA" "$REMOTE_DIR")"
          publication_json="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release="/opt/investment-research/releases/$TARGET_SHA"
          state=/var/lib/investment-research-production
          command=(
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 TZ=UTC
            LIVE_TRADING=false LIVE_TRADING_ENABLED=false REAL_ORDER_ENABLED=false REAL_TRADING_ENABLED=false
            PRIVATE_API_ENABLED=false PRIVATE_ACCOUNT_ACCESS=false PRIVATE_TRADING_API_ALLOWED=false
            ORDER_AUTHORITY=false ORDER_SUBMISSION_ENABLED=false
            node "$release/research-production/bin/publish-v3-independence.mjs"
            --state-root "$state" --summary-file "$REMOTE_DIR/summary.json" --source-file "$REMOTE_DIR/source.json"
            --repo-root "$release" --expected-code-sha "$TARGET_SHA"
          )
          if [[ "$(id -u)" -eq 0 ]]; then
            command -v runuser >/dev/null
            runuser -u investment-research -- "${command[@]}"
          else
            sudo -n -u investment-research "${command[@]}"
          fi
          REMOTE
          )"
          printf '%s\n' "$publication_json" > "$RUNNER_TEMP/production-publication-result.json"
          RESULT_FILE="$RUNNER_TEMP/production-publication-result.json" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RESULT_FILE, 'utf8'));
          if (!['PUBLISHED', 'UNCHANGED'].includes(result.status)
              || result.codeSha !== process.env.TARGET_SHA
              || result.executionAuthority !== 'NONE'
              || result.liveTrading !== false || result.privateApi !== false || result.realOrders !== 0
              || result.oosOutcomeCredit !== 0 || result.fullCostReady !== false || result.evidenceComplete !== 0
              || !/^[0-9a-f]{64}$/u.test(String(result.fileDigest ?? ''))
              || !/^[0-9a-f]{64}$/u.test(String(result.reportDigest ?? ''))) {
            throw new Error('PRODUCTION_PUBLICATION_READBACK_INVALID');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `publication_status=${result.status}`,
            `file_digest=${result.fileDigest}`,
            `report_digest=${result.reportDigest}`,
            `target_slot_index=${result.targetSlotIndex}`,
            '',
          ].join('\n'));
          NODE
      - name: Remove staged server inputs
        if: always() && steps.stage.outputs.remote_dir != ''
        env:
          REMOTE_DIR: ${{ steps.stage.outputs.remote_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_q="$(printf '%q' "$REMOTE_DIR")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "rm -rf -- $remote_q"

  report-success:
    needs: [authorize, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          ACTIVE_ISSUE: ${{ needs.authorize.outputs.active_issue }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          SOURCE_RUN_ID: ${{ needs.authorize.outputs.source_run_id }}
          ARTIFACT_ID: ${{ needs.authorize.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
          APPLICATION_RUN_ID: ${{ needs.authorize.outputs.application_run_id }}
          PUBLICATION_STATUS: ${{ needs.publish.outputs.publication_status }}
          FILE_DIGEST: ${{ needs.publish.outputs.file_digest }}
          REPORT_DIGEST: ${{ needs.publish.outputs.report_digest }}
          TARGET_SLOT_INDEX: ${{ needs.publish.outputs.target_slot_index }}
        with:
          script: |
            const mutation = process.env.PUBLICATION_STATUS === 'PUBLISHED' ? 1 : 0;
            const body = [
              '[RESEARCH_V3_INDEPENDENCE_PUBLICATION]', 'status: success',
              `publication_status: ${process.env.PUBLICATION_STATUS}`,
              `canonical_hub: #${process.env.ACTIVE_ISSUE}`, `target_sha: ${process.env.TARGET_SHA}`,
              `required_ci_run: ${process.env.APPLICATION_RUN_ID}`, `source_run_id: ${process.env.SOURCE_RUN_ID}`,
              `source_artifact_id: ${process.env.ARTIFACT_ID}`, `source_artifact_digest: ${process.env.ARTIFACT_DIGEST}`,
              `target_slot_index: ${process.env.TARGET_SLOT_INDEX}`, `report_digest: ${process.env.REPORT_DIGEST}`,
              `published_file_digest: ${process.env.FILE_DIGEST}`, `production_state_mutation: ${mutation}`,
              'target_path: /var/lib/investment-research-production/forward/liquidity/v3-authoritative-independence-summary.json',
              'readback_verified: true', 'oos_outcome_credit: 0', 'full_cost_ready: false',
              'evidence_complete: 0', 'profitability_proven: false', 'execution_authority: NONE',
              'deployment: 0', 'db_mutation: 0', 'secret_mutation: 0', 'private_api: 0', 'live_trading: 0', 'real_orders: 0',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ACTIVE_ISSUE), body,
            });

  report-failure:
    needs: [authorize, publish]
    if: always() && needs.authorize.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          ACTIVE_ISSUE: ${{ needs.authorize.outputs.active_issue }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
          SOURCE_RUN_ID: ${{ needs.authorize.outputs.source_run_id }}
        with:
          script: |
            const body = [
              '[RESEARCH_V3_INDEPENDENCE_PUBLICATION]', 'status: failed_closed',
              `canonical_hub: #${process.env.ACTIVE_ISSUE}`, `target_sha: ${process.env.TARGET_SHA}`,
              `source_run_id: ${process.env.SOURCE_RUN_ID}`, `workflow_run: ${context.runId}`,
              'production_state_mutation: UNKNOWN_AFTER_FAILURE', 'retry_without_evidence: false',
              'deployment: 0', 'db_mutation: 0', 'secret_mutation: 0', 'private_api: 0',
              'live_trading: 0', 'real_orders: 0', 'execution_authority: NONE',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ACTIVE_ISSUE), body,
            });
