name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: false
        default: main
        type: string
      data_probe_path:
        description: API path that must return valid JSON before promotion
        required: false
        default: /api/quotes?tickers=005930
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stock-app-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Canary, deploy, verify, rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      DATA_PROBE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.data_probe_path || '/api/quotes?tickers=005930' }}
      PUBLIC_BASE_URL: https://lsj119.duckdns.org

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" ]] || { echo "Missing PROD_SSH_HOST" >&2; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo "Missing PROD_SSH_USER" >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Missing PROD_SSH_PRIVATE_KEY" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy exact revision
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_env="$(printf 'TARGET_REF=%q DATA_PROBE_PATH=%q PUBLIC_BASE_URL=%q' \
            "$TARGET_REF" "$DATA_PROBE_PATH" "$PUBLIC_BASE_URL")"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail

          LIVE_DIR=/opt/stock-app
          PM2_NAME=stock-app
          LIVE_PORT=8080
          CANARY_PORT=18081

          [[ -d "$LIVE_DIR/.git" ]] || {
            echo "Live repository not found: $LIVE_DIR" >&2
            exit 1
          }

          git -C "$LIVE_DIR" fetch --no-tags origin "$TARGET_REF"
          TARGET_SHA="$(git -C "$LIVE_DIR" rev-parse FETCH_HEAD^{commit})"
          DEPLOY_SCRIPT="$(mktemp /tmp/stock-app-deploy.XXXXXX)"

          if git -C "$LIVE_DIR" cat-file -e "$TARGET_SHA:ops/deploy-production.sh" 2>/dev/null; then
            git -C "$LIVE_DIR" show "$TARGET_SHA:ops/deploy-production.sh" > "$DEPLOY_SCRIPT"
          else
            git -C "$LIVE_DIR" fetch --no-tags origin main
            git -C "$LIVE_DIR" show FETCH_HEAD:ops/deploy-production.sh > "$DEPLOY_SCRIPT"
          fi

          chmod 700 "$DEPLOY_SCRIPT"

          LIVE_DIR="$LIVE_DIR" \
          PM2_NAME="$PM2_NAME" \
          LIVE_PORT="$LIVE_PORT" \
          CANARY_PORT="$CANARY_PORT" \
          DATA_PROBE_PATH="$DATA_PROBE_PATH" \
          PUBLIC_BASE_URL="$PUBLIC_BASE_URL" \
          "$DEPLOY_SCRIPT" "$TARGET_SHA"

          rm -f "$DEPLOY_SCRIPT"
          REMOTE

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production deployment succeeded'
            echo
            echo "- Target: \`$TARGET_REF\`"
            echo '- PM2 process: `stock-app`'
            echo '- Live port: `8080`'
            echo '- Canary port: `18081`'
            echo "- Data probe: \`$DATA_PROBE_PATH\`"
            echo '- Rollback: automatic on failed production verification'
          } >> "$GITHUB_STEP_SUMMARY"
