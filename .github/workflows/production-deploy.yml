name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA from main to deploy
        required: true
        type: string
      data_probe_path:
        description: API path that must return valid JSON before promotion
        required: false
        default: /api/healthz/data-plane
        type: string
      force_rebuild:
        description: Rebuild even when the selected commit is already active
        required: false
        default: false
        type: boolean
      qa_scope:
        description: Post-deploy QA scope
        required: true
        default: full
        type: choice
        options:
          - full
          - trading_core
  pull_request:
    paths:
      - .github/workflows/production-deploy.yml
      - .github/workflows/production-one-time-approval.yml
      - .github/workflows/production-postdeploy-qa.yml
      - .github/workflows/production-trading-core-qa.yml
      - .github/tests/production-trading-core-qa-contract.test.mjs
      - stock-analyzer/e2e/production-trading-core-qa.spec.ts
      - stock-analyzer/playwright.production-trading-core.config.ts
      - .github/scripts/run-production-readonly-qa.sh
      - .github/scripts/verify-production-qa-receipt.cjs
      - .github/scripts/verify-production-deploy-execution.cjs
      - ops/apply-production-paper-journal-privileges.mjs
      - ops/classify-production-paper-journal-privilege-failure.mjs
      - ops/verify-production-paper-journal-privileges.mjs
      - api-server/supabase/migrations/2026080201_journal_sync_analytics_phase7.sql
      - api-server/supabase/migrations/2026080203_phase8_paper_capability_rls.sql
      - api-server/supabase/migrations/2026080501_paper_journal_authenticated_privileges.sql
      - .github/scripts/build-production-postdeploy-context.mjs
      - .github/scripts/build-production-postdeploy-evidence.cjs
      - .github/scripts/production-postdeploy-qa-evidence.cjs
      - stock-analyzer/e2e/production-account-readonly-live-qa.spec.ts
      - api-server/src/features/account-readonly/account-readonly.contract.ts
      - api-server/src/features/account-readonly/providers/exchange-readonly.providers.ts
      - .github/scripts/verify-production-postdeploy-qa-contract.mjs
      - .github/workflows/futures-public-network-smoke.yml
      - .github/workflows/post-merge-release-provenance.yml
      - .github/workflows/staging-readiness.yml
      - ops/deploy-production.sh
      - ops/production-verification-diagnostics.sh
      - ops/production-trade-schema-readonly-audit.sh
      - ops/verify-production-trade-schema-readonly-audit.mjs
      - ops/deploy-staging.sh
      - api-server/scripts/production-ci-provenance.cjs
      - api-server/scripts/release-candidate-provenance.cjs
      - api-server/scripts/release-candidate-provenance.test.cjs
      - api-server/scripts/verify-production-ci-provenance-contract.mjs
      - api-server/scripts/verify-production-data-plane-probe-contract.mjs
      - api-server/scripts/verify-production-verification-contract.mjs
      - api-server/scripts/verify-phase10-deployment-safety.mjs
      - api-server/scripts/build-staging-verdict.mjs
      - api-server/scripts/verify-staging-verdict.mjs

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && 'stock-app-production-live'
        || format('production-deploy-pr-validation-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate production deployment safeguards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate shell syntax
        run: |
          set -Eeuo pipefail
          bash -n ops/deploy-production.sh
          bash -n ops/production-verification-diagnostics.sh
          bash -n ops/production-trade-schema-readonly-audit.sh
          bash -n ops/deploy-staging.sh
      - name: Verify Phase 10 deployment safety contract
        run: node api-server/scripts/verify-phase10-deployment-safety.mjs
      - name: Verify release candidate provenance contract
        run: node api-server/scripts/verify-production-ci-provenance-contract.mjs
      - name: Verify Production data-plane probe contract
        run: node api-server/scripts/verify-production-data-plane-probe-contract.mjs
      - name: Verify Production post-switch verification contract
        run: node api-server/scripts/verify-production-verification-contract.mjs
      - name: Verify Production trade schema read-only gate contract
        run: node ops/verify-production-trade-schema-readonly-audit.mjs --static
      - name: Verify Production paper journal privilege contract
        run: node ops/verify-production-paper-journal-privileges.mjs --static
      - name: Verify approval-free post-deploy QA isolation contract
        run: node .github/scripts/verify-production-postdeploy-qa-contract.mjs

  approval-gate:
    name: Validate immutable main revision, release provenance, and exact staging verdict
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      staging_run_id: ${{ steps.verdict-artifact.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require an immutable exact current main commit
        id: target
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Production deployment requires an exact 40-character commit SHA.' >&2
            exit 1
          }
          TARGET_SHA="${TARGET_SHA,,}"
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD^{commit})"
          git fetch --no-tags origin "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "Production deployment target must equal exact current main: target=$TARGET_SHA main=$MAIN_SHA" >&2
            exit 1
          }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Require verified post-merge release provenance
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const {
              evaluatePostMergeStatusProvenance,
              inspectPostMergeStatusEvidence,
            } = require(`${process.env.GITHUB_WORKSPACE}/api-server/scripts/release-candidate-provenance.cjs`);
            const targetSha = process.env.TARGET_SHA;
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            const evidence = inspectPostMergeStatusEvidence(statuses);
            if (!evidence.ok) {
              core.setFailed(`Post-merge release provenance unavailable: ${evidence.reason}.`);
              return;
            }
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: evidence.runId,
            })).data;
            const verified = evaluatePostMergeStatusProvenance({
              targetSha,
              currentMainSha: main.data.commit.sha,
              statuses,
              run,
            });
            if (!verified.ok) {
              core.setFailed(`Post-merge release provenance rejected: ${verified.reason}.`);
              return;
            }
            core.info(`Pre-merge Full CI + merged-tree identity accepted from Post-Merge Provenance Run ID ${verified.runId}.`);

      - name: Locate successful exact-SHA staging verdict artifact
        id: verdict-artifact
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const artifactName = `staging-verdict-${targetSha}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });
            const candidates = artifacts
              .filter((artifact) => !artifact.expired && artifact.workflow_run?.head_sha === targetSha)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            let accepted = null;
            for (const artifact of candidates) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              const run = response.data;
              const valid = run.event === 'workflow_dispatch'
                && run.head_branch === 'main'
                && run.head_sha === targetSha
                && run.path === '.github/workflows/staging-readiness.yml'
                && run.status === 'completed'
                && run.conclusion === 'success';
              if (valid) {
                accepted = { artifact, run };
                break;
              }
            }
            if (!accepted) {
              core.setFailed(`No successful Staging Readiness run with artifact ${artifactName} exists for the exact target SHA.`);
              return;
            }
            core.setOutput('run_id', String(accepted.run.id));
            core.setOutput('artifact_id', String(accepted.artifact.id));
            core.info(`Exact staging verdict artifact accepted from Run ID ${accepted.run.id}.`);
      - name: Download exact staging verdict artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-verdict-${{ steps.target.outputs.sha }}
          path: staging-verdict
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verdict-artifact.outputs.run_id }}
      - name: Require release_ready true, exact SHA, zero failures, and zero skipped checks
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: node api-server/scripts/verify-staging-verdict.mjs staging-verdict/staging-verdict.json
      - name: Record accepted staging evidence
        run: |
          {
            echo '## Production release gate passed'
            echo
            echo "- Target SHA: \`${{ steps.target.outputs.sha }}\`"
            echo "- Staging Run ID: \`${{ steps.verdict-artifact.outputs.run_id }}\`"
            echo '- staging-verdict.json: `release_ready=true`'
            echo '- Failed checks: `0`'
            echo '- Skipped checks: `0`'
            echo '- Production deployment has not started yet.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Approved canary, production deploy, verify, and rollback
    if: github.event_name == 'workflow_dispatch'
    needs: approval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      TARGET_SHA: ${{ needs.approval-gate.outputs.target_sha }}
      DATA_PROBE_PATH: ${{ inputs.data_probe_path }}
      FORCE_REBUILD: ${{ inputs.force_rebuild }}
      QA_SCOPE: ${{ inputs.qa_scope }}
      PUBLIC_BASE_URL: https://lsj119.com
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Validate production secrets
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
          PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" ]] || { echo 'Missing PROD_SSH_HOST' >&2; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo 'Missing PROD_SSH_USER' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo 'Missing PROD_SSH_PRIVATE_KEY' >&2; exit 1; }
          [[ -n "$PRODUCTION_QA_LOGIN" && -n "$PRODUCTION_QA_PASSWORD" ]] || {
            echo 'Missing Production read-only QA credential' >&2
            exit 1
          }
          echo "::add-mask::$PRODUCTION_QA_LOGIN"
          echo "::add-mask::$PRODUCTION_QA_PASSWORD"
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
      - name: Require canonical Production trade schema and journal privileges before application mutation
        id: database-gates
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$PROD_DATABASE_URL" && "$PROD_DATABASE_URL" =~ ^postgres(ql)?:// ]] || {
            echo 'Protected Production database credential is missing or invalid.' >&2
            exit 1
          }
          audit_artifact="$(mktemp "$RUNNER_TEMP/production-trade-schema-audit.XXXXXX.json")"
          audit_stderr="$(mktemp "$RUNNER_TEMP/production-trade-schema-audit.XXXXXX.stderr")"
          cleanup() { rm -f "$audit_artifact" "$audit_stderr"; }
          trap cleanup EXIT
          audit_script_b64="$(base64 -w0 ops/production-trade-schema-readonly-audit.sh)"
          quoted_script="$(printf '%q' "$audit_script_b64")"
          remote_command="PM2_NAME=stock-app AUDIT_SCRIPT_B64=$quoted_script bash -c 'IFS= read -r PROD_DATABASE_URL; export PROD_DATABASE_URL; printf \"%s\" \"\$AUDIT_SCRIPT_B64\" | base64 -d | bash'"

          set +e
          printf '%s\n' "$PROD_DATABASE_URL" | ssh \
            -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_command" \
            > "$audit_artifact" 2> "$audit_stderr"
          audit_status=$?
          set -e

          [[ -s "$audit_artifact" ]] || {
            echo 'Production trade schema audit produced no sanitized evidence; remote stderr is intentionally not printed.' >&2
            exit 1
          }
          node ops/verify-production-trade-schema-readonly-audit.mjs --artifact "$audit_artifact"
          if (( audit_status != 0 )); then
            node - "$audit_artifact" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.error('Production trade schema gate blocked application deployment.');
          console.error('code=' + String(value.code ?? 'UNKNOWN'));
          console.error('missingTables=' + JSON.stringify(value.missingTables ?? []));
          console.error('missingFunctions=' + JSON.stringify(value.missingFunctions ?? []));
          NODE
            exit "$audit_status"
          fi

          (
            paper_artifact="$(mktemp "$RUNNER_TEMP/production-paper-journal-privileges.XXXXXX.json")"
            paper_stderr="$(mktemp "$RUNNER_TEMP/production-paper-journal-privileges.XXXXXX.stderr")"
            paper_archive="$(mktemp "$RUNNER_TEMP/production-paper-journal-privileges.XXXXXX.tar.gz")"
            remote_dir="$({
              ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
                "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/paper-journal-privileges.XXXXXX'
            })"
            [[ "$remote_dir" =~ ^/tmp/paper-journal-privileges\.[A-Za-z0-9]+$ ]] || {
              echo 'Production paper journal temporary directory was rejected.' >&2
              exit 1
            }
            quoted_remote_dir="$(printf '%q' "$remote_dir")"
            cleanup_paper_gate() {
              rm -f "$paper_stderr" "$paper_archive"
              ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
                "$SSH_USER@$SSH_HOST" \
                "case $quoted_remote_dir in /tmp/paper-journal-privileges.*) find $quoted_remote_dir -depth -mindepth 1 -delete && rmdir $quoted_remote_dir ;; *) exit 2 ;; esac" \
                >/dev/null 2>&1 || true
            }
            trap cleanup_paper_gate EXIT
            tar -czf "$paper_archive" \
              ops/apply-production-paper-journal-privileges.mjs \
              ops/classify-production-paper-journal-privilege-failure.mjs \
              api-server/supabase/migrations/2026080201_journal_sync_analytics_phase7.sql \
              api-server/supabase/migrations/2026080203_phase8_paper_capability_rls.sql \
              api-server/supabase/migrations/2026080501_paper_journal_authenticated_privileges.sql
            scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$paper_archive" "$SSH_USER@$SSH_HOST:$remote_dir/tooling.tar.gz"
            paper_command="$(printf 'cd %q && tar -xzf tooling.tar.gz && IFS= read -r PROD_DATABASE_URL && export PROD_DATABASE_URL && APPROVED_TARGET_SHA=%q node ops/apply-production-paper-journal-privileges.mjs' \
              "$remote_dir" "$TARGET_SHA")"
            if ! printf '%s\n' "$PROD_DATABASE_URL" | ssh \
              -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" "$paper_command" > "$paper_artifact" 2> "$paper_stderr"; then
              classification="$(grep -Eo '^\[production-paper-journal-privileges\] [A-Za-z0-9_:-]+' "$paper_stderr" | tail -n 1 | sed 's/^\[production-paper-journal-privileges\] //' || true)"
              [[ -n "$classification" ]] || classification='unknown_safe_failure'
              echo "Production paper journal privilege apply failed safely: $classification" >&2
              exit 1
            fi
            node ops/verify-production-paper-journal-privileges.mjs --artifact "$paper_artifact"
            printf 'paper_journal_artifact=%s\n' "$paper_artifact" >> "$GITHUB_OUTPUT"
          )

      - name: Upload sanitized Production paper journal privilege evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-paper-journal-privileges-${{ env.TARGET_SHA }}
          path: ${{ steps.database-gates.outputs.paper_journal_artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Deploy exact approved revision
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q DATA_PROBE_PATH=%q FORCE_REBUILD=%q PUBLIC_BASE_URL=%q REPOSITORY_URL=%q' \
            "$TARGET_SHA" "$DATA_PROBE_PATH" "$FORCE_REBUILD" "$PUBLIC_BASE_URL" "$REPOSITORY_URL")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          LIVE_DIR=/opt/stock-app
          PM2_NAME=stock-app
          LIVE_PORT=8080
          CANARY_PORT=18081
          SOURCE_DIR="$(mktemp -d /tmp/stock-app-source.XXXXXX)"
          STATE_FILE="$LIVE_DIR/.deploy/current-sha"
          SAVED_STATE=""
          FORCE_MARKED=0
          cleanup_remote() {
            local status=$?
            if (( status != 0 )) && [[ "$FORCE_MARKED" == "1" ]]; then
              mkdir -p "$(dirname "$STATE_FILE")"
              if [[ -n "$SAVED_STATE" ]]; then printf '%s\n' "$SAVED_STATE" > "$STATE_FILE"; else rm -f "$STATE_FILE"; fi
            fi
            rm -rf -- "$SOURCE_DIR"
            return "$status"
          }
          trap cleanup_remote EXIT
          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          RESOLVED_SHA="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})"
          [[ "$RESOLVED_SHA" == "$TARGET_SHA" ]] || { echo 'Resolved SHA differs from approved SHA' >&2; exit 1; }
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"
          if [[ "$FORCE_REBUILD" == "true" ]] && [[ -s "$STATE_FILE" ]]; then
            ACTIVE_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
            if [[ "$ACTIVE_SHA" == "$TARGET_SHA" ]]; then
              SAVED_STATE="$ACTIVE_SHA"
              printf 'force-rebuild-%s\n' "$(date -u +%Y%m%dT%H%M%SZ)" > "$STATE_FILE"
              FORCE_MARKED=1
            fi
          fi
          DEPLOY_SCRIPT="$SOURCE_DIR/ops/deploy-production.sh"
          [[ -f "$DEPLOY_SCRIPT" ]] || { echo 'Deployment script missing' >&2; exit 1; }
          [[ -f "$SOURCE_DIR/ops/production-verification-diagnostics.sh" ]] || { echo 'Production verification diagnostics missing' >&2; exit 1; }
          chmod 700 "$DEPLOY_SCRIPT"
          BASH_ENV="$SOURCE_DIR/ops/production-verification-diagnostics.sh" \
            SOURCE_DIR="$SOURCE_DIR" LIVE_DIR="$LIVE_DIR" PM2_NAME="$PM2_NAME" LIVE_PORT="$LIVE_PORT" \
            CANARY_PORT="$CANARY_PORT" DATA_PROBE_PATH="$DATA_PROBE_PATH" PUBLIC_BASE_URL="$PUBLIC_BASE_URL" \
            "$DEPLOY_SCRIPT" "$TARGET_SHA"
          REMOTE
      - name: Record successful deployment boundary
        run: |
          set -Eeuo pipefail
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "DEPLOYMENT_COMPLETED_AT=$completed_at" >> "$GITHUB_ENV"
          echo "QA_STARTED_AT=$completed_at" >> "$GITHUB_ENV"

      - name: Destroy deployment authority before read-only QA
        if: always()
        run: |
          set -Eeuo pipefail
          if [[ -f "$HOME/.ssh/id_ed25519" ]]; then
            chmod u+w "$HOME/.ssh/id_ed25519"
            rm -f -- "$HOME/.ssh/id_ed25519"
          fi
          test ! -e "$HOME/.ssh/id_ed25519"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install exact-SHA QA dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Chromium runtime
        working-directory: stock-analyzer
        run: pnpm exec playwright install chromium

      - name: Pre-QA identity, authority, and gate-conflict check
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BASE_URL: https://lsj119.com
        run: >-
          node .github/scripts/build-production-postdeploy-context.mjs
          postdeploy-evidence/production-postdeploy-context.json
          "$TARGET_SHA" "$GITHUB_RUN_ID" "$DEPLOYMENT_COMPLETED_AT" "$QA_STARTED_AT" inline

      - name: 1 · Comprehensive Production read-only QA
        if: ${{ inputs.qa_scope == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOY_SHA: ${{ env.TARGET_SHA }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ github.run_id }}
          PRODUCTION_DEPLOY_MODE: inline
          PRODUCTION_BASE_URL: https://lsj119.com
          PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
          PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
          LIVE_TRADING: "false"
          AUTO_TRADING: "false"
          REAL_ORDER_ENABLED: "false"
          PRIVATE_TRADING_API_ALLOWED: "false"
          ORDER_EXECUTION_ENABLED: "false"
          LIVE_TRADING_ACTIVATION_APPROVED: "false"
          SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: "false"
          LIVE_AUTOMATIC_TRADING_ENABLED: "false"
          MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: "false"
          MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: "false"
          FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED: "false"
          BITGET_FUTURES_LIVE_ORDER_ENABLED: "false"
          BITGET_LIVE_ORDER_ENABLED: "false"
          UPBIT_LIVE_ORDER_ENABLED: "false"
          KIWOOM_LIVE_ORDER_ENABLED: "false"
          TOSS_LIVE_ORDER_ENABLED: "false"
        run: bash .github/scripts/run-production-readonly-qa.sh comprehensive

      - name: Upload Comprehensive QA evidence
        if: ${{ inputs.qa_scope == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-comprehensive-readonly-${{ github.run_id }}
          path: stock-analyzer/production-comprehensive-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: 2 · Four-provider Account Production read-only QA
        id: account_qa
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOY_SHA: ${{ env.TARGET_SHA }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ github.run_id }}
          PRODUCTION_DEPLOY_MODE: inline
          PRODUCTION_BASE_URL: https://lsj119.com
          PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
          PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
          LIVE_TRADING: "false"
          AUTO_TRADING: "false"
          REAL_ORDER_ENABLED: "false"
          PRIVATE_TRADING_API_ALLOWED: "false"
          ORDER_EXECUTION_ENABLED: "false"
          LIVE_TRADING_ACTIVATION_APPROVED: "false"
          SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: "false"
          LIVE_AUTOMATIC_TRADING_ENABLED: "false"
          MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: "false"
          MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: "false"
          FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED: "false"
          BITGET_FUTURES_LIVE_ORDER_ENABLED: "false"
          BITGET_LIVE_ORDER_ENABLED: "false"
          UPBIT_LIVE_ORDER_ENABLED: "false"
          KIWOOM_LIVE_ORDER_ENABLED: "false"
          TOSS_LIVE_ORDER_ENABLED: "false"
          PRODUCTION_ACCOUNT_READONLY_TARGET_PROVIDERS: bitget,kiwoom,toss,upbit
          PRODUCTION_LOGIN_DIAGNOSTIC_DIR: production-login-diagnostics/account
        run: bash .github/scripts/run-production-readonly-qa.sh account

      - name: Upload Four-provider Account QA evidence
        if: ${{ always() && steps.account_qa.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-account-readonly-live-${{ env.TARGET_SHA }}
          path: |
            stock-analyzer/production-account-readonly-artifacts
            stock-analyzer/production-login-diagnostics/account
          if-no-files-found: warn
          retention-days: 30

      - name: 3 · Production Credential Reuse QA
        id: credential_qa
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOY_SHA: ${{ env.TARGET_SHA }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ github.run_id }}
          PRODUCTION_DEPLOY_MODE: inline
          PRODUCTION_BASE_URL: https://lsj119.com
          PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
          PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
          LIVE_TRADING: "false"
          AUTO_TRADING: "false"
          REAL_ORDER_ENABLED: "false"
          PRIVATE_TRADING_API_ALLOWED: "false"
          ORDER_EXECUTION_ENABLED: "false"
          LIVE_TRADING_ACTIVATION_APPROVED: "false"
          SPOT_LIVE_LIMITED_ACTIVATION_APPROVED: "false"
          LIVE_AUTOMATIC_TRADING_ENABLED: "false"
          MEMBER_AUTO_TRADING_BACKGROUND_ENABLED: "false"
          MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED: "false"
          FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED: "false"
          BITGET_FUTURES_LIVE_ORDER_ENABLED: "false"
          BITGET_LIVE_ORDER_ENABLED: "false"
          UPBIT_LIVE_ORDER_ENABLED: "false"
          KIWOOM_LIVE_ORDER_ENABLED: "false"
          TOSS_LIVE_ORDER_ENABLED: "false"
          PRODUCTION_LOGIN_DIAGNOSTIC_DIR: production-login-diagnostics/credential
        run: bash .github/scripts/run-production-readonly-qa.sh credential

      - name: Upload Credential Reuse QA evidence
        if: ${{ always() && steps.credential_qa.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-live-credential-reuse-${{ env.TARGET_SHA }}
          path: |
            stock-analyzer/production-live-credential-reuse-artifacts
            stock-analyzer/production-login-diagnostics/credential
          if-no-files-found: warn
          retention-days: 30

      - name: 1T · Focused Trading Core Production QA
        id: trading_core_qa
        if: ${{ inputs.qa_scope == 'trading_core' }}
        env:
          EXPECTED_DEPLOY_SHA: ${{ env.TARGET_SHA }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ github.run_id }}
          PRODUCTION_BASE_URL: https://lsj119.com
          PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
          PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
          PRODUCTION_TRADING_CORE_QA: 'true'
          PRODUCTION_TRADING_CORE_ARTIFACT_DIR: production-trading-core-artifacts
          PRODUCTION_LOGIN_DIAGNOSTIC_DIR: production-login-diagnostics/trading-core
        working-directory: stock-analyzer
        run: pnpm exec playwright test --config=playwright.production-trading-core.config.ts

      - name: Upload Trading Core QA evidence
        if: ${{ always() && steps.trading_core_qa.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-trading-core-${{ env.TARGET_SHA }}
          path: |
            stock-analyzer/production-trading-core-artifacts
            stock-analyzer/production-login-diagnostics/trading-core
          if-no-files-found: warn
          retention-days: 30

      - name: Final exact-SHA identity, safety, and gate-conflict check
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BASE_URL: https://lsj119.com
        run: >-
          node .github/scripts/build-production-postdeploy-context.mjs
          postdeploy-evidence/production-postdeploy-context.json
          "$TARGET_SHA" "$GITHUB_RUN_ID" "$DEPLOYMENT_COMPLETED_AT" "$QA_STARTED_AT" inline

      - name: Assemble exact-run post-deploy evidence
        run: |
          set -Eeuo pipefail
          if [[ "$QA_SCOPE" == "full" ]]; then
            cp stock-analyzer/production-comprehensive-artifacts/production-comprehensive-readonly-qa.json postdeploy-evidence/
          elif [[ "$QA_SCOPE" == "trading_core" ]]; then
            cp stock-analyzer/production-trading-core-artifacts/production-trading-core-qa.json postdeploy-evidence/
          else
            echo "Unsupported QA scope: $QA_SCOPE" >&2
            exit 1
          fi
          cp stock-analyzer/production-account-readonly-artifacts/production-account-readonly-live-qa.json postdeploy-evidence/
          cp stock-analyzer/production-live-credential-reuse-artifacts/production-live-credential-reuse-qa.json postdeploy-evidence/
          node .github/scripts/build-production-postdeploy-evidence.cjs postdeploy-evidence "$TARGET_SHA" "$GITHUB_RUN_ID" "$QA_SCOPE"

      - name: Upload immutable ACTIVATION_READY evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-postdeploy-activation-ready-${{ env.TARGET_SHA }}
          path: postdeploy-evidence/production-postdeploy-activation-ready-${{ env.TARGET_SHA }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Deployment and post-deploy QA summary
        if: success()
        run: |
          {
            echo '## Production deployment succeeded'
            echo
            echo "- Approved SHA: \`$TARGET_SHA\`"
            echo '- Trigger: explicit workflow dispatch only'
            echo '- Environment: `production`'
            echo '- Release provenance: pre-merge Required CI 6/6 + exact merged-tree identity verified on current main'
            echo "- Release-ready staging evidence Run ID: \`${{ needs.approval-gate.outputs.staging_run_id }}\`"
            echo '- staging-verdict.json: exact SHA, failed=0, skipped=0, release_ready=true'
            echo '- Rollback: automatic on failed verification'
            echo "- QA scope: `$QA_SCOPE`"
            if [[ "$QA_SCOPE" == "trading_core" ]]; then
              echo '- Trading Core / Toss / Kiwoom / Upbit / Bitget / Credential Reuse: `PASS`'
            else
              echo '- Comprehensive / Toss / Kiwoom / Upbit / Bitget / Credential Reuse: `PASS`'
            fi
            echo '- orders/cancels/amends/transfers/withdrawals: `0/0/0/0/0`'
            echo '- liveTradingAuthorityGranted: `false`'
            echo '- autoTradingAuthorityGranted: `false`'
            echo '- active conflicting trading gates: `0`'
            echo '- ACTIVATION_READY: `true`'
          } >> "$GITHUB_STEP_SUMMARY"
