name: Research Center Predeploy Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/research-center-predeploy-validation.yml'
      - '.github/workflows/fast-profitability-v1-activation.yml'
      - '.github/workflows/fast-profitability-v1-collector.yml'
      - '.github/workflows/fast-profitability-v1-preactivation-watch.yml'
      - '.github/workflows/prediction-lab-52d-validation.yml'
      - '.github/workflows/prediction-lab-canonical-shadow-cycle.yml'
      - 'market-prediction-lab/tests/canonical-shadow-runtime-activation-v1.test.js'
      - 'api-server/scripts/verify-research-center-predeploy-contract.mjs'
      - 'api-server/scripts/verify-fast-profitability-bounded-artifact-discovery-contract.mjs'
      - 'api-server/scripts/verify-fast-profitability-preactivation-watch-contract.mjs'
      - 'api-server/src/scripts/run-fast-profitability-collector.ts'
      - 'api-server/src/services/fast-profitability-activation.service.ts'
      - 'api-server/src/services/fast-profitability-evidence-runtime.service.ts'
      - 'api-server/src/services/forward-recommendation-observer.service.ts'
      - 'api-server/src/services/unified-trade-journal-canonical-binding.service.ts'
      - 'api-server/src/routes/admin.ts'
      - 'api-server/src/routes/index.ts'
      - 'api-server/src/routes/paper-journal.ts'
      - 'api-server/src/routes/paper-journal.smoke.test.ts'
      - 'api-server/src/services/member-access-phase8.test.ts'
      - 'packages/member-access/src/index.js'
      - 'packages/member-access/src/index.d.ts'
      - 'api-server/supabase/migrations/2026100601_member_access_s_ai_hardening.sql'
      - 'api-server/src/routes/research-workspace.ts'
      - 'api-server/src/routes/strategy-promotion.ts'
      - 'api-server/src/routes/video-research-evidence.ts'
      - 'api-server/src/routes/video-research-source-evidence.ts'
      - 'api-server/src/routes/market-summary-availability.smoke.test.ts'
      - 'api-server/src/services/research-center-readonly-contract.service.ts'
      - 'api-server/src/services/research-center-readonly-contract.service.test.ts'
      - 'api-server/src/services/research-adoption-review-gate.service.ts'
      - 'api-server/src/services/research-adoption-review-gate.service.test.ts'
      - 'api-server/src/services/strategy-promotion-research-bridge.service.ts'
      - 'api-server/src/services/strategy-promotion-research-bridge.service.test.ts'
      - 'market-prediction-lab/src/frozen-candidate-performance-reader-v1.js'
      - 'market-prediction-lab/src/frozen-candidate-performance-publisher-v1.js'
      - 'market-prediction-lab/tests/frozen-candidate-performance-publisher-v1.test.js'
      - 'stock-analyzer/src/App.tsx'
      - 'stock-analyzer/src/lib/app-navigation.ts'
      - 'stock-analyzer/src/lib/research-center.ts'
      - 'stock-analyzer/src/lib/excel-export.ts'
      - 'stock-analyzer/src/lib/backtest.ts'
      - 'stock-analyzer/src/components/backtest-research-panel.tsx'
      - 'research-production/test/research-engine.test.mjs'
      - 'research-production/src/engine.mjs'
      - 'market-prediction-lab/tests/formula-auto-backtest-queue-v1.test.js'
      - 'market-prediction-lab/scripts/run-formula-auto-backtest-queue-v1.js'
      - 'market-prediction-lab/src/formula-auto-backtest-queue-v1.js'
      - 'stock-analyzer/src/components/paper-closed-loop-observer.tsx'
      - 'stock-analyzer/src/lib/research-center-product.ts'
      - 'stock-analyzer/src/lib/research-journal-binding.ts'
      - 'stock-analyzer/src/lib/strategy-promotion.ts'
      - 'stock-analyzer/src/components/research-video-source-panel.tsx'
      - 'stock-analyzer/src/components/research-workspace-*.tsx'
      - 'stock-analyzer/src/pages/research-center*.tsx'
      - 'stock-analyzer/e2e/research-*.spec.ts'
      - 'research-dashboard/**'
      - 'research-production/**'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: research-center-predeploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    name: Research Center connection and contract QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable detached HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref --quiet --short HEAD || true)"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Research Center full connection graph
        run: |
          set -Eeuo pipefail
          node api-server/scripts/verify-research-center-predeploy-contract.mjs
          node api-server/scripts/verify-fast-profitability-bounded-artifact-discovery-contract.mjs
          node api-server/scripts/verify-fast-profitability-preactivation-watch-contract.mjs

      - name: Assert formula queue missing producer and Paper consumer do not appear ready
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "if counts['PASS'] or registered:" research-dashboard/server.py
          grep -Fq "input.producerBound !== false || input.paperConsumerBound !== false" api-server/src/services/research-center-readonly-contract.service.ts
          grep -Fq 'Paper 미연결' stock-analyzer/src/pages/research-center.tsx

      - name: Backend and frontend semantic typecheck
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server run typecheck
          pnpm --dir stock-analyzer run typecheck

      - name: Bundle focused backend Research Center contracts
        working-directory: api-server
        run: |
          set -Eeuo pipefail
          pnpm exec esbuild src/services/research-center-readonly-contract.service.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/research-center-readonly.test.cjs"
          pnpm exec esbuild src/services/strategy-promotion-research-bridge.service.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/research-promotion-bridge.test.cjs"
          pnpm exec esbuild src/services/research-adoption-review-gate.service.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/research-adoption-review.test.cjs"
          pnpm exec esbuild src/routes/strategy-promotion.smoke.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/strategy-promotion-route.test.cjs"
          pnpm exec esbuild src/routes/paper-journal.smoke.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/paper-journal-route.test.cjs"
          pnpm exec esbuild src/routes/market-summary-availability.smoke.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/research-video-readback.test.cjs"
          pnpm exec esbuild src/services/research-workspace-authorization-v5.test.ts             --bundle --platform=node --format=cjs --target=node22             --outfile="$RUNNER_TEMP/research-workspace-auth.test.cjs"

      - name: Run focused backend Research Center contracts
        run: |
          set -Eeuo pipefail
          node --test             "$RUNNER_TEMP/research-center-readonly.test.cjs"             "$RUNNER_TEMP/research-promotion-bridge.test.cjs"             "$RUNNER_TEMP/research-adoption-review.test.cjs"             "$RUNNER_TEMP/strategy-promotion-route.test.cjs"             "$RUNNER_TEMP/paper-journal-route.test.cjs"             "$RUNNER_TEMP/research-video-readback.test.cjs"             "$RUNNER_TEMP/research-workspace-auth.test.cjs"

      - name: Validate Research Dashboard runtime contract
        working-directory: research-dashboard
        run: |
          set -Eeuo pipefail
          npm run check
          npm test
          python3 -m py_compile server.py video_research_readback.py
          python3 test/test_server.py
          python3 test/test_video_research_readback.py

      - name: Validate deploy-time Research services, timers and deterministic plan
        shell: bash
        run: |
          set -Eeuo pipefail

          systemd-analyze verify \
            research-dashboard/deploy/research-dashboard.service \
            research-production/deploy/research-production@.service \
            research-production/deploy/research-production-fast-historical.timer \
            research-production/deploy/research-production-long-history.timer \
            research-production/deploy/research-production-forward.timer \
            research-production/deploy/research-production-temporal-evidence.service \
            research-production/deploy/research-production-temporal-evidence.timer \
            research-production/deploy/research-production-factory-status.service \
            research-production/deploy/research-production-factory-status.timer \
            research-production/deploy/research-production-ai-review.service \
            research-production/deploy/research-production-ai-review.timer \
            research-production/deploy/research-production-video-discovery.service \
            research-production/deploy/research-production-video-discovery.timer

          for calendar in \
            '*-*-* 02:17:00 UTC' \
            'Sun *-*-* 03:43:00 UTC' \
            '*-*-* *:11:00 UTC' \
            '*-*-* *:05:00 UTC' \
            '*-*-* *:07:00 UTC' \
            '*-*-* *:29:00 UTC' \
            '*-*-* 00,03,06,09,12,15,18,21:52:00 UTC'
          do
            systemd-analyze calendar "$calendar" >/dev/null
          done

          bash -n research-dashboard/deploy/activate-server.sh
          bash -n research-production/deploy/activate-server.sh
          bash -n research-production/deploy/install-ai-research-units.sh

          for script in research-production/bin/*.mjs research-production/deploy/*.mjs; do
            node --check "$script"
          done

          grep -Fq 'Environment=RESEARCH_DASHBOARD_HOST=127.0.0.1' research-dashboard/deploy/research-dashboard.service
          grep -Fq 'Environment=RESEARCH_DASHBOARD_PORT=18090' research-dashboard/deploy/research-dashboard.service
          grep -Fq 'Environment=RESEARCH_STATE_ROOT=/var/lib/investment-research-production' research-dashboard/deploy/research-dashboard.service
          grep -Fq 'NoNewPrivileges=true' research-dashboard/deploy/research-dashboard.service
          grep -Fq 'ProtectSystem=strict' research-dashboard/deploy/research-dashboard.service
          grep -q '^CapabilityBoundingSet=$' research-dashboard/deploy/research-dashboard.service
          grep -q '^AmbientCapabilities=$' research-dashboard/deploy/research-dashboard.service

          for unit in \
            research-production/deploy/research-production@.service \
            research-production/deploy/research-production-temporal-evidence.service \
            research-production/deploy/research-production-factory-status.service \
            research-production/deploy/research-production-ai-review.service \
            research-production/deploy/research-production-video-discovery.service
          do
            grep -Fq 'NoNewPrivileges=true' "$unit"
            grep -Fq 'ProtectSystem=strict' "$unit"
            grep -q '^CapabilityBoundingSet=$' "$unit"
            ! grep -Eq 'LIVE_TRADING=(true|1)|PRIVATE_API_ENABLED=(true|1)|ORDER_AUTHORITY=(true|1)|REAL_ORDER_ENABLED=(true|1)' "$unit"
          done

          npm --prefix research-production test
          # New safe formula queue: historical-only, no provider secrets, no Live/Auto.
          node --test market-prediction-lab/tests/formula-auto-backtest-queue-v1.test.js

          state="$RUNNER_TEMP/research-predeploy-state"
          rm -rf "$state"
          mkdir -p "$state"
          node research-production/bin/research-cycle.mjs preflight \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-root "$state" \
            --research-sha "$EXPECTED_SHA"

          node research-production/bin/research-cycle.mjs plan \
            --profile all \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-root "$state" \
            --research-sha "$EXPECTED_SHA" > "$RUNNER_TEMP/research-predeploy-plan.json"

          node - "$RUNNER_TEMP/research-predeploy-plan.json" <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (plan.taskCount !== 11 || plan.stepCount !== 22) {
            throw new Error('RESEARCH_PREDEPLOY_PLAN_SHAPE_DRIFT');
          }
          if (plan.liveTrading !== false || plan.privateApi !== false || plan.orderAuthority !== false) {
            throw new Error('RESEARCH_PREDEPLOY_PLAN_AUTHORITY_DRIFT');
          }
          NODE

          printf '%s\n' \
            'RESEARCH_DEPLOY_CONTRACTS=PASS' \
            'DASHBOARD_LOOPBACK_18090=PASS' \
            'RESEARCH_PRODUCTION_SYSTEMD=PASS' \
            'RESEARCH_TIMERS=PASS' \
            'YOUTUBE_DISCOVERY_TIMER=PASS' \
            'AI_REVIEW_TIMER=PASS' \
            'DETERMINISTIC_RESEARCH_PLAN=PASS' \
            'LIVE_TRADING=false' \
            'PRIVATE_API=false' \
            'ORDER_AUTHORITY=false'

      - name: Validate exact-head workflow contracts
        run: |
          set -Eeuo pipefail
          node --test .github/tests/pr-exact-head-workflows.test.mjs

      - name: Development-only safety boundary
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/research-center-predeploy-validation.yml';
          const source = fs.readFileSync(file, 'utf8');
          const marker = '      - name: Development-only safety boundary';
          const markerIndex = source.indexOf(marker);
          if (markerIndex < 0) throw new Error('RESEARCH_PREDEPLOY_SAFETY_MARKER_MISSING');
          const executable = source.slice(0, markerIndex);
          const forbidden = [
            [/^\s*environment:\s*(?:production|staging)\s*$/mu, 'protected environment'],
            [/\$\{\{\s*secrets\./u, 'secret reference'],
            [/(?:merge_pull_request|deploy-production|LIVE_TRADING=true|AUTO_TRADING=true|REAL_ORDER_ENABLED=true)/u, 'mutation authority'],
          ];
          for (const [pattern, label] of forbidden) {
            if (pattern.test(executable)) throw new Error('RESEARCH_PREDEPLOY_FORBIDDEN_' + String(label).toUpperCase().replaceAll(' ', '_'));
          }
          NODE
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  browser:
    name: Research Center application browser QA
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable detached HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref --quiet --short HEAD || true)"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium

      - name: Research Center overview, evidence, Paper and abort browser regressions
        run: |
          set -Eeuo pipefail
          pnpm --dir stock-analyzer exec playwright test -c playwright.config.ts             e2e/research-center-professional-hierarchy.spec.ts             e2e/research-center-simple-ko-ai-debate.spec.ts             e2e/research-evidence-maturity.spec.ts             e2e/research-paper-closed-loop-observer.spec.ts             e2e/research-reload-abort-contract.spec.ts

      - name: Research Video and Workspace browser regressions
        run: |
          set -Eeuo pipefail
          pnpm --dir stock-analyzer exec playwright test -c playwright.research-workspace.config.ts

      - name: Retain browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-center-predeploy-browser-${{ github.run_id }}
          path: |
            stock-analyzer/test-results
            stock-analyzer/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Development-only browser boundary
        if: always()
        run: |
          printf '%s\n'             'RESEARCH_CENTER_PREDEPLOY=VALIDATION_ONLY'             'READY_AUTHORITY=false'             'MERGE_AUTHORITY=false'             'DEPLOY_AUTHORITY=false'             'LIVE_TRADING_AUTHORITY=false'             'ORDER_AUTHORITY=false'

  combined-market-watch:
    name: Four-market Research combined Draft QA (no deploy)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1791 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READBACK_SHA: ${{ github.event.pull_request.head.sha }}
      WATCH_SHA: '0c2e230a7f0c2dd3016896712526d6e2971575b9'
      BASE_SHA: 'ea5281cf16b552b03562e3e1e1cb9f2a90762784'
      LIVE_TRADING: 'false'
      AUTO_TRADING: 'false'
      REAL_ORDER_ENABLED: 'false'
      PRIVATE_TRADING_API_ALLOWED: 'false'
    steps:
      - name: Checkout exact Draft readback HEAD without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.READBACK_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Stage immutable cross-PR overlay only inside runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$READBACK_SHA"
          test -z "$(git symbolic-ref --quiet --short HEAD || true)"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/drift/research-market-watch-stock-source-parity-20261010)" = "$WATCH_SHA"
          git cat-file -e "$WATCH_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$READBACK_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$WATCH_SHA"
          test -z "$(git status --porcelain=v1)"
          if git diff --name-only "$BASE_SHA" "$WATCH_SHA" | grep -v '^research-production/'; then
            echo 'WATCH_PR_MODIFIES_OUTSIDE_RESEARCH_PRODUCTION' >&2
            exit 1
          fi
          if [[ -n "$(git diff --name-only "$BASE_SHA" "$READBACK_SHA" -- research-production/)" ]]; then
            echo 'CROSS_PR_FILE_OVERLAP_OR_BASE_DRIFT' >&2
            exit 1
          fi
          expected_count="$(git diff --name-only "$BASE_SHA" "$WATCH_SHA" -- research-production/ | wc -l | tr -d ' ')"
          test "$expected_count" -eq 15
          git diff --binary "$BASE_SHA" "$WATCH_SHA" -- research-production/ | git apply --index
          actual_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$actual_count" -eq "$expected_count"
          if git diff --cached --name-only | grep -v '^research-production/'; then
            echo 'COMBINED_QA_MUTATION_OUTSIDE_WATCH_PATHS' >&2
            exit 1
          fi
          git diff --cached --check
          virtual_tree="$(git write-tree)"
          {
            echo '## Isolated 4-market combined Draft QA'
            echo "- Base main: `$BASE_SHA`"
            echo "- Readback Draft #1791: `$READBACK_SHA`"
            echo "- Watch Draft #1794: `$WATCH_SHA`"
            echo "- Ephemeral combined tree: `$virtual_tree`"
            echo "- Watch files overlaid locally: $actual_count"
            echo '- No branch update, main merge, deployment or order authority.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "COMBINED_TREE=$virtual_tree" >> "$GITHUB_ENV"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run combined watcher and Python Dashboard regression suites
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix research-production test
          python3 -m py_compile research-dashboard/lightweight_market_watch_readback.py
          python3 research-dashboard/test/test_lightweight_market_watch_readback.py
          node api-server/scripts/verify-research-center-predeploy-contract.mjs

      - name: Typecheck combined API and web readback contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server run typecheck
          pnpm --dir stock-analyzer run typecheck

      - name: Test combined backend read-only API sanitizer
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server exec esbuild src/services/research-center-readonly-contract.service.test.ts --bundle --platform=node --format=cjs --target=node22 --outfile="$RUNNER_TEMP/combined-market-watch-api.test.cjs"
          node --test "$RUNNER_TEMP/combined-market-watch-api.test.cjs"

      - name: Install Chromium for combined browser QA
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium

      - name: Run combined Research Center browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir stock-analyzer exec playwright test -c playwright.config.ts e2e/research-center-simple-ko-ai-debate.spec.ts

      - name: Record Draft-only authority boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'COMBINED_QA=EPHEMERAL_ONLY' 'READY=false' 'MERGE_MAIN=false' 'STAGING_DEPLOY=false' 'PRODUCTION_DEPLOY=false' 'LIVE_TRADING=false' 'PAPER_ORDER=false' 'ORDER_AUTHORITY=NONE'
