name: Research US Pullback V4 Audit

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-us-pullback-v4-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "37416066638"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: python -m pip install "pandas>=2.2,<3"
      - name: Download US V4 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: us-opening-pullback-rebreak-v4-*
          path: us-v4
      - name: Audit grid
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          files=list(Path('us-v4').glob('**/candidate-grid.csv'))
          if not files: raise SystemExit('candidate-grid.csv missing')
          df=pd.read_csv(files[0])
          def n(s): return int(s.fillna(False).sum())
          audit={
            'candidates':len(df),
            'trainPositive':n(df.trainReturn>0),'trainPFgt1':n(df.trainPF>1),'trainPass':n(df.trainPass==True),
            'calPositive':n(df.calibrationReturn>0),'calPFgt1':n(df.calibrationPF>1),'calPass':n(df.calibrationPass==True),
            'valPositive':n(df.validationReturn>0),'valPFgt1':n(df.validationPF>1),'valPass':n(df.validationPass==True),
            'reusedPositive':n(df.reusedReturn>0),'reusedPFgt1':n(df.reusedPF>1),
          }
          cols=['candidate','gap','rvol','first5Return','topN','pullbackPct','wait','target','hold','trainReturn','trainPF','trainTrades','calibrationReturn','calibrationPF','calibrationMDD','calibrationPosMonthRate','calibrationTrades','validationReturn','validationPF','validationMDD','validationPosMonthRate','validationTrades','reusedReturn','reusedPF','reusedMDD','reusedPosMonthRate','reusedTrades']
          print(json.dumps({
            'US_PULLBACK_AUDIT':audit,
            'TOP_TRAIN':df.sort_values(['trainReturn','trainPF'],ascending=False).head(12)[cols].to_dict('records'),
            'TOP_CAL':df.sort_values(['calibrationReturn','calibrationPF'],ascending=False).head(12)[cols].to_dict('records'),
            'TOP_VAL_DIAGNOSTIC_ONLY':df.sort_values(['validationReturn','validationPF'],ascending=False).head(12)[cols].to_dict('records'),
          },ensure_ascii=False))
          PY
