name: Staging Supabase Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_empty_isolated_project:
        description: Confirm this is a newly created, empty, non-production Supabase project
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-supabase-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap empty isolated staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Require explicit empty staging confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_empty_isolated_project }}
        run: |
          set -Eeuo pipefail
          [[ "$CONFIRMED" == "true" ]] || {
            echo 'An explicit empty isolated staging project confirmation is required.' >&2
            exit 1
          }
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated empty staging schema
        run: node api-server/scripts/bootstrap-staging-supabase.mjs
      - name: Verify schema through the Supabase server API
        run: node api-server/scripts/verify-staging-supabase-schema.mjs
      - name: Record non-production bootstrap result
        run: |
          {
            echo '## Staging Supabase bootstrap succeeded'
            echo
            echo '- Environment: `staging`'
            echo '- Production Supabase used: `false`'
            echo '- Production server changed: `false`'
            echo '- Staging application deployed: `false`'
            echo '- Temporary validation accounts created: `0`'
            echo '- Next state: `ready for a separately approved staging full-validation run`'
          } >> "$GITHUB_STEP_SUMMARY"
