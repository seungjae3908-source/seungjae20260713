name: PR181 Portfolio Diagnostic

on:
  push:
    branches:
      - feature/portfolio-ai-advisor-core
    paths:
      - .github/workflows/pr181-portfolio-diagnostic.yml
      - api-server/src/modules/portfolio/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-core:
    name: portfolio core isolated test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle isolated portfolio test
        working-directory: api-server
        run: >-
          pnpm exec esbuild src/modules/portfolio/portfolio-core.test.ts
          --bundle
          --platform=node
          --format=cjs
          --target=node20
          --sourcemap=inline
          --log-level=warning
          --outfile=/tmp/pr181-portfolio-core.test.cjs
      - name: Run isolated portfolio test
        run: node --test /tmp/pr181-portfolio-core.test.cjs
