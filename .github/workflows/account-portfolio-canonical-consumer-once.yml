name: Account Portfolio Canonical Consumer Once

on:
  push:
    branches:
      - fix/account-portfolio-canonical-consumer
    paths:
      - .github/workflows/account-portfolio-canonical-consumer-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/account-portfolio-canonical-consumer
          fetch-depth: 0
      - name: Apply bounded Portfolio consumer patch
        run: python3 scripts/account_portfolio_consumer_split_once.py
      - name: Commit bounded source change
        run: |
          set -Eeuo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stock-analyzer/src/pages/portfolio.tsx"
          git config user.name "ChatGPT Account Portfolio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-analyzer/src/pages/portfolio.tsx
          git commit -m "fix(account): bind portfolio to canonical read-only accounts"
          git push origin HEAD:fix/account-portfolio-canonical-consumer
