name: Account Portfolio Canonical Consumer Once

on:
  push:
    branches:
      - fix/account-portfolio-canonical-consumer
    paths:
      - .github/workflows/account-portfolio-canonical-consumer-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/account-portfolio-canonical-consumer
          fetch-depth: 0
      - name: Apply bounded Portfolio consumer patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('stock-analyzer/src/pages/portfolio.tsx')
          text = path.read_text(encoding='utf-8')
          before = text

          wouter = "import { useLocation } from 'wouter';\n"
          broker = "import { BrokerageAccountConnections } from '@/components/brokerage-account-connections';\n"
          query_import = "import { useQuery } from '@tanstack/react-query';\n"
          api_import = "import { apiGet } from '@/lib/api';\n"
          anyobj = "type AnyObj = Record<string, any>;\n"

          if text.count(wouter) != 1 or broker in text:
              raise SystemExit('unexpected BrokerageAccountConnections import state')
          if text.count(query_import) != 1 or text.count(api_import) != 1 or text.count(anyobj) != 1:
              raise SystemExit('legacy account import/type state mismatch')

          text = text.replace(wouter, wouter + broker, 1)
          text = text.replace(query_import, '', 1)
          text = text.replace(api_import, '', 1)
          text = text.replace(anyobj, '', 1)

          query_start = "\tconst coinSpotAccounts = useQuery({\n"
          query_end = "\n\tconst [\n\t\trows,\n"
          if text.count(query_start) != 1 or text.count(query_end) != 1:
              raise SystemExit('legacy Portfolio query block anchors mismatch')
          start = text.index(query_start)
          end = text.index(query_end, start)
          query_block = text[start:end]
          for legacy in ('/crypto/spot/accounts', '/crypto/futures/account', '/crypto/futures/positions'):
              if query_block.count(legacy) != 1:
                  raise SystemExit(f'legacy route missing from expected query block: {legacy}')
          text = text[:start] + text[end:]

          legacy_render = """\t\t\t) : assetMode.asset === 'coin' ? (
\t\t\t\t<CoinAssetsView
\t\t\t\t\tmode={assetMode.coinMarket}
\t\t\t\t\tspot={coinSpotAccounts}
\t\t\t\t\tfuturesAccount={coinFuturesAccount}
\t\t\t\t\tfuturesPositions={coinFuturesPositions}
\t\t\t\t/>
\t\t\t) : (
"""
          canonical_render = """\t\t\t) : assetMode.asset === 'coin' ? (
\t\t\t\t<main className=\"min-w-0 px-4 pb-28 pt-4\" data-testid=\"portfolio-coin-readonly\">
\t\t\t\t\t<p className=\"text-xs text-muted-foreground\">회원별 Vault의 조회 전용 계좌 연결을 사용합니다. 공용 키를 사용하는 이전 계좌 API는 호출하지 않습니다.</p>
\t\t\t\t\t<BrokerageAccountConnections
\t\t\t\t\t\tcanAccessSpot={assetMode.coinMarket === 'spot' && auth.can('canAccessSpot')}
\t\t\t\t\t\tcanAccessFutures={assetMode.coinMarket === 'futures' && auth.can('canAccessFutures')}
\t\t\t\t\t/>
\t\t\t\t</main>
\t\t\t) : (
"""
          if text.count(legacy_render) != 1:
              raise SystemExit('legacy CoinAssetsView render block mismatch')
          text = text.replace(legacy_render, canonical_render, 1)

          helper_start = "\nfunction CoinAssetsView({\n"
          helper_end = "\nfunction LoadingCard({\n"
          if text.count(helper_start) != 1 or text.count(helper_end) != 1:
              raise SystemExit('legacy helper anchors mismatch')
          start = text.index(helper_start)
          end = text.index(helper_end, start)
          text = text[:start] + text[end:]

          if text == before:
              raise SystemExit('no source change produced')
          if text.count('BrokerageAccountConnections') != 2:
              raise SystemExit('canonical Portfolio consumer count mismatch')
          if 'CoinAssetsView' in text or 'formatCoinNumber' in text:
              raise SystemExit('legacy Portfolio renderer remains')
          for legacy in ('/crypto/spot/accounts', '/crypto/futures/account', '/crypto/futures/positions'):
              if legacy in text:
                  raise SystemExit(f'legacy Portfolio route remains: {legacy}')
          for forbidden_transplant in ('portfolioQuote', 'portfolioTotals', 'loadVersion', 'valuationTime'):
              if forbidden_transplant in text:
                  raise SystemExit(f'#841 non-account scope leaked into successor: {forbidden_transplant}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = "stock-analyzer/src/pages/portfolio.tsx"
          git config user.name 'ChatGPT Account Portfolio'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-analyzer/src/pages/portfolio.tsx
          git commit -m 'fix(account): bind portfolio to canonical read-only accounts'
          git push origin HEAD:fix/account-portfolio-canonical-consumer
