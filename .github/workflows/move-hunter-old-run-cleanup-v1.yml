name: Move Hunter Old Run Cleanup V1

on:
  pull_request:
    paths:
      - '.github/workflows/move-hunter-old-run-cleanup-v1.yml'

permissions:
  contents: read

concurrency:
  group: move-hunter-old-run-cleanup-v1
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.number == 1446 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/move-hunter-server-backtest-v1-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_USER"
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Stop only obsolete full benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$STAGING_SSH_PORT"             -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes             "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pattern='research-lab/move-hunter-v1/scripts/run-one-year-public-benchmark.mjs /var/lib/backtest-worker/results/move-hunter-1y.json /var/lib/backtest-worker/results/move-hunter-1y.md'
          mapfile -t pids < <(pgrep -f "$pattern" || true)
          echo "OBSOLETE_MATCH_COUNT=${#pids[@]}"
          for pid in "${pids[@]}"; do
            cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
            case "$cmd" in
              *"run-one-year-public-benchmark.mjs /var/lib/backtest-worker/results/move-hunter-1y.json /var/lib/backtest-worker/results/move-hunter-1y.md"*)
                echo "TERM_PID=$pid"
                kill -TERM "$pid" 2>/dev/null || true
                ;;
            esac
          done
          sleep 2
          for pid in "${pids[@]}"; do
            if kill -0 "$pid" 2>/dev/null; then
              cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              case "$cmd" in
                *"run-one-year-public-benchmark.mjs /var/lib/backtest-worker/results/move-hunter-1y.json /var/lib/backtest-worker/results/move-hunter-1y.md"*)
                  echo "KILL_PID=$pid"
                  kill -KILL "$pid" 2>/dev/null || true
                  ;;
              esac
            fi
          done
          echo '=== REMAINING MOVE HUNTER COMPUTE ==='
          ps -eo pid,etime,%cpu,%mem,args | grep -E 'run-daily-target-fast-v1|run-one-year-public-benchmark' | grep -v grep || true
          echo 'PRODUCTION_APP_MUTATION=false'
          echo 'PM2_MUTATION=false'
          echo 'DATABASE_MUTATION=false'
          echo 'REAL_ORDERS=0'
          REMOTE
