name: Temporary Liquidity Receipt Chain Closure Patch

on:
  push:
    branches:
      - feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
    paths:
      - '.github/workflows/tmp-liquidity-receipt-chain-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-liquidity-canonical-persistence-dedup-independence-20260829

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply complete receipt-chain contract patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing')
              return text.replace(old, new, 1)

          # 1) Independence authority: require and bind the complete #811 receipt chain.
          path = Path('market-intelligence-sidecar/src/public-forward-liquidity-independence-audit.mjs')
          text = path.read_text()
          text = replace_once(
              text,
              "} from './public-forward-liquidity-capture-ingest.mjs';\n",
              "} from './public-forward-liquidity-capture-ingest.mjs';\nimport {\n  verifyPublicForwardLiquidityIngestReceiptChain,\n} from './public-forward-liquidity-ingest-receipt-chain.mjs';\n",
              'independence import',
          )
          text = replace_once(
              text,
              '  upstreamIngestReceiptRequired: true,\n',
              '  upstreamIngestReceiptRequired: true,\n  completeIngestReceiptChainRequired: true,\n',
              'independence safety',
          )
          text = replace_once(
              text,
              "  const receipt = object(source.ingestReceipt, 'UPSTREAM_INGEST_RECEIPT_INVALID');\n",
              "  const ingestReceipts = Array.isArray(source.ingestReceipts)\n    ? source.ingestReceipts\n    : [object(source.ingestReceipt, 'UPSTREAM_INGEST_RECEIPT_INVALID')];\n  const datasetRelativePath = safeRelativePath(source.datasetRelativePath);\n  const receiptChain = verifyPublicForwardLiquidityIngestReceiptChain({\n    dataset,\n    ingestReceipts,\n    datasetRelativePath,\n    collectorImplementationPath: COLLECTOR_IMPLEMENTATION_PATH,\n  });\n  const receipt = object(ingestReceipts.at(-1), 'UPSTREAM_INGEST_RECEIPT_INVALID');\n",
              'independence chain bootstrap',
          )
          text = replace_once(
              text,
              "  const datasetRelativePath = safeRelativePath(source.datasetRelativePath);\n  if (safeRelativePath(receipt.datasetRelativePath) !== datasetRelativePath) {\n",
              "  if (safeRelativePath(receipt.datasetRelativePath) !== datasetRelativePath) {\n",
              'independence dataset path declaration',
          )
          blob_block = """  const collectorImplementationBlobSha = exactSha(
              receipt.collectorImplementationBlobSha,
              'UPSTREAM_COLLECTOR_IMPLEMENTATION_BLOB_INVALID',
            );
          """
          text = replace_once(
              text,
              blob_block,
              blob_block + """  if (collectorImplementationBlobSha !== receiptChain.collectorImplementationBlobSha) {
              throw new Error('UPSTREAM_COLLECTOR_IMPLEMENTATION_CHAIN_MISMATCH');
            }
          """,
              'independence implementation chain',
          )
          text = replace_once(
              text,
              "    collectorImplementationBlobSha,\n    datasetDigest,\n",
              "    collectorImplementationBlobSha,\n    ingestReceiptChainVersion: receiptChain.schemaVersion,\n    ingestReceiptChainDigest: receiptChain.receiptChainDigest,\n    ingestReceiptCount: receiptChain.receiptCount,\n    ingestReceiptDigests: receiptChain.receiptDigests,\n    artifactIds: receiptChain.artifactIds,\n    artifactDigests: receiptChain.artifactDigests,\n    rawBatchDigests: receiptChain.rawBatchDigests,\n    datasetDigest,\n",
              'independence source identity chain',
          )
          text = replace_once(
              text,
              "  for (const key of ['sourceIdentity', 'receiptDigest', 'datasetDigest', 'artifactId']) {\n",
              "  for (const key of ['sourceIdentity', 'ingestReceiptChainDigest', 'receiptDigest', 'datasetDigest', 'artifactId']) {\n",
              'independence duplicate chain key',
          )
          text = replace_once(
              text,
              "    collectorImplementationBlobSha: source.collectorImplementationBlobSha,\n    datasetDigest: source.datasetDigest,\n",
              "    collectorImplementationBlobSha: source.collectorImplementationBlobSha,\n    ingestReceiptChainVersion: source.ingestReceiptChainVersion,\n    ingestReceiptChainDigest: source.ingestReceiptChainDigest,\n    ingestReceiptCount: source.ingestReceiptCount,\n    ingestReceiptDigests: source.ingestReceiptDigests,\n    artifactIds: source.artifactIds,\n    artifactDigests: source.artifactDigests,\n    rawBatchDigests: source.rawBatchDigests,\n    datasetDigest: source.datasetDigest,\n",
              'independence source summary chain',
          )
          path.write_text(text)

          # 2) Manifest/CLI: load an ordered receipt path chain for every cumulative dataset.
          path = Path('market-intelligence-sidecar/scripts/run-public-forward-liquidity-independence-audit.mjs')
          text = path.read_text()
          text = replace_once(
              text,
              'It verifies #811 ingest-receipt bindings for one or more existing #776 canonical\n',
              'It verifies the complete ordered #811 ingest-receipt chain for one or more existing #776 canonical\n',
              'runner help chain',
          )
          old_manifest = """  for (const source of manifest.sources) {
            if (!source || typeof source !== 'object' || Array.isArray(source)
              || typeof source.datasetPath !== 'string'
              || typeof source.ingestReceiptPath !== 'string'
              || !isAbsolute(source.datasetPath)
              || !isAbsolute(source.ingestReceiptPath)) {
              throw new Error('SOURCE_MANIFEST_ENTRY_INVALID');
            }
          }
          """
          new_manifest = """  for (const source of manifest.sources) {
            const receiptPaths = Array.isArray(source?.ingestReceiptPaths)
              ? source.ingestReceiptPaths
              : (typeof source?.ingestReceiptPath === 'string' ? [source.ingestReceiptPath] : []);
            if (!source || typeof source !== 'object' || Array.isArray(source)
              || typeof source.datasetPath !== 'string'
              || !isAbsolute(source.datasetPath)
              || receiptPaths.length === 0
              || receiptPaths.some((receiptPath) => typeof receiptPath !== 'string' || !isAbsolute(receiptPath))) {
              throw new Error('SOURCE_MANIFEST_ENTRY_INVALID');
            }
          }
          """
          text = replace_once(text, old_manifest, new_manifest, 'runner manifest')
          old_load = """  const sources = await Promise.all(manifest.sources.map(async (source) => {
            const [dataset, ingestReceipt] = await Promise.all([
              json(source.datasetPath),
              json(source.ingestReceiptPath),
            ]);
            const datasetRelativePath = relative(stateRoot, resolve(source.datasetPath));
            if (!datasetRelativePath
              || isAbsolute(datasetRelativePath)
              || datasetRelativePath.split(/[\\\\/]+/u).some((segment) => segment === '..')) {
              throw new Error('SOURCE_DATASET_OUTSIDE_STATE_ROOT');
            }
            return {
              dataset,
              ingestReceipt,
              datasetRelativePath: datasetRelativePath.replace(/\\\\/gu, '/'),
            };
          }));
          """
          new_load = """  const sources = await Promise.all(manifest.sources.map(async (source) => {
            const receiptPaths = Array.isArray(source.ingestReceiptPaths)
              ? source.ingestReceiptPaths
              : [source.ingestReceiptPath];
            const [dataset, ingestReceipts] = await Promise.all([
              json(source.datasetPath),
              Promise.all(receiptPaths.map((receiptPath) => json(receiptPath))),
            ]);
            const datasetRelativePath = relative(stateRoot, resolve(source.datasetPath));
            if (!datasetRelativePath
              || isAbsolute(datasetRelativePath)
              || datasetRelativePath.split(/[\\\\/]+/u).some((segment) => segment === '..')) {
              throw new Error('SOURCE_DATASET_OUTSIDE_STATE_ROOT');
            }
            return {
              dataset,
              ingestReceipt: ingestReceipts.at(-1),
              ingestReceipts,
              datasetRelativePath: datasetRelativePath.replace(/\\\\/gu, '/'),
            };
          }));
          """
          text = replace_once(text, old_load, new_load, 'runner chain load')
          path.write_text(text)

          # 3) Multi-source frozen split: carry receipt-chain lineage into every audit and assignment.
          path = Path('market-intelligence-sidecar/src/public-forward-liquidity-multi-source-split-audit.mjs')
          text = path.read_text()
          text = replace_once(
              text,
              "} from './public-forward-liquidity-independence-audit.mjs';\n",
              "} from './public-forward-liquidity-independence-audit.mjs';\nimport {\n  PUBLIC_FORWARD_LIQUIDITY_INGEST_RECEIPT_CHAIN_VERSION,\n} from './public-forward-liquidity-ingest-receipt-chain.mjs';\n",
              'multi-source chain import',
          )
          validation_anchor = """  if (!exactCommitSha(source.collectorImplementationBlobSha)) add(blockers, 'UPSTREAM_COLLECTOR_BLOB_INVALID');
            if (!exactDigest(source.datasetDigest)) add(blockers, 'UPSTREAM_DATASET_DIGEST_INVALID');
          """
          validation_replacement = """  if (!exactCommitSha(source.collectorImplementationBlobSha)) add(blockers, 'UPSTREAM_COLLECTOR_BLOB_INVALID');
            if (source.ingestReceiptChainVersion !== PUBLIC_FORWARD_LIQUIDITY_INGEST_RECEIPT_CHAIN_VERSION) {
              add(blockers, 'UPSTREAM_RECEIPT_CHAIN_VERSION_INVALID');
            }
            if (!exactDigest(source.ingestReceiptChainDigest)) add(blockers, 'UPSTREAM_RECEIPT_CHAIN_DIGEST_INVALID');
            if (!positiveInteger(source.ingestReceiptCount)) add(blockers, 'UPSTREAM_RECEIPT_CHAIN_COUNT_INVALID');
            for (const [values, code] of [
              [source.ingestReceiptDigests, 'UPSTREAM_RECEIPT_CHAIN_DIGESTS_INVALID'],
              [source.artifactDigests, 'UPSTREAM_ARTIFACT_CHAIN_DIGESTS_INVALID'],
              [source.rawBatchDigests, 'UPSTREAM_RAW_BATCH_CHAIN_DIGESTS_INVALID'],
            ]) {
              if (!Array.isArray(values) || values.length !== source.ingestReceiptCount
                || values.some((value) => !exactDigest(value))) add(blockers, code);
            }
            if (!Array.isArray(source.artifactIds) || source.artifactIds.length !== source.ingestReceiptCount
              || source.artifactIds.some((value) => !text(value))) add(blockers, 'UPSTREAM_ARTIFACT_CHAIN_IDS_INVALID');
            if (Array.isArray(source.ingestReceiptDigests)
              && source.receiptDigest !== source.ingestReceiptDigests.at(-1)) add(blockers, 'UPSTREAM_FINAL_RECEIPT_DIGEST_MISMATCH');
            if (Array.isArray(source.artifactIds)
              && source.artifactId !== source.artifactIds.at(-1)) add(blockers, 'UPSTREAM_FINAL_ARTIFACT_ID_MISMATCH');
            if (Array.isArray(source.artifactDigests)
              && source.artifactDigest !== source.artifactDigests.at(-1)) add(blockers, 'UPSTREAM_FINAL_ARTIFACT_DIGEST_MISMATCH');
            if (Array.isArray(source.rawBatchDigests)
              && source.rawBatchDigest !== source.rawBatchDigests.at(-1)) add(blockers, 'UPSTREAM_FINAL_RAW_BATCH_DIGEST_MISMATCH');
            if (!exactDigest(source.datasetDigest)) add(blockers, 'UPSTREAM_DATASET_DIGEST_INVALID');
          """
          text = replace_once(text, validation_anchor, validation_replacement, 'multi-source validation chain')
          text = replace_once(
              text,
              "    const keys = ['sourceIdentity', 'datasetDigest', 'receiptDigest', 'artifactId'];\n",
              "    const keys = ['sourceIdentity', 'ingestReceiptChainDigest', 'datasetDigest', 'receiptDigest', 'artifactId'];\n",
              'multi-source duplicate chain key',
          )
          text = replace_once(
              text,
              "      sourceReceiptDigest: upstream?.receiptDigest ?? null,\n      sourceCollectorCodeSha: upstream?.collectorCodeSha ?? null,\n",
              "      sourceReceiptDigest: upstream?.receiptDigest ?? null,\n      sourceReceiptChainDigest: upstream?.ingestReceiptChainDigest ?? null,\n      sourceReceiptCount: upstream?.ingestReceiptCount ?? null,\n      sourceCollectorCodeSha: upstream?.collectorCodeSha ?? null,\n",
              'multi-source assignment chain',
          )
          path.write_text(text)

          # 4) Existing independence tests: single-batch source gets a one-element chain; cumulative test gets every receipt.
          path = Path('market-intelligence-sidecar/tests/public-forward-liquidity-independence-audit.test.mjs')
          text = path.read_text()
          text = replace_once(
              text,
              '  return { dataset, ingestReceipt, datasetRelativePath };\n',
              '  return { dataset, ingestReceipt, ingestReceipts: [ingestReceipt], datasetRelativePath };\n',
              'test single receipt chain',
          )
          history_anchor = """function mergeBatches(batches) {
            let dataset = null;
            for (const current of batches) dataset = mergeLiquidityCalibrationBatch(dataset, current).dataset;
            assert.deepEqual(verifyLiquidityCalibrationDataset(dataset), { valid: true, reason: null });
            return dataset;
          }
          """
          history_replacement = history_anchor + """
          function mergeBatchHistory(batches) {
            let dataset = null;
            const history = [];
            for (const current of batches) {
              dataset = mergeLiquidityCalibrationBatch(dataset, current).dataset;
              history.push(dataset);
            }
            return history;
          }

          function boundSourceChain(history, { artifactIdStart = 6000, collectorImplementationBlobSha = 'f'.repeat(40) } = {}) {
            const receipts = [];
            let previousIds = new Set();
            for (let index = 0; index < history.length; index += 1) {
              const dataset = history[index];
              const currentIds = dataset.observations.map((observation) => observation.observationId);
              const batchObservationIds = currentIds.filter((observationId) => !previousIds.has(observationId));
              const source = boundSource(dataset, {
                artifactId: String(artifactIdStart + index),
                batchObservationIds,
                collectorImplementationBlobSha,
              });
              receipts.push(source.ingestReceipt);
              previousIds = new Set(currentIds);
            }
            const finalDataset = history.at(-1);
            const datasetRelativePath = `forward/liquidity-calibration-v1/forward_natural_sample/${finalDataset.collectorCodeSha}/dataset.json`;
            return {
              dataset: finalDataset,
              ingestReceipt: receipts.at(-1),
              ingestReceipts: receipts,
              datasetRelativePath,
            };
          }
          """
          text = replace_once(text, history_anchor, history_replacement, 'test history helper')
          genuine_anchor = """function genuineDataset() {
            return mergeBatches([
              batch({
                base: 10_000,
                seed: 1,
                events: [
                  { execId: 'exec-train-1', eventTimestampMs: 10_000, quantity: 1 },
                  { execId: 'exec-train-2', eventTimestampMs: 10_050, quantity: 2 },
                ],
              }),
              batch({
                base: 20_000,
                seed: 2,
                events: [{ execId: 'exec-validation', eventTimestampMs: 20_000, quantity: 1 }],
              }),
              batch({
                base: 30_000,
                seed: 3,
                events: [{ execId: 'exec-oos', eventTimestampMs: 30_000, quantity: 1 }],
              }),
            ]);
          }
          """
          genuine_replacement = """function genuineBatches() {
            return [
              batch({
                base: 10_000,
                seed: 1,
                events: [
                  { execId: 'exec-train-1', eventTimestampMs: 10_000, quantity: 1 },
                  { execId: 'exec-train-2', eventTimestampMs: 10_050, quantity: 2 },
                ],
              }),
              batch({
                base: 20_000,
                seed: 2,
                events: [{ execId: 'exec-validation', eventTimestampMs: 20_000, quantity: 1 }],
              }),
              batch({
                base: 30_000,
                seed: 3,
                events: [{ execId: 'exec-oos', eventTimestampMs: 30_000, quantity: 1 }],
              }),
            ];
          }

          function genuineDataset() {
            return mergeBatches(genuineBatches());
          }

          function genuineDatasetHistory() {
            return mergeBatchHistory(genuineBatches());
          }
          """
          text = replace_once(text, genuine_anchor, genuine_replacement, 'test genuine history')
          old_cumulative = """  const cumulativeDataset = genuineDataset();
            const latestObservationId = cumulativeDataset.observations
              .find((observation) => observation.eventTimestampMs === 30_000).observationId;
            const cumulative = boundSource(cumulativeDataset, {
              artifactId: '4002',
              batchObservationIds: [latestObservationId],
            });
            const cumulativeResult = classifyPublicForwardLiquidityBoundSources({
              sources: [cumulative],
              producerCodeSha: 'd'.repeat(40),
            });
            assert.equal(cumulativeResult.status, 'PRESENT');

            const brokenIndex = boundSource(cumulativeDataset, {
              artifactId: '4004',
              batchObservationIds: [latestObservationId],
              receiptOverrides: { batchProvenanceIndex: 0 },
            });
            const brokenIndexResult = classifyPublicForwardLiquidityBoundSources({
              sources: [brokenIndex],
              producerCodeSha: 'd'.repeat(40),
            });
            assert.equal(brokenIndexResult.status, 'BLOCKED_DATA');
            assert.ok(brokenIndexResult.blockers.includes('UPSTREAM_BATCH_PROVENANCE_INDEX_MISMATCH'));
          """
          new_cumulative = """  const cumulative = boundSourceChain(genuineDatasetHistory(), { artifactIdStart: 4002 });
            const cumulativeResult = classifyPublicForwardLiquidityBoundSources({
              sources: [cumulative],
              producerCodeSha: 'd'.repeat(40),
            });
            assert.equal(cumulativeResult.status, 'PRESENT');
            assert.equal(cumulativeResult.audit.upstreamSources[0].ingestReceiptCount, 3);

            const missingPredecessor = {
              ...cumulative,
              ingestReceipts: cumulative.ingestReceipts.slice(1),
              ingestReceipt: cumulative.ingestReceipts.at(-1),
            };
            const missingResult = classifyPublicForwardLiquidityBoundSources({
              sources: [missingPredecessor],
              producerCodeSha: 'd'.repeat(40),
            });
            assert.equal(missingResult.status, 'BLOCKED_DATA');
            assert.ok(missingResult.blockers.includes('UPSTREAM_INGEST_RECEIPT_CHAIN_LENGTH_MISMATCH'));

            const swapped = {
              ...cumulative,
              ingestReceipts: [cumulative.ingestReceipts[1], cumulative.ingestReceipts[0], cumulative.ingestReceipts[2]],
              ingestReceipt: cumulative.ingestReceipts[2],
            };
            const swappedResult = classifyPublicForwardLiquidityBoundSources({
              sources: [swapped],
              producerCodeSha: 'd'.repeat(40),
            });
            assert.equal(swappedResult.status, 'BLOCKED_DATA');
            assert.ok(swappedResult.blockers.includes('UPSTREAM_RECEIPT_BATCH_INDEX_MISMATCH'));
          """
          text = replace_once(text, old_cumulative, new_cumulative, 'test cumulative chain')
          path.write_text(text)

          # 5) Hand-built multi-source split fixtures now carry the authenticated receipt-chain summary.
          path = Path('market-intelligence-sidecar/tests/public-forward-liquidity-multi-source-split-audit.test.mjs')
          text = path.read_text()
          text = replace_once(
              text,
              "    collectorImplementationBlobSha: collectorCodeSha,\n    datasetDigest: digest(`dataset:${identity}`),\n",
              "    collectorImplementationBlobSha: collectorCodeSha,\n    ingestReceiptChainVersion: 'public-forward-liquidity-ingest-receipt-chain-v1',\n    ingestReceiptChainDigest: digest(`receipt-chain:${identity}`),\n    ingestReceiptCount: 1,\n    ingestReceiptDigests: Object.freeze([digest(`receipt:${identity}`)]),\n    artifactIds: Object.freeze([identity === 'source-a' ? '1001' : '1002']),\n    artifactDigests: Object.freeze([digest(`artifact:${identity}`)]),\n    rawBatchDigests: Object.freeze([digest(`raw:${identity}`)]),\n    datasetDigest: digest(`dataset:${identity}`),\n",
              'multi-source test chain fields',
          )
          text = replace_once(
              text,
              "  assert.equal(result.audit.assignments[0].sourceDatasetDigest, source.upstreamSources[0].datasetDigest);\n",
              "  assert.equal(result.audit.assignments[0].sourceDatasetDigest, source.upstreamSources[0].datasetDigest);\n  assert.equal(result.audit.assignments[0].sourceReceiptChainDigest, source.upstreamSources[0].ingestReceiptChainDigest);\n  assert.equal(result.audit.assignments[0].sourceReceiptCount, 1);\n",
              'multi-source assignment chain assertion',
          )
          path.write_text(text)

          # 6) V2 CLI integration uses the complete ordered receipt chain instead of one synthesized latest receipt.
          path = Path('market-intelligence-sidecar/tests/public-forward-liquidity-independence-runner-v2.test.mjs')
          text = path.read_text()
          old_dataset = """function cumulativeDataset() {
            let dataset = null;
            for (const [base, seed] of [[10_000, 1], [20_000, 2], [30_000, 3]]) {
              dataset = mergeLiquidityCalibrationBatch(dataset, batch(base, seed)).dataset;
            }
            return dataset;
          }

          function ingestReceipt(dataset, datasetRelativePath) {
            const batchProvenanceIndex = dataset.batchProvenance.length - 1;
            const latestObservation = dataset.observations.find((observation) => observation.eventTimestampMs === 30_000);
            const batchObservationIds = [latestObservation.observationId];
            const body = {
          """
          new_dataset = """function cumulativeHistory() {
            let dataset = null;
            const history = [];
            for (const [base, seed] of [[10_000, 1], [20_000, 2], [30_000, 3]]) {
              dataset = mergeLiquidityCalibrationBatch(dataset, batch(base, seed)).dataset;
              history.push(dataset);
            }
            return history;
          }

          function ingestReceipt(dataset, datasetRelativePath, batchObservationIds, artifactOffset) {
            const batchProvenanceIndex = dataset.batchProvenance.length - 1;
            const batchObservations = dataset.observations
              .filter((observation) => batchObservationIds.includes(observation.observationId))
              .sort((left, right) => left.observationId.localeCompare(right.observationId));
            const body = {
          """
          text = replace_once(text, old_dataset, new_dataset, 'runner test history')
          text = replace_once(
              text,
              "    captureRunId: '7001',\n",
              "    captureRunId: String(7001 + artifactOffset),\n",
              'runner test capture run',
          )
          text = replace_once(
              text,
              "    rawBatchDigest: dataset.batchProvenance[batchProvenanceIndex].rawDigest,\n    batchObservationIds,\n    batchObservationCount: 1,\n    batchObservationDigest: sha256(canonicalJson([latestObservation])),\n",
              "    rawBatchDigest: dataset.batchProvenance[batchProvenanceIndex].rawDigest,\n    batchObservationIds: [...batchObservationIds].sort(),\n    batchObservationCount: batchObservationIds.length,\n    batchObservationDigest: sha256(canonicalJson(batchObservations)),\n",
              'runner test batch observations',
          )
          text = replace_once(
              text,
              "    artifactId: '8001',\n    artifactDigest: sha256('capture-artifact'),\n",
              "    artifactId: String(8001 + artifactOffset),\n    artifactDigest: sha256(`capture-artifact-${artifactOffset}`),\n",
              'runner test artifact identity',
          )
          text = replace_once(
              text,
              "    insertedObservationCount: 1,\n    duplicateObservationCount: 0,\n    rawIngestObservationDelta: 1,\n",
              "    insertedObservationCount: batchObservationIds.length,\n    duplicateObservationCount: 0,\n    rawIngestObservationDelta: batchObservationIds.length,\n",
              'runner test insert counts',
          )
          old_happy = """    const dataset = cumulativeDataset();
            const datasetPath = join(dataDir, 'dataset.json');
            const receiptPath = join(dataDir, 'ingest-receipt.json');
            const datasetRelativePath = 'forward/liquidity/dataset.json';
            const receipt = ingestReceipt(dataset, datasetRelativePath);
            await writeFile(datasetPath, `${canonicalJson(dataset)}\\n`);
            await writeFile(receiptPath, `${canonicalJson(receipt)}\\n`);

            const source = { dataset, ingestReceipt: receipt, datasetRelativePath };
          """
          new_happy = """    const history = cumulativeHistory();
            const dataset = history.at(-1);
            const datasetPath = join(dataDir, 'dataset.json');
            const datasetRelativePath = 'forward/liquidity/dataset.json';
            const receiptPaths = [];
            const receipts = [];
            let previousIds = new Set();
            for (let index = 0; index < history.length; index += 1) {
              const current = history[index];
              const currentIds = current.observations.map((observation) => observation.observationId);
              const batchObservationIds = currentIds.filter((observationId) => !previousIds.has(observationId));
              const receipt = ingestReceipt(current, datasetRelativePath, batchObservationIds, index);
              const receiptPath = join(dataDir, `ingest-receipt-${index}.json`);
              await writeFile(receiptPath, `${canonicalJson(receipt)}\\n`);
              receiptPaths.push(receiptPath);
              receipts.push(receipt);
              previousIds = new Set(currentIds);
            }
            await writeFile(datasetPath, `${canonicalJson(dataset)}\\n`);

            const source = { dataset, ingestReceipt: receipts.at(-1), ingestReceipts: receipts, datasetRelativePath };
          """
          text = replace_once(text, old_happy, new_happy, 'runner test happy chain')
          text = replace_once(
              text,
              "      sources: [{ datasetPath, ingestReceiptPath: receiptPath }],\n",
              "      sources: [{ datasetPath, ingestReceiptPaths: receiptPaths }],\n",
              'runner test manifest chain',
          )
          path.write_text(text)
          PY

      - name: Validate patched contract before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check market-intelligence-sidecar/src/public-forward-liquidity-ingest-receipt-chain.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-independence-audit.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-multi-source-split-audit.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-independence-audit.mjs
          node --check market-intelligence-sidecar/tests/public-forward-liquidity-independence-audit.test.mjs
