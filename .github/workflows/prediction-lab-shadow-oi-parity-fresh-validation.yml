name: Prediction Lab Shadow OI Parity Fresh Public Validation

on:
  pull_request:
    branches:
      - research/shadow-oi-feature-parity-v1
    paths:
      - .github/workflows/prediction-lab-shadow-oi-parity-fresh-validation.yml
      - market-prediction-lab/scripts/run-fresh-recent-deployment-parity.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prediction-lab-shadow-oi-parity-fresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-public-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record immutable validation SHA
        id: sha
        shell: bash
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate OI parity regression contract
        working-directory: market-prediction-lab
        run: node --test tests/derivatives-history.test.js tests/derivatives-normalized-compat.test.js tests/temporal-training-dataset.test.js tests/shadow-ledger.test.js

      - name: Run isolated fresh-public Shadow inference
        working-directory: market-prediction-lab
        shell: bash
        run: |
          rm -rf /tmp/shadow-oi-parity-fresh
          mkdir -p /tmp/shadow-oi-parity-fresh
          cat > /tmp/shadow-oi-parity-fresh/state.json <<'JSON'
          {"schemaVersion":3,"groups":{},"forwardStrategies":{}}
          JSON
          node scripts/run-shadow-cycle.js \
            /tmp/shadow-oi-parity-fresh/state.json \
            /tmp/shadow-oi-parity-fresh/summary.json

      - name: Build fresh inference and deployment-parity evidence
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { predictTinyModel } from './market-prediction-lab/src/tiny-model.js';

          const state = JSON.parse(await readFile('/tmp/shadow-oi-parity-fresh/state.json', 'utf8'));
          const cycleSummary = JSON.parse(await readFile('/tmp/shadow-oi-parity-fresh/summary.json', 'utf8'));
          const groups = ['crypto-futures-15m', 'crypto-futures-1h'];
          const classes = ['bullish', 'neutral', 'bearish'];
          const predictedClass = (p) => classes.reduce((best, name) => p[name] > p[best] ? name : best, classes[0]);

          async function loadCandidateModel(group, source) {
            const paths = {
              'v1-vs-rule-baseline': `market-prediction-lab/docs/candidate-models/${group}.json`,
              'funding-v2-vs-v1': `market-prediction-lab/docs/candidate-models-v2/${group}-funding-v2.json`,
              'market-structure-v3-vs-v1': `market-prediction-lab/docs/candidate-models-v3/${group}-market-structure-v3.json`,
              'ensemble-v4-vs-v1': `market-prediction-lab/docs/candidate-models-v4/${group}-ensemble-v4.json`,
            };
            const path = paths[source];
            if (!path) throw new Error(`${group} unsupported model selection source: ${source}`);
            const artifact = JSON.parse(await readFile(path, 'utf8'));
            if (!artifact?.model?.trained) throw new Error(`${group} selected model artifact missing or untrained`);
            return artifact.model;
          }

          if (cycleSummary.status !== 'pass') throw new Error('fresh public Shadow cycle failed');
          const evidence = {
            schemaVersion: 2,
            validationType: 'fresh_public_inference_and_deployment_parity',
            researchCodeSha: process.env.RESEARCH_SHA,
            generatedAt: Date.now(),
            provider: 'bitget-public-v2',
            labelsSettled: false,
            profitabilityEvidence: false,
            neutralCollapseFixed: false,
            groups: {},
            safety: {
              publicMarketDataOnly: true,
              privateAccountRequests: 0,
              privateTradingRequests: 0,
              actualOrders: 0,
              actualCancels: 0,
              actualAmends: 0,
              thresholdModified: false,
              classWeightModified: false,
              labelModified: false,
              calibrationModified: false,
              blendWeightModified: false,
              modelRetrained: false,
              finalHoldoutUsedForSelection: false,
            },
          };

          for (const group of groups) {
            const groupState = state.groups?.[group];
            const records = groupState?.records ?? [];
            if (records.length !== 2) throw new Error(`${group} expected exactly 2 fresh records, got ${records.length}`);
            const symbols = [...new Set(records.map((record) => record.symbol))].sort();
            if (JSON.stringify(symbols) !== JSON.stringify(['BTCUSDT', 'ETHUSDT'])) throw new Error(`${group} symbol isolation failed`);
            if (records.some((record) => record.status !== 'pending')) throw new Error(`${group} must not fabricate settled labels`);
            if (records.some((record) => record.featureAvailability?.openInterestKnown !== false)) throw new Error(`${group} live OI reached inference availability`);
            if (records.some((record) => record.features?.openInterestChange !== 0)) throw new Error(`${group} OI missing value is not training-compatible zero`);
            const oiSnapshots = groupState?.openInterestSnapshots ?? [];
            if (oiSnapshots.length < 2) throw new Error(`${group} expected public OI context before suppression`);

            const source = cycleSummary.groups?.[group]?.modelSelection?.source;
            const model = await loadCandidateModel(group, source);
            if (records.some((record) => record.modelId !== model.id)) throw new Error(`${group} model identity mismatch`);
            const rows = records.map((record) => {
              const modelOnly = predictTinyModel(record.features, model);
              const modelOnlyClass = predictedClass(modelOnly.probabilities);
              return {
                symbol: record.symbol,
                timeframe: record.timeframe,
                anchorTimestamp: record.anchorTimestamp,
                blendedClass: record.candidateClass,
                blendedProbabilities: record.candidateProbabilities,
                modelOnlyClass,
                modelOnlyProbabilities: modelOnly.probabilities,
                classChangedByBlend: modelOnlyClass !== record.candidateClass,
                directionSuppressedByBlend: modelOnlyClass !== 'neutral' && record.candidateClass === 'neutral',
                openInterestKnown: record.featureAvailability?.openInterestKnown ?? null,
                openInterestFeatureValue: record.features?.openInterestChange ?? null,
                modelId: record.modelId,
              };
            });
            evidence.groups[group] = {
              modelSelectionSource: source,
              freshPredictionCount: rows.length,
              blendedPredictionCounts: Object.fromEntries(classes.map((name) => [name, rows.filter((row) => row.blendedClass === name).length])),
              modelOnlyPredictionCounts: Object.fromEntries(classes.map((name) => [name, rows.filter((row) => row.modelOnlyClass === name).length])),
              classChangedByBlendCount: rows.filter((row) => row.classChangedByBlend).length,
              directionSuppressedByBlendCount: rows.filter((row) => row.directionSuppressedByBlend).length,
              publicOpenInterestSnapshotCount: oiSnapshots.length,
              openInterestSuppressedAtInferenceCount: rows.filter((row) => row.openInterestKnown === false).length,
              openInterestEffectiveZeroCount: rows.filter((row) => row.openInterestFeatureValue === 0).length,
              rows,
            };
          }

          await writeFile('/tmp/shadow-oi-parity-fresh/evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Run fresh recent settled deployment-parity replay
        working-directory: market-prediction-lab
        run: node scripts/run-fresh-recent-deployment-parity.js /tmp/shadow-oi-parity-fresh/recent-deployment-parity.json

      - name: Assert repository tree was not mutated by validation
        shell: bash
        run: git diff --exit-code

      - name: Upload immutable fresh-public parity artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-shadow-oi-parity-fresh-${{ github.run_id }}
          path: |
            /tmp/shadow-oi-parity-fresh/evidence.json
            /tmp/shadow-oi-parity-fresh/recent-deployment-parity.json
          if-no-files-found: error
          retention-days: 90

      - name: Assert exact validation HEAD
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: test "$(git rev-parse HEAD)" = "$RESEARCH_SHA"
