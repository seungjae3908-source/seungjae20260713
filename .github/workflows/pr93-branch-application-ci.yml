name: PR 93 Branch Application CI Bridge

on:
  push:
    branches:
      - agent/instrument-orderbook-ui
    paths:
      - .github/workflows/pr93-branch-application-ci.yml
      - .github/workflows/futures-public-network-smoke.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - api-server/**
      - stock-analyzer/**
      - packages/**

permissions:
  actions: write
  contents: read

concurrency:
  group: pr93-branch-application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Validate diff and dispatch exact branch Application CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch history
        uses: actions/checkout@v4
        with:
          ref: agent/instrument-orderbook-ui
          fetch-depth: 0
      - name: Verify patch whitespace
        run: git diff --check 57fd9cca3b350c82b0ad6266ac3ef8da1b34bd0f HEAD
      - name: Verify exact PR branch and dispatch official workflow
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'agent/instrument-orderbook-ui';
            const expectedRef = `refs/heads/${branch}`;
            if (context.ref !== expectedRef) {
              core.setFailed(`Unexpected ref: ${context.ref}`);
              return;
            }
            const current = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            if (current.data.commit.sha !== context.sha) {
              core.setFailed(`Branch advanced before dispatch: ${current.data.commit.sha}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'futures-public-network-smoke.yml',
              ref: branch,
            });
            core.notice(`Dispatched official Application CI for ${branch}@${context.sha}.`);
