name: Research Crypto Listing Dynamic Exit V6.1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-listing-dynamic-exit-v61.py
      - .github/workflows/research-crypto-listing-dynamic-exit-v61.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-listing-dynamic-exit-v61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: "37418134154"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-crypto-listing-dynamic-exit-v61.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-dynamic-exit-v1.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "scikit-learn>=1.5,<2" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1"
      - name: Download Listing Futures V6 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: crypto-listing-event-v6-CRYPTO_FUTURES-*
          path: listing-v6
      - name: Verify source artifact
        run: |
          test -n "$(find listing-v6 -name summary.json -print -quit)"
          test -n "$(find listing-v6 -name selected-ledger.csv -print -quit)"
      - name: Run Listing dynamic exit V6.1
        run: |
          python market-prediction-lab/scripts/run-crypto-listing-dynamic-exit-v61.py \
            --input-root listing-v6 \
            --out-dir market-prediction-lab/docs/crypto-listing-dynamic-exit-v61
      - name: Upload V6.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-listing-dynamic-exit-v61-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-listing-dynamic-exit-v61
          if-no-files-found: error
          retention-days: 14
