name: Phase4 Playwright Interaction Fix

on:
  push:
    branches:
      - feature/futures-contract-rules-ui-phase4
    paths:
      - .github/workflows/phase4-playwright-interaction-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/futures-contract-rules-ui-phase4

      - name: Enable touch and use a unique contract-rule locator
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('stock-analyzer/playwright.config.ts')
          text = config.read_text()
          old = "    browserName: 'chromium',\n"
          new = "    browserName: 'chromium',\n    hasTouch: true,\n"
          if text.count(old) != 1:
              raise SystemExit('browserName target not found exactly once')
          config.write_text(text.replace(old, new, 1))

          spec = Path('stock-analyzer/e2e/phase4-risk-ui.spec.ts')
          text = spec.read_text()
          old = "  await expect(page.getByText('최대 10배')).toBeVisible();"
          new = "  await expect(page.getByTestId('contract-rules-card').getByText('최대 10배', { exact: true })).toBeVisible();"
          if text.count(old) != 1:
              raise SystemExit('maximum leverage locator target not found exactly once')
          spec.write_text(text.replace(old, new, 1))
          PY

      - name: Commit interaction fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/phase4-playwright-interaction-fix.yml
          git add stock-analyzer/playwright.config.ts stock-analyzer/e2e/phase4-risk-ui.spec.ts
          git commit -m "fix: enable touch and scope Playwright locators"
          git push origin HEAD:feature/futures-contract-rules-ui-phase4
