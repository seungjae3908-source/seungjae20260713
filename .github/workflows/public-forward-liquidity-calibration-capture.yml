name: Public Forward Liquidity Calibration Capture

on:
  pull_request:
    paths:
      - '.github/workflows/public-forward-liquidity-calibration-capture.yml'
      - 'market-intelligence-sidecar/src/public-forward-liquidity-capture-seam-v3.mjs'
      - 'market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA to capture against
        required: true
        type: string
      symbol:
        description: Bitget USDT futures symbol, for example BTCUSDT
        required: true
        type: string
      event_observation_delay_ms:
        description: Explicit prospective delay before reading public trades
        required: true
        type: string
      post_observation_delay_1_ms:
        description: Explicit first post-event public book delay
        required: true
        type: string
      post_observation_delay_2_ms:
        description: Explicit second post-event public book delay
        required: true
        type: string
      max_pre_event_book_age_ms:
        description: Explicit maximum accepted pre-event book age for each public event
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout capture revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax and regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check market-intelligence-sidecar/src/public-forward-liquidity-calibration.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-capture-seam-v3.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs
          node --test market-intelligence-sidecar/tests/public-forward-liquidity-calibration.test.mjs
          node --test market-intelligence-sidecar/tests/public-forward-liquidity-capture-seam-v3.test.mjs

      - name: Verify manual fail-closed authority boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/workflows/public-forward-liquidity-calibration-capture.yml'
          grep -Fq 'workflow_dispatch:' "$FILE"
          if grep -Eq '^[[:space:]]+schedule:' "$FILE"; then
            echo 'Manual capture workflow must never define schedule.' >&2
            exit 1
          fi
          grep -Fq 'MANUAL_WORKFLOW_DISPATCH' "$FILE"
          grep -Fq 'run-public-forward-liquidity-capture-seam-v3.mjs capture' "$FILE"
          FORBIDDEN_PERSIST_CALL="$(printf '%s%s' 'persistLiquidity' 'CalibrationBatch')"
          if grep -Fq "$FORBIDDEN_PERSIST_CALL" "$FILE"; then
            echo 'GitHub capture runner must not mutate canonical Research state.' >&2
            exit 1
          fi

  capture:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact requested main SHA without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main and explicit capture inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SYMBOL: ${{ inputs.symbol }}
          EVENT_DELAY_MS: ${{ inputs.event_observation_delay_ms }}
          POST_DELAY_1_MS: ${{ inputs.post_observation_delay_1_ms }}
          POST_DELAY_2_MS: ${{ inputs.post_observation_delay_2_ms }}
          MAX_PRE_EVENT_BOOK_AGE_MS: ${{ inputs.max_pre_event_book_age_ms }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Capture must be dispatched from main.' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_sha must be an exact 40-character lowercase commit SHA.' >&2
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" || "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo 'Requested SHA does not match the dispatched/checked-out SHA.' >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          REMOTE_MAIN="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_MAIN" != "$EXPECTED_SHA" ]]; then
            echo 'Requested SHA is no longer exact current main.' >&2
            exit 1
          fi
          if [[ ! "$SYMBOL" =~ ^[A-Za-z0-9]{4,30}$ ]]; then
            echo 'Invalid symbol.' >&2
            exit 1
          fi
          node - "$EVENT_DELAY_MS" "$POST_DELAY_1_MS" "$POST_DELAY_2_MS" "$MAX_PRE_EVENT_BOOK_AGE_MS" <<'NODE'
          const values = process.argv.slice(2).map(Number);
          if (values.length !== 4 || values.some((value) => !Number.isInteger(value) || value < 250 || value > 60_000)) process.exit(1);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record actual manual capture start
        id: clock
        shell: bash
        run: echo "actual_run_started_at_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Capture one manual public-forward batch through shared seam
        env:
          CAPTURE_TRIGGER_SOURCE: MANUAL_WORKFLOW_DISPATCH
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SYMBOL: ${{ inputs.symbol }}
          EVENT_DELAY_MS: ${{ inputs.event_observation_delay_ms }}
          POST_DELAY_1_MS: ${{ inputs.post_observation_delay_1_ms }}
          POST_DELAY_2_MS: ${{ inputs.post_observation_delay_2_ms }}
          MAX_PRE_EVENT_BOOK_AGE_MS: ${{ inputs.max_pre_event_book_age_ms }}
          ACTUAL_RUN_STARTED_AT_MS: ${{ steps.clock.outputs.actual_run_started_at_ms }}
          OUTPUT_DIR: public-forward-liquidity-capture
        run: node market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs capture

      - name: Recheck exact main and zero stale-main credit without hiding the receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OUTPUT_DIR: public-forward-liquidity-capture
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          REMOTE_MAIN="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_MAIN" != "$EXPECTED_SHA" ]]; then
            node market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs mark-stale-main
          fi

      - name: Upload immutable raw/manual attempt artifact
        id: capture_upload
        uses: actions/upload-artifact@v4
        with:
          name: public-forward-liquidity-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-forward-liquidity-capture
          if-no-files-found: error
          retention-days: 90

      - name: Bind manual attempt to immutable GitHub artifact identity
        env:
          OUTPUT_DIR: public-forward-liquidity-capture
          ARTIFACT_ID: ${{ steps.capture_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.capture_upload.outputs.artifact-digest }}
          ARTIFACT_NAME: public-forward-liquidity-capture-${{ github.run_id }}-${{ github.run_attempt }}
        run: node market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs bind-artifact

      - name: Upload finalized immutable manual receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-forward-liquidity-capture-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-forward-liquidity-capture/artifact-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed unless the manual capture itself is PRESENT
        env:
          OUTPUT_DIR: public-forward-liquidity-capture
        run: node market-intelligence-sidecar/scripts/run-public-forward-liquidity-capture-seam-v3.mjs assert-terminal
