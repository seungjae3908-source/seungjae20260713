name: Research US V8.2 Event-Onset Top-K V8.5

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-us-v82-event-onset-topk-v85.py
      - .github/workflows/research-us-v82-event-onset-topk-v85.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-us-v82-event-onset-topk-v85-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      V8_RUN_ID: "37441335961"
      V8_ARTIFACT: "us-all-session-target-first-ai-v8-38500a40278149e2d48e89e0a5efbb4947c752f3"
      V82_RUN_ID: "37444336518"
      V82_ARTIFACT: "us-all-session-target-first-ai-v82-recall-34021959e578c1941f336eb0cef5950e"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-us-v82-event-onset-topk-v85.py
          python -m py_compile market-prediction-lab/scripts/run-us-v82-event-onset-portfolio-v84.py
          python -m py_compile market-prediction-lab/scripts/run-us-v82-fullstate-portfolio-v83.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.3,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "huggingface_hub>=0.30,<1" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - name: Download frozen V8 train data
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V8_RUN_ID }}
          name: ${{ env.V8_ARTIFACT }}
          path: frozen-v8
      - name: Download frozen V8.2 threshold
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V82_RUN_ID }}
          name: ${{ env.V82_ARTIFACT }}
          path: frozen-v82
      - name: Run Top-K diagnostic
        run: |
          EVENTS="$(find frozen-v8 -name events-target-first.parquet -print -quit)"
          SUMMARY="$(find frozen-v82 -name summary.json -print -quit)"
          test -n "$EVENTS"
          test -n "$SUMMARY"
          python market-prediction-lab/scripts/run-us-v82-event-onset-topk-v85.py \
            --frozen-events "$EVENTS" \
            --v82-summary "$SUMMARY" \
            --month 2026-03 \
            --out-dir market-prediction-lab/docs/us-v82-event-onset-topk-v85
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-v82-event-onset-topk-v85-${{ github.sha }}
          path: market-prediction-lab/docs/us-v82-event-onset-topk-v85
          if-no-files-found: error
          retention-days: 14
