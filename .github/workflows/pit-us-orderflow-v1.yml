name: PIT US Momentum + Crypto Order Flow V1

on:
  push:
    branches:
      - research/pit-us-orderflow-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-us-pit-sp500-momentum-v1.py
      - market-prediction-lab/scripts/run-binance-orderflow-v1.py
      - .github/workflows/pit-us-orderflow-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-pit-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-us-pit-sp500-momentum-v1.py
      - name: Run survivorship-aware US momentum
        run: python market-prediction-lab/scripts/run-us-pit-sp500-momentum-v1.py
      - name: Verify safety and coverage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-prediction-lab/artifacts/us-pit-momentum-v1/result.json").read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert d["lookahead_free"] is True
          assert d["symbol_count"] >= 500
          assert d["results"]["base"]["avg_coverage"] >= 0.70
          print("US_PIT_SAFETY_COVERAGE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: us-pit-sp500-momentum-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/us-pit-momentum-v1/
          if-no-files-found: error
          retention-days: 30

  crypto-orderflow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-binance-orderflow-v1.py
      - name: Run Binance taker-flow validation
        run: python market-prediction-lab/scripts/run-binance-orderflow-v1.py
      - name: Verify safety and funding contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-prediction-lab/artifacts/binance-orderflow-v1/result.json").read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert d["leverage"] == 1
          assert len(d["symbols"]) == 8
          assert all(v["funding_status"]=="BINANCE_VISION_OK" for v in d["provenance"].values())
          print("ORDERFLOW_SAFETY_FUNDING=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binance-orderflow-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/binance-orderflow-v1/
          if-no-files-found: error
          retention-days: 30
