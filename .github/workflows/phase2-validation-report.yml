name: Phase 2 validation report

on:
  push:
    branches:
      - feature/futures-market-data-phase2

permissions:
  contents: write

jobs:
  validate-and-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/futures-market-data-phase2
          fetch-depth: 0

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Run validation and write report
        shell: bash
        run: |
          set +e
          REPORT="docs/futures-market-data-phase2-ci.md"
          mkdir -p docs
          cat > "$REPORT" <<'EOF'
          # Futures Market Data Phase 2 CI

          This report was generated by GitHub Actions on the phase-2 branch. It contains command status and sanitized build output only. No deployment, order API, database, or secret-reading step is included.

          EOF

          OVERALL=0
          run_check() {
            LABEL="$1"
            shift
            LOG="$(mktemp)"
            "$@" >"$LOG" 2>&1
            CODE=$?
            {
              echo "## $LABEL"
              echo
              echo "- Exit code: \`$CODE\`"
              echo
              echo '```text'
              tail -n 120 "$LOG"
              echo '```'
              echo
            } >> "$REPORT"
            if [ "$CODE" -ne 0 ]; then OVERALL=1; fi
            rm -f "$LOG"
          }

          run_check "Frozen lockfile install" pnpm install --frozen-lockfile
          run_check "Frontend typecheck" pnpm --dir stock-analyzer run typecheck
          run_check "Backend typecheck" pnpm --dir api-server run typecheck
          run_check "Futures unit tests" pnpm --dir api-server run test
          run_check "Frontend production build" pnpm --dir stock-analyzer run build
          run_check "Backend production build" pnpm --dir api-server run build:server

          {
            echo "## Final result"
            echo
            if [ "$OVERALL" -eq 0 ]; then
              echo "- Status: success"
            else
              echo "- Status: failure"
            fi
            echo "- Lint: unavailable because no lint script is defined"
            echo "- External Bitget API calls in unit tests: none"
            echo "- Production deployment: not run"
          } >> "$REPORT"

      - name: Remove temporary workflow and commit report
        run: |
          git rm .github/workflows/phase2-validation-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/futures-market-data-phase2-ci.md
          git commit -m "ci: record phase 2 validation results"
          git push origin HEAD:feature/futures-market-data-phase2
