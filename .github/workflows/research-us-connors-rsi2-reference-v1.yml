name: Research US Connors RSI2 Reference V1

on:
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
      - .github/workflows/research-us-connors-rsi2-reference-v1.yml
      - market-prediction-lab/src/yahoo-stock-history.js

permissions:
  contents: read

concurrency:
  group: research-us-connors-rsi2-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate frozen Connors RSI2 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
          node market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs --self-test
          grep -Fq 'CONNORS_RSI2_CLASSIC_V1' market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
          grep -Fq 'rsiThreshold: 5' market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
          grep -Fq 'trendSma: 200' market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
          grep -Fq 'exitSma: 5' market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
          ! grep -Eiq '/api/v1/orders|PRIVATE_TRADING_API_ALLOWED|REAL_ORDER_ENABLED|LIVE_TRADING|TOSS_CLIENT_SECRET|(^|[^A-Za-z])withdraw([^A-Za-z]|$)|(^|[^A-Za-z])transfer([^A-Za-z]|$)' market-prediction-lab/scripts/run-us-connors-rsi2-reference-v1.mjs
      - name: Run public Connors RSI2 replay
        working-directory: market-prediction-lab
        run: node scripts/run-us-connors-rsi2-reference-v1.mjs docs/us-connors-rsi2-reference-v1.json
      - name: Assert truth and safety
        working-directory: market-prediction-lab
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('docs/us-connors-rsi2-reference-v1.json','utf8'));
          if(r.status!=='pass'||r.recipeId!=='CONNORS_RSI2_CLASSIC_V1') throw new Error('STATUS');
          if(r.implementation?.parameterSearch!==false||r.implementation?.ruleRetuning!==false) throw new Error('FROZEN');
          if(r.implementation?.dividendsIncluded!==false||r.implementation?.corporateActionTotalReturnClaimAllowed!==false) throw new Error('PRICE_ONLY_TRUTH');
          for(const w of ['PRIOR','MID','RECENT']){
            if(!r.aggregate?.[w]||r.aggregate[w].symbolsPositiveCausalNextOpen==null) throw new Error('WINDOW_'+w);
          }
          if(r.promotionAssessment?.automaticPromotionAllowed!==false||r.promotionAssessment?.economicSampleCredit!==0||r.promotionAssessment?.profitabilityClaimAllowed!==false) throw new Error('PROMOTION');
          if(r.safeguards?.researchOnly!==true||r.safeguards?.actualOrders!==0||r.safeguards?.orderRouteCalled!==false||r.safeguards?.executionAuthority!=='NONE') throw new Error('SAFETY');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-connors-rsi2-reference-v1-${{ github.event.pull_request.head.sha }}
          path: market-prediction-lab/docs/us-connors-rsi2-reference-v1.json
          if-no-files-found: error
          retention-days: 30
