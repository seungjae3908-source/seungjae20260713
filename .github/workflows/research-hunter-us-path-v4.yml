name: Research Hunter US Path V4

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-hunter-us-path-diagnostic-v4.py
      - .github/workflows/research-hunter-us-path-v4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-hunter-us-path-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  us-path:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile market-prediction-lab/scripts/run-hunter-us-path-diagnostic-v4.py
      - run: python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "requests>=2.32,<3" "huggingface_hub>=0.30,<1"
      - run: python market-prediction-lab/scripts/run-hunter-us-path-diagnostic-v4.py --out-dir out/US_STOCK
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-us-path-v4-${{ github.sha }}
          path: out/US_STOCK
          if-no-files-found: error
          retention-days: 14
