name: Research Crypto Spot Futures-OI Flow Recovery V6.3.1 Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-crypto-spot-futures-oi-crossmarket-v631.py
      - .github/workflows/research-crypto-spot-futures-oi-crossmarket-v631.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-spot-futures-oi-crossmarket-v631-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: "37471171237"
      SOURCE_ARTIFACT: "crypto-spot-causal-targetfirst-ai-v61-repair-bc6fdb17208d1f789959e126ebae095df3d7c4c4"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/probe-crypto-spot-futures-oi-crossmarket-v631.py

      - name: Install dependencies
        run: python -m pip install "pandas==2.3.3" "pyarrow==21.0.0"

      - name: Download frozen causal spot V6.1 evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-v61

      - name: Probe fixed flow-recovery structure
        run: |
          EVENTS="$(find source-v61 -name causal-long-events.parquet -print -quit)"
          test -n "$EVENTS"
          python market-prediction-lab/scripts/probe-crypto-spot-futures-oi-crossmarket-v631.py             --events "$EVENTS"             --out-dir market-prediction-lab/docs/crypto-spot-futures-oi-crossmarket-v631

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-spot-futures-oi-crossmarket-v631-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-spot-futures-oi-crossmarket-v631
          if-no-files-found: error
          retention-days: 14
