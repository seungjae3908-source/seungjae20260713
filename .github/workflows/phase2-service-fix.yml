name: Phase 2 service fix

on:
  push:
    branches:
      - feature/futures-market-data-phase2

permissions:
  contents: write

jobs:
  apply-service-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/futures-market-data-phase2
          fetch-depth: 0

      - name: Apply exact service fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('api-server/src/services/futures-market-data.service.ts')
          source = path.read_text(encoding='utf-8')

          old_time = '''  const sourceTimestamp = sourceTimes.length ? Math.max(...sourceTimes) : now;
          const availableCoreValues = [price, markPrice, indexPrice, openInterest, fundingRate]
            .filter((value) => value != null).length;
          const status = classifyDataStatus({
            now,
            lastTimestamp: sourceTimestamp,
            count: availableCoreValues,
            minimumCount: 2,
          });'''
          new_time = '''  const sourceTimestamp = sourceTimes.length ? Math.max(...sourceTimes) : null;
          if (sourceTimestamp == null) {
            warnings.push('거래소 응답의 기준 시각을 확인할 수 없어 상태를 데이터 부족으로 표시합니다.');
          }
          const availableCoreValues = [price, markPrice, indexPrice, openInterest, fundingRate]
            .filter((value) => value != null).length;
          const status = classifyDataStatus({
            now,
            lastTimestamp: sourceTimestamp,
            count: availableCoreValues,
            minimumCount: 2,
          });'''
          if old_time not in source:
              raise SystemExit('Snapshot timestamp block was not found.')
          source = source.replace(old_time, new_time, 1)
          source = source.replace(
              "    updatedAt: new Date(sourceTimestamp).toISOString(),",
              "    updatedAt: new Date(sourceTimestamp ?? now).toISOString(),",
              1,
          )

          start = source.index('export async function getFuturesMarketStatus()')
          end = source.index('export async function getFuturesMarketSnapshot', start)
          new_status = '''export async function getFuturesMarketStatus(): Promise<FuturesStatusResponse> {
            try {
              const loaded = await loadWithCache('futures:status', STATUS_TTL_MS, async () => {
                const payload = await fetchBitget('/api/v2/mix/market/tickers', {
                  productType: BITGET_PRODUCT_TYPE,
                });
                const rows = payloadData(payload);
                if (!Array.isArray(rows) || rows.length === 0) {
                  throw new Error('BITGET_TICKERS_EMPTY');
                }
                const timestamp = payloadRequestTime(payload) ?? Date.now();
                return {
                  symbolCount: rows.length,
                  updatedAt: new Date(timestamp).toISOString(),
                };
              });
              const status: DataStatus = loaded.fallback
                ? 'cached'
                : classifyDataStatus({
                    now: Date.now(),
                    lastTimestamp: Date.parse(loaded.value.updatedAt),
                    count: loaded.value.symbolCount,
                    minimumCount: 1,
                  });
              return {
                ok: true,
                provider: 'bitget',
                market: 'crypto-futures',
                status,
                connection: status,
                publicDataOnly: true,
                orderCapability: false,
                symbolCount: loaded.value.symbolCount,
                updatedAt: loaded.value.updatedAt,
                warnings: loaded.fallback
                  ? ['거래소 연결 실패로 마지막 정상 상태 캐시를 반환했습니다.']
                  : [],
              };
            } catch {
              throw new FuturesMarketDataError(503, 'FUTURES_PROVIDER_DISCONNECTED', 'Bitget 공개 시장 데이터에 연결할 수 없습니다.');
            }
          }

          '''
          source = source[:start] + new_status + source[end:]
          path.write_text(source, encoding='utf-8')

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/phase2-service-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src/services/futures-market-data.service.ts
          git commit -m "fix: preserve futures source time and short status cache"
          git push origin HEAD:feature/futures-market-data-phase2
