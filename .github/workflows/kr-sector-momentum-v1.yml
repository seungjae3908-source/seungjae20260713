name: KR Sector Momentum V1

on:
  push:
    branches:
      - research/four-market-profitability-scan-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-kr-sector-momentum-v1.js
      - .github/workflows/kr-sector-momentum-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run KR sector ETF momentum
        run: node market-prediction-lab/scripts/run-kr-sector-momentum-v1.js market-prediction-lab/artifacts/kr-sector-momentum-v1/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: kr-sector-momentum-${{ github.sha }}
          path: market-prediction-lab/artifacts/kr-sector-momentum-v1/result.json
          if-no-files-found: error
