name: Stage 5 long pullback and market context

on:
  push:
    branches:
      - agent/long-pullback-market-context-collector-20260726
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize report
        run: |
          mkdir -p docs/backtests
          {
            echo '# Stage 5 CI verification report'
            echo
            echo "- started_at: $(date -u +%FT%TZ)"
            echo "- commit: $GITHUB_SHA"
            echo
          } > docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        id: pnpm
        continue-on-error: true
        run: |
          set +e
          corepack enable 2>&1 | tee /tmp/pnpm.log
          code=${PIPESTATUS[0]}
          { echo '## Enable pnpm'; echo "- exit_code: $code"; echo '```text'; tail -n 80 /tmp/pnpm.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - name: Install workspace
        id: install
        continue-on-error: true
        run: |
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log
          code=${PIPESTATUS[0]}
          { echo '## Install workspace'; echo "- exit_code: $code"; echo '```text'; tail -n 120 /tmp/install.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - name: Frontend build
        id: frontend
        continue-on-error: true
        run: |
          set +e
          (rm -rf stock-analyzer/dist && pnpm --filter @workspace/stock-analyzer build) 2>&1 | tee /tmp/frontend.log
          code=${PIPESTATUS[0]}
          { echo '## Frontend build'; echo "- exit_code: $code"; echo '```text'; tail -n 160 /tmp/frontend.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - name: Full backend typecheck
        id: backend
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/backend.log
          code=${PIPESTATUS[0]}
          { echo '## Full backend typecheck'; echo "- exit_code: $code"; echo '```text'; tail -n 180 /tmp/backend.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - name: Stage-five files typecheck
        id: targeted
        continue-on-error: true
        run: |
          set +e
          pnpm --dir api-server exec tsc --noEmit --target ESNext --module ESNext --moduleResolution bundler --strict --skipLibCheck --esModuleInterop --allowSyntheticDefaultImports --types node src/services/bitget-market-context.service.ts src/routes/bitget-market-context.routes.ts 2>&1 | tee /tmp/targeted.log
          code=${PIPESTATUS[0]}
          { echo '## Stage-five files typecheck'; echo "- exit_code: $code"; echo '```text'; tail -n 180 /tmp/targeted.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - name: Collector policy smoke test
        id: smoke
        continue-on-error: true
        env:
          BITGET_CONTEXT_DATA_DIR: /tmp/bitget-market-context
          BITGET_CONTEXT_COLLECTOR_ENABLED: 'false'
          BITGET_CONTEXT_COLLECTOR_INTERVAL_MS: '300000'
        run: |
          set +e
          pnpm --dir api-server exec esbuild src/services/bitget-market-context.service.ts --bundle --platform=node --format=esm --outfile=/tmp/bitget-context-service.mjs > /tmp/smoke.log 2>&1
          bundle_code=$?
          if [ "$bundle_code" -eq 0 ]; then
            node --input-type=module >> /tmp/smoke.log 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { collectBitgetMarketContextOnce, evaluateLongPullbackContext } from '/tmp/bitget-context-service.mjs';
          const now = Date.now();
          const base = {
            version: 'bitget-market-context.v1', sampleId: 'TEST:1', sampleBucket: 1,
            symbol: 'TESTUSDT', productType: 'USDT-FUTURES',
            collectedAt: new Date(now).toISOString(), sourceTimestamp: now,
            market: { price: 100, markPrice: 100, indexPrice: 100, bidPrice: 99.99,
              askPrice: 100.01, spreadBps: 2, markIndexPremium: 0, marketMarkGap: 0,
              fundingRate: 0.0001, fundingRateIntervalHours: 8, nextFundingAt: null },
            derivatives: { openInterest: 1000, openInterestChange5mPct: 0.2,
              openInterestChange15mPct: 0.4, openInterestChange1hPct: 1,
              accountLongRatio: 0.5, accountShortRatio: 0.5, accountLongShortRatio: 1,
              positionLongRatio: 0.5, positionShortRatio: 0.5, positionLongShortRatio: 1,
              marketLongRatio: 0.5, marketShortRatio: 0.5, marketLongShortRatio: 1 },
            providerTimestamps: { ticker: now, openInterest: now, accountLongShort: now,
              positionLongShort: now, marketLongShort: now },
          };
          assert.equal(evaluateLongPullbackContext(base).longPullbackEligible, true);
          const crowded = evaluateLongPullbackContext({ ...base,
            derivatives: { ...base.derivatives, accountLongShortRatio: 2.2 } });
          assert.equal(crowded.longPullbackEligible, false);
          assert.ok(crowded.blockReasons.includes('LONG_SIDE_CROWDED'));
          const result = await collectBitgetMarketContextOnce(['BTCUSDT']);
          assert.equal(result.failures.length, 0, JSON.stringify(result.failures));
          assert.equal(result.collected.length, 1);
          assert.ok(result.collected[0].policy.warnings.includes('OI_HISTORY_INSUFFICIENT'));
          const day = result.collected[0].collectedAt.slice(0, 10);
          const saved = await readFile(`/tmp/bitget-market-context/${day}/BTCUSDT.jsonl`, 'utf8');
          assert.ok(saved.includes('bitget-market-context.v1'));
          NODE
            code=$?
          else
            code=$bundle_code
          fi
          { echo '## Collector policy and public API smoke test'; echo "- exit_code: $code"; echo '```text'; tail -n 180 /tmp/smoke.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage-five backtest
        id: backtest
        continue-on-error: true
        run: |
          set +e
          (pip install numpy pandas requests && python -m py_compile tools/backtest/long_pullback_retest_backtest.py && python tools/backtest/long_pullback_retest_backtest.py) 2>&1 | tee /tmp/backtest.log
          code=${PIPESTATUS[0]}
          { echo '## Stage-five backtest'; echo "- exit_code: $code"; echo '```text'; tail -n 220 /tmp/backtest.log; echo '```'; } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          exit $code

      - name: Finalize and commit report
        if: always()
        run: |
          {
            echo
            echo '## Step outcomes'
            echo "- pnpm: ${{ steps.pnpm.outcome }}"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- frontend: ${{ steps.frontend.outcome }}"
            echo "- full_backend: ${{ steps.backend.outcome }}"
            echo "- stage5_typecheck: ${{ steps.targeted.outcome }}"
            echo "- smoke: ${{ steps.smoke.outcome }}"
            echo "- backtest: ${{ steps.backtest.outcome }}"
            echo "- finished_at: $(date -u +%FT%TZ)"
          } >> docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/backtests/STAGE5_LONG_PULLBACK_CI_REPORT.md
          git add docs/backtests/BITGET_5SYMBOL_OLDER89D_LONG_PULLBACK_RETEST_STAGE5* 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No report changes'; else
            git commit -m 'test: record stage-five verification report [skip ci]'
            git push
          fi
