name: Production Live Credential Reuse QA Dispatch Bridge

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-production-live-credential-reuse-qa ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-live-credential-reuse-qa-dispatch-bridge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-production-live-credential-reuse-qa ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) throw new Error('Exact command required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + match[1].toLowerCase() + '\n');
          NODE
      - id: production
        name: Require target to equal latest successful Production Deploy
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const latest = runs
              .filter((run) => run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latest || String(latest.head_sha).toLowerCase() !== target) {
              core.setFailed('Target is not the latest successful Production Deploy SHA.');
              return;
            }
            core.setOutput('deploy_run_id', String(latest.id));
      - id: dispatch
        name: Dispatch exactly one protected credential reuse QA
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          DEPLOY_RUN_ID: ${{ steps.production.outputs.deploy_run_id }}
        with:
          script: |
            const workflowId = 'production-live-credential-reuse-qa.yml';
            const active = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const existing = active.find((run) => run.status !== 'completed');
            if (existing) {
              core.setOutput('run_id', String(existing.id));
              core.setOutput('run_url', existing.html_url);
              return;
            }
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                sha: process.env.TARGET_SHA,
                production_deploy_run_id: process.env.DEPLOY_RUN_ID,
              },
              return_run_details: true,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10',
              },
            });
            const runId = Number(response.data?.workflow_run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Credential reuse QA dispatch returned invalid Run ID.');
              return;
            }
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })).data;
            core.setOutput('run_id', String(runId));
            core.setOutput('run_url', run.html_url);
      - name: Record dispatch receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          DEPLOY_RUN_ID: ${{ steps.production.outputs.deploy_run_id }}
          QA_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          QA_RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1555,
              body: [
                'Production Live Credential Reuse QA dispatched in the isolated production-readonly-qa environment.',
                '',
                '- Exact deployed Production SHA: ' + process.env.TARGET_SHA,
                '- Latest successful Production Deploy Run ID: ' + process.env.DEPLOY_RUN_ID,
                '- Credential Reuse QA Run ID: ' + process.env.QA_RUN_ID,
                '- Run: ' + process.env.QA_RUN_URL,
                '- Intended credential-connection app mutations: up to 4',
                '- Orders/cancels/amends/transfers/withdrawals authorized: 0',
                '- Live/auto trading authority granted: false',
                '- Raw secret values passed by bridge: 0',
                '- Required reviewer for this read-only QA: false',
                '- Source command comment ID: ' + process.env.SOURCE_COMMENT_ID,
              ].join('\n'),
            });
