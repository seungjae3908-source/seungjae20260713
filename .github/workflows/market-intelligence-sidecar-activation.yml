name: Market Intelligence Sidecar Activation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/market-intelligence-sidecar-activation.yml'
      - 'market-intelligence-release/**'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: market-intelligence-sidecar-activation
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify activation safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n market-intelligence-release/deploy/activate-server.sh
          grep -q 'MARKET_INTELLIGENCE_EXECUTION_AUTHORITY=NONE' market-intelligence-release/deploy/activate-server.sh
          grep -q 'LIVE_TRADING=false' market-intelligence-release/deploy/activate-server.sh
          grep -q 'PRIVATE_API_ENABLED=false' market-intelligence-release/deploy/activate-server.sh
          grep -q 'ORDER_AUTHORITY=false' market-intelligence-release/deploy/activate-server.sh
          grep -q '127.0.0.1' market-intelligence-release/deploy/activate-server.sh
          grep -q 'PORT_CONFLICT_WITH_SIGNAL_INTELLIGENCE_V3' market-intelligence-release/deploy/activate-server.sh

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 62 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      target_sha: ${{ steps.gate.outputs.target_sha }}
      validation_run_id: ${{ steps.gate.outputs.validation_run_id }}
      artifact_id: ${{ steps.gate.outputs.artifact_id }}
    steps:
      - name: Authorize exact service SHA
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.comment?.body ?? '').trim();
            const match = body.match(/^\/activate-market-intelligence ([0-9a-f]{40})$/i);
            if (!match) {
              core.setFailed('Expected /activate-market-intelligence <40-char-service-sha>');
              return;
            }
            const targetSha = match[1].toLowerCase();
            await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: targetSha });
            for (const path of [
              'market-intelligence-sidecar/src/engine.mjs',
              'market-intelligence-sidecar/src/public-data.mjs',
              'market-intelligence-sidecar/src/server.mjs',
              'market-intelligence-sidecar/scripts/verify-contract.mjs',
              'market-intelligence-sidecar/SAFETY.md',
            ]) {
              try {
                await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: targetSha });
              } catch {
                core.setFailed(`Required service path missing at target SHA: ${path}`);
                return;
              }
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              per_page: 100,
            });
            const validationRuns = runs
              .filter((run) => run.name === 'Market Intelligence Sidecar Validation')
              .sort((a, b) => Number(b.id) - Number(a.id));
            if (!validationRuns.length) {
              core.setFailed('No exact-head Market Intelligence Sidecar Validation run exists.');
              return;
            }
            const newest = validationRuns[0];
            if (newest.status !== 'completed' || newest.conclusion !== 'success') {
              core.setFailed(`Newest exact-head validation is not successful: ${newest.id} ${newest.status}/${newest.conclusion}`);
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: newest.id,
              per_page: 100,
            });
            const expectedName = `market-intelligence-sidecar-${targetSha}`;
            const artifact = artifacts.find((item) => item.name === expectedName && !item.expired);
            if (!artifact) {
              core.setFailed(`Exact-head release artifact missing: ${expectedName}`);
              return;
            }
            core.setOutput('target_sha', targetSha);
            core.setOutput('validation_run_id', String(newest.id));
            core.setOutput('artifact_id', String(artifact.id));

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify trusted activation script
        run: |
          bash -n market-intelligence-release/deploy/activate-server.sh
          grep -q 'MARKET_INTELLIGENCE_EXECUTION_AUTHORITY=NONE' market-intelligence-release/deploy/activate-server.sh

  activate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      VALIDATION_RUN_ID: ${{ needs.authorize.outputs.validation_run_id }}
      ARTIFACT_ID: ${{ needs.authorize.outputs.artifact_id }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
      - name: Read-only server preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q MARKET_INTELLIGENCE_PORT=%q' "$TARGET_SHA" "$REPOSITORY_URL" '8791')"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s -- preflight" \
            < market-intelligence-release/deploy/activate-server.sh
      - name: Activate isolated sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q MARKET_INTELLIGENCE_PORT=%q' "$TARGET_SHA" "$REPOSITORY_URL" '8791')"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s -- activate" \
            < market-intelligence-release/deploy/activate-server.sh | tee activation.txt
          grep -q "service_sha=$TARGET_SHA" activation.txt
          grep -q 'bind=127.0.0.1:8791' activation.txt
          grep -q 'executionAuthority=NONE' activation.txt
      - name: Report sanitized activation evidence
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body: `[MARKET_INTELLIGENCE_SIDECAR_ACTIVATED]\n- service_sha: \`${process.env.TARGET_SHA}\`\n- validation_run: \`${process.env.VALIDATION_RUN_ID}\`\n- artifact: \`${process.env.ARTIFACT_ID}\`\n- bind: \`127.0.0.1:8791\`\n- service: \`investment-market-intelligence.service\`\n- executionAuthority: \`NONE\`\n- privateTradingApiAllowed: \`false\`\n- realOrderAllowed: \`false\`\n- app Production deploy: \`false\``,
            });
