name: Move Hunter One-Year Four-Market Public Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - research-lab/move-hunter-v1/**
      - .github/workflows/move-hunter-one-year-public-benchmark.yml
      - market-prediction-lab/src/adaptive-multi-evidence-*.js
      - market-prediction-lab/src/yahoo-stock-history.js
      - market-prediction-lab/src/upbit-spot-history.js
      - market-prediction-lab/src/binance-futures-history.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: move-hunter-one-year-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify isolated Move Hunter tests
        run: node --test research-lab/move-hunter-v1/test/*.test.mjs
      - name: Run fixed one-year public benchmark
        run: node research-lab/move-hunter-v1/scripts/run-one-year-public-benchmark.mjs
      - name: Verify no repository mutation outside generated docs
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 | grep -v 'research-lab/move-hunter-v1/docs/one-year-four-market-public-benchmark-20260928' || true
      - name: Upload observed-history benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: move-hunter-one-year-four-market-${{ github.run_id }}
          path: |
            research-lab/move-hunter-v1/docs/one-year-four-market-public-benchmark-20260928.json
            research-lab/move-hunter-v1/docs/one-year-four-market-public-benchmark-20260928.md
          if-no-files-found: warn
          retention-days: 90
