name: Funding Mark Walk-Forward Backtest

on:
  push:
    branches:
      - agent/funding-mark-walkforward-backtest-20260726
    paths:
      - tools/backtest/funding_mark_walkforward_backtest.py
      - .github/workflows/funding-mark-walkforward-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Syntax check
        run: python -m py_compile tools/backtest/funding_mark_walkforward_backtest.py

      - name: Run third-stage public-data backtest
        run: python tools/backtest/funding_mark_walkforward_backtest.py

      - name: Commit generated results to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtests/BITGET_5SYMBOL_89D_FUNDING_MARK_WALKFORWARD.md \
                  docs/backtests/BITGET_5SYMBOL_89D_FUNDING_MARK_WALKFORWARD.json \
                  docs/backtests/BITGET_5SYMBOL_89D_FUNDING_MARK_WALKFORWARD_RUNS.csv \
                  docs/backtests/BITGET_5SYMBOL_89D_FUNDING_MARK_WALKFORWARD_TRADES.csv
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "test: record funding mark walk-forward results [skip ci]"
            git push
          fi
