name: Research Binance Vision V5 Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-binance-vision-v5.py
      - .github/workflows/research-binance-vision-v5-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile market-prediction-lab/scripts/probe-binance-vision-v5.py
      - run: python -m pip install "requests>=2.32,<3"
      - run: python market-prediction-lab/scripts/probe-binance-vision-v5.py
