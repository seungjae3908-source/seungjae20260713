permissions:
  contents: read

concurrency:
  group: paper-forward-schedule-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bounded allowlist is PR-trigger covered
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/paper-forward-schedule-validation.yml').read_text()
          pull = text.split('  pull_request:\n', 1)[1].split('  push:\n', 1)[0]
          trigger = [line.split('- ', 1)[1].strip() for line in pull.splitlines() if line.startswith('      - ')]
          bounded = text.split('          allowed=(\n', 1)[1].split('          )\n', 1)[0]
          allowed = [line.strip() for line in bounded.splitlines() if line.strip()]
          if len(trigger) != len(set(trigger)):
              raise SystemExit('PAPER_FORWARD_VALIDATION_TRIGGER_DUPLICATE_PATH')
          if len(allowed) != len(set(allowed)):
              raise SystemExit('PAPER_FORWARD_VALIDATION_ALLOWLIST_DUPLICATE_PATH')
          missing = sorted(set(allowed) - set(trigger))
          if missing:
              raise SystemExit('PAPER_FORWARD_VALIDATION_TRIGGER_COVERAGE_MISSING:' + ','.join(missing))
          PY

      - name: Require bounded non-UI diff
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          git cat-file -e "$base^{commit}"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          allowed=(
            .github/workflows/authoritative-paper-runtime-factory-v1.yml
            .github/workflows/paper-forward-schedule-validation.yml
            api-server/scripts/build-authoritative-paper-runtime-package.mjs
