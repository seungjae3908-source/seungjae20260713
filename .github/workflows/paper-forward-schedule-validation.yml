permissions:
  contents: read

concurrency:
  group: paper-forward-schedule-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bounded allowlist is PR-trigger covered
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path('.github/workflows/paper-forward-schedule-validation.yml').read_text()
          pull = text.split('  pull_request:\n', 1)[1].split('  push:\n', 1)[0]
          trigger = [line.split('- ', 1)[1].strip() for line in pull.splitlines() if line.startswith('      - ')]
          allowed = subprocess.check_output(
              ['node', '.github/scripts/paper-forward-reviewed-paths.mjs'], text=True
          ).splitlines()
          auto_safety = subprocess.check_output(
              ['node', '.github/scripts/paper-forward-reviewed-paths.mjs', '--list-auto-live-safety'], text=True
          ).splitlines()
          if len(auto_safety) != 64 or len(set(auto_safety)) != 64:
              raise SystemExit('AUTO_LIVE_REVIEWED_SCOPE_MUST_BE_EXACTLY_64')
          auto_supplement = subprocess.check_output(
              ['node', '.github/scripts/paper-forward-reviewed-paths.mjs', '--list-auto-live-supplement'], text=True
          ).splitlines()
          if len(auto_supplement) != 19 or len(set(auto_supplement)) != 19:
              raise SystemExit('AUTO_LIVE_SUPPLEMENT_MUST_BE_EXACTLY_19')
          auto_signal = subprocess.check_output(
              ['node', '.github/scripts/paper-forward-reviewed-paths.mjs', '--list-auto-signal-pipeline'], text=True
          ).splitlines()
          if len(auto_signal) != 72 or len(set(auto_signal)) != 72:
              raise SystemExit('AUTO_SIGNAL_PIPELINE_SCOPE_MUST_BE_EXACTLY_72')
          scanner = subprocess.check_output(
              ['node', '.github/scripts/scanner-readonly-repair-scope.mjs', '--list-paths'], text=True
          ).splitlines()
          if len(trigger) != len(set(trigger)):
              raise SystemExit('PAPER_FORWARD_VALIDATION_TRIGGER_DUPLICATE_PATH')
          if len(allowed) != len(set(allowed)):
              raise SystemExit('PAPER_FORWARD_VALIDATION_ALLOWLIST_DUPLICATE_PATH')
          missing = sorted(set(allowed + auto_safety + auto_supplement + auto_signal + scanner) - set(trigger))
          if missing:
              raise SystemExit('PAPER_FORWARD_VALIDATION_TRIGGER_COVERAGE_MISSING:' + ','.join(missing))
          PY

      - name: Require bounded Paper and four-market backtester diff
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          git cat-file -e "$base^{commit}"
          # Immutable scanner bytes are classification evidence, never execution
          # approval. Validate unchanged deployment/order guards before inclusion.
          node --test .github/tests/scanner-readonly-repair-scope.test.mjs
          node .github/scripts/scanner-readonly-repair-scope.mjs --verify "$base"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          mapfile -t allowed < <(node .github/scripts/paper-forward-reviewed-paths.mjs)
          mapfile -t auto_safety < <(node .github/scripts/paper-forward-reviewed-paths.mjs --list-auto-live-safety)
          test "${#auto_safety[@]}" -eq 64
          allowed+=("${auto_safety[@]}")
          mapfile -t auto_supplement < <(node .github/scripts/paper-forward-reviewed-paths.mjs --list-auto-live-supplement)
          test "${#auto_supplement[@]}" -eq 19
          allowed+=("${auto_supplement[@]}")
          mapfile -t auto_signal < <(node .github/scripts/paper-forward-reviewed-paths.mjs --list-auto-signal-pipeline)
          test "${#auto_signal[@]}" -eq 72
          allowed+=("${auto_signal[@]}")
          # The Research Center batch shares Paper readbacks, not Live authority.
          # Add exact reviewed paths, while preserving every Paper safety test.
          node --test .github/tests/research-center-batch-scope.test.mjs
          mapfile -t research_batch < <(node .github/scripts/research-center-batch-scope.mjs --list-paths)
          test "${#research_batch[@]}" -gt 0
          allowed+=("${research_batch[@]}")
          mapfile -t scanner_repair < <(node .github/scripts/scanner-readonly-repair-scope.mjs --list-paths)
          allowed+=("${scanner_repair[@]}")
          # Precise staging-only automatic Paper holdings GET fix. The owner
          # registered 64 AUTO + 19 supplemental safety scopes remain exact.
          # These three source/test blobs and BOTH Trading guards are pinned.
          paper_holdings_readonly=(
            stock-analyzer/src/pages/auto-trading.tsx
            stock-analyzer/src/components/trading-holdings-panel.tsx
            stock-analyzer/e2e/auto-trading-professional-ui.spec.ts
          )
          scope_requested=false
          for path in "${changed[@]}"; do
            case "$path" in
              stock-analyzer/src/pages/auto-trading.tsx|stock-analyzer/src/components/trading-holdings-panel.tsx|stock-analyzer/e2e/auto-trading-professional-ui.spec.ts)
                scope_requested=true ;;
            esac
          done
          if [[ "$scope_requested" == true ]]; then
            [[ "$base" == "00dc3910d0d580837e2506e9f3d36f2faf43c380" ]] || {
              echo 'PAPER_HOLDINGS_READONLY_BASE_DRIFT' >&2; exit 1;
            }
            paper_holdings_expected=(
              ac2a1782e2837b59232c061aa896987771176b84
              d0e788abd195586fc736df6c17c16d2f178ab146
              a18dfd351f9d7925e8b2f6cf7be29fbe44049136
            )
            for i in "${!paper_holdings_readonly[@]}"; do
              path="${paper_holdings_readonly[$i]}"
              printf '%s\n' "${changed[@]}" | grep -Fx "$path" >/dev/null || {
                echo "PAPER_HOLDINGS_READONLY_REQUIRED_PATH_MISSING:$path" >&2; exit 1;
              }
              [[ "$(git rev-parse "HEAD:$path")" == "${paper_holdings_expected[$i]}" ]] || {
                echo "PAPER_HOLDINGS_READONLY_BLOB_DRIFT:$path" >&2; exit 1;
              }
            done
            trading_guards=(
              .github/workflows/production-automatic-trading-gate.yml
              api-server/scripts/verify-production-automatic-trading-gate.mjs
            )
            guard_expected=(
              39022a0ec56735afb087a185cf5167f6fa0887a2
              c4f0ad9d1adcb409e99680033a4510d6bcd6db4c
            )
            for i in "${!trading_guards[@]}"; do
              path="${trading_guards[$i]}"
              printf '%s\n' "${changed[@]}" | grep -Fx "$path" >/dev/null || {
                echo "PAPER_HOLDINGS_READONLY_TRADING_GUARD_REQUIRED:$path" >&2; exit 1;
              }
              [[ "$(git rev-parse "HEAD:$path")" == "${guard_expected[$i]}" ]] || {
                echo "PAPER_HOLDINGS_READONLY_TRADING_GUARD_DRIFT:$path" >&2; exit 1;
              }
            done
            node api-server/scripts/verify-production-automatic-trading-gate.mjs >/dev/null
          fi
          allowed+=("${paper_holdings_readonly[@]}")
          test "${#changed[@]}" -ge 1
          test "${#changed[@]}" -le "${#allowed[@]}"
          for path in "${changed[@]}"; do
            # Exactly these unrelated paths use their own Research AI /
            # public forward sample authority checks; never waive Paper paths.
            case "$path" in
              .github/workflows/research-ai-production-activation.yml|research-production/bin/research-approved-job-intake.mjs|research-production/test/research-ai-activation-contract.test.mjs|research-production/test/research-approved-job-intake.test.mjs|.github/workflows/public-forward-liquidity-successor-schedule-activation-authority.yml|.github/workflows/public-forward-liquidity-successor-schedule-seam-validation.yml|.github/workflows/public-forward-liquidity-successor-scheduled-capture.yml|market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-activation-authority-v1.mjs|market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-activation-authority-v1.test.mjs) continue ;;
            esac
            printf '%s\n' "${allowed[@]}" | grep -Fx "$path" >/dev/null || {
              echo "unexpected path: $path" >&2
              exit 1
            }
            if [[ "$path" == stock-analyzer/* ]]; then
              case "$path" in
                stock-analyzer/src/components/backtest-research-panel.tsx|stock-analyzer/src/lib/backtest.ts|stock-analyzer/src/lib/excel-export.ts|stock-analyzer/src/pages/phase5-backtest-e2e.tsx|stock-analyzer/e2e/phase5-backtest.spec.ts|stock-analyzer/e2e/backtester-korean-result-ui.spec.ts|stock-analyzer/e2e/production-automatic-paper-activation.spec.ts|stock-analyzer/playwright.production-automatic-paper-activation.config.ts) ;;
                *)
                  if ! printf '%s\n' "${research_batch[@]}" "${scanner_repair[@]}" | grep -Fx "$path" >/dev/null \
                    && ! printf '%s\n' "${auto_safety[@]}" | grep -Fx "$path" >/dev/null \
                    && ! printf '%s\n' "${auto_supplement[@]}" | grep -Fx "$path" >/dev/null \
                    && ! printf '%s\n' "${paper_holdings_readonly[@]}" | grep -Fx "$path" >/dev/null; then
                    echo "Unexpected Paper-facing UI change: $path" >&2
                    exit 1
                  fi
                  ;;
              esac
            fi
          done

      - name: Verify Research formula queue does not grant execution authority
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check market-prediction-lab/src/formula-auto-backtest-queue-v1.js
          node --check market-prediction-lab/scripts/run-formula-auto-backtest-queue-v1.js
          node --test market-prediction-lab/tests/formula-auto-backtest-queue-v1.test.js
          node --check market-prediction-lab/src/registered-formula-prospective-watch-v1.js
          node --test market-prediction-lab/tests/registered-formula-prospective-watch-v1.test.js
          node --test market-prediction-lab/tests/formula-paper-registry-readback-v1.test.js
          grep -Fq "executionAuthority: 'NONE'" market-prediction-lab/src/formula-auto-backtest-queue-v1.js
          grep -Fq 'FORMULA_QUEUE_UNATTESTED_STAGE_EVIDENCE_FORBIDDEN' market-prediction-lab/src/formula-auto-backtest-queue-v1.js
          grep -Fq "id: 'formula-backtest-queue'" research-production/src/engine.mjs

      - name: Validate JavaScript and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          lifecycle_source=market-prediction-lab/src/natural-paper-position-settlement-lifecycle-v1.js
          lifecycle_test=market-prediction-lab/tests/natural-paper-position-settlement-lifecycle-v1.test.js
          if [[ -e "$lifecycle_source" || -e "$lifecycle_test" ]]; then
            test -f "$lifecycle_source"
            test -f "$lifecycle_test"
            node --check "$lifecycle_source"
            node --check "$lifecycle_test"
          fi
          producer_source=market-prediction-lab/src/natural-paper-public-position-observation-v1.js
          producer_test=market-prediction-lab/tests/natural-paper-public-position-observation-v1.test.js
          producer_runtime_test=market-prediction-lab/tests/natural-paper-public-position-observation-runtime-v1.test.js
          if [[ -e "$producer_source" || -e "$producer_test" || -e "$producer_runtime_test" ]]; then
            test -f "$producer_source"
            test -f "$producer_test"
            test -f "$producer_runtime_test"
            node --check "$producer_source"
            node --check "$producer_test"
            node --check "$producer_runtime_test"
          fi
          node --check market-prediction-lab/src/authoritative-natural-paper-accounting-v1.js
          node --check market-prediction-lab/src/paper-forward-evidence-runtime-v1.js
          node --check market-prediction-lab/src/paper-scheduler-driver-v1.js
          node --check market-prediction-lab/src/paper-forward-schedule-runtime-base-v1.js
          node --check market-prediction-lab/src/paper-forward-schedule-runtime-v1.js
