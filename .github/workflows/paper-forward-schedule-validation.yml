      - name: Verify Production approval race guards
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/paper-forward-schedule-activation.yml
          grep -F 'Revalidate current main after Production environment approval' "$workflow" >/dev/null
          grep -F 'Activation target became stale while awaiting Production approval' "$workflow" >/dev/null
          grep -F 'Revalidate current main before schedule installation' "$workflow" >/dev/null
          grep -F 'Activation target became stale during Production deployment; refusing schedule install' "$workflow" >/dev/null
          test "$(grep -Fc 'main.data.commit.sha !== target' "$workflow")" -ge 3
          post_approval_line="$(grep -nF 'Revalidate current main after Production environment approval' "$workflow" | head -1 | cut -d: -f1)"
          deploy_line="$(grep -nF 'Deploy exact approved revision with canonical canary and rollback safeguards' "$workflow" | head -1 | cut -d: -f1)"
          pre_install_line="$(grep -nF 'Revalidate current main before schedule installation' "$workflow" | head -1 | cut -d: -f1)"
          install_line="$(grep -nF 'Install fail-closed Paper Forward schedule without immediate manual cycle' "$workflow" | head -1 | cut -d: -f1)"
          test "$post_approval_line" -lt "$deploy_line"
          test "$deploy_line" -lt "$pre_install_line"
          test "$pre_install_line" -lt "$install_line"
          grep -F 'Collect sanitized cron failure diagnostics before disable' "$workflow" >/dev/null
          grep -F 'paper-forward-sanitized-cron-failure-v1' "$workflow" >/dev/null
          diagnostics_line="$(grep -nF 'Collect sanitized cron failure diagnostics before disable' "$workflow" | head -1 | cut -d: -f1)"
          disable_line="$(grep -nF 'Disable schedule automatically if activation validation fails' "$workflow" | head -1 | cut -d: -f1)"
          test "$diagnostics_line" -lt "$disable_line"

      - name: Verify stale schedule emergency disable contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/paper-forward-schedule-disable.yml
          test -f "$workflow"
          grep -F "startsWith(github.event.comment.body, '/disable-paper-forward-schedule ')" "$workflow" >/dev/null
          grep -F "environment: production" "$workflow" >/dev/null
          grep -F "target === currentMain" "$workflow" >/dev/null
          test "$(grep -Fc 'compareCommitsWithBasehead' "$workflow")" -ge 2
          grep -F "comparison.data.behind_by !== 0" "$workflow" >/dev/null
          grep -F "Revalidate stale target ancestry after Production environment approval" "$workflow" >/dev/null
          grep -F "Refusing emergency disable because stale target is not an ancestor of current main after Production approval" "$workflow" >/dev/null
          grep -F "Post-approval stale ancestry guard accepted" "$workflow" >/dev/null
          ! grep -F "Current main moved again before emergency disable" "$workflow" >/dev/null
          ! grep -F "EXPECTED_MAIN_SHA" "$workflow" >/dev/null
          grep -F '[[ "$DEPLOYED_SHA" == "$TARGET_SHA" ]]' "$workflow" >/dev/null
          grep -F '< ops/disable-paper-forward-schedule.sh' "$workflow" >/dev/null
          grep -F "cronEntryCountAfter: Number(cronCountRaw)" "$workflow" >/dev/null
          grep -F "orderAuthorityOff: disabled.orderAuthority === false" "$workflow" >/dev/null

      - name: Final exact HEAD and clean workspace
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
