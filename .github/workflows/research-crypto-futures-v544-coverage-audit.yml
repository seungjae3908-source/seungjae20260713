name: Research Bitget V5.4.4 Coverage Audit

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-futures-v544-coverage-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "37479615253"
      SOURCE_ARTIFACT: "crypto-futures-v542-bitget-fresh-v544-d387edde18afcdc59a2fc78e3c48c352914cdaaf"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: python -m pip install "pandas==2.3.3"
      - name: Download V5.4.4 evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-v544
      - name: Audit missing Bitget paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          files=list(Path("source-v544").glob("**/source-audit.csv"))
          if not files:
              raise SystemExit("source-audit.csv missing")
          df=pd.read_csv(files[0])
          ok=df.get("ok",pd.Series(False,index=df.index)).fillna(False).astype(bool)
          bad=df.loc[~ok].copy()

          def norm_error(row):
              e=str(row.get("error") or "")
              if e and e!="nan":
                  return e.split(":",1)[0]
              for c in ("status","reason"):
                  v=str(row.get(c) or "")
                  if v and v!="nan":
                      return v.split(":",1)[0]
              return "UNKNOWN"

          bad["errorClass"]=bad.apply(norm_error,axis=1)
          out={
              "contract":"crypto-futures-v544-coverage-audit",
              "rows":int(len(df)),
              "okRows":int(ok.sum()),
              "failedRows":int((~ok).sum()),
              "coverage":float(ok.mean()) if len(df) else 0.0,
              "errorCounts":{str(k):int(v) for k,v in bad["errorClass"].value_counts().to_dict().items()},
              "failedSymbols":sorted(set(bad.get("symbol",pd.Series(dtype=str)).dropna().astype(str)))[:100],
              "failedPreview":bad.head(40).fillna("").to_dict("records"),
              "truthBoundary":{
                  "diagnosticOnly":True,
                  "signalsFrozen":True,
                  "thresholdFrozen":True,
                  "noOutcomeReselection":True,
                  "profitabilityProven":False,
                  "executionAuthority":"NONE",
              },
          }
          Path("coverage-audit").mkdir(exist_ok=True)
          Path("coverage-audit/summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"FINAL":out},ensure_ascii=False))
          PY
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-v544-coverage-audit-${{ github.sha }}
          path: coverage-audit
          if-no-files-found: error
          retention-days: 14
