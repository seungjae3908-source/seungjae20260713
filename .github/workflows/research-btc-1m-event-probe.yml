name: Research BTC 1m Event Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-btc-1m-event-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        market: [spot, futures]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" "requests>=2.32,<3"
      - name: Probe BTC one-minute events
        run: |
          python - <<'PY'
          import io,zipfile,json,requests,pandas as pd
          market='${{ matrix.market }}'
          months=pd.period_range('2023-04','2026-09',freq='M').astype(str)
          frames=[]; failed=[]
          for m in months:
              if market=='spot':
                  url=f'https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-{m}.zip'
              else:
                  url=f'https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-{m}.zip'
              try:
                  r=requests.get(url,timeout=60,headers={'User-Agent':'market-prediction-lab/btc-event-probe'})
                  if r.status_code==404:
                      failed.append({'month':m,'status':404}); continue
                  r.raise_for_status()
                  with zipfile.ZipFile(io.BytesIO(r.content)) as z:
                      name=[n for n in z.namelist() if n.endswith('.csv')][0]
                      x=pd.read_csv(z.open(name),header=None)
                  try: float(x.iloc[0,0])
                  except Exception: x=x.iloc[1:].reset_index(drop=True)
                  x=x.iloc[:,:12]; x.columns=['open_time','open','high','low','close','volume','close_time','quote_volume','trades','taker_buy_volume','taker_buy_quote','ignore']
                  for c in ['open_time','open','close','quote_volume','trades']:
                      x[c]=pd.to_numeric(x[c],errors='coerce')
                  x=x.dropna(subset=['open_time','open','close'])
                  unit='us' if float(x['open_time'].median())>1e14 else 'ms'
                  x['timestamp']=pd.to_datetime(x['open_time'].astype('int64'),unit=unit,utc=True)
                  frames.append(x[['timestamp','open','close','quote_volume','trades']])
              except Exception as e:
                  failed.append({'month':m,'error':repr(e)})
          if not frames: raise SystemExit('NO_BTC_1M_DATA')
          df=pd.concat(frames,ignore_index=True).sort_values('timestamp')
          df['ret1']=df['close']/df['close'].shift(1)-1
          df['date']=df['timestamp'].dt.date
          out={'market':market,'rows':len(df),'monthsLoaded':len(frames),'failed':failed,'thresholds':{}}
          for t in [0.002,0.003,0.005,0.01]:
              up=df[df['ret1']>=t]; dn=df[df['ret1']<=-t]
              out['thresholds'][str(t)]={
                'upEvents':len(up),'upDates':int(up['date'].nunique()),
                'downEvents':len(dn),'downDates':int(dn['date'].nunique()),
                'eitherDates':int(pd.concat([up[['date']],dn[['date']]])['date'].nunique()),
              }
          print(json.dumps({'BTC_1M_EVENT_PROBE':out},ensure_ascii=False))
          PY
