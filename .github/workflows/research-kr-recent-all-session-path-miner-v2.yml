name: Research KR Recent All-Session Path Miner V2

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-kr-recent-all-session-path-miner-v2.py
      - .github/workflows/research-kr-recent-all-session-path-miner-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-kr-recent-all-session-path-miner-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-kr-recent-all-session-path-miner-v2.py
          python -m py_compile market-prediction-lab/scripts/run-kr-recent-all-session-opportunity-miner-v1.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "requests>=2.32,<3" "duckdb>=1.3,<2" "polars>=1.30,<2" "pyarrow>=18,<22" "huggingface_hub>=0.30,<1" "finance-datareader>=0.9"
      - name: Mine recent KRX path-aware opportunities
        run: |
          python market-prediction-lab/scripts/run-kr-recent-all-session-path-miner-v2.py \
            --out-dir market-prediction-lab/docs/kr-recent-all-session-path-miner-v2
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-recent-all-session-path-miner-v2-${{ github.sha }}
          path: market-prediction-lab/docs/kr-recent-all-session-path-miner-v2
          if-no-files-found: error
          retention-days: 14
