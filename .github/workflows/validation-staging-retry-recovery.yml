name: Validate Retry Recovery Static Contract

on:
  push:
    branches:
      - validation/staging-retry-recovery-da1fa0e7

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Add retry recovery static contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'api-server/scripts/verify-staging-login-selector-contract.mjs';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes('const retryRecoveryTestStart =')) {
            const marker = `const profileTimeoutTestStart = spec.indexOf("test('profile timeout abort:");`;
            if (!source.includes(marker)) throw new Error('profile-timeout verifier marker not found');
            const insertion = `const retryRecoveryTestStart = spec.indexOf("test('retry recovery:");\nconst retryRecoveryTestEnd = spec.indexOf("\\n  test('scanner readiness:", retryRecoveryTestStart);\nassert(\n  retryRecoveryTestStart >= 0 && retryRecoveryTestEnd > retryRecoveryTestStart,\n  'retry recovery fixture boundaries are missing',\n);\nconst retryRecoveryTestBlock = spec.slice(retryRecoveryTestStart, retryRecoveryTestEnd);\nassert(\n  (retryRecoveryTestBlock.match(/await expectHealthyRoute\\(page, '\\/account'\\);/g) ?? []).length === 1,\n  'retry recovery must bootstrap and recover on the quiet authenticated account route exactly once',\n);\nassert(\n  !retryRecoveryTestBlock.includes("await expectHealthyRoute(page, '/');"),\n  'retry recovery must not use the polling-heavy home route as its bootstrap fixture',\n);\nassert(\n  retryRecoveryTestBlock.includes("await page.getByRole('button', { name: '다시 시도', exact: true }).click();"),\n  'retry recovery must exercise the explicit retry action',\n);\nassert(\n  retryRecoveryTestBlock.includes("expect(requestCount, 'retry must create exactly one fresh profile request after the first failure').toBe(2);"),\n  'retry recovery must prove exactly one fresh profile request',\n);\nassert(\n  retryRecoveryTestBlock.includes("expect(observation.candidates, 'semantic first-attempt rejection must not create a network-error exemption').toHaveLength(0);"),\n  'semantic retry failure must not create a network-error exemption',\n);\nassert(\n  retryRecoveryTestBlock.includes("await expect(page.getByRole('button', { name: /로그아웃|sign out/i })).toBeVisible();"),\n  'retry recovery must finish on authenticated account UI',\n);\n\n`;
            source = source.replace(marker, `${insertion}${marker}`);
            fs.writeFileSync(file, source);
          }
          NODE
          git diff --check
      - name: Targeted verifier
        run: node ./api-server/scripts/verify-staging-login-selector-contract.mjs
      - name: Phase12
        run: pnpm --dir api-server run test:phase12
      - name: Commit validated verifier if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add api-server/scripts/verify-staging-login-selector-contract.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "api-server/scripts/verify-staging-login-selector-contract.mjs"
          git commit -m "validation(source): lock retry recovery account route"
          git push origin HEAD:validation/staging-retry-recovery-da1fa0e7
