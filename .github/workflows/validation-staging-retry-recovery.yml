name: Validation Staging Retry Recovery

on:
  push:
    branches:
      - validation/staging-retry-recovery-da1fa0e7

permissions:
  contents: read

env:
  STAGING_ARTIFACT_DIR: ${{ github.workspace }}/staging-validation-artifacts

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Patch retry recovery candidate in validation worktree only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'stock-analyzer/e2e/phase10-staging-readiness.spec.ts';
          let source = fs.readFileSync(file, 'utf8');
          const before = `      await expectHealthyRoute(page, '/account');\n      await expect(page.getByRole('button', { name: /로그아웃|sign out/i })).toBeVisible();`;
          const after = `      expect(routeIdentity(page.url()), 'retry recovery must remain on the authenticated home route').toBe('/');\n      const protectedResponse = await requestWithBrowserSession(page, '/api/paper-journal/snapshot');\n      expect(protectedResponse.status(), 'retry recovery must restore protected API access').toBe(200);\n      const pendingAtRecovery = new Set(pendingApiGetRequests.get(page) ?? []);\n      await expect.poll(\n        () => {\n          const pending = pendingApiGetRequests.get(page);\n          if (!pending) return 0;\n          return [...pendingAtRecovery].filter((request) => pending.has(request)).length;\n        },\n        {\n          message: 'post-retry App API GET requests must settle before retry fixture closes',\n          timeout: 15_000,\n          intervals: [100, 200, 300, 500],\n        },\n      ).toBe(0);`;
          if (!source.includes(before)) throw new Error('expected retry-recovery candidate block not found');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
          git diff --check
      - name: Targeted static verifier
        run: node ./api-server/scripts/verify-staging-login-selector-contract.mjs
      - name: Phase12
        run: pnpm --dir api-server run test:phase12
      - name: Frontend typecheck
        run: pnpm --dir stock-analyzer run typecheck
      - name: Backend typecheck
        run: pnpm --dir api-server run typecheck
      - name: Install Chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium
      - name: Targeted real staging retry recovery
        env:
          PHASE10_STAGING_E2E: "true"
          STAGING_TARGET_SHA: da1fa0e7769f214b8f42f769d63abacf8ef48a45
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --dir stock-analyzer exec playwright test -c playwright.config.ts e2e/phase10-staging-readiness.spec.ts --grep "retry recovery:"
