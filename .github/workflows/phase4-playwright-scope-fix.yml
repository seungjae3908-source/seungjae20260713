name: Phase4 Playwright Scope Fix

on:
  push:
    branches:
      - feature/futures-contract-rules-ui-phase4
    paths:
      - .github/workflows/phase4-playwright-scope-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/futures-contract-rules-ui-phase4

      - name: Scope label validation to the risk panel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('stock-analyzer/e2e/phase4-risk-ui.spec.ts')
          text = path.read_text()
          old = """  const inputCount = await page.locator('input').count();
  for (let index = 0; index < inputCount; index += 1) {
    const input = page.locator('input').nth(index);
"""
          new = """  const riskPanel = page.getByTestId('trading-risk-preview-panel');
  const inputCount = await riskPanel.locator('input').count();
  for (let index = 0; index < inputCount; index += 1) {
    const input = riskPanel.locator('input').nth(index);
"""
          if text.count(old) != 1:
              raise SystemExit('input scope target not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit scoped check
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/phase4-playwright-scope-fix.yml
          git add stock-analyzer/e2e/phase4-risk-ui.spec.ts
          git commit -m "fix: scope accessibility input checks to risk panel"
          git push origin HEAD:feature/futures-contract-rules-ui-phase4
