name: Research Four-Market Always-On Contract V1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/always_on_portfolio_replay.py
      - .github/workflows/research-four-market-always-on-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-four-market-always-on-contract-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/always_on_portfolio_replay.py
      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22"
      - name: Verify scanner and position monitor stay concurrent
        run: |
          python market-prediction-lab/scripts/always_on_portfolio_replay.py \
            --contract-smoke \
            --out-dir market-prediction-lab/docs/four-market-always-on-contract-v1
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-market-always-on-contract-v1-${{ github.sha }}
          path: market-prediction-lab/docs/four-market-always-on-contract-v1
          if-no-files-found: error
          retention-days: 14
