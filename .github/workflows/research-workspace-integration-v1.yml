permissions:
  contents: read
concurrency:
  group: research-workspace-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  LIVE_TRADING: 'false'
  AUTO_TRADING: 'false'
  REAL_ORDER_ENABLED: 'false'
  PRIVATE_TRADING_API_ALLOWED: 'false'
  ENABLE_REPLIT_EDITOR_PLUGINS: 'false'
jobs:
  contract-and-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner ancestry and protected main paths
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --test .github/tests/research-center-batch-scope.test.mjs
          node --test .github/tests/scanner-readonly-repair-scope.test.mjs
          node .github/scripts/verify-research-workspace-sync-v3.mjs "$RUNNER_TEMP/workspace-preservation.json"
      - name: Offline contract, storage and anti-hang regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test packages/external-research/test/research-workspace*.test.js | tee "$RUNNER_TEMP/workspace-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-workspace-v3-contract-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-preservation.json
            ${{ runner.temp }}/workspace-tests.log
          if-no-files-found: error
          retention-days: 30
  application-integration:
    needs: contract-and-preservation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned workspace dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend semantic typecheck
        if: steps.install.outcome == 'success'
        run: pnpm --dir stock-analyzer typecheck
      - name: Backend semantic typecheck
        if: always() && steps.install.outcome == 'success'
        run: pnpm --dir api-server exec tsc -p tsconfig.json --noEmit
      - name: Phase12 provider one-shot synthetic contract
        if: always() && steps.install.outcome == 'success'
        working-directory: api-server
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec esbuild src/services/research-groq-one-shot-transport.service.test.ts             --bundle --platform=node --format=cjs --target=node22             --define:import.meta.env='{}' --outfile="$RUNNER_TEMP/research-groq-v12.test.cjs"
          pnpm exec esbuild src/tools/research-workspace-one-shot-v12.test.ts             --bundle --platform=node --format=cjs --target=node22             --define:import.meta.env='{}' --outfile="$RUNNER_TEMP/research-one-shot-v12.test.cjs"
          node --test "$RUNNER_TEMP/research-groq-v12.test.cjs" "$RUNNER_TEMP/research-one-shot-v12.test.cjs"             | tee "$RUNNER_TEMP/research-one-shot-v12-tests.log"
          pnpm exec esbuild scripts/run-research-workspace-one-shot-v12.ts             --bundle --platform=node --format=esm --target=node22             --outfile="$RUNNER_TEMP/run-research-one-shot-v12.mjs"
          node "$RUNNER_TEMP/run-research-one-shot-v12.mjs" --help             | tee "$RUNNER_TEMP/research-one-shot-v12-help.log"
          grep -Fq 'at most one Gemini call and one Groq call' "$RUNNER_TEMP/research-one-shot-v12-help.log"
          grep -Fq 'No compiler/backtest, schedule, deployment, trading or paid fallback' "$RUNNER_TEMP/research-one-shot-v12-help.log"
      - name: Phase16 human rule-digest binding synthetic contract
        if: always() && steps.install.outcome == 'success'
        working-directory: api-server
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ../packages/external-research/test/research-workspace-one-shot-bind-v16.test.js \
            | tee "$RUNNER_TEMP/research-human-bind-v16-tests.log"
          pnpm exec esbuild scripts/run-research-workspace-one-shot-bind-v16.ts \
            --bundle --platform=node --format=esm --target=node22 \
            --outfile="$RUNNER_TEMP/run-research-human-bind-v16.mjs"
          node "$RUNNER_TEMP/run-research-human-bind-v16.mjs" --help \
            | tee "$RUNNER_TEMP/research-human-bind-v16-help.log"
          grep -Fq 'one canonical research evaluation only' "$RUNNER_TEMP/research-human-bind-v16-help.log"
          grep -Fq 'Provider calls, compiler runs and backtests remain zero' "$RUNNER_TEMP/research-human-bind-v16-help.log"
      - name: Existing source-reader HTTP regressions
        if: always() && steps.install.outcome == 'success'
        working-directory: api-server
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/workspace-http-tests.log"
          import { build } from 'esbuild';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const directory = await mkdtemp(path.join(tmpdir(), 'workspace-http-'));
          try {
            const output = path.join(directory, 'source-reader.test.cjs');
            // Match api-server/test.mjs; use the existing lockfile-pinned compiler.
            await build({
              entryPoints: ['src/routes/market-summary-availability.smoke.test.ts'],
              outfile: output, bundle: true, platform: 'node', format: 'cjs',
              target: 'node20', sourcemap: 'inline', logLevel: 'warning',
              define: { 'import.meta.env': '{}' },
            });
            const result = spawnSync(process.execPath, ['--test', output], {
              cwd: path.resolve('..'), stdio: 'inherit',
            });
            if (result.error) throw result.error;
            process.exitCode = result.status ?? 1;
          } finally { await rm(directory, { recursive: true, force: true }); }
          NODE
      - name: Canonical current-admin publication authorization regressions
        if: always() && steps.install.outcome == 'success'
        working-directory: api-server
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/workspace-admin-tests.log"
          import { build } from 'esbuild';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const directory=await mkdtemp(path.join(tmpdir(),'workspace-admin-'));
          try {
            const output=path.join(directory,'authorization.test.cjs');
            await build({entryPoints:['src/services/research-workspace-authorization-v5.test.ts'],
              outfile:output,bundle:true,platform:'node',format:'cjs',target:'node22',logLevel:'warning',
              define:{'import.meta.env':'{}'}});
            const result=spawnSync(process.execPath,['--test',output],{cwd:path.resolve('..'),stdio:'inherit'});
            if(result.error)throw result.error;
            process.exitCode=result.status??1;
          } finally {await rm(directory,{recursive:true,force:true});}
          NODE
      - name: Canonical transcript extraction adapter (synthetic transports)
        if: always() && steps.install.outcome == 'success'
        working-directory: api-server
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/workspace-transcript-tests.log"
          import { build } from 'esbuild';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const directory=await mkdtemp(path.join(tmpdir(),'workspace-transcript-'));
          try {
            const output=path.join(directory,'transcript.test.cjs');
            await build({entryPoints:['src/services/research-workspace-transcript-v6.test.ts'],
              outfile:output,bundle:true,platform:'node',format:'cjs',target:'node22',logLevel:'warning',
              define:{'import.meta.env':'{}'}});
            const result=spawnSync(process.execPath,['--test',output],{cwd:path.resolve('..'),stdio:'inherit'});
            if(result.error)throw result.error;
            process.exitCode=result.status??1;
          } finally {await rm(directory,{recursive:true,force:true});}
          NODE
      - name: Install Chromium
        id: browser
        if: always() && steps.install.outcome == 'success'
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium
      - name: Actual React application and Tailwind browser suite (synthetic API fixtures)
        if: always() && steps.browser.outcome == 'success'
        run: pnpm --dir stock-analyzer exec playwright test -c playwright.research-workspace.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-workspace-v3-application-${{ github.run_id }}
          path: |
            stock-analyzer/test-results
            ${{ runner.temp }}/workspace-http-tests.log
            ${{ runner.temp }}/workspace-admin-tests.log
            ${{ runner.temp }}/workspace-transcript-tests.log
            ${{ runner.temp }}/research-one-shot-v12-tests.log
            ${{ runner.temp }}/research-one-shot-v12-help.log
            ${{ runner.temp }}/research-human-bind-v16-tests.log
            ${{ runner.temp }}/research-human-bind-v16-help.log
          if-no-files-found: error
          retention-days: 30
