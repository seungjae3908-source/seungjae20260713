name: Temporary Liquidity Receipt Chain Core Patch V6

on:
  push:
    branches:
      - feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
    paths:
      - '.github/workflows/tmp-liquidity-receipt-chain-patch-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply core patch
        run: python scripts/tmp-liquidity-receipt-chain-core-patch-v6.py
      - name: Validate core patch
        shell: bash
        run: |
          set -euo pipefail
          node --check market-intelligence-sidecar/src/public-forward-liquidity-ingest-receipt-chain.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-independence-audit.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-independence-audit.mjs
          node --check market-intelligence-sidecar/tests/public-forward-liquidity-independence-audit.test.mjs
          node --check market-intelligence-sidecar/tests/public-forward-liquidity-independence-runner-v2.test.mjs
          node --test market-intelligence-sidecar/tests/public-forward-liquidity-independence-audit.test.mjs market-intelligence-sidecar/tests/public-forward-liquidity-independence-runner-v2.test.mjs
          git diff --check
      - name: Commit core files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-intelligence-sidecar/src/public-forward-liquidity-independence-audit.mjs market-intelligence-sidecar/scripts/run-public-forward-liquidity-independence-audit.mjs market-intelligence-sidecar/tests/public-forward-liquidity-independence-audit.test.mjs market-intelligence-sidecar/tests/public-forward-liquidity-independence-runner-v2.test.mjs
          git diff --cached --check
          git commit -m 'fix(research): authenticate complete cumulative ingest receipt chain'
          git push origin HEAD:feat/p0-liquidity-canonical-persistence-dedup-independence-20260829
