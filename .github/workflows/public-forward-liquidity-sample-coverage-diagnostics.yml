name: Public Forward Liquidity Sample Coverage Diagnostics

on:
  pull_request:
    paths:
      - 'market-intelligence-sidecar/src/public-forward-liquidity-sample-coverage-diagnostics.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-sample-coverage-diagnostics.test.mjs'
      - 'market-intelligence-sidecar/scripts/run-public-forward-liquidity-sample-coverage-diagnostics.mjs'
      - '.github/workflows/public-forward-liquidity-sample-coverage-diagnostics.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check market-intelligence-sidecar/src/public-forward-liquidity-sample-coverage-diagnostics.mjs
          node --check market-intelligence-sidecar/tests/public-forward-liquidity-sample-coverage-diagnostics.test.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-sample-coverage-diagnostics.mjs

      - name: Run sample coverage diagnostics tests
        run: node --test market-intelligence-sidecar/tests/public-forward-liquidity-sample-coverage-diagnostics.test.mjs

      - name: Verify coverage-only safety contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='market-intelligence-sidecar/src/public-forward-liquidity-sample-coverage-diagnostics.mjs'
          grep -Fq 'coverageDiagnosticOnly: true' "$FILE"
          grep -Fq 'populationBaselineAvailable: false' "$FILE"
          grep -Fq 'representativenessProven: false' "$FILE"
          grep -Fq 'sampleSufficiencyCredit: false' "$FILE"
          grep -Fq 'calibrationCredit: false' "$FILE"
          grep -Fq 'oosCredit: false' "$FILE"
          grep -Fq 'fullCostCredit: false' "$FILE"
          grep -Fq 'FULL_COST_READY: false' "$FILE"
          grep -Fq 'naturalEntryCredit: 0' "$FILE"
          grep -Fq 'settlementCredit: 0' "$FILE"
          grep -Fq 'promotionCredit: false' "$FILE"
          grep -Fq 'championCredit: false' "$FILE"
          grep -Fq 'thresholdChangeAuthorized: false' "$FILE"
          grep -Fq 'eventWindowChangeAuthorized: false' "$FILE"
          grep -Fq "executionAuthority: 'NONE'" "$FILE"
          grep -Fq 'privateTradingApiAllowed: false' "$FILE"
          grep -Fq 'liveTradingAllowed: false' "$FILE"
          grep -Fq 'realOrderAllowed: false' "$FILE"
          grep -Fq "nextActionType: 'COLLECT_OR_INSPECT_GENUINE_FORWARD_EVIDENCE_ONLY'" "$FILE"
