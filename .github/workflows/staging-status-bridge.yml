name: Staging Status Bridge

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/staging-status-bridge.yml
      - api-server/scripts/verify-phase10-staging-status-bridge.mjs
      - docs/staging-status-bridge.md

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-status-bridge-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging status bridge safeguards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node api-server/scripts/verify-phase10-staging-status-bridge.mjs

  status:
    name: Report owner-requested staging release verdict
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/status-staging ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Parse exact owner status command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -Eeuo pipefail
          [[ "$ISSUE_NUMBER" == "23" ]] || { echo 'Unauthorized control issue.' >&2; exit 1; }
          [[ "$ISSUE_TITLE" == "Staging Readiness Control" ]] || { echo 'Unexpected control issue title.' >&2; exit 1; }
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || { echo 'Only the repository owner may query staging.' >&2; exit 1; }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || { echo 'Comment author is not the repository owner.' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/status-staging ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /status-staging <40-character-main-contained-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\n`);
          NODE
      - name: Require an immutable revision contained in main
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Normalized 40-character SHA required.' >&2; exit 1; }
          git fetch --no-tags origin main "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo 'Status query SHA must be contained in current main.' >&2
            exit 1
          }
      - name: Locate exact staging verdict artifact and source Run
        id: lookup
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const artifactName = `staging-verdict-${targetSha}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });
            const candidates = artifacts
              .filter((artifact) => !artifact.expired && artifact.workflow_run?.head_sha === targetSha)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            for (const artifact of candidates) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              const run = response.data;
              if (run.event === 'workflow_dispatch'
                && run.head_branch === 'main'
                && run.head_sha === targetSha
                && run.path === '.github/workflows/staging-readiness.yml') {
                core.setOutput('found', 'true');
                core.setOutput('run_id', String(run.id));
                core.setOutput('run_url', run.html_url);
                core.setOutput('status', run.status);
                core.setOutput('conclusion', run.conclusion ?? 'pending');
                return;
              }
            }
            core.setOutput('found', 'false');
      - name: Download exact staging verdict
        if: steps.lookup.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: staging-verdict-${{ steps.command.outputs.sha }}
          path: staging-verdict
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.lookup.outputs.run_id }}
      - name: Report exact staging verdict without modifying workflows
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          FOUND: ${{ steps.lookup.outputs.found }}
          RUN_ID: ${{ steps.lookup.outputs.run_id }}
          RUN_URL: ${{ steps.lookup.outputs.run_url }}
          RUN_STATUS: ${{ steps.lookup.outputs.status }}
          RUN_CONCLUSION: ${{ steps.lookup.outputs.conclusion }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const fs = require('node:fs');
            const lines = ['Staging release verdict status report.', '', `- Target SHA: \`${process.env.TARGET_SHA}\``];
            if (process.env.FOUND !== 'true') {
              lines.push(
                '- Exact staging verdict artifact found: `false`',
                '- RELEASE_READY: `false`',
                '- Verdict: `배포 성공 여부와 무관하게 전체 검증 결과가 없어 운영 배포 불가`',
              );
            } else {
              const verdict = JSON.parse(fs.readFileSync('staging-verdict/staging-verdict.json', 'utf8'));
              lines.push(
                `- Run ID: \`${process.env.RUN_ID}\``,
                `- Run: [Open GitHub Actions run](${process.env.RUN_URL})`,
                `- Status: \`${process.env.RUN_STATUS}\``,
                `- Conclusion: \`${process.env.RUN_CONCLUSION}\``,
                `- Deployed SHA: \`${verdict.deployed_sha}\``,
                `- Total: \`${verdict.total}\``,
                `- Passed: \`${verdict.passed}\``,
                `- Failed: \`${verdict.failed}\``,
                `- Skipped: \`${verdict.skipped}\``,
                `- Console errors: \`${verdict.console_errors}\``,
                `- Unexpected HTTP errors: \`${verdict.unexpected_http_errors}\``,
                `- PM2: \`${verdict.pm2_status}\``,
                `- Restart count: \`${verdict.restart_count}\``,
                `- RELEASE_READY: \`${verdict.release_ready}\``,
                `- Verdict: \`${verdict.verdict}\``,
              );
            }
            lines.push(
              '- Production deployment executed: `false`',
              '- Production database changed: `false`',
              `- Source status comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              '',
              'This command is read-only. It does not dispatch, rerun, approve, cancel, or modify a workflow.',
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: lines.join('\n'),
            });
