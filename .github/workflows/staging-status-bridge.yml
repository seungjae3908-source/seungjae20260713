name: Staging Status Bridge

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/staging-status-bridge.yml
      - api-server/scripts/verify-phase10-staging-status-bridge.mjs
      - docs/staging-status-bridge.md

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-status-bridge-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging status bridge safeguards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node api-server/scripts/verify-phase10-staging-status-bridge.mjs

  status:
    name: Report owner-requested staging readiness status
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse exact owner status command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -Eeuo pipefail
          [[ "$ISSUE_NUMBER" == "23" ]] || { echo 'Unauthorized control issue.' >&2; exit 1; }
          [[ "$ISSUE_TITLE" == "Staging Readiness Control" ]] || { echo 'Unexpected control issue title.' >&2; exit 1; }
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || { echo 'Only the repository owner may query staging.' >&2; exit 1; }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || { echo 'Comment author is not the repository owner.' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/status-staging ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /status-staging <40-character-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\n`);
          NODE

      - name: Require the exact current main revision
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Normalized 40-character SHA required.' >&2; exit 1; }
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "Status query SHA must equal current main: $MAIN_SHA" >&2
            exit 1
          }

      - name: Read latest matching staging workflow run and jobs
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const workflowId = 'staging-readiness.yml';
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            });
            if (workflow.data.state !== 'active') {
              core.setFailed(`Workflow ${workflowId} is not active.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              event: 'workflow_dispatch',
              branch: 'main',
              per_page: 100,
            });
            const matchingRuns = runs
              .filter((run) => run.event === 'workflow_dispatch' && run.head_sha === targetSha)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            const run = matchingRuns[0];
            if (!run) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.CONTROL_ISSUE),
                body: [
                  'No matching staging readiness run was found.',
                  '',
                  `- Target SHA: \`${targetSha}\``,
                  '- Required event: `workflow_dispatch`',
                  '- Required branch: `main`',
                  '- Production deployment executed: `false`',
                  `- Source status comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                ].join('\n'),
              });
              core.setFailed('No matching Staging Readiness workflow_dispatch run exists for the current main SHA.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const runUrl = run.html_url;
            const jobLines = jobs.length
              ? jobs.map((job) => `- ${job.name}: \`${job.status}\` / \`${job.conclusion ?? 'pending'}\``)
              : ['- No jobs are visible yet.'];
            const verdict = run.status === 'completed'
              ? (run.conclusion === 'success' ? '스테이징 검증 성공' : '스테이징 검증 실패 또는 중단')
              : '스테이징 검증 진행 중';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.CONTROL_ISSUE),
              body: [
                'Staging readiness status report.',
                '',
                `- Target SHA: \`${targetSha}\``,
                `- Run ID: \`${run.id}\``,
                `- Run: [Open GitHub Actions run](${runUrl})`,
                `- Status: \`${run.status}\``,
                `- Conclusion: \`${run.conclusion ?? 'pending'}\``,
                `- Verdict: \`${verdict}\``,
                '- Production deployment executed: `false`',
                '- Production database changed: `false`',
                `- Source status comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                '',
                'Jobs:',
                ...jobLines,
                '',
                'This command is read-only. It does not dispatch, rerun, approve, cancel, or modify a workflow.',
              ].join('\n'),
            });
