name: Prediction Lab Live Smoke

on:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - .github/workflows/prediction-lab-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prediction-lab-live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bitget-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate standalone lab
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Collect BTCUSDT futures 15m one-day sample
        working-directory: market-prediction-lab
        run: >-
          node scripts/collect-bitget.js
          --market CRYPTO_FUTURES
          --symbol BTCUSDT
          --timeframe 15m
          --days 1
          --output live-smoke-data

      - name: Verify live collection quality
        working-directory: market-prediction-lab
        run: >-
          node scripts/verify-live-collection.js
          --input live-smoke-data/crypto_futures/BTCUSDT/candles-15m.json
          --min-candles 90
          --report live-smoke-data/quality-report.json

      - name: Display quality report
        if: always()
        working-directory: market-prediction-lab
        run: |
          test ! -f live-smoke-data/quality-report.json || cat live-smoke-data/quality-report.json

      - name: Upload isolated live-smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-bitget-live-smoke-${{ github.run_id }}
          path: market-prediction-lab/live-smoke-data
          if-no-files-found: warn
          retention-days: 7
