name: Telegram Code-Only Production Deploy (no DB migrations or proof sends)

on:
  pull_request:
    paths:
      - .github/workflows/telegram-production-code-only-deploy.yml
      - .github/tests/telegram-production-code-only-deploy.test.mjs
      - ops/telegram-production-code-only-scope.mjs
      - docs/telegram-production-code-only-deploy.md
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    name: Validate Telegram code-only deployment and scope guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/tests/telegram-production-code-only-deploy.test.mjs

  protected-telegram-code-only:
    name: Owner-protected Telegram code-only production deploy and read-only checks
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-telegram-code-only-production ')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    concurrency:
      group: stock-app-production-live
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      statuses: read
    env:
      TARGET_SHA: ''
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact owner-only SHA
        id: target
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const match=/^\/run-telegram-code-only-production ([0-9a-f]{40})$/u.exec(
            String(process.env.BODY || '').trim());
          if(!match) throw Error('TELEGRAM_CODE_ONLY_EXACT_SHA_REQUIRED');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+match[1]+'\n');
          NODE

      - name: Require only the immutably pinned Telegram ancestor with full-CI provenance
        id: provenance
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const {evaluatePostMergeStatusProvenance,inspectPostMergeStatusEvidence}
              =require(process.env.GITHUB_WORKSPACE+'/api-server/scripts/release-candidate-provenance.cjs');
            const target=process.env.EXPECTED_SHA;
            const main=(await github.rest.repos.getBranch({
              owner:context.repo.owner,repo:context.repo.repo,branch:'main',
            })).data.commit.sha;
            const telegramTarget='ceade3d9fb4cbb4bfcea42d548233aec79653e92';
            const interveningAuto='67c198a8358e22626495d7c7a5b239e9a40e7c0a';
            if(target!==telegramTarget){
              core.setFailed('TELEGRAM_RELEASE_TARGET_NOT_APPROVED_IMMUTABLE_SOURCE');return;
            }
            const [autoPR,workflowPR,autoCommit,operatorCommit]=await Promise.all([
              github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:1826}),
              github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:1828}),
              github.rest.git.getCommit({owner:context.repo.owner,repo:context.repo.repo,commit_sha:interveningAuto}),
              github.rest.git.getCommit({owner:context.repo.owner,repo:context.repo.repo,commit_sha:main}),
            ]);
            if(autoPR.data.merged!==true||autoPR.data.merge_commit_sha!==interveningAuto
              ||workflowPR.data.merged!==true||workflowPR.data.merge_commit_sha!==main
              ||autoCommit.data.parents?.length!==1
              ||autoCommit.data.parents[0].sha!==target
              ||operatorCommit.data.parents?.length!==1
              ||operatorCommit.data.parents[0].sha!==interveningAuto){
              core.setFailed('TELEGRAM_PINNED_ANCESTOR_RELEASE_LINEAGE_CHANGED');return;
            }
            // Main is the exact workflow squash commit after one known auto change.
            // Deploy source stays at the older Telegram-only verified commit.
            core.setOutput('operator_sha',main);
            const statuses=await github.paginate(github.rest.repos.listCommitStatusesForRef,{
              owner:context.repo.owner,repo:context.repo.repo,ref:target,per_page:100,
            });
            const evidence=inspectPostMergeStatusEvidence(statuses);
            if(!evidence.ok){core.setFailed('TELEGRAM_POSTMERGE_PROVENANCE_MISSING');return;}
            const run=(await github.rest.actions.getWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:evidence.runId,
            })).data;
            const verified=evaluatePostMergeStatusProvenance({
              targetSha:target,currentMainSha:target,statuses,run,
            });
            if(!verified.ok)core.setFailed('TELEGRAM_POSTMERGE_PROVENANCE_REJECTED');

      - name: Require exact-main successful PostgreSQL auth and Staging verdict
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const sha=process.env.EXPECTED_SHA;
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,
              head_sha:sha,branch:'main',per_page:100,
            });
            const pairs=[
              {name:'Staging PostgreSQL Auth Gate',event:'issue_comment',
                path:'.github/workflows/staging-postgres-auth-gate.yml',
                artifact:'staging-postgres-auth-'+sha},
              {name:'Staging Readiness',event:'workflow_dispatch',
                path:'.github/workflows/staging-readiness.yml',
                artifact:'staging-verdict-'+sha},
            ];
            for(const item of pairs){
              const matching=runs.filter(run=>run.name===item.name
                && run.event===item.event && run.path===item.path
                && run.head_sha===sha && run.head_branch==='main'
                && run.status==='completed' && run.conclusion==='success');
              let evidence=false;
              for(const run of matching){
                const response=await github.rest.actions.listWorkflowRunArtifacts({
                  owner:context.repo.owner,repo:context.repo.repo,run_id:run.id,per_page:100,
                });
                if((response.data.artifacts||[]).some(a=>a.name===item.artifact
                  && a.expired!==true && a.workflow_run?.head_sha===sha)){
                  evidence=true;break;
                }
              }
              if(!evidence){core.setFailed('TELEGRAM_EXACT_STAGING_EVIDENCE_MISSING:'+item.name);return;}
            }

      # Staging Readiness alone cannot prove Telegram IPv4/TLS stability.
      - name: Block release without two recent Staging Telegram network successes
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const sha=process.env.EXPECTED_SHA;
            const response=await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:'telegram-only-staging-qa.yml',
              branch:'main',event:'issue_comment',per_page:100,
            });
            const now=Date.now();
            const relevant=(response.data.workflow_runs||[])
              .filter(r=>r.head_sha===sha&&r.event==='issue_comment'
                &&r.conclusion!=='skipped')
              .sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
            const recent=relevant.filter(r=>Number.isFinite(Date.parse(r.created_at))
              &&now>=Date.parse(r.created_at)
              &&now-Date.parse(r.created_at)<=30*60_000);
            const green=recent.filter(r=>r.status==='completed'&&r.conclusion==='success');
            const stable=recent.length>=2&&green.length===recent.length
              &&now-Date.parse(green[0].created_at)<=10*60_000
              &&Date.parse(green[0].created_at)
                -Date.parse(green.at(-1).created_at)>=5*60_000;
            if(!stable){
              core.setFailed('TELEGRAM_PREDEPLOY_STAGING_TLS_NOT_STABLE');return;
            }
            core.info('TELEGRAM_PREDEPLOY_STAGING_NETWORK_PASS');

      - name: Require pinned Production SSH credentials and host identity
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read-only prior Production PM2 identity and zero-trading gates
        id: previous
        run: |
          set -Eeuo pipefail
          previous="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const rows=JSON.parse(execFileSync('pm2',['jlist'],{
            encoding:'utf8',timeout:10000,maxBuffer:20000000,
          }));
          const matched=Array.isArray(rows)?rows.filter(p=>p?.name==='stock-app'):[];
          if(matched.length!==1)throw Error('TELEGRAM_PM2_RUNTIME_NOT_UNIQUE');
          const env=matched[0].pm2_env||{};
          const sha=String(env.DEPLOY_SHA||'');
          const marker=fs.readFileSync('/opt/stock-app/.deploy/current-sha','utf8').trim();
          if(!/^[a-f0-9]{40}$/.test(sha)||marker!==sha||env.status!=='online'
            ||env.pm_cwd!=='/opt/stock-app'
            ||env.pm_exec_path!=='/opt/stock-app/api-server/dist/index.mjs')
            throw Error('TELEGRAM_PREDEPLOY_SHA_OR_PM2_MISMATCH');
          const tradingKeys=[
            'LIVE_TRADING','AUTO_TRADING','REAL_ORDER_ENABLED',
            'PRIVATE_TRADING_API_ALLOWED','ORDER_EXECUTION_ENABLED',
            'LIVE_TRADING_ACTIVATION_APPROVED','SPOT_LIVE_LIMITED_ACTIVATION_APPROVED',
            'LIVE_AUTOMATIC_TRADING_ENABLED','MEMBER_AUTO_TRADING_BACKGROUND_ENABLED',
            'MEMBER_AUTO_TRADING_LIVE_BACKGROUND_ENABLED',
            'MEMBER_AUTO_TRADING_PAPER_ONLY_ENABLED','FUTURES_LIVE_LIMITED_ACTIVATION_APPROVED',
            'BITGET_FUTURES_LIVE_ORDER_ENABLED','CRYPTO_AUTO_LEGACY_EXECUTION_ENABLED',
            'CRYPTO_AUTO_TRADE_ENABLED','BITGET_AUTO_TRADE_ENABLED','BITGET_LIVE_ORDER_ENABLED',
            'UPBIT_LIVE_ORDER_ENABLED','KIWOOM_LIVE_ORDER_ENABLED','TOSS_LIVE_ORDER_ENABLED',
          ];
          if(tradingKeys.some(k=>env[k]==='true')
            ||String(env.executionAuthority||'NONE').toUpperCase()!=='NONE')
            throw Error('TELEGRAM_PRODUCTION_TRADING_AUTHORITY_ACTIVE');
          if(env.LIVE_TELEGRAM_ACTIVATION_APPROVED!=='true'
            ||env.TELEGRAM_INTELLIGENCE_WORKER_ENABLED!=='true'
            ||env.PERSONAL_TELEGRAM_WORKER_ENABLED!=='true')
            throw Error('TELEGRAM_EXISTING_ACTIVATION_NOT_PROVEN');
          const roomKeys=[
            'TELEGRAM_KR_STOCK_CHAT_ID','TELEGRAM_US_STOCK_CHAT_ID',
            'TELEGRAM_CRYPTO_SPOT_CHAT_ID','TELEGRAM_CRYPTO_FUTURES_CHAT_ID',
            'TELEGRAM_PERSONAL_HOLDINGS_CHAT_ID','TELEGRAM_AUTO_TRADING_CHAT_ID',
          ];
          const ids=roomKeys.map(k=>String(env[k]||'').trim());
          if(ids.some(v=>!/^(-100)[0-9]{8,15}$/.test(v))
            ||new Set(ids).size!==6)throw Error('TELEGRAM_SIX_ROOM_ISOLATION_FAILED');
          console.log(sha);
          NODE
          REMOTE
          )"
          [[ "$previous" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$previous" >> "$GITHUB_OUTPUT"

      # Read-only, fail-closed V3 check before any Production mutation.
      - name: Block release on stale Signal V3 or public endpoint HTTP 503
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'node -' <<'NODE'
          const http=require('node:http');
          const {execFileSync}=require('node:child_process');
          const fail=()=>{throw Error('TELEGRAM_PREDEPLOY_SIGNAL_V3_NOT_READY');};
          const active=unit=>{
            try{
              const s=execFileSync('systemctl',[
                'show','--no-pager','--property=LoadState,ActiveState',unit
              ],{encoding:'utf8',timeout:3500,maxBuffer:4096,
                stdio:['ignore','pipe','pipe']});
              return /^LoadState=loaded$/mu.test(s)&&/^ActiveState=active$/mu.test(s);
            }catch{return false;}
          };
          const read=route=>new Promise((resolve,reject)=>{
            const req=http.get('http://127.0.0.1:8790'+route,{timeout:5000},res=>{
              if(res.statusCode!==200){res.resume();reject(Error('HTTP_NOT_READY'));return;}
              const chunks=[];let size=0;
              res.on('data',c=>{
                size+=c.length;if(size>1_048_576){req.destroy(Error('TOO_LARGE'));return;}
                chunks.push(c);
              });
              res.on('error',()=>reject(Error('READ_ERROR')));
              res.on('end',()=>{
                try{resolve(JSON.parse(Buffer.concat(chunks).toString('utf8')));}
                catch{reject(Error('JSON_INVALID'));}
              });
            });
            req.on('timeout',()=>req.destroy(Error('TIMEOUT')));
            req.on('error',()=>reject(Error('UNREACHABLE')));
          });
          (async()=>{
            if(!active('investment-signal-intelligence-v3.service')
              ||!active('investment-signal-intelligence-v3-cycle.timer'))fail();
            const health=await read('/health');
            if(health.ok!==true||health.service!=='signal-intelligence-v3'
              ||health.executionAuthority!=='NONE'
              ||health.privateTradingApiAllowed!==false||health.realOrderAllowed!==false
              ||health.snapshotReady!==true||health.snapshotFresh!==true
              ||!Number.isFinite(health.snapshotAgeMs)
              ||health.snapshotAgeMs<0||health.snapshotAgeMs>900000
              ||!/^[a-f0-9]{40}$/u.test(String(health.serviceSha||'')))fail();
            const result=await read('/v1/signals');
            if(result.ok!==true||result.serviceSha!==health.serviceSha
              ||result.executionAuthority!=='NONE'
              ||result.snapshot?.safety?.executionAuthority!=='NONE'
              ||result.snapshot?.safety?.privateTradingApiAllowed!==false
              ||result.snapshot?.safety?.realOrderAllowed!==false
              ||!Array.isArray(result.snapshot.events))fail();
            console.log('TELEGRAM_PREDEPLOY_SIGNAL_V3_FRESH_PASS');
          })().catch(()=>{
            console.error('TELEGRAM_PREDEPLOY_SIGNAL_V3_NOT_READY');
            process.exitCode=1;
          });
          NODE

      - name: Reject unrelated files between actual Production and exact main
        uses: actions/github-script@v7
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          OPERATOR_SHA: ${{ steps.provenance.outputs.operator_sha }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const module=await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE+'/ops/telegram-production-code-only-scope.mjs').href);
            const response=await github.rest.repos.compareCommits({
              owner:context.repo.owner,repo:context.repo.repo,
              base:process.env.PREVIOUS_SHA,head:process.env.EXPECTED_SHA,per_page:100,
            });
            const verdict=module.classifyTelegramCodeOnlyDiff(response.data,{pinnedAncestor:true});
            if(!verdict.ok){core.setFailed(verdict.code);return;}
            const pinnedFiles={
              '.github/tests/telegram-production-worker-readonly-audit.test.mjs':'d440d93a9ed7a9266bcab87f3d84452c3f18f40d',
              '.github/workflows/telegram-production-worker-readonly-audit.yml':'219366275a24432ed0bd4c89cb8dabbad5464495',
              'api-server/src/features/user-broker-telegram/user-broker-telegram.service.test.ts':'19a6484b6d9c91f10bfd07399ae5c1b8ed5cfb95',
              'api-server/src/index.ts':'fad14b9f927253a359cb188d3781c1969e43f4db',
              'api-server/src/services/signal-intelligence-telegram-subscriber.service.test.ts':'b2279358358f5cb9364846939e5e620732f16f16',
              'api-server/src/services/signal-intelligence-telegram-subscriber.service.ts':'d8a54df4e7b1c1a8c4aad811ce61389017ac411b',
              'api-server/src/services/telegram-intelligence-worker.service.ts':'2e35e8ab95912975475587afeef240c251170425',
              'api-server/src/services/telegram-notification.service.test.ts':'e2b7250649ae5cc5deaf1e0500d93f5d9d0d0f1f',
              'docs/telegram-production-worker-readonly-audit.md':'9958f8c214c5bfebf6fa1127c24cd19f0de14d16',
              'ops/telegram-production-worker-readonly-audit.mjs':'9fbb173a41b15c561c34388e1c8b9d014163e2ea',
              'ops/deploy-production.sh':'d21093e3db372b0266aabbc2b0837e6e1c3eaa12',
            };
            for(const [path,sha] of Object.entries(pinnedFiles)){
              const result=await github.rest.repos.getContent({
                owner:context.repo.owner,repo:context.repo.repo,
                path,ref:path==='ops/deploy-production.sh'
                  ?process.env.OPERATOR_SHA:process.env.EXPECTED_SHA,
              });
              if(Array.isArray(result.data)||result.data?.sha!==sha){
                core.setFailed('TELEGRAM_PINNED_RELEASE_SOURCE_CHANGED');return;
              }
            }
            core.info('TELEGRAM_CODE_ONLY_SOURCE_SCOPE_PASS; files='+verdict.changedFileCount);

      - name: Revalidate immutable main immediately before Production mutation
        uses: actions/github-script@v7
        env:
          OPERATOR_SHA: ${{ steps.provenance.outputs.operator_sha }}
        with:
          script: |
            const main=(await github.rest.repos.getBranch({
              owner:context.repo.owner,repo:context.repo.repo,branch:'main',
            })).data.commit.sha;
            if(main!==process.env.OPERATOR_SHA)
              core.setFailed('TELEGRAM_RELEASE_OPERATOR_MAIN_MOVED_AT_DEPLOY_BOUNDARY');

      - name: Deploy exact code using existing canary, PM2 and rollback script
        env:
          APPROVED_SHA: ${{ steps.target.outputs.sha }}
          EXPECTED_PRE_SHA: ${{ steps.previous.outputs.sha }}
          OPERATOR_SHA: ${{ steps.provenance.outputs.operator_sha }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q PREVIOUS_SHA=%q OPERATOR_SHA=%q' "$APPROVED_SHA" "$REPOSITORY_URL" "$EXPECTED_PRE_SHA" "$OPERATOR_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          LIVE_DIR=/opt/stock-app
          SOURCE_DIR="$(mktemp -d /tmp/stock-app-telegram-only.XXXXXX)"
          trap 'rm -rf -- "$SOURCE_DIR"' EXIT
          node <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const prev=process.env.PREVIOUS_SHA;
          const marker=fs.readFileSync('/opt/stock-app/.deploy/current-sha','utf8').trim();
          const rows=JSON.parse(execFileSync('pm2',['jlist'],{
            encoding:'utf8',timeout:10000,maxBuffer:20000000,
          })).filter(x=>x.name==='stock-app');
          if(!/^[0-9a-f]{40}$/.test(prev)||marker!==prev||rows.length!==1
            ||rows[0].pm2_env?.DEPLOY_SHA!==prev||rows[0].pm2_env?.status!=='online')
            throw Error('TELEGRAM_PREDEPLOY_RUNTIME_MOVED');
          NODE
          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          resolved="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})"
          [[ "$resolved" == "$TARGET_SHA" ]]
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"
          test -f "$SOURCE_DIR/ops/deploy-production.sh"
          test -f "$SOURCE_DIR/ops/production-verification-diagnostics.sh"
          # This pinned operator script disables canary-only background workers;
          # archived application bytes come exclusively from the older TARGET_SHA.
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$OPERATOR_SHA"
          operator_blob="$(git -C "$SOURCE_DIR" rev-parse "$OPERATOR_SHA:ops/deploy-production.sh")"
          [[ "$operator_blob" == "d21093e3db372b0266aabbc2b0837e6e1c3eaa12" ]] || exit 1
          git -C "$SOURCE_DIR" show "$OPERATOR_SHA:ops/deploy-production.sh" > "$SOURCE_DIR/ops/deploy-telegram-operator.sh"
          chmod 700 "$SOURCE_DIR/ops/deploy-telegram-operator.sh"
          BASH_ENV="$SOURCE_DIR/ops/production-verification-diagnostics.sh" \
            SOURCE_DIR="$SOURCE_DIR" LIVE_DIR="$LIVE_DIR" PM2_NAME=stock-app LIVE_PORT=8080 \
            CANARY_PORT=18081 DATA_PROBE_PATH=/api/healthz/data-plane \
            PUBLIC_BASE_URL=https://lsj119.com \
            bash "$SOURCE_DIR/ops/deploy-telegram-operator.sh" "$TARGET_SHA"
          REMOTE

      - name: Read back exact Production application and worker health, no message send
        env:
          APPROVED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'EXPECTED_SHA=%q' "$APPROVED_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env node -" <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const http=require('node:http');
          const expected=process.env.EXPECTED_SHA;
          const states=JSON.parse(execFileSync('pm2',['jlist'],{
            encoding:'utf8',timeout:10000,maxBuffer:20000000,
          })).filter(x=>x.name==='stock-app');
          if(states.length!==1||states[0].pm2_env?.status!=='online'
            ||states[0].pm2_env?.DEPLOY_SHA!==expected)
            throw Error('TELEGRAM_POSTDEPLOY_RUNTIME_MISMATCH');
          const marker=fs.readFileSync('/opt/stock-app/.deploy/current-sha','utf8').trim();
          if(marker!==expected)throw Error('TELEGRAM_POSTDEPLOY_MARKER_MISMATCH');
          const req=http.get('http://127.0.0.1:8080/api/health',{timeout:5000},res=>{
            let text='';res.on('data',c=>{text+=c;if(text.length>131072)res.destroy();});
            res.on('end',()=>{
              let obj;try{obj=JSON.parse(text);}catch{throw Error('TELEGRAM_HEALTH_INVALID');}
              if(res.statusCode!==200||obj?.ok!==true
                ||obj.processDeploySha!==expected||obj.deployMarkerSha!==expected
                ||obj.identityMatch!==true
                ||obj.telegramIntelligenceWorker?.state!=='RUNNING')
                throw Error('TELEGRAM_POSTDEPLOY_WORKER_NOT_RUNNING');
              console.log('TELEGRAM_CODE_ONLY_DEPLOY_READBACK_OK; no Bot API proof send');
            });
          });
          req.on('error',()=>{process.exitCode=1;});
          req.on('timeout',()=>req.destroy());
          NODE

      - name: Record sanitized code-only deployment evidence
        if: ${{ success() }}
        uses: actions/github-script@v7
        env:
          APPROVED_SHA: ${{ steps.target.outputs.sha }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:1555,
              body:[
                'TELEGRAM CODE-ONLY PRODUCTION DEPLOY — APP CODE APPLIED',
                '- Source SHA: '+process.env.PREVIOUS_SHA,
                '- Exact new PM2/main SHA: '+process.env.APPROVED_SHA,
                '- Existing deployment canary and rollback: passed',
                '- No Production SQL migration, Bot API test send or webhook change by this workflow.',
                '- No trading gate elevation or new order action.',
                '- Telegram runtime health: RUNNING; actual user receipt NOT verified.',
                '- Separate approved /run-telegram-worker-readonly is needed for persisted ledgers and V3 freshness.',
                '- GitHub Run: '+context.runId,
              ].join('\n'),
            });
