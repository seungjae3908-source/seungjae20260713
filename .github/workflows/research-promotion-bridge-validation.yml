name: Research Promotion Bridge Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research-dashboard/server.mjs'
      - 'research-dashboard/server.py'
      - 'research-dashboard/test/dashboard.test.mjs'
      - 'research-dashboard/test/test_server.py'
      - 'api-server/src/services/strategy-promotion-research-bridge.service.ts'
      - 'api-server/src/services/strategy-promotion-research-bridge.service.test.ts'
      - 'api-server/src/services/research-adoption-review-gate.service.ts'
      - 'api-server/src/services/research-adoption-review-gate.service.test.ts'
      - 'api-server/src/services/research-center-readonly-contract.service.test.ts'
      - 'api-server/src/routes/strategy-promotion.ts'
      - 'stock-analyzer/src/lib/strategy-promotion.ts'
      - 'stock-analyzer/src/pages/strategy-promotion.tsx'
      - '.github/workflows/research-promotion-bridge-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable PR HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend typecheck
        run: pnpm --dir api-server run typecheck

      - name: Bundle focused API tests
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server exec esbuild \
            src/services/strategy-promotion-research-bridge.service.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile="$RUNNER_TEMP/strategy-promotion-bridge.test.mjs"
          pnpm --dir api-server exec esbuild \
            src/services/research-adoption-review-gate.service.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile="$RUNNER_TEMP/research-adoption-review.test.mjs"
          pnpm --dir api-server exec esbuild \
            src/services/research-center-readonly-contract.service.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile="$RUNNER_TEMP/research-center-readonly-contract.test.mjs"

      - name: Run focused API tests
        run: |
          set -Eeuo pipefail
          node --test \
            "$RUNNER_TEMP/strategy-promotion-bridge.test.mjs" \
            "$RUNNER_TEMP/research-adoption-review.test.mjs" \
            "$RUNNER_TEMP/research-center-readonly-contract.test.mjs"

      - name: Verify fail-closed bridge authority
        shell: bash
        run: |
          set -Eeuo pipefail
          bridge='api-server/src/services/strategy-promotion-research-bridge.service.ts'
          adoption='api-server/src/services/research-adoption-review-gate.service.ts'
          route='api-server/src/routes/strategy-promotion.ts'
          grep -Fq "automaticAdoptionAllowed: false" "$bridge"
          grep -Fq "paperHandoffAllowed: false" "$bridge"
          grep -Fq "scannerMutationAllowed: false" "$bridge"
          grep -Fq "liveTradingAllowed: false" "$bridge"
          grep -Fq "privateTradingApiAllowed: false" "$bridge"
          grep -Fq "orderAllowed: false" "$bridge"
          grep -Fq "executionAuthority: 'NONE'" "$bridge"
          grep -Fq "TRAIN_DIAGNOSTIC_ONLY" "$bridge"
          grep -Fq "RESEARCH_CODE_SHA_NOT_CURRENT" "$bridge"
          grep -Fq "SCANNER_PROFILE_IDENTITY_UNMAPPED" "$bridge"
          grep -Fq "requireAdmin" "$route"
          ! grep -E "submitOrder|placeOrder|cancelOrder|amendOrder|withdraw|transfer" "$bridge"
          grep -Fq "canonicalOwner: '#547'" "$adoption"
          grep -Fq "CROSS_CANDIDATE_EVIDENCE_TRANSFER_FORBIDDEN" "$adoption"
          grep -Fq "automaticAdoptionAllowed: false" "$adoption"
          grep -Fq "humanReviewRequired: true" "$adoption"
          grep -Fq "scannerMutationAllowed: false" "$adoption"
          grep -Fq "paperHandoffAllowed: false" "$adoption"
          grep -Fq "executionAuthority: 'NONE'" "$adoption"
          grep -Fq "research-adoption-review" "$route"
          ! grep -E "submitOrder|placeOrder|cancelOrder|amendOrder|withdraw|transfer" "$adoption"

      - name: Verify Dashboard parity source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "promotionIdentity" research-dashboard/server.mjs
          grep -Fq "promotionIdentity" research-dashboard/server.py
          grep -Fq "promotionIdentity" research-dashboard/test/dashboard.test.mjs
          grep -Fq "promotionIdentity" research-dashboard/test/test_server.py

      - name: Verify Promotion Center read-only bridge presentation
        shell: bash
        run: |
          set -Eeuo pipefail
          client='stock-analyzer/src/lib/strategy-promotion.ts'
          page='stock-analyzer/src/pages/strategy-promotion.tsx'
          grep -Fq "/api/strategy-promotion/research-bridge" "$client"
          grep -Fq "RESEARCH_PROMOTION_BRIDGE_AUTHORITY_INVALID" "$client"
          grep -Fq "Research → 전략 승격 연결" "$page"
          grep -Fq "자동채택 없음 · Paper 전달 없음 · Scanner 변경 없음 · 실행 권한 NONE" "$page"
          grep -Fq "/api/strategy-promotion/research-adoption-review" "$client"
          grep -Fq "RESEARCH_ADOPTION_REVIEW_AUTHORITY_INVALID" "$client"
          grep -Fq "#547 통계·경제적 채택 검토 Gate" "$page"
          grep -Fq "자동채택 없음 · 사람 검토 필수 · Scanner/Paper 변경 없음 · 실행 권한 NONE" "$page"
          ! grep -E "submitOrder|placeOrder|cancelOrder|amendOrder|withdraw|transfer" "$client" "$page"
