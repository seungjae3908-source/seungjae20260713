name: Prediction Lab Final Validation

on:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - .github/workflows/prediction-lab-final-validate.yml

permissions:
  contents: write

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feature/prediction-lab-standalone

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run full standalone validation
        id: validation
        continue-on-error: true
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Write validation result
        if: always()
        working-directory: market-prediction-lab
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          mkdir -p docs
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const pass = process.env.VALIDATION_OUTCOME === 'success';
          const result = {
            schemaVersion: 1,
            status: pass ? 'pass' : 'fail',
            validatedAt: Date.now(),
            source: 'github-actions-isolated-final-validation',
            nodeVersion: process.version,
            command: 'npm run validate',
            includes: ['syntax', 'unit', 'compatibility', 'smoke', 'stress', 'fuzz'],
          };
          await writeFile('docs/final-validation.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Commit validation result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-prediction-lab/docs/final-validation.json
          git diff --cached --quiet && exit 0
          git commit -m "test: record final standalone validation"
          git push origin HEAD:feature/prediction-lab-standalone

      - name: Fail when validation failed
        if: always() && steps.validation.outcome != 'success'
        run: exit 1
