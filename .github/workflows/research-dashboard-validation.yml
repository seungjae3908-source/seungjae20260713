name: Research Dashboard Validation

on:
  pull_request:
    paths:
      - 'research-dashboard/**'
      - '.github/workflows/research-dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DASHBOARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DASHBOARD_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact validation head
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DASHBOARD_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DASHBOARD_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and unit tests
        working-directory: research-dashboard
        run: |
          npm run check
          npm test
          python3 -m py_compile server.py video_research_readback.py lightweight_market_watch_readback.py lightweight_market_watch_cadence_readback.py
          python3 test/test_server.py
          python3 test/test_video_research_readback.py
          # Previously omitted from CI: exact Research release identity,
          # stale/malformed market states and file-safety tests.
          python3 test/test_lightweight_market_watch_readback.py
          # 24h cadence raw JSONL identity, anti-forgery and private-file tests.
          python3 test/test_lightweight_market_watch_cadence_readback.py
      - name: Validate exact Python server startup and read-only aggregation
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          pid=''
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" >/dev/null 2>&1 || true; fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          state="$tmp/state"
          mkdir -p "$state/latest" "$state/forward/paper/status" "$state/forward/paper/state"
          cat >"$state/latest/forward.json" <<'JSON'
          {
            "status": "complete",
            "cycleId": "fixture-forward",
            "researchSha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "generatedAt": 1787010000000,
            "taskCount": 2,
            "successCount": 2,
            "blockedDataCount": 0,
            "failedCount": 0,
            "results": [
              {"id":"paper-forward","status":"success","durationMs":1200},
              {"id":"shadow-forward","status":"success","durationMs":800}
            ]
          }
          JSON
          cat >"$state/forward/paper/status/runtime-status.json" <<'JSON'
          {
            "status":"COMPLETED",
            "cycleId":"fixture-paper",
            "scheduleActive":true,
            "allProvidersReady":true,
            "publicForwardEvidenceAccumulating":true,
            "paperTradeOutcomeAccumulating":true,
            "privateRequestCount":0,
            "financialMutationCount":0,
            "orderCount":0,
            "liveTrading":false,
            "orderAuthority":false,
            "lanes":[{"market":"KR","status":"READY"},{"market":"US","status":"READY"}]
          }
          JSON
          cat >"$state/forward/paper/state/recurring-paper-loop.json" <<'JSON'
          {"cycles":[{"id":"1"}],"samples":[],"positions":[{"id":"p1"},{"id":"p2"}],"settlements":[{"id":"s1"}]}
          JSON
          cat >"$state/forward/shadow-state.json" <<'JSON'
          {"groups":{"fixture":{"records":[{"status":"settled"},{"status":"pending"}]}}}
          JSON
          mkdir -p "$state/video-research/current" "$state/video-research" "$state/ai-review"
          cat >"$state/video-research/current/video-research-public-provider-runtime-v3.json" <<'JSON'
          {
            "runtimeVersion":"video-research-public-provider-runtime-v3","status":"SUCCESS","provider":"YOUTUBE_DATA_API_V3",
            "providerAccess":"OFFICIAL_PUBLIC_API","requestMode":"READ_ONLY_GET","query":"fixture research","pagesUsed":1,
            "quotaState":"UNKNOWN","credentialConfigured":true,"credentialValueExposed":false,"sourceCount":0,"records":[],
            "safety":{"researchOnly":true,"economicEvidenceCredit":0,"profitabilityCredit":0,"executionAuthority":"NONE",
              "paidProviderEnabled":false,"scheduleActive":false,"automaticDiscoveryEnabled":false,"liveTrading":false,
              "privateTradingApi":false,"realOrderEnabled":false,"credentialMutation":false,"transcriptDownloadEnabled":false},
            "snapshotProvenance":{"schemaVersion":"video-research-sanitized-snapshot-v1","sourceHeadSha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              "observedAt":"2026-10-02T03:00:00.000Z","publisherMode":"LOCAL_ATOMIC_FILE",
              "providerRuntimeVersion":"video-research-public-provider-runtime-v3","economicEvidenceCredit":0,"profitabilityCredit":0,
              "executionAuthority":"NONE"}
          }
          JSON
          cat >"$state/video-research/latest.json" <<'JSON'
          {
            "schemaVersion":"research-video-discovery-scan-v1","status":"COMPLETE","observedAt":"2026-10-02T03:00:00.000Z",
            "researchSha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","provider":"YOUTUBE_DATA_API_V3","query":"fixture research",
            "sourceCount":0,"snapshotDigest":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
            "providerNetworkCalls":1,"invocationMode":"SYSTEMD_TIMER","scheduledInvocationObserved":false,"reason":null,
            "nextRequiredStep":"SOURCE_REVIEW_THEN_EXISTING_GEMINI_GROQ_ORCHESTRATOR",
            "safety":{"researchOnly":true,"metadataDiscoveryOnly":true,"transcriptDownloadEnabled":false,"automaticGeminiExecution":false,
              "automaticGroqExecution":false,"automaticAdoption":false,"paidFallback":false,"economicEvidenceCredit":0,
              "profitabilityCredit":0,"executionAuthority":"NONE","liveTrading":false,"privateTradingApiAllowed":false,"realOrderEnabled":false}
          }
          JSON
          cat >"$state/ai-review/latest.json" <<'JSON'
          {
            "schemaVersion":"research-production-ai-scan-v1","status":"NO_NEW_EVIDENCE","observedAt":1790910030000,
            "researchSha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","provider":"groq","model":"openai/gpt-oss-20b",
            "reason":"CONFIGURED_FREE_ONLY_QUOTA_UNKNOWN","providerNetworkCalls":0,"cacheHits":0,"reviews":[],
            "missingProfiles":[],"blockedProfiles":[],"deferredProfiles":[],"invocationMode":"SYSTEMD_TIMER","scheduledInvocationObserved":false,
            "evidenceCredit":0,"profitabilityProven":false,"champion":null,
            "safety":{"researchProposalOnly":true,"paidFallback":false,"executionAuthority":"NONE","numericPerformanceAuthority":false,
              "promotionAuthority":false,"championAuthority":false,"finalHoldoutOpened":false,"orderAllowed":false,"liveTrading":false,
              "privateTradingApiAllowed":false,"evidenceCredit":0}
          }
          JSON

          RESEARCH_DASHBOARD_HOST=127.0.0.1 \
          RESEARCH_DASHBOARD_PORT=18091 \
          RESEARCH_STATE_ROOT="$state" \
            python3 research-dashboard/server.py >"$tmp/server.log" 2>&1 &
          pid=$!
          ready=false
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18091/api/health >"$tmp/health.json"; then
              ready=true
              break
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat "$tmp/server.log" >&2
              exit 1
            fi
            sleep 0.25
          done
          [[ "$ready" == true ]]
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18091/api/research/overview >"$tmp/overview.json"
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18091/api/research/video/evidence >"$tmp/video.json"
          python3 - "$tmp/health.json" "$tmp/overview.json" "$tmp/video.json" <<'PY'
          import json, sys
          health = json.load(open(sys.argv[1], encoding='utf-8'))
          overview = json.load(open(sys.argv[2], encoding='utf-8'))
          video = json.load(open(sys.argv[3], encoding='utf-8'))
          assert health['ok'] is True
          assert health['service'] == 'investment-research-dashboard'
          assert health['readOnly'] is True
          assert health['liveTrading'] is False
          assert health['privateApi'] is False
          assert health['orderAuthority'] is False
          assert overview['schemaVersion'] == 'research-dashboard-overview-v1'
          assert overview['safety']['readOnlyDashboard'] is True
          assert overview['safety']['forbiddenAuthorityObserved'] is False
          assert overview['paper']['ledger']['cycleCount'] == 1
          assert overview['paper']['ledger']['sampleCount'] == 0
          assert overview['paper']['ledger']['positionCount'] == 2
          assert overview['paper']['ledger']['settlementCount'] == 1
          assert overview['shadow']['records']['totalRecords'] == 2
          assert overview['shadow']['records']['settledRecords'] == 1
          assert overview['shadow']['records']['pendingRecords'] == 1
          assert overview['profitability']['proven'] is False
          assert video['ok'] is True
          assert video['available'] is True
          assert video['dataState'] == 'MEASURED'
          assert video['sourceCount'] == 0
          assert video['automation']['invocationMode'] == 'SYSTEMD_TIMER'
          assert video['automation']['scheduledInvocationObserved'] is False
          assert video['aiReview']['status'] == 'NO_NEW_EVIDENCE'
          assert video['aiReview']['scheduledInvocationObserved'] is False
          assert video['economicEvidenceCredit'] == 0
          assert video['profitabilityCredit'] == 0
          assert video['executionAuthority'] == 'NONE'
          PY
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:18091/api/research/overview)"
          [[ "$code" == 405 ]]
      - name: Validate systemd sandbox and fail-closed diagnostics contract
        run: |
          set -Eeuo pipefail
          unit='research-dashboard/deploy/research-dashboard.service'
          activate='research-dashboard/deploy/activate-server.sh'

          grep -q 'User=investment-research' "$unit"
          grep -q 'RESEARCH_DASHBOARD_HOST=127.0.0.1' "$unit"
          grep -q 'WorkingDirectory=/opt/investment-research-dashboard/current/research-dashboard' "$unit"
          grep -Fq 'ExecStart=/usr/bin/env python3 /opt/investment-research-dashboard/current/research-dashboard/server.py' "$unit"
          grep -q 'ProtectSystem=strict' "$unit"
          grep -q '^CapabilityBoundingSet=$' "$unit"
          grep -q '^AmbientCapabilities=$' "$unit"
          grep -q '^UMask=0077$' "$unit"
          grep -q '^ReadWritePaths=/tmp$' "$unit"
          ! grep -q '^MemoryDenyWriteExecute=true$' "$unit"
          ! grep -q -- '--jitless' "$unit"
          ! grep -Eq '^ReadWritePaths=.*(/var/lib/investment-research-production|/opt/stock-app|/opt/investment-research/)' "$unit"

          bash -n "$activate"
          grep -q 'SERVICE_PYTHON_RUNTIME=PASS' "$activate"
          grep -q 'python3' "$activate"
          grep -q 'RESEARCH_DASHBOARD_SERVICE_DIAGNOSTICS_BEGIN' "$activate"
          grep -q 'ExecMainStatus' "$activate"
          grep -q 'journalctl -u' "$activate"
          grep -q "'CADDY_MUTATION=0'" "$activate"
          grep -q "'DATABASE_MUTATION=0'" "$activate"
          grep -q "'PRODUCTION_PM2_MUTATION=0'" "$activate"
          grep -q "'LIVE_TRADING=false'" "$activate"
          grep -q "'PRIVATE_API=false'" "$activate"
          grep -q "'ORDER_AUTHORITY=false'" "$activate"

          ! grep -R -E 'ORDER_SUBMISSION_ENABLED=true|PRIVATE_API_ENABLED=true|LIVE_TRADING=true|REAL_ORDER_ENABLED=true' research-dashboard

  combined-market-watch:
    name: Four-market Research combined Draft QA (no deploy)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1791 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READBACK_SHA: ${{ github.event.pull_request.head.sha }}
      WATCH_SHA: '0c2e230a7f0c2dd3016896712526d6e2971575b9'
      BASE_SHA: 'ea5281cf16b552b03562e3e1e1cb9f2a90762784'
      LIVE_TRADING: 'false'
      AUTO_TRADING: 'false'
      REAL_ORDER_ENABLED: 'false'
      PRIVATE_TRADING_API_ALLOWED: 'false'
    steps:
      - name: Checkout exact Draft readback HEAD without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.READBACK_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Stage immutable cross-PR overlay only inside runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$READBACK_SHA"
          test -z "$(git symbolic-ref --quiet --short HEAD || true)"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/drift/research-market-watch-stock-source-parity-20261010)" = "$WATCH_SHA"
          git cat-file -e "$WATCH_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$READBACK_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$WATCH_SHA"
          test -z "$(git status --porcelain=v1)"
          if git diff --name-only "$BASE_SHA" "$WATCH_SHA" | grep -v '^research-production/'; then
            echo 'WATCH_PR_MODIFIES_OUTSIDE_RESEARCH_PRODUCTION' >&2
            exit 1
          fi
          if [[ -n "$(git diff --name-only "$BASE_SHA" "$READBACK_SHA" -- research-production/)" ]]; then
            echo 'CROSS_PR_FILE_OVERLAP_OR_BASE_DRIFT' >&2
            exit 1
          fi
          expected_count="$(git diff --name-only "$BASE_SHA" "$WATCH_SHA" -- research-production/ | wc -l | tr -d ' ')"
          test "$expected_count" -eq 15
          git diff --binary "$BASE_SHA" "$WATCH_SHA" -- research-production/ | git apply --index
          actual_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$actual_count" -eq "$expected_count"
          if git diff --cached --name-only | grep -v '^research-production/'; then
            echo 'COMBINED_QA_MUTATION_OUTSIDE_WATCH_PATHS' >&2
            exit 1
          fi
          git diff --cached --check
          virtual_tree="$(git write-tree)"
          {
            echo '## Isolated 4-market combined Draft QA'
            echo "- Base main: $BASE_SHA"
            echo "- Readback Draft #1791: $READBACK_SHA"
            echo "- Watch Draft #1794: $WATCH_SHA"
            echo "- Ephemeral combined tree: $virtual_tree"
            echo "- Watch files overlaid locally: $actual_count"
            echo '- No branch update, main merge, deployment or order authority.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "COMBINED_TREE=$virtual_tree" >> "$GITHUB_ENV"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run combined watcher and Python Dashboard regression suites
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix research-production test
          python3 -m py_compile research-dashboard/lightweight_market_watch_readback.py
          python3 research-dashboard/test/test_lightweight_market_watch_readback.py
          node api-server/scripts/verify-research-center-predeploy-contract.mjs

      - name: Typecheck combined API and web readback contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server run typecheck
          pnpm --dir stock-analyzer run typecheck

      - name: Test combined backend read-only API sanitizer
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server exec esbuild src/services/research-center-readonly-contract.service.test.ts --bundle --platform=node --format=cjs --target=node22 --outfile="$RUNNER_TEMP/combined-market-watch-api.test.cjs"
          node --test "$RUNNER_TEMP/combined-market-watch-api.test.cjs"

      - name: Install Chromium for combined browser QA
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium

      - name: Run combined Research Center browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir stock-analyzer exec playwright test -c playwright.config.ts e2e/research-center-simple-ko-ai-debate.spec.ts

      - name: Record Draft-only authority boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'COMBINED_QA=EPHEMERAL_ONLY' 'READY=false' 'MERGE_MAIN=false' 'STAGING_DEPLOY=false' 'PRODUCTION_DEPLOY=false' 'LIVE_TRADING=false' 'PAPER_ORDER=false' 'ORDER_AUTHORITY=NONE'
