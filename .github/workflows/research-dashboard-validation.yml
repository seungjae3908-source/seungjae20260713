name: Research Dashboard Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research-dashboard/**'
      - '.github/workflows/research-dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, unit tests, and exact runtime smoke
        working-directory: research-dashboard
        run: |
          set -Eeuo pipefail
          npm run check
          npm test
          node --jitless --no-experimental-fetch --no-experimental-websocket --check server.mjs

          state_root="$(mktemp -d)"
          log_file="$(mktemp)"
          health_file="$(mktemp)"
          overview_file="$(mktemp)"
          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$state_root" "$log_file" "$health_file" "$overview_file"
          }
          trap cleanup EXIT

          RESEARCH_DASHBOARD_HOST=127.0.0.1 \
          RESEARCH_DASHBOARD_PORT=18091 \
          RESEARCH_STATE_ROOT="$state_root" \
            node --jitless --no-experimental-fetch --no-experimental-websocket server.mjs >"$log_file" 2>&1 &
          server_pid=$!

          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18091/api/health -o "$health_file"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file" >&2
              exit 1
            fi
            sleep 0.25
          done
          [[ "$ready" == true ]] || { cat "$log_file" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18091/api/research/overview -o "$overview_file"
          node - "$health_file" "$overview_file" <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const overview = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (health?.ok !== true || health?.readOnly !== true) process.exit(1);
          if (health?.liveTrading !== false || health?.privateApi !== false || health?.orderAuthority !== false) process.exit(1);
          if (overview?.schemaVersion !== 'research-dashboard-overview-v1') process.exit(1);
          if (overview?.safety?.readOnlyDashboard !== true) process.exit(1);
          if (overview?.safety?.liveTrading !== false || overview?.safety?.privateApi !== false || overview?.safety?.orderAuthority !== false) process.exit(1);
          if (overview?.profitability?.proven !== false) process.exit(1);
          NODE
      - name: Validate systemd sandbox and fail-closed diagnostics contract
        run: |
          set -Eeuo pipefail
          unit='research-dashboard/deploy/research-dashboard.service'
          activate='research-dashboard/deploy/activate-server.sh'

          grep -q 'User=investment-research' "$unit"
          grep -q 'RESEARCH_DASHBOARD_HOST=127.0.0.1' "$unit"
          grep -q 'WorkingDirectory=/opt/investment-research-dashboard/current/research-dashboard' "$unit"
          grep -Fq 'ExecStart=/usr/bin/env node --jitless --no-experimental-fetch --no-experimental-websocket /opt/investment-research-dashboard/current/research-dashboard/server.mjs' "$unit"
          grep -q 'ProtectSystem=strict' "$unit"
          grep -q '^CapabilityBoundingSet=$' "$unit"
          grep -q '^AmbientCapabilities=$' "$unit"
          grep -q '^UMask=0077$' "$unit"
          grep -q '^ReadWritePaths=/tmp$' "$unit"
          ! grep -q '^MemoryDenyWriteExecute=true$' "$unit"
          ! grep -Eq '^ReadWritePaths=.*(/var/lib/investment-research-production|/opt/stock-app|/opt/investment-research/)' "$unit"

          bash -n "$activate"
          grep -q 'SERVICE_NODE_RUNTIME=PASS' "$activate"
          grep -q 'RESEARCH_DASHBOARD_SERVICE_DIAGNOSTICS_BEGIN' "$activate"
          grep -q 'ExecMainStatus' "$activate"
          grep -q 'journalctl -u' "$activate"
          grep -q "'CADDY_MUTATION=0'" "$activate"
          grep -q "'DATABASE_MUTATION=0'" "$activate"
          grep -q "'PRODUCTION_PM2_MUTATION=0'" "$activate"
          grep -q "'LIVE_TRADING=false'" "$activate"
          grep -q "'PRIVATE_API=false'" "$activate"
          grep -q "'ORDER_AUTHORITY=false'" "$activate"

          ! grep -R -E 'ORDER_SUBMISSION_ENABLED=true|PRIVATE_API_ENABLED=true|LIVE_TRADING=true|REAL_ORDER_ENABLED=true' research-dashboard
