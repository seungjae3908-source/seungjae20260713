name: Research US Microcap Intraday Ladder V1

on:
  push:
    branches:
      - agent/research-microcap-explosion-proxy-v1
    paths:
      - market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py
      - market-prediction-lab/scripts/run-us-microcap-intraday-risk-grid-v1.py
      - .github/workflows/research-us-microcap-explosion-proxy.yml
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py
      - market-prediction-lab/scripts/run-us-microcap-intraday-risk-grid-v1.py
      - .github/workflows/research-us-microcap-explosion-proxy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-us-microcap-intraday-ladder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Self-test intraday ladder accounting
        run: python3 market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py --self-test

      - name: Run real recent Yahoo extended-hours 1m diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1
          python3 market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py \
            --symbols FEMY,EHGO,BIVI,RCON,VRAX,MSS \
            --output-json market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/result.json \
            --output-md market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/result.md

      - name: Grid exact-minute risk caps and exit modes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 market-prediction-lab/scripts/run-us-microcap-intraday-risk-grid-v1.py \
            --symbols FEMY,EHGO,BIVI,RCON,VRAX,MSS \
            --output-json market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/risk-grid.json \
            --output-md market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/risk-grid.md

      - name: Record immutable provenance and data boundary
        shell: bash
        run: |
          cat > market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/provenance.json <<JSON
          {"schemaVersion":1,"researchCodeSha":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","source":"Yahoo public chart 1m range=7d includePrePost=true","tenYearMinuteHistory":false,"pointInTimeFloat":false,"archivedFreshCatalyst":false,"pointInTimeDilutionFilter":false,"liveOrderAllowed":false,"privateApiAllowed":false,"branchWrite":false}
          JSON

      - name: Print result
        if: always()
        shell: bash
        run: |
          cat market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/result.md || true
          echo
          cat market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/risk-grid.md || true

      - name: Upload immutable research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-us-microcap-intraday-ladder-${{ github.run_id }}
          path: market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1
          if-no-files-found: warn
          retention-days: 90
