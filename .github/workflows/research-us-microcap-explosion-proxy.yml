name: Research US Microcap Intraday Ladder V1

on:
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py
      - market-prediction-lab/scripts/run-us-microcap-intraday-risk-grid-v1.py
      - market-prediction-lab/scripts/build-us-microcap-sec-dilution-evidence-v1.py
      - market-prediction-lab/scripts/apply-us-microcap-pit-risk-gate-v1.py
      - market-prediction-lab/scripts/compare-us-microcap-rolling-window-v1.py
      - .github/workflows/research-us-microcap-explosion-proxy.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-us-microcap-intraday-ladder-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_CODE_SHA }}
          persist-credentials: false

      - name: Assert exact research identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RESEARCH_CODE_SHA"
          printf '%s' "$RESEARCH_CODE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Self-test intraday ladder accounting
        run: python3 market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py --self-test

      - name: Self-test rolling-window comparison guard
        run: python3 market-prediction-lab/scripts/compare-us-microcap-rolling-window-v1.py --self-test

      - name: Self-test point-in-time SEC dilution evidence
        run: python3 market-prediction-lab/scripts/build-us-microcap-sec-dilution-evidence-v1.py --self-test

      - name: Self-test point-in-time risk gate
        run: python3 market-prediction-lab/scripts/apply-us-microcap-pit-risk-gate-v1.py --self-test

      - name: Self-test structural stops and risk-normalized sizing
        run: python3 market-prediction-lab/scripts/run-us-microcap-intraday-risk-grid-v1.py --self-test

      - name: Locate previous successful rolling-window artifact
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          previous_run_id="$(
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f branch="$HEAD_BRANCH" \
              -f event="pull_request" \
              -f status="success" \
              -f per_page=100 \
              --jq '.workflow_runs[] | select(.name == "Research US Microcap Intraday Ladder V1") | .id' \
              | head -n 1 || true
          )"
          if [[ -z "$previous_run_id" ]]; then
            echo "previous_result=" >> "$GITHUB_OUTPUT"
            echo "No previous successful rolling-window artifact found."
            exit 0
          fi
          mkdir -p previous-artifact
          if gh run download "$previous_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "research-us-microcap-intraday-ladder-${previous_run_id}" \
            --dir previous-artifact; then
            previous_result="$(find previous-artifact -type f -name result.json -print -quit)"
            if [[ -n "$previous_result" ]]; then
              echo "previous_result=$previous_result" >> "$GITHUB_OUTPUT"
              echo "previous_run_id=$previous_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "previous_result=" >> "$GITHUB_OUTPUT"
          echo "Previous run exists but its result artifact was unavailable; comparison will fail closed as unavailable."

      - name: Run real recent Yahoo extended-hours 1m diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1
          python3 market-prediction-lab/scripts/run-us-microcap-intraday-ladder-v1.py \
            --symbols FEMY,EHGO,BIVI,RCON,VRAX,MSS \
            --output-json market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/result.json \
            --output-md market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/result.md

      - name: Apply fail-closed point-in-time risk gate
        shell: bash
        run: |
          set -Eeuo pipefail
          out_dir="market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1"
          python3 market-prediction-lab/scripts/apply-us-microcap-pit-risk-gate-v1.py \
            --ladder-json "$out_dir/result.json" \
            --output-json "$out_dir/pit-risk-gate.json" \
            --output-md "$out_dir/pit-risk-gate.md"

      - name: Compare bounded rolling window without false improvement claims
        shell: bash
        env:
          PREVIOUS_RESULT: ${{ steps.previous.outputs.previous_result }}
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.previous_run_id }}
        run: |
          set -Eeuo pipefail
          out_dir="market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1"
          if [[ -n "${PREVIOUS_RESULT:-}" && -f "$PREVIOUS_RESULT" ]]; then
            python3 market-prediction-lab/scripts/compare-us-microcap-rolling-window-v1.py \
              --previous-json "$PREVIOUS_RESULT" \
              --current-json "$out_dir/result.json" \
              --output-json "$out_dir/rolling-window-comparison.json" \
              --output-md "$out_dir/rolling-window-comparison.md"
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          out_dir = Path('market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1')
          result = {
              'schemaVersion': 1,
              'status': 'PREVIOUS_ROLLING_WINDOW_ARTIFACT_UNAVAILABLE',
              'comparable': False,
              'interpretation': 'NO_PREVIOUS_ARTIFACT',
              'windowAttritionRisk': None,
              'crossRunImprovementClaimAllowed': False,
              'canonicalEvidenceEligible': False,
              'canonicalSampleDelta': 0,
          }
          (out_dir / 'rolling-window-comparison.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          (out_dir / 'rolling-window-comparison.md').write_text(
              '# US Microcap Rolling-Window Comparison V1\n\n'
              '**Previous artifact unavailable — cross-run improvement claims fail closed.**\n',
              encoding='utf-8',
          )
          PY
          fi

      - name: Grid exact-minute risk caps and exit modes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 market-prediction-lab/scripts/run-us-microcap-intraday-risk-grid-v1.py \
            --symbols FEMY,EHGO,BIVI,RCON,VRAX,MSS \
            --output-json market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/risk-grid.json \
            --output-md market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/risk-grid.md

      - name: Record immutable provenance and data boundary
        shell: bash
        run: |
          cat > market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/provenance.json <<JSON
          {"schemaVersion":3,"researchCodeSha":"${RESEARCH_CODE_SHA}","triggerSha":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","source":"Yahoo public chart 1m range=7d includePrePost=true","tenYearMinuteHistory":false,"pointInTimeFloat":false,"archivedFreshCatalyst":false,"pointInTimeDilutionFilter":false,"secFormLevelDilutionEvidenceContract":true,"pointInTimeRiskGateContract":true,"rollingWindowAttritionGuard":true,"canonicalEvidenceEligible":false,"canonicalSampleDelta":0,"liveOrderAllowed":false,"privateApiAllowed":false,"branchWrite":false}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/provenance.json')
          row = json.loads(p.read_text())
          if row['researchCodeSha'] != '${{ env.RESEARCH_CODE_SHA }}':
              raise SystemExit('researchCodeSha mismatch')
          if row['canonicalEvidenceEligible'] is not False or row['canonicalSampleDelta'] != 0:
              raise SystemExit('recent diagnostic must not receive canonical sample credit')
          if row['rollingWindowAttritionGuard'] is not True:
              raise SystemExit('rolling-window attrition guard must remain enabled')
          if row['pointInTimeRiskGateContract'] is not True:
              raise SystemExit('point-in-time risk gate contract must remain enabled')
          PY

      - name: Print result
        if: always()
        shell: bash
        run: |
          cat market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/result.md || true
          echo
          cat market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/pit-risk-gate.md || true
          echo
          cat market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/rolling-window-comparison.md || true
          echo
          cat market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1/risk-grid.md || true

      - name: Upload immutable research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-us-microcap-intraday-ladder-${{ github.run_id }}
          path: market-prediction-lab/docs/research-us-microcap-intraday-ladder-v1
          if-no-files-found: warn
          retention-days: 90
