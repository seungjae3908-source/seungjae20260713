name: VOL_EXP Flow Sealed OOS V1

on:
  push:
    branches:
      - research/pit-us-orderflow-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-vol-exp-flow-sealed-oos-v1.py
      - .github/workflows/vol-exp-flow-sealed-oos-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-vol-exp-flow-sealed-oos-v1.py
      - name: Run sealed Aug-Sep OOS
        run: python market-prediction-lab/scripts/run-vol-exp-flow-sealed-oos-v1.py
      - name: Verify sealed safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-prediction-lab/artifacts/vol-exp-flow-sealed-oos-v1/result.json").read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert d["lookahead_free"] is True
          assert d["sealed_contract"]["source_research_end"] == "2026-07-31"
          assert d["sealed_contract"]["oos_start"] == "2026-08-01T00:00:00Z"
          assert d["sealed_contract"]["no_post_oos_retuning"] is True
          assert all(v["funding_status"]=="BINANCE_VISION_OK" for v in d["provenance"].values())
          print("SEALED_OOS_CONTRACT=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vol-exp-flow-sealed-oos-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/vol-exp-flow-sealed-oos-v1/
          if-no-files-found: error
          retention-days: 30
