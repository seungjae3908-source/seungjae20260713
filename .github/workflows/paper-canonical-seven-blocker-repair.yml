name: Paper Canonical Seven Blocker Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/paper-canonical-seven-blocker-repair.yml
      - market-prediction-lab/src/paper-canonical-seven-blocker-repair-plan-v1.js
      - market-prediction-lab/tests/paper-canonical-seven-blocker-repair-plan-v1.test.js
      - market-prediction-lab/tests/paper-canonical-seven-blocker-repair-cli-v1.test.js
      - ops/plan-paper-canonical-seven-blocker-repair.mjs
      - api-server/src/services/manual-paper-canonical-runtime-readiness.service.ts
      - api-server/src/services/manual-paper-canonical-runtime-readiness.service.test.ts
      - api-server/scripts/check-paper-canonical-runtime-readiness-remote.ts
      - .github/workflows/paper-canonical-runtime-readiness.yml
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: paper-canonical-seven-blocker-repair-v1
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate deterministic seven-blocker planner
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check market-prediction-lab/src/paper-canonical-seven-blocker-repair-plan-v1.js
          node --check ops/plan-paper-canonical-seven-blocker-repair.mjs
          node --test             market-prediction-lab/tests/paper-canonical-seven-blocker-repair-plan-v1.test.js             market-prediction-lab/tests/paper-canonical-seven-blocker-repair-cli-v1.test.js
      - name: Validate existing owner scripts reused by the repair chain
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n research-production/deploy/activate-server.sh
          bash -n ops/prepare-paper-forward-publisher-binding.sh
          node --check ops/materialize-paper-canonical-forward-observer.mjs
          node --check ops/publish-paper-canonical-validation-freshness-policy.mjs
          node --check ops/run-paper-forward-flat-snapshot-republish.mjs
          node api-server/scripts/verify-forward-recommendation-observer-runtime-contract.mjs
      - name: Backend semantic validation
        run: pnpm --dir api-server run typecheck
      - name: Run canonical readiness regressions
        working-directory: api-server
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { build } from 'esbuild';
          await build({
            entryPoints: ['src/services/manual-paper-canonical-runtime-readiness.service.test.ts'],
            outfile: '/tmp/paper-seven-blocker-readiness.test.cjs',
            bundle: true,
            platform: 'node',
            format: 'cjs',
            target: 'node20',
            sourcemap: 'inline',
            logLevel: 'warning',
            define: { 'import.meta.env': '{}' },
          });
          NODE
          node --test /tmp/paper-seven-blocker-readiness.test.cjs
      - name: Verify future operational authority remains bounded
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/paper-canonical-seven-blocker-repair.yml'
          grep -Fq "startsWith(github.event.comment.body, '/repair-paper-canonical-seven-blockers ')" "$workflow"
          grep -Fq 'environment: production' "$workflow"
          grep -Fq 'PAPER_CANONICAL_OWNER_BRIDGE_ENABLED=true' "$workflow" && exit 1 || true
          ! grep -Eq 'actions:[[:space:]]+write|contents:[[:space:]]+write|deployments:[[:space:]]+write' "$workflow"
          ! grep -Eq 'LIVE_TRADING=true|AUTO_TRADING=true|REAL_ORDER_ENABLED=true|PRIVATE_TRADING_API_ALLOWED=true' "$workflow"
          ! grep -Eq 'deploy-production[.]sh|/run-production-app|createWorkflowDispatch|workflow_dispatch.*production-deploy' "$workflow"
          grep -Fq 'profitabilityCredit: 0' market-prediction-lab/src/paper-canonical-seven-blocker-repair-plan-v1.js
          grep -Fq 'syntheticCredit: 0' market-prediction-lab/src/paper-canonical-seven-blocker-repair-plan-v1.js
          grep -Fq 'backfillCredit: 0' market-prediction-lab/src/paper-canonical-seven-blocker-repair-plan-v1.js

  gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 23 &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/repair-paper-canonical-seven-blockers ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.command.outputs.target_sha }}
      maximum_age_ms: ${{ steps.command.outputs.maximum_age_ms }}
      required_ci_run_id: ${{ steps.provenance.outputs.required_ci_run_id }}
      production_run_id: ${{ steps.provenance.outputs.production_run_id }}
    steps:
      - name: Parse exact one-command repair authority
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/repair-paper-canonical-seven-blockers ([0-9a-f]{40}) ([1-9][0-9]*)$/u.exec(body);
          if (!match) throw new Error('PAPER_CANONICAL_SEVEN_BLOCKER_EXACT_COMMAND_REQUIRED');
          const maximumAgeMs = Number(match[2]);
          if (!Number.isSafeInteger(maximumAgeMs) || maximumAgeMs <= 0) {
            throw new Error('PAPER_CANONICAL_SEVEN_BLOCKER_MAXIMUM_AGE_INVALID');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `target_sha=${match[1]}\nmaximum_age_ms=${maximumAgeMs}\n`);
          NODE
      - name: Require exact current main, coherent Required CI, official Production deploy, and Research source ancestry
        id: provenance
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const main = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            })).data;
            if (main.commit.sha !== target) {
              core.setFailed(`PAPER_REPAIR_STALE_MAIN:${target}!=${main.commit.sha}`);
              return;
            }

            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: target, per_page: 100,
            });
            statuses.sort((a,b) => Number(b.id) - Number(a.id));
            const latest = new Map();
            for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status);
            if (required.some((name) => latest.get(name)?.state !== 'success')) {
              core.setFailed('PAPER_REPAIR_REQUIRED_CI_NOT_6_OF_6');
              return;
            }
            const runIds = new Set(required.map((name) =>
              /\/actions\/runs\/(\d+)/.exec(String(latest.get(name)?.target_url ?? ''))?.[1] ?? null));
            if (runIds.size !== 1 || runIds.has(null)) {
              core.setFailed('PAPER_REPAIR_REQUIRED_CI_PROVENANCE_INCOHERENT');
              return;
            }
            const requiredRunId = Number([...runIds][0]);
            const requiredRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: requiredRunId,
            })).data;
            if (requiredRun.head_sha !== target || requiredRun.status !== 'completed' || requiredRun.conclusion !== 'success') {
              core.setFailed('PAPER_REPAIR_REQUIRED_CI_PROVENANCE_REJECTED');
              return;
            }

            const productionRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: target, branch: 'main', event: 'workflow_dispatch', status: 'completed', per_page: 100,
            });
            const production = productionRuns
              .filter((run) => run.name === 'Production Deploy'
                && run.path === '.github/workflows/production-deploy.yml'
                && run.conclusion === 'success')
              .sort((a,b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0];
            if (!production) {
              core.setFailed('PAPER_REPAIR_EXACT_PRODUCTION_DEPLOY_REQUIRED');
              return;
            }

            const source = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: 357,
            })).data;
            if (!source.merged || !source.merge_commit_sha) {
              core.setFailed('PAPER_REPAIR_RESEARCH_SOURCE_NOT_MERGED');
              return;
            }
            const ancestry = await github.rest.repos.compareCommits({
              owner: context.repo.owner, repo: context.repo.repo,
              base: source.merge_commit_sha, head: target,
            });
            if (!['ahead','identical'].includes(ancestry.data.status)) {
              core.setFailed('PAPER_REPAIR_RESEARCH_SOURCE_ANCESTRY_MISSING');
              return;
            }

            core.setOutput('required_ci_run_id', String(requiredRunId));
            core.setOutput('production_run_id', String(production.id));

  repair:
    if: github.event_name == 'issue_comment'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
      MAXIMUM_AGE_MS: ${{ needs.gate.outputs.maximum_age_ms }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PUBLISHER_ACCOUNT_ID_SHA256: ${{ secrets.PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256 }}
      PRODUCTION_QA_LOGIN: ${{ secrets.PRODUCTION_QA_LOGIN }}
      PRODUCTION_QA_PASSWORD: ${{ secrets.PRODUCTION_QA_PASSWORD }}
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
      STATE_ROOT: /opt/stock-app-data/paper-forward-v1
      RESEARCH_ROOT: /opt/investment-research
      EVIDENCE_DIR: ${{ github.workspace }}/paper-seven-blocker-repair-evidence
    steps:
      - name: Revalidate exact main after protected environment approval
        uses: actions/github-script@v7
        with:
          script: |
            const main = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            })).data;
            if (main.commit.sha !== process.env.TARGET_SHA) {
              core.setFailed(`PAPER_REPAIR_TARGET_MOVED:${process.env.TARGET_SHA}!=${main.commit.sha}`);
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build readiness bundle and isolated public Observer CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server run build:server
          (
            cd api-server
            node --input-type=module <<'NODE'
            import { build } from 'esbuild';
            await build({
              entryPoints: ['src/scripts/run-forward-recommendation-observer-cycle.ts'],
              outfile: '.paper-seven-blocker-observer.mjs',
              bundle: true,
              packages: 'external',
              platform: 'node',
              format: 'esm',
              target: 'node20',
              logLevel: 'warning',
            });
            NODE
          )
      - name: Configure protected Production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"
          [[ "$PUBLISHER_ACCOUNT_ID_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$PRODUCTION_QA_LOGIN"; test -n "$PRODUCTION_QA_PASSWORD"
          umask 077
          mkdir -p ~/.ssh "$EVIDENCE_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
      - name: Verify exact Production app and canonical safety before repair
        shell: bash
        run: |
          set -Eeuo pipefail
          remote=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST")
          [[ "$("${remote[@]}" "tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha")" == "$TARGET_SHA" ]]
          "${remote[@]}" "test -r /opt/stock-app/ops/check-paper-canonical-pm2-safety.mjs && pm2 jlist | node /opt/stock-app/ops/check-paper-canonical-pm2-safety.mjs"
      - name: Align isolated Research Production to exact current main if required
        shell: bash
        run: |
          set -Eeuo pipefail
          remote=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST")
          current="$("${remote[@]}" "readlink -f '$RESEARCH_ROOT/current' 2>/dev/null || true")"
          if [[ "$current" != "$RESEARCH_ROOT/releases/$TARGET_SHA" ]]; then
            risk_path="$RESEARCH_ROOT/releases/$TARGET_SHA/market-prediction-lab/config/paper-risk-policy/natural-paper-btcusdt-v1.json"
            remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q PAPER_FORWARD_RISK_POLICY_DECISION_PATH=%q' "$TARGET_SHA" "$REPOSITORY_URL" "$risk_path")"
            "${remote[@]}" "$remote_env bash -s -- preflight" < research-production/deploy/activate-server.sh
            "${remote[@]}" "$remote_env bash -s -- activate" < research-production/deploy/activate-server.sh
          fi
          [[ "$("${remote[@]}" "readlink -f '$RESEARCH_ROOT/current'")" == "$RESEARCH_ROOT/releases/$TARGET_SHA" ]]
      - name: Build exact-SHA public Observer artifact in this repair run
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$EVIDENCE_DIR/observer" "$RUNNER_TEMP/previous-observer"
          mkdir -p "$EVIDENCE_DIR/observer" "$RUNNER_TEMP/previous-observer"
          remote=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST")
          set +e
          scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT"             "$SSH_USER@$SSH_HOST:$STATE_ROOT/forward-observer/state.json"             "$SSH_USER@$SSH_HOST:$STATE_ROOT/forward-observer/summary.json"             "$SSH_USER@$SSH_HOST:$STATE_ROOT/forward-observer/manifest.json"             "$RUNNER_TEMP/previous-observer/" 2>/dev/null
          previous_status=$?
          set -e
          previous_arg=()
          if [[ "$previous_status" == 0 ]]; then
            set +e
            node ops/materialize-paper-canonical-forward-observer.mjs               --source-root="$RUNNER_TEMP/previous-observer"               --expected-sha="$TARGET_SHA" --dry-run >/dev/null 2>&1
            valid_previous=$?
            set -e
            if [[ "$valid_previous" == 0 ]]; then
              previous_arg=(--state-input "$RUNNER_TEMP/previous-observer/state.json")
            fi
          fi
          node api-server/.paper-seven-blocker-observer.mjs             --research-sha "$TARGET_SHA"             --output-dir "$EVIDENCE_DIR/observer" "${previous_arg[@]}"
          RESEARCH_SHA="$TARGET_SHA" OBSERVER_ROOT="$EVIDENCE_DIR/observer" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const root = process.env.OBSERVER_ROOT;
          const statePath = path.join(root, 'state.json');
          const summaryPath = path.join(root, 'summary.json');
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const digest = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          if (state.researchCodeSha !== process.env.RESEARCH_SHA || summary.researchCodeSha !== process.env.RESEARCH_SHA) {
            throw new Error('PAPER_REPAIR_OBSERVER_SHA_MISMATCH');
          }
          const safetyOk = (v) => v?.publicDataOnly === true && v?.artifactOnly === true
            && v?.executionAuthority === 'NONE' && v?.financialMutationAllowed === false
            && v?.liveOrderAllowed === false && v?.privateTradingApiAllowed === false
            && v?.profitabilityClaimAllowed === false;
          if (!safetyOk(state.safety) || !safetyOk(summary.safety)) throw new Error('PAPER_REPAIR_OBSERVER_SAFETY_INVALID');
          const manifest = {
            schemaVersion: 1,
            kind: 'forward-recommendation-observer-state',
            researchCodeSha: process.env.RESEARCH_SHA,
            stateSha256: digest(statePath),
            summarySha256: digest(summaryPath),
            safety: {
              publicDataOnly: true, artifactOnly: true, executionAuthority: 'NONE',
              financialMutationAllowed: false, liveOrderAllowed: false,
              privateTradingApiAllowed: false, profitabilityClaimAllowed: false,
            },
          };
          fs.writeFileSync(path.join(root, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node ops/materialize-paper-canonical-forward-observer.mjs             --source-root="$EVIDENCE_DIR/observer" --expected-sha="$TARGET_SHA" --dry-run >/dev/null
      - name: Materialize exact Observer artifact without app/process/schedule mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_tmp="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mktemp -d /tmp/paper-seven-observer.XXXXXX")"
          cleanup(){ ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -rf -- '$remote_tmp'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT"             ops/materialize-paper-canonical-forward-observer.mjs             "$EVIDENCE_DIR/observer/state.json" "$EVIDENCE_DIR/observer/summary.json" "$EVIDENCE_DIR/observer/manifest.json"             "$SSH_USER@$SSH_HOST:$remote_tmp/"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST"             "node '$remote_tmp/materialize-paper-canonical-forward-observer.mjs' --source-root='$remote_tmp' --expected-sha='$TARGET_SHA' --state-root='$STATE_ROOT'"             > "$EVIDENCE_DIR/observer-materialize.json"
      - name: Prepare exact-SHA publisher binding
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v remote_command             'TARGET_SHA=%q PAPER_FORWARD_STATE_ROOT=%q PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256=%q bash -s'             "$TARGET_SHA" "$STATE_ROOT" "$PUBLISHER_ACCOUNT_ID_SHA256"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_command"             < ops/prepare-paper-forward-publisher-binding.sh             > "$EVIDENCE_DIR/publisher-binding.json"
      - name: Publish explicit owner-selected validation freshness policy
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_tmp="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mktemp -d /tmp/paper-seven-freshness.XXXXXX")"
          cleanup(){ ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -rf -- '$remote_tmp'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT" ops/publish-paper-canonical-validation-freshness-policy.mjs "$SSH_USER@$SSH_HOST:$remote_tmp/"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST"             "node '$remote_tmp/publish-paper-canonical-validation-freshness-policy.mjs' --state-root='$STATE_ROOT' --maximum-age-ms='$MAXIMUM_AGE_MS'"             > "$EVIDENCE_DIR/freshness-policy.json"
      - name: Probe after deterministic configuration repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle='api-server/dist/tools/check-paper-canonical-runtime-readiness-remote.mjs'
          remote_command="node --input-type=module - --expected-main-sha=$TARGET_SHA --pm2-name=stock-app"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_command" < "$bundle"             > "$EVIDENCE_DIR/mid-readiness.json"
          node ops/plan-paper-canonical-seven-blocker-repair.mjs             --readiness="$EVIDENCE_DIR/mid-readiness.json"             --maximum-age-ms="$MAXIMUM_AGE_MS"             > "$EVIDENCE_DIR/mid-plan.json"
      - name: Refresh exact-SHA Paper snapshot only when readiness still requires it
        shell: bash
        run: |
          set -Eeuo pipefail
          if node -e "const v=require(process.argv[1]);process.exit((v.blockers||[]).includes('PAPER_CANONICAL_PAPER_STATE_SNAPSHOT_NOT_READY')?0:1)" "$EVIDENCE_DIR/mid-readiness.json"; then
            umask 077
            local_env="$(mktemp)"
            remote_env="/tmp/paper-seven-flat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
            remote=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST")
            cleanup(){ rm -f "$local_env"; "${remote[@]}" "rm -f -- $(printf '%q' "$remote_env")" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            {
              printf 'export TARGET_SHA=%q\n' "$TARGET_SHA"
              printf 'export PUBLISHER_ACCOUNT_ID_SHA256=%q\n' "$PUBLISHER_ACCOUNT_ID_SHA256"
              printf 'export PRODUCTION_QA_LOGIN=%q\n' "$PRODUCTION_QA_LOGIN"
              printf 'export PRODUCTION_QA_PASSWORD=%q\n' "$PRODUCTION_QA_PASSWORD"
              printf 'export PAPER_FORWARD_STATE_ROOT=%q\n' "$STATE_ROOT"
              printf 'export LIVE_DIR=%q\n' '/opt/stock-app'
              printf 'export PM2_NAME=%q\n' 'stock-app'
              printf 'export LIVE_PORT=%q\n' '8080'
            } > "$local_env"
            chmod 600 "$local_env"
            scp -q -i ~/.ssh/id_ed25519 -P "$SSH_PORT" "$local_env" "$SSH_USER@$SSH_HOST:$remote_env"
            "${remote[@]}" "chmod 600 -- $(printf '%q' "$remote_env")"
            command="$(printf 'set -Eeuo pipefail; source %q; PAPER_FLAT_REPUBLISH_EXECUTE=1 node --input-type=module -' "$remote_env")"
            "${remote[@]}" "$command" < ops/run-paper-forward-flat-snapshot-republish.mjs > "$EVIDENCE_DIR/flat-republish.json"
          else
            printf '%s\n' '{"status":"NOT_REQUIRED","economicStatePreserved":true,"realOrder":0,"executionAuthority":"NONE"}' > "$EVIDENCE_DIR/flat-republish.json"
          fi
      - name: Run one genuine exact-SHA Natural Paper cycle without live/private authority
        shell: bash
        run: |
          set -Eeuo pipefail
          remote=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST")
          if "${remote[@]}" "sudo -n systemctl is-active --quiet research-production@forward.service"; then
            echo 'PAPER_REPAIR_FORWARD_SERVICE_ALREADY_ACTIVE' >&2
            exit 79
          fi
          set +e
          "${remote[@]}" "sudo -n systemctl start research-production@forward.service"
          start_status=$?
          set -e
          result="$("${remote[@]}" "sudo -n systemctl show research-production@forward.service -p Result --value")"
          exec_status="$("${remote[@]}" "sudo -n systemctl show research-production@forward.service -p ExecMainStatus --value")"
          printf '{"status":"%s","systemctlStartStatus":%s,"execMainStatus":"%s","liveTrading":false,"privateApi":false,"orderAuthority":false,"realOrderCount":0}\n'             "$result" "$start_status" "$exec_status" > "$EVIDENCE_DIR/natural-one-shot.json"
          [[ "$result" == 'success' && "$exec_status" == '0' ]]
      - name: Final zero-mutation readiness and seven-blocker plan
        id: final
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle='api-server/dist/tools/check-paper-canonical-runtime-readiness-remote.mjs'
          remote_command="node --input-type=module - --expected-main-sha=$TARGET_SHA --pm2-name=stock-app"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_command" < "$bundle"             > "$EVIDENCE_DIR/final-readiness.json"
          node ops/plan-paper-canonical-seven-blocker-repair.mjs             --readiness="$EVIDENCE_DIR/final-readiness.json"             --maximum-age-ms="$MAXIMUM_AGE_MS"             > "$EVIDENCE_DIR/final-plan.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/final-plan.json','utf8'));
          if (plan.status === 'BLOCKED_UNRELATED' || plan.status === 'REPAIR_REQUIRED' || plan.status === 'BLOCKED_NO_MATCHING_REPAIR') {
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${plan.status}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${plan.readyForActivationReview}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `remaining=${plan.sevenBlockers.join(',') || 'NONE'}\n`);
          NODE
      - name: Upload bounded repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper-canonical-seven-blocker-repair-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Report terminal repair state without activation claim
        if: always()
        uses: actions/github-script@v7
        env:
          FINAL_STATUS: ${{ steps.final.outputs.status }}
          FINAL_READY: ${{ steps.final.outputs.ready }}
          FINAL_REMAINING: ${{ steps.final.outputs.remaining }}
          REQUIRED_CI_RUN: ${{ needs.gate.outputs.required_ci_run_id }}
          PRODUCTION_RUN: ${{ needs.gate.outputs.production_run_id }}
        with:
          script: |
            const body = [
              '[PAPER_CANONICAL_SEVEN_BLOCKER_REPAIR]',
              `target_sha: ${process.env.TARGET_SHA}`,
              `status: ${process.env.FINAL_STATUS || 'FAILED_CLOSED'}`,
              `ready_for_activation_review: ${process.env.FINAL_READY || 'false'}`,
              `remaining_seven_blockers: ${process.env.FINAL_REMAINING || 'UNKNOWN'}`,
              `required_ci_run: ${process.env.REQUIRED_CI_RUN}`,
              `production_deploy_run: ${process.env.PRODUCTION_RUN}`,
              `workflow_run: ${context.runId}`,
              'activationApplied=false',
              'profitabilityCredit=0',
              'synthetic/replay/backfill/manual credit=0',
              'LIVE_TRADING=false',
              'AUTO_TRADING=false',
              'REAL_ORDER_ENABLED=false',
              'PRIVATE_TRADING_API_ALLOWED=false',
              'executionAuthority=NONE',
              'realOrderCount=0',
              '',
              'WAITING_GENUINE_EVIDENCE is a valid non-ready terminal: it means technical/configuration repair is complete but a genuine Natural Position/Settlement has not occurred yet.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 23, body,
            });
