name: Prediction Lab Final Holdout 2026

on:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - .github/workflows/prediction-lab-final-holdout.yml
      - market-prediction-lab/src/final-holdout-evaluator.js
      - market-prediction-lab/src/final-holdout-evidence-provenance.js
      - market-prediction-lab/src/independent-strategy-backtest.js
      - market-prediction-lab/scripts/run-final-holdout.js
      - market-prediction-lab/tests/final-holdout-evaluator.test.js
      - market-prediction-lab/tests/final-holdout-evidence-provenance.test.js
  workflow_dispatch:
    inputs:
      research_ref:
        description: Exact research commit/ref to validate
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: prediction-lab-final-holdout-2026
  cancel-in-progress: true

env:
  RESEARCH_BRANCH: feature/prediction-lab-standalone

jobs:
  final-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve immutable research ref
        id: research
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.research_ref }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ] && [ "$EVENT_NAME" = "push" ]; then ref="$GITHUB_SHA"; fi
          if [ -z "$ref" ]; then ref="$RESEARCH_BRANCH"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout isolated research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.research.outputs.ref }}
          persist-credentials: false

      - name: Record immutable research SHA
        id: sha
        shell: bash
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate research lab before opening holdout
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Verify final holdout guards
        working-directory: market-prediction-lab
        run: node --test tests/final-holdout-evaluator.test.js tests/final-holdout-evidence-provenance.test.js

      - name: Preserve only same-identity immutable result or run holdout once
        id: holdout
        working-directory: market-prediction-lab
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          result_json='docs/final-holdout-2026-result.json'
          result_md='docs/final-holdout-2026-result.md'
          provenance='docs/final-holdout-2026-provenance.json'

          if [ -e "$result_json" ] || [ -e "$result_md" ]; then
            if [ ! -s "$result_json" ] || [ ! -s "$result_md" ]; then
              echo 'partial immutable final holdout result is not valid evidence' >&2
              exit 1
            fi
            if [ ! -s "$provenance" ]; then
              echo 'STALE_OR_UNPROVEN_FINAL_HOLDOUT_EVIDENCE: existing immutable result has no research-SHA provenance; refusing to relabel it as the current research identity' >&2
              exit 1
            fi
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { assessFinalHoldoutEvidenceProvenance } from "./src/final-holdout-evidence-provenance.js";
          const assessment = assessFinalHoldoutEvidenceProvenance({
            expectedResearchCodeSha: process.env.RESEARCH_SHA,
            resultJson: readFileSync("docs/final-holdout-2026-result.json", "utf8"),
            resultMarkdown: readFileSync("docs/final-holdout-2026-result.md", "utf8"),
            provenanceJson: readFileSync("docs/final-holdout-2026-provenance.json", "utf8"),
          });
          console.log(JSON.stringify(assessment));
          if (!assessment.currentIdentity) {
            console.error(`STALE_OR_UNPROVEN_FINAL_HOLDOUT_EVIDENCE: ${assessment.status}`);
            process.exit(1);
          }
          NODE
            echo 'existing immutable final holdout result retained with exact research identity'
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/run-final-holdout.js "$result_json" "$result_md"
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build provenance only for newly generated holdout evidence
        if: steps.holdout.outputs.generated == 'true'
        working-directory: market-prediction-lab
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { buildFinalHoldoutEvidenceProvenance } from "./src/final-holdout-evidence-provenance.js";
          const provenance = buildFinalHoldoutEvidenceProvenance({
            researchCodeSha: process.env.RESEARCH_SHA,
            resultJson: readFileSync("docs/final-holdout-2026-result.json", "utf8"),
            resultMarkdown: readFileSync("docs/final-holdout-2026-result.md", "utf8"),
          });
          writeFileSync("docs/final-holdout-2026-provenance.json", `${JSON.stringify(provenance, null, 2)}\n`, "utf8");
          NODE

      - name: Verify immutable holdout provenance before publication
        working-directory: market-prediction-lab
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { assessFinalHoldoutEvidenceProvenance } from "./src/final-holdout-evidence-provenance.js";
          const assessment = assessFinalHoldoutEvidenceProvenance({
            expectedResearchCodeSha: process.env.RESEARCH_SHA,
            resultJson: readFileSync("docs/final-holdout-2026-result.json", "utf8"),
            resultMarkdown: readFileSync("docs/final-holdout-2026-result.md", "utf8"),
            provenanceJson: readFileSync("docs/final-holdout-2026-provenance.json", "utf8"),
          });
          console.log(JSON.stringify(assessment));
          if (!assessment.currentIdentity) process.exit(1);
          NODE

      - name: Display final holdout table
        working-directory: market-prediction-lab
        run: cat docs/final-holdout-2026-result.md

      - name: Upload immutable final holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-holdout-2026-${{ github.run_id }}
          path: |
            market-prediction-lab/docs/final-holdout-2026-result.json
            market-prediction-lab/docs/final-holdout-2026-result.md
            market-prediction-lab/docs/final-holdout-2026-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Assert immutable checkout HEAD
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: test "$(git rev-parse HEAD)" = "$RESEARCH_SHA"
