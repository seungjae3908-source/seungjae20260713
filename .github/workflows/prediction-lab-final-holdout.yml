name: Prediction Lab Final Holdout 2026

on:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - .github/workflows/prediction-lab-final-holdout.yml
      - market-prediction-lab/src/final-holdout-evaluator.js
      - market-prediction-lab/src/independent-strategy-backtest.js
      - market-prediction-lab/scripts/run-final-holdout.js
      - market-prediction-lab/tests/final-holdout-evaluator.test.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prediction-lab-final-holdout-2026
  cancel-in-progress: true

jobs:
  final-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable research revision
        uses: actions/checkout@v4
        with:
          ref: feature/prediction-lab-standalone
          persist-credentials: false

      - name: Record immutable research SHA
        id: sha
        shell: bash
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate research lab
        working-directory: market-prediction-lab
        run: npm run validate

      - name: Verify final holdout guards
        working-directory: market-prediction-lab
        run: node --test tests/final-holdout-evaluator.test.js

      - name: Verify stored one-shot final holdout is frozen and immutable
        working-directory: market-prediction-lab
        run: |
          test -s docs/final-holdout-2026-result.json
          test -s docs/final-holdout-2026-result.md
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            FROZEN_CANDIDATE_MANIFEST_SHA256,
            FROZEN_FINAL_HOLDOUT_CANDIDATES,
          } from './src/final-holdout-evaluator.js';

          const result = JSON.parse(fs.readFileSync('docs/final-holdout-2026-result.json', 'utf8'));
          if (result.schemaVersion !== 1) throw new Error('unexpected final holdout schema');
          if (result.mode !== 'backtest-only' || result.evaluation !== 'one-shot-final-holdout') throw new Error('final holdout mode/evaluation mismatch');
          if (result.candidateManifestSha256 !== FROZEN_CANDIDATE_MANIFEST_SHA256) throw new Error('final holdout manifest mismatch');
          if (result.candidateCount !== FROZEN_FINAL_HOLDOUT_CANDIDATES.length) throw new Error('final holdout candidate count mismatch');
          if (result.finalHoldoutRetuningAllowed !== false || result.liveOrderAllowed !== false || result.privateAccountRequestAllowed !== false) throw new Error('unsafe top-level final holdout flags');
          if (!Array.isArray(result.results) || result.results.length !== FROZEN_FINAL_HOLDOUT_CANDIDATES.length) throw new Error('final holdout results are incomplete');

          const expectedIds = new Set(FROZEN_FINAL_HOLDOUT_CANDIDATES.map((candidate) => candidate.id));
          const seen = new Set();
          for (const row of result.results) {
            if (!expectedIds.has(row.id) || seen.has(row.id)) throw new Error(`unexpected or duplicate final holdout candidate: ${row.id}`);
            seen.add(row.id);
            if (row.candidateManifestSha256 !== FROZEN_CANDIDATE_MANIFEST_SHA256) throw new Error(`candidate manifest mismatch: ${row.id}`);
            const guard = row.safeguards ?? {};
            if (guard.optimizerUsed !== false || guard.parametersChangedFromFrozenSelection !== false || guard.finalHoldoutUsedForSelection !== false || guard.finalHoldoutRetuningAllowed !== false || guard.orderSubmitted !== false || guard.privateAccountRequestAllowed !== false || guard.liveOrderAllowed !== false) {
              throw new Error(`unsafe final holdout safeguards: ${row.id}`);
            }
          }
          if (seen.size !== expectedIds.size) throw new Error('final holdout candidate set mismatch');
          NODE

      - name: Display immutable final holdout table
        working-directory: market-prediction-lab
        run: cat docs/final-holdout-2026-result.md

      - name: Build immutable holdout provenance
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const root = 'market-prediction-lab/docs';
          const digest = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const manifest = {
            schemaVersion: 1,
            researchCodeSha: process.env.RESEARCH_SHA,
            resultJsonSha256: digest(`${root}/final-holdout-2026-result.json`),
            resultMarkdownSha256: digest(`${root}/final-holdout-2026-result.md`),
            branchWrite: false,
            liveOrderAllowed: false,
            privateAccountRequestAllowed: false,
            oneShotResultReused: true,
            createdAt: new Date().toISOString(),
          };
          fs.writeFileSync(`${root}/final-holdout-2026-provenance.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload immutable final holdout evidence only
        uses: actions/upload-artifact@v4
        with:
          name: final-holdout-2026-${{ github.run_id }}
          path: |
            market-prediction-lab/docs/final-holdout-2026-result.json
            market-prediction-lab/docs/final-holdout-2026-result.md
            market-prediction-lab/docs/final-holdout-2026-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Assert validation did not change checkout HEAD
        shell: bash
        env:
          RESEARCH_SHA: ${{ steps.sha.outputs.value }}
        run: test "$(git rev-parse HEAD)" = "$RESEARCH_SHA"
