name: Agent Hub v2 Integration Bootstrap

on:
  push:
    branches: [agent/agent-hub-coordinator-v2]
    paths:
      - 'scripts/.agent-hub-v2-integration.part*'
      - scripts/apply_agent_hub_v2_integration.py
      - .github/workflows/agent-hub-v2-integration-bootstrap.yml
  pull_request:
    branches: [main]
    paths:
      - 'scripts/.agent-hub-v2-integration.part*'
      - scripts/apply_agent_hub_v2_integration.py
      - .github/workflows/agent-hub-v2-integration-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: agent-hub-v2-integration-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/agent-hub-coordinator-v2
          fetch-depth: 0
      - name: Detect one-time installer
        id: gate
        run: echo "apply=$([[ -f scripts/apply_agent_hub_v2_integration.py ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Apply and validate reviewed integration bundle
        if: steps.gate.outputs.apply == 'true'
        run: python3 scripts/apply_agent_hub_v2_integration.py
      - name: Commit validated non-workflow integration files
        if: steps.gate.outputs.apply == 'true'
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Agent Hub schema v2 and prompt compiler'
          git push origin HEAD:agent/agent-hub-coordinator-v2
