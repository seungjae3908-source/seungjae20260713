name: Research Crypto Multi-Leader Shock-Lag AI V5.1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/train-crypto-multileader-shock-lag-ai-v51.py
      - .github/workflows/research-crypto-multileader-shock-lag-ai-v51.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-multileader-shock-lag-ai-v51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    strategy:
      fail-fast: false
      matrix:
        market: [CRYPTO_SPOT, CRYPTO_FUTURES]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: "37438825137"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/train-crypto-multileader-shock-lag-ai-v51.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - name: Download unbiased full-universe multi-leader sample
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: crypto-multileader-shock-lag-v5-probe-${{ matrix.market }}-5b50b125677b3dee8d32d25706404a8b7632adc5
          path: source
      - name: Train nonlinear target-before-stop AI
        run: |
          python market-prediction-lab/scripts/train-crypto-multileader-shock-lag-ai-v51.py \
            --states source/states-sample.parquet \
            --market ${{ matrix.market }} \
            --out-dir market-prediction-lab/docs/crypto-multileader-shock-lag-ai-v51/${{ matrix.market }}
      - name: Upload AI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-multileader-shock-lag-ai-v51-${{ matrix.market }}-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-multileader-shock-lag-ai-v51/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14
