name: Research Crypto Futures V4.9 Bitget Actual Funding V4.11

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/audit-crypto-futures-v49-bitget-actual-funding-v411.py
      - .github/workflows/research-crypto-futures-v49-bitget-actual-funding-v411.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-v49-bitget-actual-funding-v411-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      V49_RUN_ID: "37458393512"
      V49_ARTIFACT: "crypto-futures-v48-bitget-exact1m-v49-0889474af32db16ee16c796d34a29eac67a68f19"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v49-bitget-actual-funding-v411.py
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v44-robustness-capital-v45.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1" "lightgbm==4.5.0" "scikit-learn==1.5.2"

      - name: Download frozen V4.9 Bitget exact evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN_ID }}
          name: ${{ env.V49_ARTIFACT }}
          path: frozen-v49

      - name: Audit actual Bitget funding on the availability overlap
        run: |
          EVENTS="$(find frozen-v49 -name bitget-exact-events.parquet -print -quit)"
          SUMMARY="$(find frozen-v49 -name summary.json -print -quit)"
          test -n "$EVENTS"
          test -n "$SUMMARY"
          python market-prediction-lab/scripts/audit-crypto-futures-v49-bitget-actual-funding-v411.py \
            --v49-events "$EVENTS" \
            --v49-summary "$SUMMARY" \
            --out-dir market-prediction-lab/docs/crypto-futures-v49-bitget-actual-funding-v411

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-v49-bitget-actual-funding-v411-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-v49-bitget-actual-funding-v411
          if-no-files-found: error
          retention-days: 14
