name: Stock Dual Momentum V1

on:
  push:
    branches:
      - research/four-market-profitability-scan-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-stock-dual-momentum-v1.js
      - .github/workflows/stock-dual-momentum-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run fixed dual momentum on KR and US
        run: node market-prediction-lab/scripts/run-stock-dual-momentum-v1.js
      - name: Verify safety and formula contract
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const d=JSON.parse(await readFile("market-prediction-lab/artifacts/stock-dual-momentum-v1/result.json","utf8"));
          if(d.status!=="pass"||d.researchOnly!==true||d.publicDataOnly!==true||d.actualOrders!==0||d.formula.topN!==3||d.formula.rebalanceTradingDays!==21) process.exit(1);
          console.log("STOCK_DUAL_MOMENTUM_CONTRACT=PASS");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stock-dual-momentum-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/stock-dual-momentum-v1/
          if-no-files-found: error
          retention-days: 30
