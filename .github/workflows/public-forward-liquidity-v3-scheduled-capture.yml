name: Public Forward Liquidity V3 Scheduled Canonical Capture

on:
  pull_request:
    paths:
      - '.github/workflows/public-forward-liquidity-v3-scheduled-capture.yml'
      - 'market-intelligence-sidecar/src/public-forward-liquidity-v3-scheduled-capture-seam.mjs'
      - 'market-intelligence-sidecar/scripts/run-public-forward-liquidity-v3-scheduled-capture.mjs'
      - 'market-intelligence-sidecar/scripts/finalize-public-forward-liquidity-v3-attempt-receipt.mjs'
      - 'market-intelligence-sidecar/scripts/invalidate-public-forward-liquidity-v3-attempt-receipt.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-v3-scheduled-capture-seam.test.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-v3-activation-contract.test.mjs'
      - 'market-intelligence-sidecar/contracts/public-forward-liquidity-v3-activation-contract.json'
  schedule:
    - cron: '13,43 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: public-forward-liquidity-v3-scheduled-canonical-capture
  cancel-in-progress: false

env:
  V3_POLICY_RUN_ID: '33279242015'
  V3_POLICY_ARTIFACT_ID: '9722465890'
  V3_POLICY_ARTIFACT_NAME: public-forward-liquidity-prospective-policy-v3-43b15ea7cb4edfc84ce7e3055e6b8d7e5443c0f6
  V3_POLICY_ARTIFACT_ZIP_DIGEST: 476b302eb38d8b17c30d4f3ed0d97f87fd16118d5b201cc03d9aff4b26b8eb7a
  V3_POLICY_ARTIFACT_PATH: v3-policy/public-forward-liquidity-prospective-policy-v3/prospective-policy-artifact-v3.json
  CAPTURE_OUTPUT_DIR: public-forward-liquidity-v3-scheduled-capture

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify seam syntax and dry contract tests
        shell: bash
        env:
          MANUAL_CAPTURE_WORKFLOW_PATH: .github/workflows/public-forward-liquidity-calibration-capture.yml
        run: |
          set -euo pipefail
          node --check market-intelligence-sidecar/src/public-forward-liquidity-v3-scheduled-capture-seam.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-v3-scheduled-capture.mjs
          node --check market-intelligence-sidecar/scripts/finalize-public-forward-liquidity-v3-attempt-receipt.mjs
          node --check market-intelligence-sidecar/scripts/invalidate-public-forward-liquidity-v3-attempt-receipt.mjs
          node --test \
            market-intelligence-sidecar/tests/public-forward-liquidity-v3-scheduled-capture-seam.test.mjs \
            market-intelligence-sidecar/tests/public-forward-liquidity-v3-activation-contract.test.mjs

      - name: Verify default-branch execution boundary and manual regression
        shell: bash
        run: |
          set -euo pipefail
          SCHEDULED='.github/workflows/public-forward-liquidity-v3-scheduled-capture.yml'
          MANUAL='.github/workflows/public-forward-liquidity-calibration-capture.yml'
          grep -Fq "cron: '13,43 * * * *'" "$SCHEDULED"
          grep -Fq "if: github.event_name == 'schedule'" "$SCHEDULED"
          grep -Fq 'workflow_dispatch:' "$MANUAL"
          if grep -Eq '^[[:space:]]+schedule:' "$MANUAL"; then
            echo 'Manual workflow must remain unscheduled.' >&2
            exit 1
          fi
          grep -Fq "triggerSource: 'MANUAL_WORKFLOW_DISPATCH'" "$MANUAL"
          grep -Fq 'collectBitgetForwardLiquidityObservationBatch' "$MANUAL"
          grep -Fq "executionAuthority: 'NONE'" "$MANUAL"
          grep -Fq 'privateApiUsed: false' "$MANUAL"
          grep -Fq 'liveTrading: false' "$MANUAL"
          grep -Fq 'orderSubmitted: false' "$MANUAL"

  scheduled-capture:
    if: github.event_name == 'schedule'
    needs: verify-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact default-branch scheduled revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine exact-main state at attempt start
        id: main_start
        shell: bash
        run: |
          set -euo pipefail
          exact=true
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then exact=false; fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then exact=false; fi
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then exact=false; fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Read immutable V3 policy artifact metadata
        id: policy_metadata
        uses: actions/github-script@v7
        with:
          script: |
            const artifactId = Number(process.env.V3_POLICY_ARTIFACT_ID);
            const { data } = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });
            core.setOutput('digest', String(data.digest || ''));
            core.setOutput('name', String(data.name || ''));
            core.setOutput('expired', String(Boolean(data.expired)));

      - name: Download exact immutable V3 policy artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V3_POLICY_ARTIFACT_NAME }}
          path: v3-policy
          repository: ${{ github.repository }}
          run-id: ${{ env.V3_POLICY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Resolve run creation time and prior scheduled attempts
        id: run_meta
        uses: actions/github-script@v7
        with:
          script: |
            const { data: current } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'public-forward-liquidity-v3-scheduled-capture.yml',
              event: 'schedule',
              per_page: 100,
            });
            const prior = runs
              .filter((run) => run.id !== context.runId && run.id < context.runId)
              .map((run) => ({
                runId: String(run.id),
                runAttempt: Number(run.run_attempt || 1),
                createdAtMs: Date.parse(run.created_at),
                status: run.status,
                conclusion: run.conclusion,
              }))
              .filter((run) => Number.isInteger(run.createdAtMs));
            core.setOutput('run_created_at_ms', String(Date.parse(current.created_at)));
            core.setOutput('prior_runs_json', JSON.stringify(prior));

      - name: Produce canonical scheduled attempt and immutable receipt payload
        id: capture
        shell: bash
        env:
          EXACT_MAIN_SHA: ${{ github.sha }}
          MAIN_EXACT_AT_START: ${{ steps.main_start.outputs.exact }}
          RUN_CREATED_AT_MS: ${{ steps.run_meta.outputs.run_created_at_ms }}
          PRIOR_SCHEDULE_RUNS_JSON: ${{ steps.run_meta.outputs.prior_runs_json }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          POLICY_ARTIFACT_METADATA_DIGEST: ${{ steps.policy_metadata.outputs.digest }}
          OUTPUT_DIR: ${{ env.CAPTURE_OUTPUT_DIR }}
          V3_POLICY_ARTIFACT_PATH: ${{ env.V3_POLICY_ARTIFACT_PATH }}
        run: |
          set -euo pipefail
          node market-intelligence-sidecar/scripts/run-public-forward-liquidity-v3-scheduled-capture.mjs

      - name: Reverify main remained exact through capture
        id: main_end
        shell: bash
        run: |
          set -euo pipefail
          exact=true
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then exact=false; fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Fail closed receipt if main moved during capture
        if: steps.main_end.outputs.exact != 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_OUTPUT_DIR }}
          INVALIDATION_BLOCKER: DEFAULT_BRANCH_MOVED_DURING_CAPTURE
        run: node market-intelligence-sidecar/scripts/invalidate-public-forward-liquidity-v3-attempt-receipt.mjs

      - name: Upload immutable scheduled attempt payload
        id: attempt_upload
        uses: actions/upload-artifact@v4
        with:
          name: public-forward-liquidity-v3-scheduled-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Bind attempt receipt to exact GitHub artifact identity
        shell: bash
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_OUTPUT_DIR }}
          ARTIFACT_ID: ${{ steps.attempt_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.attempt_upload.outputs.artifact-digest }}
          ARTIFACT_NAME: public-forward-liquidity-v3-scheduled-attempt-${{ github.run_id }}-${{ github.run_attempt }}
        run: node market-intelligence-sidecar/scripts/finalize-public-forward-liquidity-v3-attempt-receipt.mjs

      - name: Upload finalized immutable artifact-bound attempt receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-forward-liquidity-v3-scheduled-attempt-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_OUTPUT_DIR }}/artifact-bound-attempt-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce truthful workflow terminal status
        shell: bash
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_OUTPUT_DIR }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const outcome = JSON.parse(await readFile(`${process.env.OUTPUT_DIR}/capture-outcome.json`, 'utf8'));
          console.log(JSON.stringify(outcome));
          if (outcome.workflowFailure === true) process.exit(1);
          NODE
