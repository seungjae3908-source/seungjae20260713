name: ROOM B 780 Missing Observation Seam Remediation

# retrigger after workflow exists on the PR branch
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/room-b-780-missing-observation-seam-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.event.pull_request.number == 780 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed missing-seam guard and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('market-prediction-lab/src/paper-scheduler-driver-v1.js')
          text = source.read_text()
          old = '''    if (positionObservationHandoff.status === "BLOCKED_DATA") {
      return Object.freeze({
        status: "BLOCKED_DATA",
        cycleId: cycle.cycleId,
        mutationCount: 0,
        blockers: Object.freeze([Object.freeze({
          market: "POSITION_OBSERVATION",
          reason: "BLOCKED_DATA",
          details: positionObservationHandoff.blockers,
        })]),
        evidenceEvaluatedAtMs,
        positionObservationHandoff,
        safety: PAPER_SCHEDULER_CONTRACT,
      });
    }
'''
          new = '''    const missingObservationSeamForOpenPosition = positionObservationHandoff.status === "MISSING"
      && Number.isInteger(positionObservationHandoff.openPositionCount)
      && positionObservationHandoff.openPositionCount > 0;
    if (positionObservationHandoff.status === "BLOCKED_DATA" || missingObservationSeamForOpenPosition) {
      return Object.freeze({
        status: "BLOCKED_DATA",
        cycleId: cycle.cycleId,
        mutationCount: 0,
        blockers: Object.freeze([Object.freeze({
          market: "POSITION_OBSERVATION",
          reason: "BLOCKED_DATA",
          details: missingObservationSeamForOpenPosition
            ? Object.freeze(["POSITION_OBSERVATIONS_MISSING_FOR_OPEN_POSITION"])
            : positionObservationHandoff.blockers,
        })]),
        evidenceEvaluatedAtMs,
        positionObservationHandoff,
        safety: PAPER_SCHEDULER_CONTRACT,
      });
    }
'''
          if text.count(old) != 1:
              raise SystemExit('MISSING_SEAM_SOURCE_MATCH_COUNT_INVALID')
          source.write_text(text.replace(old, new, 1))

          test_file = Path('market-prediction-lab/tests/paper-scheduler-driver-v1.test.js')
          tests = test_file.read_text()
          marker = 'test("two concurrent invocations elect one owner and the loser performs zero mutation", async (t) => {'
          if tests.count(marker) != 1:
              raise SystemExit('MISSING_SEAM_TEST_MARKER_COUNT_INVALID')
          regression = '''test("an open Position fails closed when the Position observation seam is missing", async (t) => {
            const { calls, options } = await harness(t, {
              state: {
                identityFingerprint: "paper-identity-v1",
                positions: [{ market: "CRYPTO_FUTURES" }],
              },
            });
            const result = await runScheduledPaperCycle(options);
            assert.equal(result.status, "BLOCKED_DATA");
            assert.equal(result.mutationCount, 0);
            assert.equal(result.positionObservationHandoff.status, "MISSING");
            assert.equal(result.positionObservationHandoff.openPositionCount, 1);
            assert.deepEqual(result.blockers[0].details, ["POSITION_OBSERVATIONS_MISSING_FOR_OPEN_POSITION"]);
            assert.equal(calls.length, 0);
          });

          '''
          test_file.write_text(tests.replace(marker, regression + marker, 1))
          PY

          git diff --check
          node --check market-prediction-lab/src/paper-scheduler-driver-v1.js
          node --check market-prediction-lab/tests/paper-scheduler-driver-v1.test.js
          node --test market-prediction-lab/tests/paper-scheduler-driver-v1.test.js

      - name: Commit exact bounded remediation to existing PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            market-prediction-lab/src/paper-scheduler-driver-v1.js \
            market-prediction-lab/tests/paper-scheduler-driver-v1.test.js
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'fix(paper): block open Position when observation seam is missing'
          git push origin "HEAD:${HEAD_REF}"
