name: Cancel Misdirected Telegram Release

on:
  push:
    branches:
      - agent/telegram-production-release-gate
    paths:
      - .github/workflows/cancel-misdirected-telegram-release.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-exact-runs:
    name: Cancel exact misdirected Telegram release runs
    if: >-
      github.repository == 'seungjae3908-source/seungjae20260713' &&
      github.actor == 'seungjae3908-source' &&
      github.ref == 'refs/heads/agent/telegram-production-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the exact unintended release chain
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = '6535f12a70108a1784a108536dcd1763fb155525';
            const targets = [
              { id: 31866528020, name: 'Production Deploy', path: '.github/workflows/production-deploy.yml' },
              { id: 31865899733, name: 'Telegram Production Release', path: '.github/workflows/telegram-production-release.yml' },
              { id: 31865944338, name: 'Telegram Production Release', path: '.github/workflows/telegram-production-release.yml' },
              { id: 31866005410, name: 'Telegram Production Release', path: '.github/workflows/telegram-production-release.yml' },
            ];

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== targetSha) {
              core.setFailed(`Main moved; refusing broad cancellation: expected=${targetSha} actual=${main.data.commit.sha}`);
              return;
            }

            for (const target of targets) {
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: target.id });
              const run = response.data;
              const identityMatches = run.id === target.id
                && run.name === target.name
                && run.path === target.path
                && run.head_branch === 'main'
                && run.head_sha === targetSha;
              if (!identityMatches) {
                core.setFailed(`Run identity mismatch for ${target.id}; cancellation aborted.`);
                return;
              }
            }

            for (const target of targets) {
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: target.id });
              if (response.data.status === 'completed') {
                core.info(`Run ${target.id} already completed as ${response.data.conclusion}; no cancellation request needed.`);
                continue;
              }
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: target.id });
              core.info(`Cancellation requested for ${target.name} Run ${target.id}.`);
            }

            const deadline = Date.now() + 90000;
            const unresolved = new Set(targets.map((target) => target.id));
            while (Date.now() < deadline && unresolved.size > 0) {
              for (const id of [...unresolved]) {
                const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id });
                if (response.data.status === 'completed') {
                  core.info(`Run ${id} completed as ${response.data.conclusion}.`);
                  unresolved.delete(id);
                }
              }
              if (unresolved.size > 0) await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            for (const id of [...unresolved]) {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                owner,
                repo,
                run_id: id,
              });
              core.info(`Force-cancel requested for unresolved Run ${id}.`);
            }

            if (unresolved.size > 0) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              for (const id of unresolved) {
                const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id });
                if (response.data.status !== 'completed') {
                  core.setFailed(`Run ${id} remained ${response.data.status} after cancellation.`);
                  return;
                }
              }
            }

            core.info('All exact unintended Telegram/Production workflow runs are completed or cancelled.');
