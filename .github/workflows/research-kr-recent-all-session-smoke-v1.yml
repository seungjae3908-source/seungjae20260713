name: Research KR Recent All-Session Smoke V1
# rerun after prior-session opening-context fix

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-kr-recent-all-session-smoke-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-kr-recent-all-session-opportunity-miner-v1.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "polars>=1.30,<2" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1" "finance-datareader>=0.9,<1" "yfinance>=0.2,<1"
      - name: Run 30-symbol end-to-end smoke
        run: |
          python market-prediction-lab/scripts/run-kr-recent-all-session-opportunity-miner-v1.py \
            --max-symbols 30 \
            --out-dir market-prediction-lab/docs/kr-recent-all-session-smoke-v1
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-recent-all-session-smoke-v1-${{ github.sha }}
          path: market-prediction-lab/docs/kr-recent-all-session-smoke-v1
          if-no-files-found: error
          retention-days: 14
