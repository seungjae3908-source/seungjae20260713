name: UI vNext Functional Preview

on:
  push:
    branches:
      - drift/ui-vnext-functional-preview-20261001
    paths:
      - stock-analyzer/**
      - .github/workflows/ui-vnext-functional-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-vnext-functional-preview
  cancel-in-progress: true

jobs:
  build-and-publish-preview:
    name: Build real app UI and publish isolated preview path
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
      LIVE_DIR: /opt/stock-app
      PREVIEW_SUBPATH: /ui-vnext-preview/
      PREVIEW_URL: https://lsj119.com/ui-vnext-preview/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify preview-only contract
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const runtime = fs.readFileSync('stock-analyzer/src/app-runtime.tsx', 'utf8');
          const authFetch = fs.readFileSync('stock-analyzer/src/lib/auth-fetch.ts', 'utf8');
          const css = fs.readFileSync('stock-analyzer/src/ui-vnext-preview.css', 'utf8');
          if (!runtime.includes("VITE_UI_VNEXT_PREVIEW === 'true'")) throw new Error('preview runtime flag missing');
          if (!runtime.includes("import './ui-vnext-preview.css'")) throw new Error('preview stylesheet missing');
          if (!authFetch.includes('UI_VNEXT_PREVIEW_FINANCIAL_MUTATION_BLOCKED')) throw new Error('preview mutation guard missing');
          if (!css.includes("[data-testid='unified-analysis-chart']")) throw new Error('real chart styling contract missing');
          NODE

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Build branch UI against existing production read APIs
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q LIVE_DIR=%q PREVIEW_SUBPATH=%q' \
            "$TARGET_SHA" "$REPOSITORY_URL" "$LIVE_DIR" "$PREVIEW_SUBPATH")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          SOURCE_DIR="$(mktemp -d /tmp/ui-vnext-preview-source.XXXXXX)"
          PREVIEW_NAME="${PREVIEW_SUBPATH#/}"
          PREVIEW_NAME="${PREVIEW_NAME%/}"
          DEST_ROOT="$LIVE_DIR/stock-analyzer/dist/public"
          DEST="$DEST_ROOT/$PREVIEW_NAME"
          NEXT="$DEST_ROOT/.${PREVIEW_NAME}.next"
          PREV="$DEST_ROOT/.${PREVIEW_NAME}.prev"

          cleanup() {
            rm -rf -- "$SOURCE_DIR" "$NEXT"
          }
          trap cleanup EXIT

          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          RESOLVED="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})"
          [[ "$RESOLVED" == "$TARGET_SHA" ]] || { echo 'Preview SHA mismatch' >&2; exit 10; }
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"

          for relative_env in \
            .env \
            .env.production \
            stock-analyzer/.env \
            stock-analyzer/.env.production; do
            source_env="$LIVE_DIR/$relative_env"
            target_env="$SOURCE_DIR/$relative_env"
            if [[ -f "$source_env" && ! -e "$target_env" ]]; then
              mkdir -p "$(dirname "$target_env")"
              ln -s "$source_env" "$target_env"
            fi
          done

          (
            cd "$SOURCE_DIR"
            pnpm install --frozen-lockfile
            BASE_PATH="$PREVIEW_SUBPATH" \
            VITE_UI_VNEXT_PREVIEW=true \
            NODE_ENV=production \
            pnpm --filter @workspace/stock-analyzer run typecheck
            BASE_PATH="$PREVIEW_SUBPATH" \
            VITE_UI_VNEXT_PREVIEW=true \
            NODE_ENV=production \
            pnpm --filter @workspace/stock-analyzer run build
          )

          [[ -f "$SOURCE_DIR/stock-analyzer/dist/public/index.html" ]] || {
            echo 'Preview frontend build output missing' >&2
            exit 11
          }

          mkdir -p "$NEXT"
          cp -a "$SOURCE_DIR/stock-analyzer/dist/public/." "$NEXT/"
          rm -f "$NEXT/sw.js" "$NEXT/registerSW.js"

          rm -rf "$PREV"
          if [[ -d "$DEST" ]]; then mv "$DEST" "$PREV"; fi
          mv "$NEXT" "$DEST"
          rm -rf "$PREV"

          test -f "$DEST/index.html"
          grep -q '/ui-vnext-preview/' "$DEST/index.html"
          echo "[preview] published exact SHA $TARGET_SHA to $DEST"
          echo "[preview] production app root and PM2 process were not changed"
          REMOTE

      - name: Verify isolated preview URL
        run: |
          set -Eeuo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error --max-time 20 "$PREVIEW_URL" > "$body"
          grep -qi '<div id="root"' "$body"
          {
            echo '## UI vNext functional preview ready'
            echo
            echo "- Exact branch SHA: \`$TARGET_SHA\`"
            echo "- Preview: $PREVIEW_URL"
            echo '- Production root application replaced: `false`'
            echo '- PM2 restart/reload: `false`'
            echo '- Database / Secret / Env mutation: `false`'
            echo '- Trade automation mutating requests from preview UI: `blocked client-side`'
            echo '- Replit / Replit Agent: `not used`'
          } >> "$GITHUB_STEP_SUMMARY"
