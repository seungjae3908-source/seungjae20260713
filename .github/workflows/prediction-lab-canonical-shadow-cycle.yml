name: Canonical Prediction Lab Shadow Cycle

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prediction-lab-canonical-shadow-cycle.yml
      - .github/workflows/prediction-lab-canonical-shadow-publisher.yml
      - market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js
      - market-prediction-lab/tests/canonical-shadow-runtime-activation-v1.test.js
      - market-prediction-lab/src/canonical-shadow-runtime-cutover-v1.js
      - market-prediction-lab/src/shadow-state-root-transport-v1.js
      - market-prediction-lab/src/shadow-evidence-handoff-v1.js
      - market-prediction-lab/src/canonical-shadow-drift-policy-v1.js
      - market-prediction-lab/scripts/run-shadow-cycle.js
  schedule:
    - cron: '17 * * * *'
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read
  statuses: read

concurrency:
  group: prediction-lab-canonical-shadow-cycle-v1
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate activation and transport contracts
        working-directory: market-prediction-lab
        run: >-
          node --test
          tests/canonical-shadow-runtime-activation-v1.test.js
          tests/canonical-shadow-runtime-cutover-v1.test.js
          tests/canonical-shadow-drift-policy-v1.test.js
          tests/shadow-evidence-handoff-v1.test.js
          tests/shadow-state-root-transport-v1.test.js
      - name: Assert PR validation cannot activate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q "LEGACY_ACTIVE_CANONICAL_DORMANT" market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js
          grep -q "canonicalRuntimeRequestId" .github/workflows/prediction-lab-canonical-shadow-cycle.yml
          grep -q "workflow_run" .github/workflows/prediction-lab-canonical-shadow-publisher.yml

  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
      request_id: ${{ steps.gate.outputs.request_id }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Gate exact-main activation or active canonical schedule
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const main = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            const mainSha = String(main.data.commit.sha).toLowerCase();
            const legacy = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'prediction-lab-shadow-hourly.yml',
            });
            let targetSha = mainSha;
            let requestId = '';
            let mode = '';
            if (context.eventName === 'schedule') {
              if (legacy.data.state !== 'disabled_manually') {
                core.info(`Canonical schedule dormant while legacy workflow state=${legacy.data.state}`);
                core.setOutput('authorized', 'false');
                return;
              }
              requestId = `hourly-${context.runId}`;
              mode = 'HOURLY';
            } else if (context.eventName === 'issue_comment') {
              if (context.payload.issue?.number !== 660 || context.payload.comment?.user?.login !== context.repo.owner) {
                core.setOutput('authorized', 'false');
                return;
              }
              const body = String(context.payload.comment?.body ?? '').trim();
              const match = body.match(/^\/activate-canonical-shadow ([0-9a-f]{40})$/);
              if (!match) {
                core.setOutput('authorized', 'false');
                return;
              }
              targetSha = match[1].toLowerCase();
              if (targetSha !== mainSha) {
                core.setFailed(`Activation target is not exact current main: target=${targetSha} main=${mainSha}`);
                return;
              }
              if (legacy.data.state === 'disabled_manually') {
                core.setFailed('Legacy Shadow is already disabled; activation command is not a retry path.');
                return;
              }
              requestId = `activate-${context.payload.comment.id}`;
              mode = 'ACTIVATION';
            } else {
              core.setOutput('authorized', 'false');
              return;
            }
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            const byRun = new Map();
            for (const status of statuses) {
              const match = String(status.target_url ?? '').match(/\/actions\/runs\/(\d+)/);
              if (!match) continue;
              const runId = match[1];
              if (!byRun.has(runId)) byRun.set(runId, new Map());
              const rows = byRun.get(runId);
              const prior = rows.get(status.context);
              if (!prior || Number(status.id) > Number(prior.id)) rows.set(status.context, status);
            }
            const coherent = [...byRun.entries()]
              .filter(([, rows]) => required.every((name) => rows.get(name)?.state === 'success'))
              .map(([runId]) => Number(runId))
              .sort((a, b) => b - a);
            if (!coherent.length) {
              core.setFailed('No coherent exact-main Required CI 6/6 SUCCESS run exists.');
              return;
            }
            core.info(`Accepted exact-main Required CI run ${coherent[0]}.`);
            core.setOutput('authorized', 'true');
            core.setOutput('target_sha', targetSha);
            core.setOutput('request_id', requestId);
            core.setOutput('mode', mode);

  shadow-cycle:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover exact Producer and canonical predecessor
        id: binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          REQUEST_ID: ${{ needs.gate.outputs.request_id }}
        run: |
          set -Eeuo pipefail
          producer_run_id=''
          while read -r run_id; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || continue
            artifact_id="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name == \"prediction-lab-model-reference-evidence-$run_id\" and .expired == false) | .id" | head -n1)"
            if [[ -n "$artifact_id" ]]; then
              producer_run_id="$run_id"
              break
            fi
          done < <(gh api "repos/$REPOSITORY/actions/workflows/prediction-lab-52d-validation.yml/runs?status=success&per_page=100" --jq '.workflow_runs[].id')
          [[ "$producer_run_id" =~ ^[1-9][0-9]*$ ]] || { echo 'No finalized canonical Producer artifact found' >&2; exit 1; }

          predecessor_run_id=''
          predecessor_digest=''
          mkdir -p "$RUNNER_TEMP/predecessor-discovery"
          while read -r run_id; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || continue
            metadata="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact_id="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=process.env.RUN;const a=j.artifacts.find(x=>x.name===`prediction-lab-shadow-cycle-${r}`&&!x.expired);if(a)process.stdout.write(String(a.id));})' RUN="$run_id")"
            [[ -n "$artifact_id" ]] || continue
            candidate="$RUNNER_TEMP/predecessor-discovery/$run_id"
            rm -rf "$candidate"
            mkdir -p "$candidate"
            if ! gh run download "$run_id" --repo "$REPOSITORY" -n "prediction-lab-shadow-cycle-$run_id" -D "$candidate" >/dev/null 2>&1; then
              continue
            fi
            provenance="$(find "$candidate" -type f -name shadow-cycle-provenance.json -print -quit)"
            [[ -f "$provenance" ]] || continue
            candidate_producer="$(node -p "String(require(process.argv[1]).producerRunId ?? '')" "$provenance")"
            candidate_request="$(node -p "String(require(process.argv[1]).canonicalRuntimeRequestId ?? '')" "$provenance")"
            candidate_sha="$(node -p "String(require(process.argv[1]).researchCodeSha ?? '')" "$provenance")"
            [[ "$candidate_producer" == "$producer_run_id" ]] || continue
            [[ "$candidate_request" =~ ^(activate|hourly)-[1-9][0-9]*$ ]] || continue
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=100 origin "$candidate_sha" >/dev/null 2>&1 || continue
            if git merge-base --is-ancestor "$candidate_sha" "$TARGET_SHA"; then
              predecessor_run_id="$run_id"
              predecessor_digest="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=process.env.RUN;const a=j.artifacts.find(x=>x.name===`prediction-lab-shadow-cycle-${r}`&&!x.expired);if(a)process.stdout.write(String(a.digest??""));})' RUN="$run_id")"
              break
            fi
          done < <(gh api "repos/$REPOSITORY/actions/workflows/prediction-lab-canonical-shadow-cycle.yml/runs?status=success&per_page=50" --jq '.workflow_runs[].id' 2>/dev/null || true)

          if [[ -z "$predecessor_run_id" ]]; then
            seed_run='32933416612'
            seed_metadata="$(gh api "repos/$REPOSITORY/actions/runs/$seed_run/artifacts")"
            seed_digest="$(printf '%s' "$seed_metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const a=j.artifacts.find(x=>x.name==="prediction-lab-shadow-cycle-32933416612"&&!x.expired);if(a)process.stdout.write(String(a.digest??""));})')"
            node --input-type=module <<'NODE'
          import { canonicalBootstrapSeedAllowedV1 } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          const allowed = canonicalBootstrapSeedAllowedV1({
            requestId: process.env.REQUEST_ID,
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorRunId: '32933416612',
            predecessorArtifactDigest: process.env.SEED_DIGEST,
          });
          if (!allowed) process.exit(1);
          NODE
            predecessor_run_id="$seed_run"
            predecessor_digest="$seed_digest"
          fi

          echo "producer_run_id=$producer_run_id" >> "$GITHUB_OUTPUT"
          echo "predecessor_run_id=$predecessor_run_id" >> "$GITHUB_OUTPUT"
          echo "predecessor_digest=$predecessor_digest" >> "$GITHUB_OUTPUT"
        env:
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          SEED_DIGEST: ''
      - name: Validate immutable binding shape
        env:
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          PREDECESSOR_RUN_ID: ${{ steps.binding.outputs.predecessor_run_id }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { assertCanonicalRuntimeBindingShapeV1 } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          assertCanonicalRuntimeBindingShapeV1({ producerRunId: process.env.PRODUCER_RUN_ID, predecessorRunId: process.env.PREDECESSOR_RUN_ID, researchSha: process.env.TARGET_SHA });
          NODE
      - name: Download canonical Producer evidence
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-model-reference-evidence-${{ steps.binding.outputs.producer_run_id }}
          path: ${{ runner.temp }}/prediction-lab-model-reference-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.producer_run_id }}
      - name: Download exact predecessor evidence
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-shadow-cycle-${{ steps.binding.outputs.predecessor_run_id }}
          path: ${{ runner.temp }}/predecessor-shadow
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.predecessor_run_id }}
      - name: Restore exact predecessor state with one-time bootstrap exception
        env:
          PREDECESSOR_RUN_ID: ${{ steps.binding.outputs.predecessor_run_id }}
          PREDECESSOR_DIGEST: ${{ steps.binding.outputs.predecessor_digest }}
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          REQUEST_ID: ${{ needs.gate.outputs.request_id }}
          PREDECESSOR_DIR: ${{ runner.temp }}/predecessor-shadow
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, readFileSync, readdirSync } from 'node:fs';
          import { basename, join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { canonicalBootstrapSeedAllowedV1 } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          const files=[]; const walk=d=>{for(const e of readdirSync(d,{withFileTypes:true})){const p=join(d,e.name);e.isDirectory()?walk(p):files.push(p)}}; walk(process.env.PREDECESSOR_DIR);
          const one=name=>{const rows=files.filter(f=>basename(f)===name);if(rows.length!==1)throw new Error(`Expected one ${name}; found ${rows.length}`);return rows[0]};
          const stateFile=one('shadow-state.json');
          const provenance=JSON.parse(readFileSync(one('shadow-cycle-provenance.json'),'utf8'));
          if(String(provenance.runId)!==process.env.PREDECESSOR_RUN_ID) throw new Error('Predecessor run mismatch');
          if(String(provenance.producerRunId)!==process.env.PRODUCER_RUN_ID) throw new Error('Predecessor Producer mismatch');
          if(!/^[0-9a-f]{40}$/.test(String(provenance.researchCodeSha??''))) throw new Error('Invalid predecessor research SHA');
          if(provenance.researchCodeSha!==process.env.TARGET_SHA){
            const bootstrap=canonicalBootstrapSeedAllowedV1({requestId:process.env.REQUEST_ID,producerRunId:process.env.PRODUCER_RUN_ID,predecessorRunId:process.env.PREDECESSOR_RUN_ID,predecessorArtifactDigest:process.env.PREDECESSOR_DIGEST});
            if(!bootstrap){
              execFileSync('git',['merge-base','--is-ancestor',provenance.researchCodeSha,process.env.TARGET_SHA],{stdio:'inherit'});
            }
          }
          const state=JSON.parse(readFileSync(stateFile,'utf8'));
          if(!state||state.schemaVersion!==3||!state.groups||typeof state.groups!=='object') throw new Error('Invalid predecessor state');
          copyFileSync(stateFile,'market-prediction-lab/docs/shadow-state.json');
          NODE
      - name: Validate canonical shadow modules
        working-directory: market-prediction-lab
        run: >-
          node --test
          tests/derivatives-history.test.js
          tests/derivatives-normalized-compat.test.js
          tests/temporal-training-dataset.test.js
          tests/shadow-ledger.test.js
          tests/canonical-shadow-drift-policy-v1.test.js
          tests/canonical-shadow-runtime-cutover-v1.test.js
          tests/canonical-shadow-runtime-activation-v1.test.js
          tests/shadow-evidence-handoff-v1.test.js
          tests/shadow-state-root-transport-v1.test.js
      - name: Run one genuine public-data canonical shadow cycle
        id: shadow
        continue-on-error: true
        working-directory: market-prediction-lab
        env:
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          PRODUCER_EVIDENCE_ROOT: ${{ runner.temp }}/prediction-lab-model-reference-evidence
        run: node scripts/run-shadow-cycle.js docs/shadow-state.json docs/shadow-summary.json "$PRODUCER_EVIDENCE_ROOT"
      - name: Build immutable canonical runtime provenance
        if: always()
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          REQUEST_ID: ${{ needs.gate.outputs.request_id }}
          MODE: ${{ needs.gate.outputs.mode }}
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          PREDECESSOR_RUN_ID: ${{ steps.binding.outputs.predecessor_run_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const value={schemaVersion:2,researchCodeSha:process.env.TARGET_SHA,runId:process.env.GITHUB_RUN_ID,producerRunId:process.env.PRODUCER_RUN_ID,predecessorShadowRunId:process.env.PREDECESSOR_RUN_ID,canonicalRuntimeRequestId:process.env.REQUEST_ID,canonicalRuntimeMode:process.env.MODE,branchWrite:false,liveOrderAllowed:false,privateAccountRequestAllowed:false,scheduleActivated:false};
          fs.writeFileSync('market-prediction-lab/docs/shadow-cycle-provenance.json',JSON.stringify(value)+'\n',{mode:0o600});
          NODE
      - name: Build validated publication manifest
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { buildShadowArtifactPublicationManifestV1 } from './market-prediction-lab/src/shadow-state-root-transport-v1.js';
          const manifest=await buildShadowArtifactPublicationManifestV1({artifactRoot:'market-prediction-lab/docs',createdAt:new Date().toISOString()});
          await writeFile('market-prediction-lab/docs/shadow-artifact-publication-manifest.json',`${JSON.stringify(manifest,null,2)}\n`,{encoding:'utf8',mode:0o600});
          NODE
      - name: Upload terminally verifiable canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-shadow-cycle-${{ github.run_id }}
          path: |
            market-prediction-lab/docs/shadow-state.json
            market-prediction-lab/docs/shadow-summary.json
            market-prediction-lab/docs/shadow-cycle-provenance.json
            market-prediction-lab/docs/shadow-artifact-publication-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed when cycle failed
        if: always() && steps.shadow.outcome != 'success'
        run: exit 1
