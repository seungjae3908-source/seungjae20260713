name: Canonical Prediction Lab Shadow Cycle

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prediction-lab-canonical-shadow-cycle.yml
      - .github/workflows/prediction-lab-canonical-shadow-publisher.yml
      - market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js
      - market-prediction-lab/scripts/publish-canonical-shadow-artifact.js
      - market-prediction-lab/tests/canonical-shadow-runtime-activation-v1.test.js
      - market-prediction-lab/src/canonical-shadow-runtime-cutover-v1.js
      - market-prediction-lab/src/shadow-state-root-transport-v1.js
      - market-prediction-lab/src/shadow-evidence-handoff-v1.js
      - market-prediction-lab/src/canonical-shadow-drift-policy-v1.js
      - market-prediction-lab/scripts/run-shadow-cycle.js
  schedule:
    - cron: '17 * * * *'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read
  statuses: read

concurrency:
  group: prediction-lab-canonical-shadow-cycle-v1
  cancel-in-progress: false

env:
  CANONICAL_PRODUCER_RUN_ID: '32921992780'
  BOOTSTRAP_PREDECESSOR_RUN_ID: '32933416612'
  BOOTSTRAP_PREDECESSOR_DIGEST: '4604d37fbc6b8cf5c95bdb915f7a7de2e205bd3705ece148b7267d2782cebfb1'

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate activation and transport contracts
        working-directory: market-prediction-lab
        run: >-
          node --test
          tests/canonical-shadow-runtime-activation-v1.test.js
          tests/canonical-shadow-runtime-cutover-v1.test.js
          tests/canonical-shadow-drift-policy-v1.test.js
          tests/shadow-evidence-handoff-v1.test.js
          tests/shadow-state-root-transport-v1.test.js
      - name: Assert PR validation cannot activate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'LEGACY_ACTIVE_CANONICAL_DORMANT' market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js
          grep -q 'canonicalStrandedBootstrapRecoveryAllowedV1' market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js
          grep -q 'approve-canonical-shadow-recovery' .github/workflows/prediction-lab-canonical-shadow-cycle.yml
          grep -q 'canonicalRuntimeRequestId' .github/workflows/prediction-lab-canonical-shadow-cycle.yml
          grep -q 'workflow_run' .github/workflows/prediction-lab-canonical-shadow-publisher.yml

  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
      request_id: ${{ steps.gate.outputs.request_id }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Gate exact-main activation or active canonical schedule
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const main = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            const mainSha = String(main.data.commit.sha).toLowerCase();
            const legacy = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'prediction-lab-shadow-hourly.yml',
            });
            let targetSha = mainSha;
            let requestId = '';
            let mode = '';
            if (context.eventName === 'schedule') {
              if (legacy.data.state !== 'disabled_manually') {
                core.info(`Canonical schedule dormant while legacy workflow state=${legacy.data.state}`);
                core.setOutput('authorized', 'false');
                return;
              }
              requestId = `hourly-${context.runId}`;
              mode = 'HOURLY';
            } else if (context.eventName === 'issue_comment') {
              if (context.payload.issue?.number !== 660 || context.payload.comment?.user?.login !== context.repo.owner) {
                core.setOutput('authorized', 'false');
                return;
              }
              const body = String(context.payload.comment?.body ?? '').trim();
              const match = body.match(/^\/activate-canonical-shadow ([0-9a-f]{40})$/);
              if (!match) {
                core.setOutput('authorized', 'false');
                return;
              }
              targetSha = match[1].toLowerCase();
              if (targetSha !== mainSha) {
                core.setFailed(`Activation target is not exact current main: target=${targetSha} main=${mainSha}`);
                return;
              }
              if (legacy.data.state === 'disabled_manually') {
                core.setFailed('Legacy Shadow is already disabled; activation command is not a retry path.');
                return;
              }
              requestId = `activate-${context.payload.comment.id}`;
              mode = 'ACTIVATION';
            } else {
              core.setOutput('authorized', 'false');
              return;
            }

            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            const byRun = new Map();
            for (const status of statuses) {
              const runMatch = String(status.target_url ?? '').match(/\/actions\/runs\/(\d+)/);
              if (!runMatch) continue;
              const runId = runMatch[1];
              if (!byRun.has(runId)) byRun.set(runId, new Map());
              const rows = byRun.get(runId);
              const prior = rows.get(status.context);
              if (!prior || Number(status.id) > Number(prior.id)) rows.set(status.context, status);
            }
            const coherent = [...byRun.entries()]
              .filter(([, rows]) => required.every((name) => rows.get(name)?.state === 'success'))
              .map(([runId]) => Number(runId))
              .sort((a, b) => b - a);
            if (!coherent.length) {
              core.setFailed('No coherent exact-main Required CI 6/6 SUCCESS run exists.');
              return;
            }
            core.info(`Accepted exact-main Required CI run ${coherent[0]}.`);
            core.setOutput('authorized', 'true');
            core.setOutput('target_sha', targetSha);
            core.setOutput('request_id', requestId);
            core.setOutput('mode', mode);

  shadow-cycle:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert merged Canonical Shadow and Strategy Health ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.gate.outputs.target_sha }}"
          git merge-base --is-ancestor 5a2615dc1ff69c121e0c326ea52513d4d533acbe HEAD
          git merge-base --is-ancestor 9ba7c519f92c9743de69de48020be74c9d6ba044 HEAD
      - name: Resolve exact Producer and last published canonical predecessor
        id: binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          REQUEST_ID: ${{ needs.gate.outputs.request_id }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -Eeuo pipefail
          producer_run_id="$CANONICAL_PRODUCER_RUN_ID"
          bootstrap_recovery='false'
          publication_receipt_count=''
          recovery_approval_id=''
          recovery_approval_target_sha=''
          legacy_state=''

          producer_run="$(gh api "repos/$REPOSITORY/actions/runs/$producer_run_id")"
          [[ "$(printf '%s' "$producer_run" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).conclusion??"")))')" == 'success' ]]
          producer_artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$producer_run_id/artifacts")"
          producer_artifact_id="$(printf '%s' "$producer_artifacts" | PRODUCER_RUN_ID="$producer_run_id" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=process.env.PRODUCER_RUN_ID;const a=j.artifacts.find(x=>x.name===`prediction-lab-model-reference-evidence-${r}`&&!x.expired);if(a)process.stdout.write(String(a.id));})')"
          [[ "$producer_artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Canonical Producer artifact missing or expired' >&2; exit 1; }

          if [[ "$MODE" == 'ACTIVATION' ]]; then
            predecessor_run_id="$BOOTSTRAP_PREDECESSOR_RUN_ID"
            predecessor_artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$predecessor_run_id/artifacts")"
            predecessor_digest="$(printf '%s' "$predecessor_artifacts" | PREDECESSOR_RUN_ID="$predecessor_run_id" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=process.env.PREDECESSOR_RUN_ID;const a=j.artifacts.find(x=>x.name===`prediction-lab-shadow-cycle-${r}`&&!x.expired);if(a)process.stdout.write(String(a.digest??""));})')"
            [[ "${predecessor_digest#sha256:}" == "$BOOTSTRAP_PREDECESSOR_DIGEST" ]] || { echo 'Exact bootstrap artifact digest mismatch' >&2; exit 1; }
            REQUEST_ID="$REQUEST_ID" PRODUCER_RUN_ID="$producer_run_id" PREDECESSOR_RUN_ID="$predecessor_run_id" PREDECESSOR_DIGEST="$predecessor_digest" node --input-type=module <<'NODE'
          import { canonicalBootstrapSeedAllowedV1 } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          if (!canonicalBootstrapSeedAllowedV1({
            requestId: process.env.REQUEST_ID,
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorRunId: process.env.PREDECESSOR_RUN_ID,
            predecessorArtifactDigest: process.env.PREDECESSOR_DIGEST,
          })) process.exit(1);
          NODE
          else
            legacy_state="$(gh api "repos/$REPOSITORY/actions/workflows/prediction-lab-shadow-hourly.yml" --jq '.state')"
            [[ "$legacy_state" == 'disabled_manually' ]] || { echo "Canonical hourly binding rejected while legacy workflow state=$legacy_state" >&2; exit 1; }

            predecessor_run_id=''
            predecessor_digest=''
            mkdir -p "$RUNNER_TEMP/canonical-publication-receipts"
            while read -r publisher_run_id; do
              [[ "$publisher_run_id" =~ ^[1-9][0-9]*$ ]] || continue
              receipt_root="$RUNNER_TEMP/canonical-publication-receipts/$publisher_run_id"
              rm -rf "$receipt_root"
              mkdir -p "$receipt_root"
              if ! gh run download "$publisher_run_id" --repo "$REPOSITORY" -p 'canonical-shadow-publication-receipt-*' -D "$receipt_root" >/dev/null 2>&1; then
                continue
              fi
              receipt="$(find "$receipt_root" -type f -name publication-receipt.json -print -quit)"
              [[ -f "$receipt" ]] || continue
              candidate_producer="$(node -p "String(require(process.argv[1]).producerRunId ?? '')" "$receipt")"
              candidate_source_run="$(node -p "String(require(process.argv[1]).sourceRunId ?? '')" "$receipt")"
              candidate_sha="$(node -p "String(require(process.argv[1]).sourceHeadSha ?? '')" "$receipt")"
              candidate_digest="$(node -p "String(require(process.argv[1]).sourceArtifactDigest ?? '')" "$receipt")"
              candidate_status="$(node -p "String(require(process.argv[1]).status ?? '')" "$receipt")"
              [[ "$candidate_status" == 'PUBLISHED' || "$candidate_status" == 'DUPLICATE_ARTIFACT' ]] || continue
              [[ "$candidate_producer" == "$producer_run_id" ]] || continue
              [[ "$candidate_source_run" =~ ^[1-9][0-9]*$ ]] || continue
              [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=100 origin "$candidate_sha" >/dev/null 2>&1 || continue
              git merge-base --is-ancestor "$candidate_sha" "$TARGET_SHA" || continue
              source_artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$candidate_source_run/artifacts")"
              current_digest="$(printf '%s' "$source_artifacts" | SOURCE_RUN_ID="$candidate_source_run" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=process.env.SOURCE_RUN_ID;const a=j.artifacts.find(x=>x.name===`prediction-lab-shadow-cycle-${r}`&&!x.expired);if(a)process.stdout.write(String(a.digest??""));})')"
              [[ -n "$current_digest" && "${current_digest#sha256:}" == "${candidate_digest#sha256:}" ]] || continue
              predecessor_run_id="$candidate_source_run"
              predecessor_digest="$current_digest"
              break
            done < <(gh api "repos/$REPOSITORY/actions/workflows/prediction-lab-canonical-shadow-publisher.yml/runs?status=success&per_page=100" --jq '.workflow_runs[].id')

            if [[ ! "$predecessor_run_id" =~ ^[1-9][0-9]*$ ]]; then
              receipt_index="$RUNNER_TEMP/canonical-publication-receipt-index.tsv"
              gh api --paginate "repos/$REPOSITORY/actions/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name | startswith("canonical-shadow-publication-receipt-")) | [.id, .expired, .created_at, .workflow_run.id, .name] | @tsv' \
                > "$receipt_index"
              publication_receipt_count="$(wc -l < "$receipt_index" | tr -d '[:space:]')"
              [[ "$publication_receipt_count" =~ ^[0-9]+$ ]]
              if [[ "$publication_receipt_count" != '0' ]]; then
                echo "Canonical publication receipt history exists but no valid predecessor is usable; fail closed instead of bootstrap recovery" >&2
                exit 1
              fi

              comments_json="$(gh api --paginate --slurp "repos/$REPOSITORY/issues/838/comments?per_page=100")"
              recovery_approval_id="$(printf '%s' "$comments_json" | RECOVERY_OWNER="${REPOSITORY%%/*}" RECOVERY_TARGET_SHA="$TARGET_SHA" node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const pages=JSON.parse(s);const rows=pages.flat();
                  const expected=`/approve-canonical-shadow-recovery ${process.env.RECOVERY_TARGET_SHA}`;
                  const matches=rows.filter(x=>x?.user?.login===process.env.RECOVERY_OWNER&&String(x?.body??"").trim()===expected)
                    .sort((a,b)=>Number(b.id)-Number(a.id));
                  if(matches[0])process.stdout.write(String(matches[0].id));
                });')"
              [[ "$recovery_approval_id" =~ ^[1-9][0-9]*$ ]] || {
                echo "No successfully published canonical predecessor receipt found; exact #838 approval /approve-canonical-shadow-recovery $TARGET_SHA is required" >&2
                exit 1
              }
              recovery_approval_target_sha="$TARGET_SHA"

              predecessor_run_id="$BOOTSTRAP_PREDECESSOR_RUN_ID"
              predecessor_artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$predecessor_run_id/artifacts")"
              predecessor_digest="$(printf '%s' "$predecessor_artifacts" | PREDECESSOR_RUN_ID="$predecessor_run_id" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=process.env.PREDECESSOR_RUN_ID;const a=j.artifacts.find(x=>x.name===`prediction-lab-shadow-cycle-${r}`&&!x.expired);if(a)process.stdout.write(String(a.digest??""));})')"
              [[ "${predecessor_digest#sha256:}" == "$BOOTSTRAP_PREDECESSOR_DIGEST" ]] || { echo 'Exact stranded-recovery bootstrap artifact digest mismatch' >&2; exit 1; }

              if ! REQUEST_ID="$REQUEST_ID" \
                RECOVERY_APPROVAL_ID="$recovery_approval_id" \
                RECOVERY_APPROVAL_TARGET_SHA="$recovery_approval_target_sha" \
                TARGET_SHA="$TARGET_SHA" \
                LEGACY_STATE="$legacy_state" \
                PUBLICATION_RECEIPT_COUNT="$publication_receipt_count" \
                PRODUCER_RUN_ID="$producer_run_id" \
                PREDECESSOR_RUN_ID="$predecessor_run_id" \
                PREDECESSOR_DIGEST="$predecessor_digest" \
                node --input-type=module <<'NODE'
          import { canonicalStrandedBootstrapRecoveryAllowedV1 } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          if (!canonicalStrandedBootstrapRecoveryAllowedV1({
            requestId: process.env.REQUEST_ID,
            recoveryApprovalCommentId: process.env.RECOVERY_APPROVAL_ID,
            recoveryApprovalTargetSha: process.env.RECOVERY_APPROVAL_TARGET_SHA,
            targetSha: process.env.TARGET_SHA,
            legacyWorkflowState: process.env.LEGACY_STATE,
            publishedReceiptCount: process.env.PUBLICATION_RECEIPT_COUNT,
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorRunId: process.env.PREDECESSOR_RUN_ID,
            predecessorArtifactDigest: process.env.PREDECESSOR_DIGEST,
          })) process.exit(1);
          NODE
              then
                echo 'Stranded bootstrap recovery guard rejected the candidate' >&2
                exit 1
              fi
              bootstrap_recovery='true'
            fi
          fi

          echo "producer_run_id=$producer_run_id" >> "$GITHUB_OUTPUT"
          echo "predecessor_run_id=$predecessor_run_id" >> "$GITHUB_OUTPUT"
          echo "predecessor_digest=$predecessor_digest" >> "$GITHUB_OUTPUT"
          echo "bootstrap_recovery=$bootstrap_recovery" >> "$GITHUB_OUTPUT"
          echo "publication_receipt_count=$publication_receipt_count" >> "$GITHUB_OUTPUT"
          echo "recovery_approval_id=$recovery_approval_id" >> "$GITHUB_OUTPUT"
          echo "recovery_approval_target_sha=$recovery_approval_target_sha" >> "$GITHUB_OUTPUT"
          echo "legacy_state=$legacy_state" >> "$GITHUB_OUTPUT"
      - name: Validate immutable binding shape
        env:
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          PREDECESSOR_RUN_ID: ${{ steps.binding.outputs.predecessor_run_id }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { assertCanonicalRuntimeBindingShapeV1 } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          assertCanonicalRuntimeBindingShapeV1({
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorRunId: process.env.PREDECESSOR_RUN_ID,
            researchSha: process.env.TARGET_SHA,
          });
          NODE
      - name: Download canonical Producer evidence
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-model-reference-evidence-${{ steps.binding.outputs.producer_run_id }}
          path: ${{ runner.temp }}/prediction-lab-model-reference-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.producer_run_id }}
      - name: Download exact predecessor evidence
        uses: actions/download-artifact@v4
        with:
          name: prediction-lab-shadow-cycle-${{ steps.binding.outputs.predecessor_run_id }}
          path: ${{ runner.temp }}/predecessor-shadow
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.predecessor_run_id }}
      - name: Restore exact predecessor with one-time bootstrap exception
        env:
          PREDECESSOR_RUN_ID: ${{ steps.binding.outputs.predecessor_run_id }}
          PREDECESSOR_DIGEST: ${{ steps.binding.outputs.predecessor_digest }}
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          REQUEST_ID: ${{ needs.gate.outputs.request_id }}
          BOOTSTRAP_RECOVERY: ${{ steps.binding.outputs.bootstrap_recovery }}
          PUBLICATION_RECEIPT_COUNT: ${{ steps.binding.outputs.publication_receipt_count }}
          RECOVERY_APPROVAL_ID: ${{ steps.binding.outputs.recovery_approval_id }}
          RECOVERY_APPROVAL_TARGET_SHA: ${{ steps.binding.outputs.recovery_approval_target_sha }}
          LEGACY_STATE: ${{ steps.binding.outputs.legacy_state }}
          PREDECESSOR_DIR: ${{ runner.temp }}/predecessor-shadow
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, readFileSync, readdirSync } from 'node:fs';
          import { basename, join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import {
            canonicalBootstrapSeedAllowedV1,
            canonicalStrandedBootstrapRecoveryAllowedV1,
          } from './market-prediction-lab/src/canonical-shadow-runtime-activation-v1.js';
          const files = [];
          const walk = (directory) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const target = join(directory, entry.name);
              entry.isDirectory() ? walk(target) : files.push(target);
            }
          };
          walk(process.env.PREDECESSOR_DIR);
          const exactlyOne = (name) => {
            const rows = files.filter((file) => basename(file) === name);
            if (rows.length !== 1) throw new Error(`Expected one ${name}; found ${rows.length}`);
            return rows[0];
          };
          const stateFile = exactlyOne('shadow-state.json');
          const provenance = JSON.parse(readFileSync(exactlyOne('shadow-cycle-provenance.json'), 'utf8'));
          if (String(provenance.runId) !== process.env.PREDECESSOR_RUN_ID) throw new Error('Predecessor run mismatch');
          if (String(provenance.producerRunId) !== process.env.PRODUCER_RUN_ID) throw new Error('Predecessor Producer mismatch');
          if (!/^[0-9a-f]{40}$/.test(String(provenance.researchCodeSha ?? ''))) throw new Error('Invalid predecessor research SHA');
          const activationBootstrap = canonicalBootstrapSeedAllowedV1({
            requestId: process.env.REQUEST_ID,
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorRunId: process.env.PREDECESSOR_RUN_ID,
            predecessorArtifactDigest: process.env.PREDECESSOR_DIGEST,
          });
          const recoveryBootstrap = canonicalStrandedBootstrapRecoveryAllowedV1({
            requestId: process.env.REQUEST_ID,
            recoveryApprovalCommentId: process.env.RECOVERY_APPROVAL_ID,
            recoveryApprovalTargetSha: process.env.RECOVERY_APPROVAL_TARGET_SHA,
            targetSha: process.env.TARGET_SHA,
            legacyWorkflowState: process.env.LEGACY_STATE,
            publishedReceiptCount: process.env.PUBLICATION_RECEIPT_COUNT,
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorRunId: process.env.PREDECESSOR_RUN_ID,
            predecessorArtifactDigest: process.env.PREDECESSOR_DIGEST,
          });
          if ((process.env.BOOTSTRAP_RECOVERY === 'true') !== recoveryBootstrap) {
            throw new Error('Stranded recovery binding marker mismatch');
          }
          if (provenance.researchCodeSha !== process.env.TARGET_SHA && !activationBootstrap && !recoveryBootstrap) {
            execFileSync('git', ['merge-base', '--is-ancestor', provenance.researchCodeSha, process.env.TARGET_SHA], { stdio: 'inherit' });
          }
          const state = JSON.parse(readFileSync(stateFile, 'utf8'));
          if (!state || state.schemaVersion !== 3 || !state.groups || typeof state.groups !== 'object') throw new Error('Invalid predecessor state');
          copyFileSync(stateFile, 'market-prediction-lab/docs/shadow-state.json');
          NODE
      - name: Validate canonical shadow modules
        working-directory: market-prediction-lab
        run: >-
          node --test
          tests/derivatives-history.test.js
          tests/derivatives-normalized-compat.test.js
          tests/temporal-training-dataset.test.js
          tests/shadow-ledger.test.js
          tests/canonical-shadow-drift-policy-v1.test.js
          tests/canonical-shadow-runtime-cutover-v1.test.js
          tests/canonical-shadow-runtime-activation-v1.test.js
          tests/shadow-evidence-handoff-v1.test.js
          tests/shadow-state-root-transport-v1.test.js
      - name: Run one genuine public-data canonical shadow cycle
        id: shadow
        continue-on-error: true
        working-directory: market-prediction-lab
        env:
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          PRODUCER_EVIDENCE_ROOT: ${{ runner.temp }}/prediction-lab-model-reference-evidence
        run: node scripts/run-shadow-cycle.js docs/shadow-state.json docs/shadow-summary.json "$PRODUCER_EVIDENCE_ROOT"
      - name: Build immutable canonical runtime provenance
        if: always()
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          REQUEST_ID: ${{ needs.gate.outputs.request_id }}
          MODE: ${{ needs.gate.outputs.mode }}
          PRODUCER_RUN_ID: ${{ steps.binding.outputs.producer_run_id }}
          PREDECESSOR_RUN_ID: ${{ steps.binding.outputs.predecessor_run_id }}
          PREDECESSOR_DIGEST: ${{ steps.binding.outputs.predecessor_digest }}
          BOOTSTRAP_RECOVERY: ${{ steps.binding.outputs.bootstrap_recovery }}
          PUBLICATION_RECEIPT_COUNT: ${{ steps.binding.outputs.publication_receipt_count }}
          RECOVERY_APPROVAL_ID: ${{ steps.binding.outputs.recovery_approval_id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const bootstrapRecovery = process.env.BOOTSTRAP_RECOVERY === 'true';
          const value = {
            schemaVersion: 2,
            researchCodeSha: process.env.TARGET_SHA,
            runId: process.env.GITHUB_RUN_ID,
            producerRunId: process.env.PRODUCER_RUN_ID,
            predecessorShadowRunId: process.env.PREDECESSOR_RUN_ID,
            predecessorShadowArtifactDigest: process.env.PREDECESSOR_DIGEST || null,
            canonicalRuntimeRequestId: process.env.REQUEST_ID,
            canonicalRuntimeMode: process.env.MODE,
            canonicalRuntimeBootstrapRecovery: bootstrapRecovery,
            canonicalRuntimeRecoveryApprovalCommentId: bootstrapRecovery ? process.env.RECOVERY_APPROVAL_ID : null,
            canonicalRuntimePublishedReceiptCountAtRecoveryCheck: bootstrapRecovery ? Number(process.env.PUBLICATION_RECEIPT_COUNT) : null,
            branchWrite: false,
            liveOrderAllowed: false,
            privateAccountRequestAllowed: false,
            scheduleActivated: false,
          };
          fs.writeFileSync('market-prediction-lab/docs/shadow-cycle-provenance.json', `${JSON.stringify(value)}\n`, { mode: 0o600 });
          NODE
      - name: Build validated publication manifest
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { buildShadowArtifactPublicationManifestV1 } from './market-prediction-lab/src/shadow-state-root-transport-v1.js';
          const manifest = await buildShadowArtifactPublicationManifestV1({
            artifactRoot: 'market-prediction-lab/docs',
            createdAt: new Date().toISOString(),
          });
          await writeFile(
            'market-prediction-lab/docs/shadow-artifact-publication-manifest.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
            { encoding: 'utf8', mode: 0o600 },
          );
          NODE
      - name: Upload terminally verifiable canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-shadow-cycle-${{ github.run_id }}
          path: |
            market-prediction-lab/docs/shadow-state.json
            market-prediction-lab/docs/shadow-summary.json
            market-prediction-lab/docs/shadow-cycle-provenance.json
            market-prediction-lab/docs/shadow-artifact-publication-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed when cycle failed
        if: always() && steps.shadow.outcome != 'success'
        run: exit 1
