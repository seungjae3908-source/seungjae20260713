name: Research Hunter V5 Data Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-hunter-v5-data.py
      - .github/workflows/research-hunter-v5-data-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile market-prediction-lab/scripts/probe-hunter-v5-data.py
      - run: python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "requests>=2.32,<3" "huggingface_hub>=0.30,<1"
      - run: python market-prediction-lab/scripts/probe-hunter-v5-data.py
