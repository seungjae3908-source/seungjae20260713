name: Research Full-Universe 3pct Hunter Census V1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
      - .github/workflows/research-full-universe-3pct-hunter-census-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-full-universe-3pct-hunter-census-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    strategy:
      fail-fast: false
      matrix:
        market: [US_STOCK, KR_STOCK, CRYPTO_SPOT, CRYPTO_FUTURES]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "pyarrow>=18,<22" "huggingface_hub>=0.30,<1" "duckdb>=1.3,<2" "pykrx>=1.0.51"
      - name: Run market mover census
        run: |
          python market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py \
            --market ${{ matrix.market }} \
            --out-dir market-prediction-lab/docs/full-universe-3pct-hunter-v2/${{ matrix.market }}
      - name: Upload immutable research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-census-v2-${{ matrix.market }}-${{ github.sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-v2/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 14
