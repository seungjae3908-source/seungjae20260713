name: Research US Fresh Month Availability V1

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-us-fresh-month-availability-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install "huggingface_hub>=0.30,<1"
      - name: Check 2026-04 through 2026-09 availability
        run: |
          python - <<'PY'
          import json
          from huggingface_hub import HfApi

          repo="mito0o852/OHLCV-1m"
          files=set(HfApi().list_repo_files(repo,repo_type="dataset"))
          months=[f"2026-{m:02d}" for m in range(4,10)]
          rows=[]
          for month in months:
              path=f"data/ohlcv_{month}.parquet"
              rows.append({"month":month,"path":path,"available":path in files})
          result={
              "contract":"us-fresh-month-availability-v1",
              "dataset":repo,
              "months":rows,
              "availableMonths":[x["month"] for x in rows if x["available"]],
              "truthBoundary":{
                  "metadataOnlyNoTradingApi":True,
                  "profitabilityProven":False,
                  "executionAuthority":"NONE"
              }
          }
          print(json.dumps({"FINAL":result},ensure_ascii=False))
          PY
