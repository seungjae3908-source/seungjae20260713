name: Research KR Naver Minute History Probe V2

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-kr-naver-minute-history-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-kr-naver-minute-history-probe-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Probe public Naver minute history without credentials
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path("market-prediction-lab/docs/kr-naver-minute-history-probe-v2")
          out.mkdir(parents=True,exist_ok=True)
          headers={"User-Agent":"Mozilla/5.0 market-prediction-lab/research"}

          results=[]

          # JSON-like minute endpoint. Probe only; no private/broker credentials.
          for count in (1,50,500):
              url=f"https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=0&count={count}&timeframe=minute"
              try:
                  r=requests.get(url,headers=headers,timeout=30)
                  text=r.text.strip()
                  parsed=None
                  try:
                      parsed=ast.literal_eval(text)
                  except Exception:
                      pass
                  rows=(len(parsed)-1) if isinstance(parsed,list) and len(parsed)>1 else 0
                  first=str(parsed[1][0]) if rows and isinstance(parsed[1],(list,tuple)) else None
                  last=str(parsed[-1][0]) if rows and isinstance(parsed[-1],(list,tuple)) else None
                  results.append({"type":"siseJson","count":count,"status":r.status_code,"rows":rows,"first":first,"last":last,"preview":text[:240]})
              except Exception as exc:
                  results.append({"type":"siseJson","count":count,"error":repr(exc)})

          # PC time-series endpoint with explicit historical thistime.
          for stamp in ("20261006153000","20260331153000","20240701153000","20230703153000"):
              row_count=0; times=[]; statuses=[]
              for page in (1,2,10,40):
                  url=f"https://finance.naver.com/item/sise_time.naver?code=005930&thistime={stamp}&page={page}"
                  try:
                      r=requests.get(url,headers=headers,timeout=30)
                      statuses.append(r.status_code)
                      soup=BeautifulSoup(r.text,"html.parser")
                      for tr in soup.select("table.type2 tr"):
                          tds=[td.get_text(" ",strip=True) for td in tr.select("td")]
                          if tds and re.fullmatch(r"\d{2}:\d{2}",tds[0] or ""):
                              row_count+=1
                              times.append(tds[0])
                  except Exception as exc:
                      statuses.append(repr(exc))
              results.append({"type":"sise_time","stamp":stamp,"rows":row_count,"timesPreview":times[:10],"statuses":statuses})

          result={
            "contract":"kr-naver-minute-history-probe-v2",
            "results":results,
            "hasMinuteRows":any(int(x.get("rows") or 0)>0 for x in results),
            "truthBoundary":{
              "publicReadOnlyHttpOnly":True,
              "noBrokerCredentials":True,
              "noPrivateTradingApi":True,
              "researchProbeOnly":True,
              "profitabilityProven":False,
              "executionAuthority":"NONE"
            }
          }
          (out/"summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"FINAL":result},ensure_ascii=False),flush=True)
          if not result["hasMinuteRows"]:
              raise SystemExit(1)
          PY
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-naver-minute-history-probe-v2-${{ github.sha }}
          path: market-prediction-lab/docs/kr-naver-minute-history-probe-v2
          if-no-files-found: error
          retention-days: 14
