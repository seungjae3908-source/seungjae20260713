name: Research KR Naver Minute History Probe V2

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-kr-naver-minute-history-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-kr-naver-minute-history-probe-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Probe public Naver minute history without credentials
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import requests

          out=Path("market-prediction-lab/docs/kr-naver-minute-history-probe-v2")
          out.mkdir(parents=True,exist_ok=True)
          headers={"User-Agent":"Mozilla/5.0 market-prediction-lab/research"}

          def parse_rows(text):
              # Naver minute response is JS-like, not strict JSON: null values and
              # whitespace make literal_eval unreliable. Timestamp is 12 digits.
              stamps=re.findall(r'\["(\d{12})"\s*,',text)
              closes=[]
              for m in re.finditer(r'\["(\d{12})"\s*,([^\]]+)\]',text):
                  vals=[v.strip() for v in m.group(2).split(",")]
                  closes.append({"stamp":m.group(1),"values":vals[:6]})
              return stamps,closes

          cases=[
            ("latest_r0_c1","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=0&count=1&timeframe=minute"),
            ("latest_r0_c500","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=0&count=500&timeframe=minute"),
            ("r1_2024_day","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=1&startTime=20240701&endTime=20240701&timeframe=minute"),
            ("r1_2023_day","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=1&startTime=20230703&endTime=20230703&timeframe=minute"),
            ("r2_2024_1530_c500","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&startTime=202407011530&count=500&timeframe=minute"),
            ("r2_2023_1530_c500","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&startTime=202307031530&count=500&timeframe=minute"),
            ("r2_2026_1530_c500","https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&startTime=202603311530&count=500&timeframe=minute"),
          ]

          results=[]
          for name,url in cases:
              try:
                  r=requests.get(url,headers=headers,timeout=30)
                  stamps,rows=parse_rows(r.text)
                  dates=sorted(set(s[:8] for s in stamps))
                  results.append({
                    "type":"siseJson","case":name,"status":r.status_code,
                    "rows":len(stamps),"first":stamps[0] if stamps else None,
                    "last":stamps[-1] if stamps else None,
                    "dates":dates[:20],"dateCount":len(dates),
                    "rowPreview":rows[:3],"textPreview":r.text[:180]
                  })
              except Exception as exc:
                  results.append({"type":"siseJson","case":name,"error":repr(exc)})

          # Mobile public chart endpoint documented by current Naver traffic.
          mobile_url="https://m.stock.naver.com/front-api/chart/domestic/stock/end?code=005930&chartInfoType=item&scriptChartType=candleMinuteFive"
          try:
              r=requests.get(mobile_url,headers=headers,timeout=30)
              payload=None
              try: payload=r.json()
              except Exception: pass
              def walk_dates(obj,found):
                  if isinstance(obj,dict):
                      for k,v in obj.items():
                          if isinstance(v,str) and re.search(r"20\\d{2}[./-]?\\d{2}[./-]?\\d{2}",v):
                              found.append(v)
                          walk_dates(v,found)
                  elif isinstance(obj,list):
                      for v in obj: walk_dates(v,found)
              found=[]
              walk_dates(payload,found)
              results.append({
                "type":"mobile_candleMinuteFive","status":r.status_code,
                "jsonType":type(payload).__name__ if payload is not None else None,
                "dateLikePreview":found[:20],
                "textPreview":r.text[:500],
                "bytes":len(r.content)
              })
          except Exception as exc:
              results.append({"type":"mobile_candleMinuteFive","error":repr(exc)})

          # Old HTML endpoint is also recorded for completeness.
          for stamp in ("20261006153000","20260331153000","20240701153000","20230703153000"):
              url=f"https://finance.naver.com/item/sise_time.naver?code=005930&thistime={stamp}&page=1"
              try:
                  r=requests.get(url,headers=headers,timeout=30)
                  results.append({"type":"sise_time","stamp":stamp,"status":r.status_code,"bytes":len(r.content)})
              except Exception as exc:
                  results.append({"type":"sise_time","stamp":stamp,"error":repr(exc)})

          historical_targets={"20230703","20240701","20260331"}
          seen_dates=set()
          for x in results:
              seen_dates.update(x.get("dates") or [])
          result={
            "contract":"kr-naver-minute-history-probe-v2",
            "results":results,
            "hasMinuteRows":any(int(x.get("rows") or 0)>0 for x in results),
            "historicalTargetsSeen":sorted(historical_targets & seen_dates),
            "historicalMinuteAvailable":bool(historical_targets & seen_dates),
            "truthBoundary":{
              "publicReadOnlyHttpOnly":True,
              "noBrokerCredentials":True,
              "noPrivateTradingApi":True,
              "researchProbeOnly":True,
              "profitabilityProven":False,
              "executionAuthority":"NONE"
            }
          }
          (out/"summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"FINAL":result},ensure_ascii=False),flush=True)
          if not result["hasMinuteRows"]:
              raise SystemExit(1)
          PY
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-naver-minute-history-probe-v2-${{ github.sha }}
          path: market-prediction-lab/docs/kr-naver-minute-history-probe-v2
          if-no-files-found: error
          retention-days: 14
