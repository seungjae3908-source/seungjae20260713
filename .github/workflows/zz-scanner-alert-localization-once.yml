name: Scanner alert localization one-shot

on:
  push:
    branches:
      - chatgpt/scanner-alert-signal-labels-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'seungjae3908-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scanner-alert-signal-labels-p1
          fetch-depth: 0
      - name: Localize scanner approval alert labels and add regression evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          page = Path('stock-analyzer/src/pages/signal-scanner.tsx')
          text = page.read_text()
          old = """function alertTitle(alert: ScannerAlertCandidate): string {\n  const action = alert.action && alert.action !== 'NONE' ? alert.action : 'SIGNAL';\n  return `${action} 승인 대기 · ${alert.symbol}`;\n}\n"""
          new = """function alertTitle(alert: ScannerAlertCandidate): string {\n  const futures = alert.assetClass === 'coin_futures';\n  let label: string;\n  if (futures) {\n    if (alert.action === 'LONG') label = '↑ 롱 신호';\n    else if (alert.action === 'SHORT') label = '↓ 숏 신호';\n    else if (alert.action === 'NONE' || alert.action === 'NO_TRADE') label = '— 거래 안 함 · NO_TRADE';\n    else label = '? 선물 방향 확인 필요 · UNKNOWN';\n  } else {\n    if (alert.action === 'BUY') label = '↗ 매수 신호';\n    else if (alert.action === 'SELL') label = '↘ 보유분 매도·청산 참고';\n    else if (alert.action === 'NONE' || alert.action === 'NO_TRADE') label = '— 거래 안 함 · NO_TRADE';\n    else label = '? 현물 방향 확인 필요 · UNKNOWN';\n  }\n  return `${label} 승인 대기 · ${alert.symbol}`;\n}\n"""
          if old not in text:
              raise SystemExit('alertTitle source block not found; refusing unsafe patch')
          page.write_text(text.replace(old, new, 1))

          spec = Path('stock-analyzer/e2e/scanner-direction-badges.spec.ts')
          text = spec.read_text()
          old_alerts = "    alerts: [],\n"
          new_alerts = """    alerts: [\n      {\n        idempotencyKey: 'direction-alert-buy',\n        signalId: 'direction:BUY:0',\n        assetClass: 'stock',\n        market: 'KR',\n        symbol: '005930',\n        direction: 'LONG',\n        action: 'BUY',\n        state: 'APPROVAL_PENDING',\n        entryZone: { from: 74_000, to: 75_000 },\n        stopLoss: 70_000,\n        targets: [82_000],\n        expiresAt: '2099-08-16T03:00:00.000Z',\n        evidence: ['public fixture'],\n        orderSubmitted: false,\n        exchangeRequestSent: false,\n      },\n      {\n        idempotencyKey: 'direction-alert-short',\n        signalId: 'direction:SHORT:3',\n        assetClass: 'coin_futures',\n        market: 'BITGET',\n        symbol: 'BTCUSDT3',\n        direction: 'SHORT',\n        action: 'SHORT',\n        state: 'APPROVAL_PENDING',\n        entryZone: { from: 74_000, to: 75_000 },\n        stopLoss: 80_000,\n        targets: [68_000],\n        expiresAt: '2099-08-16T03:00:00.000Z',\n        evidence: ['public fixture'],\n        orderSubmitted: false,\n        exchangeRequestSent: false,\n      },\n    ],\n"""
          if old_alerts not in text:
              raise SystemExit('alerts fixture anchor not found; refusing unsafe patch')
          text = text.replace(old_alerts, new_alerts, 1)
          anchor = "  expect(texts.every((text) => !text.includes('WATCH'))).toBe(true);\n\n"
          assertion = """  const alerts = page.locator('section[aria-label=\"승인 대기 알림\"]');\n  await expect(alerts).toContainText('↗ 매수 신호 승인 대기 · 005930');\n  await expect(alerts).toContainText('↓ 숏 신호 승인 대기 · BTCUSDT3');\n  await expect(alerts).not.toContainText('BUY 승인 대기');\n  await expect(alerts).not.toContainText('SHORT 승인 대기');\n\n"""
          if anchor not in text:
              raise SystemExit('assertion anchor not found; refusing unsafe patch')
          spec.write_text(text.replace(anchor, anchor + assertion, 1))
          PY
      - name: Remove one-shot workflow and commit only intended files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'seungjae3908-source'
          git config user.email 'seungjae3908@gmail.com'
          git rm .github/workflows/zz-scanner-alert-localization-once.yml
          git add stock-analyzer/src/pages/signal-scanner.tsx stock-analyzer/e2e/scanner-direction-badges.spec.ts
          git diff --cached --check
          git commit -m 'fix(scanner): localize approval alert signal labels'
          git push origin HEAD:chatgpt/scanner-alert-signal-labels-p1
