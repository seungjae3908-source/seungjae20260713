name: Research US Equity Edge Router V3

on:
  pull_request:
    branches: [main]
    paths:
      - market-prediction-lab/scripts/run-us-equity-edge-router-v3.mjs
      - .github/workflows/research-us-equity-edge-router-v3.yml
      - market-prediction-lab/src/yahoo-stock-history.js

permissions:
  contents: read

concurrency:
  group: research-us-equity-edge-router-v3-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify research-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check market-prediction-lab/scripts/run-us-equity-edge-router-v3.mjs
          ! grep -Eiq 'LIVE_TRADING|REAL_ORDER_ENABLED|PRIVATE_TRADING_API_ALLOWED|(^|[^A-Za-z])withdraw([^A-Za-z]|$)|(^|[^A-Za-z])transfer([^A-Za-z]|$)|(^|[^A-Za-z])orderSubmitted([^A-Za-z]|$)' market-prediction-lab/scripts/run-us-equity-edge-router-v3.mjs
      - name: Run V3 edge overlays with locked six-month test
        working-directory: market-prediction-lab
        run: node scripts/run-us-equity-edge-router-v3.mjs docs/us-equity-edge-router-v3.json
      - name: Assert locked test and safety
        working-directory: market-prediction-lab
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('docs/us-equity-edge-router-v3.json','utf8'));
          if(r.status!=='pass') throw new Error('STATUS_NOT_PASS');
          if(r.selectionContract.testUsedForSelection!==false) throw new Error('TEST_SELECTION_FORBIDDEN');
          if(r.selectionContract.baseV2ParametersFrozen!==true) throw new Error('BASE_NOT_FROZEN');
          if(!(r.universe.historySuccesses>=150)) throw new Error('HISTORY_COVERAGE_TOO_SMALL');
          if(!(r.secCoverage.loaded>=50)) throw new Error('SEC_COVERAGE_TOO_SMALL');
          if(r.safety.researchOnly!==true||r.safety.liveExecutionAllowed!==false||r.safety.executionAuthority!=='NONE') throw new Error('SAFETY_BOUNDARY');
          if(!r.MID||!r.SMALL) throw new Error('BUCKET_RESULT_MISSING');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: us-equity-edge-router-v3-${{ github.event.pull_request.head.sha }}
          path: market-prediction-lab/docs/us-equity-edge-router-v3.json
          if-no-files-found: error
          retention-days: 30
