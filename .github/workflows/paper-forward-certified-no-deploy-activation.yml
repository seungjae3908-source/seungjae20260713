name: Paper Forward Certified No-Deploy Activation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/paper-forward-certified-no-deploy-activation.yml
      - ops/install-paper-forward-schedule.sh
      - ops/disable-paper-forward-schedule.sh
      - market-prediction-lab/src/paper-forward-schedule-runtime-v1.js
      - market-prediction-lab/src/paper-forward-schedule-runtime-base-v1.js
      - market-prediction-lab/src/recurring-paper-loop-v1.js
      - market-prediction-lab/src/authoritative-natural-paper-accounting-v1.js
      - market-prediction-lab/src/authoritative-paper-runtime-package-v1.js
      - market-prediction-lab/tests/paper-scheduler-driver-v1.test.js
      - market-prediction-lab/tests/recurring-paper-loop-v1.test.js
      - market-prediction-lab/tests/signal-performance-persistence-v1.test.js
      - market-prediction-lab/tests/authoritative-paper-runtime-factory-v1.test.js
      - market-prediction-lab/tests/authoritative-paper-runtime-package-v1.test.js
      - market-prediction-lab/tests/natural-paper-position-settlement-lifecycle-v1.test.js
      - market-prediction-lab/tests/natural-paper-public-position-observation-v1.test.js
      - market-prediction-lab/tests/natural-paper-public-position-observation-runtime-v1.test.js
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  statuses: read

concurrency:
  group: paper-forward-certified-no-deploy-activation
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated Paper-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/paper-forward-certified-no-deploy-activation.yml
          install=ops/install-paper-forward-schedule.sh
          grep -F "startsWith(github.event.comment.body, '/activate-paper-forward-certified-no-deploy ')" "$workflow" >/dev/null
          grep -F 'Paper-only certification suite' "$workflow" >/dev/null
          grep -F 'No successful exact-SHA PostgreSQL Auth evidence exists' "$workflow" >/dev/null
          grep -F 'productionAppDeployPerformed = false' "$workflow" >/dev/null
          grep -F 'productionAppMutationAllowed = false' "$workflow" >/dev/null
          grep -F "LIVE_TRADING='false'" "$install" >/dev/null
          grep -F "REAL_ORDER_ENABLED='false'" "$install" >/dev/null
          grep -F "PRIVATE_TRADING_API_ALLOWED='false'" "$install" >/dev/null
          grep -F "PRIVATE_ACCOUNT_ACCESS='false'" "$install" >/dev/null
          ! grep -F 'staging-verdict-' "$workflow" >/dev/null
          ! grep -F 'verify-staging-verdict.mjs' "$workflow" >/dev/null
          ! grep -F 'deploy-production.sh' "$workflow" >/dev/null
          ! grep -E 'pm2 (start|restart|reload|delete|stop)|systemctl .*caddy|caddy reload|supabase db|psql .*-(c|f)' "$workflow" >/dev/null

  gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 23 &&
      github.event.issue.title == 'Staging Readiness Control' &&
      startsWith(github.event.comment.body, '/activate-paper-forward-certified-no-deploy ')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      target_sha: ${{ steps.command.outputs.sha }}
      required_ci_run_id: ${{ steps.required.outputs.run_id }}
      postgres_run_id: ${{ steps.postgres.outputs.run_id }}
    steps:
      - name: Parse exact owner activation command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]]
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]]
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/activate-paper-forward-certified-no-deploy ([0-9a-f]{40})$/.exec(body);
          if (!match) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1]}\n`);
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require exact current main and coherent Required CI 6/6
        id: required
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const main = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            if (main.data.commit.sha !== target) {
              core.setFailed(`Activation target is stale: target=${target} main=${main.data.commit.sha}`);
              return;
            }
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: target, per_page: 100,
            });
            const latest = new Map();
            for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status);
            const evidence = required.map((name) => latest.get(name));
            if (evidence.some((status) => status?.state !== 'success')) {
              core.setFailed('Exact current main does not have all six successful Required statuses.');
              return;
            }
            const runIds = new Set(evidence.map((status) => /\/actions\/runs\/(\d+)/.exec(String(status.target_url ?? ''))?.[1] ?? null));
            if (runIds.size !== 1 || runIds.has(null)) {
              core.setFailed('Required statuses do not share one coherent Application CI provenance run.');
              return;
            }
            const runId = Number([...runIds][0]);
            const run = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            if (run.data.head_sha !== target || run.data.status !== 'completed' || run.data.conclusion !== 'success') {
              core.setFailed('Required CI provenance is not an exact successful target run.');
              return;
            }
            core.setOutput('run_id', String(runId));

      - name: Locate successful exact-SHA PostgreSQL Auth evidence
        id: postgres
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, head_sha: target,
              branch: 'main', event: 'issue_comment', status: 'completed', per_page: 100,
            });
            for (const run of runs) {
              if (run.name !== 'Staging PostgreSQL Auth Gate'
                || run.path !== '.github/workflows/staging-postgres-auth-gate.yml'
                || run.conclusion !== 'success') continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100,
              });
              const expected = `staging-postgres-auth-${target}`;
              const artifact = (artifacts.data.artifacts ?? []).find((item) =>
                item.name === expected && item.expired !== true && item.workflow_run?.head_sha === target);
              if (artifact) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.setFailed(`No successful exact-SHA PostgreSQL Auth evidence exists for ${target}.`);

      - name: Paper-only certification suite
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            market-prediction-lab/tests/paper-scheduler-driver-v1.test.js \
            market-prediction-lab/tests/recurring-paper-loop-v1.test.js \
            market-prediction-lab/tests/signal-performance-persistence-v1.test.js \
            market-prediction-lab/tests/authoritative-paper-runtime-factory-v1.test.js \
            market-prediction-lab/tests/authoritative-paper-runtime-package-v1.test.js \
            market-prediction-lab/tests/natural-paper-position-settlement-lifecycle-v1.test.js \
            market-prediction-lab/tests/natural-paper-public-position-observation-v1.test.js \
            market-prediction-lab/tests/natural-paper-public-position-observation-runtime-v1.test.js

      - name: Verify Paper-only deployment safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          install=ops/install-paper-forward-schedule.sh
          disable=ops/disable-paper-forward-schedule.sh
          test -x "$install"
          test -x "$disable"
          grep -F "LIVE_TRADING='false'" "$install" >/dev/null
          grep -F "AUTO_TRADING='false'" "$install" >/dev/null
          grep -F "REAL_ORDER_ENABLED='false'" "$install" >/dev/null
          grep -F "PRIVATE_TRADING_API_ALLOWED='false'" "$install" >/dev/null
          grep -F "PRIVATE_ACCOUNT_ACCESS='false'" "$install" >/dev/null
          grep -F 'STATE_ROOT=/opt/stock-app-data/paper-forward-v1' "$install" >/dev/null
          grep -F '# stock-app-paper-forward-v1' "$install" >/dev/null

      - name: Build immutable Paper-only certification verdict
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          REQUIRED_CI_RUN_ID: ${{ steps.required.outputs.run_id }}
          POSTGRES_RUN_ID: ${{ steps.postgres.outputs.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p paper-only-certification
          node <<'NODE'
          const fs = require('node:fs');
          const value = {
            schemaVersion: 'paper-forward-paper-only-certification-v1',
            targetSha: process.env.TARGET_SHA,
            status: 'CERTIFIED',
            fullStagingRequired: false,
            requiredCiRunId: Number(process.env.REQUIRED_CI_RUN_ID),
            postgresAuthRunId: Number(process.env.POSTGRES_RUN_ID),
            paperFocusedTestsPassed: true,
            productionAppDeployAllowed: false,
            productionAppMutationAllowed: false,
            databaseMutationAllowed: false,
            secretMutationAllowed: false,
            environmentMutationAllowed: false,
            liveTrading: false,
            autoTrading: false,
            realOrderEnabled: false,
            privateTradingApiAllowed: false,
            executionAuthority: 'NONE',
          };
          if (!/^[0-9a-f]{40}$/.test(value.targetSha)
            || !Number.isInteger(value.requiredCiRunId)
            || !Number.isInteger(value.postgresAuthRunId)) process.exit(1);
          fs.writeFileSync('paper-only-certification/verdict.json', `${JSON.stringify(value, null, 2)}\n`);
          NODE

      - name: Upload immutable Paper-only certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper-forward-paper-only-certification-${{ steps.command.outputs.sha }}
          path: paper-only-certification/verdict.json
          if-no-files-found: error
          retention-days: 30

  activate:
    if: github.event_name == 'issue_comment'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
      EVIDENCE_DIR: ${{ github.workspace }}/paper-forward-certified-no-deploy-evidence
    steps:
      - name: Revalidate exact current main after Production environment approval
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const main = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            if (main.data.commit.sha !== process.env.TARGET_SHA) {
              core.setFailed(`Paper activation target became stale: ${process.env.TARGET_SHA} != ${main.data.commit.sha}`);
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate SSH secrets and configure Paper-only access
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh "$EVIDENCE_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Capture immutable Production application identity before Paper activation
        id: app_before
        shell: bash
        run: |
          set -Eeuo pipefail
          app_sha="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha")"
          [[ "$app_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$app_sha" >> "$GITHUB_OUTPUT"
          printf '{"productionAppShaBefore":"%s"}\n' "$app_sha" > "$EVIDENCE_DIR/application-before.json"

      - name: Install isolated exact-SHA Paper runtime and cron without application deployment
        id: install
        env:
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
          PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256: ${{ secrets.PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::Protected Paper publisher SHA-256 binding is missing or invalid.' >&2
            exit 14
          }
          printf -v remote_command \
            'TARGET_SHA=%q REPOSITORY_URL=%q PRODUCTION_APP_SHA=%q PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256=%q bash -s' \
            "$TARGET_SHA" "$REPOSITORY_URL" "$PRODUCTION_APP_SHA" "$PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_command" <<'REMOTE' > "$EVIDENCE_DIR/activation.json"
          set -Eeuo pipefail
          STATE_ROOT=/opt/stock-app-data/paper-forward-v1
          SOURCE_DIR="$(mktemp -d /tmp/paper-forward-source.XXXXXX)"
          cleanup() { rm -rf -- "$SOURCE_DIR"; }
          trap cleanup EXIT
          [[ "$(tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha)" == "$PRODUCTION_APP_SHA" ]]
          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          [[ "$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})" == "$TARGET_SHA" ]]
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"
          mkdir -p "$SOURCE_DIR/.deploy"
          printf '%s\n' "$TARGET_SHA" > "$SOURCE_DIR/.deploy/current-sha"
          LIVE_DIR="$SOURCE_DIR" \
            PAPER_FORWARD_STATE_ROOT="$STATE_ROOT" \
            PAPER_FORWARD_OUTCOME_ACCUMULATION_ENABLED=true \
            PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256="$PAPER_FORWARD_PAPER_STATE_PUBLISHER_ACCOUNT_ID_SHA256" \
            "$SOURCE_DIR/ops/install-paper-forward-schedule.sh" "$TARGET_SHA" >/dev/null
          PRODUCTION_APP_SHA="$PRODUCTION_APP_SHA" TARGET_SHA="$TARGET_SHA" node - "$STATE_ROOT/activation.json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          const paperRuntimeSourceSha = value.deployedSha;
          delete value.deployedSha;
          value.schemaVersion = 'paper-forward-certified-no-deploy-activation-v1';
          value.sourceMode = 'ISOLATED_GIT_EXACT_SHA';
          value.paperRuntimeSourceSha = paperRuntimeSourceSha;
          value.productionAppShaBefore = process.env.PRODUCTION_APP_SHA;
          value.productionAppDeployPerformed = false;
          value.productionAppMutationAllowed = false;
          if (paperRuntimeSourceSha !== process.env.TARGET_SHA
            || value.paperTradeOutcomeAccumulationEnabled !== true
            || value.simulatedFinancialAdaptersEnabled !== true
            || value.externalFinancialMutationAllowed !== false
            || value.liveTrading !== false
            || value.privateAccountAccess !== false
            || value.orderAuthority !== false) process.exit(1);
          fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`, { mode: 0o600 });
          process.stdout.write(`${JSON.stringify(value)}\n`);
          NODE
          [[ "$(tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha)" == "$PRODUCTION_APP_SHA" ]]
          REMOTE
          node - "$EVIDENCE_DIR/activation.json" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (value.status !== 'ACTIVE_WAITING_FOR_NATURAL_CYCLE'
            || value.targetSha !== process.env.TARGET_SHA
            || value.paperRuntimeSourceSha !== process.env.TARGET_SHA
            || value.productionAppDeployPerformed !== false
            || value.productionAppMutationAllowed !== false
            || value.paperTradeOutcomeAccumulationEnabled !== true
            || value.simulatedFinancialAdaptersEnabled !== true
            || value.externalFinancialMutationAllowed !== false
            || value.scheduleActive !== true
            || value.liveTrading !== false
            || value.privateAccountAccess !== false
            || value.orderAuthority !== false) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `activation_at_ms=${value.activationAtMs}\n`);
          NODE

      - name: Verify Production application identity remained unchanged
        env:
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          app_sha_after="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha")"
          [[ "$app_sha_after" == "$PRODUCTION_APP_SHA" ]]
          printf '{"productionAppShaBefore":"%s","productionAppShaAfter":"%s","productionAppDeployPerformed":false}\n' \
            "$PRODUCTION_APP_SHA" "$app_sha_after" > "$EVIDENCE_DIR/application-after.json"

      - name: Wait for and verify first natural Paper-only cron cycle
        env:
          ACTIVATION_AT_MS: ${{ steps.install.outputs.activation_at_ms }}
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$EVIDENCE_DIR/natural-cycle.json"
          for attempt in $(seq 1 50); do
            set +e
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "TARGET_SHA='$TARGET_SHA' ACTIVATION_AT_MS='$ACTIVATION_AT_MS' PRODUCTION_APP_SHA='$PRODUCTION_APP_SHA' bash -s" > "$evidence.tmp" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/stock-app-data/paper-forward-v1
          INVOCATIONS="$ROOT/runtime-state/status/invocations.jsonl"
          STATE="$ROOT/runtime-state/state/recurring-paper-loop.json"
          STATUS="$ROOT/runtime-state/status/runtime-status.json"
          ACTIVATION="$ROOT/activation.json"
          [[ -r "$INVOCATIONS" && -r "$STATE" && -r "$STATUS" && -r "$ACTIVATION" ]] || exit 75
          [[ "$(tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha)" == "$PRODUCTION_APP_SHA" ]] || exit 77
          node - "$INVOCATIONS" "$STATE" "$STATUS" "$ACTIVATION" "$ACTIVATION_AT_MS" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const [invocationsPath, statePath, statusPath, activationPath, activationAtRaw, targetSha] = process.argv.slice(2);
          const lines = fs.readFileSync(invocationsPath, 'utf8').trim().split(/\r?\n/).filter(Boolean);
          const invocation = lines.map((line) => JSON.parse(line))
            .filter((row) => row.triggerSource === 'cron' && Number(row.invokedAtMs) >= Number(activationAtRaw)).at(-1);
          if (!invocation) process.exit(75);
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          const activation = JSON.parse(fs.readFileSync(activationPath, 'utf8'));
          const cronText = cp.execFileSync('crontab', ['-l'], { encoding: 'utf8' });
          const cronMatches = cronText.split(/\r?\n/).filter((line) => line.includes('# stock-app-paper-forward-v1')).length;
          const checks = {
            exactPaperRuntime: activation.paperRuntimeSourceSha === targetSha,
            noAppDeploy: activation.productionAppDeployPerformed === false && activation.productionAppMutationAllowed === false,
            naturalCron: invocation.naturalScheduleInvocation === true,
            completed: invocation.status === 'COMPLETED',
            oneMutation: invocation.mutationCount === 1,
            accumulating: invocation.publicForwardEvidenceAccumulating === true,
            outcomeModeEnabled: invocation.paperTradeOutcomeAccumulationEnabled === true,
            simulatedAdaptersEnabled: status.simulatedFinancialAdaptersEnabled === true,
            externalFinancialMutationOff: status.externalFinancialMutationAllowed === false,
            fourReadyProviders: Array.isArray(invocation.providerLanes) && invocation.providerLanes.length === 4
              && invocation.providerLanes.every((lane) => lane.status === 'READY'),
            scheduleActive: status.scheduleActive === true,
            stateCyclePersisted: Array.isArray(state.cycles) && state.cycles.length >= 1,
            stateArraysValid: Array.isArray(state.positions) && Array.isArray(state.settlements),
            noPrivate: invocation.privateRequestCount === 0,
            noFinancialMutation: invocation.financialMutationCount === 0,
            noOrders: invocation.orderCount === 0,
            liveOff: invocation.liveTrading === false && invocation.orderAuthority === false,
            oneCronEntry: cronMatches === 1,
            disableSentinelAbsent: !fs.existsSync('/opt/stock-app-data/paper-forward-v1/DISABLED'),
          };
          const failed = Object.entries(checks).filter(([, value]) => value !== true).map(([key]) => key);
          if (failed.length) {
            console.error(`Natural Paper Forward cycle failed: ${failed.join(', ')}`);
            process.exit(77);
          }
          process.stdout.write(`${JSON.stringify({
            schemaVersion: 'paper-forward-certified-natural-cycle-evidence-v1',
            status: 'passed', targetSha, checks,
            state: {
              cycleCount: state.cycles.length,
              positionCount: state.positions.length,
              settlementCount: state.settlements.length,
            },
            privateRequestCount: 0,
            financialMutationCount: 0,
            orderCount: 0,
            liveTrading: false,
          }, null, 2)}\n`);
          NODE
          REMOTE
            status=$?
            set -e
            if [[ "$status" == 0 ]]; then
              mv "$evidence.tmp" "$evidence"
              exit 0
            fi
            rm -f "$evidence.tmp"
            if [[ "$status" != 75 ]]; then exit "$status"; fi
            sleep 20
          done
          echo 'No natural Paper-only cron cycle observed within bounded window.' >&2
          exit 78

      - name: Revalidate exact current main after natural cycle
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const main = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            if (main.data.commit.sha !== process.env.TARGET_SHA) {
              core.setFailed(`Paper target became stale after activation: ${process.env.TARGET_SHA} != ${main.data.commit.sha}`);
            }

      - name: Disable Paper schedule automatically on any activation failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < ops/disable-paper-forward-schedule.sh \
            > "$EVIDENCE_DIR/automatic-disable.json" 2>&1
          exit 0

      - name: Upload sanitized Paper-only activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-forward-certified-no-deploy-${{ env.TARGET_SHA }}
          path: paper-forward-certified-no-deploy-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report successful certified Paper-only activation
        if: success()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
          EVIDENCE_FILE: ${{ env.EVIDENCE_DIR }}/natural-cycle.json
        with:
          script: |
            const fs = require('node:fs');
            const evidence = JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE, 'utf8'));
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                '[PAPER_FORWARD_CERTIFIED_NO_DEPLOY_ACTIVATED]',
                `TARGET_SHA=${process.env.TARGET_SHA}`,
                `PRODUCTION_APP_SHA_UNCHANGED=${process.env.PRODUCTION_APP_SHA}`,
                'FULL_STAGING_REQUIRED=false',
                'PAPER_ONLY_CERTIFICATION=PASS',
                'PRODUCTION_APP_DEPLOY_PERFORMED=false',
                'FIRST_NATURAL_CRON_VERIFIED=true',
                `PAPER_POSITION_COUNT=${Number(evidence.state?.positionCount ?? 0)}`,
                `PAPER_SETTLEMENT_COUNT=${Number(evidence.state?.settlementCount ?? 0)}`,
                'LIVE_TRADING=false',
                'PRIVATE_TRADING_API_ALLOWED=false',
                'REAL_ORDER_COUNT=0',
                'FINANCIAL_MUTATION_COUNT=0',
              ].join('\n'),
            });
