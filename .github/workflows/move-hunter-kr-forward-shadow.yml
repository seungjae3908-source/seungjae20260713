name: Move Hunter KR Frozen Forward Shadow

on:
  workflow_dispatch:
    inputs:
      observer_run_id:
        description: Successful canonical Forward Recommendation Observer workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: move-hunter-kr-forward-shadow-${{ inputs.observer_run_id }}
  cancel-in-progress: false

jobs:
  shadow:
    name: Read-only KR 60m frozen hypothesis shadow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main dispatch and validate canonical Observer source
        id: source
        uses: actions/github-script@v7
        env:
          OBSERVER_RUN_ID: ${{ inputs.observer_run_id }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Move Hunter shadow must be dispatched from main.');
              return;
            }
            const runId = Number(process.env.OBSERVER_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Valid observer_run_id is required.');
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.path !== '.github/workflows/forward-recommendation-observer-cycle.yml'
                || run.event !== 'workflow_dispatch'
                || run.head_branch !== 'main'
                || run.status !== 'completed'
                || run.conclusion !== 'success') {
              core.setFailed('Source run is not a successful canonical main Forward Recommendation Observer dispatch.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const candidates = artifacts.filter((item) =>
              item.name.startsWith('forward-recommendation-observer-state-') && !item.expired);
            if (candidates.length !== 1) {
              core.setFailed('Exactly one unexpired canonical Forward Observer state artifact is required.');
              return;
            }
            core.setOutput('artifact_name', candidates[0].name);
            core.setOutput('artifact_id', String(candidates[0].id));
            core.setOutput('observer_head_sha', run.head_sha);

      - name: Download canonical Forward Observer state
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: ${{ runner.temp }}/canonical-forward-observer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.observer_run_id }}

      - name: Checkout immutable current main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify canonical source artifact before read-only consume
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/canonical-forward-observer
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = process.env.ROOT;
          const statePath = path.join(root, 'state.json');
          const summaryPath = path.join(root, 'summary.json');
          const manifestPath = path.join(root, 'manifest.json');
          for (const file of [statePath, summaryPath, manifestPath]) {
            if (!fs.existsSync(file)) throw new Error('Missing canonical Observer file: ' + file);
          }
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          if (manifest.kind !== 'forward-recommendation-observer-state' || manifest.schemaVersion !== 1) {
            throw new Error('Canonical Observer manifest identity invalid.');
          }
          if (manifest.stateSha256 !== digest(statePath) || manifest.summarySha256 !== digest(summaryPath)) {
            throw new Error('Canonical Observer artifact digest mismatch.');
          }
          if (state.researchCodeSha !== manifest.researchCodeSha) {
            throw new Error('Canonical Observer research SHA mismatch.');
          }
          const safety = state.safety ?? {};
          if (safety.publicDataOnly !== true || safety.artifactOnly !== true
              || safety.executionAuthority !== 'NONE'
              || safety.financialMutationAllowed !== false
              || safety.liveOrderAllowed !== false
              || safety.privateTradingApiAllowed !== false
              || safety.profitabilityClaimAllowed !== false) {
            throw new Error('Canonical Observer safety contract invalid.');
          }
          NODE

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consume canonical state without mutation
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/canonical-forward-observer
          OUT: ${{ runner.temp }}/move-hunter-kr-forward-shadow
          OBSERVER_RUN_ID: ${{ inputs.observer_run_id }}
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          node research-lab/move-hunter-v1/scripts/run-market-hypothesis-forward-shadow.mjs \
            --state-input "$ROOT/state.json" \
            --output-dir "$OUT" \
            --observer-run-id "$OBSERVER_RUN_ID"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload separate read-only shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: move-hunter-kr-forward-shadow-${{ inputs.observer_run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/move-hunter-kr-forward-shadow
          if-no-files-found: error
          retention-days: 90

      - name: Summarize safety boundary
        shell: bash
        env:
          OUT: ${{ runner.temp }}/move-hunter-kr-forward-shadow
        run: |
          set -Eeuo pipefail
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = require('path');
          const out = process.env.OUT;
          const manifest = JSON.parse(fs.readFileSync(path.join(out, 'manifest.json'), 'utf8'));
          const summary = JSON.parse(fs.readFileSync(path.join(out, 'summary.json'), 'utf8'));
          console.log('## Move Hunter KR Frozen Forward Shadow');
          console.log('- source Observer run: ' + manifest.sourceObserverRunId);
          console.log('- source observations: ' + manifest.sourceObservationCount);
          console.log('- frozen-scope candidates: ' + manifest.candidateObservationCount);
          console.log('- accepted: ' + (summary.acceptedN ?? 0));
          console.log('- settled: ' + (summary.settledN ?? 0));
          console.log('- pending: ' + (summary.pendingN ?? 0));
          console.log('- blocked: ' + (summary.blockedN ?? 0));
          console.log('- canonical state mutation: false');
          console.log('- economic/OOS credit: 0');
          console.log('- execution authority: NONE');
          NODE
