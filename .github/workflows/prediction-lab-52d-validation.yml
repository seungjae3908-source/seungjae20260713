name: Prediction Lab Multi-Market Suite

on:
  workflow_dispatch:
  push:
    branches:
      - feature/prediction-lab-standalone
    paths:
      - .github/workflows/prediction-lab-52d-validation.yml
      - market-prediction-lab/package.json
      - market-prediction-lab/src/**
      - market-prediction-lab/scripts/**
      - market-prediction-lab/tests/**

permissions:
  contents: write

concurrency:
  group: prediction-lab-market-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feature/prediction-lab-standalone

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate standalone lab
        id: validate
        continue-on-error: true
        working-directory: market-prediction-lab
        shell: bash
        run: |
          mkdir -p docs
          set +e
          npm run validate 2>&1 | tee docs/validation-run.log
          exit ${PIPESTATUS[0]}

      - name: Record validation-suite failure
        if: steps.validate.outcome != 'success'
        working-directory: market-prediction-lab
        run: |
          tail -n 200 docs/validation-run.log > docs/validation-failure.log
          cat > docs/market-suite-result.json <<'JSON'
          {
            "schemaVersion": 1,
            "status": "fail",
            "stage": "standalone_validation_suite",
            "source": "github-actions-isolated-multi-market-suite",
            "error": {
              "name": "ValidationSuiteError",
              "message": "npm run validate failed before live data collection; see docs/validation-failure.log"
            }
          }
          JSON

      - name: Clear previous validation failure log
        if: steps.validate.outcome == 'success'
        working-directory: market-prediction-lab
        run: rm -f docs/validation-failure.log

      - name: Collect, validate, train and compare candidates
        id: market_suite
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        working-directory: market-prediction-lab
        run: node scripts/run-market-suite.js live-market-suite docs/market-suite-result.json models/candidates

      - name: Display market-suite result
        if: always()
        working-directory: market-prediction-lab
        run: |
          test -f docs/market-suite-result.json
          cat docs/market-suite-result.json

      - name: Upload isolated market-suite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-market-suite-${{ github.run_id }}
          path: market-prediction-lab/live-market-suite
          if-no-files-found: warn
          retention-days: 7

      - name: Commit summary, diagnostics and research candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A market-prediction-lab/docs/market-suite-result.json market-prediction-lab/docs/validation-failure.log
          if [ -d market-prediction-lab/models/candidates ]; then
            git add market-prediction-lab/models/candidates/*.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "test: record multi-market prediction candidates"
          git pull --rebase origin feature/prediction-lab-standalone
          git push origin HEAD:feature/prediction-lab-standalone

      - name: Fail workflow when validation failed
        if: always() && (steps.validate.outcome != 'success' || steps.market_suite.outcome != 'success')
        run: exit 1
