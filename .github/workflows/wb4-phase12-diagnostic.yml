name: WB4 Phase12 Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: wb4-phase12-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase12:
    name: Capture exact Phase12 assertion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Run exact Phase12 command and capture full output
        id: phase12
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "pwd=$(pwd)"
            echo "tz=${TZ:-<unset>}"
            echo "lang=${LANG:-<unset>}"
            echo "lc_all=${LC_ALL:-<unset>}"
            echo "--- phase12 ---"
            pnpm --dir api-server run test:phase12
          } 2>&1 | tee .artifacts/phase12.log
      - name: Upload Phase12 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb4-phase12-${{ github.run_id }}
          path: .artifacts/phase12.log
          if-no-files-found: error
          retention-days: 3
