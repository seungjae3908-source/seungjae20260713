name: Research US All-Session Opportunity Events V3

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/extract-us-all-session-opportunity-events-v3.py
      - market-prediction-lab/scripts/run-us-all-session-opportunity-probe-v1.py
      - market-prediction-lab/scripts/train-us-all-session-opportunity-ai-v4.py
      - .github/workflows/research-us-all-session-opportunity-events-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-us-all-session-opportunity-events-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "2023-04,2023-05,2023-06,2023-07,2023-08,2023-09"
          - "2023-10,2023-11,2023-12,2024-01,2024-02,2024-03"
          - "2024-04,2024-05,2024-06,2024-07,2024-08,2024-09"
          - "2024-10,2024-11,2024-12,2025-01,2025-02,2025-03"
          - "2025-04,2025-05,2025-06,2025-07,2025-08,2025-09"
          - "2025-10,2025-11,2025-12,2026-01,2026-02"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/extract-us-all-session-opportunity-events-v3.py
          python -m py_compile market-prediction-lab/scripts/run-us-all-session-opportunity-probe-v1.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "duckdb>=1.3,<2" "pandas>=2.2,<3" "polars>=1.30,<2" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "huggingface_hub>=0.30,<1"
      - name: Extract all-session opportunity events
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ARGS=()
          IFS=',' read -ra MONTHS <<< "$SHARD"
          for M in "${MONTHS[@]}"; do
            ARGS+=(--month "$M")
          done
          SAFE="${SHARD//,/_}"
          python market-prediction-lab/scripts/extract-us-all-session-opportunity-events-v3.py \
            "${ARGS[@]}" \
            --negative-sample-pct 3 \
            --out-dir "market-prediction-lab/docs/us-all-session-opportunity-events-v3/$SAFE"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-all-session-opportunity-events-v3-${{ strategy.job-index }}-${{ github.sha }}
          path: market-prediction-lab/docs/us-all-session-opportunity-events-v3
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install combine and AI dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "lightgbm==4.5.0" "scikit-learn==1.5.2"
      - uses: actions/download-artifact@v4
        with:
          pattern: us-all-session-opportunity-events-v3-*
          path: shards
      - name: Combine all months
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          roots=list(Path("shards").glob("**/events.parquet"))
          summaries=list(Path("shards").glob("**/summary.json"))
          if len(roots)!=6:
              raise SystemExit(f"EXPECTED_6_EVENT_SHARDS_GOT:{len(roots)}")
          frames=[pd.read_parquet(p) for p in roots]
          data=pd.concat(frames,ignore_index=True).sort_values(["timestamp","symbol"]).reset_index(drop=True)
          out=Path("combined");out.mkdir(exist_ok=True)
          data.to_parquet(out/"events.parquet",index=False)

          months=[]
          audits=[]
          for p in summaries:
              try:x=json.loads(p.read_text(encoding="utf-8"))
              except Exception:continue
              if x.get("contract")!="us-all-session-opportunity-events-v3":continue
              months.extend(x.get("months") or [])
              audits.extend(x.get("audits") or [])
          months=sorted(set(months))
          expected=[str(p) for p in pd.period_range("2023-04","2026-02",freq="M")]
          missing=sorted(set(expected)-set(months))
          if missing:
              raise SystemExit("MISSING_MONTHS:"+",".join(missing))
          result={
            "schemaVersion":1,
            "contract":"us-all-session-opportunity-events-v3-combined",
            "months":months,
            "monthCount":len(months),
            "rows":int(len(data)),
            "positiveMfe3Buckets":int((data["labelMfe3"]==1).sum()),
            "strict3Buckets":int(data["labelStrict3"].sum()),
            "periodCounts":{str(k):int(v) for k,v in data["period"].value_counts().to_dict().items()},
            "audits":sorted(audits,key=lambda z:z.get("month","")),
            "truthBoundary":{
              "coversEveryMonth2023_04Through2026_02":True,
              "allPositive15mBucketsRetained":True,
              "negativeBucketsSampledThreePct":True,
              "preRegularPostAllIncluded":True,
              "openingTimeNotRequired":True,
              "clockTime60MinuteLabels":True,
              "profitabilityProven":False,
              "executionAuthority":"NONE"
            }
          }
          (out/"summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str)+"\n",encoding="utf-8")
          print(json.dumps({"FINAL_COMBINED":result},ensure_ascii=False,default=str))
          PY
      - name: Train frozen-period nonlinear opportunity AI
        run: |
          python market-prediction-lab/scripts/train-us-all-session-opportunity-ai-v4.py \
            --events combined/events.parquet \
            --out-dir combined/ai-v4
      - name: Upload combined event dataset and AI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-all-session-opportunity-events-v3-combined-${{ github.sha }}
          path: combined
          if-no-files-found: error
          retention-days: 14
