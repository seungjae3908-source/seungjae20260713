name: Research KR Naver Recent Minute Universe Probe V3

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/probe-kr-naver-recent-minute-universe-v3.py
      - .github/workflows/research-kr-naver-recent-minute-universe-probe-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-kr-naver-recent-minute-universe-probe-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/probe-kr-naver-recent-minute-universe-v3.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-census-v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "polars>=1.30,<2" "numpy>=2.0,<3" "pyarrow>=18,<22" "requests>=2.32,<3" "duckdb>=1.3,<2" "finance-datareader>=0.9,<1" "yfinance>=0.2,<1"
      - name: Probe recent minute coverage across deterministic KRX sample
        run: python market-prediction-lab/scripts/probe-kr-naver-recent-minute-universe-v3.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-naver-recent-minute-universe-probe-v3-${{ github.sha }}
          path: market-prediction-lab/docs/kr-naver-recent-minute-universe-probe-v3
          if-no-files-found: error
          retention-days: 14
