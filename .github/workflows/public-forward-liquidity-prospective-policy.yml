name: Public Forward Liquidity Prospective Policy

on:
  pull_request:
    paths:
      - 'market-intelligence-sidecar/src/public-forward-liquidity-prospective-policy.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-prospective-policy.test.mjs'
      - 'market-intelligence-sidecar/scripts/run-public-forward-liquidity-prospective-policy.mjs'
      - '.github/workflows/public-forward-liquidity-prospective-policy.yml'

permissions:
  contents: read

jobs:
  verify-prospective-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify exact-head policy contract and tests
        shell: bash
        run: |
          set -euo pipefail
          node --check market-intelligence-sidecar/src/public-forward-liquidity-prospective-policy.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-prospective-policy.mjs
          node --test market-intelligence-sidecar/tests/public-forward-liquidity-prospective-policy.test.mjs

      - name: Freeze deterministic new-cohort-only policy candidate
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD_SHA="$(git rev-parse HEAD)"
          COMMIT_SECONDS="$(git show -s --format=%ct HEAD)"
          if [[ ! "$EXACT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$COMMIT_SECONDS" =~ ^[0-9]+$ ]]; then
            echo 'Unable to bind prospective policy to exact immutable PR head.' >&2
            exit 1
          fi
          export EXACT_HEAD_SHA
          export POLICY_FROZEN_AT_MS="$((COMMIT_SECONDS * 1000))"
          export SYMBOL='BTCUSDT'
          export OUTPUT_DIR='public-forward-liquidity-prospective-policy'
          node market-intelligence-sidecar/scripts/run-public-forward-liquidity-prospective-policy.mjs | tee prospective-policy-summary.json

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import {
            verifyProspectiveLiquidityPolicyArtifact,
          } from './market-intelligence-sidecar/src/public-forward-liquidity-prospective-policy.mjs';
          const artifact = JSON.parse(await readFile(
            'public-forward-liquidity-prospective-policy/prospective-policy-artifact.json',
            'utf8',
          ));
          const verification = verifyProspectiveLiquidityPolicyArtifact(artifact);
          if (!verification.valid) throw new Error(`POLICY_VERIFY_FAILED:${verification.blockers.join(',')}`);
          if (artifact.exactPolicyHeadSha !== process.env.EXACT_HEAD_SHA) throw new Error('POLICY_HEAD_SHA_MISMATCH');
          if (artifact.cohort.policyFrozenAtMs !== Number(process.env.POLICY_FROZEN_AT_MS)) throw new Error('POLICY_FREEZE_TIMESTAMP_MISMATCH');
          if (artifact.cohort.cohortEligibleAfterMs <= artifact.cohort.policyFrozenAtMs) throw new Error('COHORT_NOT_STRICTLY_PROSPECTIVE');
          if (artifact.cohort.historicalObservationCredit !== 0
            || artifact.cohort.replayCredit !== 0
            || artifact.cohort.backfillCredit !== 0
            || artifact.cohort.duplicateCredit !== 0) throw new Error('NON_GENUINE_CREDIT_FORBIDDEN');
          if (artifact.readiness.FULL_COST_READY !== false || artifact.readiness.EVIDENCE_COMPLETE !== 0) {
            throw new Error('POLICY_ARTIFACT_AUTHORITY_ESCALATION');
          }
          if (artifact.safety.executionAuthority !== 'NONE'
            || artifact.safety.privateApiUsed !== false
            || artifact.safety.liveTrading !== false
            || artifact.safety.orderSubmitted !== false) throw new Error('POLICY_ARTIFACT_SAFETY_INVALID');
          NODE

      - name: Upload immutable prospective policy candidate
        uses: actions/upload-artifact@v4
        with:
          name: public-forward-liquidity-prospective-policy-${{ github.event.pull_request.head.sha }}
          path: public-forward-liquidity-prospective-policy
          if-no-files-found: error
          retention-days: 90
