name: Fast Profitability V1 Activation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fast-profitability-v1-activation.yml'
      - 'api-server/src/services/fast-profitability-activation.service.ts'
      - 'api-server/src/services/fast-profitability-activation.service.test.ts'
      - 'api-server/src/scripts/run-fast-profitability-activation.ts'
      - 'api-server/src/scripts/run-fast-profitability-collector.ts'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: fast-profitability-v1-activation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Fast Profitability activation contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact pull request head
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck backend
        run: pnpm --dir api-server run typecheck
      - name: Run focused activation tests
        run: |
          set -Eeuo pipefail
          pnpm --dir api-server exec esbuild src/services/fast-profitability-activation.service.test.ts \
            --bundle --platform=node --format=cjs --target=node20 \
            --outfile="$RUNNER_TEMP/fast-profitability-activation.test.cjs"
          node --test "$RUNNER_TEMP/fast-profitability-activation.test.cjs"
      - name: Run merged Fast policy regressions
        run: |
          set -Eeuo pipefail
          node --test market-prediction-lab/tests/fast-profitability-prospective-policy-v1.test.js
          pnpm --dir api-server exec esbuild src/services/fast-profitability-evidence-runtime.service.test.ts \
            --bundle --platform=node --format=cjs --target=node20 \
            --outfile="$RUNNER_TEMP/fast-profitability-phase-bc.test.cjs"
          node --test "$RUNNER_TEMP/fast-profitability-phase-bc.test.cjs"
      - name: Verify safety locks
        run: |
          set -Eeuo pipefail
          service=api-server/src/services/fast-profitability-activation.service.ts
          grep -Fq "issueNumber: 1102" "$service"
          grep -Fq "existingForwardObserverOnly: true" "$service"
          grep -Fq "policyMutationAllowed: false" "$service"
          grep -Fq "existingV3MutationAllowed: false" "$service"
          grep -Fq "outcomeAwareSelectionAllowed: false" "$service"
          grep -Fq "executionAuthority: 'NONE'" "$service"
          grep -Fq "liveTrading: false" "$service"
          grep -Fq "autoTrading: false" "$service"
          grep -Fq "realOrderEnabled: false" "$service"
          grep -Fq "privateTradingApiAllowed: false" "$service"
          grep -Fq "replayCredit: 0" "$service"
          grep -Fq "backfillCredit: 0" "$service"
          grep -Fq "syntheticCredit: 0" "$service"
          grep -Fq "manualCredit: 0" "$service"
          ! grep -R -E 'LIVE_TRADING=.?(true|1)|AUTO_TRADING=.?(true|1)|REAL_ORDER_ENABLED=.?(true|1)|PRIVATE_TRADING_API_ALLOWED=.?(true|1)' \
            api-server/src/services/fast-profitability-activation.service.ts \
            api-server/src/scripts/run-fast-profitability-activation.ts \
            api-server/src/scripts/run-fast-profitability-collector.ts
      - name: Verify repository remained clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  activate:
    name: Activate immutable future-only binding
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1102 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/activate-fast-profitability-v1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPROVAL_COMMENT_ID: ${{ github.event.comment.id }}
      APPROVAL_ACTOR: ${{ github.actor }}
      APPROVAL_COMMAND: ${{ github.event.comment.body }}
    steps:
      - name: Parse exact owner command
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.comment?.body ?? '').trim();
            const match = /^\/activate-fast-profitability-v1 ([0-9a-f]{40})$/.exec(body);
            if (!match) {
              core.setFailed('Exact command required: /activate-fast-profitability-v1 <40-character-current-main-sha>');
              return;
            }
            if (context.payload.comment?.author_association !== 'OWNER') {
              core.setFailed('Repository OWNER approval required.');
              return;
            }
            core.setOutput('sha', match[1]);

      - name: Require exact current main and Required CI 6/6
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const repoInfo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repoInfo.data.default_branch,
            });
            if (main.data.commit.sha !== target) {
              core.setFailed('Activation target is not exact current main: target=' + target + ' main=' + main.data.commit.sha);
              return;
            }
            const combined = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: target,
              per_page: 100,
            });
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const byContext = new Map();
            for (const row of combined.data.statuses ?? []) {
              if (!byContext.has(row.context)) byContext.set(row.context, row);
            }
            if (required.some((name) => byContext.get(name)?.state !== 'success')) {
              core.setFailed('Exact current-main Required CI 6/6 SUCCESS required.');
            }

      - name: Reject duplicate active binding
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const active = artifacts.filter((artifact) =>
              !artifact.expired && /^fast-profitability-v1-activation-[0-9a-f]{40}$/.test(artifact.name));
            if (active.length > 0) {
              core.setFailed('Existing non-expired Fast activation binding found: ' + active.map((x) => x.name).join(', '));
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact activation checkout
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build existing Forward observer and activation CLI
        working-directory: api-server
        run: |
          set -Eeuo pipefail
          pnpm exec esbuild src/scripts/run-forward-recommendation-observer-cycle.ts \
            --bundle --packages=external --platform=node --format=esm --target=node20 \
            --outfile="$RUNNER_TEMP/forward-observer.mjs"
          pnpm exec esbuild src/scripts/run-fast-profitability-activation.ts \
            --bundle --packages=external --platform=node --format=esm --target=node20 \
            --outfile="$RUNNER_TEMP/fast-activation.mjs"
      - name: Run one clean public-data Forward preflight
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/activation-observer"
          mkdir -p "$RUNNER_TEMP/activation-observer"
          node "$RUNNER_TEMP/forward-observer.mjs" \
            --research-sha "$TARGET_SHA" \
            --output-dir "$RUNNER_TEMP/activation-observer"
      - name: Freeze immutable binding and separated OOS key
        id: frozen
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/fast-profitability-activation" "$RUNNER_TEMP/fast-profitability-key"
          mkdir -p "$RUNNER_TEMP/fast-profitability-key"
          node "$RUNNER_TEMP/fast-activation.mjs" \
            --target-sha "$TARGET_SHA" \
            --observer-state "$RUNNER_TEMP/activation-observer/state.json" \
            --output-dir "$RUNNER_TEMP/fast-profitability-activation" \
            --key-output "$RUNNER_TEMP/fast-profitability-key/sealing-key.b64" \
            --approval-comment-id "$APPROVAL_COMMENT_ID" \
            --approval-actor "$APPROVAL_ACTOR" \
            --approval-command "$APPROVAL_COMMAND"
          node <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/fast-profitability-activation/summary.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'activation_digest=' + s.activationDigest + '\n');
          NODE
      - name: Upload immutable activation bundle
        uses: actions/upload-artifact@v4
        with:
          name: fast-profitability-v1-activation-${{ steps.command.outputs.sha }}
          path: ${{ runner.temp }}/fast-profitability-activation
          if-no-files-found: error
          retention-days: 90
      - name: Upload separated sealed OOS key
        uses: actions/upload-artifact@v4
        with:
          name: fast-profitability-v1-key-${{ steps.frozen.outputs.activation_digest }}
          path: ${{ runner.temp }}/fast-profitability-key/sealing-key.b64
          if-no-files-found: error
          retention-days: 90
      - name: Report successful future-only activation
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: ${{ runner.temp }}/fast-profitability-activation/summary.json
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH, 'utf8'));
            const body = [
              '[FAST_PROFITABILITY_V1_ACTIVATED]',
              'target_sha=' + s.targetSha,
              'activation_digest=' + s.activationDigest,
              'candidate_id=' + s.candidateId,
              'eligible_after_ms=' + s.eligibleAfterMs,
              'collector_cadence_minutes=' + s.collectorCadenceMinutes,
              'activation_validation_credit=0',
              'activation_oos_credit=0',
              'profitability_credit=0',
              'executionAuthority=NONE',
              'LIVE_TRADING=false',
              'AUTO_TRADING=false',
              'REAL_ORDER_ENABLED=false',
              'PRIVATE_TRADING_API_ALLOWED=false',
              'replay_backfill_synthetic_manual_credit=0',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1102,
              body,
            });

      - name: Report fail-closed activation failure evidence
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA || 'UNKNOWN';
            const body = [
              '[FAST_PROFITABILITY_V1_ACTIVATION_FAILED]',
              'target_sha=' + target,
              'run_id=' + context.runId,
              'action_url=' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              'economic_credit_created=0',
              'validation_credit=0',
              'oos_credit=0',
              'executionAuthority=NONE',
              'LIVE_TRADING=false',
              'AUTO_TRADING=false',
              'REAL_ORDER_ENABLED=false',
              'PRIVATE_TRADING_API_ALLOWED=false',
              'action=NONE_FAIL_CLOSED',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1102,
              body,
            });
