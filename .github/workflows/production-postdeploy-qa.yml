name: Production Post-Deploy Read-Only QA Command
run-name: Production Post-Deploy Read-Only QA Command ${{ github.event.comment.body || github.event.pull_request.head.sha }}

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - '.github/workflows/production-postdeploy-qa.yml'
      - '.github/workflows/production-comprehensive-readonly-qa.yml'
      - '.github/workflows/production-account-readonly-live-qa.yml'
      - '.github/workflows/production-live-credential-reuse-qa.yml'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-trading-core-qa.yml'
      - '.github/tests/production-trading-core-qa-contract.test.mjs'
      - 'stock-analyzer/e2e/production-trading-core-qa.spec.ts'
      - 'stock-analyzer/playwright.production-trading-core.config.ts'
      - '.github/scripts/run-production-readonly-qa.sh'
      - '.github/scripts/build-production-postdeploy-context.mjs'
      - '.github/scripts/build-production-postdeploy-evidence.cjs'
      - '.github/scripts/production-postdeploy-qa-evidence.cjs'
      - '.github/scripts/production-postdeploy-qa-evidence.test.cjs'
      - '.github/scripts/verify-production-postdeploy-qa-contract.mjs'
      - 'api-server/scripts/build-production-comprehensive-readonly-receipt.mjs'
      - 'api-server/scripts/build-production-comprehensive-readonly-receipt.test.mjs'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: production-postdeploy-command-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Validate one-approval inline post-deploy QA contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node api-server/scripts/build-production-comprehensive-readonly-receipt.test.mjs
      - run: node --test .github/scripts/production-deploy-provenance.test.cjs
      - run: node --test .github/scripts/production-postdeploy-qa-evidence.test.cjs
      - run: >-
          node --experimental-strip-types --test
          api-server/src/services/recommendation-deadline.service.test.ts
          stock-analyzer/src/lib/recommendation-response.test.ts
      - run: node .github/scripts/verify-production-postdeploy-qa-contract.mjs

  dispatch-approved-production-chain:
    name: Dispatch the single protected Production deploy + inline QA chain
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1555 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control — Rollover 2026-10-02' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/run-production-postdeploy-qa ')
       || startsWith(github.event.comment.body, '/run-production-trading-core-release '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate owner command and dispatch exact-main Production chain
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const body = String(process.env.COMMENT_BODY ?? '').trim();
            const full = /^\/run-production-postdeploy-qa ([0-9a-fA-F]{40})$/.exec(body);
            const tradingCore = /^\/run-production-trading-core-release ([0-9a-fA-F]{40})$/.exec(body);
            const match = full || tradingCore;
            if (!match) {
              core.setFailed('Exact command required: /run-production-postdeploy-qa <40-char-sha> OR /run-production-trading-core-release <40-char-sha>');
              return;
            }
            const target = match[1].toLowerCase();
            const qaScope = tradingCore ? 'trading_core' : 'full';
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (String(main.data.commit.sha).toLowerCase() !== target) {
              core.setFailed(`POSTDEPLOY_COMMAND_REQUIRES_EXACT_CURRENT_MAIN: target=${target} main=${main.data.commit.sha}`);
              return;
            }
            const active = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const conflicts = active.filter((run) => run.status !== 'completed');
            if (conflicts.length > 0) {
              core.setFailed(`POSTDEPLOY_COMMAND_ACTIVE_PRODUCTION_DEPLOY_CONFLICT:${conflicts.map((run) => run.id).join(',')}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              ref: 'main',
              inputs: {
                sha: target,
                data_probe_path: '/api/healthz/data-plane',
                force_rebuild: 'false',
                qa_scope: qaScope,
              },
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1555,
              body: [
                'Production deploy + inline post-deploy QA chain dispatched.',
                '',
                `- Exact main SHA: \`${target}\``,
                '- QA scope: `' + qaScope + '`',
                '- One approval only: `Review deployments → production → Approve and deploy`',
                qaScope === 'trading_core'
                  ? '- Trading Core → Four-provider Account → Credential Reuse → ACTIVATION_READY runs inside that approved job.'
                  : '- Comprehensive → Four-provider Account → Credential Reuse → ACTIVATION_READY runs inside that approved job.',
                `- Runs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/production-deploy.yml`,
              ].join('\n'),
            });