name: Research Crypto Futures V4.4 Robustness Capital V4.5

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/audit-crypto-futures-v44-robustness-capital-v45.py
      - .github/workflows/research-crypto-futures-v44-robustness-capital-v45.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-v44-robustness-capital-v45-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "37453972448"
      SOURCE_ARTIFACT: "crypto-futures-v43-short-exact1m-v44-ddbb6cc79873efb6645a09156f5791fccb1a4241"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/audit-crypto-futures-v44-robustness-capital-v45.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-v43-short-exact1m-v44.py
      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "lightgbm==4.5.0" "scikit-learn==1.5.2" "polars>=1.30,<2" "requests>=2.32,<3" "huggingface_hub>=0.30,<1" "duckdb>=1.3,<2"
      - name: Download frozen V4.4 exact evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: frozen-v44
      - name: Run robustness and capital audit
        run: |
          EVENTS="$(find frozen-v44 -name exact-events.parquet -print -quit)"
          SUMMARY="$(find frozen-v44 -name summary.json -print -quit)"
          test -n "$EVENTS"
          test -n "$SUMMARY"
          python market-prediction-lab/scripts/audit-crypto-futures-v44-robustness-capital-v45.py \
            --exact-events "$EVENTS" \
            --source-summary "$SUMMARY" \
            --out-dir market-prediction-lab/docs/crypto-futures-v44-robustness-capital-v45
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-v44-robustness-capital-v45-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-v44-robustness-capital-v45
          if-no-files-found: error
          retention-days: 14
