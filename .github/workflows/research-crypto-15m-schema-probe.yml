name: Research Crypto 15m Schema Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-15m-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pyarrow>=18,<22" "huggingface_hub>=0.30,<1"
      - name: Probe parquet schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          out=[]
          for sub,file in [('spot','BTC_USDT.parquet'),('futures','BTC_USDT_USDT.parquet')]:
              p=hf_hub_download(repo_id='rogerdehe/klines-binance',repo_type='dataset',filename=f'{sub}/15m/{file}')
              pf=pq.ParquetFile(p)
              out.append({
                'sub':sub,'file':file,'columns':pf.schema_arrow.names,'schema':str(pf.schema_arrow),
                'rowGroups':pf.num_row_groups,'metadataRows':pf.metadata.num_rows
              })
          print(json.dumps({'CRYPTO_15M_SCHEMA':out},ensure_ascii=False))
          PY
