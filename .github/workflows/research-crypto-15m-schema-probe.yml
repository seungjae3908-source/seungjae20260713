name: Research Crypto 15m Schema Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-15m-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pyarrow>=18,<22" "huggingface_hub>=0.30,<1" "pandas>=2.2,<3"
      - name: Probe 15m parquet schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import snapshot_download
          root=Path(snapshot_download(
            repo_id='rogerdehe/klines-binance',repo_type='dataset',
            allow_patterns=['spot/15m/BTC_USDT.parquet','spot/15m/ETH_USDT.parquet','futures/15m/BTC_USDT_USDT.parquet','futures/15m/ETH_USDT_USDT.parquet']
          ))
          out=[]
          for rel in ['spot/15m/BTC_USDT.parquet','spot/15m/ETH_USDT.parquet','futures/15m/BTC_USDT_USDT.parquet','futures/15m/ETH_USDT_USDT.parquet']:
            p=root/rel
            pf=pq.ParquetFile(p)
            schema=[{'name':f.name,'type':str(f.type)} for f in pf.schema_arrow]
            cols=[f['name'] for f in schema]
            sample=pf.read_row_group(0).slice(0,3).to_pandas().to_dict('records')
            out.append({'file':rel,'columns':cols,'schema':schema,'sample':sample})
          print(json.dumps({'CRYPTO_15M_SCHEMA_PROBE':out},ensure_ascii=False,default=str))
          PY
