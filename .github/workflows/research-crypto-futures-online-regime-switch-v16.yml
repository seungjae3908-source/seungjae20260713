name: Research Crypto Futures Online Regime Switch V1.6

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-crypto-futures-online-regime-switch-v16.py
      - .github/workflows/research-crypto-futures-online-regime-switch-v16.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-crypto-futures-online-regime-switch-v16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online-regime-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "37406026312"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-online-regime-switch-v16.py
          python -m py_compile market-prediction-lab/scripts/run-crypto-futures-dynamic-exit-v1.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "duckdb>=1.3,<2" "huggingface_hub>=0.30,<1"
      - name: Download V1.5 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: crypto-futures-overextension-guard-v15-*
          path: v15
      - name: Verify source artifact
        run: |
          test -n "$(find v15 -name summary.json -print -quit)"
          test -n "$(find v15 -name winner-ledger.csv -print -quit)"
      - name: Run online regime switch V1.6
        run: |
          python market-prediction-lab/scripts/run-crypto-futures-online-regime-switch-v16.py \
            --input-root v15 \
            --out-dir market-prediction-lab/docs/crypto-futures-online-regime-switch-v16
      - name: Upload V1.6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-futures-online-regime-switch-v16-${{ github.sha }}
          path: market-prediction-lab/docs/crypto-futures-online-regime-switch-v16
          if-no-files-found: error
          retention-days: 14
