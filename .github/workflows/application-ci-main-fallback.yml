name: Application CI

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: application-ci-main-fallback-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ensure-exact-main-ci:
    name: Ensure exact main SHA receives verified Application CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Dispatch official CI when path filters skipped the SHA and wait for verification
        uses: actions/github-script@v7
        with:
          script: |
            const {
              evaluateProductionCiProvenance,
              inspectRequiredStatusEvidence,
              latestRequiredStatuses,
            } = require(`${process.env.GITHUB_WORKSPACE}/api-server/scripts/production-ci-provenance.cjs`);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const officialWorkflowId = 'futures-public-network-smoke.yml';
            const officialPath = '.github/workflows/futures-public-network-smoke.yml';
            const runUrlPattern = /\/actions\/runs\/(\d+)(?:[/?#]|$)/;

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== sha) {
              core.setFailed(`Fallback CI requires the exact current main SHA: ${main.data.commit.sha}`);
              return;
            }

            const listStatuses = () => github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });

            const listStatusBoundRuns = async (statuses) => {
              const latest = latestRequiredStatuses(statuses);
              const runIds = new Set();
              for (const status of latest.values()) {
                const match = runUrlPattern.exec(String(status?.target_url ?? ''));
                if (match) runIds.add(Number(match[1]));
              }

              const runs = [];
              for (const runId of runIds) {
                const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
                const run = response.data;
                const official = run.name === 'Application CI'
                  && run.path === officialPath
                  && run.head_sha === sha
                  && run.head_branch === 'main'
                  && ['push', 'workflow_dispatch'].includes(run.event);
                if (official) runs.push(run);
              }
              return runs.sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            };

            const listActiveExactShaPushRuns = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: officialWorkflowId,
                branch: 'main',
                event: 'push',
                per_page: 100,
              });
              return runs
                .filter((run) => run.head_sha === sha
                  && run.head_branch === 'main'
                  && run.event === 'push'
                  && run.status !== 'completed')
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            };

            const inspectSnapshot = async () => {
              const statuses = await listStatuses();
              const runs = await listStatusBoundRuns(statuses);
              const evidence = inspectRequiredStatusEvidence(statuses);
              if (!evidence.ok) return { statuses, runs, evidence, verified: null };

              const run = runs.find((candidate) => Number(candidate.id) === evidence.runId);
              const verified = evaluateProductionCiProvenance({
                targetSha: sha,
                currentMainSha: sha,
                statuses,
                run,
              });
              return { statuses, runs, evidence, verified };
            };

            await new Promise((resolve) => setTimeout(resolve, 15000));
            let snapshot = await inspectSnapshot();
            if (snapshot.verified?.ok) {
              core.notice(`Exact-main Application CI was already verified for ${sha} by Run ID ${snapshot.verified.runId}.`);
              return;
            }

            const activePushRuns = await listActiveExactShaPushRuns();
            const existingActive = snapshot.runs.find((run) => run.status !== 'completed') ?? activePushRuns[0];
            if (existingActive) {
              core.notice(`Waiting for existing exact-SHA Application CI Run ID ${existingActive.id}.`);
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: officialWorkflowId,
                ref: 'main',
                inputs: { target_sha: sha, checkout_ref: sha },
              });
              core.notice(`Dispatched official exact-SHA Application CI for ${sha}.`);
            }

            const deadline = Date.now() + 40 * 60 * 1000;
            while (Date.now() < deadline) {
              const currentMain = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (currentMain.data.commit.sha !== sha) {
                core.setFailed(`Main advanced during fallback verification: ${currentMain.data.commit.sha}`);
                return;
              }

              snapshot = await inspectSnapshot();
              if (snapshot.verified?.ok) {
                core.notice(`Exact-main Application CI verification completed for ${sha} by Run ID ${snapshot.verified.runId}.`);
                return;
              }

              const activeRuns = snapshot.runs.filter((run) => run.status !== 'completed');
              const directlyActivePushRuns = await listActiveExactShaPushRuns();
              const activeRun = activeRuns[0] ?? directlyActivePushRuns[0];
              if (activeRun) {
                core.info(`Waiting for exact-SHA Application CI Run ID ${activeRun.id}.`);
                await new Promise((resolve) => setTimeout(resolve, 15000));
                continue;
              }

              const newest = snapshot.runs[0];
              if (newest && newest.status === 'completed' && newest.conclusion !== 'success') {
                core.setFailed(`Official exact-SHA Application CI Run ID ${newest.id} failed for ${sha}: ${newest.conclusion}.`);
                return;
              }
              if (newest && newest.status === 'completed' && newest.conclusion === 'success') {
                core.setFailed(`Official exact-SHA Application CI Run ID ${newest.id} completed without valid same-run 6/6 status provenance: ${snapshot.verified?.reason ?? snapshot.evidence?.reason ?? 'unknown'}.`);
                return;
              }

              core.info(`Waiting for exact-SHA Application CI status ownership for ${sha}.`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for exact-main Application CI verification for ${sha}.`);