name: Application CI

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: application-ci-main-fallback-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ensure-exact-main-ci:
    name: Ensure exact main SHA receives verified Application CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch official CI when path filters skipped the SHA and wait for verification
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const officialPath = '.github/workflows/futures-public-network-smoke.yml';
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== sha) {
              core.setFailed(`Fallback CI requires the exact current main SHA: ${main.data.commit.sha}`);
              return;
            }

            const listOfficialRuns = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: sha, branch: 'main', per_page: 100,
              });
              return runs.filter((run) =>
                run.name === 'Application CI'
                && run.path === officialPath
                && run.head_sha === sha
                && run.head_branch === 'main'
                && ['push', 'workflow_dispatch'].includes(run.event)
              );
            };

            await new Promise((resolve) => setTimeout(resolve, 15000));
            let officialRuns = await listOfficialRuns();
            if (!officialRuns.some((run) => run.status !== 'completed' || run.conclusion === 'success')) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'futures-public-network-smoke.yml',
                ref: 'main',
                inputs: { target_sha: sha, checkout_ref: sha },
              });
              core.notice(`Dispatched official exact-SHA Application CI for ${sha}.`);
            }

            const deadline = Date.now() + 40 * 60 * 1000;
            while (Date.now() < deadline) {
              const currentMain = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (currentMain.data.commit.sha !== sha) {
                core.setFailed(`Main advanced during fallback verification: ${currentMain.data.commit.sha}`);
                return;
              }

              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              statuses.sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
              const latest = new Map();
              for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status.state);

              officialRuns = await listOfficialRuns();
              const officialSuccess = officialRuns.some((run) =>
                run.status === 'completed' && run.conclusion === 'success'
              );
              const statusesSuccess = required.every((name) => latest.get(name) === 'success');
              if (officialSuccess && statusesSuccess) {
                core.notice(`Exact-main Application CI verification completed for ${sha}.`);
                return;
              }

              const terminalFailure = officialRuns.some((run) =>
                run.status === 'completed' && !['success', 'skipped', 'neutral'].includes(run.conclusion)
              );
              if (terminalFailure) {
                core.setFailed(`Official Application CI failed for ${sha}.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for exact-main Application CI verification for ${sha}.`);
