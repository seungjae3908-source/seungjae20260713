name: Market Intelligence Sidecar Validation

on:
  pull_request:
    paths:
      - 'market-intelligence-sidecar/**'
      - '.github/workflows/market-intelligence-sidecar-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intelligence-sidecar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check market-intelligence-sidecar/src/engine.mjs
          node --check market-intelligence-sidecar/src/public-data.mjs
          node --check market-intelligence-sidecar/src/server.mjs
          node --check market-intelligence-sidecar/src/fake-wall-forward-ledger.mjs
          node --check market-intelligence-sidecar/src/public-forward-liquidity-calibration.mjs
          node --check market-intelligence-sidecar/scripts/run-fake-wall-forward-ledger.mjs
          node --check market-intelligence-sidecar/scripts/run-public-forward-liquidity-calibration.mjs
          node --check market-intelligence-sidecar/scripts/verify-contract.mjs

      - name: Stash V3 activation binding for preserved inactive unit regressions
        shell: bash
        run: |
          set -euo pipefail
          activation='market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json'
          if [[ -f "$activation" ]]; then
            mv "$activation" "$RUNNER_TEMP/successor-v3-activation.json"
            echo 'SUCCESSOR_V3_ACTIVATION_STASHED=true' >> "$GITHUB_ENV"
          else
            echo 'SUCCESSOR_V3_ACTIVATION_STASHED=false' >> "$GITHUB_ENV"
          fi

      - name: Unit and service tests
        working-directory: market-intelligence-sidecar
        run: node --test tests/*.test.mjs

      - name: Restore and validate V3 activation binding
        if: env.SUCCESSOR_V3_ACTIVATION_STASHED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          activation='market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json'
          mv "$RUNNER_TEMP/successor-v3-activation.json" "$activation"
          node --input-type=module <<'NODE'
          import {
            SUCCESSOR_SCHEDULE_RELIABILITY_V3_CONTRACT,
            verifySuccessorScheduleReliabilityV3Contract,
          } from './market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-reliability-v3.mjs';

          const verdict = verifySuccessorScheduleReliabilityV3Contract(
            SUCCESSOR_SCHEDULE_RELIABILITY_V3_CONTRACT,
          );
          if (!verdict.valid || !verdict.activationBound) {
            console.error('Invalid V3 activation binding:', verdict.blockers.join(','));
            process.exit(1);
          }
          NODE

      - name: Verify safety contract
        run: node market-intelligence-sidecar/scripts/verify-contract.mjs

      - name: Public-only Bitget and Upbit smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node --input-type=module - <<'NODE'
          import { fetchBitgetFuturesEvidence, fetchUpbitSpotEvidence } from './market-intelligence-sidecar/src/public-data.mjs';
          import { probeBitgetPublicCalibrationCapability } from './market-intelligence-sidecar/src/public-forward-liquidity-calibration.mjs';
          const futures = await fetchBitgetFuturesEvidence('BTCUSDT');
          if (futures.market !== 'CRYPTO_FUTURES' || futures.provenance?.privateApiUsed !== false) process.exit(1);
          if (!futures.orderBook?.bids?.length || !futures.orderBook?.asks?.length || !futures.trades?.length) process.exit(1);
          const spot = await fetchUpbitSpotEvidence('KRW-BTC');
          if (spot.market !== 'CRYPTO_SPOT' || spot.provenance?.privateApiUsed !== false) process.exit(1);
          if (!spot.orderBook?.bids?.length || !spot.orderBook?.asks?.length || !spot.trades?.length) process.exit(1);
          const calibration = await probeBitgetPublicCalibrationCapability({ symbol: 'BTCUSDT' });
          if (calibration.PUBLIC_CALIBRATION_DATA_CAPABLE !== true || calibration.privateApiUsed !== false) process.exit(1);
          console.log(JSON.stringify({
            bitget: { symbol: futures.symbol, bookTs: futures.orderBook.ts, fills: futures.trades.length },
            upbit: { symbol: spot.symbol, bookTs: spot.orderBook.ts, trades: spot.trades.length },
            calibration: { capable: calibration.PUBLIC_CALIBRATION_DATA_CAPABLE, fields: calibration.fields },
            privateRequests: 0,
            orders: 0,
          }));
          NODE
            then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done

      - name: Package exact-head release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf "release/market-intelligence-sidecar-$EXPECTED_SHA.tar.gz" market-intelligence-sidecar
          sha256sum "release/market-intelligence-sidecar-$EXPECTED_SHA.tar.gz" > "release/market-intelligence-sidecar-$EXPECTED_SHA.sha256"
          printf '%s\n' "$EXPECTED_SHA" > "release/SERVICE_SHA"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-sidecar-${{ env.EXPECTED_SHA }}
          path: release/
          retention-days: 90
          if-no-files-found: error
