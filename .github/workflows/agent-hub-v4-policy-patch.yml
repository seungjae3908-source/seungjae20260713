name: Agent Hub v4 Policy Patch

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/patch_agent_hub_v4_approval_policy.py
      - .github/workflows/agent-hub-v4-policy-patch.yml

permissions:
  contents: write

concurrency:
  group: agent-hub-v4-policy-patch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/agent-hub-coordinator-v2
          fetch-depth: 0
      - name: Check whether patch remains
        id: gate
        run: echo "apply=$([[ -f scripts/patch_agent_hub_v4_approval_policy.py ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Apply policy correction and run all deterministic tests
        if: steps.gate.outputs.apply == 'true'
        env:
          PYTHONPATH: scripts
        run: |
          python3 scripts/patch_agent_hub_v4_approval_policy.py
          python3 -m py_compile scripts/agent_hub_policy.py scripts/agent_hub_free.py scripts/agent_hub_executor.py scripts/agent_hub_executor_report.py
          python3 scripts/agent_hub_policy.py
          python3 scripts/agent_hub_free.py --self-test
          python3 scripts/agent_hub_executor.py --self-test
          python3 scripts/agent_hub_executor_report.py --self-test
          git diff --check
      - name: Commit corrected policy
        if: steps.gate.outputs.apply == 'true'
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce approval-only action precedence'
          git push origin HEAD:agent/agent-hub-coordinator-v2
