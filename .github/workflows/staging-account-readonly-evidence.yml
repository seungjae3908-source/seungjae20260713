name: Staging Account Read-only Evidence

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    ${{ github.event.issue.number == 23 &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/run-staging-account-readonly ') &&
        'staging-account-readonly-evidence' ||
        format('staging-account-readonly-evidence-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  account-readonly-evidence:
    if: >-
      github.event.issue.number == 23 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-staging-account-readonly ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      STAGING_ARTIFACT_DIR: ${{ github.workspace }}/staging-account-readonly-artifacts
      EXPECTED_EGRESS_IP: ${{ vars.STAGING_ACCOUNT_EVIDENCE_EGRESS_IP }}
      SSH_KEY_PATH: ${{ runner.temp }}/account-evidence-id_ed25519
      SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/account-evidence-known_hosts
      SSH_CONTROL_SOCKET: ${{ runner.temp }}/account-evidence-ssh.sock

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Parse exact owner command
        id: target
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-staging-account-readonly ([0-9a-f]{40}) --providers=toss,upbit,bitget$/.exec(body);
          if (!match) {
            console.error('Exact command required: /run-staging-account-readonly <40-char-sha> --providers=toss,upbit,bitget');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1]}\n`);
          NODE

      - name: Require exact current main
        id: main_identity
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$TARGET_SHA"
          CURRENT_MAIN="$(git rev-parse origin/main^{commit})"
          [[ "$CURRENT_MAIN" == "$TARGET_SHA" ]] || {
            echo "Target is not current main. target=$TARGET_SHA current=$CURRENT_MAIN" >&2
            exit 1
          }
          git checkout --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]

      - name: Install repository dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated Staging SSH client
        id: ssh_setup
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$STAGING_SSH_PRIVATE_KEY" && -n "$STAGING_SSH_KNOWN_HOSTS" ]] || {
            echo 'Staging SSH key and pinned known_hosts are required.' >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_PATH"

      - name: Require provider-allowlisted Staging egress IP
        id: egress
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          [[ -n "$EXPECTED_EGRESS_IP" ]] || {
            echo 'STAGING_ACCOUNT_EVIDENCE_EGRESS_IP is not configured.' >&2
            exit 1
          }
          [[ -n "$STAGING_SSH_HOST" && -n "$STAGING_SSH_USER" ]] || {
            echo 'Staging SSH host/user are required.' >&2
            exit 1
          }
          ACTUAL_EGRESS_IP="$(ssh \
            -i "$SSH_KEY_PATH" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            'curl --fail --silent --show-error --max-time 10 https://api.ipify.org')"
          [[ -n "$ACTUAL_EGRESS_IP" && "$ACTUAL_EGRESS_IP" == "$EXPECTED_EGRESS_IP" ]] || {
            echo 'Staging egress IP does not match the configured provider allowlist IP.' >&2
            exit 1
          }
          echo 'Provider-allowlisted Staging egress identity verified.'

      - name: Open TLS-preserving provider egress tunnels
        id: tunnels
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          rm -f "$SSH_CONTROL_SOCKET"
          ssh -fN -M -S "$SSH_CONTROL_SOCKET" \
            -i "$SSH_KEY_PATH" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            -L 127.0.0.1:18443:openapi.tossinvest.com:443 \
            -L 127.0.0.1:18444:api.upbit.com:443 \
            -L 127.0.0.1:18445:api.bitget.com:443 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST"
          ssh -S "$SSH_CONTROL_SOCKET" -O check \
            -i "$SSH_KEY_PATH" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST"

      - name: Run canonical Toss Upbit Bitget no-DB read-only evidence
        id: account_evidence
        continue-on-error: true
        env:
          STAGING_TARGET_SHA: ${{ steps.target.outputs.sha }}
          STAGING_TOSS_CLIENT_ID: ${{ secrets.STAGING_TOSS_CLIENT_ID || secrets.TOSS_CLIENT_ID }}
          STAGING_TOSS_CLIENT_SECRET: ${{ secrets.STAGING_TOSS_CLIENT_SECRET || secrets.TOSS_CLIENT_SECRET_KEY }}
          STAGING_TOSS_ACCOUNT_SEQ: ${{ secrets.STAGING_TOSS_ACCOUNT_SEQ }}
          STAGING_UPBIT_ACCESS_KEY: ${{ secrets.STAGING_UPBIT_ACCESS_KEY || secrets.UPBIT_API_KEY }}
          STAGING_UPBIT_SECRET_KEY: ${{ secrets.STAGING_UPBIT_SECRET_KEY || secrets.UPBIT_SECRET_KEY }}
          STAGING_BITGET_API_KEY: ${{ secrets.STAGING_BITGET_API_KEY || secrets.BITGET_API_KEY }}
          STAGING_BITGET_SECRET_KEY: ${{ secrets.STAGING_BITGET_SECRET_KEY || secrets.BITGET_SECRET_KEY }}
          STAGING_BITGET_PASSPHRASE: ${{ secrets.STAGING_BITGET_PASSPHRASE || secrets.BITGET_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const required = [
            'STAGING_TOSS_CLIENT_ID',
            'STAGING_TOSS_CLIENT_SECRET',
            'STAGING_UPBIT_ACCESS_KEY',
            'STAGING_UPBIT_SECRET_KEY',
            'STAGING_BITGET_API_KEY',
            'STAGING_BITGET_SECRET_KEY',
            'STAGING_BITGET_PASSPHRASE',
          ];
          const missing = required.filter((name) => !String(process.env[name] ?? '').trim());
          if (missing.length) {
            console.error(`Missing staging Environment secret(s): ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE
          mkdir -p "$STAGING_ARTIFACT_DIR"
          runner="$(mktemp --suffix=.mjs)"
          cleanup_runner() { rm -f "$runner"; }
          trap cleanup_runner EXIT
          pnpm --dir api-server exec esbuild \
            src/features/account-readonly/staging-account-readonly-no-db-evidence.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --outfile="$runner"
          node "$runner"

      - name: Re-prove current main and Staging egress unchanged
        id: post_identity
        if: always() && steps.account_evidence.outcome != 'skipped'
        continue-on-error: true
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main^{commit})"
          [[ "$CURRENT_MAIN" == "$TARGET_SHA" ]] || {
            echo "Main moved during account evidence. target=$TARGET_SHA current=$CURRENT_MAIN" >&2
            exit 1
          }
          ACTUAL_EGRESS_IP="$(ssh \
            -i "$SSH_KEY_PATH" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            'curl --fail --silent --show-error --max-time 10 https://api.ipify.org')"
          [[ -n "$ACTUAL_EGRESS_IP" && "$ACTUAL_EGRESS_IP" == "$EXPECTED_EGRESS_IP" ]] || {
            echo 'Staging egress identity changed during account evidence.' >&2
            exit 1
          }

      - name: Sanitize and prove no account secret entered artifacts
        id: sanitize
        if: always() && steps.account_evidence.outcome != 'skipped'
        continue-on-error: true
        env:
          STAGING_TOSS_CLIENT_ID: ${{ secrets.STAGING_TOSS_CLIENT_ID || secrets.TOSS_CLIENT_ID }}
          STAGING_TOSS_CLIENT_SECRET: ${{ secrets.STAGING_TOSS_CLIENT_SECRET || secrets.TOSS_CLIENT_SECRET_KEY }}
          STAGING_TOSS_ACCOUNT_SEQ: ${{ secrets.STAGING_TOSS_ACCOUNT_SEQ }}
          STAGING_UPBIT_ACCESS_KEY: ${{ secrets.STAGING_UPBIT_ACCESS_KEY || secrets.UPBIT_API_KEY }}
          STAGING_UPBIT_SECRET_KEY: ${{ secrets.STAGING_UPBIT_SECRET_KEY || secrets.UPBIT_SECRET_KEY }}
          STAGING_BITGET_API_KEY: ${{ secrets.STAGING_BITGET_API_KEY || secrets.BITGET_API_KEY }}
          STAGING_BITGET_SECRET_KEY: ${{ secrets.STAGING_BITGET_SECRET_KEY || secrets.BITGET_SECRET_KEY }}
          STAGING_BITGET_PASSPHRASE: ${{ secrets.STAGING_BITGET_PASSPHRASE || secrets.BITGET_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          if [[ -d "$STAGING_ARTIFACT_DIR" ]]; then
            node api-server/scripts/sanitize-staging-playwright-artifacts.mjs "$STAGING_ARTIFACT_DIR"
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.STAGING_ARTIFACT_DIR;
          const secretNames = [
            'STAGING_TOSS_CLIENT_ID',
            'STAGING_TOSS_CLIENT_SECRET',
            'STAGING_TOSS_ACCOUNT_SEQ',
            'STAGING_UPBIT_ACCESS_KEY',
            'STAGING_UPBIT_SECRET_KEY',
            'STAGING_BITGET_API_KEY',
            'STAGING_BITGET_SECRET_KEY',
            'STAGING_BITGET_PASSPHRASE',
          ];
          const secrets = secretNames.map((name) => process.env[name]).filter(Boolean).map(String);
          const files = [];
          const walk = (root) => {
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const file = path.join(root, entry.name);
              if (entry.isDirectory()) walk(file); else files.push(file);
            }
          };
          walk(dir);
          for (const file of files) {
            const body = fs.readFileSync(file);
            for (const secret of secrets) {
              if (body.includes(Buffer.from(secret))) {
                throw new Error(`secret value detected in account evidence artifact: ${path.relative(dir, file)}`);
              }
            }
          }
          console.log(JSON.stringify({ artifact_files_scanned: files.length, secret_values_detected: 0 }));
          NODE
          fi

      - name: Upload secret-free immutable account evidence
        id: upload
        if: >-
          always() &&
          steps.account_evidence.outcome != 'skipped' &&
          steps.post_identity.outcome == 'success' &&
          steps.sanitize.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: staging-account-readonly-${{ steps.target.outputs.sha }}
          path: ${{ env.STAGING_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce account evidence verdict
        if: always()
        env:
          EVIDENCE: ${{ steps.account_evidence.outcome }}
          POST_IDENTITY: ${{ steps.post_identity.outcome }}
          SANITIZE: ${{ steps.sanitize.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          set -Eeuo pipefail
          require_success() {
            local name="$1"
            local value="$2"
            if [[ "$value" != success ]]; then
              echo "Account read-only evidence stopped at ${name}: ${value:-unknown}" >&2
              exit 1
            fi
          }
          require_success account-evidence "$EVIDENCE"
          require_success post-identity "$POST_IDENTITY"
          require_success artifact-sanitization "$SANITIZE"
          require_success artifact-upload "$UPLOAD"

      - name: Write account evidence summary
        if: success()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo '## Staging Account Read-only Evidence'
            echo
            echo "- Exact current main: \`$TARGET_SHA\`"
            echo '- Evidence mode: `CANONICAL_ACCOUNT_RUNTIME_NO_DB`'
            echo '- Execution runner: `GitHub-hosted ubuntu-latest`'
            echo '- Provider network egress: `Staging SSH TCP tunnel`'
            echo '- Provider TLS termination: `GitHub-hosted evidence process`'
            echo '- Provider TLS payload traverses Staging host: `true`'
            echo '- Provider Secret plaintext exposed to Staging host: `false`'
            echo '- Provider allowlist egress IP match before/after reads: `true`'
            echo '- Target remained exact current main after reads: `true`'
            echo '- Database / Supabase credential storage required: `false`'
            echo '- Credential persistence rows created: `0`'
            echo '- Application deployment mutated: `false`'
            echo '- Production mutated: `false`'
            echo '- Toss private operation type: `OAuth token + GET account/holdings only`'
            echo '- Upbit private operation type: `GET only`'
            echo '- Bitget private operation type: `GET only`'
            echo '- Kiwoom account linking: `hidden / not tested`'
            echo '- Order/cancel/amend/transfer/withdrawal requests: `0`'
            echo '- Credentials returned or recorded in artifacts: `false`'
            echo '- Credential source: `staging Actions secrets in GitHub-hosted process memory only`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close provider egress tunnels and clean workspace
        if: always()
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
        run: |
          set +e
          if [[ -e "$SSH_CONTROL_SOCKET" && -f "$SSH_KEY_PATH" && -f "$SSH_KNOWN_HOSTS_PATH" && -n "$STAGING_SSH_HOST" && -n "$STAGING_SSH_USER" ]]; then
            ssh -S "$SSH_CONTROL_SOCKET" -O exit \
              -i "$SSH_KEY_PATH" \
              -p "$STAGING_SSH_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST"
          fi
          rm -rf "$STAGING_ARTIFACT_DIR"
          rm -f "$SSH_CONTROL_SOCKET" "$SSH_KEY_PATH" "$SSH_KNOWN_HOSTS_PATH"
