name: Research Production Activation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/research-production-activation.yml
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: research-production-activation
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate activation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          grep -q '^  issue_comment:$' .github/workflows/research-production-activation.yml
          grep -q '/activate-research-production' .github/workflows/research-production-activation.yml
          grep -q 'LIVE_TRADING=false' .github/workflows/research-production-activation.yml
          grep -q 'PRIVATE_API_ENABLED=false' .github/workflows/research-production-activation.yml
          grep -q 'ORDER_AUTHORITY=false' .github/workflows/research-production-activation.yml
          grep -q 'PR_NUMBER: 357' .github/workflows/research-production-activation.yml
          ! grep -q 'ops/deploy-production.sh' .github/workflows/research-production-activation.yml
          ! grep -q 'pm2 restart' .github/workflows/research-production-activation.yml

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 62 &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.gate.outputs.target_sha }}
      research_head_sha: ${{ steps.gate.outputs.research_head_sha }}
      application_run_id: ${{ steps.gate.outputs.application_run_id }}
    env:
      PR_NUMBER: 357
    steps:
      - name: Authorize exact command, immutable main, PR provenance, and exact-head CI
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.comment?.body ?? '').trim();
            const match = body.match(/^\/activate-research-production ([0-9a-f]{40})$/i);
            if (!match) {
              core.setFailed('Expected exact command: /activate-research-production <40-char-main-sha>');
              return;
            }
            const targetSha = match[1].toLowerCase();
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const currentMainSha = branch.data.commit.sha.toLowerCase();
            if (targetSha !== currentMainSha) {
              core.setFailed(`Target must equal exact current main: target=${targetSha} main=${currentMainSha}`);
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            const prResponse = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const pr = prResponse.data;
            if (!pr.merged || String(pr.merge_commit_sha ?? '').toLowerCase() !== targetSha) {
              core.setFailed(`PR #${prNumber} must be merged as exact current main before activation.`);
              return;
            }
            const researchHeadSha = String(pr.head.sha).toLowerCase();

            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: researchHeadSha,
              per_page: 100,
            });
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const latestByContext = new Map();
            for (const status of statuses.sort((a, b) => b.id - a.id)) {
              if (!latestByContext.has(status.context)) latestByContext.set(status.context, status);
            }
            for (const name of required) {
              const status = latestByContext.get(name);
              if (!status || status.state !== 'success') {
                core.setFailed(`Required exact-head status missing or not successful: ${name}`);
                return;
              }
            }
            const runIds = new Set(required.map((name) => {
              const url = latestByContext.get(name)?.target_url ?? '';
              const m = url.match(/\/actions\/runs\/(\d+)/);
              return m?.[1] ?? '';
            }));
            if (runIds.size !== 1 || runIds.has('')) {
              core.setFailed('Required statuses must come from one exact-head Application CI run.');
              return;
            }
            const applicationRunId = [...runIds][0];
            const appRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(applicationRunId),
            });
            if (
              appRun.data.head_sha.toLowerCase() !== researchHeadSha ||
              appRun.data.event !== 'pull_request' ||
              appRun.data.status !== 'completed' ||
              appRun.data.conclusion !== 'success'
            ) {
              core.setFailed('Exact-head Application CI provenance rejected.');
              return;
            }

            core.setOutput('target_sha', targetSha);
            core.setOutput('research_head_sha', researchHeadSha);
            core.setOutput('application_run_id', applicationRunId);

      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify merge parents and exact-main Research contract
        env:
          TARGET_SHA: ${{ steps.gate.outputs.target_sha }}
          RESEARCH_HEAD_SHA: ${{ steps.gate.outputs.research_head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          read -r commit parent1 parent2 extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$TARGET_SHA"
          test "$parent2" = "$RESEARCH_HEAD_SHA"
          test -z "${extra:-}"
          systemd-analyze verify \
            research-production/deploy/research-production@.service \
            research-production/deploy/research-production-fast-historical.timer \
            research-production/deploy/research-production-long-history.timer \
            research-production/deploy/research-production-forward.timer
          cd research-production
          npm test
          cd ..
          node research-production/bin/research-cycle.mjs preflight \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-root "$RUNNER_TEMP/research-production-preflight" \
            --research-sha "$TARGET_SHA"
          node research-production/bin/research-cycle.mjs plan \
            --profile all \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-root "$RUNNER_TEMP/research-production-preflight" \
            --research-sha "$TARGET_SHA" > "$RUNNER_TEMP/research-plan.json"
          node -e "const p=require(process.argv[1]); if(p.taskCount!==10||p.stepCount!==21||p.liveTrading||p.privateApi||p.orderAuthority) process.exit(1)" "$RUNNER_TEMP/research-plan.json"

  activate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      RESEARCH_HEAD_SHA: ${{ needs.authorize.outputs.research_head_sha }}
      APPLICATION_RUN_ID: ${{ needs.authorize.outputs.application_run_id }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
    steps:
      - name: Validate SSH inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$TARGET_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Read-only server resource and authority preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q' "$TARGET_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          command -v git >/dev/null
          command -v node >/dev/null
          command -v systemctl >/dev/null
          command -v systemd-analyze >/dev/null
          if [[ "$(id -u)" -ne 0 ]]; then sudo -n true; fi
          node_major="$(node -p 'Number(process.versions.node.split(".")[0])')"
          (( node_major >= 20 )) || { echo "Node >=20 required; found $(node --version)" >&2; exit 70; }
          free_bytes="$(df -PB1 / | awk 'NR==2 {print $4}')"
          free_inodes="$(df -Pi / | awk 'NR==2 {print $4}')"
          mem_available="$(awk '/MemAvailable:/ {print $2 * 1024}' /proc/meminfo)"
          cores="$(nproc)"
          (( free_bytes >= 5368709120 )) || { echo "Need at least 5 GiB free disk; have $free_bytes" >&2; exit 71; }
          (( free_inodes >= 50000 )) || { echo "Need at least 50000 free inodes; have $free_inodes" >&2; exit 72; }
          app_sha="absent"
          if [[ -s /opt/stock-app/.deploy/current-sha ]]; then app_sha="$(tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha)"; fi
          printf '%s\n' \
            "SERVER_PREFLIGHT=PASS" \
            "TARGET_SHA=$TARGET_SHA" \
            "NODE=$(node --version)" \
            "CPU_CORES=$cores" \
            "MEM_AVAILABLE_BYTES=$mem_available" \
            "FREE_BYTES=$free_bytes" \
            "FREE_INODES=$free_inodes" \
            "APP_SHA_BEFORE=$app_sha" \
            "LIVE_TRADING=false" \
            "PRIVATE_API=false" \
            "ORDER_AUTHORITY=false"
          REMOTE

      - name: Install isolated Research Production and activate timers
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q' "$TARGET_SHA" "$REPOSITORY_URL")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s" <<'REMOTE'
          set -Eeuo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=(); else SUDO=(sudo -n); fi
          fail_safe() {
            status=$?
            if (( status != 0 )); then
              "${SUDO[@]}" systemctl disable --now \
                research-production-fast-historical.timer \
                research-production-long-history.timer \
                research-production-forward.timer >/dev/null 2>&1 || true
            fi
            rm -rf -- "${SOURCE_DIR:-}"
            exit "$status"
          }
          trap fail_safe EXIT
          ROOT=/opt/investment-research
          RELEASES="$ROOT/releases"
          RELEASE="$RELEASES/$TARGET_SHA"
          CURRENT="$ROOT/current"
          STATE=/var/lib/investment-research-production
          ENV_DIR=/etc/investment-research
          ENV_FILE="$ENV_DIR/research-production.env"
          SOURCE_DIR="$(mktemp -d /tmp/investment-research-source.XXXXXX)"
          APP_STATE=/opt/stock-app/.deploy/current-sha
          app_sha_before="absent"
          if [[ -s "$APP_STATE" ]]; then app_sha_before="$(tr -d '[:space:]' < "$APP_STATE")"; fi

          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          resolved="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})"
          [[ "$resolved" == "$TARGET_SHA" ]] || { echo "Exact SHA resolution mismatch" >&2; exit 73; }
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"

          free_bytes="$(df -PB1 / | awk 'NR==2 {print $4}')"
          mem_available="$(awk '/MemAvailable:/ {print $2 * 1024}' /proc/meminfo)"
          cores="$(nproc)"
          concurrency=1
          if (( cores >= 4 && mem_available >= 4294967296 && free_bytes >= 10737418240 )); then
            concurrency=4
          elif (( cores >= 2 && mem_available >= 2147483648 )); then
            concurrency=2
          fi

          if ! id investment-research >/dev/null 2>&1; then
            "${SUDO[@]}" useradd --system --home /nonexistent --shell /usr/sbin/nologin investment-research
          fi
          "${SUDO[@]}" install -d -o root -g root -m 0755 "$ROOT" "$RELEASES"
          "${SUDO[@]}" install -d -o investment-research -g investment-research -m 0750 "$STATE"
          "${SUDO[@]}" install -d -o root -g investment-research -m 0750 "$ENV_DIR"

          if [[ ! -d "$RELEASE" ]]; then
            "${SUDO[@]}" install -d -o root -g root -m 0755 "$RELEASE"
            "${SUDO[@]}" cp -a "$SOURCE_DIR"/. "$RELEASE"/
            "${SUDO[@]}" chown -R root:root "$RELEASE"
          fi
          "${SUDO[@]}" ln -sfn "$RELEASE" "$ROOT/current.new"
          "${SUDO[@]}" mv -Tf "$ROOT/current.new" "$CURRENT"

          env_tmp="$(mktemp)"
          cat > "$env_tmp" <<ENV
          RESEARCH_REPO_ROOT=$CURRENT
          RESEARCH_STATE_ROOT=$STATE
          RESEARCH_CODE_SHA=$TARGET_SHA
          RESEARCH_CONCURRENCY=$concurrency
          RESEARCH_MIN_FREE_BYTES=5368709120
          LIVE_TRADING=false
          LIVE_TRADING_ENABLED=false
          REAL_ORDER_ENABLED=false
          REAL_TRADING_ENABLED=false
          PRIVATE_API_ENABLED=false
          PRIVATE_ACCOUNT_ACCESS=false
          PRIVATE_TRADING_API_ALLOWED=false
          ORDER_AUTHORITY=false
          ORDER_SUBMISSION_ENABLED=false
          ENV
          "${SUDO[@]}" install -o root -g investment-research -m 0640 "$env_tmp" "$ENV_FILE"
          rm -f "$env_tmp"

          "${SUDO[@]}" install -o root -g root -m 0644 \
            "$CURRENT/research-production/deploy/research-production@.service" \
            /etc/systemd/system/research-production@.service
          for timer in fast-historical long-history forward; do
            "${SUDO[@]}" install -o root -g root -m 0644 \
              "$CURRENT/research-production/deploy/research-production-$timer.timer" \
              "/etc/systemd/system/research-production-$timer.timer"
          done
          "${SUDO[@]}" systemctl daemon-reload

          if command -v runuser >/dev/null 2>&1; then
            RUN_AS_RESEARCH=(runuser -u investment-research --)
          else
            RUN_AS_RESEARCH=(sudo -n -u investment-research)
          fi
          "${RUN_AS_RESEARCH[@]}" env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            HOME=/nonexistent \
            LANG=C.UTF-8 \
            TZ=UTC \
            RESEARCH_REPO_ROOT="$CURRENT" \
            RESEARCH_STATE_ROOT="$STATE" \
            RESEARCH_CODE_SHA="$TARGET_SHA" \
            RESEARCH_CONCURRENCY="$concurrency" \
            RESEARCH_MIN_FREE_BYTES=5368709120 \
            LIVE_TRADING=false \
            PRIVATE_API_ENABLED=false \
            ORDER_AUTHORITY=false \
            node "$CURRENT/research-production/bin/research-cycle.mjs" preflight \
              --repo-root "$CURRENT" \
              --state-root "$STATE" \
              --research-sha "$TARGET_SHA"

          "${SUDO[@]}" systemctl enable --now \
            research-production-fast-historical.timer \
            research-production-long-history.timer \
            research-production-forward.timer

          for timer in \
            research-production-fast-historical.timer \
            research-production-long-history.timer \
            research-production-forward.timer; do
            "${SUDO[@]}" systemctl is-enabled --quiet "$timer"
            "${SUDO[@]}" systemctl is-active --quiet "$timer"
          done

          app_sha_after="absent"
          if [[ -s "$APP_STATE" ]]; then app_sha_after="$(tr -d '[:space:]' < "$APP_STATE")"; fi
          [[ "$app_sha_after" == "$app_sha_before" ]] || {
            echo "Existing application deployment SHA changed unexpectedly" >&2
            exit 74
          }

          printf '%s\n' \
            "RESEARCH_PRODUCTION_ACTIVATED=true" \
            "TARGET_SHA=$TARGET_SHA" \
            "CONCURRENCY=$concurrency" \
            "APP_SHA_BEFORE=$app_sha_before" \
            "APP_SHA_AFTER=$app_sha_after" \
            "LIVE_TRADING=false" \
            "PRIVATE_API=false" \
            "ORDER_AUTHORITY=false"
          "${SUDO[@]}" systemctl list-timers --all \
            research-production-fast-historical.timer \
            research-production-long-history.timer \
            research-production-forward.timer --no-pager
          REMOTE

      - name: Record activation report in Central Hub
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '[RESEARCH_PRODUCTION_ACTIVATION]',
              'status: success',
              `target_sha: ${process.env.TARGET_SHA}`,
              `source_pr_head: ${process.env.RESEARCH_HEAD_SHA}`,
              `application_ci_run: ${process.env.APPLICATION_RUN_ID}`,
              'exact_main_research_self_check: success',
              'installation: /opt/investment-research/current',
              'state: /var/lib/investment-research-production',
              'timers: fast-historical=enabled; long-history=enabled; forward=enabled',
              'existing_app_deploy_mutation: 0',
              'production_db_mutation: 0',
              'live_trading: false',
              'private_api: false',
              'order_authority: false',
              'real_order_count: 0',
              'next: verify first natural research cycles and accumulated evidence',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body,
            });

      - name: Record failed activation in Central Hub
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '[RESEARCH_PRODUCTION_ACTIVATION]',
              'status: failed_closed',
              `target_sha: ${process.env.TARGET_SHA}`,
              `workflow_run: ${context.runId}`,
              'live_trading: false',
              'private_api: false',
              'order_authority: false',
              'real_order_count: 0',
              'next: inspect this exact workflow run before retrying; do not bypass the failed gate',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body,
            });
