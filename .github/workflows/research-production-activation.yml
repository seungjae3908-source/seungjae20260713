name: Research Production Activation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/research-production-activation.yml
      - research-production/**
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: research-production-activation
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate activation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          bash -n research-production/deploy/activate-server.sh
          grep -q '/activate-research-production' .github/workflows/research-production-activation.yml
          grep -q 'LIVE_TRADING=false' research-production/deploy/activate-server.sh
          grep -q 'PRIVATE_API_ENABLED=false' research-production/deploy/activate-server.sh
          grep -q 'ORDER_AUTHORITY=false' research-production/deploy/activate-server.sh
          grep -q 'research-production-forward.timer' research-production/deploy/activate-server.sh

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 62 &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.gate.outputs.target_sha }}
      research_head_sha: ${{ steps.gate.outputs.research_head_sha }}
      application_run_id: ${{ steps.gate.outputs.application_run_id }}
    env:
      PR_NUMBER: 357
    steps:
      - name: Authorize immutable main, merged PR, and exact-head CI
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.comment?.body ?? '').trim();
            const match = body.match(/^\/activate-research-production ([0-9a-f]{40})$/i);
            if (!match) {
              core.setFailed('Expected /activate-research-production <40-char-main-sha>');
              return;
            }
            const targetSha = match[1].toLowerCase();
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            });
            if (main.data.commit.sha.toLowerCase() !== targetSha) {
              core.setFailed(`Target is not exact current main: ${targetSha}`);
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            })).data;
            if (!pr.merged || String(pr.merge_commit_sha ?? '').toLowerCase() !== targetSha) {
              core.setFailed(`PR #${prNumber} is not the exact current-main merge.`);
              return;
            }
            const headSha = String(pr.head.sha).toLowerCase();

            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100,
            });
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const latest = new Map();
            for (const status of statuses.sort((a, b) => b.id - a.id)) {
              if (!latest.has(status.context)) latest.set(status.context, status);
            }
            for (const name of required) {
              if (latest.get(name)?.state !== 'success') {
                core.setFailed(`Required exact-head status not successful: ${name}`);
                return;
              }
            }
            const runIds = new Set(required.map((name) => {
              const m = String(latest.get(name)?.target_url ?? '').match(/\/actions\/runs\/(\d+)/);
              return m?.[1] ?? '';
            }));
            if (runIds.size !== 1 || runIds.has('')) {
              core.setFailed('Required statuses do not share one Application CI run.');
              return;
            }
            const applicationRunId = [...runIds][0];
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: Number(applicationRunId),
            })).data;
            if (
              run.head_sha.toLowerCase() !== headSha ||
              run.event !== 'pull_request' ||
              run.status !== 'completed' ||
              run.conclusion !== 'success'
            ) {
              core.setFailed('Application CI provenance rejected.');
              return;
            }
            core.setOutput('target_sha', targetSha);
            core.setOutput('research_head_sha', headSha);
            core.setOutput('application_run_id', applicationRunId);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact merged main and Research contract
        env:
          TARGET_SHA: ${{ steps.gate.outputs.target_sha }}
          RESEARCH_HEAD_SHA: ${{ steps.gate.outputs.research_head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          read -r commit parent1 parent2 extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$TARGET_SHA"
          test "$parent2" = "$RESEARCH_HEAD_SHA"
          test -z "${extra:-}"
          bash -n research-production/deploy/activate-server.sh
          systemd-analyze verify \
            research-production/deploy/research-production@.service \
            research-production/deploy/research-production-fast-historical.timer \
            research-production/deploy/research-production-long-history.timer \
            research-production/deploy/research-production-forward.timer
          npm --prefix research-production test
          node research-production/bin/research-cycle.mjs preflight \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-root "$RUNNER_TEMP/research-production-preflight" \
            --research-sha "$TARGET_SHA"
          node research-production/bin/research-cycle.mjs plan \
            --profile all \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-root "$RUNNER_TEMP/research-production-preflight" \
            --research-sha "$TARGET_SHA" > "$RUNNER_TEMP/research-plan.json"
          node -e "const p=require(process.argv[1]);if(p.taskCount!==10||p.stepCount!==21||p.liveTrading||p.privateApi||p.orderAuthority)process.exit(1)" \
            "$RUNNER_TEMP/research-plan.json"

  activate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      RESEARCH_HEAD_SHA: ${{ needs.authorize.outputs.research_head_sha }}
      APPLICATION_RUN_ID: ${{ needs.authorize.outputs.application_run_id }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Read-only server preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q' "$TARGET_SHA" "$REPOSITORY_URL")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s -- preflight" \
            < research-production/deploy/activate-server.sh

      - name: Activate isolated Research Production
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_env="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q' "$TARGET_SHA" "$REPOSITORY_URL")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -s -- activate" \
            < research-production/deploy/activate-server.sh

      - name: Report success to Central Hub
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body: [
                '[RESEARCH_PRODUCTION_ACTIVATION]',
                'status: success',
                `target_sha: ${process.env.TARGET_SHA}`,
                `source_pr_head: ${process.env.RESEARCH_HEAD_SHA}`,
                `application_ci_run: ${process.env.APPLICATION_RUN_ID}`,
                'exact_main_research_self_check: success',
                'timers: fast-historical=enabled; long-history=enabled; forward=enabled',
                'existing_app_deploy_mutation: 0',
                'production_db_mutation: 0',
                'live_trading: false',
                'private_api: false',
                'order_authority: false',
                'real_order_count: 0',
                'next: verify first natural research cycles',
              ].join('\n'),
            });

      - name: Report fail-closed to Central Hub
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body: [
                '[RESEARCH_PRODUCTION_ACTIVATION]',
                'status: failed_closed',
                `target_sha: ${process.env.TARGET_SHA}`,
                `workflow_run: ${context.runId}`,
                'live_trading: false',
                'private_api: false',
                'order_authority: false',
                'real_order_count: 0',
                'next: inspect this exact run and fix the failure before retry',
              ].join('\n'),
            });
