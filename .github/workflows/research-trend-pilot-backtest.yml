name: Research Trend Pilot Backtest

# Read-only research: BTC/ETH long-short trend-following pilot rules on public
# Bitget candles (pre-2026). No exchange keys, no orders, no production access.
on:
  workflow_dispatch:
    inputs:
      history:
        description: 'long = Binance archive 1h from 2020-06 (pilot rules only); empty = Bitget ~820 days + four-market'
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/research-trend-pilot-backtest.yml
      - research-production/src/trend-pilot-backtest-v1.mjs
      - research-production/bin/trend-pilot-backtest.mjs
      - research-production/src/aggressive-sleeve-backtest-v1.mjs
      - research-production/src/four-market-trend-backtest-v1.mjs
      - research-production/bin/four-market-trend-backtest.mjs

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public candles and run the pilot backtest
        run: |
          set -Eeuo pipefail
          if [ "${{ inputs.history }}" = "long" ]; then
            node research-production/bin/trend-pilot-backtest.mjs --fetch-long "$RUNNER_TEMP/state" 2> trend-pilot-fetch.log | tee trend-pilot-report.txt
          else
            node research-production/bin/trend-pilot-backtest.mjs --fetch "$RUNNER_TEMP/state" | tee trend-pilot-report.txt
          fi
          cp "$RUNNER_TEMP/state/latest/trend-pilot-backtest-v1.json" trend-pilot-backtest-v1.json
          cp "$RUNNER_TEMP/state/latest/aggressive-sleeve-backtest-v1.json" aggressive-sleeve-backtest-v1.json || true
          { echo '```'; cat trend-pilot-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Four-market trend backtest (KR/US stocks, coin spot, coin futures)
        if: ${{ inputs.history != 'long' }}
        run: |
          set -Eeuo pipefail
          node research-production/bin/four-market-trend-backtest.mjs --fetch "$RUNNER_TEMP/four" | tee four-market-report.txt
          cp "$RUNNER_TEMP/four/latest/four-market-trend-backtest-v1.json" four-market-trend-backtest-v1.json
          { echo '```'; cat four-market-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-pilot-backtest
          path: |
            trend-pilot-report.txt
            trend-pilot-fetch.log
            trend-pilot-backtest-v1.json
            aggressive-sleeve-backtest-v1.json
            four-market-report.txt
            four-market-trend-backtest-v1.json
          retention-days: 90
