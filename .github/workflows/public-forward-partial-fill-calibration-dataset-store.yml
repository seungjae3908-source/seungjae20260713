name: Public Forward Partial Fill Calibration Dataset Store

on:
  pull_request:
    paths:
      - 'api-server/src/services/public-forward-partial-fill-calibration-dataset-store.service.ts'
      - 'api-server/src/services/public-forward-partial-fill-calibration-dataset-store.service.test.ts'
      - '.github/workflows/public-forward-partial-fill-calibration-dataset-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API server
        run: pnpm --dir api-server run typecheck

      - name: Bundle focused dataset store test
        run: >-
          pnpm --dir api-server exec esbuild
          src/services/public-forward-partial-fill-calibration-dataset-store.service.test.ts
          --bundle --platform=node --format=cjs --target=node20
          --outfile=/tmp/public-forward-partial-fill-calibration-dataset-store.test.cjs

      - name: Run focused dataset store test
        run: node --test /tmp/public-forward-partial-fill-calibration-dataset-store.test.cjs

      - name: Verify fail-closed dataset invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE='api-server/src/services/public-forward-partial-fill-calibration-dataset-store.service.ts'
          grep -Fq "sourceType: 'PUBLIC_FORWARD_SIMULATION'" "$FILE"
          grep -Fq "actualFillClaimAllowed: false" "$FILE"
          grep -Fq "partialFillCostProduced: false" "$FILE"
          grep -Fq "calibrationArtifactProduced: false" "$FILE"
          grep -Fq "calibrationSampleSufficient: false" "$FILE"
          grep -Fq "regimeScopeComplete: false" "$FILE"
          grep -Fq "splitAssignmentComplete: false" "$FILE"
          grep -Fq "oosValidationComplete: false" "$FILE"
          grep -Fq "naturalEntryCredit: 0" "$FILE"
          grep -Fq "runtimeCostCredit: 0" "$FILE"
          grep -Fq "executionAuthority: 'NONE'" "$FILE"
          grep -Fq "privateApiAllowed: false" "$FILE"
          grep -Fq "liveTrading: false" "$FILE"
          grep -Fq "orderSubmissionAllowed: false" "$FILE"
          grep -Fq "fullCostReady: false" "$FILE"
          grep -Fq "BLOCKED_STORAGE:STATE_ROOT_MISSING" "$FILE"
          grep -Fq "OBSERVATION_ID_CONTENT_CONFLICT" "$FILE"
