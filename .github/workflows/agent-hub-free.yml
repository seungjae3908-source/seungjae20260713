name: Free Agent Hub Coordinator

on:
  push:
    branches:
      - agent/agent-hub-coordinator-v2
    paths:
      - .github/workflows/agent-hub-free.yml
      - .github/workflows/agent-hub-executor.yml
      - .github/agent-hub/policy.json
      - .github/agent-hub/workers.json
      - scripts/agent_hub_policy.py
      - scripts/agent_hub_free.py
      - scripts/agent_hub_executor.py
      - scripts/agent_hub_executor_report.py
      - docs/agent-hub-free.md
      - docs/agent-hub-executor.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-hub-free.yml
      - .github/workflows/agent-hub-executor.yml
      - .github/agent-hub/policy.json
      - .github/agent-hub/workers.json
      - scripts/agent_hub_policy.py
      - scripts/agent_hub_free.py
      - scripts/agent_hub_executor.py
      - scripts/agent_hub_executor_report.py
      - docs/agent-hub-free.md
      - docs/agent-hub-executor.md
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [agent-executor-report-ready]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-agent-hub-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate policy data
        run: |
          python3 -m json.tool .github/agent-hub/policy.json >/dev/null
          python3 -m json.tool .github/agent-hub/workers.json >/dev/null
      - name: Compile coordinator and executor
        run: |
          python3 -m py_compile \
            scripts/agent_hub_policy.py \
            scripts/agent_hub_free.py \
            scripts/agent_hub_executor.py \
            scripts/agent_hub_executor_report.py
      - name: Run deterministic policy tests
        env:
          PYTHONPATH: scripts
        run: |
          python3 scripts/agent_hub_policy.py
          python3 scripts/agent_hub_free.py --self-test
          python3 scripts/agent_hub_executor.py --self-test
          python3 scripts/agent_hub_executor_report.py --self-test

  gemini-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check free Gemini secret
        id: secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "configured=$([[ -n \"$GEMINI_API_KEY\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Call pinned free model with one transient retry
        if: steps.secret.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          model = 'gemini-3.1-flash-lite'
          payload = {
              'contents': [{'role': 'user', 'parts': [{'text': 'Reply exactly AGENT_HUB_GEMINI_OK'}]}],
              'generationConfig': {
                  'maxOutputTokens': 512,
                  'thinkingConfig': {'thinkingLevel': 'low'},
              },
          }
          request = Request(
              f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json', 'x-goog-api-key': os.environ['GEMINI_API_KEY']},
              method='POST',
          )
          data = None
          for attempt in range(2):
              try:
                  with urlopen(request, timeout=60) as response:
                      data = json.loads(response.read())
                  break
              except HTTPError as exc:
                  if exc.code == 429:
                      raise SystemExit('free quota exhausted; paid fallback is disabled') from exc
                  if exc.code in {502, 503, 504} and attempt == 0:
                      time.sleep(5)
                      continue
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'Gemini HTTP {exc.code}: {detail[:400]}') from exc
          if data is None:
              raise SystemExit('Gemini transient retry exhausted; paid fallback is disabled')
          text = ''.join(
              part.get('text', '')
              for part in data['candidates'][0].get('content', {}).get('parts', [])
          )
          assert 'AGENT_HUB_GEMINI_OK' in text, text[:200]
          PY

  process-report:
    if: >-
      github.event_name != 'push' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 62 &&
          !github.event.issue.pull_request &&
          contains(github.event.comment.body, '[WORKER_REPORT]') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Coordinate next safe action
        env:
          PYTHONPATH: scripts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUB_ISSUE_NUMBER: '62'
        run: python3 scripts/agent_hub_free.py
