name: Free Agent Hub Coordinator

on:
  push:
    branches:
      - agent/agent-hub-coordinator-v2
    paths:
      - .github/workflows/agent-hub-free.yml
      - .github/workflows/agent-hub-executor.yml
      - .github/agent-hub/policy.json
      - .github/agent-hub/workers.json
      - scripts/agent_hub_policy.py
      - scripts/agent_hub_free.py
      - scripts/agent_hub_coordinator_v2.py
      - scripts/agent_hub_contract_v2.py
      - scripts/agent_hub_prompt_compiler_v2.py
      - scripts/agent_hub_executor.py
      - scripts/agent_hub_executor_gate_v2.py
      - scripts/agent_hub_executor_report.py
      - scripts/agent_hub_executor_report_v2.py
      - scripts/agent_hub_state_v2.py
      - scripts/agent_hub_security_v2.py
      - scripts/agent_hub_github_validation_v2.py
      - scripts/agent_hub_command_integrity_v2.py
      - scripts/agent_hub_executor_safety_v2.py
      - scripts/agent_hub_prompt_compiler_hardening_v2.py
      - scripts/agent_hub_coordinator_hardening_v2.py
      - scripts/agent_hub_executor_gate_hardening_v2.py
      - scripts/agent_hub_executor_report_hardening_v2.py
      - scripts/agent_hub_legacy_migration_v2.py
      - scripts/test_agent_hub_v2.py
      - scripts/test_agent_hub_executor_v2.py
      - scripts/test_agent_hub_hardening_v2.py
      - docs/agent-hub*.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-hub-free.yml
      - .github/workflows/agent-hub-executor.yml
      - .github/agent-hub/policy.json
      - .github/agent-hub/workers.json
      - scripts/agent_hub_policy.py
      - scripts/agent_hub_free.py
      - scripts/agent_hub_coordinator_v2.py
      - scripts/agent_hub_contract_v2.py
      - scripts/agent_hub_prompt_compiler_v2.py
      - scripts/agent_hub_executor.py
      - scripts/agent_hub_executor_gate_v2.py
      - scripts/agent_hub_executor_report.py
      - scripts/agent_hub_executor_report_v2.py
      - scripts/agent_hub_state_v2.py
      - scripts/agent_hub_security_v2.py
      - scripts/agent_hub_github_validation_v2.py
      - scripts/agent_hub_command_integrity_v2.py
      - scripts/agent_hub_executor_safety_v2.py
      - scripts/agent_hub_prompt_compiler_hardening_v2.py
      - scripts/agent_hub_coordinator_hardening_v2.py
      - scripts/agent_hub_executor_gate_hardening_v2.py
      - scripts/agent_hub_executor_report_hardening_v2.py
      - scripts/agent_hub_legacy_migration_v2.py
      - scripts/test_agent_hub_v2.py
      - scripts/test_agent_hub_executor_v2.py
      - scripts/test_agent_hub_hardening_v2.py
      - docs/agent-hub*.md
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [agent-executor-report-ready]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-agent-hub-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate policy and registry JSON
        run: |
          python3 -m json.tool .github/agent-hub/policy.json >/dev/null
          python3 -m json.tool .github/agent-hub/workers.json >/dev/null
      - name: Compile Agent Hub processors
        run: |
          python3 -m py_compile \
            scripts/agent_hub_policy.py \
            scripts/agent_hub_free.py \
            scripts/agent_hub_coordinator_v2.py \
            scripts/agent_hub_contract_v2.py \
            scripts/agent_hub_prompt_compiler_v2.py \
            scripts/agent_hub_executor.py \
            scripts/agent_hub_executor_gate_v2.py \
            scripts/agent_hub_executor_report.py \
            scripts/agent_hub_executor_report_v2.py \
            scripts/agent_hub_state_v2.py \
            scripts/agent_hub_security_v2.py \
            scripts/agent_hub_github_validation_v2.py \
            scripts/agent_hub_command_integrity_v2.py \
            scripts/agent_hub_executor_safety_v2.py \
            scripts/agent_hub_prompt_compiler_hardening_v2.py \
            scripts/agent_hub_coordinator_hardening_v2.py \
            scripts/agent_hub_executor_gate_hardening_v2.py \
            scripts/agent_hub_executor_report_hardening_v2.py \
            scripts/agent_hub_legacy_migration_v2.py \
            scripts/test_agent_hub_v2.py \
            scripts/test_agent_hub_executor_v2.py \
            scripts/test_agent_hub_hardening_v2.py
      - name: Run deterministic Agent Hub tests
        env:
          PYTHONPATH: scripts
        run: |
          python3 scripts/agent_hub_policy.py
          python3 scripts/agent_hub_contract_v2.py
          python3 scripts/agent_hub_prompt_compiler_v2.py
          python3 scripts/agent_hub_coordinator_v2.py --self-test
          python3 scripts/agent_hub_executor_gate_v2.py --self-test
          python3 scripts/agent_hub_executor_report_v2.py --self-test
          python3 scripts/agent_hub_state_v2.py
          python3 scripts/agent_hub_security_v2.py
          python3 scripts/agent_hub_github_validation_v2.py
          python3 scripts/agent_hub_command_integrity_v2.py
          python3 scripts/agent_hub_executor_safety_v2.py --self-test
          python3 scripts/agent_hub_prompt_compiler_hardening_v2.py
          python3 scripts/agent_hub_coordinator_hardening_v2.py --self-test
          python3 scripts/agent_hub_executor_gate_hardening_v2.py --self-test
          python3 scripts/agent_hub_executor_report_hardening_v2.py --self-test
          python3 scripts/agent_hub_legacy_migration_v2.py
          python3 scripts/test_agent_hub_v2.py
          python3 scripts/test_agent_hub_executor_v2.py
          python3 scripts/test_agent_hub_hardening_v2.py
      - name: Assert fixture-only manual validation
        if: github.event_name == 'workflow_dispatch'
        run: echo 'workflow_dispatch completed fixture and self-test validation only; no Issue command was consumed.'

  gemini-smoke:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check free Gemini secret presence
        id: secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "configured=$([[ -n \"$GEMINI_API_KEY\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Call pinned free model with one transient retry
        if: steps.secret.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          model = 'gemini-3.1-flash-lite'
          payload = {
              'contents': [{'role': 'user', 'parts': [{'text': 'Reply exactly AGENT_HUB_GEMINI_OK'}]}],
              'generationConfig': {'maxOutputTokens': 512, 'thinkingConfig': {'thinkingLevel': 'low'}},
          }
          request = Request(
              f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json', 'x-goog-api-key': os.environ['GEMINI_API_KEY']},
              method='POST',
          )
          data = None
          for attempt in range(2):
              try:
                  with urlopen(request, timeout=60) as response:
                      data = json.loads(response.read())
                  break
              except HTTPError as exc:
                  if exc.code == 429:
                      raise SystemExit('free quota exhausted; paid fallback is disabled') from exc
                  if exc.code in {502, 503, 504} and attempt == 0:
                      time.sleep(2)
                      continue
                  raise
          text = ''.join(part.get('text', '') for part in data['candidates'][0].get('content', {}).get('parts', []))
          assert 'AGENT_HUB_GEMINI_OK' in text, text[:200]
          PY

  process-report:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 62 &&
        !github.event.issue.pull_request &&
        contains(github.event.comment.body, '[WORKER_REPORT]') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Coordinate next schema-v2 action with audit hardening
        id: hub
        env:
          PYTHONPATH: scripts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUB_ISSUE_NUMBER: '62'
        run: python3 scripts/agent_hub_coordinator_hardening_v2.py
      - name: Wake controlled executor only for validated ready command
        if: steps.hub.outputs.executor_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type='agent-hub-command-ready'
