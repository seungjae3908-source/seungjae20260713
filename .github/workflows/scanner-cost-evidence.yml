name: Scanner Cost Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/scanner-cost-evidence.yml
      - api-server/src/services/scanner-profit-cost-evidence-adapter.service.ts
      - api-server/src/services/scanner-profit-cost-evidence-adapter.service.test.ts

permissions:
  contents: read

jobs:
  scanner-cost-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle focused cost evidence tests
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          pnpm --dir api-server exec esbuild \
            src/services/scanner-profit-cost-evidence-adapter.service.test.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node20 \
            --outfile=../scanner-cost-evidence.test.cjs

      - name: Run focused cost evidence tests
        run: node --test scanner-cost-evidence.test.cjs
