name: Public Forward Liquidity Successor Schedule Seam Validation

on:
  pull_request:
    paths:
      - 'market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-seam-v1.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-seam-v1.test.mjs'
      - '.github/workflows/public-forward-liquidity-successor-schedule-seam-validation.yml'

permissions:
  contents: read

jobs:
  validate-successor-schedule-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert validation-only trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/public-forward-liquidity-successor-schedule-seam-validation.yml'
          if grep -Eq '^[[:space:]]{2}schedule:[[:space:]]*$' "$workflow"; then
            echo 'Forbidden activation trigger found' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]{2}workflow_dispatch:[[:space:]]*$' "$workflow"; then
            echo 'Forbidden capture-capable manual trigger found' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*-[[:space:]]*cron:' "$workflow"; then
            echo 'Forbidden cron entry found' >&2
            exit 1
          fi

      - name: Syntax check Successor seam
        run: node --check market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-seam-v1.mjs

      - name: Run focused fail-closed contract tests
        run: node --test market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-seam-v1.test.mjs

      - name: Verify no activation authority was introduced
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort | tr '\n' ' ')" = ".github/workflows/public-forward-liquidity-successor-schedule-seam-validation.yml market-intelligence-sidecar/src/public-forward-liquidity-successor-schedule-seam-v1.mjs market-intelligence-sidecar/tests/public-forward-liquidity-successor-schedule-seam-v1.test.mjs "
