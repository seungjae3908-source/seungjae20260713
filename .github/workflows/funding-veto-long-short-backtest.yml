name: Funding Veto Long Short Backtest

on:
  push:
    branches:
      - agent/funding-veto-long-short-backtest-20260726
    paths:
      - tools/backtest/funding_veto_long_short_backtest.py
      - .github/workflows/funding-veto-long-short-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backtest dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Compile backtest
        run: python -m py_compile tools/backtest/funding_veto_long_short_backtest.py

      - name: Run fourth-stage backtest
        run: python tools/backtest/funding_veto_long_short_backtest.py

      - name: Commit generated results to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtests/BITGET_5SYMBOL_OLDER89D_HARD_VETO_LONG_SHORT.md \
                  docs/backtests/BITGET_5SYMBOL_OLDER89D_HARD_VETO_LONG_SHORT.json \
                  docs/backtests/BITGET_5SYMBOL_OLDER89D_HARD_VETO_LONG_SHORT_RUNS.csv \
                  docs/backtests/BITGET_5SYMBOL_OLDER89D_HARD_VETO_LONG_SHORT_TRADES.csv
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "test: record hard-veto long-short results [skip ci]"
            git push
          fi
