name: Staging Readiness

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA from main to validate in staging
        required: true
        type: string
      run_destructive_recovery_drill:
        description: Run the staging-only backup, delete, restore, failpoint rollback, and previous-SHA drill
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: stock-app-staging-readiness
  cancel-in-progress: false

jobs:
  validate-input:
    name: Validate isolated staging configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_AI_API_KEY: ${{ secrets.STAGING_AI_API_KEY }}
      STAGING_PENDING_EMAIL: ${{ secrets.STAGING_PENDING_EMAIL }}
      STAGING_PENDING_PASSWORD: ${{ secrets.STAGING_PENDING_PASSWORD }}
      STAGING_ASSOCIATE_EMAIL: ${{ secrets.STAGING_ASSOCIATE_EMAIL }}
      STAGING_ASSOCIATE_PASSWORD: ${{ secrets.STAGING_ASSOCIATE_PASSWORD }}
      STAGING_REGULAR_EMAIL: ${{ secrets.STAGING_REGULAR_EMAIL }}
      STAGING_REGULAR_PASSWORD: ${{ secrets.STAGING_REGULAR_PASSWORD }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require immutable main revision
        id: target
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Exact 40-character SHA required.' >&2; exit 1; }
          TARGET_SHA="${TARGET_SHA,,}"
          git fetch --no-tags origin main "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || { echo 'SHA is not contained in main.' >&2; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Reject missing or production-like staging values
        run: node api-server/scripts/verify-phase10-staging-readiness.mjs --environment
  deploy-and-verify:
    name: Deploy isolated staging revision and run approved checks
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      TARGET_SHA: ${{ needs.validate-input.outputs.target_sha }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_AI_API_KEY: ${{ secrets.STAGING_AI_API_KEY }}
      STAGING_PENDING_EMAIL: ${{ secrets.STAGING_PENDING_EMAIL }}
      STAGING_PENDING_PASSWORD: ${{ secrets.STAGING_PENDING_PASSWORD }}
      STAGING_ASSOCIATE_EMAIL: ${{ secrets.STAGING_ASSOCIATE_EMAIL }}
      STAGING_ASSOCIATE_PASSWORD: ${{ secrets.STAGING_ASSOCIATE_PASSWORD }}
      STAGING_REGULAR_EMAIL: ${{ secrets.STAGING_REGULAR_EMAIL }}
      STAGING_REGULAR_PASSWORD: ${{ secrets.STAGING_REGULAR_PASSWORD }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      REPOSITORY_URL: https://github.com/seungjae3908-source/seungjae20260713.git
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure staging SSH
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          if [[ -n "$STAGING_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$STAGING_SSH_PORT" -H "$STAGING_SSH_HOST" > ~/.ssh/known_hosts
          fi
      - name: Deploy exact revision to isolated staging
        env:
          REMOTE_SECRET_FILE: /tmp/seungjae-staging-${{ github.run_id }}-${{ github.run_attempt }}.env
        run: |
          set -Eeuo pipefail
          umask 077
          local_secret_file="$(mktemp)"
          cleanup() {
            rm -f "$local_secret_file"
            ssh -i ~/.ssh/id_ed25519 -p "$STAGING_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" "rm -f -- $(printf '%q' "$REMOTE_SECRET_FILE")" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          {
            printf 'STAGING_BASE_URL=%q\n' "$STAGING_BASE_URL"
            printf 'STAGING_DATABASE_URL=%q\n' "$STAGING_DATABASE_URL"
            printf 'STAGING_AI_API_KEY=%q\n' "$STAGING_AI_API_KEY"
          } > "$local_secret_file"
          chmod 600 "$local_secret_file"
          scp -q -i ~/.ssh/id_ed25519 -P "$STAGING_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$local_secret_file" "$STAGING_SSH_USER@$STAGING_SSH_HOST:$REMOTE_SECRET_FILE"
          remote_command="$(printf 'TARGET_SHA=%q REPOSITORY_URL=%q STAGING_SECRET_FILE=%q bash -s' \
            "$TARGET_SHA" "$REPOSITORY_URL" "$REMOTE_SECRET_FILE")"
          ssh -i ~/.ssh/id_ed25519 -p "$STAGING_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          chmod 600 "$STAGING_SECRET_FILE"
          # shellcheck disable=SC1090
          source "$STAGING_SECRET_FILE"
          SOURCE_DIR="$(mktemp -d /tmp/seungjae-staging-source.XXXXXX)"
          cleanup_remote() {
            rm -rf -- "$SOURCE_DIR"
            rm -f -- "$STAGING_SECRET_FILE"
          }
          trap cleanup_remote EXIT
          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          RESOLVED_SHA="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})"
          [[ "$RESOLVED_SHA" == "$TARGET_SHA" ]] || { echo 'Resolved SHA mismatch' >&2; exit 1; }
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"
          chmod 700 "$SOURCE_DIR/ops/deploy-staging.sh"
          SOURCE_DIR="$SOURCE_DIR" \
          STAGING_DIR=/srv/seungjae-staging \
          STAGING_PM2_NAME=seungjae-staging \
          STAGING_PORT=18080 \
          STAGING_CANARY_PORT=18082 \
          STAGING_BASE_URL="$STAGING_BASE_URL" \
          STAGING_DATABASE_URL="$STAGING_DATABASE_URL" \
          STAGING_AI_API_KEY="$STAGING_AI_API_KEY" \
          "$SOURCE_DIR/ops/deploy-staging.sh" "$TARGET_SHA"
          REMOTE
      - name: Run explicitly approved staging DB migration and rollback drill
        if: inputs.run_destructive_recovery_drill == true
        env:
          DATABASE_URL: ${{ env.STAGING_DATABASE_URL }}
        run: bash api-server/scripts/verify-phase8-db.sh
      - name: Run real staging account and browser verification
        env:
          PHASE10_STAGING_E2E: "true"
          STAGING_TARGET_SHA: ${{ env.TARGET_SHA }}
        run: pnpm --dir stock-analyzer exec playwright test e2e/phase10-staging-readiness.spec.ts
      - name: Run destructive staging-only recovery and log-redaction drills
        if: inputs.run_destructive_recovery_drill == true
        run: node api-server/scripts/verify-phase10-staging-readiness.mjs --remote
      - name: Record staging result without granting production approval
        if: success()
        env:
          RUN_DESTRUCTIVE_RECOVERY_DRILL: ${{ inputs.run_destructive_recovery_drill }}
        run: |
          {
            echo '## Staging readiness verification succeeded'
            echo
            echo "- Staging SHA: \`$TARGET_SHA\`"
            echo '- Production deployment executed: `false`'
            echo '- Production database changed: `false`'
            if [[ "$RUN_DESTRUCTIVE_RECOVERY_DRILL" == "true" ]]; then
              echo '- Destructive recovery drill: `passed`'
            else
              echo '- Destructive recovery drill: `skipped (not approved)`'
            fi
            echo '- Verdict: `운영 배포 승인 보류`'
            echo '- Reason: GitHub `production` environment reviewers, branch restrictions, and self-review protection require separate direct verification.'
          } >> "$GITHUB_STEP_SUMMARY"
