name: Binance Cross-Sectional Order Flow V1

on:
  push:
    branches:
      - research/pit-us-orderflow-v1-20260919
    paths:
      - market-prediction-lab/scripts/run-binance-cross-sectional-orderflow-v1.py
      - .github/workflows/binance-cross-sectional-orderflow-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check
        run: python -m py_compile market-prediction-lab/scripts/run-binance-cross-sectional-orderflow-v1.py
      - name: Run cross-sectional order-flow factor
        run: python market-prediction-lab/scripts/run-binance-cross-sectional-orderflow-v1.py
      - name: Verify safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-prediction-lab/artifacts/binance-cross-sectional-orderflow-v1/result.json").read_text())
          assert d["research_only"] is True
          assert d["public_data_only"] is True
          assert d["live_trading"] is False
          assert d["private_api"] is False
          assert d["orders_submitted"] == 0
          assert d["lookahead_free"] is True
          assert len(d["symbols"]) == 8
          assert all(v["funding_status"]=="BINANCE_VISION_OK" for v in d["provenance"].values())
          print("CROSS_SECTIONAL_ORDERFLOW_CONTRACT=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binance-cross-sectional-orderflow-v1-${{ github.sha }}
          path: market-prediction-lab/artifacts/binance-cross-sectional-orderflow-v1/
          if-no-files-found: error
          retention-days: 30
