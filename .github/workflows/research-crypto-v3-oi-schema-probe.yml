name: Research Crypto V3 OI Schema Probe

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-crypto-v3-oi-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Binance futures metrics schema
        run: |
          python - <<'PY'
          import io, json, zipfile, requests, pandas as pd
          url='https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2026-04-01.zip'
          r=requests.get(url,timeout=60,headers={'User-Agent':'market-prediction-lab/oi-schema-probe'})
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          name=z.namelist()[0]
          df=pd.read_csv(z.open(name))
          out={
            'file':name,
            'rows':len(df),
            'columns':[str(c) for c in df.columns],
            'head':df.head(3).astype(str).to_dict('records'),
            'tail':df.tail(3).astype(str).to_dict('records'),
          }
          print(json.dumps({'OI_SCHEMA':out},ensure_ascii=False))
          PY
