name: Public Only Partial Fill V3 Prospective Methodology

on:
  pull_request:
    paths:
      - 'api-server/src/services/public-forward-partial-fill-v3-prospective-methodology.service.ts'
      - 'api-server/src/services/public-forward-partial-fill-v3-prospective-methodology.service.test.ts'
      - '.github/workflows/public-only-partial-fill-v3-prospective-methodology.yml'

permissions:
  contents: read

concurrency:
  group: public-only-partial-fill-v3-prospective-methodology-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact pull request head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API server
        run: pnpm --dir api-server run typecheck

      - name: Bundle focused V3 methodology regression
        run: >-
          pnpm --dir api-server exec esbuild
          src/services/public-forward-partial-fill-v3-prospective-methodology.service.test.ts
          --bundle --platform=node --format=cjs --target=node24
          --outfile=/tmp/public-forward-partial-fill-v3-prospective-methodology.test.cjs

      - name: Run focused V3 methodology regression
        run: node --test /tmp/public-forward-partial-fill-v3-prospective-methodology.test.cjs

      - name: Verify public-only fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE='api-server/src/services/public-forward-partial-fill-v3-prospective-methodology.service.ts'
          grep -Fq "freezeStatus: 'NOT_FROZEN'" "$FILE"
          grep -Fq 'cohortFrozenAtMs: null' "$FILE"
          grep -Fq 'effectiveStartMs: null' "$FILE"
          grep -Fq "effectiveStartRule: 'STRICTLY_AFTER_EXPLICIT_COHORT_FREEZE'" "$FILE"
          grep -Fq "scheduleTrigger: 'NONE'" "$FILE"
          grep -Fq 'scheduleActivationAllowed: false' "$FILE"
          grep -Fq 'economicCreditAllowed: false' "$FILE"
          grep -Fq 'predecessorV2MutationAllowed: false' "$FILE"
          grep -Fq "policyDigest: '5d91ea09ac5a2982a26d00197433142455fa6634488fadc9201e4ddf1346ed6c'" "$FILE"
          grep -Fq "cohortDigest: '9b2853a361e17dc429288cec4499fc972189b0bc2427a6d8bb2a999eff847454'" "$FILE"
          grep -Fq "digest: 'adef3bbf8f6647f0314a35ca5b0d48eebefed614a0e66ab28e93f6d3dc2a0f7c'" "$FILE"
          grep -Fq "digest: '1b60b2f3719556b14d8d360a25f2043f5e45b0c24089c1636f3d66d784801308'" "$FILE"
          grep -Fq "digest: '55bbbf79b89040bffe7485b48b97fa56d6175a0796d72dfb8985d1923d64e244'" "$FILE"
          grep -Fq "digest: '8c3ded9d0862b9c81f04a466fb6d4df03ee39185cc1f59bc08c41923231b8e29'" "$FILE"
          grep -Fq 'totalSlotN: 1024' "$FILE"
          grep -Fq 'trainSlotN: 512' "$FILE"
          grep -Fq 'validationSlotN: 256' "$FILE"
          grep -Fq 'oosSlotN: 256' "$FILE"
          grep -Fq 'perScopeEffectiveIndependentMinimum: 178' "$FILE"
          grep -Fq 'scopeCellCount: 4' "$FILE"
          grep -Fq 'mechanicalFloorEffectiveIndependent: 712' "$FILE"
          grep -Fq 'predecessorEvidenceRewriteAllowed: false' "$FILE"
          grep -Fq 'retrospectiveCreditAllowed: false' "$FILE"
          grep -Fq 'actualFillInferenceAllowed: false' "$FILE"
          grep -Fq 'queuePositionInferenceAllowed: false' "$FILE"
          grep -Fq 'modeledEvidenceMayBecomeActualEvidence: false' "$FILE"
          grep -Fq 'modeledEvidenceMaySatisfyActualExecutionGates: false' "$FILE"
          grep -Fq 'existingNumericCriteriaRelaxed: false' "$FILE"
          grep -Fq 'actualFillObserved: false' "$FILE"
          grep -Fq 'actualFillFraction: null' "$FILE"
          grep -Fq 'queuePositionKnown: false' "$FILE"
          grep -Fq 'partialFillCostPercent: null' "$FILE"
          grep -Fq 'economicCreditCreated: false' "$FILE"
          grep -Fq "blockers.push('SOURCE_ECONOMIC_OR_EXECUTION_CREDIT_FORBIDDEN')" "$FILE"
          grep -Fq 'profitabilityCredit: 0' "$FILE"
          grep -Fq 'fullCostReady: false' "$FILE"
          grep -Fq 'evidenceComplete: 0' "$FILE"
          grep -Fq "executionAuthority: 'NONE'" "$FILE"
          grep -Fq 'privateApiAllowed: false' "$FILE"
          grep -Fq 'liveTrading: false' "$FILE"
          grep -Fq 'realOrderEnabled: false' "$FILE"

      - name: Verify Draft-only workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/workflows/public-only-partial-fill-v3-prospective-methodology.yml'
          grep -Fq '  pull_request:' "$FILE"
          if grep -Eq '^  (schedule:|workflow_dispatch:)' "$FILE"; then
            echo 'V3 validation workflow contains a manual or scheduled activation trigger' >&2
            exit 1
          fi
          if grep -Eq '^      environment:' "$FILE"; then
            echo 'V3 validation workflow must not bind any protected environment' >&2
            exit 1
          fi
