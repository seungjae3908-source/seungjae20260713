name: PR156 Stabilization Validation

on:
  push:
    branches:
      - test/pr156-stabilization-validation

permissions:
  contents: read

concurrency:
  group: pr156-stabilization-validation
  cancel-in-progress: false

jobs:
  regression:
    name: PR156 pre-push regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --dir stock-analyzer run typecheck
      - name: Typecheck backend
        run: pnpm --dir stock-analyzer exec tsc -p ../api-server/tsconfig.json --noEmit
      - name: Build frontend production bundle
        run: pnpm --dir stock-analyzer run build
      - name: Build backend production bundle
        run: pnpm --dir api-server run build:server
      - name: Install Playwright Chromium
        run: pnpm --dir stock-analyzer exec playwright install --with-deps chromium
      - name: Run Playwright desktop and mobile regression
        run: pnpm --dir stock-analyzer run test:e2e
      - name: Verify validation harness is the only extra file versus clean candidate
        run: |
          git fetch --no-tags origin 5040e53d5920e01be5b26468a2f82d122daa7c29
          mapfile -t changed < <(git diff --name-only 5040e53d5920e01be5b26468a2f82d122daa7c29 HEAD)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != ".github/workflows/pr156-stabilization-validation.yml" ]; then
            printf 'unexpected validation-branch drift:\n%s\n' "${changed[@]}"
            exit 1
          fi
