name: Application Full CI Ready Dispatch

on:
  workflow_run:
    workflows:
      - Application Fast CI
    types:
      - completed

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: application-full-ci-ready-dispatch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    name: Dispatch canonical full CI after exact-head Fast CI success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact ready PR head from successful Fast CI
        id: target
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const targetSha = String(run.head_sha || '').toLowerCase();
            if (run.name !== 'Application Fast CI' || run.event !== 'pull_request' || run.conclusion !== 'success') {
              core.setFailed('[READY_FAST_CI_IDENTITY_INVALID]');
              return;
            }
            if (!/^[0-9a-f]{40}$/u.test(targetSha)) {
              core.setFailed('[INVALID_FAST_HEAD_SHA]');
              return;
            }

            let candidates = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            if (candidates.length === 0) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: targetSha,
              });
              candidates = associated.data;
            }

            const openCandidates = [];
            const openMatches = [];
            for (const candidate of candidates) {
              const number = Number(candidate.number);
              if (!Number.isInteger(number) || number <= 0) continue;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              if (pr.state !== 'open') continue;
              openCandidates.push(pr);
              if (String(pr.head.sha).toLowerCase() !== targetSha) continue;
              openMatches.push(pr);
            }

            if (openMatches.length === 0 && openCandidates.length === 1) {
              const pr = openCandidates[0];
              const currentHeadSha = String(pr.head.sha || '').toLowerCase();
              if (currentHeadSha !== targetSha) {
                core.notice(`[SUPERSEDED_FAST_HEAD] Fast CI ${run.id} completed for old head ${targetSha}, while PR #${pr.number} is now at ${currentHeadSha}; canonical full CI dispatch is intentionally skipped.`);
                core.setOutput('dispatch', 'false');
                return;
              }
            }

            if (openMatches.length !== 1) {
              core.setFailed(`[READY_FAST_CI_PR_RESOLUTION_FAILED] matches=${openMatches.length} open_candidates=${openCandidates.length} sha=${targetSha}`);
              return;
            }

            const pr = openMatches[0];
            if (pr.draft) {
              core.notice(`Fast CI ${run.id} is green for draft PR #${pr.number}; canonical full CI remains deferred until Ready.`);
              core.setOutput('dispatch', 'false');
              return;
            }

            core.setOutput('dispatch', 'true');
            core.setOutput('sha', targetSha);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            core.info(`Exact-head Fast CI ${run.id} is green for Ready PR #${pr.number} at ${targetSha}.`);

      - name: Dispatch canonical Application CI for exact green Fast head
        if: steps.target.outputs.dispatch == 'true'
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const prNumber = process.env.PR_NUMBER;
            const baseRef = process.env.BASE_REF;
            const headRef = process.env.HEAD_REF;
            if (!/^[0-9a-f]{40}$/u.test(targetSha)) {
              core.setFailed('Exact 40-character successful Fast CI head SHA required.');
              return;
            }
            const workflowId = 'futures-public-network-smoke.yml';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: headRef,
              inputs: {
                target_sha: targetSha,
                checkout_ref: targetSha,
                pr_number: prNumber,
                base_ref: baseRef,
              },
            });
            core.info(`Dispatched canonical full Application CI for Ready PR #${prNumber}, exact green Fast head ${targetSha}.`);

      - name: Boundary
        run: |
          echo 'This bridge can dispatch canonical full Application CI only after natural exact-head Fast CI success.'
          echo 'Failed, skipped, cancelled, missing, stale, or Draft Fast CI cannot dispatch canonical full CI.'
          echo 'A uniquely resolved PR whose head has advanced past the successful Fast CI SHA is a superseded no-op and cannot dispatch.'
          echo 'It grants no merge, staging, production, database, secret, environment, live-trading, or real-order authority.'
