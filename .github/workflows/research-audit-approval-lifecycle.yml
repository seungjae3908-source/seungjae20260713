name: Research Audit Approval Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-audit-approval-lifecycle.yml'
      - '.github/scripts/research-audit-approval-lifecycle.cjs'
      - '.github/tests/research-audit-approval-lifecycle.test.cjs'
      - '.github/workflows/research-isolated-release.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: research-audit-approval-lifecycle-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  test-lifecycle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/tests/research-audit-approval-lifecycle.test.cjs

  retire-stale-readonly-approvals:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'seungjae3908-source/seungjae20260713'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cancel only stale waiting Research read-only approvals; never approve or retarget
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {cancelStaleWaitingAudits} = require('./.github/scripts/research-audit-approval-lifecycle.cjs');
            let report;
            try {
              report = await cancelStaleWaitingAudits({github,context});
            } catch {
              report = {schemaVersion:'research-audit-stale-approval-sweep-v1',status:'INCOMPLETE',
                eventSha:context.sha,reasonCode:'READONLY_APPROVAL_SWEEP_FAILED',
                approvals:0,retargets:0,hostAccesses:0,executionAuthority:'NONE'};
            }
            fs.writeFileSync('research-approval-lifecycle.json',JSON.stringify(report,null,2),{mode:0o600});
            await core.summary.addHeading('Research read-only approval lifecycle').addRaw(
              'Status: '+report.status+'\n\nNo approval, retarget, deployment or host access.\n'+
              'Cancellation requests are not proof of terminal cancellation.\n').write();
            if(report.status==='INCOMPLETE') core.setFailed('READONLY_APPROVAL_SWEEP_INCOMPLETE');
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('research-approval-lifecycle.json') != ''
        with:
          name: research-approval-lifecycle-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: research-approval-lifecycle.json
          if-no-files-found: error
          retention-days: 7
