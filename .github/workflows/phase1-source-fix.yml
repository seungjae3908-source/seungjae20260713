name: Phase 1 source fix

on:
  push:
    branches:
      - feature/futures-analysis-phase1

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/futures-analysis-phase1
          fetch-depth: 0

      - name: Apply verified minimal fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('api-server/src/routes/stocks.ts')
          source = path.read_text(encoding='utf-8')

          old_feed = '''\ttry {
          \t\tconst result = await SpecialFeedService.getFeed(asset, market, limit);
          \t\tres.json(result);'''
          new_feed = '''\tif (asset === "coin") {
          \t\treturn res.status(501).json({
          \t\t\tok: false,
          \t\t\tasset,
          \t\t\tmarket,
          \t\t\titems: [],
          \t\t\tcount: 0,
          \t\t\tupdatedAt: new Date().toISOString(),
          \t\t\tmessage: "코인 특이정보 피드는 아직 연결되지 않았습니다.",
          \t\t});
          \t}

          \ttry {
          \t\tconst stockMarket = market === "US" ? "US" : "KR";
          \t\tconst result = await SpecialFeedService.getFeed(stockMarket, limit);
          \t\tres.json(result);'''

          old_group = 'function groupShortRows(rows: any[], period: string) {'
          new_group = 'function groupShortRows(rows: any[], period: MarketFlowPeriod) {'

          old_period = '''router.get("/:ticker/short-selling", async (req, res) => {
          \tconst ticker = normalizeTicker(req.params.ticker);
          \tconst period = String(req.query.period ?? "daily");'''
          new_period = '''router.get("/:ticker/short-selling", async (req, res) => {
          \tconst ticker = normalizeTicker(req.params.ticker);
          \tconst period = normalizeMarketFlowPeriod(req.query.period);'''

          replacements = [
              (old_feed, new_feed, 'special feed call'),
              (old_group, new_group, 'short-row period type'),
              (old_period, new_period, 'short-selling period normalization'),
          ]

          changed = False
          for old, new, label in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
                  changed = True
              elif new not in source:
                  raise SystemExit(f'Expected source block not found: {label}')

          if changed:
              path.write_text(source, encoding='utf-8')

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src/routes/stocks.ts
          git commit -m "fix: restore backend typecheck"
          git push origin HEAD:feature/futures-analysis-phase1
