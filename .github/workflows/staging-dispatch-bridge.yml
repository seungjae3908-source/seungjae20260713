name: Staging Dispatch Bridge

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/staging-dispatch-bridge.yml
      - .github/workflows/staging-readiness.yml
      - api-server/scripts/verify-phase10-deployment-safety.mjs
      - api-server/scripts/verify-phase10-staging-dispatch-run-confirmation.mjs
      - docs/staging-dispatch-bridge.md

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: staging-dispatch-bridge-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging dispatch bridge safeguards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node api-server/scripts/verify-phase10-deployment-safety.mjs
      - run: node api-server/scripts/verify-phase10-staging-dispatch-run-confirmation.mjs

  dispatch:
    name: Dispatch owner-approved isolated staging readiness
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-staging ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      statuses: read
    outputs:
      target_sha: ${{ steps.command.outputs.sha }}
      action: ${{ steps.command.outputs.action }}
      run_full_validation: ${{ steps.command.outputs.full }}
      run_destructive_recovery_drill: ${{ steps.command.outputs.destructive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -Eeuo pipefail
          [[ "$ISSUE_NUMBER" == "23" ]] || { echo 'Unauthorized control issue.' >&2; exit 1; }
          [[ "$ISSUE_TITLE" == "Staging Readiness Control" ]] || { echo 'Unexpected control issue title.' >&2; exit 1; }
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || { echo 'Only the repository owner may dispatch staging.' >&2; exit 1; }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || { echo 'Comment author is not the repository owner.' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-staging ([0-9a-fA-F]{40})(.*)$/.exec(body);
          if (!match) {
            console.error('Exact command required: /run-staging <40-character-current-main-sha> [--deploy --full-validation] [--destructive]');
            process.exit(1);
          }
          const flags = match[2].trim() ? match[2].trim().split(/\s+/) : [];
          const allowed = new Set(['--deploy', '--full-validation', '--destructive']);
          const invalid = flags.filter((flag, index) => !allowed.has(flag) || flags.indexOf(flag) !== index);
          if (invalid.length) {
            console.error(`Unknown or duplicate staging flags: ${[...new Set(invalid)].join(', ')}`);
            process.exit(1);
          }
          const action = flags.includes('--deploy') ? 'deploy' : 'preflight';
          const full = flags.includes('--full-validation');
          const destructive = flags.includes('--destructive');
          if (action === 'preflight' && (full || destructive)) {
            console.error('--full-validation and --destructive require --deploy.');
            process.exit(1);
          }
          if (action === 'deploy' && !full) {
            console.error('Every deploy candidate requires --full-validation.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `action=${action}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `full=${full ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `destructive=${destructive ? 'true' : 'false'}\n`);
          NODE

      - name: Require exact current main SHA
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Normalized 40-character SHA required.' >&2; exit 1; }
          git fetch --no-tags origin main "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "Staging dispatch requires the exact current main SHA: $MAIN_SHA" >&2
            exit 1
          }

      - name: Require successful verified main CI
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            statuses.sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            const latest = new Map();
            for (const status of statuses) if (!latest.has(status.context)) latest.set(status.context, status.state);
            const missing = required.filter((name) => latest.get(name) !== 'success');
            if (missing.length) {
              core.setFailed(`Required successful statuses missing: ${missing.join(', ')}`);
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              branch: 'main',
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            const verifiedRun = runs.find((run) =>
              run.name === 'Application CI'
              && run.head_sha === targetSha
              && run.head_branch === 'main'
              && run.event === 'push'
              && run.status === 'completed'
              && run.conclusion === 'success'
            );
            if (!verifiedRun) core.setFailed('No successful Application CI push run on main exists for the requested SHA.');

      - name: Dispatch and confirm staging readiness run
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          STAGING_ACTION: ${{ steps.command.outputs.action }}
          RUN_FULL_VALIDATION: ${{ steps.command.outputs.full }}
          RUN_DESTRUCTIVE_RECOVERY_DRILL: ${{ steps.command.outputs.destructive }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const workflowId = 'staging-readiness.yml';
            const apiVersion = '2026-03-10';
            const bridgeRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            });
            if (workflow.data.state !== 'active') {
              core.setFailed(`Workflow ${workflowId} is not active.`);
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.TARGET_SHA,
              branch: 'main',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const existingActiveRun = runs
              .filter((run) => run.name === 'Staging Readiness'
                && run.path === '.github/workflows/staging-readiness.yml'
                && run.head_sha === process.env.TARGET_SHA)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))
              .find((run) => run.status !== 'completed');
            if (existingActiveRun) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.CONTROL_ISSUE),
                body: [
                  'Staging readiness dispatch was not duplicated.',
                  '',
                  `- Target SHA: \`${process.env.TARGET_SHA}\``,
                  `- Existing Run ID: \`${existingActiveRun.id}\``,
                  `- Existing Run: [Open GitHub Actions run](${existingActiveRun.html_url})`,
                  `- Existing status: \`${existingActiveRun.status}\``,
                  `- Bridge Run ID: \`${context.runId}\``,
                  `- Bridge Run: [Open bridge run](${bridgeRunUrl})`,
                  '- Production deployment executed: `false`',
                  `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                ].join('\n'),
              });
              return;
            }
            const dispatchResponse = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                sha: process.env.TARGET_SHA,
                action: process.env.STAGING_ACTION,
                run_full_validation: process.env.RUN_FULL_VALIDATION,
                run_destructive_recovery_drill: process.env.RUN_DESTRUCTIVE_RECOVERY_DRILL,
              },
              return_run_details: true,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': apiVersion,
              },
            });
            const runId = Number(dispatchResponse.data?.workflow_run_id);
            if (dispatchResponse.status !== 200 || !Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Staging dispatch returned invalid Run ID with HTTP ${dispatchResponse.status}.`);
              return;
            }
            const runResponse = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = runResponse.data;
            const valid = run.event === 'workflow_dispatch'
              && run.head_branch === 'main'
              && run.head_sha === process.env.TARGET_SHA
              && run.path === '.github/workflows/staging-readiness.yml';
            if (!valid) {
              core.setFailed('Returned staging run does not match the official workflow, main branch, and exact target SHA.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.CONTROL_ISSUE),
              body: [
                'Staging readiness workflow run created.',
                '',
                `- Target SHA: \`${process.env.TARGET_SHA}\``,
                `- Action: \`${process.env.STAGING_ACTION}\``,
                `- Full account/browser validation: \`${process.env.RUN_FULL_VALIDATION}\``,
                `- Destructive staging-only recovery drill: \`${process.env.RUN_DESTRUCTIVE_RECOVERY_DRILL}\``,
                `- Run ID: \`${runId}\``,
                `- Run: [Open GitHub Actions run](${run.html_url})`,
                `- Status: \`${run.status}\``,
                `- Bridge Run ID: \`${context.runId}\``,
                `- Bridge Run: [Open bridge run](${bridgeRunUrl})`,
                '- Workflow: `Staging Readiness`',
                '- Ref: `main`',
                '- Production deployment executed: `false`',
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              ].join('\n'),
            });
