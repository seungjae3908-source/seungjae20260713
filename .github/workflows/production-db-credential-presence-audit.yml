name: Production DB Credential Presence Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-db-credential-presence-audit.yml'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-db-credential-presence-audit-${{ github.event_name == 'issue_comment' && github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate redacted credential-presence audit contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact-head and static safety markers
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          file='.github/workflows/production-db-credential-presence-audit.yml'
          grep -F 'environment: production' "$file" >/dev/null
          grep -F 'database_changed: false' "$file" >/dev/null
          grep -F 'production_deployment_executed: false' "$file" >/dev/null
          grep -F 'secret_values_recorded: false' "$file" >/dev/null
          grep -F 'actual_orders: 0' "$file" >/dev/null
          if grep -Eq '(psql[[:space:]]|DROP[[:space:]]|ALTER[[:space:]]|INSERT[[:space:]]|UPDATE[[:space:]]|DELETE[[:space:]])' "$file"; then
            echo 'Credential-presence audit must not contain SQL execution or mutation commands.' >&2
            exit 1
          fi

  audit:
    name: Owner-approved redacted Production DB credential presence audit
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/audit-production-db-credentials ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      C_PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      C_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      C_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      C_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      C_POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      C_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      C_PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      C_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      C_PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      C_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      C_PROD_SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/audit-production-db-credentials ([0-9a-fA-F]{40}) ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Expected /audit-production-db-credentials <active-production-sha> <exact-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `active_sha=${match[1].toLowerCase()}`,
            `target_sha=${match[2].toLowerCase()}`,
            '',
          ].join('\n'));
          NODE

      - name: Require exact current main SHA
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$TARGET_SHA"
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo 'Credential audit requires exact current main.' >&2
            exit 1
          }

      - name: Require deployed Production SHA provenance
        uses: actions/github-script@v7
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const latestSuccessful = runs
              .filter((run) => run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latestSuccessful || String(latestSuccessful.head_sha).toLowerCase() !== process.env.ACTIVE_SHA) {
              core.setFailed('Active Production SHA does not match the latest successful Production Deploy.');
              return;
            }
            core.info(`Active Production provenance accepted from Run ${latestSuccessful.id}.`);

      - name: Configure canonical Production SSH
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Collect server-side credential presence without values
        id: server
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
        run: |
          set -Eeuo pipefail
          server_json="$RUNNER_TEMP/server-db-credential-presence.json"
          quoted_sha="$(printf '%q' "$ACTIVE_SHA")"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "ACTIVE_SHA=$quoted_sha node -" > "$server_json" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const { execFileSync } = require('node:child_process');

          const activeSha = String(process.env.ACTIVE_SHA ?? '').toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(activeSha)) process.exit(2);
          const marker = '/opt/stock-app/.deploy/current-sha';
          if (!fs.existsSync(marker) || fs.readFileSync(marker, 'utf8').trim().toLowerCase() !== activeSha) process.exit(3);

          const processes = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
          const selected = processes.find((item) => item.name === 'stock-app');
          if (selected?.pm2_env?.status !== 'online') process.exit(4);
          if (String(selected.pm2_env.DEPLOY_SHA ?? '').toLowerCase() !== activeSha) process.exit(5);

          const candidateKeys = [
            'PGHOST','PGPORT','PGUSER','PGPASSWORD','PGDATABASE','PGSSLMODE',
            'DATABASE_URL','POSTGRES_URL','POSTGRES_URL_NON_POOLING','SUPABASE_DB_URL','PROD_DATABASE_URL','PRODUCTION_DATABASE_URL',
            'DB_HOST','DB_PORT','DB_USER','DB_PASSWORD','DB_NAME',
            'DATABASE_HOST','DATABASE_PORT','DATABASE_USER','DATABASE_PASSWORD','DATABASE_NAME',
            'SUPABASE_DB_HOST','SUPABASE_DB_PORT','SUPABASE_DB_USER','SUPABASE_DB_PASSWORD','SUPABASE_DB_NAME',
            'PROD_SUPABASE_DB_HOST','PROD_SUPABASE_DB_PORT','PROD_SUPABASE_DB_USER','PROD_SUPABASE_DB_PASSWORD','PROD_SUPABASE_DB_NAME',
          ];
          const candidateSet = new Set(candidateKeys);
          const pm2KeysPresent = candidateKeys.filter((key) => Object.prototype.hasOwnProperty.call(selected.pm2_env, key)
            && String(selected.pm2_env[key] ?? '').trim() !== '');

          const allowlist = [
            '/opt/stock-app/.env',
            '/opt/stock-app/.env.production',
            '/opt/stock-app/api-server/.env',
            '/opt/stock-app/api-server/.env.production',
          ];
          const safeEnvFiles = [];
          const unsafeEnvFiles = [];
          const fileKeysPresent = new Set();
          for (const file of allowlist) {
            if (!fs.existsSync(file)) continue;
            let stat;
            try { stat = fs.lstatSync(file); } catch { continue; }
            const safe = stat.isFile() && !stat.isSymbolicLink() && (stat.mode & 0o022) === 0;
            if (!safe) {
              unsafeEnvFiles.push(path.basename(file));
              continue;
            }
            safeEnvFiles.push(path.basename(file));
            let text = '';
            try { text = fs.readFileSync(file, 'utf8'); } catch { continue; }
            for (const line of text.split(/\r?\n/)) {
              const match = /^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=/.exec(line);
              if (match && candidateSet.has(match[1])) fileKeysPresent.add(match[1]);
            }
          }

          const home = os.homedir();
          const credentialFileCandidates = [
            path.join(home, '.pgpass'),
            path.join(home, '.pg_service.conf'),
            '/root/.pgpass',
            '/root/.pg_service.conf',
            '/etc/pg_service.conf',
            '/etc/postgresql-common/pg_service.conf',
          ];
          const credentialFilesPresent = [];
          for (const file of credentialFileCandidates) {
            try {
              const stat = fs.lstatSync(file);
              if (stat.isFile() && !stat.isSymbolicLink()) credentialFilesPresent.push(path.basename(file));
            } catch {}
          }

          process.stdout.write(JSON.stringify({
            status: 'passed',
            active_production_sha: activeSha,
            pm2_online: true,
            pm2_candidate_keys_present: pm2KeysPresent,
            safe_env_files_present: safeEnvFiles,
            unsafe_env_files_present: unsafeEnvFiles,
            safe_env_candidate_keys_present: [...fileKeysPresent].sort(),
            postgres_credential_files_present: [...new Set(credentialFilesPresent)].sort(),
            values_exposed: false,
            server_files_written: 0,
            server_files_deleted: 0,
            server_processes_restarted: 0,
            database_changed: false,
          }));
          NODE
          node - "$server_json" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (value?.status !== 'passed' || value?.values_exposed !== false || value?.database_changed !== false) process.exit(1);
          const text = JSON.stringify(value);
          if (/postgres(?:ql)?:\/\//i.test(text) || /-----BEGIN .*PRIVATE KEY-----/.test(text)) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `json=${text}\n`);
          NODE

      - name: Build sanitized combined presence artifact
        id: evidence
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          SERVER_JSON: ${{ steps.server.outputs.json }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/production-db-credential-presence.json"
          node - "$artifact" <<'NODE'
          const fs = require('node:fs');
          const out = process.argv[2];
          const secretCandidates = {
            PROD_DATABASE_URL: process.env.C_PROD_DATABASE_URL,
            PRODUCTION_DATABASE_URL: process.env.C_PRODUCTION_DATABASE_URL,
            DATABASE_URL: process.env.C_DATABASE_URL,
            POSTGRES_URL: process.env.C_POSTGRES_URL,
            POSTGRES_URL_NON_POOLING: process.env.C_POSTGRES_URL_NON_POOLING,
            SUPABASE_DB_URL: process.env.C_SUPABASE_DB_URL,
            PROD_SUPABASE_DB_URL: process.env.C_PROD_SUPABASE_DB_URL,
            SUPABASE_DB_PASSWORD: process.env.C_SUPABASE_DB_PASSWORD,
            PROD_SUPABASE_DB_PASSWORD: process.env.C_PROD_SUPABASE_DB_PASSWORD,
            SUPABASE_ACCESS_TOKEN: process.env.C_SUPABASE_ACCESS_TOKEN,
            PROD_SUPABASE_ACCESS_TOKEN: process.env.C_PROD_SUPABASE_ACCESS_TOKEN,
          };
          const present = Object.entries(secretCandidates).filter(([, value]) => String(value ?? '').trim() !== '').map(([name]) => name);
          const uriShaped = Object.entries(secretCandidates)
            .filter(([name, value]) => /URL$/.test(name) && /^postgres(?:ql)?:\/\//i.test(String(value ?? '').trim()))
            .map(([name]) => name);
          const passwordPresent = ['SUPABASE_DB_PASSWORD','PROD_SUPABASE_DB_PASSWORD'].filter((name) => present.includes(name));
          const managementTokenPresent = ['SUPABASE_ACCESS_TOKEN','PROD_SUPABASE_ACCESS_TOKEN'].filter((name) => present.includes(name));
          const server = JSON.parse(process.env.SERVER_JSON || '{}');
          const result = {
            status: 'passed',
            active_production_sha: process.env.ACTIVE_SHA,
            exact_current_main_sha: process.env.TARGET_SHA,
            github_secret_candidates_present: present,
            github_postgres_uri_candidates: uriShaped,
            github_db_password_candidates: passwordPresent,
            github_supabase_management_token_candidates: managementTokenPresent,
            server,
            database_changed: false,
            production_deployment_executed: false,
            server_mutation_executed: false,
            secret_values_recorded: false,
            raw_user_data_exposed: false,
            actual_orders: 0,
            private_trading_api_count: 0,
            live_trading_authority: false,
          };
          const serialized = JSON.stringify(result, null, 2);
          if (/postgres(?:ql)?:\/\//i.test(serialized) || /-----BEGIN .*PRIVATE KEY-----/.test(serialized)) process.exit(1);
          fs.writeFileSync(out, `${serialized}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact=${out}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `github_present=${present.join(',') || 'none'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `server_env_keys=${(server.safe_env_candidate_keys_present || []).join(',') || 'none'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `server_pm2_keys=${(server.pm2_candidate_keys_present || []).join(',') || 'none'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `credential_files=${(server.postgres_credential_files_present || []).join(',') || 'none'}\n`);
          NODE

      - name: Upload sanitized credential-presence evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-db-credential-presence-${{ steps.command.outputs.active_sha }}
          path: ${{ steps.evidence.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Report sanitized presence result
        uses: actions/github-script@v7
        env:
          ACTIVE_SHA: ${{ steps.command.outputs.active_sha }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          GITHUB_PRESENT: ${{ steps.evidence.outputs.github_present }}
          SERVER_ENV_KEYS: ${{ steps.evidence.outputs.server_env_keys }}
          SERVER_PM2_KEYS: ${{ steps.evidence.outputs.server_pm2_keys }}
          CREDENTIAL_FILES: ${{ steps.evidence.outputs.credential_files }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Production DB credential presence audit completed without exposing values.',
                '',
                `- Active Production SHA: \`${process.env.ACTIVE_SHA}\``,
                `- Exact current main SHA: \`${process.env.TARGET_SHA}\``,
                `- GitHub Production DB credential candidates present: \`${process.env.GITHUB_PRESENT}\``,
                `- Server safe-env candidate keys present: \`${process.env.SERVER_ENV_KEYS}\``,
                `- PM2 split-DB candidate keys present: \`${process.env.SERVER_PM2_KEYS}\``,
                `- PostgreSQL credential files present: \`${process.env.CREDENTIAL_FILES}\``,
                '- Secret values recorded: `false`',
                '- Database changed: `false`',
                '- Production deployment executed: `false`',
                '- Server mutation executed: `false`',
                '- Actual orders: `0`',
                `- Audit Run ID: \`${context.runId}\``,
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              ].join('\n'),
            });
