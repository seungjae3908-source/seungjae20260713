name: Production Dispatch Bridge

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/production-dispatch-bridge.yml
      - .github/workflows/production-deploy.yml
      - .github/workflows/staging-readiness.yml
      - api-server/scripts/verify-production-dispatch-bridge.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/production-dispatch-bridge.yml
      - .github/workflows/production-deploy.yml
      - .github/workflows/staging-readiness.yml
      - api-server/scripts/verify-production-dispatch-bridge.mjs

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: production-dispatch-bridge-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production owner-approval bridge safeguards
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify production dispatch bridge contract
        run: node api-server/scripts/verify-production-dispatch-bridge.mjs

  dispatch:
    name: Dispatch owner-approved official production deployment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == 'Staging Readiness Control' &&
      github.event.comment.user.login == 'seungjae3908-source' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-production ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse exact owner production command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -Eeuo pipefail
          [[ "$ISSUE_NUMBER" == "23" ]] || { echo 'Unauthorized control issue.' >&2; exit 1; }
          [[ "$ISSUE_TITLE" == "Staging Readiness Control" ]] || { echo 'Unexpected control issue title.' >&2; exit 1; }
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || { echo 'Only the repository owner may approve production.' >&2; exit 1; }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || { echo 'Comment author is not the repository owner.' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-production ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /run-production <40-character-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\n`);
          NODE

      - name: Require exact current main SHA
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Normalized 40-character SHA required.' >&2; exit 1; }
          git fetch --no-tags origin main "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo 'Requested production SHA is not contained in main.' >&2
            exit 1
          }
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "Production dispatch requires the exact current main SHA: $MAIN_SHA" >&2
            exit 1
          }

      - name: Require verified CI and successful staging deployment
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];

            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              per_page: 100,
            });
            statuses.sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            const latest = new Map();
            for (const status of statuses) {
              if (!latest.has(status.context)) latest.set(status.context, status.state);
            }
            const failed = required.filter((name) => latest.get(name) !== 'success');
            if (failed.length) {
              core.setFailed(`Required successful statuses missing: ${failed.join(', ')}`);
              return;
            }

            const mainRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              branch: 'main',
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            const verifiedMainRun = mainRuns.find((run) =>
              run.name === 'Application CI'
              && run.head_sha === targetSha
              && run.head_branch === 'main'
              && run.event === 'push'
              && run.conclusion === 'success'
            );
            if (!verifiedMainRun) {
              core.setFailed('No successful Application CI push run on main exists for the requested SHA.');
              return;
            }

            const stagingRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'staging-readiness.yml',
              event: 'workflow_dispatch',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const matchingStagingRuns = stagingRuns
              .filter((run) => run.head_sha === targetSha && run.conclusion === 'success')
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));

            let verifiedStagingRun = null;
            for (const run of matchingStagingRuns) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const preflight = jobs.find((job) => job.name === 'Preflight all isolated staging configuration');
              const deployment = jobs.find((job) => job.name === 'Non-destructive isolated staging deployment');
              if (preflight?.conclusion === 'success' && deployment?.conclusion === 'success') {
                verifiedStagingRun = run;
                break;
              }
            }
            if (!verifiedStagingRun) {
              core.setFailed('No successful non-destructive Staging Readiness deployment exists for the exact requested SHA.');
              return;
            }
            core.info(`Verified staging Run ID: ${verifiedStagingRun.id}`);

      - name: Dispatch and confirm official production workflow run
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const workflowId = 'production-deploy.yml';
            const apiVersion = '2026-03-10';
            const bridgeRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            });
            if (workflow.data.state !== 'active') {
              core.setFailed(`Workflow ${workflowId} is not active.`);
              return;
            }

            const productionRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              event: 'workflow_dispatch',
              branch: 'main',
              per_page: 100,
            });
            const exactRuns = productionRuns
              .filter((run) => run.head_sha === process.env.TARGET_SHA)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            const existingActiveRun = exactRuns.find((run) => run.status !== 'completed');
            const existingSuccessfulRun = exactRuns.find((run) => run.status === 'completed' && run.conclusion === 'success');
            const existingRun = existingActiveRun ?? existingSuccessfulRun;
            if (existingRun) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.CONTROL_ISSUE),
                body: [
                  'Official production deployment dispatch was not duplicated.',
                  '',
                  `- Target SHA: \`${process.env.TARGET_SHA}\``,
                  `- Existing Run ID: \`${existingRun.id}\``,
                  `- Existing Run: [Open GitHub Actions run](${existingRun.html_url})`,
                  `- Existing status: \`${existingRun.status}\``,
                  `- Existing conclusion: \`${existingRun.conclusion ?? 'pending'}\``,
                  `- Bridge Run ID: \`${context.runId}\``,
                  `- Bridge Run: [Open bridge run](${bridgeRunUrl})`,
                  `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                ].join('\n'),
              });
              return;
            }

            const dispatchResponse = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                sha: process.env.TARGET_SHA,
                force_rebuild: 'false',
              },
              return_run_details: true,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': apiVersion,
              },
            });

            const returnedRunId = Number(dispatchResponse.data?.workflow_run_id);
            if (dispatchResponse.status !== 200 || !Number.isSafeInteger(returnedRunId) || returnedRunId <= 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.CONTROL_ISSUE),
                body: [
                  'Official production deployment dispatch did not return workflow run details.',
                  '',
                  `- Target SHA: \`${process.env.TARGET_SHA}\``,
                  `- API version: \`${apiVersion}\``,
                  `- HTTP status: \`${dispatchResponse.status}\``,
                  '- Valid Run ID returned: `false`',
                  `- Bridge Run ID: \`${context.runId}\``,
                  `- Bridge Run: [Open bridge run](${bridgeRunUrl})`,
                  `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                ].join('\n'),
              });
              core.setFailed('Current workflow dispatch API did not return a valid production workflow Run ID.');
              return;
            }

            const runResponse = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: returnedRunId,
            });
            const dispatchedRun = runResponse.data;
            const runMatches = dispatchedRun.event === 'workflow_dispatch'
              && dispatchedRun.head_branch === 'main'
              && dispatchedRun.head_sha === process.env.TARGET_SHA
              && dispatchedRun.path === '.github/workflows/production-deploy.yml';
            if (!runMatches) {
              core.setFailed('Production dispatch API returned a run that did not match the exact official workflow and main revision.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: returnedRunId,
              per_page: 100,
            });
            const jobLines = jobs.length
              ? jobs.map((job) => `- ${job.name}: \`${job.status}\` / \`${job.conclusion ?? 'pending'}\` (job ID: \`${job.id}\`)`)
              : ['- Jobs are not visible yet.'];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.CONTROL_ISSUE),
              body: [
                'Official production deployment workflow run created.',
                '',
                `- Target SHA: \`${process.env.TARGET_SHA}\``,
                `- API version: \`${apiVersion}\``,
                `- Run ID: \`${returnedRunId}\``,
                `- Run: [Open GitHub Actions run](${dispatchedRun.html_url})`,
                `- Status: \`${dispatchedRun.status}\``,
                '- Workflow: `Production Deploy`',
                '- Ref: `main`',
                '- Force rebuild: `false`',
                '- Deployment path: official environment-protected workflow only',
                `- Bridge Run ID: \`${context.runId}\``,
                `- Bridge Run: [Open bridge run](${bridgeRunUrl})`,
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                '',
                'Jobs:',
                ...jobLines,
              ].join('\n'),
            });
