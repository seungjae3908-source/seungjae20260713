name: One-Time Production Environment Review

on:
  push:
    branches:
      - agent/telegram-production-release-gate
    paths:
      - .github/workflows/one-time-production-environment-review.yml

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  approve-exact-owner-authorized-release:
    name: Approve exact owner-authorized Telegram production release
    if: >-
      github.repository == 'seungjae3908-source/seungjae20260713' &&
      github.actor == 'seungjae3908-source' &&
      github.ref == 'refs/heads/agent/telegram-production-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review one exact pending production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const targetRunId = 31865899733;
            const targetSha = '6535f12a70108a1784a108536dcd1763fb155525';
            const productionEnvironmentId = 19007560404;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== targetSha) {
              core.setFailed(`Refusing stale production approval: target=${targetSha} main=${main.data.commit.sha}`);
              return;
            }

            const runResponse = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: targetRunId,
            });
            const run = runResponse.data;
            const validRun = run.name === 'Telegram Production Release'
              && run.path === '.github/workflows/telegram-production-release.yml'
              && run.event === 'issue_comment'
              && run.head_branch === 'main'
              && run.head_sha === targetSha
              && run.actor?.login === 'seungjae3908-source'
              && run.status === 'waiting';
            if (!validRun) {
              core.setFailed(`Exact Telegram production run is not waiting in the required state: ${run.status}/${run.conclusion ?? 'none'}`);
              return;
            }

            const pendingResponse = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/pending_deployments',
              { owner, repo, run_id: targetRunId },
            );
            const pending = pendingResponse.data ?? [];
            const production = pending.find((item) =>
              Number(item.environment?.id) === productionEnvironmentId
              && item.environment?.name === 'production');
            if (!production) {
              core.setFailed('The exact production environment is not pending review.');
              return;
            }
            if (production.current_user_can_approve !== true) {
              core.setFailed('The workflow token is not permitted to approve this protected environment.');
              return;
            }

            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/pending_deployments',
              {
                owner,
                repo,
                run_id: targetRunId,
                environment_ids: [productionEnvironmentId],
                state: 'approved',
                comment: 'Owner-authorized exact-SHA Telegram production release. CI 6/6, PostgreSQL auth, and release-ready Staging evidence already verified.',
              },
            );

            const afterResponse = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/pending_deployments',
              { owner, repo, run_id: targetRunId },
            );
            if ((afterResponse.data ?? []).some((item) => Number(item.environment?.id) === productionEnvironmentId)) {
              core.setFailed('Production environment remained pending after the approval request.');
              return;
            }
            core.info(`Approved protected production environment for exact run ${targetRunId} and SHA ${targetSha}.`);
