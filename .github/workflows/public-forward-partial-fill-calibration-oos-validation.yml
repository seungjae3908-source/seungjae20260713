name: Public Forward Partial Fill Calibration OOS Validation

on:
  pull_request:
    paths:
      - 'api-server/src/services/public-forward-partial-fill-calibration-oos-validation.service.ts'
      - 'api-server/src/services/public-forward-partial-fill-calibration-oos-validation.service.test.ts'
      - '.github/workflows/public-forward-partial-fill-calibration-oos-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API server
        run: pnpm --dir api-server run typecheck

      - name: Bundle focused OOS validation test
        run: >-
          pnpm --dir api-server exec esbuild
          src/services/public-forward-partial-fill-calibration-oos-validation.service.test.ts
          --bundle --platform=node --format=cjs --target=node20
          --outfile=/tmp/public-forward-partial-fill-calibration-oos-validation.test.cjs

      - name: Run focused OOS validation test
        run: node --test /tmp/public-forward-partial-fill-calibration-oos-validation.test.cjs

      - name: Verify fail-closed OOS and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE='api-server/src/services/public-forward-partial-fill-calibration-oos-validation.service.ts'
          grep -Fq "heldOutScoredOutcomeRequired: true" "$FILE"
          grep -Fq "contaminationFreeRequired: true" "$FILE"
          grep -Fq "publicForwardSimulationRequired: true" "$FILE"
          grep -Fq "hypotheticalOrderFrozenBeforeEventRequired: true" "$FILE"
          grep -Fq "actualFillClaimAllowed: false" "$FILE"
          grep -Fq "queuePositionClaimAllowed: false" "$FILE"
          grep -Fq "publicL2AloneMayProducePartialFillCost: false" "$FILE"
          grep -Fq "historicalBackfillCreditAllowed: false" "$FILE"
          grep -Fq "testFixtureRuntimeCreditAllowed: false" "$FILE"
          grep -Fq "partialFillCostProduced: false" "$FILE"
          grep -Fq "calibrationArtifactProduced: false" "$FILE"
          grep -Fq "naturalEntryCredit: 0" "$FILE"
          grep -Fq "runtimeCostCredit: 0" "$FILE"
          grep -Fq "executionAuthority: 'NONE'" "$FILE"
          grep -Fq "privateApiAllowed: false" "$FILE"
          grep -Fq "liveTrading: false" "$FILE"
          grep -Fq "orderSubmissionAllowed: false" "$FILE"
          grep -Fq "fullCostReady: false" "$FILE"
          grep -Fq "OOS_OUTCOME_NOT_HELD_OUT" "$FILE"
          grep -Fq "OOS_OUTCOME_CONTAMINATED" "$FILE"
          grep -Fq "OOS_ACTUAL_FILL_CLAIM_FORBIDDEN" "$FILE"
          grep -Fq "OOS_QUEUE_POSITION_CLAIM_FORBIDDEN" "$FILE"
          grep -Fq "OOS_PARTIAL_FILL_COST_FORBIDDEN" "$FILE"
          grep -Fq "OOS_METHODOLOGY_NOT_FROZEN_BEFORE_EVENT" "$FILE"
