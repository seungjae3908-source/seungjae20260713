name: Prediction Lab US Intraday Public Data Probe V1

on:
  push:
    branches:
      - research/us-stocks-in-play-intraday-3y-v1-20260930
    paths:
      - market-prediction-lab/scripts/probe-hf-us-intraday-v1.py
      - .github/workflows/prediction-lab-us-intraday-public-data-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "requests==2.32.5"
      - run: python market-prediction-lab/scripts/probe-hf-us-intraday-v1.py
