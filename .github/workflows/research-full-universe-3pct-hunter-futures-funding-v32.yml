name: Research Full-Universe 3pct Hunter Futures Funding V3.2

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - market-prediction-lab/scripts/run-full-universe-3pct-hunter-futures-funding-v32.py
      - .github/workflows/research-full-universe-3pct-hunter-futures-funding-v32.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-full-universe-3pct-hunter-futures-funding-v32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-source:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: "37400698203"
    steps:
      - name: Wait for corrected OI V3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 300); do
            status=$(gh api repos/${{ github.repository }}/actions/runs/${SOURCE_RUN_ID} --jq .status)
            conclusion=$(gh api repos/${{ github.repository }}/actions/runs/${SOURCE_RUN_ID} --jq '.conclusion // ""')
            echo "source status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              [ "${conclusion}" = "success" ] && exit 0
              exit 1
            fi
            sleep 30
          done
          exit 1

  funding-overlay:
    needs: wait-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: "37400698203"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-futures-funding-v32.py
          python -m py_compile market-prediction-lab/scripts/run-full-universe-3pct-hunter-causal-backtest-v1.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "polars>=1.30,<2" "pandas>=2.2,<3" "numpy>=2.0,<3" "pyarrow>=18,<22" "huggingface_hub>=0.30,<1" "duckdb>=1.3,<2" "requests>=2.32,<3"
      - name: Download corrected OI V3.1 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: full-universe-3pct-hunter-futures-oi-v31-*
          path: oi-v31-artifact
      - name: Run Funding V3.2
        run: |
          python market-prediction-lab/scripts/run-full-universe-3pct-hunter-futures-funding-v32.py \
            --input-root oi-v31-artifact \
            --out-dir market-prediction-lab/docs/full-universe-3pct-hunter-futures-funding-v32
      - name: Upload Funding V3.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-3pct-hunter-futures-funding-v32-${{ github.sha }}
          path: market-prediction-lab/docs/full-universe-3pct-hunter-futures-funding-v32
          if-no-files-found: error
          retention-days: 14
