name: Research Full-Universe 3pct Hunter V2 Grid Audit

on:
  push:
    branches:
      - research/full-universe-3pct-hunter-3y-v1-20261006
    paths:
      - .github/workflows/research-full-universe-3pct-hunter-v2-grid-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-full-universe-3pct-hunter-v2-grid-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "37392469034"
      LIVE_TRADING: "false"
      AUTO_TRADING: "false"
      REAL_ORDER_ENABLED: "false"
      PRIVATE_TRADING_API_ALLOWED: "false"
      EXECUTION_AUTHORITY: "NONE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download V2 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: full-universe-3pct-hunter-causal-v2-*
          path: v2-artifacts
      - name: Audit training grid only
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          rows_out = {}
          for file in sorted(Path('v2-artifacts').glob('**/candidate-grid.csv')):
              market = file.parent.name.upper()
              rows = list(csv.DictReader(file.open(encoding='utf-8-sig')))
              def b(v): return str(v).lower() == 'true'
              def f(v):
                  try: return float(v)
                  except: return 0.0
              def i(v):
                  try: return int(float(v))
                  except: return 0
              eligible = [r for r in rows if b(r.get('eligibleForSelection'))]
              positive = [r for r in eligible if f(r.get('trainReturn')) > 0]
              pf1 = [r for r in eligible if f(r.get('trainProfitFactor')) > 1]
              pm50 = [r for r in eligible if f(r.get('trainPositiveMonthRate')) >= 0.5]
              strong = [r for r in eligible if f(r.get('trainReturn')) > 0 and f(r.get('trainProfitFactor')) > 1 and f(r.get('trainPositiveMonthRate')) >= 0.5]
              top_return = sorted(eligible, key=lambda r:(f(r.get('trainReturn')), f(r.get('trainProfitFactor')), f(r.get('trainPositiveMonthRate'))), reverse=True)[:10]
              top_pf = sorted(eligible, key=lambda r:(f(r.get('trainProfitFactor')), f(r.get('trainReturn'))), reverse=True)[:10]
              def slim(r):
                  return {
                      'candidate': r.get('candidate'),
                      'direction': r.get('direction'),
                      'family': r.get('family'),
                      'topN': i(r.get('topN')),
                      'targetPct': f(r.get('targetPct')),
                      'trainReturn': f(r.get('trainReturn')),
                      'trainMdd': f(r.get('trainMdd')),
                      'trainProfitFactor': f(r.get('trainProfitFactor')),
                      'trainPositiveMonthRate': f(r.get('trainPositiveMonthRate')),
                      'trainTrades': i(r.get('trainTrades')),
                      'trainMonths3pctPlus': i(r.get('trainMonths3pctPlus')),
                  }
              rows_out[market] = {
                  'totalCandidates': len(rows),
                  'eligibleCandidates': len(eligible),
                  'positiveTrainCandidates': len(positive),
                  'profitFactorAbove1Candidates': len(pf1),
                  'positiveMonthRate50Candidates': len(pm50),
                  'strongTrainCandidates': len(strong),
                  'topByTrainReturn': [slim(r) for r in top_return],
                  'topByTrainProfitFactor': [slim(r) for r in top_pf],
              }

          print(json.dumps({'V2_TRAIN_GRID_AUDIT': rows_out}, ensure_ascii=False))
          PY
