name: Production Telegram Storage Read-only Preflight

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/production-telegram-storage-readonly-preflight.yml
      - ops/production-telegram-storage-readonly-preflight.mjs
      - ops/verify-production-telegram-storage-readonly-preflight.mjs

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-telegram-storage-readonly-preflight-${{ github.event_name == 'issue_comment' && github.event.issue.number == 23 && startsWith(github.event.comment.body, '/run-telegram-storage-preflight ') && 'command' || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate read-only Production Telegram storage preflight contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Node syntax
        run: |
          set -Eeuo pipefail
          node --check ops/production-telegram-storage-readonly-preflight.mjs
          node --check ops/verify-production-telegram-storage-readonly-preflight.mjs
      - name: Verify fail-closed read-only contract
        run: node ops/verify-production-telegram-storage-readonly-preflight.mjs

  audit:
    name: Audit Production Telegram storage prerequisites without mutation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 23 &&
      github.event.issue.title == 'Staging Readiness Control' &&
      startsWith(github.event.comment.body, '/run-telegram-storage-preflight ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse exact owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMENT_AUTHOR" == "seungjae3908-source" ]] || {
            echo 'Only the repository owner may run the Production Telegram storage preflight.' >&2
            exit 1
          }
          [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]] || {
            echo 'Command author is not the repository owner.' >&2
            exit 1
          }
          node <<'NODE'
          const fs = require('node:fs');
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/run-telegram-storage-preflight ([0-9a-fA-F]{40})$/.exec(body);
          if (!match) {
            console.error('Exact command required: /run-telegram-storage-preflight <40-character-deployed-production-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1].toLowerCase()}\n`);
          NODE

      - name: Require requested SHA to match latest successful Production Deploy
        uses: actions/github-script@v7
        env:
          PRODUCTION_SHA: ${{ steps.command.outputs.sha }}
        with:
          script: |
            const target = process.env.PRODUCTION_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-deploy.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const latestSuccessful = runs
              .filter((run) => run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!latestSuccessful) {
              core.setFailed('No successful Production Deploy run exists.');
              return;
            }
            if (String(latestSuccessful.head_sha).toLowerCase() !== target) {
              core.setFailed('Requested SHA does not match the latest successful Production Deploy.');
              return;
            }
            core.info(`Deployed Production provenance accepted from Run ID ${latestSuccessful.id}.`);

      - name: Validate existing Production SSH credentials
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" ]] || { echo 'Missing existing PROD_SSH_HOST.' >&2; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo 'Missing existing PROD_SSH_USER.' >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo 'Missing existing PROD_SSH_PRIVATE_KEY.' >&2; exit 1; }

      - name: Configure canonical Production SSH
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi

      - name: Prepare sanitized artifact path
        run: |
          set -Eeuo pipefail
          printf 'PREFLIGHT_ARTIFACT=%s\n' "$RUNNER_TEMP/production-telegram-storage-readonly-preflight.json" >> "$GITHUB_ENV"

      - name: Run fixed read-only Production Telegram storage preflight
        id: preflight
        continue-on-error: true
        env:
          PRODUCTION_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -Eeuo pipefail
          quoted_sha="$(printf '%q' "$PRODUCTION_SHA")"
          if ! ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_PRODUCTION_SHA=$quoted_sha node --input-type=module -" \
            < ops/production-telegram-storage-readonly-preflight.mjs \
            > "$PREFLIGHT_ARTIFACT" \
            2> "$RUNNER_TEMP/production-telegram-storage-readonly-preflight.stderr"; then
            echo 'Production Telegram storage read-only preflight transport failed; remote stderr is intentionally not printed.' >&2
            exit 1
          fi

      - name: Verify sanitized artifact contract
        if: always() && steps.command.outcome == 'success'
        run: |
          set -Eeuo pipefail
          [[ -s "$PREFLIGHT_ARTIFACT" ]] || {
            echo 'Sanitized Production Telegram storage preflight artifact is missing.' >&2
            exit 1
          }
          node ops/production-telegram-storage-readonly-preflight.mjs --verify-artifact "$PREFLIGHT_ARTIFACT"

      - name: Upload sanitized read-only evidence
        if: always() && steps.command.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-telegram-storage-preflight-${{ steps.command.outputs.sha }}
          path: ${{ runner.temp }}/production-telegram-storage-readonly-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Report sanitized preflight result
        if: always() && steps.command.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PRODUCTION_SHA: ${{ steps.command.outputs.sha }}
          PREFLIGHT_ARTIFACT: ${{ env.PREFLIGHT_ARTIFACT }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const fs = require('node:fs');
            if (process.env.PREFLIGHT_OUTCOME !== 'success' || !fs.existsSync(process.env.PREFLIGHT_ARTIFACT)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 23,
                body: [
                  'Production Telegram storage read-only preflight failed before sanitized catalog evidence was produced.',
                  '',
                  `- Deployed Production SHA: \`${process.env.PRODUCTION_SHA}\``,
                  '- Database changed: `false`',
                  '- Production deployment executed: `false`',
                  '- Secret values recorded: `false`',
                  `- Preflight Run ID: \`${context.runId}\``,
                  `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
                ].join('\n'),
              });
              core.setFailed('Sanitized Production Telegram storage preflight artifact was not produced.');
              return;
            }

            const value = JSON.parse(fs.readFileSync(process.env.PREFLIGHT_ARTIFACT, 'utf8'));
            const prefs = value.notification_preferences;
            const telegram = value.telegram_tables;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: [
                'Production Telegram storage read-only preflight completed.',
                '',
                `- Deployed Production SHA: \`${value.production_sha}\``,
                `- Classification: \`${value.classification}\``,
                `- Release preflight ready: \`${value.release_preflight_ready}\``,
                `- PM2 online: \`${value.pm2_online}\``,
                `- Production project match: \`${value.production_project_match}\``,
                `- PostgreSQL connection count: \`${value.postgres_connection_count}\``,
                `- PostgreSQL endpoint type: \`${value.postgres_endpoint_type}\``,
                `- PostgreSQL port: \`${value.postgres_port}\``,
                `- Read-only probe completed: \`${value.read_only_probe}\``,
                `- profiles exists: \`${value.profiles_exists}\``,
                `- auth.users exists: \`${value.auth_users_exists}\``,
                `- service_role exists: \`${value.service_role_exists}\``,
                `- is_approved_member() exists: \`${value.is_approved_member_function_exists}\``,
                `- notification_preferences exists: \`${prefs.table_exists}\``,
                `- canonical member_id/enabled_types: \`${prefs.member_id}/${prefs.enabled_types}\``,
                `- canonical app_enabled/push_enabled/updated_at: \`${prefs.app_enabled}/${prefs.push_enabled}/${prefs.updated_at}\``,
                `- member_id unique arbiter: \`${prefs.member_id_unique_arbiter}\``,
                `- legacy user_id/payload columns: \`${prefs.legacy_user_id}/${prefs.legacy_payload}\``,
                `- Telegram tables exist (connections/tokens/events/deliveries): \`${telegram.telegram_connections_exists}/${telegram.telegram_link_tokens_exists}/${telegram.user_execution_events_exists}/${telegram.notification_deliveries_exists}\``,
                `- Existing Telegram schema compatible: \`${telegram.existing_schema_compatible}\``,
                '- Database changed: `false`',
                '- Production deployment executed: `false`',
                '- Secret values recorded: `false`',
                '- Raw user data exposed: `false`',
                '- Actual orders: `0`',
                `- Preflight Run ID: \`${context.runId}\``,
                `- Source command comment ID: \`${process.env.SOURCE_COMMENT_ID}\``,
              ].join('\n'),
            });

      - name: Write preflight summary
        if: always() && steps.command.outcome == 'success' && steps.preflight.outcome == 'success'
        run: |
          {
            echo '## Production Telegram storage read-only preflight'
            echo
            echo "- Deployed Production SHA: \`${{ steps.command.outputs.sha }}\`"
            echo '- Database changed: `false`'
            echo '- Production deployment executed: `false`'
            echo '- Secret values recorded: `false`'
            echo '- This workflow only collects fixed PostgreSQL catalog booleans and PM2 identity metadata.'
          } >> "$GITHUB_STEP_SUMMARY"
