name: Staging Admin Auth Repair

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main SHA to repair in isolated staging
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/staging-admin-auth-repair.yml"
      - "api-server/scripts/repair-staging-admin-auth.mjs"
      - "api-server/scripts/verify-staging-admin-auth-repair-contract.mjs"

permissions:
  contents: read
  statuses: read
  issues: read

concurrency:
  group: staging-admin-auth-repair
  cancel-in-progress: false

jobs:
  contract:
    name: Verify Staging admin auth repair contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node api-server/scripts/verify-staging-admin-auth-repair-contract.mjs

  authorize:
    name: Authorize isolated Staging admin auth repair
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner ||
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 23 &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/repair-staging-admin-auth ')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact approved target SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const eventName = process.env.EVENT_NAME;
          const raw = eventName === 'workflow_dispatch'
            ? String(process.env.INPUT_SHA ?? '').trim()
            : String(process.env.COMMENT_BODY ?? '').trim();
          const match = eventName === 'workflow_dispatch'
            ? /^([0-9a-f]{40})$/u.exec(raw)
            : /^\/repair-staging-admin-auth ([0-9a-f]{40})$/u.exec(raw);
          if (!match) {
            console.error('Exact command required: /repair-staging-admin-auth <40-char-current-main-sha>');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1]}\n`);
          NODE

      - name: Require exact current main
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse refs/remotes/origin/main)"
          [[ "$TARGET_SHA" == "$CURRENT_MAIN" ]] || {
            echo "Target SHA is not exact current main." >&2
            exit 1
          }

      - name: Require exact-main Required CI 6/6
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          node <<'NODE'
          const required = [
            'application-ci/verified',
            'browser-ui/verified',
            'database-rls/verified',
            'security-integration/verified',
            'ai-privacy/verified',
            'futures-public-network-smoke/verified',
          ];
          const url = `${process.env.API_URL}/repos/${process.env.REPOSITORY}/commits/${process.env.TARGET_SHA}/status?per_page=100`;
          const response = await fetch(url, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            console.error(`Unable to read Required CI status: HTTP ${response.status}`);
            process.exit(1);
          }
          const payload = await response.json();
          const latest = new Map();
          for (const item of payload.statuses ?? []) {
            if (!latest.has(item.context)) latest.set(item.context, item.state);
          }
          const failed = required.filter((context) => latest.get(context) !== 'success');
          for (const context of required) {
            console.log(`${context}: ${latest.get(context) ?? 'missing'}`);
          }
          if (failed.length) {
            console.error(`Required CI is not 6/6 SUCCESS: ${failed.join(', ')}`);
            process.exit(1);
          }
          NODE

  repair:
    name: Repair only isolated Staging admin Auth user
    if: needs.authorize.result == 'success'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      REPAIR_APPROVED: STAGING_ADMIN_AUTH_REPAIR_V1
      EXPECTED_STAGING_PROJECT_REF: petlfbztqguuzkasfpug
      KNOWN_PRODUCTION_PROJECT_REF: bawcbkoyovbeajkrnduq
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/api-server...

      - name: Repair and verify Staging admin password authentication
        run: node api-server/scripts/repair-staging-admin-auth.mjs

      - name: Record bounded repair result
        run: |
          {
            echo '## Isolated Staging admin Auth repair verified'
            echo
            echo "- Target SHA: \`${{ needs.authorize.outputs.target_sha }}\`"
            echo '- Staging Auth user create/update: bounded to configured admin email'
            echo '- Password authentication after repair: `verified`'
            echo '- Production Supabase touched: `false`'
            echo '- Public profile/DB/schema touched directly: `false`'
            echo '- Server/PM2/deploy/schedule touched: `false`'
            echo '- Secret values recorded: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
