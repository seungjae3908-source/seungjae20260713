name: Public Forward Liquidity Server Shadow Activation V1

on:
  pull_request:
    paths:
      - '.github/workflows/public-forward-liquidity-server-shadow-activation-v1.yml'
      - 'ops/install-public-forward-liquidity-server-shadow-worker-v1.sh'
      - 'market-intelligence-sidecar/deploy/public-forward-liquidity-server-shadow-worker-v1.service'
      - 'market-intelligence-sidecar/deploy/public-forward-liquidity-server-shadow-worker-v1.timer'
      - 'market-intelligence-sidecar/src/public-forward-liquidity-server-shadow-worker-v1.mjs'
      - 'market-intelligence-sidecar/scripts/run-public-forward-liquidity-server-shadow-worker-v1.mjs'
      - 'market-intelligence-sidecar/tests/public-forward-liquidity-server-shadow-worker-v1.test.mjs'
      - 'market-intelligence-sidecar/config/public-forward-liquidity-successor-schedule-reliability-activation-v3.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    server-evidence-shadow-activation-${{
      github.event_name == 'issue_comment'
      && github.event.issue.number == 23
      && github.event.comment.id
      || github.event.pull_request.number
      || github.run_id
    }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact pull request head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify installer syntax and worker regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/install-public-forward-liquidity-server-shadow-worker-v1.sh
          node --test market-intelligence-sidecar/tests/public-forward-liquidity-server-shadow-worker-v1.test.mjs
          node market-intelligence-sidecar/scripts/run-public-forward-liquidity-server-shadow-worker-v1.mjs self-check >/tmp/shadow-self-check.json
          node - /tmp/shadow-self-check.json <<'NODE'
          const fs = require('node:fs');
          const v = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (v?.contractValid !== true
            || v?.activationBound !== true
            || v?.runtimeActivated !== false
            || v?.networkRequestPerformed !== false
            || v?.safety?.shadowOnly !== true
            || v?.safety?.serverCanonical !== false
            || v?.safety?.canonicalEconomicCredit !== 0
            || v?.safety?.executionAuthority !== 'NONE') process.exit(1);
          NODE

      - name: Verify isolated activation safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/public-forward-liquidity-server-shadow-activation-v1.yml'
          installer='ops/install-public-forward-liquidity-server-shadow-worker-v1.sh'
          service='market-intelligence-sidecar/deploy/public-forward-liquidity-server-shadow-worker-v1.service'
          timer='market-intelligence-sidecar/deploy/public-forward-liquidity-server-shadow-worker-v1.timer'

          grep -Fq "startsWith(github.event.comment.body, '/activate-server-evidence-shadow-v1 ')" "$workflow"
          grep -Fq 'environment: production' "$workflow"
          grep -Fq 'PROD_SSH_HOST' "$workflow"
          grep -Fq 'Revalidate exact current main after Production approval' "$workflow"
          ! grep -Eq '^[[:space:]]{2}(schedule|workflow_dispatch):' "$workflow"

          grep -Fq 'RUNTIME_ROOT=/opt/stock-app-server-evidence-shadow-v1' "$installer"
          grep -Fq 'SERVER_EVIDENCE_SHADOW_ONLY=true' "$service"
          grep -Fq 'SERVER_EVIDENCE_SERVER_CANONICAL=false' "$service"
          grep -Fq 'WorkingDirectory=/opt/stock-app-server-evidence-shadow-v1/current' "$service"
          grep -Fq 'Persistent=false' "$timer"
          grep -Fq 'OnCalendar=*-*-* *:17:00 UTC' "$timer"
          grep -Fq 'OnCalendar=*-*-* *:27:00 UTC' "$timer"
          grep -Fq 'OnCalendar=*-*-* *:37:00 UTC' "$timer"

          ! grep -Eq 'pm2[[:space:]]+(start|restart|reload|stop|delete)|supabase[[:space:]]+db|psql[[:space:]].*-(c|f)' "$installer"
          ! grep -Eq 'LIVE_TRADING=.?(true|1)|AUTO_TRADING=.?(true|1)|REAL_ORDER_ENABLED=.?(true|1)|PRIVATE_TRADING_API_ALLOWED=.?(true|1)' "$installer" "$service"

  gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 23 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/activate-server-evidence-shadow-v1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      actions: read
      statuses: read
    outputs:
      target_sha: ${{ steps.command.outputs.target_sha }}
      receipt_comment_id: ${{ steps.command.outputs.receipt_comment_id }}
      binding_digest: ${{ steps.command.outputs.binding_digest }}
      required_ci_run_id: ${{ steps.main_ci.outputs.run_id }}
    steps:
      - name: Parse exact OWNER activation command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          const match = /^\/activate-server-evidence-shadow-v1 ([0-9a-f]{40}) ([1-9][0-9]*) ([0-9a-f]{64})$/.exec(body);
          if (!match) throw new Error('Exact command required: /activate-server-evidence-shadow-v1 <current-main-sha> <activation-receipt-comment-id> <binding-digest>');
          appendFileSync(process.env.GITHUB_OUTPUT, `target_sha=${match[1]}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `receipt_comment_id=${match[2]}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `binding_digest=${match[3]}\n`);
          NODE

      - name: Require registered Release Control command template
        uses: actions/github-script@v7
        with:
          script: |
            const issue = (await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 23,
            })).data;
            const template = '/activate-server-evidence-shadow-v1 <current-main-sha> <activation-receipt-comment-id> <binding-digest>';
            if (issue.state !== 'open'
              || issue.title !== 'Staging Readiness Control'
              || !String(issue.body ?? '').includes(template)) {
              core.setFailed('SERVER_EVIDENCE_SHADOW_COMMAND_NOT_REGISTERED_ON_RELEASE_CONTROL');
            }

      - name: Require exact current main and coherent Required CI 6/6
        id: main_ci
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const main = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            })).data;
            if (main.commit.sha !== target) {
              core.setFailed(`SERVER_EVIDENCE_SHADOW_TARGET_STALE:${target}!=${main.commit.sha}`);
              return;
            }
            const required = [
              'application-ci/verified',
              'browser-ui/verified',
              'database-rls/verified',
              'security-integration/verified',
              'ai-privacy/verified',
              'futures-public-network-smoke/verified',
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: target, per_page: 100,
            });
            statuses.sort((a,b) => Number(b.id) - Number(a.id));
            const latest = new Map();
            for (const row of statuses) if (!latest.has(row.context)) latest.set(row.context, row);
            const missing = required.filter((name) => latest.get(name)?.state !== 'success');
            if (missing.length) {
              core.setFailed(`SERVER_EVIDENCE_SHADOW_REQUIRED_CI_NOT_6_OF_6:${missing.join(',')}`);
              return;
            }
            const ids = new Set(required.map((name) =>
              /\/actions\/runs\/(\d+)/.exec(String(latest.get(name)?.target_url ?? ''))?.[1] ?? null));
            if (ids.size !== 1 || ids.has(null)) {
              core.setFailed(`SERVER_EVIDENCE_SHADOW_REQUIRED_CI_NOT_COHERENT:${[...ids].join(',')}`);
              return;
            }
            const runId = Number([...ids][0]);
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            })).data;
            if (run.head_sha !== target
              || run.head_branch !== 'main'
              || run.event !== 'push'
              || Number(run.run_attempt) !== 1
              || run.status !== 'completed'
              || run.conclusion !== 'success'
              || run.path !== '.github/workflows/futures-public-network-smoke.yml') {
              core.setFailed(`SERVER_EVIDENCE_SHADOW_REQUIRED_CI_PROVENANCE_INVALID:${runId}`);
              return;
            }
            core.setOutput('run_id', String(runId));

      - name: Verify exact current-main OWNER V3 activation receipt
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RECEIPT_COMMENT_ID: ${{ steps.command.outputs.receipt_comment_id }}
          BINDING_DIGEST: ${{ steps.command.outputs.binding_digest }}
        with:
          script: |
            const id = Number(process.env.RECEIPT_COMMENT_ID);
            const comment = (await github.rest.issues.getComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id,
            })).data;
            const expected = `/authorize-public-only-partial-fill-v3-schedule-activation ${process.env.TARGET_SHA} ${process.env.BINDING_DIGEST}`;
            if (comment.issue_url !== `${context.apiUrl}/repos/${context.repo.owner}/${context.repo.repo}/issues/23`
              || comment.user?.login !== context.repo.owner
              || comment.author_association !== 'OWNER'
              || String(comment.body ?? '').trim() !== expected) {
              core.setFailed('SERVER_EVIDENCE_SHADOW_V3_RECEIPT_INVALID');
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact binding digest and zero-canonical self-check
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          BINDING_DIGEST: ${{ steps.command.outputs.binding_digest }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          SERVER_EVIDENCE_EXPECTED_BINDING_DIGEST="$BINDING_DIGEST"             node market-intelligence-sidecar/scripts/run-public-forward-liquidity-server-shadow-worker-v1.mjs self-check             > "$RUNNER_TEMP/server-evidence-shadow-self-check.json"
          node - "$RUNNER_TEMP/server-evidence-shadow-self-check.json" <<'NODE'
          const fs = require('node:fs');
          const v = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (v?.contractValid !== true
            || v?.activationBound !== true
            || v?.runtimeActivated !== false
            || v?.networkRequestPerformed !== false
            || v?.safety?.serverCanonical !== false
            || v?.safety?.canonicalEconomicCredit !== 0
            || v?.safety?.executionAuthority !== 'NONE') process.exit(1);
          NODE

  activate:
    if: github.event_name == 'issue_comment'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
      RECEIPT_COMMENT_ID: ${{ needs.gate.outputs.receipt_comment_id }}
      BINDING_DIGEST: ${{ needs.gate.outputs.binding_digest }}
      REQUIRED_CI_RUN_ID: ${{ needs.gate.outputs.required_ci_run_id }}
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git
      EVIDENCE_DIR: ${{ runner.temp }}/server-evidence-shadow-activation
    steps:
      - name: Revalidate exact current main after Production approval
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const main = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            })).data;
            if (main.commit.sha !== process.env.TARGET_SHA) {
              core.setFailed(`SERVER_EVIDENCE_SHADOW_TARGET_MOVED_DURING_APPROVAL:${main.commit.sha}`);
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate SSH secrets and configure access
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh "$EVIDENCE_DIR"
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Capture Production application identity before isolated activation
        id: app_before
        shell: bash
        run: |
          set -Eeuo pipefail
          app_sha="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha")"
          [[ "$app_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$app_sha" >> "$GITHUB_OUTPUT"
          printf '{"productionAppShaBefore":"%s"}\n' "$app_sha" > "$EVIDENCE_DIR/application-before.json"

      - name: Install isolated exact-SHA SHADOW_ONLY worker and timer
        id: install
        env:
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v remote_command             'TARGET_SHA=%q ACTIVATION_RECEIPT_COMMENT_ID=%q ACTIVATION_BINDING_DIGEST=%q REPOSITORY_URL=%q PRODUCTION_APP_SHA=%q bash -s'             "$TARGET_SHA" "$RECEIPT_COMMENT_ID" "$BINDING_DIGEST" "$REPOSITORY_URL" "$PRODUCTION_APP_SHA"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "$remote_command" <<'REMOTE' > "$EVIDENCE_DIR/activation.json"
          set -Eeuo pipefail
          SOURCE_DIR="$(mktemp -d /tmp/server-evidence-shadow-source.XXXXXX)"
          cleanup() { rm -rf -- "$SOURCE_DIR"; }
          trap cleanup EXIT
          [[ "$(tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha)" == "$PRODUCTION_APP_SHA" ]]
          git clone --quiet --filter=blob:none --no-checkout "$REPOSITORY_URL" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch --quiet --depth 1 origin "$TARGET_SHA"
          [[ "$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{commit})" == "$TARGET_SHA" ]]
          git -C "$SOURCE_DIR" checkout --quiet --detach "$TARGET_SHA"
          SOURCE_DIR="$SOURCE_DIR"             TARGET_SHA="$TARGET_SHA"             ACTIVATION_RECEIPT_COMMENT_ID="$ACTIVATION_RECEIPT_COMMENT_ID"             ACTIVATION_BINDING_DIGEST="$ACTIVATION_BINDING_DIGEST"             "$SOURCE_DIR/ops/install-public-forward-liquidity-server-shadow-worker-v1.sh"               "$TARGET_SHA" "$ACTIVATION_RECEIPT_COMMENT_ID" "$ACTIVATION_BINDING_DIGEST"
          [[ "$(tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha)" == "$PRODUCTION_APP_SHA" ]]
          REMOTE

          node - "$EVIDENCE_DIR/activation.json" <<'NODE'
          const fs = require('node:fs');
          const v = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (v?.status !== 'ACTIVE_SHADOW_ONLY'
            || v?.targetSha !== process.env.TARGET_SHA
            || String(v?.activationReceiptCommentId) !== process.env.RECEIPT_COMMENT_ID
            || v?.activationBindingDigest !== process.env.BINDING_DIGEST
            || v?.shadowOnly !== true
            || v?.serverCanonical !== false
            || v?.prospectiveSlotCredit !== 0
            || v?.canonicalEconomicCredit !== 0
            || v?.profitabilityProven !== false
            || v?.executionAuthority !== 'NONE'
            || v?.productionAppDeployPerformed !== false
            || v?.productionAppMutationAllowed !== false
            || v?.databaseMutationCount !== 0
            || v?.secretMutationCount !== 0
            || v?.realOrderCount !== 0
            || v?.replitUsed !== false) process.exit(1);
          NODE

      - name: Prove Production application identity unchanged
        shell: bash
        env:
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
        run: |
          set -Eeuo pipefail
          after="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15             "$SSH_USER@$SSH_HOST" "tr -d '[:space:]' < /opt/stock-app/.deploy/current-sha")"
          [[ "$after" == "$PRODUCTION_APP_SHA" ]]
          printf '{"productionAppShaAfter":"%s","unchanged":true}\n' "$after" > "$EVIDENCE_DIR/application-after.json"

      - name: Upload immutable shadow activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: server-evidence-shadow-activation-${{ env.TARGET_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Report activated SHADOW_ONLY runtime to Central Hub
        uses: actions/github-script@v7
        env:
          PRODUCTION_APP_SHA: ${{ steps.app_before.outputs.sha }}
        with:
          script: |
            const lines = [
              '[SERVER_EVIDENCE_SHADOW_ACTIVATED]',
              `target_sha=${process.env.TARGET_SHA}`,
              `activation_receipt_comment_id=${process.env.RECEIPT_COMMENT_ID}`,
              `binding_digest=${process.env.BINDING_DIGEST}`,
              `required_ci_run=${process.env.REQUIRED_CI_RUN_ID}`,
              `production_app_sha_unchanged=${process.env.PRODUCTION_APP_SHA}`,
              `workflow_run=${context.runId}`,
              'status=ACTIVE_SHADOW_ONLY',
              'SERVER_CANONICAL=false',
              'prospectiveSlotCredit=0',
              'canonicalEconomicCredit=0',
              'PROFITABILITY_PROVEN=false',
              'LIVE_TRADING=false',
              'AUTO_TRADING=false',
              'REAL_ORDER_ENABLED=false',
              'PRIVATE_TRADING_API_ALLOWED=false',
              'executionAuthority=NONE',
              'real_orders=0',
              'DB_SECRET_ENV_MUTATION=0',
              'Replit_used=0',
              'next=observe natural server :17/:27/:37 shadow evidence; canonical GitHub V3 remains authoritative',
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: 1102, body: lines.join('\n'),
            });

      - name: Report fail-closed activation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 1102,
              body: [
                '[SERVER_EVIDENCE_SHADOW_ACTIVATION_FAILED]',
                `target_sha=${process.env.TARGET_SHA}`,
                `activation_receipt_comment_id=${process.env.RECEIPT_COMMENT_ID}`,
                `workflow_run=${context.runId}`,
                'status=FAILED_CLOSED',
                'canonicalEconomicCredit=0',
                'PROFITABILITY_PROVEN=false',
                'executionAuthority=NONE',
                'real_orders=0',
                'next=inspect FIRST_ZERO; do not rerun-to-pass or weaken the frozen evidence policy',
              ].join('\n'),
            });
