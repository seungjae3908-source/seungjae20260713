<div class="preview-stage"><div class="device-shell" id="deviceShell" data-device="auto"><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="main-wrap"><header class="app-top"><div class="app-top-title" id="pageTopTitle">홈</div><button type="button" class="app-search" data-action="goto" data-target="scanner"><span class="ico"><svg><use href="#i-search"/></svg></span><span>시장·종목·신호 검색 (시연)</span><span style="margin-left:auto;opacity:.6">⌕</span></button><div class="top-ends"><span class="top-status"><span class="dot"></span> 프리뷰 · 데이터 비연동</span><button class="top-ico" data-action="notify" aria-label="알림 시연"><span class="ico"><svg><use href="#i-bell"/></svg></span></button><button class="top-ico" data-action="more" aria-label="전체 메뉴"><span class="ico"><svg><use href="#i-grid"/></svg></span></button></div></header><div class="viewport-area" id="viewportArea"><main class="page" id="page"></main></div><nav class="mobile-nav" id="mobileNav" aria-label="모바일 주요 메뉴"></nav></div></div><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="전체 메뉴"><div class="sheet" id="sheet"></div></div><div role="status" class="toast" id="toast"></div></div></div>
<script>
'use strict';
const routes=[['home','홈','home'],['scanner','신호검색기','scan'],['chart','AI 차트','chart'],['research','리서치센터','research'],['auto','실자동매매','robot'],['paper','모의매매','paper'],['portfolio','보유종목','wallet'],['journal','매매일지','journal'],['account','계좌 연결','shield'],['settings','설정·UI Builder','settings']];
const markets=[['KR','국내주식'],['US','미국주식'],['SPOT','코인현물'],['FUT','코인선물']];
const st={page:'home',device:'auto',theme:'light',market:'KR',tf:'5분',chartMarket:'SPOT',chartSymbol:'BTC/KRW · 예시',goal:'5',goalAction:'pause',stop:'strategy',take:'strategy',paperMode:'auto',manualLev:'7',ma:true,vwap:true,volume:true,density:'normal',chartX:null,marketFilter:'',lastAnnouncement:''};
const $=sel=>document.querySelector(sel);
const icon=(name)=>`<span class="ico"><svg aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
const escaped=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const pill=(s,cls='')=>`<span class="pill ${cls}">${s}</span>`;
const header=(title,desc,ey='WORKSPACE',extra='')=>`<header class="page-heading"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="page-intro">${desc}</p></div>${extra?`<div class="heading-actions">${extra}</div>`:''}</header>`;
const section=(title,right='')=>`<div class="section-title"><h2>${title}</h2>${right?`<p>${right}</p>`:''}</div>`;
const card=(html,cls='')=>`<article class="card card-pad ${cls}">${html}</article>`;
const selectButtons=(name,options,value)=>`<div class="segmented" role="group" aria-label="${escaped(name)}">${options.map(o=>`<button type="button" data-action="set" data-field="${name}" data-value="${escaped(o[0])}" class="${o[0]===value?'active':''}">${escaped(o[1])}</button>`).join('')}</div>`;
function marketControls(){return selectButtons('market',markets,st.market);}
function miniStats(){return `<div class="cols4"><div class="card kpi"><div class="kpi-label">${icon('scan')} 신호검색기</div><div class="kpi-value">S등급 전용</div><div class="kpi-foot">실제 후보 수는 미연결</div></div><div class="card kpi"><div class="kpi-label">${icon('chart')} 4시장 데이터</div><div class="kpi-value">조회 필요</div><div class="kpi-foot">실시간 데이터 연동 시 표시</div></div><div class="card kpi"><div class="kpi-label">${icon('robot')} 자동매매</div><div class="kpi-value">시연 모드</div><div class="kpi-foot">주문·Worker 동작 없음</div></div><div class="card kpi"><div class="kpi-label">${icon('research')} 검증 단계</div><div class="kpi-value">근거 확인</div><div class="kpi-foot">OOS·비용 검증 표시 영역</div></div></div>`;}
function chartSurface(kind='main'){
const small=kind==='home';
return `<div class="row between" style="gap:9px;flex-wrap:wrap;margin-bottom:12px"><div class="row" style="gap:8px"><strong style="font-size:12px;color:var(--strong)">${escaped(st.chartSymbol)}</strong>${pill('샘플 캔들','blue')}</div>${selectButtons('tf',[['1분','1분'],['5분','5분'],['15분','15분'],['1시간','1시간'],['1일','1일']],st.tf)}</div><div class="chart-container ${small?'mini-chart':''}"><canvas class="sample-canvas" aria-label="데이터 샘플 캔들 차트, 실제 시세 아님"></canvas><span class="chart-stamp">OHLCV 예시 · 비실시간</span><span class="chart-tooltip" id="hoverValue">시연 가격 · 실제 시세 아님</span><span class="chart-hint">마우스를 움직이면 예시 캔들 정보를 볼 수 있어요.</span></div>${!small?`<div class="row" style="margin-top:10px;gap:13px;flex-wrap:wrap"><label class="switcher"><input type="checkbox" data-field="ma" ${st.ma?'checked':''}>MA</label><label class="switcher"><input type="checkbox" data-field="vwap" ${st.vwap?'checked':''}>VWAP</label><label class="switcher"><input type="checkbox" data-field="volume" ${st.volume?'checked':''}>거래량</label><span class="mini-text" style="margin-left:auto">가격·패턴은 모두 합성 시연값</span></div>`:''}`;}
function home(){return `${header('투자 판단을 위한 하나의 워크스페이스','4시장 신호, 차트, 전략 검증, 자동매매를 하나의 흐름으로 연결하는 신규 UI 구조야. 현재 화면의 수치와 차트는 전부 시연용이야.','OVERVIEW',pill('UI 디자인 시연','blue'))}${miniStats()}<div style="height:17px"></div><div class="split"><div class="gap16">${card(`${section('시장 흐름과 차트','시연용 차트 · 실제 시세 아님')}${chartSurface('home')}<div class="row between" style="margin-top:11px"><span class="mini-text">신호 → 차트 → 매매 검토로 이동하는 흐름</span><button class="btn soft" data-action="goto" data-target="chart">AI 차트 보기 ${icon('arrow')}</button></div>`)}${card(`${section('S급 신호 워크스페이스','조건검사 상태')}${markets.map(([k,label])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b style="font-size:11px">${label}</b><p class="mini-text">실제 신호 Producer 연결 후 활성화</p></div>${pill('실데이터 대기','warn')}</div>`).join('')}<button class="btn soft" style="margin-top:13px" data-action="goto" data-target="scanner">신호검색기로 이동 ${icon('arrow')}</button>`)}</div><div class="gap16">${card(`${section('시장별 연결 상태','Preview only')}<div class="market-tiles">${markets.map(([k,label])=>`<div class="market-tile"><div class="market-title">${label}</div><div class="market-sub">공개시장 데이터<br>미연결</div></div>`).join('')}</div><div class="line"></div><p class="mini-text">신호검색기 → AI차트 → 주문검토 → 일지까지 메뉴는 연결된 시연 흐름으로 확인할 수 있어.</p>`)}${card(`${section('다음으로 확인할 작업')}${[['01','운영 UI vNext 통합','프리뷰 CSS와 최신 메인 통합','warn'],['02','UI Builder 렌더링','14화면 배치 적용 실제 연결','warn'],['03','인증 실사용 QA','로그인·모바일·계좌 읽기 확인','warn']].map(([n,t,s,c])=>`<div class="progress-row" style="margin-bottom:12px"><span class="step-index">${n}</span><div><div class="step-title">${t}</div><div class="step-sub">${s}</div></div>${pill('남음',c)}</div>`).join('')}`)}${card(`${section('개인화된 작업 공간')}<p class="note">PC에서는 넓게, 모바일에서는 한 번에 필요한 정보만 표시하도록 레이아웃이 바뀌어. 상단의 기기 버튼으로 미리 확인해 봐.</p><button style="margin-top:12px" class="btn" data-action="goto" data-target="settings">UI Builder 보기 ${icon('arrow')}</button>`)}</div></div>${footer()}`;}
function scanner(){let sample=[['KR','005930','삼성전자 · 표시 예시','KR 샘플'],['US','AAPL','Apple · 표시 예시','US 샘플'],['SPOT','BTC/KRW','비트코인 · 표시 예시','현물 샘플'],['FUT','BTCUSDT','BTCUSDT · 표시 예시','선물 샘플']];let rows=sample.filter(x=>(st.market==='KR'?x[0]==='KR':st.market==='US'?x[0]==='US':st.market==='SPOT'?x[0]==='SPOT':x[0]==='FUT')&&(!st.marketFilter||x.join('|').toLowerCase().includes(st.marketFilter.toLowerCase())));return `${header('4시장 통합 신호검색기','S등급만 표시하도록 설계된 검색기 화면이야. 아래 종목은 UI 확인용 예시이며 실제 진입 신호나 추천이 아니야.','SIGNAL SCANNER',pill('S급 전용','blue'))}${card(`<div class="row between" style="gap:11px;flex-wrap:wrap"><div><div class="mini-text" style="margin-bottom:7px">시장 선택</div>${marketControls()}</div><div class="row" style="align-self:end;flex-wrap:wrap;gap:7px"><span class="rule-chip">1분 원본 → 3·5·15·60분</span><span class="rule-chip">신호 Freshness</span><span class="rule-chip">비용·데이터 근거</span></div></div><div class="line"></div><div class="row between" style="flex-wrap:wrap"><div><b class="small-title">S등급 후보 확인</b><p class="mini-text">현재 프리뷰에는 실제 탐지 결과가 없어 S급 후보 수를 표시하지 않아.</p></div><input class="filter-input" id="searchSymbol" value="${escaped(st.marketFilter)}" placeholder="예시 종목 검색" aria-label="예시 종목 검색"></div><div class="line"></div>${rows.length?rows.map(x=>`<div class="example-row"><div><b class="sym">${escaped(x[1])}</b><div class="mini-text">${escaped(x[2])}</div></div><div>${pill('샘플 종목','blue')}</div><div class="hide-mobile mini-text">S급 검증 근거: 없음</div><div class="hide-mobile mini-text">실시간 시세: 미연결</div><button class="btn soft" data-action="chartSymbol" data-symbol="${escaped(x[1])}" data-market="${escaped(x[0])}">차트 예시 ${icon('arrow')}</button></div>`).join(''):`<div class="empty-note">검색된 예시 종목이 없어. 실제 종목 API는 연결되지 않았어.</div>`}<div class="demo-alert" style="margin-top:14px"><b>중요:</b> 샘플 카드는 실제 S등급 신호, 거래량 급증, 수익성 검증, 자동 주문 실행 가능 여부를 나타내지 않아.</div>`)}<div style="height:14px"></div>${card(`${section('검색 → 차트 → 주문검토 흐름') }<div class="status-rail"><div><div class="mini-text">1. 실제 데이터</div><b class="small-title warn">연동 필요</b></div><div><div class="mini-text">2. 신호 검증</div><b class="small-title warn">근거 필요</b></div><div><div class="mini-text">3. 주문 권한</div><b class="small-title">차단 유지</b></div></div>`)}${footer()}`;}
function chart(){return `${header('AI 차트와 매매 검토를 한 화면에','코덱이 작업한 실제 AI차트의 정보 계층을 참고한 화면 시연이야. 합성 캔들이며 AI모델·거래소·실계좌는 호출하지 않아.','AI CHART',pill('읽기 전용 UI 샘플','blue'))}<div class="split">${card(`${chartSurface()}<div class="row" style="flex-wrap:wrap;gap:7px;margin-top:13px">${pill('보조지표: MA / VWAP')}${pill('실시간 WS 미연결','warn')}${pill('좌측 봉 잘림 테스트 대상')}</div>`)}<div class="gap12">${card(`${section('분석 근거','표시 예시')}<div class="row between"><b class="small-title">전략 판단</b>${pill('판단 미제공','warn')}</div><div class="line"></div><div class="vstack"><div class="row between"><span class="mini-text">진입가</span><span class="strong" style="font-size:12px">미산정</span></div><div class="row between"><span class="mini-text">목표가</span><span class="strong" style="font-size:12px">미산정</span></div><div class="row between"><span class="mini-text">손절가</span><span class="strong" style="font-size:12px">미산정</span></div><div class="row between"><span class="mini-text">신호 근거</span><span class="warn" style="font-size:11px;font-weight:800">실데이터 필요</span></div></div><div class="line"></div><p class="mini-text">실제 AI 차트는 종목·시장·시간봉·캔들 신선도와 분석 근거가 일치할 때만 결과를 보여주도록 검증해야 해.</p>`)}${card(`${section('호가·주문 검토','값은 모두 시연 예시')}<div class="order-level"><span class="red">매도 예시</span><b>52,540</b><span class="muted">1.54</span></div><div class="order-level"><span class="red">매도 예시</span><b>52,510</b><span class="muted">0.93</span></div><div class="order-level"><span class="green">매수 예시</span><b>52,480</b><span class="muted">2.15</span></div><div class="order-level"><span class="green">매수 예시</span><b>52,450</b><span class="muted">0.67</span></div><div class="row" style="margin-top:12px"><button class="btn" style="flex:1" data-action="tradePreview" data-side="buy">매수 UI</button><button class="btn" style="flex:1" data-action="tradePreview" data-side="sell">매도 UI</button></div><p class="mini-text" style="margin-top:9px">버튼 클릭 시 안내만 표시하고 주문 전송은 절대 하지 않아.</p>`)}${card(`${section('AI 생중계','별도 근거 필요')}<div class="empty-note">규칙 기반 이벤트는 실제 시장 데이터가 들어와야 생성돼. 이 프리뷰에서는 가상 이벤트나 성과를 만들어내지 않아.</div>`)}</div></div>${footer()}`;}
function research(){let phases=[['원본 1분봉 수집','4시장 전체 종목·누락·시간 정합성','원본 확인','warn'],['전략 후보 탐색','논문·공개 매매·조건검색 등 출처 검증','탐색 영역','blue'],['백테스트','체결·세금·슬리피지·거래대금·환율 반영','증빙 확인','warn'],['독립 OOS / 워크포워드','실제 독립기간·표본·과적합 검증','승격 전 차단','warn'],['Paper Forward','실제 가상 체결·원장·손익·거래일지','진입 미증명','warn'],['실자동매매 승격','별도 승인·위험 검증·실사용 입증','자동 승격 없음','red']];return `${header('리서치센터','실제 수익성 증거가 없는 단계는 성공처럼 표시하지 않는 요약형 연구센터야. 내부 코드는 별도 상세 화면에 보이도록 설계했어.','RESEARCH CENTER',pill('성과 수치 미생성','warn'))}<div class="cols3">${[['데이터 수집','누락 확인 필요','4시장 전체 원본'],['전략 검증','독립 근거 확인','OOS / Walk-forward'],['경제적 증거','미입증','Full Cost / Settlement']].map(([title,val,sub])=>`<div class="card kpi"><div class="kpi-label">${title}</div><div class="kpi-value" style="font-size:16px">${val}</div><div class="kpi-foot">${sub}</div></div>`).join('')}</div><div style="height:13px"></div><div class="split">${card(`${section('연구 폐쇄루프 진행 단계','상태 표시는 UX 시연용')}<div class="progress-list">${phases.map(([t,s,status,cls],i)=>`<div class="progress-row"><div class="step-index">${i+1}</div><div><div class="step-title">${t}</div><div class="step-sub">${s}</div></div>${pill(status,cls)}</div>`).join('')}</div>`)}<div class="gap12">${card(`${section('시장별 데이터 근거')}${markets.map(([k,n])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><b style="font-size:11px">${n}</b>${pill('커버리지 미확인','warn')}</div>`).join('')}<p class="mini-text" style="margin-top:12px">실제 연도별 데이터 커버리지와 결측 원장은 앱 API에 연결된 후에만 표시해야 해.</p>`)}${card(`${section('실수익성 승격 기준')}${['수수료·세금·스프레드·슬리피지','선물 펀딩·지연·유동성·부분체결','실제 OOS·Walk-Forward·표본 충족','Paper 원장과 거래일지 일치'].map(x=>`<div class="row" style="margin:11px 0">${icon('shield')}<span class="mini-text">${x}</span></div>`).join('')}<div class="demo-alert">검증 완료율이나 수익률을 임의로 계산하지 않았어.</div>`)}</div></div>${footer()}`;}
function auto(){let goal=escaped(st.goal);let sampleTarget=st.goal==='5'?'5%':`${goal}%`;return `${header('실자동매매 · 운영 설정 미리보기','수익 목표는 사용자가 자유롭게 설정하고, 달성 시 행동은 별도로 지정하는 구조야. 현재 설정은 이 화면에서만 변경되는 시연값이야.','LIVE AUTOMATION',pill('LIVE 실행 절대 없음','red'))}<div class="demo-alert" style="margin-bottom:14px"><b>안전 경계:</b> 이 화면은 코드나 서버 설정을 변경하지 않아. 전략 신호, Risk, Worker, 실주문, 텔레그램 발송 모두 비활성 시연 상태야.</div><div class="split">${card(`${section('원하는 수익 목표·운용 규칙','예시 설정') }<div class="form-grid"><div class="field"><label for="goalInput">일일 희망 목표 수익률 (%)</label><input type="number" id="goalInput" min="0.1" step="0.1" value="${goal}" placeholder="예: 3, 5, 100"><span class="mini-text">3%·5%·100% 등 입력 가능. 수익 보장은 아님.</span></div><div class="field"><label for="goalAction">목표 도달 시 행동</label><select id="goalAction"><option value="pause" ${st.goalAction==='pause'?'selected':''}>신규 진입 정지</option><option value="notify" ${st.goalAction==='notify'?'selected':''}>알림만 받기</option><option value="close" ${st.goalAction==='close'?'selected':''}>청산 검토·신규 진입 정지</option></select><span class="mini-text">실제 청산은 별도 위험검사와 승인 필요</span></div><div class="field"><label for="stopMode">손절 설정 방식</label><select id="stopMode"><option value="strategy" ${st.stop==='strategy'?'selected':''}>전략별 손절 적용</option><option value="manual" ${st.stop==='manual'?'selected':''}>사용자 직접 입력(추후 연동)</option></select></div><div class="field"><label for="takeMode">익절 설정 방식</label><select id="takeMode"><option value="strategy" ${st.take==='strategy'?'selected':''}>전략별 익절 적용</option><option value="manual" ${st.take==='manual'?'selected':''}>사용자 직접 입력(추후 연동)</option></select></div></div><div class="line"></div><div class="section-title"><h2>시장별 자본 · 거래 방향</h2>${pill('관리자 설정 예시','blue')}</div><div class="market-tiles">${[['국내주식','₩1,000,000','매수·보유분 매도'],['미국주식','₩1,000,000','매수·보유분 매도'],['코인현물','₩1,000,000','구매·판매'],['코인선물','₩1,000,000','LONG·SHORT / 격리 최대 7x']].map(([m,c,d])=>`<div class="market-tile"><div class="market-title">${m}</div><div style="font-size:13px;font-weight:900;margin:7px 0">${c}</div><div class="market-sub">${d}</div></div>`).join('')}</div><div class="line"></div><div class="row between" style="flex-wrap:wrap"><p class="mini-text">목표 달성 시 행동은 계좌 전체 상태와 Risk 정책을 함께 검증해야 해.</p><button class="btn primary" data-action="saveGoal">설정 미리보기 적용 ${icon('arrow')}</button></div>`)}<div class="gap12">${card(`${section('시연 설정 요약','실제 저장되지 않음') }<div class="vstack"><div class="row between"><span class="mini-text">일일 목표</span><strong class="blue" style="font-size:21px">${sampleTarget}</strong></div><div class="row between"><span class="mini-text">목표 도달 행동</span><b style="font-size:11px">${{pause:'신규 진입 정지',notify:'알림만',close:'청산 검토'}[st.goalAction]}</b></div><div class="row between"><span class="mini-text">전략 모드</span><b style="font-size:11px">S등급만</b></div><div class="row between"><span class="mini-text">실주문 상태</span>${pill('차단','red')}</div><div class="row between"><span class="mini-text">주문·취소·정정</span><b style="font-size:11px">0건 (시연)</b></div></div>`)}${card(`${section('운영 활성화 선결 조건')}${[['공개 4시장 실제 시세','신선도·시점·거래소 확인'],['신호 전달','Producer → Handoff → Risk → Worker'],['안전 검증','중복 주문·잔액·레버리지 제한'],['주문 이후','실제 체결 → 일지 → 개인 텔레그램']].map(([t,s],i)=>`<div class="progress-row" style="margin:10px 0"><span class="step-index">${i+1}</span><div><b style="font-size:11px">${t}</b><p class="mini-text">${s}</p></div>${pill('실증 필요','warn')}</div>`).join('')}`)}${card(`${section('실제 거래 관련 안내')}<div class="empty-note">희망 수익률은 <b>목표값</b>이지 달성 보장이 아니야. 손절·익절은 위험 관리 규칙과 충돌하지 않도록 독립 설정과 승인 절차가 필요해.</div>`)}</div></div>${footer()}`;}
function paper(){let isAuto=st.paperMode==='auto';return `${header('자동·수동 모의매매','실거래와 분리된 가상 원장을 이용하는 모의매매 UI 구조야. 실제 가상 체결은 발생하지 않아.','PAPER TRADING',pill('Paper 시연만','blue'))}<div class="row between" style="margin-bottom:12px;flex-wrap:wrap">${selectButtons('paperMode',[['auto','자동모의매매'],['manual','수동모의매매']],st.paperMode)}${pill('실계좌 원장과 완전 분리','green')}</div><div class="cols4">${markets.map(([key,label])=>`<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value" style="font-size:17px">₩1,000,000</div><div class="kpi-foot">모드별 초기 가상자본 예시</div></div>`).join('')}</div><div style="height:14px"></div><div class="split">${card(`${section(isAuto?'자동모의매매 설정':'수동모의매매 설정','시연 전용') }<div class="status-rail"><div><div class="mini-text">연속 손실 중단</div><b class="small-title green">사용 안 함</b></div><div><div class="mini-text">계좌 자본</div><b class="small-title">모드별 400만원</b></div><div><div class="mini-text">선물 레버리지</div><b class="small-title">${isAuto?'7x 고정':escaped(st.manualLev)+'x 선택'}</b></div></div><div class="line"></div>${isAuto?`<p class="note">자동모의 선물은 고정 격리 7x. 연구 근거와 위험 검사를 만족해야 가상 진입을 허용하는 구조야.</p>`:`<div class="field"><label for="manualLev">수동모의 선물 레버리지 (1~125x)</label><input id="manualLev" type="number" min="1" max="125" step="1" value="${escaped(st.manualLev)}"></div><p class="note" style="margin-top:10px">125x는 극단적으로 높은 위험을 가정하는 시뮬레이션 선택값이야.</p>`}<div class="line"></div>${section('가상 거래 결과 분석') }<p class="note">각 거래의 수익·손실 원인, 진입 근거, 실제 종료 근거, 체결 비용을 분리해서 일지에 기록할 수 있도록 구성했어.</p><div class="empty-note" style="margin-top:10px">모의 체결·손익 기록 없음. 실제 근거 없이 성과 그래프를 생성하지 않아.</div>`)}<div class="gap12">${card(`${section('잔액 소진 시 규칙','설계 제안')}${[['①','가상 잔액이 0 이하','신규 진입 자동 차단'],['②','실패 원인 기록','비용·레버리지·전략 분석'],['③','새 회차 시작','사용자 승인 후 초기 가상자금 재설정']].map(([n,t,s])=>`<div class="progress-row" style="margin:11px 0"><span class="step-index">${n}</span><div><b class="small-title">${t}</b><p class="mini-text">${s}</p></div></div>`).join('')}<div class="demo-alert">실제 코드에 전부 적용됐다는 의미가 아니라, 화면 설계와 동작 기준의 예시야.</div>`)}${card(`${section('Research → Paper 연결')}${pill('진짜 OOS 증거 필요','warn')}<p class="mini-text" style="margin-top:10px">검증되지 않은 전략을 수익성 PASS로 표시하거나 실제 가상 체결 내역을 만들어내지 않아.</p>`)}</div></div>${footer()}`;}
function portfolio(){return `${header('보유종목 · 포트폴리오','주식과 코인, 실거래와 모의매매 자산의 출처를 명확히 구분하는 화면이야. 프리뷰에서는 계좌를 조회하지 않아.','PORTFOLIO',pill('개인정보 미연결','blue'))}<div class="cols3">${[['총 평가금액','확인 전','실계좌 API 조회 필요'],['평가 손익','확인 전','기존 보유분 포함'],['자동매매 보유','확인 전','실제 Auto 체결만 소유로 인정']].map(([t,v,s])=>`<div class="card kpi"><div class="kpi-label">${t}</div><div class="kpi-value">${v}</div><div class="kpi-foot">${s}</div></div>`).join('')}</div><div style="height:14px"></div>${card(`${section('보유종목 목록','실제 조회 결과가 없으면 비워 둠')}<div class="table-scroll"><table class="data-table"><thead><tr><th>시장</th><th>종목</th><th>수량</th><th>평균단가</th><th>평가손익</th><th>출처</th></tr></thead><tbody><tr><td colspan="6" style="padding:35px;text-align:center;color:var(--muted)">프리뷰에서는 보유내역을 조회하지 않아. 표시할 실계좌 데이터가 없어.</td></tr></tbody></table></div>`)}<div style="height:14px"></div>${card(`${section('실계좌 보유분 보호') }<p class="note">기존 수동 보유종목은 MANUAL로 유지하고, 실제 자동체결에 근거가 있는 수량만 AUTO 소유로 구분해야 해. 출처가 불명확한 보유분을 자동매매가 임의 청산해서는 안 돼.</p>`)}${footer()}`;}
function journal(){return `${header('매매일지 · 거래 원인 분석','실거래/자동모의/수동모의의 기록을 구분하고, 수익이나 손실이 발생한 근거를 분석하도록 만든 화면이야.','TRADE JOURNAL',pill('원장 연동 필요','warn'))}<div class="cols3">${[['실거래 내역','미조회','실주문 체결 확인 전'],['모의 거래 내역','미조회','가상원장 확인 전'],['수익 기여 요인','분석 대기','거래별 근거 연동 필요']].map(([a,b,c])=>`<div class="card kpi"><div class="kpi-label">${a}</div><div class="kpi-value">${b}</div><div class="kpi-foot">${c}</div></div>`).join('')}</div><div style="height:14px"></div><div class="split">${card(`${section('일지 테이블','체결 증빙이 있어야 표시')}<div class="table-scroll"><table class="data-table"><thead><tr><th>거래시각</th><th>시장·종목</th><th>진입/종료</th><th>순손익</th><th>원인 태그</th></tr></thead><tbody><tr><td colspan="5" style="text-align:center;padding:34px;color:var(--muted)">실체결·가상원장 데이터 미연결. 거래를 임의 생성하지 않았어.</td></tr></tbody></table></div>`)}${card(`${section('원인 분석 항목','실제 거래부터 생성')}${[['진입 시점','RVOL·CVD·호가·추세 등 검증된 신호'],['수익 발생','익절 조건, 유리한 체결, 추세 지속'],['손실 발생','손절, 갭, 슬리피지, 공급원 지연'],['총비용','수수료·세금·환율·선물 펀딩']].map(([t,s])=>`<div style="margin:13px 0"><b class="small-title">${t}</b><p class="mini-text">${s}</p></div>`).join('')}`)}</div>${footer()}`;}
function account(){return `${header('연결된 계좌와 제공자','실제 계좌를 조회하지 않고 연결 확인 전 상태로 표시해. 잔액·체결내역을 임의 생성하지 않아.','ACCOUNT / PROVIDERS',pill('연결 상태 미조회','warn'))}<div class="cols3">${[['전체 자산','미확인','계좌 접근 없음'],['주문 가능 금액','미확인','개인 API 미사용'],['미체결 주문','미확인','실주문 조회 없음']].map(([t,v,s])=>`<div class="card kpi"><div class="kpi-label">${t}</div><div class="kpi-value">${v}</div><div class="kpi-foot">${s}</div></div>`).join('')}</div><div style="height:14px"></div>${card(`${section('4시장 공급자 연결','실제 연결 상태 주장하지 않음')}<div class="cols2">${[['Toss','국내·미국주식'],['Kiwoom','국내주식'],['Upbit','코인현물'],['Bitget','코인선물']].map(([name,desc])=>`<div class="provider"><div class="avatar">${name.slice(0,1)}</div><div class="grow"><b>${name}</b><small>${desc}</small></div>${pill('프리뷰 미조회','warn')}</div>`).join('')}</div>`)}<div style="height:14px"></div>${card(`${section('안전한 사용자 화면') }<p class="note">접속 토큰, API 키, 환경변수, 회원 식별정보를 프리뷰에 표시하지 않아. 실사용 앱에서는 유효한 권한을 가진 회원만 자신의 잔액과 보유종목을 읽도록 유지해야 해.</p>`)}${footer()}`;}
function settings(){return `${header('설정과 UI Builder','코덱이 만든 14화면 UI Builder의 실제 구현 범위와 새 디자인 테마를 한곳에서 확인할 수 있도록 재구성했어.','DESIGN SYSTEM',pill('UI 적용 실험','blue'))}<div class="split">${card(`${section('모양 설정','프리뷰에만 반영')}<div class="form-grid"><div class="field"><label>화면 테마</label><div class="segmented"><button data-action="theme" data-value="light" class="${st.theme==='light'?'active':''}">밝게</button><button data-action="theme" data-value="dark" class="${st.theme==='dark'?'active':''}">어둡게</button></div></div><div class="field"><label>기기 레이아웃</label>${selectButtons('device',[['auto','자동'],['desktop','PC'],['tablet','태블릿'],['mobile','모바일']],st.device)}</div></div><div class="line"></div>${section('UI Builder 구성 영역','현재 제품 코드의 실제 기능') }<div class="sample-series">${['14개 페이지 ID 정의','JSON 입력·검증','PC·모바일 별도 설정','Draft·Preview·Active','버전 기록·롤백','잘못된 값 차단'].map(x=>`<span>${x}</span>`).join('')}</div><div class="demo-alert" style="margin-top:13px"><b>남은 구현:</b> 일반 14개 화면에서 Builder 블록 순서·숨김·크기 설정을 실제 컴포넌트 배치에 적용하는 기능은 아직 완전하지 않아. 단순 레이아웃 메타데이터 관리와 시각적 적용을 구분해야 해.</div>`)}<div class="gap12">${card(`${section('UI 개편 작업 상태','GitHub 기록 기준')}${[['공통 반응형 기반','병합됨','green'],['기능형 UI vNext','Draft 상태','warn'],['프리뷰 최신 버전 게시','승인 대기','warn'],['실제 로그인·계좌 경로','실사용 검증 필요','warn']].map(([a,b,c])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><b style="font-size:11px">${a}</b>${pill(b,c)}</div>`).join('')}`)}${card(`${section('프리뷰 보안 규칙') }<p class="note">외부 API 호출, 로그인, 주문/취소/정정, 이체, DB 변경, PM2 배포 없이 정적 파일만으로 동작해. 이 파일의 브라우저 내 상태도 저장하지 않아.</p>`)}</div></div>${footer()}`;}
function footer(){return `<div class="footer-note">UI vNext 인터랙티브 시안 · 샘플 캔들/화면 정보만 사용 · 실제 계좌·시세·주문/체결 API와 연결되지 않음 · Replit 미사용</div>`;}
const pageRender={home,scanner,chart,research,auto,paper,portfolio,journal,account,settings};
function renderNav(){let mainNav=routes.filter(r=>!['settings'].includes(r[0]));$('#sidebar').innerHTML=`<div class="brand"><div class="brand-logo">⌁</div><div><div class="brand-main">지식정보</div><div class="brand-sub">INVESTMENT WORKSPACE</div></div></div><div class="side-caption">WORKSPACE</div><div class="side-nav">${mainNav.map(([key,title,ic])=>`<button class="nav-btn ${st.page===key?'active':''}" data-action="goto" data-target="${key}">${icon(ic)} ${title}${st.page===key?'<span class="nav-arrow">›</span>':''}</button>`).join('')}</div><div class="sidebar-bottom"><div class="side-nav"><button class="nav-btn ${st.page==='settings'?'active':''}" data-action="goto" data-target="settings">${icon('settings')} 설정·UI Builder</button></div><div class="connection"><span class="dot"></span><div><b style="font-size:11px">디자인 검토 모드</b><br>실데이터·실거래 연결 없음</div></div></div>`;
let btm=[['home','홈','home'],['scanner','검색','scan'],['chart','차트','chart'],['auto','매매','robot'],['more','더 보기','grid']];$('#mobileNav').innerHTML=btm.map(([k,name,ic])=>`<button class="${st.page===k||(k==='more'&&!btm.some(x=>x[0]===st.page))?'active':''}" data-action="${k==='more'?'more':'goto'}" data-target="${k}">${icon(ic)}<span>${name}</span></button>`).join('');
$('#pageTopTitle').textContent=routes.find(x=>x[0]===st.page)?.[1]??'홈';}
let chartInfo=null;
function graph(canvas){const ctx=canvas.getContext('2d');if(!ctx)return;let rect=canvas.getBoundingClientRect();let W=Math.max(180,rect.width),H=Math.max(160,rect.height);const dpr=window.devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
let dark=st.theme==='dark',grid=dark?'#2a3a50':'#e8eef7',ink=dark?'#95a8c1':'#73849e',bull=dark?'#45cb9e':'#1d9a78',bear=dark?'#f07890':'#e06979',ma=dark?'#79a8ff':'#437ee8',vwap='#dfaa43',space={left:18,right:56,top:27,bottom:st.volume?44:19},PW=W-space.left-space.right,PH=H-space.top-space.bottom;ctx.clearRect(0,0,W,H);ctx.font='10px system-ui';let seed=st.tf==='1분'?41:st.tf==='5분'?88:st.tf==='15분'?105:st.tf==='1시간'?194:245;let rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};let N=W<350?38:W<650?55:76;let data=[];let base=52600;for(let i=0;i<N;i++){let raw=base+Math.sin(i/7)*580+Math.cos(i/19)*750+(rand()-.5)*440;let o=i===0?raw:(data[i-1].c);let c=raw+(rand()-.5)*160;let hi=Math.max(o,c)+rand()*260,lo=Math.min(o,c)-rand()*250;data.push({o,c,h:hi,l:lo,v:50+rand()*130});}
let low=Math.min(...data.map(x=>x.l))-120,high=Math.max(...data.map(x=>x.h))+150;let yy=p=>space.top+(high-p)/(high-low)*PH;let xx=i=>space.left+(i+.5)*PW/N;ctx.lineWidth=1;ctx.textAlign='left';ctx.strokeStyle=grid;for(let j=0;j<5;j++){let y=space.top+j*PH/4;ctx.beginPath();ctx.moveTo(space.left,y);ctx.lineTo(W-12,y);ctx.stroke();ctx.fillStyle=ink;ctx.fillText(Math.round(high-(high-low)*j/4).toLocaleString('ko-KR'),W-space.right+6,y-3);}
if(st.volume){let vTop=H-34,vMax=Math.max(...data.map(x=>x.v));data.forEach((x,i)=>{ctx.fillStyle=x.c>=x.o?(dark?'#194c47':'#d4efe6'):(dark?'#5b2934':'#f8dfe5');let vh=x.v/vMax*29;ctx.fillRect(xx(i)-2.6,vTop+30-vh,5.2,vh);});}
const candleW=Math.max(2.5,Math.min(9,PW/N*.6));data.forEach((a,i)=>{let x=xx(i),c=a.c>=a.o?bull:bear;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,yy(a.h));ctx.lineTo(x,yy(a.l));ctx.stroke();let y=Math.min(yy(a.o),yy(a.c)),h=Math.max(1.5,Math.abs(yy(a.o)-yy(a.c)));ctx.fillRect(x-candleW/2,y,candleW,h);});
if(st.ma){ctx.strokeStyle=ma;ctx.lineWidth=2;ctx.beginPath();data.forEach((a,i)=>{let moving=data.slice(Math.max(0,i-12),i+1).reduce((acc,k)=>acc+k.c,0)/Math.min(13,i+1);if(i===0)ctx.moveTo(xx(i),yy(moving));else ctx.lineTo(xx(i),yy(moving));});ctx.stroke();}
if(st.vwap){ctx.strokeStyle=vwap;ctx.lineWidth=1.6;ctx.setLineDash([4,4]);ctx.beginPath();let num=0,den=0;data.forEach((a,i)=>{num+=(a.h+a.l+a.c)/3*a.v;den+=a.v;if(i===0)ctx.moveTo(xx(i),yy(num/den));else ctx.lineTo(xx(i),yy(num/den));});ctx.stroke();ctx.setLineDash([]);}
if(st.chartX!==null){let i=Math.min(N-1,Math.max(0,Math.floor(st.chartX*N)));let x=xx(i);ctx.save();ctx.strokeStyle=ink;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(x,space.top);ctx.lineTo(x,H-12);ctx.stroke();ctx.restore();const t=$('#hoverValue');if(t)t.textContent=`예시 ${i+1}봉 | O ${Math.round(data[i].o).toLocaleString()} · C ${Math.round(data[i].c).toLocaleString()}`;}
chartInfo={canvas,data};}
function renderGraphs(){document.querySelectorAll('.sample-canvas').forEach(graph)}
function render(){renderNav();$('#page').innerHTML=(pageRender[st.page]||home)();document.body.dataset.theme=st.theme;$('#deviceShell').dataset.device=st.device;$('#deviceControls').querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===st.device));$('#themeBtn').textContent=st.theme==='light'?'◐ 다크 모드':'☼ 라이트 모드';renderGraphs();}
function goto(key){if(!pageRender[key])return;st.page=key;closeMenu();render();$('#viewportArea').scrollTo({top:0});try{location.hash=key}catch(e){}}
function theme(val){st.theme=val;render();}
function notify(m){let t=$('#toast');t.textContent=m;t.classList.add('visible');clearTimeout(notify.timeout);notify.timeout=setTimeout(()=>t.classList.remove('visible'),3400);}
function more(){let sheet=$('#sheet');sheet.innerHTML=`<div class="sheet-head"><b style="font-size:14px">모든 메뉴</b><button class="btn" data-action="closeMenu" aria-label="닫기">${icon('close')}</button></div><p class="mini-text" style="margin-bottom:14px">샘플 데이터만 사용 · 실제 거래·계좌 API 비연결</p><div class="sheet-grid">${routes.map(([key,title,ic])=>`<button class="sheet-link" data-action="goto" data-target="${key}">${icon(ic)}${title}</button>`).join('')}</div>`;$('#overlay').classList.add('open');}
function closeMenu(){$('#overlay').classList.remove('open');}
function fieldChange(field,value){if(field==='tf'){st.tf=value;render();return}if(field==='market'){st.market=value;st.marketFilter='';render();return}if(field==='device'){st.device=value;render();return}if(field==='paperMode'){st.paperMode=value;render();return}}
function validateGoal(){const n=Number(st.goal);if(!Number.isFinite(n)||n<=0){notify('일일 희망 목표는 0보다 큰 숫자를 입력해야 해.');return false}return true}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let action=el.dataset.action;let value=el.dataset.value;switch(action){case'goto':goto(el.dataset.target);break;case'more':more();break;case'closeMenu':closeMenu();break;case'set':fieldChange(el.dataset.field,value);break;case'theme':theme(value);break;case'chartSymbol':st.chartSymbol=el.dataset.symbol+' · 예시';st.chartMarket=el.dataset.market;goto('chart');break;case'tradePreview':notify(`${el.dataset.side==='buy'?'매수':'매도'} 화면 시연만 가능해. 주문·계좌 API 요청은 수행하지 않아.`);break;case'notify':notify('알림 UI 시연용 화면이야. 실제 텔레그램 메시지를 발송하지 않아.');break;case'saveGoal':if(validateGoal())notify(`일일 희망 목표 ${st.goal}% 시연값을 화면에 반영했어. 서버에는 저장하지 않았어.`);break;}});
document.addEventListener('input',e=>{if(e.target.id==='goalInput'){st.goal=e.target.value;const v=document.querySelector('.blue[style*="font-size:21px"]');if(v)v.textContent=st.goal+'%';}if(e.target.id==='searchSymbol'){st.marketFilter=e.target.value;/* Re-render only list on committed search to avoid focus jumping. */}if(e.target.id==='manualLev'){let n=Math.max(1,Math.min(125,Math.round(Number(e.target.value)||1)));st.manualLev=String(n);}});
document.addEventListener('change',e=>{if(e.target.id==='goalAction')st.goalAction=e.target.value;if(e.target.id==='stopMode')st.stop=e.target.value;if(e.target.id==='takeMode')st.take=e.target.value;if(e.target.id==='manualLev'){st.manualLev=String(Math.min(125,Math.max(1,Math.round(Number(e.target.value)||1))));render();}if(e.target.type==='checkbox'&&e.target.dataset.field){st[e.target.dataset.field]=e.target.checked;renderGraphs();}if(e.target.id==='searchSymbol'){st.marketFilter=e.target.value;render();}});
document.querySelector('#deviceControls').addEventListener('click',e=>{let el=e.target.closest('[data-device]');if(el){st.device=el.dataset.device;render();}});
$('#themeBtn').addEventListener('click',()=>theme(st.theme==='light'?'dark':'light'));
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.addEventListener('mousemove',e=>{if(!e.target.matches('.sample-canvas'))return;let b=e.target.getBoundingClientRect();st.chartX=Math.min(1,Math.max(0,(e.clientX-b.left-16)/Math.max(1,b.width-68)));renderGraphs();});
document.addEventListener('mouseout',e=>{if(!e.target.matches('.sample-canvas'))return;st.chartX=null;const t=$('#hoverValue');if(t)t.textContent='시연 가격 · 실제 시세 아님';renderGraphs();});
window.addEventListener('resize',()=>{renderGraphs();});
new ResizeObserver(()=>renderGraphs()).observe($('#deviceShell'));
let initial=(location.hash||'').replace(/^#/,'').replace(/^\//,'');if(pageRender[initial])st.page=initial;
window.addEventListener('hashchange',()=>{let k=location.hash.replace(/^#/,'').replace(/^\//,'');if(pageRender[k]&&k!==st.page){st.page=k;render();}});
render();
</script>
</body>
</html>
